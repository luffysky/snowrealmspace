# 微行動 · 廚房與飲食。兩分鐘內做得完。
- id: ma-kitchen-01
  text: 倒一杯水放在手邊。
  tags: [kitchen]
- id: ma-kitchen-02
  text: 用抹布把流理臺擦過一遍。
  tags: [kitchen]
- id: ma-kitchen-03
  text: 洗掉水槽裡的那一個杯子。
  tags: [kitchen]
- id: ma-kitchen-04
  text: 檢查冰箱門邊，丟掉一罐過期的醬料。
  tags: [kitchen]
- id: ma-kitchen-05
  text: 把切好的水果擺進小盤子裡。
  tags: [kitchen]
- id: ma-kitchen-06
  text: 把餐桌上的雜物收到一旁，露出桌面。
  tags: [kitchen]
- id: ma-kitchen-07
  text: 幫馬克杯裡泡一杯熱茶。
  tags: [kitchen]
- id: ma-kitchen-08
  text: 把烘碗架上乾了的碗盤收回櫃子。
  tags: [kitchen]
- id: ma-kitchen-09
  text: 擦一擦爐台上濺到的油漬。
  tags: [kitchen]
- id: ma-kitchen-10
  text: 把調味料罐排成同一個方向。
  tags: [kitchen]
- id: ma-kitchen-11
  text: 抓一小把堅果放進小碟當點心。
  tags: [kitchen]
- id: ma-kitchen-12
  text: 把冰箱裡快軟掉的青菜挑出來準備先吃。
  tags: [kitchen]
- id: ma-kitchen-13
  text: 換上一條乾淨的擦手巾。
  tags: [kitchen]
- id: ma-kitchen-14
  text: 幫水壺裝滿水，放回爐上。
  tags: [kitchen]
- id: ma-kitchen-15
  text: 把餐具依種類分格放進抽屜。
  tags: [kitchen]
- id: ma-kitchen-16
  text: 倒掉垃圾桶裡的廚餘，換上新袋子。
  tags: [kitchen]
- id: ma-kitchen-17
  text: 切一片檸檬丟進水杯裡。
  tags: [kitchen]
- id: ma-kitchen-18
  text: 把砧板沖乾淨後立起來晾著。
  tags: [kitchen]
- id: ma-kitchen-19
  text: 擦亮水龍頭上的一圈水垢。
  tags: [kitchen]
- id: ma-kitchen-20
  text: 把零食用夾子封好收進櫃子。
  tags: [kitchen]
