# 微行動 · 心緒（續）。兩分鐘內做得完。
- id: ma-mind-06
  text: 慢慢做三次深呼吸，把吐氣拉得長一點。
  tags: [mind]
- id: ma-mind-07
  text: 想一個此刻想道謝的人。
  tags: [mind]
- id: ma-mind-08
  text: 說出身體現在最明顯的一個感覺。
  tags: [mind]
- id: ma-mind-09
  text: 對自己說一句平常會對朋友說的溫柔話。
  tags: [mind]
- id: ma-mind-10
  text: 找出這份情緒停在身體的哪一個位置。
  tags: [mind]
- id: ma-mind-11
  text: 承認現在的感受，讓它先待在那裡。
  tags: [mind]
- id: ma-mind-12
  text: 挑一件不必今天處理的事，先把它放下。
  tags: [mind]
- id: ma-mind-13
  text: 回想一個最近自己撐過去的時刻。
  tags: [mind]
- id: ma-mind-14
  text: 想像把肩上的重量，輕輕放到地上。
  tags: [mind]
- id: ma-mind-15
  text: 找出此刻還算好的一件小事。
  tags: [mind]
- id: ma-mind-16
  text: 在心裡描繪一個讓你安心的地方。
  tags: [mind]
- id: ma-mind-17
  text: 把一個飄過的念頭，想像成雲慢慢散開。
  tags: [mind]
- id: ma-mind-18
  text: 感覺雙腳踩在地上的重量。
  tags: [mind]
- id: ma-mind-19
  text: 說出三件現在其實不用擔心的事。
  tags: [mind]
- id: ma-mind-20
  text: 想一句想對某人說、卻還沒說出口的話。
  tags: [mind]
- id: ma-mind-21
  text: 回想上一次自己真心大笑的時候。
  tags: [mind]
- id: ma-mind-22
  text: 為一件今天已經完成的小事，在心裡點個頭。
  tags: [mind]
- id: ma-mind-23
  text: 用一個顏色，形容現在的心情。
  tags: [mind]
- id: ma-mind-24
  text: 想一件明天可以稍微期待的小事。
  tags: [mind]
- id: ma-mind-25
  text: 找出身體現在最緊繃的一個部位。
  tags: [mind]
