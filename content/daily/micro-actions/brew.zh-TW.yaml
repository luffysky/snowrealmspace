# 微行動 · 沖泡與飲品準備。兩分鐘內做得完。
- id: ma-brew-01
  text: 秤好咖啡粉，倒進濾杯裡鋪平。
  tags: [brew]
- id: ma-brew-02
  text: 燒水到將沸，先用細水柱把咖啡粉悶蒸一下。
  tags: [brew]
- id: ma-brew-03
  text: 拿手沖壺繞圈注水，看咖啡粉慢慢膨脹。
  tags: [brew]
- id: ma-brew-04
  text: 把茶葉放進壺裡，注入熱水等它舒展。
  tags: [brew]
- id: ma-brew-05
  text: 用濾網濾掉茶渣，倒出清澈的一杯茶。
  tags: [brew]
- id: ma-brew-06
  text: 撕開一包三合一沖劑，沖熱水攪到完全溶解。
  tags: [brew]
- id: ma-brew-07
  text: 磨一小把咖啡豆，聞磨開後散出的香氣。
  tags: [brew]
- id: ma-brew-08
  text: 壓下法式濾壓壺的桿子，把咖啡渣壓到底部。
  tags: [brew]
- id: ma-brew-09
  text: 把茶包放進杯裡，上下提放讓茶色暈開。
  tags: [brew]
- id: ma-brew-10
  text: 量好水溫，沖一杯不苦澀的綠茶。
  tags: [brew]
- id: ma-brew-11
  text: 用熱水溫一下杯子，再倒進剛沖好的咖啡。
  tags: [brew]
- id: ma-brew-12
  text: 沖泡一包燕麥片，攪拌到濃稠再靜置一下。
  tags: [brew]
- id: ma-brew-13
  text: 掀開摩卡壺，等咖啡從中間咕嚕冒上來。
  tags: [brew]
- id: ma-brew-14
  text: 把即溶咖啡舀進杯裡，先用少量熱水調成糊再沖開。
  tags: [brew]
- id: ma-brew-15
  text: 把咖啡粉倒進冷水瓶，搖勻後放進冰箱冷萃。
  tags: [brew]
- id: ma-brew-16
  text: 拿計時器計著，讓茶葉剛好泡三分鐘再倒。
  tags: [brew]
- id: ma-brew-17
  text: 沖一杯抹茶，用茶筅刷出細緻的泡沫。
  tags: [brew]
- id: ma-brew-18
  text: 把奶泡打綿密，緩緩倒進濃縮咖啡上。
  tags: [brew]
- id: ma-brew-19
  text: 沖泡一包玉米濃湯，攪散結塊後趁熱喝。
  tags: [brew]
- id: ma-brew-20
  text: 沖第二泡茶，比第一泡多等幾秒讓味道出來。
  tags: [brew]
