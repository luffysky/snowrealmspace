# 微行動：錢包與證件整理（兩分鐘內做得完，祈使句）
- id: ma-wallet-01
  text: 把錢包裡的發票全部抽出來
  tags: [wallet]
- id: ma-wallet-02
  text: 收好散在錢包夾層的零錢
  tags: [wallet]
- id: ma-wallet-03
  text: 把信用卡依常用順序排進卡夾
  tags: [wallet]
- id: ma-wallet-04
  text: 丟掉錢包裡皺掉的一張舊收據
  tags: [wallet]
- id: ma-wallet-05
  text: 確認身分證還在固定的卡位
  tags: [wallet]
- id: ma-wallet-06
  text: 把對獎後沒中的那疊發票丟掉
  tags: [wallet]
- id: ma-wallet-07
  text: 把會員卡集中放到同一個卡層
  tags: [wallet]
- id: ma-wallet-08
  text: 檢查一張信用卡背面的有效期限
  tags: [wallet]
- id: ma-wallet-09
  text: 把紙鈔的面額朝同一方向排好
  tags: [wallet]
- id: ma-wallet-10
  text: 抽出一張過期的優惠券丟掉
  tags: [wallet]
- id: ma-wallet-11
  text: 把健保卡放回錢包固定的卡位
  tags: [wallet]
- id: ma-wallet-12
  text: 清掉錢包裡已經用不到的名片
  tags: [wallet]
- id: ma-wallet-13
  text: 看一眼駕照上的效期日期
  tags: [wallet]
- id: ma-wallet-14
  text: 把零錢包裡的一元硬幣倒進存錢筒
  tags: [wallet]
- id: ma-wallet-15
  text: 把一張發票拍照存進手機再丟掉紙本
  tags: [wallet]
- id: ma-wallet-16
  text: 整理集點卡，丟掉已經蓋滿的那張
  tags: [wallet]
- id: ma-wallet-17
  text: 把備用鑰匙從錢包移到固定收納處
  tags: [wallet]
- id: ma-wallet-18
  text: 查一下悠遊卡餘額再放回卡位
  tags: [wallet]
- id: ma-wallet-19
  text: 把夾層裡的收據攤平整理成一疊
  tags: [wallet]
- id: ma-wallet-20
  text: 丟掉錢包裡看不清字跡的一張紙條
  tags: [wallet]
