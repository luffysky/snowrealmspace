# 微行動 · 玄關與鞋櫃。兩分鐘內做得完。
- id: ma-entry-01
  text: 把門口的鞋子擺正對齊。
  tags: [entryway]
- id: ma-entry-02
  text: 收好靠在牆邊的雨傘。
  tags: [entryway]
- id: ma-entry-03
  text: 把鑰匙掛回門邊的掛鉤。
  tags: [entryway]
- id: ma-entry-04
  text: 擦一下玄關桌上的灰塵。
  tags: [entryway]
- id: ma-entry-05
  text: 把散落的鞋子收進鞋櫃。
  tags: [entryway]
- id: ma-entry-06
  text: 把踩歪的踏墊擺正。
  tags: [entryway]
- id: ma-entry-07
  text: 把玄關的拖鞋頭朝外排好。
  tags: [entryway]
- id: ma-entry-08
  text: 清掉鞋櫃上堆積的廣告傳單。
  tags: [entryway]
- id: ma-entry-09
  text: 把濕掉的雨傘打開晾在門邊。
  tags: [entryway]
- id: ma-entry-10
  text: 把安全帽收到玄關固定的位置。
  tags: [entryway]
- id: ma-entry-11
  text: 擦一下大門的門把。
  tags: [entryway]
- id: ma-entry-12
  text: 把玄關桌上的零錢收進小盒子。
  tags: [entryway]
- id: ma-entry-13
  text: 把購物袋摺好放進玄關抽屜。
  tags: [entryway]
- id: ma-entry-14
  text: 把鞋櫃門關好對齊。
  tags: [entryway]
- id: ma-entry-15
  text: 掃一下地墊上的沙塵。
  tags: [entryway]
- id: ma-entry-16
  text: 把口罩補放到玄關的收納盒。
  tags: [entryway]
- id: ma-entry-17
  text: 把穿過的外套掛回玄關衣架。
  tags: [entryway]
- id: ma-entry-18
  text: 把門口的包裹搬進屋內。
  tags: [entryway]
- id: ma-entry-19
  text: 擺一雙隔天要穿的鞋在門口。
  tags: [entryway]
- id: ma-entry-20
  text: 把玄關燈的開關擦乾淨。
  tags: [entryway]
