# 微行動 · 採光與陽光。兩分鐘內做得完。
- id: ma-sun-01
  text: 拉開身邊最近的一扇窗簾。
  tags: [sun]
- id: ma-sun-02
  text: 走到窗邊，讓光落在你的臉上。
  tags: [sun]
- id: ma-sun-03
  text: 把窗戶打開一條縫，讓光和空氣進來。
  tags: [sun]
- id: ma-sun-04
  text: 找出房間裡最亮的那個角落，站進去。
  tags: [sun]
- id: ma-sun-05
  text: 把手掌攤開，讓陽光照在掌心。
  tags: [sun]
- id: ma-sun-06
  text: 把百葉窗轉開，讓光線灑進來。
  tags: [sun]
- id: ma-sun-07
  text: 坐到有自然光的位置待一會兒。
  tags: [sun]
- id: ma-sun-08
  text: 抬頭看看窗外此刻的天色。
  tags: [sun]
- id: ma-sun-09
  text: 把桌燈關掉，改用窗外的光來看東西。
  tags: [sun]
- id: ma-sun-10
  text: 讓陽光曬一下你的後頸和肩膀。
  tags: [sun]
- id: ma-sun-11
  text: 把擋住窗戶的東西挪開，讓光透進來。
  tags: [sun]
- id: ma-sun-12
  text: 觀察光線在地板上投出的形狀。
  tags: [sun]
- id: ma-sun-13
  text: 站到陽台或門邊，接住外面的光。
  tags: [sun]
- id: ma-sun-14
  text: 把一盆植物移到有陽光的地方。
  tags: [sun]
- id: ma-sun-15
  text: 閉上眼睛，感受光透過眼皮的暖度。
  tags: [sun]
- id: ma-sun-16
  text: 擦一下窗玻璃，讓光進來得更清楚。
  tags: [sun]
- id: ma-sun-17
  text: 把電腦搬到靠窗的位置繼續用。
  tags: [sun]
- id: ma-sun-18
  text: 讓晨光照進來，換掉室內的燈光。
  tags: [sun]
- id: ma-sun-19
  text: 把臉朝向光源，深呼吸一次。
  tags: [sun]
- id: ma-sun-20
  text: 找一面被光照亮的牆，看它的顏色。
  tags: [sun]
