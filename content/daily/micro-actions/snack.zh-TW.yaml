# 微行動 · 準備小點心。兩分鐘內做得完。
- id: ma-snack-01
  text: 切一小盤水果，放旁邊慢慢吃。
  tags: [snack]
- id: ma-snack-02
  text: 剝一顆橘子，把果肉一瓣瓣分開。
  tags: [snack]
- id: ma-snack-03
  text: 從罐子裡拿兩片餅乾，配一杯水。
  tags: [snack]
- id: ma-snack-04
  text: 用滾水沖一碗即食燕麥，蓋著燜一下。
  tags: [snack]
- id: ma-snack-05
  text: 烤一片吐司，抹上一層薄薄的奶油。
  tags: [snack]
- id: ma-snack-06
  text: 抓一小把堅果，倒進小碟子裡。
  tags: [snack]
- id: ma-snack-07
  text: 剝一根香蕉，切成幾段用叉子叉著吃。
  tags: [snack]
- id: ma-snack-08
  text: 撕開一包優格，撒點麥片在上面。
  tags: [snack]
- id: ma-snack-09
  text: 切幾片蘋果，泡進淡鹽水防止變色。
  tags: [snack]
- id: ma-snack-10
  text: 拿幾顆小番茄沖洗乾淨，裝在杯子裡。
  tags: [snack]
- id: ma-snack-11
  text: 掰一小塊黑巧克力，含在嘴裡讓它化開。
  tags: [snack]
- id: ma-snack-12
  text: 剝幾顆水煮蛋的殼，撒一點鹽。
  tags: [snack]
- id: ma-snack-13
  text: 舀一勺花生醬，塗在蘇打餅上。
  tags: [snack]
- id: ma-snack-14
  text: 洗一小串葡萄，一顆顆摘下來放盤子。
  tags: [snack]
- id: ma-snack-15
  text: 切半顆酪梨，用湯匙挖著吃。
  tags: [snack]
- id: ma-snack-16
  text: 拿幾片起司，配上幾片全麥餅乾。
  tags: [snack]
- id: ma-snack-17
  text: 微波一小碗爆米花，聽它啵啵作響。
  tags: [snack]
- id: ma-snack-18
  text: 切一小塊地瓜，蒸軟後撒點肉桂粉。
  tags: [snack]
- id: ma-snack-19
  text: 挖一球冰淇淋，放進小碗裡。
  tags: [snack]
- id: ma-snack-20
  text: 泡一杯溫牛奶，加一小匙蜂蜜攪勻。
  tags: [snack]
