# 微行動 · 照顧植物。兩分鐘內做得完。
- id: ma-plant-01
  text: 給乾了的盆土澆一點水，澆到底部滲出來。
  tags: [plantcare]
- id: ma-plant-02
  text: 用濕布把葉片上的灰塵輕輕擦乾淨。
  tags: [plantcare]
- id: ma-plant-03
  text: 把盆栽轉個方向，讓另一側朝向窗光。
  tags: [plantcare]
- id: ma-plant-04
  text: 摘掉幾片發黃的枯葉，丟進廚餘桶。
  tags: [plantcare]
- id: ma-plant-05
  text: 用叉子把板結的表土輕輕鬆開。
  tags: [plantcare]
- id: ma-plant-06
  text: 拿噴瓶對著葉子噴幾下水霧。
  tags: [plantcare]
- id: ma-plant-07
  text: 剪掉一段徒長的枝條，插進水杯裡扦插。
  tags: [plantcare]
- id: ma-plant-08
  text: 把托盤裡積的水倒掉，避免爛根。
  tags: [plantcare]
- id: ma-plant-09
  text: 檢查盆底排水孔有沒有被堵住，戳一戳疏通。
  tags: [plantcare]
- id: ma-plant-10
  text: 用手指探進土裡兩公分，感覺乾濕再決定澆不澆。
  tags: [plantcare]
- id: ma-plant-11
  text: 把爬藤的莖繞上支架，順一順方向。
  tags: [plantcare]
- id: ma-plant-12
  text: 挑掉葉背躲著的小蟲，用棉花棒沾水擦掉。
  tags: [plantcare]
- id: ma-plant-13
  text: 幫多肉補一點顆粒土，把露出的根埋回去。
  tags: [plantcare]
- id: ma-plant-14
  text: 把擠在一起的小苗分開一點，各自站穩。
  tags: [plantcare]
- id: ma-plant-15
  text: 在土面鋪一層鋪面石，壓住浮起的介質。
  tags: [plantcare]
- id: ma-plant-16
  text: 摘掉開謝的殘花，讓養分留給新芽。
  tags: [plantcare]
- id: ma-plant-17
  text: 把靠牆背光的那盆搬到窗邊亮一點的地方。
  tags: [plantcare]
- id: ma-plant-18
  text: 稀釋一點液肥，沿著盆邊淋一圈。
  tags: [plantcare]
- id: ma-plant-19
  text: 用軟毛刷把毛茸茸的葉面灰塵刷下來。
  tags: [plantcare]
- id: ma-plant-20
  text: 把歪向一邊的莖用小竹籤扶正綁好。
  tags: [plantcare]
