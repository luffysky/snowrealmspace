# 微行動 · 床鋪與寢具。兩分鐘內做得完。
- id: ma-bed-01
  text: 把被子攤開鋪平蓋回床上。
  tags: [bed]
- id: ma-bed-02
  text: 把枕頭拿起來拍鬆再放回床頭。
  tags: [bed]
- id: ma-bed-03
  text: 把床單被壓皺的地方拉平。
  tags: [bed]
- id: ma-bed-04
  text: 換上一個乾淨的枕套。
  tags: [bed]
- id: ma-bed-05
  text: 把滑到床尾的薄毯折好放床邊。
  tags: [bed]
- id: ma-bed-06
  text: 把床邊掉在地上的抱枕撿回床上。
  tags: [bed]
- id: ma-bed-07
  text: 把床頭櫃上的水杯拿去洗。
  tags: [bed]
- id: ma-bed-08
  text: 把枕頭沿床頭並排擺正。
  tags: [bed]
- id: ma-bed-09
  text: 把纏在一起的被套角落抖開拉直。
  tags: [bed]
- id: ma-bed-10
  text: 把床底探出來的拖鞋擺成一雙。
  tags: [bed]
- id: ma-bed-11
  text: 把床單四角塞進床墊底下。
  tags: [bed]
- id: ma-bed-12
  text: 把床上散落的衣物拿去籃子裡。
  tags: [bed]
- id: ma-bed-13
  text: 把冷氣被折成方塊放床尾。
  tags: [bed]
- id: ma-bed-14
  text: 把床頭燈上的灰塵擦一擦。
  tags: [bed]
- id: ma-bed-15
  text: 把枕頭翻到涼的那一面。
  tags: [bed]
- id: ma-bed-16
  text: 把床邊充電線繞好貼牆放。
  tags: [bed]
- id: ma-bed-17
  text: 把床頭櫃上的書疊成一落。
  tags: [bed]
- id: ma-bed-18
  text: 把床單上的頭髮用手撥掉。
  tags: [bed]
- id: ma-bed-19
  text: 把靠枕依大小前後排好。
  tags: [bed]
- id: ma-bed-20
  text: 把床墊保潔墊歪掉的一角拉正。
  tags: [bed]
