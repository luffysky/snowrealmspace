# 微行動 · 洗手與清潔。兩分鐘內做得完。
- id: ma-wash-01
  text: 打開水龍頭，把雙手仔細抹上肥皂搓洗。
  tags: [wash]
- id: ma-wash-02
  text: 搓洗時記得繞到指縫，一根根滑過去。
  tags: [wash]
- id: ma-wash-03
  text: 用指腹刷一刷另一隻手的指甲縫。
  tags: [wash]
- id: ma-wash-04
  text: 抓起桌上的空杯子，用清水沖洗一遍。
  tags: [wash]
- id: ma-wash-05
  text: 拿乾淨毛巾把洗好的手輕輕擦乾。
  tags: [wash]
- id: ma-wash-06
  text: 擠一點護手霜，抹勻在洗淨的手背上。
  tags: [wash]
- id: ma-wash-07
  text: 把洗手台旁的肥皂放回原本的皂盒。
  tags: [wash]
- id: ma-wash-08
  text: 沖洗手心後，翻過來把手背也沖一沖。
  tags: [wash]
- id: ma-wash-09
  text: 用刷子刷一刷馬克杯內壁的茶漬。
  tags: [wash]
- id: ma-wash-10
  text: 洗完手，把水龍頭轉緊到不再滴水。
  tags: [wash]
- id: ma-wash-11
  text: 換上一條乾淨的擦手巾掛回架上。
  tags: [wash]
- id: ma-wash-12
  text: 用溫水把手腕連同手掌一起沖洗。
  tags: [wash]
- id: ma-wash-13
  text: 把湯匙放到水流下，沖掉上面的殘漬。
  tags: [wash]
- id: ma-wash-14
  text: 搓出泡沫後，讓雙手互相摩擦到起熱。
  tags: [wash]
- id: ma-wash-15
  text: 拿棉花棒沾水，清一清指甲邊的縫隙。
  tags: [wash]
- id: ma-wash-16
  text: 把洗淨的杯子倒扣在瀝水架上晾著。
  tags: [wash]
- id: ma-wash-17
  text: 對著鏡子看一眼指尖，把它們洗乾淨。
  tags: [wash]
- id: ma-wash-18
  text: 沖掉手上最後一點泡沫，直到摸起來不滑。
  tags: [wash]
- id: ma-wash-19
  text: 用清水把小碟子的兩面都涮一遍。
  tags: [wash]
- id: ma-wash-20
  text: 擦乾手後，順手抹一抹指節之間的水珠。
  tags: [wash]
