# 微行動 · 抬頭看天。兩分鐘內做得完。
- id: ma-sky-01
  text: 抬起頭，找出天上最大的一朵雲，看它像什麼。
  tags: [skygaze]
- id: ma-sky-02
  text: 走到窗邊仰頭，看看今天的天空是什麼顏色。
  tags: [skygaze]
- id: ma-sky-03
  text: 抬頭盯著一朵雲，看它慢慢飄過屋頂。
  tags: [skygaze]
- id: ma-sky-04
  text: 仰起臉，找找天邊最亮的那一塊光。
  tags: [skygaze]
- id: ma-sky-05
  text: 夜裡抬頭，數一數看得見的三顆星星。
  tags: [skygaze]
- id: ma-sky-06
  text: 抬頭看月亮，判斷它今晚是圓是缺。
  tags: [skygaze]
- id: ma-sky-07
  text: 往上看，追蹤一隻飛過天空的鳥。
  tags: [skygaze]
- id: ma-sky-08
  text: 仰望天頂正中央，看那裡的藍有多深。
  tags: [skygaze]
- id: ma-sky-09
  text: 抬頭找出雲層之間露出的一道縫隙。
  tags: [skygaze]
- id: ma-sky-10
  text: 傍晚仰起頭，看夕陽把雲染成什麼色。
  tags: [skygaze]
- id: ma-sky-11
  text: 抬頭看一架飛機劃過，跟著它的尾跡看。
  tags: [skygaze]
- id: ma-sky-12
  text: 仰頭深吸一口氣，讓視線停在遠處的天際。
  tags: [skygaze]
- id: ma-sky-13
  text: 抬頭看看今天的雲是厚實還是稀薄。
  tags: [skygaze]
- id: ma-sky-14
  text: 往天上看，找出被陽光鑲了金邊的那朵雲。
  tags: [skygaze]
- id: ma-sky-15
  text: 抬頭注視一片天空，看它有沒有在變化。
  tags: [skygaze]
- id: ma-sky-16
  text: 仰頭看樹梢之上那一小片露出的天。
  tags: [skygaze]
- id: ma-sky-17
  text: 抬頭找找天上有沒有一道彩虹或光暈。
  tags: [skygaze]
- id: ma-sky-18
  text: 清晨抬頭，看天色從哪一邊亮起來。
  tags: [skygaze]
- id: ma-sky-19
  text: 仰望夜空，找出那顆一直不眨眼的行星。
  tags: [skygaze]
- id: ma-sky-20
  text: 抬頭看雲的移動方向，猜猜風往哪邊吹。
  tags: [skygaze]
