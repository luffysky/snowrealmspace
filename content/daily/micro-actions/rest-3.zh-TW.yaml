# 微行動 · 休息（第三批）。兩分鐘內做得完。
- id: ma-rest-26
  text: 找一個靠墊，墊在腰後。
  tags: [rest]
- id: ma-rest-27
  text: 慢慢眨幾下眼睛，讓眼睛濕潤一下。
  tags: [rest]
- id: ma-rest-28
  text: 把窗簾拉上，讓房間暗下來。
  tags: [rest]
- id: ma-rest-29
  text: 把手機調成靜音，收到看不到的地方。
  tags: [rest]
- id: ma-rest-30
  text: 把頭輕輕靠在手臂上，趴著歇一下。
  tags: [rest]
- id: ma-rest-31
  text: 把房間裡在響的東西關掉，讓耳朵靜下來。
  tags: [rest]
- id: ma-rest-32
  text: 把身體攤平躺成大字，放一分鐘。
  tags: [rest]
- id: ma-rest-33
  text: 把肩上的包或外套卸下來放好。
  tags: [rest]
- id: ma-rest-34
  text: 換上一雙鬆軟的室內拖鞋。
  tags: [rest]
- id: ma-rest-35
  text: 把腰上的皮帶或鬆緊帶放鬆一格。
  tags: [rest]
- id: ma-rest-36
  text: 幫自己戴上眼罩，隔開光線。
  tags: [rest]
- id: ma-rest-37
  text: 用溫熱的水袋敷一下肚子。
  tags: [rest]
- id: ma-rest-38
  text: 把電腦螢幕關掉，讓桌面暗下來。
  tags: [rest]
- id: ma-rest-39
  text: 坐下把雙腿往前伸直，鬆一鬆。
  tags: [rest]
- id: ma-rest-40
  text: 讓眼皮半闔，視線輕輕往下放。
  tags: [rest]
- id: ma-rest-41
  text: 把腳邊的暖器打開，讓腳暖起來。
  tags: [rest]
- id: ma-rest-42
  text: 把抱枕墊在膝蓋下，讓腿放鬆。
  tags: [rest]
- id: ma-rest-43
  text: 幫自己倒一杯溫水，擱在隨手可拿的地方。
  tags: [rest]
- id: ma-rest-44
  text: 把眼鏡取下來，讓眼睛歇一下。
  tags: [rest]
- id: ma-rest-45
  text: 讓雙手泡進一盆溫水裡片刻。
  tags: [rest]
