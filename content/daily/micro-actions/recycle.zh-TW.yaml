# 微行動 · 回收與分類。兩分鐘內做得完。
- id: ma-recycle-01
  text: 把喝完的寶特瓶壓扁丟進回收桶。
  tags: [recycle]
- id: ma-recycle-02
  text: 將紙箱拆開攤平靠牆疊放。
  tags: [recycle]
- id: ma-recycle-03
  text: 把桌上的廢紙集中投進紙類回收。
  tags: [recycle]
- id: ma-recycle-04
  text: 清空一個裝滿的垃圾桶並換上新袋。
  tags: [recycle]
- id: ma-recycle-05
  text: 把鋁罐沖一下水再放進金屬回收。
  tags: [recycle]
- id: ma-recycle-06
  text: 撕掉塑膠瓶身上的標籤分開丟。
  tags: [recycle]
- id: ma-recycle-07
  text: 把玻璃瓶單獨放到一個回收袋裡。
  tags: [recycle]
- id: ma-recycle-08
  text: 將堆在角落的廣告傳單捆起來回收。
  tags: [recycle]
- id: ma-recycle-09
  text: 把用完的電池收進電池回收盒。
  tags: [recycle]
- id: ma-recycle-10
  text: 沖洗一個油膩的塑膠餐盒再回收。
  tags: [recycle]
- id: ma-recycle-11
  text: 把廚房的廚餘倒進廚餘桶。
  tags: [recycle]
- id: ma-recycle-12
  text: 將回收桶提到門口準備收運。
  tags: [recycle]
- id: ma-recycle-13
  text: 把牛奶盒展開沖淨壓平回收。
  tags: [recycle]
- id: ma-recycle-14
  text: 挑出混在垃圾裡的可回收物放到對的桶。
  tags: [recycle]
- id: ma-recycle-15
  text: 把塑膠袋抖乾淨疊起來集中放。
  tags: [recycle]
- id: ma-recycle-16
  text: 將舊報紙折整齊綁成一疊。
  tags: [recycle]
- id: ma-recycle-17
  text: 把玻璃罐的金屬蓋轉下來分類。
  tags: [recycle]
- id: ma-recycle-18
  text: 清掉冰箱裡一樣過期的食材丟進廚餘。
  tags: [recycle]
- id: ma-recycle-19
  text: 把泡棉緩衝材集中裝進一個袋子。
  tags: [recycle]
- id: ma-recycle-20
  text: 將快遞紙袋的膠帶撕掉再回收紙材。
  tags: [recycle]
