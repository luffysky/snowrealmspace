# 微行動 · 學習（續）。查個詞、認個知識、換個新角度，兩分鐘做得完。
- id: ma-learn-04
  text: 查一個你一直唸錯的字，學會它正確的發音。
  tags: [learn]
- id: ma-learn-05
  text: 找出一個國家的首都，把它記下來。
  tags: [learn]
- id: ma-learn-06
  text: 打開地圖，認出一條你常經過卻叫不出名字的街。
  tags: [learn]
- id: ma-learn-07
  text: 查一種你今天吃到的食物，看它來自哪個地方。
  tags: [learn]
- id: ma-learn-08
  text: 查一個成語背後的典故由來。
  tags: [learn]
- id: ma-learn-09
  text: 學會用一種外語說「謝謝」，念出來一次。
  tags: [learn]
- id: ma-learn-10
  text: 查一種窗外看得到的雲，認出它的名字。
  tags: [learn]
- id: ma-learn-11
  text: 查一個你天天在用的符號，看它原本代表什麼。
  tags: [learn]
- id: ma-learn-12
  text: 查一種常見鳥類的名字，記住牠的一個特徵。
  tags: [learn]
- id: ma-learn-13
  text: 讀一則冷知識，再用自己的話講一次給自己聽。
  tags: [learn]
- id: ma-learn-14
  text: 學一個你沒用過的鍵盤快捷鍵，馬上按一次試試。
  tags: [learn]
- id: ma-learn-15
  text: 查你住的地名是怎麼來的。
  tags: [learn]
- id: ma-learn-16
  text: 看一段三十秒的教學短片，學會其中一個小動作。
  tags: [learn]
- id: ma-learn-17
  text: 查一個顏色的名字，例如「群青」是什麼樣的藍。
  tags: [learn]
- id: ma-learn-18
  text: 查歷史上的今天發生過的一件事。
  tags: [learn]
- id: ma-learn-19
  text: 讀一種樂器的發聲原理，看它怎麼發出聲音。
  tags: [learn]
- id: ma-learn-20
  text: 查一個單位換算，例如一海里等於幾公里。
  tags: [learn]
- id: ma-learn-21
  text: 學會分辨兩種長得很像的植物差在哪裡。
  tags: [learn]
- id: ma-learn-22
  text: 查一個你常買飲料的成分，認一種沒聽過的名字。
  tags: [learn]
- id: ma-learn-23
  text: 從時鐘上認一個你不熟的時區，算出那裡現在幾點。
  tags: [learn]
