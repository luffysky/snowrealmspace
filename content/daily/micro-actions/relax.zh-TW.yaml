# 微行動 · 放鬆小動作。兩分鐘內做得完。
- id: ma-relax-01
  text: 把緊握的雙手張開，讓手指自然攤平。
  tags: [relax]
- id: ma-relax-02
  text: 讓兩邊肩膀往下垂，遠離耳朵。
  tags: [relax]
- id: ma-relax-03
  text: 鬆開緊皺的眉頭，把眉心攤平。
  tags: [relax]
- id: ma-relax-04
  text: 轉動一下腳踝，順時針再逆時針各幾圈。
  tags: [relax]
- id: ma-relax-05
  text: 把咬緊的牙關放鬆，讓上下排牙齒分開。
  tags: [relax]
- id: ma-relax-06
  text: 甩一甩雙手手腕，抖掉手上的僵硬。
  tags: [relax]
- id: ma-relax-07
  text: 讓後腦勺往後靠，把頸部的力氣卸掉。
  tags: [relax]
- id: ma-relax-08
  text: 在椅子上把腳趾用力捲起，再全部放開。
  tags: [relax]
- id: ma-relax-09
  text: 鬆開夾緊的腋下，讓手臂離開身側一點。
  tags: [relax]
- id: ma-relax-10
  text: 把舌頭從上顎放下，讓口腔內完全鬆弛。
  tags: [relax]
- id: ma-relax-11
  text: 讓雙腿分開一些，把大腿的緊繃放掉。
  tags: [relax]
- id: ma-relax-12
  text: 輕輕晃動膝蓋，把腿部的僵硬搖鬆。
  tags: [relax]
- id: ma-relax-13
  text: 把手臂垂在身體兩側，像鐘擺一樣輕輕擺。
  tags: [relax]
- id: ma-relax-14
  text: 用一隻手捏揉另一隻手的虎口。
  tags: [relax]
- id: ma-relax-15
  text: 讓臀部坐穩椅面，感覺重量沉下去。
  tags: [relax]
- id: ma-relax-16
  text: 把腳掌平貼地面，感受腳底踏實的觸感。
  tags: [relax]
- id: ma-relax-17
  text: 鬆開緊縮的腹部，讓肚子自然凸出來。
  tags: [relax]
- id: ma-relax-18
  text: 左右輕輕轉動頭部，把脖子的卡緊鬆開。
  tags: [relax]
- id: ma-relax-19
  text: 用指尖輕壓太陽穴，畫圈按摩幾下。
  tags: [relax]
- id: ma-relax-20
  text: 把眉毛往上抬再放下，鬆開額頭的緊繃。
  tags: [relax]
