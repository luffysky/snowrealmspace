# 微行動 · 小獎勵與寵愛自己。兩分鐘內做得完。
- id: ma-treat-01
  text: 拿一塊喜歡的點心，慢慢地吃掉它。
  tags: [treat]
- id: ma-treat-02
  text: 泡一杯自己最愛的飲料，捧在手裡享受溫度。
  tags: [treat]
- id: ma-treat-03
  text: 對著鏡子裡的自己，真心稱讚一句今天做得好。
  tags: [treat]
- id: ma-treat-04
  text: 打開一集想看的影片，放心地看這兩分鐘。
  tags: [treat]
- id: ma-treat-05
  text: 挑一首喜歡的歌，戴上耳機好好聽完。
  tags: [treat]
- id: ma-treat-06
  text: 幫自己線上下單一杯想喝很久的飲料。
  tags: [treat]
- id: ma-treat-07
  text: 塗一點護手霜，順手按摩一下自己的手心。
  tags: [treat]
- id: ma-treat-08
  text: 抱一下身邊柔軟的抱枕或娃娃，貼著臉頰。
  tags: [treat]
- id: ma-treat-09
  text: 翻出手機裡最喜歡的一張照片，多看它幾眼。
  tags: [treat]
- id: ma-treat-10
  text: 含一顆喜歡的糖果，感受它在嘴裡化開。
  tags: [treat]
- id: ma-treat-11
  text: 對自己說一句謝謝你今天這麼努力。
  tags: [treat]
- id: ma-treat-12
  text: 把喜歡的香氛或精油打開，深深聞一下味道。
  tags: [treat]
- id: ma-treat-13
  text: 拿出珍藏捨不得吃的那塊巧克力，現在吃掉。
  tags: [treat]
- id: ma-treat-14
  text: 給自己沖一杯熱可可，捧著杯子暖一暖手。
  tags: [treat]
- id: ma-treat-15
  text: 換上最舒服的那雙襪子，讓腳被好好包著。
  tags: [treat]
- id: ma-treat-16
  text: 加購物車裡一直想要的那樣小東西，送給自己。
  tags: [treat]
- id: ma-treat-17
  text: 用喜歡的杯子裝水，讓喝水這件事變得講究一點。
  tags: [treat]
- id: ma-treat-18
  text: 拆開一直捨不得用的漂亮文具，今天開始用它。
  tags: [treat]
- id: ma-treat-19
  text: 找一段搞笑短片，讓自己放聲笑出來一次。
  tags: [treat]
- id: ma-treat-20
  text: 在心裡列出自己三個優點，好好認可這樣的你。
  tags: [treat]
