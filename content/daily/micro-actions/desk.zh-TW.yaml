# 微行動 · 整理桌面。兩分鐘內做得完。
- id: ma-desk-01
  text: 把桌上散落的筆通通收進筆筒。
  tags: [desk]
- id: ma-desk-02
  text: 拿抹布把鍵盤前方的桌面擦過一遍。
  tags: [desk]
- id: ma-desk-03
  text: 把喝完的空杯子拿去水槽。
  tags: [desk]
- id: ma-desk-04
  text: 將攤開的紙張疊整齊，放到桌面右上角。
  tags: [desk]
- id: ma-desk-05
  text: 把纏在一起的充電線繞好收攏。
  tags: [desk]
- id: ma-desk-06
  text: 撿起桌下掉落的物品，放回原位。
  tags: [desk]
- id: ma-desk-07
  text: 把用不到的便利貼撕下來丟進垃圾桶。
  tags: [desk]
- id: ma-desk-08
  text: 將滑鼠墊擺正，對齊桌緣。
  tags: [desk]
- id: ma-desk-09
  text: 把桌上的零食包裝袋收走丟掉。
  tags: [desk]
- id: ma-desk-10
  text: 擦一擦螢幕上的灰塵與指印。
  tags: [desk]
- id: ma-desk-11
  text: 把讀完的書闔上，直立放回書架或桌角。
  tags: [desk]
- id: ma-desk-12
  text: 將抽屜裡的文具依種類分格擺好。
  tags: [desk]
- id: ma-desk-13
  text: 把桌上多餘的杯墊疊起來收到一旁。
  tags: [desk]
- id: ma-desk-14
  text: 拔掉沒在用的 USB 裝置，收進收納盒。
  tags: [desk]
- id: ma-desk-15
  text: 把桌面上的迴紋針集中放進小盒子。
  tags: [desk]
- id: ma-desk-16
  text: 將椅子推正，讓它對齊桌子中線。
  tags: [desk]
- id: ma-desk-17
  text: 把貼在螢幕邊的舊紙條拿下來歸檔。
  tags: [desk]
- id: ma-desk-18
  text: 用小刷子掃掉鍵盤縫隙裡的碎屑。
  tags: [desk]
- id: ma-desk-19
  text: 把桌上的耳機掛回掛架或收進盒子。
  tags: [desk]
- id: ma-desk-20
  text: 將手邊的文件放進資料夾，露出乾淨桌面。
  tags: [desk]
