# 微行動 · 聯繫（續）。兩分鐘內傳出去。
- id: ma-connect-06
  text: 打個電話給家人，聊兩句就好。
  tags: [connect]
- id: ma-connect-07
  text: 傳一張此刻窗外的照片給朋友。
  tags: [connect]
- id: ma-connect-08
  text: 傳訊息告訴朋友你想起了一件你們的往事。
  tags: [connect]
- id: ma-connect-09
  text: 傳一則語音訊息代替打字。
  tags: [connect]
- id: ma-connect-10
  text: 約一個朋友挑個時間見面，先把日子敲定。
  tags: [connect]
- id: ma-connect-11
  text: 問候一位最近比較少聯絡的人。
  tags: [connect]
- id: ma-connect-12
  text: 把一首喜歡的歌分享給懂的人。
  tags: [connect]
- id: ma-connect-13
  text: 傳一則貼圖給正在聊天的對象。
  tags: [connect]
- id: ma-connect-14
  text: 對一位朋友的限時動態按個表情回應。
  tags: [connect]
- id: ma-connect-15
  text: 傳訊息告訴某人你平安到家了。
  tags: [connect]
- id: ma-connect-16
  text: 把一篇有用的文章轉給用得到的人。
  tags: [connect]
- id: ma-connect-17
  text: 傳一句晚安給重要的人。
  tags: [connect]
- id: ma-connect-18
  text: 找出一張舊照片，傳給照片裡的人。
  tags: [connect]
- id: ma-connect-19
  text: 恭喜一位最近有好消息的朋友。
  tags: [connect]
- id: ma-connect-20
  text: 主動關心一位最近安靜下來的朋友。
  tags: [connect]
- id: ma-connect-21
  text: 邀一個人一起吃頓飯。
  tags: [connect]
- id: ma-connect-22
  text: 把今天的一件好消息分享給家人。
  tags: [connect]
- id: ma-connect-23
  text: 傳訊息謝謝一位好久不見的朋友當年的幫忙。
  tags: [connect]
- id: ma-connect-24
  text: 傳訊息問候一位長輩最近過得如何。
  tags: [connect]
- id: ma-connect-25
  text: 傳訊息邀一位朋友視訊聊一下。
  tags: [connect]
