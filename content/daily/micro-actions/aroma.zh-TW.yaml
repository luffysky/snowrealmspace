# 微行動 · 香氣與嗅覺。兩分鐘內做得完。
- id: ma-aroma-01
  text: 泡一杯有香氣的茶，聞一下杯口的味道。
  tags: [aroma]
- id: ma-aroma-02
  text: 打開窗，深深聞一口外面的空氣。
  tags: [aroma]
- id: ma-aroma-03
  text: 拿起手邊的護手霜，聞一下它的味道。
  tags: [aroma]
- id: ma-aroma-04
  text: 剝一小片柑橘皮，湊近鼻子聞聞看。
  tags: [aroma]
- id: ma-aroma-05
  text: 走到廚房，聞一聞其中一罐香料的氣味。
  tags: [aroma]
- id: ma-aroma-06
  text: 沖一杯咖啡，先聞香再喝下第一口。
  tags: [aroma]
- id: ma-aroma-07
  text: 靠近一盆植物，聞聞葉子的清新氣味。
  tags: [aroma]
- id: ma-aroma-08
  text: 拿出一塊肥皂，聞一下它散發的味道。
  tags: [aroma]
- id: ma-aroma-09
  text: 翻開一本書，把鼻子貼近書頁聞紙張的氣味。
  tags: [aroma]
- id: ma-aroma-10
  text: 噴一下喜歡的香水在手腕，聞聞前調。
  tags: [aroma]
- id: ma-aroma-11
  text: 剛洗好的衣物拿到面前，聞一聞乾淨的味道。
  tags: [aroma]
- id: ma-aroma-12
  text: 點一根線香或香氛蠟燭，聞它升起的香氣。
  tags: [aroma]
- id: ma-aroma-13
  text: 揉一片薄荷或香草葉，聞指尖留下的氣味。
  tags: [aroma]
- id: ma-aroma-14
  text: 打開一罐果醬或蜂蜜，聞一下裡面的甜香。
  tags: [aroma]
- id: ma-aroma-15
  text: 走近木製家具，聞一聞木頭的氣味。
  tags: [aroma]
- id: ma-aroma-16
  text: 泡一碗熱湯，先靠近聞那股熱氣裡的香味。
  tags: [aroma]
- id: ma-aroma-17
  text: 拿起一顆蘋果，湊到鼻前聞它的果香。
  tags: [aroma]
- id: ma-aroma-18
  text: 打開洗髮精瓶蓋，聞一下它的香味。
  tags: [aroma]
- id: ma-aroma-19
  text: 站在雨後的窗邊，聞一聞潮濕泥土的氣味。
  tags: [aroma]
- id: ma-aroma-20
  text: 撕開一包茶包，先聞乾茶葉再放進杯裡。
  tags: [aroma]
