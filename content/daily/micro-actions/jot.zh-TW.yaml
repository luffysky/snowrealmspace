# 微行動 · 書寫與記錄。兩分鐘內做得完。
- id: ma-jot-01
  text: 寫下今天讓你會心一笑的一件小事。
  tags: [jot]
- id: ma-jot-02
  text: 列出接下來一小時想完成的三件事。
  tags: [jot]
- id: ma-jot-03
  text: 記下此刻窗外看到的三樣東西。
  tags: [jot]
- id: ma-jot-04
  text: 用一句話描述你現在的心情。
  tags: [jot]
- id: ma-jot-05
  text: 寫下一個你最近學到的新詞或新知識。
  tags: [jot]
- id: ma-jot-06
  text: 列出冰箱裡還剩下的三樣食材。
  tags: [jot]
- id: ma-jot-07
  text: 記下今天早餐吃了什麼。
  tags: [jot]
- id: ma-jot-08
  text: 寫下一位你今天想聯絡的朋友名字。
  tags: [jot]
- id: ma-jot-09
  text: 把此刻腦中盤旋的念頭原封不動寫成一行字。
  tags: [jot]
- id: ma-jot-10
  text: 列出這個週末想去的兩個地方。
  tags: [jot]
- id: ma-jot-11
  text: 寫下一本你想讀或正在讀的書名。
  tags: [jot]
- id: ma-jot-12
  text: 記下你最近聽到、想記住的一句話。
  tags: [jot]
- id: ma-jot-13
  text: 用三個形容詞描述今天的天氣。
  tags: [jot]
- id: ma-jot-14
  text: 寫下一件你已經完成、可以劃掉的事。
  tags: [jot]
- id: ma-jot-15
  text: 列出手邊桌上此刻放著的三件物品。
  tags: [jot]
- id: ma-jot-16
  text: 記下一個你想嘗試看看的新食譜名稱。
  tags: [jot]
- id: ma-jot-17
  text: 寫下一句想對明天的自己說的話。
  tags: [jot]
- id: ma-jot-18
  text: 列出今天喝了幾杯水，寫成一個數字。
  tags: [jot]
- id: ma-jot-19
  text: 記下一首現在腦中響起的歌。
  tags: [jot]
- id: ma-jot-20
  text: 寫下一個你好奇、想找答案的問題主題。
  tags: [jot]
