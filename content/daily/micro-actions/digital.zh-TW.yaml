# 微行動 · 數位整理。兩分鐘內做得完。
- id: ma-digital-01
  text: 刪掉手機裡三張不要的截圖。
  tags: [digital]
- id: ma-digital-02
  text: 把桌面上散落的圖示收進一個資料夾。
  tags: [digital]
- id: ma-digital-03
  text: 關掉瀏覽器裡開著卻沒在看的分頁。
  tags: [digital]
- id: ma-digital-04
  text: 把下載資料夾裡最舊的一個檔案丟進垃圾桶。
  tags: [digital]
- id: ma-digital-05
  text: 幫手機主畫面換一張看了會放鬆的桌布。
  tags: [digital]
- id: ma-digital-06
  text: 退訂一封最近都沒在讀的電子報。
  tags: [digital]
- id: ma-digital-07
  text: 把相簿裡連拍的重複照片留一張、刪其餘。
  tags: [digital]
- id: ma-digital-08
  text: 清空一個裝滿舊通知的 App 紅點。
  tags: [digital]
- id: ma-digital-09
  text: 把常用的一個網站加進瀏覽器書籤。
  tags: [digital]
- id: ma-digital-10
  text: 移除一個裝了半年都沒打開過的手機 App。
  tags: [digital]
- id: ma-digital-11
  text: 把電腦桌面的一個截圖改成看得懂的檔名。
  tags: [digital]
- id: ma-digital-12
  text: 清掉手機相簿裡一張手滑拍到的模糊照。
  tags: [digital]
- id: ma-digital-13
  text: 把一段常打的地址存成手機的文字捷徑。
  tags: [digital]
- id: ma-digital-14
  text: 封存一個已經結束的群組聊天室。
  tags: [digital]
- id: ma-digital-15
  text: 把桌面資源回收筒清空。
  tags: [digital]
- id: ma-digital-16
  text: 幫手機裡的一個資料夾取個清楚的名字。
  tags: [digital]
- id: ma-digital-17
  text: 關閉一個 App 沒必要的推播通知。
  tags: [digital]
- id: ma-digital-18
  text: 把儲存的一組舊密碼更新成新的。
  tags: [digital]
- id: ma-digital-19
  text: 把一張喜歡的照片設成鎖定畫面。
  tags: [digital]
- id: ma-digital-20
  text: 把電子信箱裡一封讀完的信歸到對應標籤。
  tags: [digital]
