# 微行動 · 倒垃圾與清潔。兩分鐘內做得完。
- id: ma-trash-01
  text: 把桌上的垃圾撥進垃圾桶。
  tags: [trash]
- id: ma-trash-02
  text: 換上一個新的垃圾袋。
  tags: [trash]
- id: ma-trash-03
  text: 把裝滿的垃圾提到門口放好。
  tags: [trash]
- id: ma-trash-04
  text: 擦掉桌面上一塊乾掉的水漬。
  tags: [trash]
- id: ma-trash-05
  text: 把地上的一團碎紙撿起來丟掉。
  tags: [trash]
- id: ma-trash-06
  text: 將垃圾桶邊緣沾到的髒污擦乾淨。
  tags: [trash]
- id: ma-trash-07
  text: 把發票和收據從口袋掏出來丟掉。
  tags: [trash]
- id: ma-trash-08
  text: 擦掉門把上的一處指印。
  tags: [trash]
- id: ma-trash-09
  text: 把桌角的空包裝袋塞進垃圾桶。
  tags: [trash]
- id: ma-trash-10
  text: 將垃圾袋沿桶口往下套緊。
  tags: [trash]
- id: ma-trash-11
  text: 把冰箱門上一滴乾掉的醬汁擦掉。
  tags: [trash]
- id: ma-trash-12
  text: 把用過的衛生紙揉起來丟進桶裡。
  tags: [trash]
- id: ma-trash-13
  text: 擦掉瓦斯爐旁的一個油點。
  tags: [trash]
- id: ma-trash-14
  text: 把鍵盤縫裡的屑屑掃出來丟掉。
  tags: [trash]
- id: ma-trash-15
  text: 將滿出來的垃圾壓實再綁緊袋口。
  tags: [trash]
- id: ma-trash-16
  text: 把窗台上的一層薄灰抹掉。
  tags: [trash]
- id: ma-trash-17
  text: 抽掉桌墊下夾著的舊便條丟進垃圾桶。
  tags: [trash]
- id: ma-trash-18
  text: 擦掉水龍頭上的一處水垢。
  tags: [trash]
- id: ma-trash-19
  text: 把玄關掉落的枯葉掃起來丟掉。
  tags: [trash]
- id: ma-trash-20
  text: 把垃圾桶內壁黏著的碎屑撥下來。
  tags: [trash]
