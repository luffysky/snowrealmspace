# 微行動 · 整理空間。兩分鐘內做得完的小動作。
- id: ma-space-01
  text: 把桌上一樣東西歸位。
  tags: [space]
- id: ma-space-02
  text: 幫這個空間換一張你喜歡的背景。
  tags: [space]
- id: ma-space-03
  text: 清掉一個你再也用不到的檔案。
  tags: [space]
- id: ma-space-04
  text: 把手機裡一張喜歡的照片存進來。
  tags: [space]
- id: ma-space-05
  text: 替一個作品補上標題。
  tags: [space]
- id: ma-space-06
  text: 把最近的一個想法寫成一句話存起來。
  tags: [space]
- id: ma-space-07
  text: 整理出一個乾淨的小角落。
  tags: [space]
- id: ma-space-08
  text: 關掉一個你其實沒在用的分頁。
  tags: [space]
- id: ma-space-09
  text: 把一件收藏移到你更常看到的地方。
  tags: [space]
- id: ma-space-10
  text: 替今天的心情選一個顏色主題。
  tags: [space]
- id: ma-space-11
  text: 把一個資料夾重新命名成看得懂的名字。
  tags: [space]
- id: ma-space-12
  text: 把最近做的東西看過一遍，留下一個。
  tags: [space]
- id: ma-space-13
  text: 幫一個舊作品加一句現在的註解。
  tags: [space]
- id: ma-space-14
  text: 把桌面上最占空間的東西挪走。
  tags: [space]
- id: ma-space-15
  text: 打開一個你很久沒進去的角落看看。
  tags: [space]
- id: ma-space-16
  text: 把一則你不想再看到的提醒關掉。
  tags: [space]
