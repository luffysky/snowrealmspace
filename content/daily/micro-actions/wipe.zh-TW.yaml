# 微行動 · 擦拭清潔。兩分鐘內做得完。
- id: ma-wipe-01
  text: 用眼鏡布把手機螢幕擦一遍。
  tags: [wipe]
- id: ma-wipe-02
  text: 拿濕紙巾擦掉桌面上的一圈水漬。
  tags: [wipe]
- id: ma-wipe-03
  text: 把眼鏡鏡片擦乾淨。
  tags: [wipe]
- id: ma-wipe-04
  text: 擦掉筆電鍵盤縫隙裡的灰塵。
  tags: [wipe]
- id: ma-wipe-05
  text: 用乾布把電腦螢幕的指紋擦掉。
  tags: [wipe]
- id: ma-wipe-06
  text: 擦一擦滑鼠底部與滾輪。
  tags: [wipe]
- id: ma-wipe-07
  text: 把桌上的水杯外壁擦乾。
  tags: [wipe]
- id: ma-wipe-08
  text: 擦掉手機背面沾到的油光。
  tags: [wipe]
- id: ma-wipe-09
  text: 用微濕的布把門把擦一遍。
  tags: [wipe]
- id: ma-wipe-10
  text: 擦淨窗台上積的一層薄灰。
  tags: [wipe]
- id: ma-wipe-11
  text: 把鏡子上的水點擦亮。
  tags: [wipe]
- id: ma-wipe-12
  text: 擦掉遙控器按鍵上的手垢。
  tags: [wipe]
- id: ma-wipe-13
  text: 用抹布把餐桌擦過一遍。
  tags: [wipe]
- id: ma-wipe-14
  text: 擦一擦耳機的耳塞外殼。
  tags: [wipe]
- id: ma-wipe-15
  text: 把鍵盤上的每個鍵帽表面擦亮。
  tags: [wipe]
- id: ma-wipe-16
  text: 擦掉冰箱門上的一片指印。
  tags: [wipe]
- id: ma-wipe-17
  text: 用乾淨的布把水龍頭擦到發亮。
  tags: [wipe]
- id: ma-wipe-18
  text: 擦一擦相框玻璃上的灰。
  tags: [wipe]
- id: ma-wipe-19
  text: 把手機殼拆下來，擦掉內側的灰。
  tags: [wipe]
- id: ma-wipe-20
  text: 擦淨檯燈燈罩表面的灰塵。
  tags: [wipe]
