# 微行動 · 盥洗與清爽。兩分鐘內做得完。
- id: ma-bath-01
  text: 用溫水把臉仔細洗一遍。
  tags: [bathroom]
- id: ma-bath-02
  text: 擠一點牙膏，把牙齒每個角落刷過。
  tags: [bathroom]
- id: ma-bath-03
  text: 含一口漱口水，左右鼓動再吐掉。
  tags: [bathroom]
- id: ma-bath-04
  text: 抹上化妝水，用掌心輕輕拍到吸收。
  tags: [bathroom]
- id: ma-bath-05
  text: 取一點乳液，均勻推開在兩頰。
  tags: [bathroom]
- id: ma-bath-06
  text: 拿牙線把牙縫一格一格清過。
  tags: [bathroom]
- id: ma-bath-07
  text: 用毛巾把臉上的水分輕輕按乾。
  tags: [bathroom]
- id: ma-bath-08
  text: 擠出洗面乳搓出泡沫，繞著鼻翼洗。
  tags: [bathroom]
- id: ma-bath-09
  text: 拿梳子把頭髮從髮尾往上梳順。
  tags: [bathroom]
- id: ma-bath-10
  text: 點一滴眼霜，用無名指沿眼周輕點。
  tags: [bathroom]
- id: ma-bath-11
  text: 刷完牙順手把舌苔輕輕刮一下。
  tags: [bathroom]
- id: ma-bath-12
  text: 用棉花棒把耳廓邊緣擦乾淨。
  tags: [bathroom]
- id: ma-bath-13
  text: 抹上護唇膏，把嘴唇整圈塗滿。
  tags: [bathroom]
- id: ma-bath-14
  text: 用溫水沖一下手腕內側，讓自己清醒些。
  tags: [bathroom]
- id: ma-bath-15
  text: 拿修容刀把下巴周圍修一遍。
  tags: [bathroom]
- id: ma-bath-16
  text: 擠一顆份量的精華液，按壓進臉頰。
  tags: [bathroom]
- id: ma-bath-17
  text: 用指腹沾洗面乳，把額頭到下巴帶過。
  tags: [bathroom]
- id: ma-bath-18
  text: 拿濕紙巾把脖子後方擦一擦。
  tags: [bathroom]
- id: ma-bath-19
  text: 換上一條乾淨毛巾掛回架上。
  tags: [bathroom]
- id: ma-bath-20
  text: 抹一層防曬，把臉和脖子都帶到。
  tags: [bathroom]
