# 微行動 · 信件與郵件整理。兩分鐘內做得完。
- id: ma-mail-01
  text: 把信箱裡的信全部拿進屋裡。
  tags: [mail]
- id: ma-mail-02
  text: 拆開最上面那封還沒拆的信。
  tags: [mail]
- id: ma-mail-03
  text: 把門口的一張傳單丟進回收桶。
  tags: [mail]
- id: ma-mail-04
  text: 從信箱裡挑出廣告信集中丟掉。
  tags: [mail]
- id: ma-mail-05
  text: 把一張重要帳單放進固定的信件收納盒。
  tags: [mail]
- id: ma-mail-06
  text: 退訂一份不想再收的紙本型錄。
  tags: [mail]
- id: ma-mail-07
  text: 把電子信箱裡一封促銷信移進垃圾桶。
  tags: [mail]
- id: ma-mail-08
  text: 幫收件匣裡讀完的一封信按下封存。
  tags: [mail]
- id: ma-mail-09
  text: 幫一封之後要回覆的信加上待辦標記。
  tags: [mail]
- id: ma-mail-10
  text: 把信件盒裡繳完的帳單抽出來丟掉。
  tags: [mail]
- id: ma-mail-11
  text: 把拆完的空信封拿去回收。
  tags: [mail]
- id: ma-mail-12
  text: 把一封重要通知拍照存進手機備份。
  tags: [mail]
- id: ma-mail-13
  text: 在收件匣用一個關鍵字找出要找的信。
  tags: [mail]
- id: ma-mail-14
  text: 把同一個寄件人的信集中到一個資料夾。
  tags: [mail]
- id: ma-mail-15
  text: 刪掉一封放了超過一個月的舊信。
  tags: [mail]
- id: ma-mail-16
  text: 把系統寄來的驗證信用完後清掉。
  tags: [mail]
- id: ma-mail-17
  text: 幫一封含重要日期的信標成重要。
  tags: [mail]
- id: ma-mail-18
  text: 把看過的一疊紙本信疊整齊放好。
  tags: [mail]
- id: ma-mail-19
  text: 檢查信箱深處有沒有漏拿的明信片。
  tags: [mail]
- id: ma-mail-20
  text: 把收件匣裡一封讀完的活動通知刪掉。
  tags: [mail]
