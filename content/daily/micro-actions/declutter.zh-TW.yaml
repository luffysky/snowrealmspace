# 微行動：丟一樣東西（斷捨離）
- id: ma-declutter-01
  text: 挑一件今年沒用過的東西，現在拿去丟掉。
  tags: [declutter]
- id: ma-declutter-02
  text: 打開抽屜，拿出一支寫不出來的筆，扔進垃圾桶。
  tags: [declutter]
- id: ma-declutter-03
  text: 找出一件穿不下的衣服，放進準備捐出的袋子。
  tags: [declutter]
- id: ma-declutter-04
  text: 退掉一個已經沒在看的電子報訂閱。
  tags: [declutter]
- id: ma-declutter-05
  text: 清掉錢包裡一張過期的集點卡或發票。
  tags: [declutter]
- id: ma-declutter-06
  text: 把一個空了的瓶罐從架上拿下來回收。
  tags: [declutter]
- id: ma-declutter-07
  text: 刪掉手機裡一個半年沒開過的 App。
  tags: [declutter]
- id: ma-declutter-08
  text: 挑一件重複擁有的廚房用具，留一個、捨一個。
  tags: [declutter]
- id: ma-declutter-09
  text: 從書架抽出一本讀完不會再翻的書，放進送人堆。
  tags: [declutter]
- id: ma-declutter-10
  text: 丟掉一個缺了蓋子或找不到盒身的保鮮盒。
  tags: [declutter]
- id: ma-declutter-11
  text: 取消一個很少使用的付費會員自動續訂。
  tags: [declutter]
- id: ma-declutter-12
  text: 把一條打結壞掉的舊耳機線拿去回收。
  tags: [declutter]
- id: ma-declutter-13
  text: 挑一個不再喜歡的馬克杯，放進要捐的箱子。
  tags: [declutter]
- id: ma-declutter-14
  text: 撕掉冰箱上一張早已過期的便利貼。
  tags: [declutter]
- id: ma-declutter-15
  text: 清掉包包底部一個累積很久的空糖果紙。
  tags: [declutter]
- id: ma-declutter-16
  text: 拿出一件多年沒戴的飾品，決定送給別人。
  tags: [declutter]
- id: ma-declutter-17
  text: 丟掉一支乾掉或分岔的舊化妝刷。
  tags: [declutter]
- id: ma-declutter-18
  text: 從鞋櫃挑一雙磨壞的鞋，拿去丟。
  tags: [declutter]
- id: ma-declutter-19
  text: 清掉桌上一疊已經處理完的紙本收據。
  tags: [declutter]
- id: ma-declutter-20
  text: 取消追蹤一個讓你毫無收穫的帳號。
  tags: [declutter]
