# 微行動 · 香氣與嗅覺（兩分鐘內做得完）
- id: ma-scent-01
  text: 點一支喜歡的線香，看煙慢慢升起。
  tags: [scent]
- id: ma-scent-02
  text: 剝一顆橘子，把果皮湊到鼻子前聞一聞。
  tags: [scent]
- id: ma-scent-03
  text: 泡一杯有香氣的茶，捧著杯口深吸一口熱氣。
  tags: [scent]
- id: ma-scent-04
  text: 打開咖啡豆的罐子，聞一下裡面的味道。
  tags: [scent]
- id: ma-scent-05
  text: 往手腕噴一點喜歡的香水，靠近鼻子輕嗅。
  tags: [scent]
- id: ma-scent-06
  text: 抱起剛烘好的衣物，把臉埋進去聞那股暖香。
  tags: [scent]
- id: ma-scent-07
  text: 掐一小片薄荷葉，揉一揉再聞指尖。
  tags: [scent]
- id: ma-scent-08
  text: 打開香氛蠟燭的蓋子，聞聞蠟本身的香味。
  tags: [scent]
- id: ma-scent-09
  text: 切開一顆檸檬，靠近聞那股酸香。
  tags: [scent]
- id: ma-scent-10
  text: 拿起一塊香皂，放到鼻前深深吸一口。
  tags: [scent]
- id: ma-scent-11
  text: 打開櫃子裡的乾燥花香包，湊近聞一聞。
  tags: [scent]
- id: ma-scent-12
  text: 磨一點肉桂粉，聞聞那股溫熱的甜氣。
  tags: [scent]
- id: ma-scent-13
  text: 揉一片新鮮羅勒葉，讓香味留在手上。
  tags: [scent]
- id: ma-scent-14
  text: 翻開一本舊書，把鼻子貼近書頁聞紙張的味道。
  tags: [scent]
- id: ma-scent-15
  text: 滴一滴精油在掌心，搓熱後捧住鼻子吸氣。
  tags: [scent]
- id: ma-scent-16
  text: 剝開一顆蒜頭，聞聞那股辛辣的氣味。
  tags: [scent]
- id: ma-scent-17
  text: 泡開一包花草茶，把鼻子湊到杯緣聞香。
  tags: [scent]
- id: ma-scent-18
  text: 拿起一小把烘焙用的香草莢，貼近鼻尖細聞。
  tags: [scent]
- id: ma-scent-19
  text: 走到廚房，聞一聞剛煮好那鍋飯的香氣。
  tags: [scent]
- id: ma-scent-20
  text: 撕開一片鼠尾草，搓一搓再深吸一口。
  tags: [scent]
