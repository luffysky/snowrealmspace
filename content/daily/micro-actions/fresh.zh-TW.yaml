# 微行動 · 清爽一下。兩分鐘內做得完。
- id: ma-fresh-01
  text: 去洗把臉，讓臉頰醒過來。
  tags: [fresh]
- id: ma-fresh-02
  text: 用溫水漱漱口，把嘴裡的悶氣沖掉。
  tags: [fresh]
- id: ma-fresh-03
  text: 拿濕紙巾擦一擦手，感覺一下涼意。
  tags: [fresh]
- id: ma-fresh-04
  text: 往脖子後面噴一點水，讓後頸涼下來。
  tags: [fresh]
- id: ma-fresh-05
  text: 打開窗戶，讓外面的空氣進來換一口氣。
  tags: [fresh]
- id: ma-fresh-06
  text: 用冷水洗一洗雙手，慢慢搓到手腕。
  tags: [fresh]
- id: ma-fresh-07
  text: 拿一條濕毛巾敷在眼睛上，數十下再拿開。
  tags: [fresh]
- id: ma-fresh-08
  text: 含一口薄荷茶或清水，在嘴裡停三秒再嚥下。
  tags: [fresh]
- id: ma-fresh-09
  text: 用指腹沾點水，輕拍太陽穴兩側。
  tags: [fresh]
- id: ma-fresh-10
  text: 把噴霧往臉前噴一下，讓水霧落在皮膚上。
  tags: [fresh]
- id: ma-fresh-11
  text: 走到洗手台，用涼水沖一沖手腕內側。
  tags: [fresh]
- id: ma-fresh-12
  text: 拿棉片沾化妝水，順著臉頰擦一圈。
  tags: [fresh]
- id: ma-fresh-13
  text: 用清水潤一潤乾乾的嘴唇。
  tags: [fresh]
- id: ma-fresh-14
  text: 把雙手泡進一盆涼水裡，停留幾秒。
  tags: [fresh]
- id: ma-fresh-15
  text: 撕一片保濕面膜紙，貼在額頭上放鬆一下。
  tags: [fresh]
- id: ma-fresh-16
  text: 用微濕的紙巾擦一擦耳後和脖子。
  tags: [fresh]
- id: ma-fresh-17
  text: 深深吸一口薄荷或柑橘的香氣，讓鼻腔通一通。
  tags: [fresh]
- id: ma-fresh-18
  text: 把冰涼的水瓶貼在額頭上滾一滾。
  tags: [fresh]
- id: ma-fresh-19
  text: 用牙刷刷一次牙，讓口腔清爽起來。
  tags: [fresh]
- id: ma-fresh-20
  text: 潑幾滴水在手心，順著髮際線抹上去。
  tags: [fresh]
