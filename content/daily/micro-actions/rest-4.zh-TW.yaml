# 微行動 · 休息（第四批）。兩分鐘內做得完。
- id: ma-rest-46
  text: 把椅背調斜一點，讓後腦有地方靠。
  tags: [rest]
- id: ma-rest-47
  text: 雙腳踩上一個小箱子，讓膝蓋抬高一些。
  tags: [rest]
- id: ma-rest-48
  text: 泡一小盆溫水，把雙腳浸進去五分鐘。
  tags: [rest]
- id: ma-rest-49
  text: 拉上窗簾，讓房間暗下來一會兒。
  tags: [rest]
- id: ma-rest-50
  text: 把手機翻面蓋著，讓螢幕離開視線。
  tags: [rest]
- id: ma-rest-51
  text: 找一面牆靠上去，讓背整片貼平。
  tags: [rest]
- id: ma-rest-52
  text: 倒一杯常溫水，一小口一小口慢慢喝完。
  tags: [rest]
- id: ma-rest-53
  text: 把枕頭墊到腰後，讓下背有支撐。
  tags: [rest]
- id: ma-rest-54
  text: 躺平在地板上，讓身體攤成大字形。
  tags: [rest]
- id: ma-rest-55
  text: 用掌心搓熱後，輕輕蓋住閉上的眼睛。
  tags: [rest]
- id: ma-rest-56
  text: 把腳邊的暖爐或毯子拉近，讓腳先暖起來。
  tags: [rest]
- id: ma-rest-57
  text: 挑一首慢節奏的歌，閉眼聽完一遍。
  tags: [rest]
- id: ma-rest-58
  text: 把肩膀往後繞三圈，再整個放鬆垂下。
  tags: [rest]
- id: ma-rest-59
  text: 側躺蜷起來，把膝蓋抱向胸口一下。
  tags: [rest]
- id: ma-rest-60
  text: 關掉頭頂的大燈，只留一盞小夜燈。
  tags: [rest]
- id: ma-rest-61
  text: 把冰涼的毛巾敷在後頸，坐著不動一會兒。
  tags: [rest]
- id: ma-rest-62
  text: 靠在沙發角落，把抱枕摟在懷裡。
  tags: [rest]
- id: ma-rest-63
  text: 深吸一口氣停三秒，再長長地把氣吐光。
  tags: [rest]
- id: ma-rest-64
  text: 把待辦清單收進抽屜，眼前先清空。
  tags: [rest]
- id: ma-rest-65
  text: 找個地方坐下，什麼都不做地待滿一分鐘。
  tags: [rest]
