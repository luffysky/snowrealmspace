# 微行動 · 身體。離開螢幕一下下。
- id: ma-body-01
  text: 站起來，把肩膀往後轉三圈。
  tags: [body]
- id: ma-body-02
  text: 喝一大口水。
  tags: [body]
- id: ma-body-03
  text: 閉上眼睛，做三次深呼吸。
  tags: [body]
- id: ma-body-04
  text: 看向最遠的地方二十秒。
  tags: [body]
- id: ma-body-05
  text: 把窗戶打開，換一口新鮮空氣。
  tags: [body]
- id: ma-body-06
  text: 伸個大大的懶腰。
  tags: [body]
- id: ma-body-07
  text: 動一動脖子，左右各停五秒。
  tags: [body]
- id: ma-body-08
  text: 起來走到另一個房間再回來。
  tags: [body]
- id: ma-body-09
  text: 把雙手搓熱，蓋在眼睛上一下。
  tags: [body]
- id: ma-body-10
  text: 調暗一點螢幕，讓眼睛鬆一下。
  tags: [body]
- id: ma-body-11
  text: 倒杯溫的，慢慢喝。
  tags: [body]
- id: ma-body-12
  text: 把腳踝各轉十圈。
  tags: [body]
- id: ma-body-13
  text: 放下手邊的東西，發呆一分鐘。
  tags: [body, rest]
- id: ma-body-14
  text: 用力握拳再放開，重複五次。
  tags: [body]
- id: ma-body-15
  text: 抬頭看看天花板，讓脖子休息。
  tags: [body]
- id: ma-body-16
  text: 雙腳踩穩地面，感覺一下重量。
  tags: [body]
