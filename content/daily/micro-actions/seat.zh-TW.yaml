# 微行動 · 座位環境。兩分鐘內做得完。
- id: ma-seat-01
  text: 把椅子高度調到腳能平放地面。
  tags: [seat]
- id: ma-seat-02
  text: 將螢幕角度往後仰一點，減少反光。
  tags: [seat]
- id: ma-seat-03
  text: 把桌燈轉向不會直射眼睛的方向。
  tags: [seat]
- id: ma-seat-04
  text: 在手邊清出一塊放水杯的空位。
  tags: [seat]
- id: ma-seat-05
  text: 把椅背調到能靠住下背的角度。
  tags: [seat]
- id: ma-seat-06
  text: 將鍵盤往身體正前方擺正。
  tags: [seat]
- id: ma-seat-07
  text: 把螢幕上緣調到與視線齊平。
  tags: [seat]
- id: ma-seat-08
  text: 在腳下墊個東西，讓膝蓋成直角。
  tags: [seat]
- id: ma-seat-09
  text: 把滑鼠移到手不用外伸就碰得到的位置。
  tags: [seat]
- id: ma-seat-10
  text: 拉開窗簾一角，讓自然光灑進座位。
  tags: [seat]
- id: ma-seat-11
  text: 把座椅往桌子推近到手肘剛好靠桌。
  tags: [seat]
- id: ma-seat-12
  text: 調暗一階背景燈，讓螢幕不刺眼。
  tags: [seat]
- id: ma-seat-13
  text: 把椅子扶手降到肩膀能放鬆的高度。
  tags: [seat]
- id: ma-seat-14
  text: 在椅背後塞一個靠墊撐住腰。
  tags: [seat]
- id: ma-seat-15
  text: 把桌面正中央的雜物挪到兩側。
  tags: [seat]
- id: ma-seat-16
  text: 將螢幕轉正到面對座位中線。
  tags: [seat]
- id: ma-seat-17
  text: 把腳邊的電線理到不會絆到的地方。
  tags: [seat]
- id: ma-seat-18
  text: 開一扇窗讓座位透一下氣。
  tags: [seat]
- id: ma-seat-19
  text: 把常用的杯子換到順手拿的那一側。
  tags: [seat]
- id: ma-seat-20
  text: 將座位前方擋視線的東西移開。
  tags: [seat]
