# 微行動 · 感官/呼吸/感恩。兩分鐘內做得完。
- id: ma-sense-01
  text: 閉眼，聽三種現在聽得到的聲音。
  tags: [sense]
- id: ma-sense-02
  text: 摸一樣手邊的東西，感受它的質地。
  tags: [sense]
- id: ma-sense-03
  text: 找一個現在看得到最美的顏色。
  tags: [sense]
- id: ma-sense-04
  text: 聞一聞空氣裡有什麼味道。
  tags: [sense]
- id: ma-sense-05
  text: 感受腳踩在地上的觸感。
  tags: [sense]
- id: ma-breath-01
  text: 慢慢吸氣四秒，吐氣六秒，做三次。
  tags: [breath]
- id: ma-breath-02
  text: 把注意力放在呼吸上，數十下。
  tags: [breath]
- id: ma-breath-03
  text: 深吸一口，把肩膀聳起再放下。
  tags: [breath]
- id: ma-breath-04
  text: 吐氣時，想像把緊繃也吐出去。
  tags: [breath]
- id: ma-breath-05
  text: 用鼻子慢慢吸，用嘴巴慢慢吐。
  tags: [breath]
- id: ma-thanks-01
  text: 想三件今天值得謝的小事。
  tags: [thanks]
- id: ma-thanks-02
  text: 謝謝身體今天替你做的事。
  tags: [thanks]
- id: ma-thanks-03
  text: 想一個此刻讓你安心的存在。
  tags: [thanks]
- id: ma-thanks-04
  text: 記下一個你今天感激的人。
  tags: [thanks]
- id: ma-thanks-05
  text: 謝謝過去努力到現在的自己。
  tags: [thanks]
