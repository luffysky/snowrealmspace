# 微行動 · 整理空間（續）。兩分鐘內做得完的小動作。
- id: ma-space-17
  text: 關掉頭頂的大燈，只留一盞小燈亮著。
  tags: [space]
- id: ma-space-18
  text: 點亮一串小燈，替牆角添一點光。
  tags: [space]
- id: ma-space-19
  text: 點一根蠟燭，看著燭火輕輕晃動。
  tags: [space]
- id: ma-space-20
  text: 在窗台擺一個會透光的小玻璃瓶。
  tags: [space]
- id: ma-space-21
  text: 找一張喜歡的卡片，立在桌上看得到的地方。
  tags: [space]
- id: ma-space-22
  text: 在桌角擺一顆好看的石頭或貝殼。
  tags: [space]
- id: ma-space-23
  text: 找一面牆，貼上一張你喜歡的明信片。
  tags: [space]
- id: ma-space-24
  text: 在門邊掛一個小吊飾，讓它輕輕搖。
  tags: [space]
- id: ma-space-25
  text: 替書桌鋪上一小塊喜歡的桌巾。
  tags: [space]
- id: ma-space-26
  text: 拿一個空瓶，插上一枝乾燥花擺著。
  tags: [space]
- id: ma-space-27
  text: 在桌上放一個小沙漏，倒過來看它流完。
  tags: [space]
- id: ma-space-28
  text: 挑一個好看的馬克杯，當筆筒擺到桌上。
  tags: [space]
- id: ma-space-29
  text: 在椅背披一條毯子，讓座位看起來暖一點。
  tags: [space]
- id: ma-space-30
  text: 在窗邊放一個小風車，等風把它吹轉。
  tags: [space]
- id: ma-space-31
  text: 找一個小盤子，擺上幾顆好看的鈕扣或彈珠。
  tags: [space]
- id: ma-space-32
  text: 在牆上拉一條線，夾上一張小卡片。
  tags: [space]
- id: ma-space-33
  text: 替桌燈綁上一小段緞帶。
  tags: [space]
- id: ma-space-34
  text: 把一個喜歡的杯墊擺到桌面中央當點綴。
  tags: [space]
- id: ma-space-35
  text: 找一塊喜歡的布，鋪在層架上當背景。
  tags: [space]
- id: ma-space-36
  text: 在透明杯裡裝水，放一片葉子漂在上面。
  tags: [space]
