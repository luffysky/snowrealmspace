  text: 在紙上把眼前這株植物的輪廓畫下來。
  tags: [green]
- id: ma-green-14
  text: 把落在地上的花瓣收進小盒子裡。
  tags: [green]
- id: ma-green-15
  text: 觀察一隻停在葉子上的小蟲一分鐘。
  tags: [green]
