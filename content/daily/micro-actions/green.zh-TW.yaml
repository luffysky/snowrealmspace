# 微行動 · 綠意與自然。兩分鐘內做得完。
- id: ma-green-01
  text: 幫桌上的植物摸一摸土並補點水。
  tags: [green]
- id: ma-green-02
  text: 把窗台的盆栽轉個方向讓另一面曬到光。
  tags: [green]
- id: ma-green-03
  text: 撿一片形狀好看的落葉夾進本子裡。
  tags: [green]
- id: ma-green-04
  text: 湊近一朵花仔細看看它花瓣的紋路。
  tags: [green]
- id: ma-green-05
  text: 把葉子上的灰塵用濕紙巾輕輕擦乾淨。
  tags: [green]
- id: ma-green-06
  text: 望向窗外找出三種不同深淺的綠色。
  tags: [green]
- id: ma-green-07
  text: 摘掉盆栽上枯黃的那幾片老葉。
  tags: [green]
- id: ma-green-08
  text: 在陽台深吸一口氣聞聞泥土和草的味道。
  tags: [green]
