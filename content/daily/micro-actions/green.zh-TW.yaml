  text: 用手指感受一片葉子正反面的不同觸感。
  tags: [green]
- id: ma-green-10
  text: 幫多肉挑一個陽光剛好的位置擺好。
  tags: [green]
- id: ma-green-11
  text: 蹲下來看看牆角石縫裡冒出的小草。
  tags: [green]
- id: ma-green-12
  text: 剪一小段香草放進杯子裡看它冒香氣。
  tags: [green]
