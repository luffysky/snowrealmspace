# 微行動 · 整理（續）。兩分鐘內做得完。
- id: ma-tidy-06
  text: 把一個空紙箱拆平，靠牆立好。
  tags: [tidy]
- id: ma-tidy-07
  text: 整理雲端硬碟裡的一個資料夾。
  tags: [tidy]
- id: ma-tidy-08
  text: 把桌墊下壓著的紙條抽出來處理掉。
  tags: [tidy]
- id: ma-tidy-09
  text: 把電子信箱裡三封讀過的舊信刪掉。
  tags: [tidy]
- id: ma-tidy-10
  text: 清一次下載資料夾，刪掉一個用過的安裝檔。
  tags: [tidy]
- id: ma-tidy-11
  text: 把一疊文件用夾子夾成一落收好。
  tags: [tidy]
- id: ma-tidy-12
  text: 把家裡的環保購物袋摺好疊成一小落。
  tags: [tidy]
- id: ma-tidy-13
  text: 把雜物盒倒出來，挑一樣丟掉。
  tags: [tidy]
- id: ma-tidy-14
  text: 把傘架裡壞掉或不用的傘挑出來。
  tags: [tidy]
- id: ma-tidy-15
  text: 把散落的遙控器排成一列歸位。
  tags: [tidy]
- id: ma-tidy-16
  text: 把隨身碟裡的一個舊檔案刪掉。
  tags: [tidy]
- id: ma-tidy-17
  text: 把窗台上積著的雜物收走一樣。
  tags: [tidy]
- id: ma-tidy-18
  text: 把牆上過期的一張便利貼撕下來。
  tags: [tidy]
- id: ma-tidy-19
  text: 把備用鈕扣、緞帶那類小東西集中裝進一個小袋。
  tags: [tidy]
- id: ma-tidy-20
  text: 把名片盒裡重複的一張抽走。
  tags: [tidy]
- id: ma-tidy-21
  text: 把抽屜裡打結的橡皮筋和迴紋針分開收好。
  tags: [tidy]
- id: ma-tidy-22
  text: 把一個資料夾裡的舊版本檔案刪掉一份。
  tags: [tidy]
- id: ma-tidy-23
  text: 把一張包裝用的氣泡紙摺小收好。
  tags: [tidy]
- id: ma-tidy-24
  text: 把記事 App 裡一則過期的備忘刪掉。
  tags: [tidy]
- id: ma-tidy-25
  text: 把一個空的收納盒疊起來收好。
  tags: [tidy]
