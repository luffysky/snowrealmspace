# 微行動 · 心緒（第三批）。兩分鐘內做得完。
- id: ma-mind-26
  text: 把注意力放在耳朵聽到的最遠一個聲音。
  tags: [mind]
- id: ma-mind-27
  text: 想一個曾經幫過你、現在還記得的陌生人。
  tags: [mind]
- id: ma-mind-28
  text: 對自己說一句今天想聽的話。
  tags: [mind]
- id: ma-mind-29
  text: 在心裡把今天分成三段，各挑一個字形容。
  tags: [mind]
- id: ma-mind-30
  text: 想像明年的自己，回頭謝謝現在的你。
  tags: [mind]
- id: ma-mind-31
  text: 鬆開下巴和舌根，讓臉放軟。
  tags: [mind]
- id: ma-mind-32
  text: 想一件你已經比去年更擅長的事。
  tags: [mind]
- id: ma-mind-33
  text: 想一個最近讓你覺得被理解的時刻。
  tags: [mind]
- id: ma-mind-34
  text: 想一個此刻讓你感到安全的人的名字。
  tags: [mind]
- id: ma-mind-35
  text: 讓雙肩往下沉，離耳朵遠一點。
  tags: [mind]
- id: ma-mind-36
  text: 挑一個身邊讓你安心的小物，握在手裡。
  tags: [mind]
- id: ma-mind-37
  text: 在心裡對一個離開的人說聲再見。
  tags: [mind]
- id: ma-mind-38
  text: 挑一個字，當作今天剩下時間的方向。
  tags: [mind]
- id: ma-mind-39
  text: 想像把胸口的一團緊，慢慢吐出去。
  tags: [mind]
- id: ma-mind-40
  text: 回想一個有人為你留步的瞬間。
  tags: [mind]
- id: ma-mind-41
  text: 想一件你其實做得比自己以為好的事。
  tags: [mind]
- id: ma-mind-42
  text: 把手掌貼在心口，感覺它的起伏。
  tags: [mind]
- id: ma-mind-43
  text: 想像一道溫暖的光，從頭頂慢慢流過全身。
  tags: [mind]
- id: ma-mind-44
  text: 讓眼睛離開螢幕，望向最遠的地方。
  tags: [mind]
- id: ma-mind-45
  text: 在心裡替今天的自己，寫一句短短的評語。
  tags: [mind]
