  text: 隨手畫一條線，不管它像什麼。
  tags: [create]
- id: ma-create-02
  text: 寫下現在腦中的第一個詞。
  tags: [create]
- id: ma-create-03
  text: 拍一張你此刻看到的東西。
  tags: [create]
- id: ma-create-04
  text: 幫今天取一個名字。
  tags: [create]
- id: ma-create-05
  text: 用三個字形容現在的心情。
