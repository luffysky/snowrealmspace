- id: ma-create-06
  text: 哼一段你想到的旋律。
  tags: [create]
- id: ma-create-07
  text: 寫一句沒有要給任何人看的話。
  tags: [create]
- id: ma-create-08
  text: 替窗外的天空想一個形容詞。
  tags: [create]
- id: ma-create-09
  text: 把一個念頭畫成一個小圖示。
  tags: [create]
- id: ma-create-10
