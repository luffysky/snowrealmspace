# 微行動 · 眼睛休息。兩分鐘內做得完。
- id: ma-eyes-01
  text: 閉上眼睛，讓眼球放鬆二十秒。
  tags: [eyes]
- id: ma-eyes-02
  text: 望向窗外最遠的那棟建築，停留十秒。
  tags: [eyes]
- id: ma-eyes-03
  text: 慢慢眨眼十次，讓淚水重新鋪滿眼球表面。
  tags: [eyes]
- id: ma-eyes-04
  text: 用眼睛順時針畫一個大圓，再逆時針畫回來。
  tags: [eyes]
- id: ma-eyes-05
  text: 搓熱雙手掌心，輕輕覆蓋在闔上的雙眼上。
  tags: [eyes]
- id: ma-eyes-06
  text: 把視線移到桌上的綠色植物，端詳它的葉脈。
  tags: [eyes]
- id: ma-eyes-07
  text: 伸出一根手指靠近鼻尖，再看向遠方，來回聚焦五次。
  tags: [eyes]
- id: ma-eyes-08
  text: 抬頭看天花板五秒，再低頭看地板五秒，重複三輪。
  tags: [eyes]
- id: ma-eyes-09
  text: 讓眼睛依序看向左邊、右邊，各停留三秒。
  tags: [eyes]
- id: ma-eyes-10
  text: 把螢幕亮度調柔和，讓眼睛少受一點刺激。
  tags: [eyes]
- id: ma-eyes-11
  text: 找到房間裡最遠的角落，用視線描一遍它的輪廓。
  tags: [eyes]
- id: ma-eyes-12
  text: 用指腹輕輕按壓眉骨下緣，繞著眼眶按一圈。
  tags: [eyes]
- id: ma-eyes-13
  text: 站到窗邊，讓眼睛沐浴在自然光裡半分鐘。
  tags: [eyes]
- id: ma-eyes-14
  text: 把目光放空，看向沒有文字的一片空白牆面。
  tags: [eyes]
- id: ma-eyes-15
  text: 用眼睛追著一隻經過的鳥或飄動的雲移動。
  tags: [eyes]
- id: ma-eyes-16
  text: 睜大雙眼三秒，再用力閉緊三秒，重複五次。
  tags: [eyes]
- id: ma-eyes-17
  text: 端起一杯溫水喝，喝的時候讓視線離開螢幕。
  tags: [eyes]
- id: ma-eyes-18
  text: 對著遠處的招牌，試著讀出上面最小的那行字。
  tags: [eyes]
- id: ma-eyes-19
  text: 把台燈往旁邊挪一點，避開直射眼睛的光。
  tags: [eyes]
- id: ma-eyes-20
  text: 讓視線沿著遠方的地平線緩緩掃過去。
  tags: [eyes]
