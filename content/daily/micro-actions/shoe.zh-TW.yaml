# 微行動 · 鞋子整理與保養。兩分鐘內做得完。
- id: ma-shoe-01
  text: 拿鞋刷把鞋面的灰塵刷乾淨。
  tags: [shoe]
- id: ma-shoe-02
  text: 擠一點鞋油，在皮鞋上抹勻推亮。
  tags: [shoe]
- id: ma-shoe-03
  text: 把鞋撐塞進鞋子裡，撐出原本的形狀。
  tags: [shoe]
- id: ma-shoe-04
  text: 對著鞋面噴一層防水噴霧，均勻覆蓋。
  tags: [shoe]
- id: ma-shoe-05
  text: 在鞋櫃裡放一包除臭包，關上櫃門。
  tags: [shoe]
- id: ma-shoe-06
  text: 把鬆掉的鞋帶重新綁緊打好結。
  tags: [shoe]
- id: ma-shoe-07
  text: 用濕布擦掉球鞋邊緣的泥痕。
  tags: [shoe]
- id: ma-shoe-08
  text: 把鞋墊抽出來，放到通風處透氣。
  tags: [shoe]
- id: ma-shoe-09
  text: 拿舊牙刷沾點清潔劑，刷洗鞋底的溝縫。
  tags: [shoe]
- id: ma-shoe-10
  text: 把兩隻鞋跟對齊，並排收進鞋櫃。
  tags: [shoe]
- id: ma-shoe-11
  text: 塞一張揉皺的報紙進濕鞋，吸走裡面的潮氣。
  tags: [shoe]
- id: ma-shoe-12
  text: 換上一副乾淨的鞋帶，把舊的收起來。
  tags: [shoe]
- id: ma-shoe-13
  text: 用軟布沿著皮鞋縫線把塵土擦出來。
  tags: [shoe]
- id: ma-shoe-14
  text: 在麂皮鞋上用專用刷順著同一方向刷順。
  tags: [shoe]
- id: ma-shoe-15
  text: 把運動鞋的鞋帶解開，讓鞋子完全張開透氣。
  tags: [shoe]
- id: ma-shoe-16
  text: 噴一點鞋內除臭噴霧，靜置讓它揮發。
  tags: [shoe]
- id: ma-shoe-17
  text: 把久沒穿的鞋拿出來，擦一擦再放回去。
  tags: [shoe]
- id: ma-shoe-18
  text: 用棉花棒沾乳液，把皮鞋的摺痕輕輕推開。
  tags: [shoe]
- id: ma-shoe-19
  text: 撕掉黏在鞋底的小石子和口香糖。
  tags: [shoe]
- id: ma-shoe-20
  text: 把鞋子按季節分區，把當季的擺到順手的一格。
  tags: [shoe]
