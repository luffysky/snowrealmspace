# 微行動 · 開窗換氣。兩分鐘內做得完。
- id: ma-air-01
  text: 打開窗，讓新鮮空氣流進房間一分鐘。
  tags: [airout]
- id: ma-air-02
  text: 把窗戶推到最開，站在窗邊做一次緩慢的深呼吸。
  tags: [airout]
- id: ma-air-03
  text: 開對向的兩扇窗，讓風從一頭穿到另一頭。
  tags: [airout]
- id: ma-air-04
  text: 拉開紗窗，把手伸出去感受一下外頭空氣的溫度。
  tags: [airout]
- id: ma-air-05
  text: 打開窗，把室內悶住的空氣換成外面清新的那口。
  tags: [airout]
- id: ma-air-06
  text: 把窗簾往兩側撥開，順手把窗閂扳到通風的位置。
  tags: [airout]
- id: ma-air-07
  text: 開一道窗縫，讓微風安靜地在房間裡繞一圈。
  tags: [airout]
- id: ma-air-08
  text: 走到窗前推開窗，用鼻子深深吸進戶外的空氣。
  tags: [airout]
- id: ma-air-09
  text: 把浴室或廚房的窗打開，讓潮濕的空氣散出去。
  tags: [airout]
- id: ma-air-10
  text: 開窗後打開電扇，把外面的空氣往室內帶進來。
  tags: [airout]
- id: ma-air-11
  text: 把落地窗滑開一個手掌寬，讓空氣慢慢對流。
  tags: [airout]
- id: ma-air-12
  text: 開窗站定，數著呼吸吸滿四拍再吐四拍。
  tags: [airout]
- id: ma-air-13
  text: 把睡了一夜的臥室窗打開，換掉裡頭的舊空氣。
  tags: [airout]
- id: ma-air-14
  text: 開窗後把門也留一道縫，讓氣流有出口穿過去。
  tags: [airout]
- id: ma-air-15
  text: 推開氣密窗的上排通風口，讓外氣持續滲進來。
  tags: [airout]
- id: ma-air-16
  text: 把窗開到底，讓風把窗簾輕輕吹起來。
  tags: [airout]
- id: ma-air-17
  text: 走到陽台門邊拉開，讓外頭的空氣灌進客廳。
  tags: [airout]
- id: ma-air-18
  text: 開窗，閉上眼睛聞一聞外面空氣裡的氣味。
  tags: [airout]
- id: ma-air-19
  text: 把車窗降下一半，讓移動時的風替車內換氣。
  tags: [airout]
- id: ma-air-20
  text: 開窗後把臉朝向風來的方向，好好吸一大口。
  tags: [airout]
