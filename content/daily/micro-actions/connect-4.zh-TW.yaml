# 微行動 · 連結他人（第四批）。兩分鐘內做得完的小動作。
- id: ma-connect-46
  text: 替一位朋友的生日，先在行事曆上標起來。
  tags: [connect]
- id: ma-connect-47
  text: 翻出通訊錄，把一個一直沒存的號碼存起來。
  tags: [connect]
- id: ma-connect-48
  text: 想一位好久沒見的人，寫下你想對他說的一句話。
  tags: [connect]
- id: ma-connect-49
  text: 替一位朋友，想一件你欣賞他的事。
  tags: [connect]
- id: ma-connect-50
  text: 把一張和朋友的合照，設成聊天室的背景。
  tags: [connect]
- id: ma-connect-51
  text: 替一位朋友的名字，在手機裡設一個專屬鈴聲。
  tags: [connect]
- id: ma-connect-52
  text: 找出一位朋友推薦過、你想看看的東西，記下來。
  tags: [connect]
- id: ma-connect-53
  text: 替一位朋友，想一個適合他的小禮物點子。
  tags: [connect]
- id: ma-connect-54
  text: 挑一張全家福，設成手機的鎖定畫面。
  tags: [connect]
- id: ma-connect-55
  text: 替一位朋友的聯絡人資料，補上一張大頭照。
  tags: [connect]
- id: ma-connect-56
  text: 想三個最近幫過你的人，把名字寫下來。
  tags: [connect]
- id: ma-connect-57
  text: 替一場想辦的小聚會，列出想邀的三個人。
  tags: [connect]
- id: ma-connect-58
  text: 翻出一位朋友以前送你的東西，看它一眼。
  tags: [connect]
- id: ma-connect-59
  text: 把一位朋友常說的口頭禪，回想一次。
  tags: [connect]
- id: ma-connect-60
  text: 替下次見面想聊的話題，先記下一個。
  tags: [connect]
- id: ma-connect-61
  text: 找出一段和朋友的舊對話，往上滑讀一段。
  tags: [connect]
- id: ma-connect-62
  text: 替一位朋友，收藏一首你覺得他會喜歡的歌。
  tags: [connect]
- id: ma-connect-63
  text: 替一位朋友，在心裡配一個代表他的顏色。
  tags: [connect]
- id: ma-connect-64
  text: 想一位你想更常聯絡的人，把他釘到聊天列表最上面。
  tags: [connect]
- id: ma-connect-65
  text: 替一位朋友，回想你們第一次見面的場景。
  tags: [connect]
