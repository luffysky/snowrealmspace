# 微行動：冰箱與廚房收納（兩分鐘內做得完，祈使句）
- id: ma-fridge-01
  text: 丟掉冰箱裡一樣已經過期的食材
  tags: [fridge]
- id: ma-fridge-02
  text: 擦乾淨冰箱最上層那一格
  tags: [fridge]
- id: ma-fridge-03
  text: 把冰箱門邊的飲料排成一直線
  tags: [fridge]
- id: ma-fridge-04
  text: 清出冷凍庫其中一角的空間
  tags: [fridge]
- id: ma-fridge-05
  text: 把調味料架上的瓶罐標籤朝外擺齊
  tags: [fridge]
- id: ma-fridge-06
  text: 收走冰箱裡已經吃完的空盒子
  tags: [fridge]
- id: ma-fridge-07
  text: 把散落的醬料包集中放進一個小盒
  tags: [fridge]
- id: ma-fridge-08
  text: 檢查一瓶開封調味料的保存期限並決定去留
  tags: [fridge]
- id: ma-fridge-09
  text: 把冰箱裡同類的蔬菜集中放進一個抽屜
  tags: [fridge]
- id: ma-fridge-10
  text: 擦掉冰箱把手上的手印
  tags: [fridge]
- id: ma-fridge-11
  text: 把冷凍的肉品依種類分開疊放
  tags: [fridge]
- id: ma-fridge-12
  text: 丟掉一份結霜到看不出內容的冷凍食物
  tags: [fridge]
- id: ma-fridge-13
  text: 把喝到一半的瓶裝飲料轉緊瓶蓋再歸位
  tags: [fridge]
- id: ma-fridge-14
  text: 整理蛋盒，把蛋依日期往前排
  tags: [fridge]
- id: ma-fridge-15
  text: 把廚房檯面上的一罐調味料放回架上
  tags: [fridge]
- id: ma-fridge-16
  text: 擦拭調味料架上滴落的油漬
  tags: [fridge]
- id: ma-fridge-17
  text: 把冰箱裡的剩菜倒進同一個保鮮盒
  tags: [fridge]
- id: ma-fridge-18
  text: 清掉蔬果抽屜底部的一片爛葉
  tags: [fridge]
- id: ma-fridge-19
  text: 把常用的醬料移到冰箱門最順手的位置
  tags: [fridge]
- id: ma-fridge-20
  text: 丟掉冷藏門邊過期的一瓶醬料
  tags: [fridge]
