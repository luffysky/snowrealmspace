# 微行動 · 玩心（續）。兩分鐘內做得完。
- id: ma-play-06
  text: 用手指在桌面敲一段節奏。
  tags: [play]
- id: ma-play-07
  text: 對著鏡子扮一個鬼臉。
  tags: [play]
- id: ma-play-08
  text: 幫手邊一個東西取一個新名字。
  tags: [play]
- id: ma-play-09
  text: 把兩個不相關的詞湊成一個新詞。
  tags: [play]
- id: ma-play-10
  text: 用身邊的小東西疊一座塔。
  tags: [play]
- id: ma-play-11
  text: 挑一種動物，模仿牠一個動作。
  tags: [play]
- id: ma-play-12
  text: 用氣音吹一小段口哨。
  tags: [play]
- id: ma-play-13
  text: 把一張紙摺成隨便一個形狀。
  tags: [play]
- id: ma-play-14
  text: 替今天配一個代表色。
  tags: [play]
- id: ma-play-15
  text: 用腳趾夾起地上一樣小東西。
  tags: [play]
- id: ma-play-16
  text: 給窗外經過的人，編一句台詞。
  tags: [play]
- id: ma-play-17
  text: 學一個卡通角色的說話聲音。
  tags: [play]
- id: ma-play-18
  text: 把雙手比成相機，框住一個畫面。
  tags: [play]
- id: ma-play-19
  text: 想三個以「雪」開頭的詞。
  tags: [play]
- id: ma-play-20
  text: 閉一隻眼，用手指量遠方物體的大小。
  tags: [play]
- id: ma-play-21
  text: 只用眉毛，做出三種表情。
  tags: [play]
- id: ma-play-22
  text: 幫此刻的房間，想一個電影片名。
  tags: [play]
- id: ma-play-23
  text: 把一句話倒著唸出來。
  tags: [play]
- id: ma-play-24
  text: 用手影在牆上比出一隻動物。
  tags: [play]
- id: ma-play-25
  text: 拿一支筆當麥克風，念一句開場白。
  tags: [play]
