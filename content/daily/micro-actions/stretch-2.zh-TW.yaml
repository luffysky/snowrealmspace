# 微行動 · 伸展與舒展（續）。兩分鐘內做得完。
- id: ma-stretch-21
  text: 坐著把腳踝順時針繞五圈，再逆時針繞五圈。
  tags: [stretch]
- id: ma-stretch-22
  text: 把一隻手的手指，一根一根輕輕往手背方向扳開，換手。
  tags: [stretch]
- id: ma-stretch-23
  text: 打赤腳把腳趾用力抓緊再張開，重複十次。
  tags: [stretch]
- id: ma-stretch-24
  text: 手腕往內、往外各繞五圈，鬆開整個手腕。
  tags: [stretch]
- id: ma-stretch-25
  text: 坐正把兩腳掌相對，讓膝蓋往外自然放鬆，拉開大腿內側。
  tags: [stretch]
- id: ma-stretch-26
  text: 站弓箭步，把後腳那側的髖往前推，伸展髖前側，換腳。
  tags: [stretch]
- id: ma-stretch-27
  text: 手掌貼牆、手指朝上，身體微轉開，伸展前臂外側，換手。
  tags: [stretch]
- id: ma-stretch-28
  text: 把下巴往內收做出雙下巴，伸展後頸上緣停六秒。
  tags: [stretch]
- id: ma-stretch-29
  text: 四足跪姿學貓拱起背再塌下腰，交替五次活動脊椎。
  tags: [stretch]
- id: ma-stretch-30
  text: 雙手撐膝慢慢蹲低，把髖往下沉停十秒再起身。
  tags: [stretch]
- id: ma-stretch-31
  text: 把兩片肩胛骨往中間夾緊停五秒再放鬆，重複五次。
  tags: [stretch]
- id: ma-stretch-32
  text: 頭緩緩轉向右後方看肩膀停五秒，再換左邊。
  tags: [stretch]
- id: ma-stretch-33
  text: 坐著把一腳踝翹到另一膝上，讓腳掌往內外翻動十次，換邊。
  tags: [stretch]
- id: ma-stretch-34
  text: 把一邊肩膀往耳朵聳起停三秒再落下，換邊重複。
  tags: [stretch]
- id: ma-stretch-35
  text: 雙臂往前平舉，手掌往前畫小圈十次，再往後畫十次。
  tags: [stretch]
- id: ma-stretch-36
  text: 抬起一腳，用腳尖在空中慢慢寫自己的名字，換腳。
  tags: [stretch]
- id: ma-stretch-37
  text: 坐正把上身往斜前方四十五度延伸，拉開後背一側，換邊。
  tags: [stretch]
- id: ma-stretch-38
  text: 站著把一腳交叉到另一腳前，身體往側邊延伸拉開腰側，換邊。
  tags: [stretch]
- id: ma-stretch-39
  text: 靠牆站，把後腦、上背、臀部都貼平牆面停十秒。
  tags: [stretch]
- id: ma-stretch-40
  text: 把腳跟踮起再落下，重複十五次活動小腿與腳踝。
  tags: [stretch]
