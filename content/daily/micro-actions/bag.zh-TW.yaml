# 微行動 · 隨身物整理。兩分鐘內做得完。
- id: ma-bag-01
  text: 清一清包包裡的收據和雜物。
  tags: [bag]
- id: ma-bag-02
  text: 把錢包裡過期的發票抽出來。
  tags: [bag]
- id: ma-bag-03
  text: 把鑰匙圈上不再用的鑰匙拆下來。
  tags: [bag]
- id: ma-bag-04
  text: 把口袋裡的零錢倒進小盒子。
  tags: [bag]
- id: ma-bag-05
  text: 把手機桌面第一頁的圖示重新排一下。
  tags: [bag]
- id: ma-bag-06
  text: 把包包側袋裡的東西全拿出來看一遍。
  tags: [bag]
- id: ma-bag-07
  text: 把錢包裡很少用的集點卡挑兩張收好。
  tags: [bag]
- id: ma-bag-08
  text: 把手機裡三個沒在用的 App 移到同一個資料夾。
  tags: [bag]
- id: ma-bag-09
  text: 把背包拉鍊縫裡卡的碎屑撥掉。
  tags: [bag]
- id: ma-bag-10
  text: 把散在包底的筆和便條紙集中到筆袋。
  tags: [bag]
- id: ma-bag-11
  text: 把鑰匙掛回固定的掛勾或包內扣環。
  tags: [bag]
- id: ma-bag-12
  text: 把錢包裡的紙鈔面朝同一個方向理齊。
  tags: [bag]
- id: ma-bag-13
  text: 把手機桌布換成一張讓眼睛舒服的圖。
  tags: [bag]
- id: ma-bag-14
  text: 把包包裡的耳機線繞好收進小袋。
  tags: [bag]
- id: ma-bag-15
  text: 把外套口袋翻出來檢查有沒有遺落的小物。
  tags: [bag]
- id: ma-bag-16
  text: 把手機通知欄裡累積的提醒逐一清掉。
  tags: [bag]
- id: ma-bag-17
  text: 把悠遊卡或門禁卡放到包裡固定的夾層。
  tags: [bag]
- id: ma-bag-18
  text: 把用完的護唇膏或空包裝從包裡丟掉。
  tags: [bag]
- id: ma-bag-19
  text: 把手機截圖相簿裡不需要的圖刪掉幾張。
  tags: [bag]
- id: ma-bag-20
  text: 把常用鑰匙和備用鑰匙分成兩串。
  tags: [bag]
