# 微行動 · 記錄（續）。兩分鐘內做得完。
- id: ma-note-06
  text: 記下一個突然冒出的靈感，一句話就好。
  tags: [note]
- id: ma-note-07
  text: 在正在讀的段落畫一條線標起來。
  tags: [note]
- id: ma-note-08
  text: 拍一張照，記下等一下要處理的一件待辦。
  tags: [note]
- id: ma-note-09
  text: 寫下今天的一行日記。
  tags: [note]
- id: ma-note-10
  text: 寫下今天做的一個小決定。
  tags: [note]
- id: ma-note-11
  text: 記下昨晚或最近做的一個夢。
  tags: [note]
- id: ma-note-12
  text: 記下今天吃到覺得不錯的一樣東西。
  tags: [note]
- id: ma-note-13
  text: 記下影片裡想回頭再看的一個時間點。
  tags: [note]
- id: ma-note-14
  text: 寫下最近想買的一樣東西。
  tags: [note]
- id: ma-note-15
  text: 記下一個想謝謝的人，還有原因。
  tags: [note]
- id: ma-note-16
  text: 寫下今天最花時間的一件事。
  tags: [note]
- id: ma-note-17
  text: 拍下出門前要記得帶的一樣東西。
  tags: [note]
- id: ma-note-18
  text: 記下今天遇到的一個小巧合。
  tags: [note]
- id: ma-note-19
  text: 寫下一個最近想學會的小技能。
  tags: [note]
- id: ma-note-20
  text: 記下今天幫過你、或你幫過的一個人。
  tags: [note]
- id: ma-note-21
  text: 標下正在讀的書讀到第幾頁。
  tags: [note]
- id: ma-note-22
  text: 記下今天第一個讓你分心的東西。
  tags: [note]
- id: ma-note-23
  text: 寫下一個想在這個月試試看的小計畫。
  tags: [note]
- id: ma-note-24
  text: 記下今天走過、覺得順眼的一個角落。
  tags: [note]
- id: ma-note-25
  text: 寫下一句今天對你有用的提醒。
  tags: [note]
