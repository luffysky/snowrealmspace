# 微行動 · 身體（第四批）。離開螢幕動一動。
- id: ma-body-57
  text: 站著把雙手往頭頂拍手，連續拍十下。
  tags: [body]
- id: ma-body-58
  text: 坐著把兩隻腳跟用力往地板踩，停三秒再放鬆，做八次。
  tags: [body]
- id: ma-body-59
  text: 站著讓膝蓋微微彎曲，把身體上下輕輕彈動十五次。
  tags: [body]
- id: ma-body-60
  text: 坐著把腳尖往前踩再往上回勾，一前一後交替做十五次。
  tags: [body]
- id: ma-body-61
  text: 用十根手指的指腹，輕輕敲遍整個頭頂。
  tags: [body]
- id: ma-body-62
  text: 把舌頭沿著上下排牙齒內側繞圈，順逆時針各五圈。
  tags: [body]
- id: ma-body-63
  text: 把雙手握拳收到胸前，往前快速交替出拳二十下。
  tags: [body]
- id: ma-body-64
  text: 把雙腳打開與肩同寬，左右輕輕搖晃臀部十次。
  tags: [body]
- id: ma-body-65
  text: 坐著把兩隻手臂往前平舉，手指用力張開再握拳，重複十次。
  tags: [body]
- id: ma-body-66
  text: 用兩手拇指按住後腦與脖子交界，輕輕按壓繞圈幾下。
  tags: [body]
- id: ma-body-67
  text: 站著把重心放到腳掌前緣，前後緩緩晃動十次找平衡。
  tags: [body]
- id: ma-body-68
  text: 用手指從眉心往兩側太陽穴輕輕抹開，來回幾次。
  tags: [body]
- id: ma-body-69
  text: 把兩隻手在背後互相扣住，輕輕左右擺動放鬆手臂。
  tags: [body]
- id: ma-body-70
  text: 站著把一隻腳的腳尖點在前方地面，再點向側邊，左右腳各做八次。
  tags: [body]
- id: ma-body-71
  text: 把兩手手指交扣放在後腦，輕輕把頭往後頂、手往前抵，停五秒。
  tags: [body]
- id: ma-body-72
  text: 站著把腳跟併攏、腳尖打開，再腳尖併攏腳跟打開，來回走幾步。
  tags: [body]
- id: ma-body-73
  text: 用手掌輕輕拍打臉頰兩側，喚醒精神幾下。
  tags: [body]
- id: ma-body-74
  text: 坐著把雙腿伸直、腳尖往前踢，左右腳交替踢十下。
  tags: [body]
- id: ma-body-75
  text: 站著把雙手叉腰，把骨盆往前頂再往後收，慢慢做八次。
  tags: [body]
- id: ma-body-76
  text: 把兩隻手臂在胸前上下交叉擺動，像剪刀一樣做十五下。
  tags: [body]
