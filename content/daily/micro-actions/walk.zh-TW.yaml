# 微行動 · 起身走動。兩分鐘內做得完。
- id: ma-walk-01
  text: 站起來，走到窗邊看看外面。
  tags: [walk]
- id: ma-walk-02
  text: 起身繞著房間慢慢走一圈。
  tags: [walk]
- id: ma-walk-03
  text: 走到廚房倒一杯水再回來。
  tags: [walk]
- id: ma-walk-04
  text: 站起身，踮著腳尖走幾步。
  tags: [walk]
- id: ma-walk-05
  text: 走到另一個房間，再走回來。
  tags: [walk]
- id: ma-walk-06
  text: 起身走到門口，把門打開透口氣。
  tags: [walk]
- id: ma-walk-07
  text: 站起來，原地走動三十秒。
  tags: [walk]
- id: ma-walk-08
  text: 走到最近的樓梯，上下走一小段。
  tags: [walk]
- id: ma-walk-09
  text: 起身走去陽台站一會兒。
  tags: [walk]
- id: ma-walk-10
  text: 站起來，倒退著慢慢走幾步。
  tags: [walk]
- id: ma-walk-11
  text: 走到走廊盡頭，轉身走回座位。
  tags: [walk]
- id: ma-walk-12
  text: 起身把桌上的空杯拿去水槽。
  tags: [walk]
- id: ma-walk-13
  text: 站起來，沿著房間邊緣走一圈。
  tags: [walk]
- id: ma-walk-14
  text: 走到信箱看看有沒有信件。
  tags: [walk]
- id: ma-walk-15
  text: 起身走到冰箱前，再走回來。
  tags: [walk]
- id: ma-walk-16
  text: 站起身，大步走到房間另一端。
  tags: [walk]
- id: ma-walk-17
  text: 走去洗個手，順便活動一下。
  tags: [walk]
- id: ma-walk-18
  text: 起身走到最遠的那扇窗前站著。
  tags: [walk]
- id: ma-walk-19
  text: 站起來，繞著椅子慢慢走兩圈。
  tags: [walk]
- id: ma-walk-20
  text: 走到玄關把鞋子擺整齊再回來。
  tags: [walk]
