# 微行動 · 停頓與發呆。兩分鐘內做得完。
- id: ma-pause-01
  text: 停下手邊的事，讓自己發呆三十秒。
  tags: [pause]
- id: ma-pause-02
  text: 把視線移到窗外，什麼都不想地看著遠方。
  tags: [pause]
- id: ma-pause-03
  text: 靠回椅背，手放在腿上，安靜地坐一分鐘。
  tags: [pause]
- id: ma-pause-04
  text: 閉上眼睛，讓腦袋放空，聽聽周圍的聲音。
  tags: [pause]
- id: ma-pause-05
  text: 盯著眼前的一個小物件，發呆地看著它的形狀。
  tags: [pause]
- id: ma-pause-06
  text: 把手機翻面蓋著，讓自己空白地待著一會兒。
  tags: [pause]
- id: ma-pause-07
  text: 讓思緒像雲一樣飄過，不去抓住任何一個念頭。
  tags: [pause]
- id: ma-pause-08
  text: 望著天花板，讓腦袋暫時停在原地不動。
  tags: [pause]
- id: ma-pause-09
  text: 放下正在打的字，讓雙手停在鍵盤上放空片刻。
  tags: [pause]
- id: ma-pause-10
  text: 看著手中飲料的水氣，發呆地等它慢慢散去。
  tags: [pause]
- id: ma-pause-11
  text: 停在原地，讓下一件事晚一分鐘再開始。
  tags: [pause]
- id: ma-pause-12
  text: 把目光落在牆上的某一點，就這樣停留一下。
  tags: [pause]
- id: ma-pause-13
  text: 讓自己整個人鬆下來，暫時不做任何決定。
  tags: [pause]
- id: ma-pause-14
  text: 看著光影在桌面上的樣子，什麼都不做地欣賞。
  tags: [pause]
- id: ma-pause-15
  text: 把椅子轉離螢幕，面對空白的牆面坐一會兒。
  tags: [pause]
- id: ma-pause-16
  text: 讓腦中的待辦清單暫停，先發呆一陣子。
  tags: [pause]
- id: ma-pause-17
  text: 盯著窗外的一棵樹，放空地看它的枝葉。
  tags: [pause]
- id: ma-pause-18
  text: 把雙手攤開放在桌上，安靜地空著這一刻。
  tags: [pause]
- id: ma-pause-19
  text: 讓自己出神一下，任由眼神失焦地放空。
  tags: [pause]
- id: ma-pause-20
  text: 停下所有動作，感覺自己只是坐在這裡的重量。
  tags: [pause]
