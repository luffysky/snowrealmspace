# 微行動 · 抽屜與收納盒整理。兩分鐘內做得完。
- id: ma-drawer-01
  text: 把最上層抽屜裡的東西全倒出來重新放回。
  tags: [drawer]
- id: ma-drawer-02
  text: 挑出抽屜裡一件用不到的雜物丟掉。
  tags: [drawer]
- id: ma-drawer-03
  text: 在收納盒裡放一片分隔板隔出兩格。
  tags: [drawer]
- id: ma-drawer-04
  text: 把散在桌面的迴紋針收進抽屜的小盒。
  tags: [drawer]
- id: ma-drawer-05
  text: 將抽屜裡的電線捲好綁上束帶。
  tags: [drawer]
- id: ma-drawer-06
  text: 把收納盒依大小疊成一落靠牆放。
  tags: [drawer]
- id: ma-drawer-07
  text: 替一個抽屜貼上寫著內容物的標籤。
  tags: [drawer]
- id: ma-drawer-08
  text: 把滾到抽屜深處的小物撥回前排。
  tags: [drawer]
- id: ma-drawer-09
  text: 將零錢從抽屜集中倒進一個小罐。
  tags: [drawer]
- id: ma-drawer-10
  text: 把收納盒裡混成一團的橡皮筋挑到單獨一格。
  tags: [drawer]
- id: ma-drawer-11
  text: 清出抽屜一格，只留下常用的文具。
  tags: [drawer]
- id: ma-drawer-12
  text: 把抽屜裡過期的收據抽出來丟掉。
  tags: [drawer]
- id: ma-drawer-13
  text: 將備用電池排進收納盒的一個分格。
  tags: [drawer]
- id: ma-drawer-14
  text: 把塞不進抽屜的雜物先移到盒子裡。
  tags: [drawer]
- id: ma-drawer-15
  text: 替收納盒換一個好開合的蓋子。
  tags: [drawer]
- id: ma-drawer-16
  text: 把抽屜裡的藥品依效期前後排好。
  tags: [drawer]
- id: ma-drawer-17
  text: 將糾纏成團的耳機線解開放進小盒。
  tags: [drawer]
- id: ma-drawer-18
  text: 把抽屜滑軌上的灰塵擦一下。
  tags: [drawer]
- id: ma-drawer-19
  text: 把收納盒裡多出來的贈品湯匙挑出來。
  tags: [drawer]
- id: ma-drawer-20
  text: 將抽屜關不緊那格的東西往下壓平。
  tags: [drawer]
