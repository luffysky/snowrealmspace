# 微行動 · 心緒/玩心/記錄/慢下來。兩分鐘內做得完。
- id: ma-mind-01
  text: 寫下現在心裡最上面的那句話。
  tags: [mind]
- id: ma-mind-02
  text: 幫此刻的心情，取一個名字。
  tags: [mind]
- id: ma-mind-03
  text: 想一件今天讓你嘴角上揚的事。
  tags: [mind]
- id: ma-mind-04
  text: 把一個煩惱，寫在紙上摺起來。
  tags: [mind]
- id: ma-mind-05
  text: 問自己：現在最需要的是什麼？
  tags: [mind]
- id: ma-play-01
  text: 隨手塗鴉三十秒，不用像什麼。
  tags: [play]
- id: ma-play-02
  text: 哼一段你記得的旋律。
  tags: [play]
- id: ma-play-03
  text: 用非慣用手寫下自己的名字。
  tags: [play]
- id: ma-play-04
  text: 替窗外的雲，想一個形狀。
  tags: [play]
- id: ma-play-05
  text: 想一個冷笑話，笑一下自己。
  tags: [play]
- id: ma-note-01
  text: 記下今天想留住的一個畫面。
  tags: [note]
- id: ma-note-02
  text: 寫一句話給一週後的自己。
  tags: [note]
- id: ma-note-03
  text: 列出三個此刻感官接收到的東西。
  tags: [note]
- id: ma-note-04
  text: 記下一個你想再去一次的地方。
  tags: [note]
- id: ma-note-05
  text: 寫下一個最近學到的小知識。
  tags: [note]
- id: ma-slow-01
  text: 慢慢喝完手邊的一口飲料。
  tags: [slow]
- id: ma-slow-02
  text: 用兩倍慢的速度，走到下一個房間。
  tags: [slow]
- id: ma-slow-03
  text: 什麼都不查，發呆三十秒。
  tags: [slow]
- id: ma-slow-04
  text: 慢慢摺好一件衣服。
  tags: [slow]
- id: ma-slow-05
  text: 用心洗一次手，感受水溫。
  tags: [slow]
