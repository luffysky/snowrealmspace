# 微行動 · 收尾與關機。兩分鐘內做得完。
- id: ma-windup-01
  text: 把手邊這份檔案存一次檔。
  tags: [windup]
- id: ma-windup-02
  text: 關掉現在沒在用的那盞燈。
  tags: [windup]
- id: ma-windup-03
  text: 把瀏覽器裡用不到的分頁一次關掉。
  tags: [windup]
- id: ma-windup-04
  text: 替明天要做的第一件事設個提醒。
  tags: [windup]
- id: ma-windup-05
  text: 把桌上的杯子拿去水槽。
  tags: [windup]
- id: ma-windup-06
  text: 關掉風扇或電暖器的電源。
  tags: [windup]
- id: ma-windup-07
  text: 把剛寫的筆記標上今天的日期。
  tags: [windup]
- id: ma-windup-08
  text: 把螢幕上開著的軟體逐一關閉。
  tags: [windup]
- id: ma-windup-09
  text: 拔掉已經充飽電的充電線。
  tags: [windup]
- id: ma-windup-10
  text: 把待辦清單最上面那項標成完成。
  tags: [windup]
- id: ma-windup-11
  text: 把散在桌上的筆收回筆筒。
  tags: [windup]
- id: ma-windup-12
  text: 把目前的專案資料夾命名歸位。
  tags: [windup]
- id: ma-windup-13
  text: 關掉電腦喇叭或音響的開關。
  tags: [windup]
- id: ma-windup-14
  text: 把明天要帶的東西放到門邊。
  tags: [windup]
- id: ma-windup-15
  text: 把工作群組的最後一則訊息回完。
  tags: [windup]
- id: ma-windup-16
  text: 清掉下載資料夾裡今天的暫存檔。
  tags: [windup]
- id: ma-windup-17
  text: 把椅子推回桌子底下。
  tags: [windup]
- id: ma-windup-18
  text: 關掉路由器旁邊那台不用的裝置。
  tags: [windup]
- id: ma-windup-19
  text: 把今天的收據或發票收進固定的盒子。
  tags: [windup]
- id: ma-windup-20
  text: 把明天的鬧鐘時間重新設定一次。
  tags: [windup]
