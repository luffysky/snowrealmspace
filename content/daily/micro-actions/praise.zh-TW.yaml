# 微行動 · 善待他人。兩分鐘內做得完。
- id: ma-praise-01
  text: 傳一句真心的稱讚給某個人。
  tags: [praise]
- id: ma-praise-02
  text: 對今天遇到的第一個人說一句早安。
  tags: [praise]
- id: ma-praise-03
  text: 幫身邊的人把掉在地上的東西撿起來。
  tags: [praise]
- id: ma-praise-04
  text: 稱讚一位同事今天穿搭的某個細節。
  tags: [praise]
- id: ma-praise-05
  text: 幫家人倒一杯溫水放到他桌上。
  tags: [praise]
- id: ma-praise-06
  text: 替下一個進門的人扶住門。
  tags: [praise]
- id: ma-praise-07
  text: 在群組裡替某人的點子按個讚並補一句好在哪。
  tags: [praise]
- id: ma-praise-08
  text: 對店員的服務說一聲你辛苦了。
  tags: [praise]
- id: ma-praise-09
  text: 幫朋友把他的水壺裝滿水。
  tags: [praise]
- id: ma-praise-10
  text: 記下某人今天做得好的一件事並當面告訴他。
  tags: [praise]
- id: ma-praise-11
  text: 替坐在角落的人遞一張紙巾或一支筆。
  tags: [praise]
- id: ma-praise-12
  text: 對外送員說一句路上小心。
  tags: [praise]
- id: ma-praise-13
  text: 把好吃的零食分一半給隔壁的人。
  tags: [praise]
- id: ma-praise-14
  text: 幫忙按住電梯等後面的人進來。
  tags: [praise]
- id: ma-praise-15
  text: 在留言底下寫一句具體的鼓勵給創作者。
  tags: [praise]
- id: ma-praise-16
  text: 替家人把他明天要穿的外套掛好。
  tags: [praise]
- id: ma-praise-17
  text: 對正在忙的人說一句需要幫忙就跟我講。
  tags: [praise]
- id: ma-praise-18
  text: 幫鄰座把散開的文件疊整齊。
  tags: [praise]
- id: ma-praise-19
  text: 把好用的小工具借給正在找的人。
  tags: [praise]
- id: ma-praise-20
  text: 對做完簡報的人說一句我覺得你講得很清楚。
  tags: [praise]
