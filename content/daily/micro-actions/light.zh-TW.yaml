# 微行動 · 窗邊與光線（兩分鐘內做得完）
- id: ma-light-01
  text: 走到窗前，把窗簾整個拉開到底。
  tags: [window]
- id: ma-light-02
  text: 打開窗戶，讓外面的空氣流進來一分鐘。
  tags: [window]
- id: ma-light-03
  text: 用一張濕紙巾擦掉窗玻璃上最明顯的一塊灰。
  tags: [window]
- id: ma-light-04
  text: 站在窗邊，看外面的景色整整一分鐘。
  tags: [window]
- id: ma-light-05
  text: 轉動百葉窗的葉片，讓光線斜斜地灑進房間。
  tags: [window]
- id: ma-light-06
  text: 把一盆植物端到窗台上採光最好的位置。
  tags: [window]
- id: ma-light-07
  text: 拉開紗窗，把手伸出去感受一下外面的溫度。
  tags: [window]
- id: ma-light-08
  text: 把擋在窗前的雜物挪開，讓整片窗露出來。
  tags: [window]
- id: ma-light-09
  text: 搬一張椅子到窗邊，坐下來曬一會兒太陽。
  tags: [window]
- id: ma-light-10
  text: 用手指在起霧的玻璃上畫一個記號。
  tags: [window]
- id: ma-light-11
  text: 抬頭找找窗外的天空現在是什麼顏色。
  tags: [window]
- id: ma-light-12
  text: 把窗簾往兩側束好，用綁帶固定住。
  tags: [window]
- id: ma-light-13
  text: 數一數窗外能看見幾棵樹。
  tags: [window]
- id: ma-light-14
  text: 把窗台上的灰塵用乾布抹一遍。
  tags: [window]
- id: ma-light-15
  text: 開一條窗縫，聽聽外面傳來的聲音。
  tags: [window]
- id: ma-light-16
  text: 把桌子上的水杯移到有陽光照到的地方。
  tags: [window]
- id: ma-light-17
  text: 觀察光線落在地板上的形狀，看它停在哪裡。
  tags: [window]
- id: ma-light-18
  text: 把窗邊枯掉的葉子摘下來丟掉。
  tags: [window]
- id: ma-light-19
  text: 換個角度站，讓陽光正好照在臉上一下下。
  tags: [window]
- id: ma-light-20
  text: 把窗戶推到最開，深呼吸三口外面的空氣。
  tags: [window]
