# 微行動：排列整齊（對齊）
- id: ma-align-01
  text: 把桌上的筆全部筆尖朝同一個方向排好。
  tags: [align]
- id: ma-align-02
  text: 將書架上的書背推到同一條線對齊。
  tags: [align]
- id: ma-align-03
  text: 把門口的鞋子一雙雙擺正，腳尖朝外。
  tags: [align]
- id: ma-align-04
  text: 讓櫃子裡的杯子把手全部朝向同一邊。
  tags: [align]
- id: ma-align-05
  text: 把鍵盤和滑鼠擺回與桌緣平行的位置。
  tags: [align]
- id: ma-align-06
  text: 將沙發上的抱枕擺成整齊的一排。
  tags: [align]
- id: ma-align-07
  text: 把遙控器並排放進固定的收納格。
  tags: [align]
- id: ma-align-08
  text: 讓餐桌上的餐墊四邊與桌緣對齊。
  tags: [align]
- id: ma-align-09
  text: 把牆上歪掉的相框輕輕扶正。
  tags: [align]
- id: ma-align-10
  text: 將充電線捲順，沿桌邊擺成一直線。
  tags: [align]
- id: ma-align-11
  text: 把抽屜裡的湯匙叉子分格排整齊。
  tags: [align]
- id: ma-align-12
  text: 讓浴室的瓶罐標籤全部朝向正前方。
  tags: [align]
- id: ma-align-13
  text: 把桌上的便條紙疊成邊角對齊的一落。
  tags: [align]
- id: ma-align-14
  text: 將椅子推正，靠背與桌子成直角。
  tags: [align]
- id: ma-align-15
  text: 把調味料罐依高矮在檯面上排成一列。
  tags: [align]
- id: ma-align-16
  text: 讓衣架在桿子上全部朝同一個方向掛好。
  tags: [align]
- id: ma-align-17
  text: 把桌上的杯墊疊正，邊緣切齊。
  tags: [align]
- id: ma-align-18
  text: 將滑鼠墊擺回與螢幕中線對齊的位置。
  tags: [align]
- id: ma-align-19
  text: 把地墊踩正，讓它與門框平行。
  tags: [align]
- id: ma-align-20
  text: 讓茶几上的雜誌邊角疊成整齊一角。
  tags: [align]
