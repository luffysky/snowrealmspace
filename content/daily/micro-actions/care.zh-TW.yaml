# 微行動 · 學習/善待自己/專案/整理。兩分鐘內做得完。
- id: ma-learn-01
  text: 查一個你今天好奇的詞。
  tags: [learn]
- id: ma-learn-02
  text: 讀一段跟工作無關的東西。
  tags: [learn]
- id: ma-learn-03
  text: 看一個你欣賞的作品，找出一個細節。
  tags: [learn]
- id: ma-kind-01
  text: 對自己說一句今天做得好的地方。
  tags: [kindness]
- id: ma-kind-02
  text: 原諒自己一件今天沒做完的事。
  tags: [kindness]
- id: ma-kind-03
  text: 花兩分鐘做一件純粹讓自己開心的事。
  tags: [kindness]
- id: ma-kind-04
  text: 對鏡子裡的自己笑一下。
  tags: [kindness]
- id: ma-proj-01
  text: 替一個擱著的專案寫下下一步。
  tags: [project]
- id: ma-proj-02
  text: 把一個大任務拆成三小步。
  tags: [project]
- id: ma-proj-03
  text: 替目前的專案取一個代號。
  tags: [project]
- id: ma-proj-04
  text: 把一個想法記進捕捉匣。
  tags: [project]
- id: ma-tidy-01
  text: 清空一個小抽屜或資料夾。
  tags: [tidy]
- id: ma-tidy-02
  text: 刪掉相簿裡三張不要的照片。
  tags: [tidy]
- id: ma-tidy-03
  text: 把桌面圖示收進一個資料夾。
  tags: [tidy]
- id: ma-tidy-04
  text: 整理一下今天開著的分頁。
  tags: [tidy]
- id: ma-tidy-05
  text: 把一個檔案改成看得懂的名字。
  tags: [tidy]
