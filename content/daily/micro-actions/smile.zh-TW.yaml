# 微行動 · 表情與微笑。兩分鐘內做得完。
- id: ma-smile-01
  text: 對著鏡子，給自己一個微笑。
  tags: [smile]
- id: ma-smile-02
  text: 輕輕上揚嘴角，維持十秒鐘。
  tags: [smile]
- id: ma-smile-03
  text: 用手指按摩兩側臉頰，畫小圈放鬆。
  tags: [smile]
- id: ma-smile-04
  text: 誇張地張大嘴巴，再慢慢閉起來。
  tags: [smile]
- id: ma-smile-05
  text: 把舌頭抵住上顎，讓下巴自然鬆開。
  tags: [smile]
- id: ma-smile-06
  text: 鼓起雙頰含著空氣，停一下再吐掉。
  tags: [smile]
- id: ma-smile-07
  text: 想一件好笑的事，讓自己笑出聲。
  tags: [smile]
- id: ma-smile-08
  text: 用指腹輕輕撫平緊繃的下巴線條。
  tags: [smile]
- id: ma-smile-09
  text: 眨眨眼睛，再對空氣拋個俏皮的表情。
  tags: [smile]
- id: ma-smile-10
  text: 咬字般地念一次「啊咿嗚欸喔」，活動嘴部。
  tags: [smile]
- id: ma-smile-11
  text: 把嘴唇噘成圓形，維持三秒再放開。
  tags: [smile]
- id: ma-smile-12
  text: 對窗外的路人或風景，露出淺淺笑意。
  tags: [smile]
- id: ma-smile-13
  text: 用兩手食指往上輕推嘴角，感受微笑肌。
  tags: [smile]
- id: ma-smile-14
  text: 假裝吹熄一根蠟燭，緩緩把氣吹出去。
  tags: [smile]
- id: ma-smile-15
  text: 讓額頭完全放平，抹去臉上所有用力。
  tags: [smile]
- id: ma-smile-16
  text: 對著手機自拍鏡頭，做一個最放鬆的表情。
  tags: [smile]
- id: ma-smile-17
  text: 上下咬合牙齒幾下，再讓臉頰垂鬆。
  tags: [smile]
- id: ma-smile-18
  text: 把嘴角往兩旁拉成大大的咧嘴笑。
  tags: [smile]
- id: ma-smile-19
  text: 用溫熱的掌心捂住雙眼，讓眼周休息。
  tags: [smile]
- id: ma-smile-20
  text: 對心裡想起的某個人，在臉上綻放一個笑。
  tags: [smile]
