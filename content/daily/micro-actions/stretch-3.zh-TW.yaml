# 微行動 · 伸展與舒展（第三批）。兩分鐘內做得完。
- id: ma-stretch-41
  text: 站在門框旁，把一隻手臂伸直貼住門框，身體往前轉開拉開胸口，換邊。
  tags: [stretch]
- id: ma-stretch-42
  text: 雙手撐在桌緣，把腳往後退、上身往下沉，拉開腋下與側背停十秒。
  tags: [stretch]
- id: ma-stretch-43
  text: 兩手在胸前環抱住自己，把上背往後推成圓弧，停八秒。
  tags: [stretch]
- id: ma-stretch-44
  text: 讓雙手鬆鬆垂在身側，前後大幅擺動十次，甩開肩膀。
  tags: [stretch]
- id: ma-stretch-45
  text: 把頭往斜前方四十五度慢慢低下，感覺後頸一側拉開，換邊。
  tags: [stretch]
- id: ma-stretch-46
  text: 張大嘴巴像打個大哈欠，停三秒再緩緩閉上，放鬆下顎。
  tags: [stretch]
- id: ma-stretch-47
  text: 雙掌在胸前合十，慢慢往下壓到手腕拉開，停八秒。
  tags: [stretch]
- id: ma-stretch-48
  text: 跪坐把雙手往前方地面延伸，額頭貼近地面，放鬆整條下背。
  tags: [stretch]
- id: ma-stretch-49
  text: 趴下用兩隻手肘撐起上身，把肚子往下沉，伸展腹部前側。
  tags: [stretch]
- id: ma-stretch-50
  text: 仰躺把雙膝一起倒向右邊、頭轉向左邊扭開下背，換邊。
  tags: [stretch]
- id: ma-stretch-51
  text: 仰躺把兩邊膝蓋一起抱向胸口，輕輕抱住停十秒。
  tags: [stretch]
- id: ma-stretch-52
  text: 盤腿坐正，一手撐在身後，上身往同側轉扭轉脊椎，換邊。
  tags: [stretch]
- id: ma-stretch-53
  text: 站姿雙腳大開，把重心移到一邊屈膝下蹲，拉開另一腿內側，換邊。
  tags: [stretch]
- id: ma-stretch-54
  text: 把一隻腳跟放到前方椅面上，上身往腳尖前傾拉大腿後側，換腳。
  tags: [stretch]
- id: ma-stretch-55
  text: 用一手把另一手的大拇指輕輕往手背方向扳開，伸展拇指根部，換手。
  tags: [stretch]
- id: ma-stretch-56
  text: 坐著伸直一腿，用手把腳尖往身體方向帶，拉開小腿肚，換腳。
  tags: [stretch]
- id: ma-stretch-57
  text: 靠牆把手臂彎成直角貼住牆面，上身往前轉開拉開肩前，換邊。
  tags: [stretch]
- id: ma-stretch-58
  text: 站著把一隻腳往身體另一側跨過去踩地，髖往外推拉開髖外側，換邊。
  tags: [stretch]
- id: ma-stretch-59
  text: 雙臂往兩側平舉與肩同高，掌心慢慢往後轉到底打開前胸，停八秒。
  tags: [stretch]
- id: ma-stretch-60
  text: 坐著把雙手抱在後腦，手肘往兩側打開、上身微往後靠，展開前胸停六秒。
  tags: [stretch]
