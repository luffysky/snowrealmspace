# 微行動 · 休息（續）。兩分鐘內做得完。
- id: ma-rest-06
  text: 泡一杯溫熱的茶，捧在手心。
  tags: [rest]
- id: ma-rest-07
  text: 把雙手搓熱，貼在後頸上。
  tags: [rest]
- id: ma-rest-08
  text: 用溫水洗一把臉。
  tags: [rest]
- id: ma-rest-09
  text: 慢慢轉動脖子，畫幾個圓。
  tags: [rest]
- id: ma-rest-10
  text: 把手錶或飾品取下，鬆一鬆手腕。
  tags: [rest]
- id: ma-rest-11
  text: 整個背靠上椅背，把重量交出去。
  tags: [rest]
- id: ma-rest-12
  text: 打一個很大的哈欠，不用忍。
  tags: [rest]
- id: ma-rest-13
  text: 幫自己披上一條薄毯。
  tags: [rest]
- id: ma-rest-14
  text: 鬆開下巴，讓上下牙齒分開。
  tags: [rest]
- id: ma-rest-15
  text: 用指腹輕輕按壓眉心。
  tags: [rest]
- id: ma-rest-16
  text: 脫掉鞋子，讓腳趾張開動一動。
  tags: [rest]
- id: ma-rest-17
  text: 喝一大口白開水。
  tags: [rest]
- id: ma-rest-18
  text: 高舉雙臂伸個懶腰，再垂下來。
  tags: [rest]
- id: ma-rest-19
  text: 換上一件寬鬆的衣服。
  tags: [rest]
- id: ma-rest-20
  text: 坐到有陽光的地方，曬一下手背。
  tags: [rest]
- id: ma-rest-21
  text: 揉一揉痠的肩頸，捏個幾下。
  tags: [rest]
- id: ma-rest-22
  text: 把腳抬高，擱在前面的椅子上。
  tags: [rest]
- id: ma-rest-23
  text: 用熱毛巾敷一下眼睛。
  tags: [rest]
- id: ma-rest-24
  text: 讓雙手垂在身體兩側，輕輕甩一甩。
  tags: [rest]
- id: ma-rest-25
  text: 把枕頭抱在懷裡，靠著坐一會兒。
  tags: [rest]
