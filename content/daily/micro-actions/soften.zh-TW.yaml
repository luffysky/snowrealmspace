# 微行動 · 柔軟觸感。兩分鐘內做得完。
- id: ma-soft-01
  text: 把抱枕抱進懷裡，讓臉頰貼上去停一會兒。
  tags: [soften]
- id: ma-soft-02
  text: 用手掌慢慢撫過毛毯的表面，感受絨毛的方向。
  tags: [soften]
- id: ma-soft-03
  text: 挑一件最軟的衣服穿上，讓布料貼著皮膚。
  tags: [soften]
- id: ma-soft-04
  text: 把娃娃放在膝蓋上，輕輕拍它的背幾下。
  tags: [soften]
- id: ma-soft-05
  text: 摸摸自己耳垂的柔軟，用指腹輕輕捏一下。
  tags: [soften]
- id: ma-soft-06
  text: 找一條圍巾繞在脖子上，讓它鬆鬆地垂著。
  tags: [soften]
- id: ma-soft-07
  text: 把手伸進毛衣袖口，讓內裡的柔軟包住手腕。
  tags: [soften]
- id: ma-soft-08
  text: 用臉去蹭剛曬過的棉被，聞一聞它的味道。
  tags: [soften]
- id: ma-soft-09
  text: 把兩隻襪子疊在一起，捏出那團鬆軟的觸感。
  tags: [soften]
- id: ma-soft-10
  text: 摸摸寵物背上最軟的那撮毛，順著它撫下去。
  tags: [soften]
- id: ma-soft-11
  text: 拿一塊絨布擦手，讓它在指縫間滑過。
  tags: [soften]
- id: ma-soft-12
  text: 把毛毯捲成一團，整個人靠上去躺個一分鐘。
  tags: [soften]
- id: ma-soft-13
  text: 用棉花棒的柔軟那端，輕輕點過手背。
  tags: [soften]
- id: ma-soft-14
  text: 抱起一顆大玩偶，把下巴擱在它頭頂。
  tags: [soften]
- id: ma-soft-15
  text: 摸一摸浴巾最厚的地方，把手指埋進去。
  tags: [soften]
- id: ma-soft-16
  text: 把柔軟的靠墊墊在腰後，往後靠著坐正。
  tags: [soften]
- id: ma-soft-17
  text: 用指尖摩擦法蘭絨睡褲的內裡，感受那份溫軟。
  tags: [soften]
- id: ma-soft-18
  text: 把手套戴上再脫下，記住裡層貼手的柔感。
  tags: [soften]
- id: ma-soft-19
  text: 找一顆毛絨鑰匙圈，握在掌心搓一搓。
  tags: [soften]
- id: ma-soft-20
  text: 把臉埋進枕頭，用鼻尖去感覺枕套的軟。
  tags: [soften]
