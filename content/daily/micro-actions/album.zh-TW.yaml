# 微行動 · 相簿整理。兩分鐘內做得完。
- id: ma-album-01
  text: 刪掉相簿裡三張模糊的照片。
  tags: [album]
- id: ma-album-02
  text: 從最近的旅行照片中選出一張你最喜歡的。
  tags: [album]
