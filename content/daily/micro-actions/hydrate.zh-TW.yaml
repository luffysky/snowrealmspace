# 微行動 · 補水與喝水。兩分鐘內做得完。
- id: ma-hydrate-01
  text: 倒一杯常溫水，慢慢喝完。
  tags: [hydrate]
- id: ma-hydrate-02
  text: 把水瓶裝滿，放到伸手就拿得到的地方。
  tags: [hydrate]
- id: ma-hydrate-03
  text: 切兩片檸檬丟進水裡，泡出淡淡風味再喝。
  tags: [hydrate]
- id: ma-hydrate-04
  text: 燒一壺熱水，泡一杯無咖啡因的茶。
  tags: [hydrate]
- id: ma-hydrate-05
  text: 站起來走到飲水機，接一杯溫水。
  tags: [hydrate]
- id: ma-hydrate-06
  text: 拿出馬克杯洗乾淨，倒滿一杯水放桌上。
  tags: [hydrate]
- id: ma-hydrate-07
  text: 抓一小把冰塊放進杯裡，倒水做成冰水喝。
  tags: [hydrate]
- id: ma-hydrate-08
  text: 把昨天沒喝完的舊水倒掉，重新裝一瓶新鮮的。
  tags: [hydrate]
- id: ma-hydrate-09
  text: 撕開一包電解質粉，沖進水杯攪勻喝下。
  tags: [hydrate]
- id: ma-hydrate-10
  text: 剝幾片小黃瓜丟進冷水，做一杯清爽的風味水。
  tags: [hydrate]
- id: ma-hydrate-11
  text: 用大杯子取代小杯子，一次裝滿五百毫升的水。
  tags: [hydrate]
- id: ma-hydrate-12
  text: 泡一壺花草茶，倒一杯溫熱的先喝。
  tags: [hydrate]
- id: ma-hydrate-13
  text: 在手機上設一個下次喝水的鬧鐘。
  tags: [hydrate]
- id: ma-hydrate-14
  text: 把水壺帶到身邊，先喝三大口再繼續手邊的事。
  tags: [hydrate]
- id: ma-hydrate-15
  text: 沖一杯溫蜂蜜水，小口啜飲。
  tags: [hydrate]
- id: ma-hydrate-16
  text: 剝一顆橘子配著一杯水一起吃下。
  tags: [hydrate]
- id: ma-hydrate-17
  text: 拿保溫瓶裝滿熱水，鎖緊蓋子隨身放著。
  tags: [hydrate]
- id: ma-hydrate-18
  text: 丟幾顆冷凍莓果進氣泡水，做一杯無糖飲料。
  tags: [hydrate]
- id: ma-hydrate-19
  text: 走到廚房裝一杯水，就地站著喝完再回來。
  tags: [hydrate]
- id: ma-hydrate-20
  text: 把水杯放在螢幕旁邊，每看完一段就喝一口。
  tags: [hydrate]
