# 微行動 · 姿勢與坐姿。兩分鐘內做得完。
- id: ma-posture-01
  text: 坐直背脊，讓後腰貼緊椅背。
  tags: [posture]
- id: ma-posture-02
  text: 把雙腳平放在地板上，腳掌完全踩實。
  tags: [posture]
- id: ma-posture-03
  text: 調整椅子高度，讓手肘彎成大約九十度。
  tags: [posture]
- id: ma-posture-04
  text: 慢慢把兩邊肩膀往後轉三圈，放鬆再放下。
  tags: [posture]
- id: ma-posture-05
  text: 把螢幕往上墊高，讓視線落在螢幕上緣。
  tags: [posture]
- id: ma-posture-06
  text: 收起下巴，讓頭頂輕輕往天花板延伸。
  tags: [posture]
- id: ma-posture-07
  text: 在後腰墊一顆小抱枕，支撐脊椎的弧度。
  tags: [posture]
- id: ma-posture-08
  text: 把鍵盤往身體拉近，讓手腕保持平放。
  tags: [posture]
- id: ma-posture-09
  text: 站起來，讓身體離開椅子伸個懶腰。
  tags: [posture]
- id: ma-posture-10
  text: 頭慢慢往左肩傾，停三秒，再換右邊。
  tags: [posture]
- id: ma-posture-11
  text: 雙手在背後互扣，把胸口往前打開。
  tags: [posture]
- id: ma-posture-12
  text: 把翹起的二郎腿放下，兩腿平均分擔重量。
  tags: [posture]
- id: ma-posture-13
  text: 深吸一口氣，把聳起的肩膀往下沉。
  tags: [posture]
- id: ma-posture-14
  text: 坐正後左右轉動身體，各扭一次伸展腰背。
  tags: [posture]
- id: ma-posture-15
  text: 把手機拿到與眼睛齊平，別再低頭滑。
  tags: [posture]
- id: ma-posture-16
  text: 讓臀部坐到椅面最深處，貼齊椅背根部。
  tags: [posture]
- id: ma-posture-17
  text: 用手指按壓後頸兩側，輕輕揉開緊繃。
  tags: [posture]
- id: ma-posture-18
  text: 把腳踝往前伸直再勾回，來回轉動幾圈。
  tags: [posture]
- id: ma-posture-19
  text: 移開擋在腳邊的雜物，讓雙腳有空間平放。
  tags: [posture]
- id: ma-posture-20
  text: 抬頭望向遠方的窗外，讓緊盯螢幕的頸部歸位。
  tags: [posture]
