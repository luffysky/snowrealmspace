# 微行動 · 線材與充電整理。兩分鐘內做得完。
- id: ma-cable-01
  text: 把纏成一團的充電線理順綁好。
  tags: [cable]
- id: ma-cable-02
  text: 用魔鬼氈束帶把桌下的延長線收成一束。
  tags: [cable]
- id: ma-cable-03
  text: 幫手機接上充電線補一點電。
  tags: [cable]
- id: ma-cable-04
  text: 拿酒精棉片擦掉充電頭上的灰塵。
  tags: [cable]
- id: ma-cable-05
  text: 把耳機線繞成圈收進收納袋。
  tags: [cable]
- id: ma-cable-06
  text: 拔掉沒在使用的充電器插頭。
  tags: [cable]
- id: ma-cable-07
  text: 挑出一條接觸不良的舊線丟進待淘汰盒。
  tags: [cable]
- id: ma-cable-08
  text: 在每條線的一端貼上標示用途的小標籤。
  tags: [cable]
- id: ma-cable-09
  text: 把散在抽屜裡的傳輸線集中到同一格。
  tags: [cable]
- id: ma-cable-10
  text: 用集線夾把螢幕後方的線固定在桌緣。
  tags: [cable]
- id: ma-cable-11
  text: 幫平板插上電讓它充飽。
  tags: [cable]
- id: ma-cable-12
  text: 把延長線多出來的線段捲短收好。
  tags: [cable]
- id: ma-cable-13
  text: 檢查延長線的開關是否關閉。
  tags: [cable]
- id: ma-cable-14
  text: 把行動電源接上線補電備用。
  tags: [cable]
- id: ma-cable-15
  text: 將充電線沿著桌腳用夾子理成一直線。
  tags: [cable]
- id: ma-cable-16
  text: 把兩條同款充電線分開放進不同位置避免搞混。
  tags: [cable]
- id: ma-cable-17
  text: 擦一擦手機充電孔周圍的棉絮。
  tags: [cable]
- id: ma-cable-18
  text: 把車用充電線繞好放回置物格。
  tags: [cable]
- id: ma-cable-19
  text: 找出最長那條線留在床頭固定使用。
  tags: [cable]
- id: ma-cable-20
  text: 把耳機的分岔線用夾子併攏。
  tags: [cable]
