# 微行動 · 拍一張照。兩分鐘內做得完。
- id: ma-photo-01
  text: 拿起手機，對著窗外拍一張此刻的天空。
  tags: [photo]
- id: ma-photo-02
  text: 把桌上正在用的東西拍下來。
  tags: [photo]
- id: ma-photo-03
  text: 對著手邊那杯飲料拍一張近照。
  tags: [photo]
- id: ma-photo-04
  text: 拍下腳邊或窗台上照進來的光。
  tags: [photo]
- id: ma-photo-05
  text: 把眼前這個角落原封不動拍一張。
  tags: [photo]
- id: ma-photo-06
  text: 對著自己拍一張現在的樣子。
  tags: [photo]
- id: ma-photo-07
  text: 拍一張腳下的地板或鞋子。
  tags: [photo]
- id: ma-photo-08
  text: 把牆上的影子拍進畫面裡。
  tags: [photo]
- id: ma-photo-09
  text: 拍下窗外正在經過的一輛車或一個人。
  tags: [photo]
- id: ma-photo-10
  text: 對著最近的一株植物拍一張葉子。
  tags: [photo]
- id: ma-photo-11
  text: 把手機翻過來，拍一張天花板。
  tags: [photo]
- id: ma-photo-12
  text: 拍下此刻手錶或螢幕上的時間。
  tags: [photo]
- id: ma-photo-13
  text: 把正在讀的那一頁翻開拍下來。
  tags: [photo]
- id: ma-photo-14
  text: 拍一張自己手心的紋路。
  tags: [photo]
- id: ma-photo-15
  text: 對著門口或走廊拍一張。
  tags: [photo]
- id: ma-photo-16
  text: 把桌上散落的小物排一排，拍下來。
  tags: [photo]
- id: ma-photo-17
  text: 拍一張最近一件顏色最鮮豔的東西。
  tags: [photo]
- id: ma-photo-18
  text: 對著鏡子拍一張反射的畫面。
  tags: [photo]
- id: ma-photo-19
  text: 蹲低一點，從地面的高度拍一張。
  tags: [photo]
- id: ma-photo-20
  text: 把此刻聽到聲音的來源拍進鏡頭。
  tags: [photo]
