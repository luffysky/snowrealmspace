# 微行動 · 洗衣與衣物打理（兩分鐘內做得完，祈使句，偏洗與晾）
- id: ma-laundry-01
  text: 把換下來的髒衣丟進洗衣籃。
  tags: [laundry]
- id: ma-laundry-02
  text: 按下洗衣機的啟動鍵，讓它開始運轉。
  tags: [laundry]
- id: ma-laundry-03
  text: 從洗衣籃抓一件深色衣物單獨分出來。
  tags: [laundry]
- id: ma-laundry-04
  text: 把一件洗好的襯衫掛上曬衣桿。
  tags: [laundry]
- id: ma-laundry-05
  text: 從曬衣架收下一件已經乾透的衣服。
  tags: [laundry]
- id: ma-laundry-06
  text: 對著皺掉的衣領噴一下除皺噴霧。
  tags: [laundry]
- id: ma-laundry-07
  text: 量一匙洗衣精倒進投入槽。
  tags: [laundry]
- id: ma-laundry-08
  text: 把一雙沾泥的襪子先泡進小盆裡。
  tags: [laundry]
- id: ma-laundry-09
  text: 翻出褲子口袋，把面紙屑清掉再丟去洗。
  tags: [laundry]
- id: ma-laundry-10
  text: 把牛仔褲翻面，準備下一批清洗。
  tags: [laundry]
- id: ma-laundry-11
  text: 將一件內衣裝進洗衣網袋拉上拉鍊。
  tags: [laundry]
- id: ma-laundry-12
  text: 抖開一件剛脫水的上衣再晾上去。
  tags: [laundry]
- id: ma-laundry-13
  text: 用衣夾把一條手帕夾在晾衣繩上。
  tags: [laundry]
- id: ma-laundry-14
  text: 把曬乾的浴巾從陽台收進屋內。
  tags: [laundry]
- id: ma-laundry-15
  text: 幫一件羊毛衣平鋪在毛巾上陰乾。
  tags: [laundry]
- id: ma-laundry-16
  text: 挑出一件要手洗的衣服放到水槽邊。
  tags: [laundry]
- id: ma-laundry-17
  text: 把會染色的紅衣和白衣分成兩堆。
  tags: [laundry]
- id: ma-laundry-18
  text: 按下烘衣機的低溫模式開始烘。
  tags: [laundry]
- id: ma-laundry-19
  text: 對著起皺的裙擺噴點水後拉平。
  tags: [laundry]
- id: ma-laundry-20
  text: 把晾衣架移到通風的窗邊。
  tags: [laundry]
