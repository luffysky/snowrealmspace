# 微行動 · 創造（第四批）。兩分鐘內做得完的小動作。
- id: ma-create-57
  text: 用手指在空中，把你的名字寫一遍。
  tags: [create]
- id: ma-create-58
  text: 用手指在桌上，敲出一段三拍的節奏。
  tags: [create]
- id: ma-create-59
  text: 把手邊三樣東西，排成一張笑臉。
  tags: [create]
- id: ma-create-60
  text: 替手邊的杯子，畫一張它的自畫像。
  tags: [create]
- id: ma-create-61
  text: 用一個手勢，比出你現在的心情。
  tags: [create]
- id: ma-create-62
  text: 用兩隻手，發明一個沒人看過的手勢。
  tags: [create]
- id: ma-create-63
  text: 替今天的天氣，用嘴巴發出一個對應的聲音。
  tags: [create]
- id: ma-create-64
  text: 替房間裡的三種聲音，排出一個先後順序。
  tags: [create]
- id: ma-create-65
  text: 替眼前的東西，取一個它私底下的名字。
  tags: [create]
- id: ma-create-66
  text: 用一個字，替這一分鐘命名，寫在紙上。
  tags: [create]
- id: ma-create-67
  text: 替現在的自己，畫一個代表的符號。
  tags: [create]
- id: ma-create-68
  text: 用一句話，替現在的光線編一段來歷。
  tags: [create]
- id: ma-create-69
  text: 替手邊的一支筆，編一句它的自我介紹。
  tags: [create]
- id: ma-create-70
  text: 把眼前看到的顏色，照深淺排成一列。
  tags: [create]
- id: ma-create-71
  text: 替一個路過的聲音，接一句它的下一句。
  tags: [create]
- id: ma-create-72
  text: 用三個形容詞，把現在的房間描述一遍。
  tags: [create]
- id: ma-create-73
  text: 把窗外的一朵雲，描成你看到的形狀。
  tags: [create]
- id: ma-create-74
  text: 替現在這一刻，想一個它的英文單字。
  tags: [create]
- id: ma-create-75
  text: 用手邊的東西，疊出一座小小的塔。
  tags: [create]
- id: ma-create-76
  text: 替你此刻的姿勢，取一個像瑜伽動作的名字。
  tags: [create]
