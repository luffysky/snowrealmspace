# 微行動 · 心緒（第四批）。兩分鐘內做得完。
- id: ma-mind-46
  text: 想一個你最近替自己做過的溫柔決定。
  tags: [mind]
- id: ma-mind-47
  text: 想像把肩頸的重量，交給身後的椅背托住。
  tags: [mind]
- id: ma-mind-48
  text: 把一句「這樣就夠了」，在心裡對自己輕輕說一次。
  tags: [mind]
- id: ma-mind-49
  text: 回想今天有哪一刻，你其實挺喜歡自己的。
  tags: [mind]
- id: ma-mind-50
  text: 想一件你已經放下、不再需要證明的事。
  tags: [mind]
- id: ma-mind-51
  text: 挑一件今天發生、值得你溫柔看待的小事。
  tags: [mind]
- id: ma-mind-52
  text: 想像把心裡卡著的一句話，寫在沙上讓浪帶走。
  tags: [mind]
- id: ma-mind-53
  text: 想像自己站在一片安靜的水邊，看它平平的樣子。
  tags: [mind]
- id: ma-mind-54
  text: 想一個你欣賞、也想學起來的別人身上的特質。
  tags: [mind]
- id: ma-mind-55
  text: 挑一個身邊的人，在心裡默默祝他今天順利。
  tags: [mind]
- id: ma-mind-56
  text: 想一個你曾經很想要、現在已經擁有的東西。
  tags: [mind]
- id: ma-mind-57
  text: 想像把一個擔心，裝進盒子先放到架子上。
  tags: [mind]
- id: ma-mind-58
  text: 把注意力放在此刻身體最放鬆的一個部位。
  tags: [mind]
- id: ma-mind-59
  text: 想一個最近讓你聽了就安心的聲音或旋律。
  tags: [mind]
- id: ma-mind-60
  text: 把「我在這裡」在心裡默念一次，回到當下。
  tags: [mind]
- id: ma-mind-61
  text: 想一件你不必再更好、就已經足夠的地方。
  tags: [mind]
- id: ma-mind-62
  text: 想像替今天的疲憊，蓋上一條薄薄的毯子。
  tags: [mind]
- id: ma-mind-63
  text: 想一個讓你想起「被好好愛過」的小細節。
  tags: [mind]
- id: ma-mind-64
  text: 想像今天的自己，被一雙溫暖的手輕輕拍了拍肩。
  tags: [mind]
- id: ma-mind-65
  text: 想一個讓你覺得世界還算溫柔的小小理由。
  tags: [mind]
