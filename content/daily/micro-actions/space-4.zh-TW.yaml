# 微行動 · 整理空間（第四批）。兩分鐘內做得完的小動作。
- id: ma-space-57
  text: 把桌上的筆，筆尖全部朝同一個方向排好。
  tags: [space]
- id: ma-space-58
  text: 把螢幕擦一遍，抹掉上面的指紋。
  tags: [space]
- id: ma-space-59
  text: 把桌墊擺正，讓四個角對齊桌沿。
  tags: [space]
- id: ma-space-60
  text: 把椅子調到手肘能平放的高度。
  tags: [space]
- id: ma-space-61
  text: 把鍵盤翻過來，倒出縫裡的一點屑。
  tags: [space]
- id: ma-space-62
  text: 把層架上的書，書背對齊成一直線。
  tags: [space]
- id: ma-space-63
  text: 把窗簾拉成左右等寬。
  tags: [space]
- id: ma-space-64
  text: 把水杯移到不會擋到手的位置。
  tags: [space]
- id: ma-space-65
  text: 把電腦裡的截圖，全部拖進一個資料夾。
  tags: [space]
- id: ma-space-66
  text: 把桌上多出來的那支筆，收回抽屜。
  tags: [space]
- id: ma-space-67
  text: 把鍵盤和滑鼠，擺成跟桌沿平行。
  tags: [space]
- id: ma-space-68
  text: 把螢幕往後推，離眼睛遠一個手臂。
  tags: [space]
- id: ma-space-69
  text: 把常看的資料夾，釘到側邊欄方便點。
  tags: [space]
- id: ma-space-70
  text: 把手機最常用的 App，移到拇指搆得到的地方。
  tags: [space]
- id: ma-space-71
  text: 把抽屜最上層，清出一格放常用的東西。
  tags: [space]
- id: ma-space-72
  text: 把桌上的相框，擺到抬頭就看得到的角度。
  tags: [space]
- id: ma-space-73
  text: 把牆上的畫，扶正到水平。
  tags: [space]
- id: ma-space-74
  text: 把螢幕墊高，讓上緣跟視線齊平。
  tags: [space]
- id: ma-space-75
  text: 把桌旁的垃圾桶，移到伸手就丟得到的位置。
  tags: [space]
- id: ma-space-76
  text: 把常用的檔案，設一個桌面捷徑。
  tags: [space]
