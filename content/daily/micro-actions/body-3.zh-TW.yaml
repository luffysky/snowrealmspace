# 微行動 · 身體（第三批）。站起來活絡一下。
- id: ma-body-37
  text: 站著把腳跟提起再放下，連續做十五次。
  tags: [body]
- id: ma-body-38
  text: 原地做五個開合跳。
  tags: [body]
- id: ma-body-39
  text: 站著慢慢往下半蹲再站直，做八次。
  tags: [body]
- id: ma-body-40
  text: 單腳站立數到十，再換另一隻腳。
  tags: [body]
- id: ma-body-41
  text: 坐著把兩腿一起往前伸直懸空，停三秒再放下，做五次。
  tags: [body]
- id: ma-body-42
  text: 把腳跟往後勾去碰屁股，左右輪流各五下。
  tags: [body]
- id: ma-body-43
  text: 用拳頭輕輕捶一捶下背，來回幾下。
  tags: [body]
- id: ma-body-44
  text: 把手腕往內外各轉十圈。
  tags: [body]
- id: ma-body-45
  text: 把雙臂輪流往天花板伸高，像爬繩子，做十下。
  tags: [body]
- id: ma-body-46
  text: 坐著把雙膝併攏往上抬離椅面，停兩秒放下，做八次。
  tags: [body]
- id: ma-body-47
  text: 把眉毛用力往上挑高再放鬆，做十次。
  tags: [body]
- id: ma-body-48
  text: 把兩邊臉頰鼓起憋著，再慢慢吐掉，做五次。
  tags: [body]
- id: ma-body-49
  text: 用手掌在太陽穴繞小圈按摩幾下。
  tags: [body]
- id: ma-body-50
  text: 用手指梳過整個頭皮，輕輕抓一抓。
  tags: [body]
- id: ma-body-51
  text: 把雙手搓熱後，輕輕搓一搓耳朵。
  tags: [body]
- id: ma-body-52
  text: 站著像原地小跑步一樣，輕輕跳三十秒。
  tags: [body]
- id: ma-body-53
  text: 把雙手在身體前面畫大圈，往前往後各繞十次。
  tags: [body]
- id: ma-body-54
  text: 用兩隻拇指按壓手掌心，兩手各揉幾下。
  tags: [body]
- id: ma-body-55
  text: 把下巴輕輕往內收，讓後頸拉長停三秒，做五次。
  tags: [body]
- id: ma-body-56
  text: 站著把雙手往兩側平舉，像小飛機定住十秒。
  tags: [body]
