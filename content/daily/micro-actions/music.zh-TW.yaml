# 微行動 · 音樂與聲音。兩分鐘內做得完。
- id: ma-music-01
  text: 放一首你最近喜歡的歌。
  tags: [music]
- id: ma-music-02
  text: 戴上耳機，把音量調到剛好包住你的程度。
  tags: [music]
- id: ma-music-03
  text: 小聲哼一段你記得的旋律。
  tags: [music]
- id: ma-music-04
  text: 挑一首慢歌，跟著它把呼吸放緩。
  tags: [music]
- id: ma-music-05
  text: 閉上眼睛，聽完手邊這首歌的副歌。
  tags: [music]
- id: ma-music-06
  text: 找一段雨聲或海浪的環境音來播。
  tags: [music]
- id: ma-music-07
  text: 用手指在桌上敲出一段簡單的節拍。
  tags: [music]
- id: ma-music-08
  text: 播一首會讓你想跟著點頭的歌。
  tags: [music]
- id: ma-music-09
  text: 把一首老歌重新放來聽一次。
  tags: [music]
- id: ma-music-10
  text: 靜下來聽三十秒四周本來就有的聲音。
  tags: [music]
- id: ma-music-11
  text: 挑一首沒有人聲的純樂器曲來放。
  tags: [music]
- id: ma-music-12
  text: 跟著正在播的歌輕輕唱出一句歌詞。
  tags: [music]
- id: ma-music-13
  text: 打開一份輕快的歌單，放第一首。
  tags: [music]
- id: ma-music-14
  text: 用嘴巴吹個口哨，隨便哪個調都行。
  tags: [music]
- id: ma-music-15
  text: 放一首異國語言的歌，感受它的聲音就好。
  tags: [music]
- id: ma-music-16
  text: 把音樂關掉，享受一分鐘的安靜。
  tags: [music]
- id: ma-music-17
  text: 找一首你小時候常聽的歌來播。
  tags: [music]
- id: ma-music-18
  text: 隨著手邊的音樂，讓肩膀輕輕晃兩下。
  tags: [music]
- id: ma-music-19
  text: 播一段鋼琴曲，讓它當作現在的背景。
  tags: [music]
- id: ma-music-20
  text: 拍兩下手，聽聲音在房間裡散開。
  tags: [music]
