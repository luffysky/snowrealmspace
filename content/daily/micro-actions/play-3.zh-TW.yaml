# 微行動 · 玩心（第三批）。兩分鐘內做得完。
- id: ma-play-26
  text: 用左右手同時各畫一個不同的形狀。
  tags: [play]
- id: ma-play-27
  text: 替手邊的杯子，想一句它的內心話。
  tags: [play]
- id: ma-play-28
  text: 找出視線裡所有紅色的東西，數一數。
  tags: [play]
- id: ma-play-29
  text: 用嘴巴模仿一種樂器的聲音。
  tags: [play]
- id: ma-play-30
  text: 把一個常用的字拆成兩半，看看像什麼。
  tags: [play]
- id: ma-play-31
  text: 替現在的天氣，配一首腦中的背景音樂。
  tags: [play]
- id: ma-play-32
  text: 閉上眼睛，用手指在空中寫自己的名字。
  tags: [play]
- id: ma-play-33
  text: 用三樣手邊的東西，排出一張笑臉。
  tags: [play]
- id: ma-play-34
  text: 幫窗外第一個路人，猜一個名字。
  tags: [play]
- id: ma-play-35
  text: 想出三種圓形的東西。
  tags: [play]
- id: ma-play-36
  text: 把眼前的空間，想像成某種動物的肚子裡。
  tags: [play]
- id: ma-play-37
  text: 學一種鳥的叫聲，輕輕試一次。
  tags: [play]
- id: ma-play-38
  text: 用手指在空氣中畫一個愛心。
  tags: [play]
- id: ma-play-39
  text: 替剛剛發生的一件小事，配一個音效。
  tags: [play]
- id: ma-play-40
  text: 想一個和自己名字押韻的詞。
  tags: [play]
- id: ma-play-41
  text: 用一種食物，來形容現在的心情。
  tags: [play]
- id: ma-play-42
  text: 把手邊的筆轉一圈，再接住它。
  tags: [play]
- id: ma-play-43
  text: 找一個物品倒過來，看它像什麼。
  tags: [play]
- id: ma-play-44
  text: 幫最近看到的一個招牌，想一句廣告詞。
  tags: [play]
- id: ma-play-45
  text: 替手機裡最後一張照片，想一個好笑的標題。
  tags: [play]
