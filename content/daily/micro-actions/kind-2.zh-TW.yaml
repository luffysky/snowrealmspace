# 微行動 · 善待自己（續）。對自己溫柔一點的小動作，兩分鐘做得完。
- id: ma-kind-05
  text: 替自己拒絕一件今天真的做不到的事。
  tags: [kindness]
- id: ma-kind-06
  text: 從待辦清單上刪掉一項其實不重要的事。
  tags: [kindness]
- id: ma-kind-07
  text: 給自己一個擁抱，雙手環住肩膀停幾秒。
  tags: [kindness]
- id: ma-kind-08
  text: 對自己說一句「這樣就已經夠好了」。
  tags: [kindness]
- id: ma-kind-09
  text: 把一則讓你不舒服的貼文，默默滑過去不看。
  tags: [kindness]
- id: ma-kind-10
  text: 替自己在明天的行程裡，留一段空白時間。
  tags: [kindness]
- id: ma-kind-11
  text: 對撐了一整天的雙腳，在心裡道一聲謝。
  tags: [kindness]
- id: ma-kind-12
  text: 注意到自己正在自責，就先停下來。
  tags: [kindness]
- id: ma-kind-13
  text: 允許自己今天只把一件事做到七十分。
  tags: [kindness]
- id: ma-kind-14
  text: 對自己的一個決定說一句「我相信你的選擇」。
  tags: [kindness]
- id: ma-kind-15
  text: 對自己承認「我現在有點累」，不用給任何理由。
  tags: [kindness]
- id: ma-kind-16
  text: 對自己說一句「今天到這裡就好」。
  tags: [kindness]
- id: ma-kind-17
  text: 想一件你替別人做過的好，記得自己也值得同樣的溫柔。
  tags: [kindness]
- id: ma-kind-18
  text: 把手機亮度調暗一格，讓眼睛舒服一些。
  tags: [kindness]
- id: ma-kind-19
  text: 替自己婉拒一個你其實不想赴的邀約。
  tags: [kindness]
- id: ma-kind-20
  text: 把今天讓你委屈的一件事，在心裡替自己說句公道話。
  tags: [kindness]
- id: ma-kind-21
  text: 對自己說一句「不完美也沒關係」。
  tags: [kindness]
- id: ma-kind-22
  text: 對自己今天的樣子說一句「你值得被好好對待」。
  tags: [kindness]
- id: ma-kind-23
  text: 把心裡那句「不夠好」，換成「已經很好了」。
  tags: [kindness]
- id: ma-kind-24
  text: 答應自己今晚早一點放下手邊的事去休息。
  tags: [kindness]
