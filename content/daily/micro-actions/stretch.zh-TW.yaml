# 微行動 · 伸展與舒展。兩分鐘內做得完。
- id: ma-stretch-01
  text: 站起來，雙手往頭頂延伸，停留十秒再放下。
  tags: [stretch]
- id: ma-stretch-02
  text: 把頭緩緩往右肩傾，感覺左側頸部拉開，換邊再做一次。
  tags: [stretch]
- id: ma-stretch-03
  text: 雙肩往後畫大圈五次，再往前畫五次。
  tags: [stretch]
- id: ma-stretch-04
  text: 十指交扣往前推，把上背推成圓弧，維持八秒。
  tags: [stretch]
- id: ma-stretch-05
  text: 右手橫過胸前，用左臂輕壓，拉開右肩，換邊重複。
  tags: [stretch]
- id: ma-stretch-06
  text: 坐著把右腳踝翹到左膝上，上身微前傾拉臀部，換邊做。
  tags: [stretch]
- id: ma-stretch-07
  text: 伸直雙臂，手腕往下壓再往上翹，各停五秒。
  tags: [stretch]
- id: ma-stretch-08
  text: 雙手扶腰，上身緩緩往後仰，把胸口打開，停六秒。
  tags: [stretch]
- id: ma-stretch-09
  text: 站著扶牆，把一隻腳往後跨，壓地拉小腿，換腳再做。
  tags: [stretch]
- id: ma-stretch-10
  text: 坐正，雙手抱住一邊膝蓋往胸口帶，拉開下背，換邊。
  tags: [stretch]
- id: ma-stretch-11
  text: 把左手往右邊延伸，身體側彎拉開腰側，換邊重複。
  tags: [stretch]
- id: ma-stretch-12
  text: 手掌貼牆、手指朝下，身體微轉開，伸展前臂內側。
  tags: [stretch]
- id: ma-stretch-13
  text: 坐在椅上把上身緩緩轉向右後方，扶著椅背停八秒，換邊。
  tags: [stretch]
- id: ma-stretch-14
  text: 抓住一隻腳背往臀部帶，拉開大腿前側，扶牆保持平衡後換腳。
  tags: [stretch]
- id: ma-stretch-15
  text: 雙手在背後互扣，把手臂往下往後拉，打開肩膀停十秒。
  tags: [stretch]
- id: ma-stretch-16
  text: 低頭把下巴貼近胸口，雙手輕放後腦，拉開後頸六秒。
  tags: [stretch]
- id: ma-stretch-17
  text: 坐著雙腿伸直，上身往腳尖方向前彎，拉大腿後側停八秒。
  tags: [stretch]
- id: ma-stretch-18
  text: 手臂彎到腦後，用另一手輕推手肘，伸展上臂後側，換邊。
  tags: [stretch]
- id: ma-stretch-19
  text: 雙腳與肩同寬，緩緩往前彎讓上身垂下，讓脊椎一節節放鬆。
  tags: [stretch]
- id: ma-stretch-20
  text: 握拳後把五指用力張開撐大，重複開合十次舒展手指。
  tags: [stretch]
