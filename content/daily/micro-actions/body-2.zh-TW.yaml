# 微行動 · 身體（續）。離開螢幕動一動。
- id: ma-body-17
  text: 原地踏步三十下。
  tags: [body]
- id: ma-body-18
  text: 用腳尖走到門口，再走回來。
  tags: [body]
- id: ma-body-19
  text: 雙手插腰，把腰左右扭動十下。
  tags: [body]
- id: ma-body-20
  text: 兩邊肩膀同時聳到最高，再放鬆，連續八次。
  tags: [body]
- id: ma-body-21
  text: 雙臂往兩側打開擴胸，再交叉抱胸，來回十次。
  tags: [body]
- id: ma-body-22
  text: 站著輪流把膝蓋抬到腰的高度，左右各十下。
  tags: [body]
- id: ma-body-23
  text: 放鬆雙臂，前後自然甩動二十下。
  tags: [body]
- id: ma-body-24
  text: 扶著桌子，把一隻腳前後輕輕擺盪十次，換腳。
  tags: [body]
- id: ma-body-25
  text: 全身輕輕抖動十秒，把僵硬抖掉。
  tags: [body]
- id: ma-body-26
  text: 往左踏三步，再往右踏三步，來回四趟。
  tags: [body]
- id: ma-body-27
  text: 坐著把腳尖快速上下點地二十下。
  tags: [body]
- id: ma-body-28
  text: 去走一趟樓梯，上下各一次。
  tags: [body]
- id: ma-body-29
  text: 站著把重心左右換腳，慢慢晃動十次。
  tags: [body]
- id: ma-body-30
  text: 把雙手輕輕拍打手臂和大腿，各拍一輪。
  tags: [body]
- id: ma-body-31
  text: 站起來原地慢慢轉一圈，看看四周。
  tags: [body]
- id: ma-body-32
  text: 把嘴巴張到最大再閉起來，動一動臉，做五次。
  tags: [body]
- id: ma-body-33
  text: 用手指輕輕捏一捏肩膀上緣，來回幾下。
  tags: [body]
- id: ma-body-34
  text: 把兩隻手掌在胸前互相用力推，停五秒再放開。
  tags: [body]
- id: ma-body-35
  text: 坐著把肚子用力收緊再放鬆，重複八次。
  tags: [body]
- id: ma-body-36
  text: 坐正把雙手撐在椅面，輕輕把身體往上撐起再坐下，做五次。
  tags: [body]
