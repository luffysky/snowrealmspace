# 微行動 · 簡單備餐（兩分鐘內做得完，祈使句，動手備一小份餐）
- id: ma-prep-01
  text: 把水壺裝滿水，放上爐子點火。
  tags: [prep]
- id: ma-prep-02
  text: 洗一把青菜，甩掉多餘的水珠。
  tags: [prep]
- id: ma-prep-03
  text: 在碗裡倒進一份麥片，淋上牛奶。
  tags: [prep]
- id: ma-prep-04
  text: 擺好一副碗筷在餐墊上。
  tags: [prep]
- id: ma-prep-05
  text: 把小黃瓜切成薄片，排進盤子。
  tags: [prep]
- id: ma-prep-06
  text: 洗一顆番茄，切成四瓣擺盤。
  tags: [prep]
- id: ma-prep-07
  text: 量一杯米，沖洗兩遍後瀝乾。
  tags: [prep]
- id: ma-prep-08
  text: 打一顆蛋，用筷子攪散在碗裡。
  tags: [prep]
- id: ma-prep-09
  text: 把豆腐切成方塊，泡進一碗清水。
  tags: [prep]
- id: ma-prep-10
  text: 撕幾片生菜，鋪在盤底當墊。
  tags: [prep]
- id: ma-prep-11
  text: 燒一壺熱水，備著等下沖泡。
  tags: [prep]
- id: ma-prep-12
  text: 把紅蘿蔔削皮，切成細絲。
  tags: [prep]
- id: ma-prep-13
  text: 舀兩匙玉米粒，倒進小碟準備微波。
  tags: [prep]
- id: ma-prep-14
  text: 把一顆饅頭放進電鍋，加半杯水。
  tags: [prep]
- id: ma-prep-15
  text: 剝幾瓣蒜頭，拍碎放在小碟。
  tags: [prep]
- id: ma-prep-16
  text: 把乾香菇泡進溫水裡發開。
  tags: [prep]
- id: ma-prep-17
  text: 舀一碗白飯，鋪平放涼備用。
  tags: [prep]
- id: ma-prep-18
  text: 洗一把毛豆，撒點鹽備著汆燙。
  tags: [prep]
- id: ma-prep-19
  text: 把吐司切成小方塊，裝進碗裡。
  tags: [prep]
- id: ma-prep-20
  text: 沖一杯即溶濃湯，攪拌到粉末化開。
  tags: [prep]
