# 微行動 · 整理儀容。兩分鐘內做得完。
- id: ma-groom-01
  text: 對著鏡子把頭髮撥順。
  tags: [groom]
- id: ma-groom-02
  text: 擦一層護唇膏。
  tags: [groom]
- id: ma-groom-03
  text: 剪掉一片過長的指甲。
  tags: [groom]
- id: ma-groom-04
  text: 把衣領翻正貼好。
  tags: [groom]
- id: ma-groom-05
  text: 用手指沾水抹平翹起的髮尾。
  tags: [groom]
- id: ma-groom-06
  text: 把袖口捲整齊。
  tags: [groom]
- id: ma-groom-07
  text: 照鏡子檢查牙縫有沒有殘留。
  tags: [groom]
- id: ma-groom-08
  text: 用棉花棒清一下耳朵外緣。
  tags: [groom]
- id: ma-groom-09
  text: 把眉毛用手指順成同一個方向。
  tags: [groom]
- id: ma-groom-10
  text: 挑掉肩上的一根落髮。
  tags: [groom]
- id: ma-groom-11
  text: 把指甲邊緣用指緣油抹一下。
  tags: [groom]
- id: ma-groom-12
  text: 用護手霜揉開雙手。
  tags: [groom]
- id: ma-groom-13
  text: 把瀏海分邊夾好。
  tags: [groom]
- id: ma-groom-14
  text: 對著鏡子練一個放鬆的表情。
  tags: [groom]
- id: ma-groom-15
  text: 用小剪刀修掉一根冒出的鼻毛。
  tags: [groom]
- id: ma-groom-16
  text: 把襯衫下襬拉平塞好。
  tags: [groom]
- id: ma-groom-17
  text: 用濕紙巾擦掉手錶上的指紋。
  tags: [groom]
- id: ma-groom-18
  text: 把耳後的碎髮撥到耳朵後面。
  tags: [groom]
- id: ma-groom-19
  text: 塗一點凡士林在乾裂的嘴角。
  tags: [groom]
- id: ma-groom-20
  text: 用梳子從髮根梳到髮尾一次。
  tags: [groom]
