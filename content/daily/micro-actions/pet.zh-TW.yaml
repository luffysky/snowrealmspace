# 微行動 · 寵物照顧。兩分鐘內做得完。
- id: ma-pet-01
  text: 幫寵物的水碗換上乾淨的水。
  tags: [pet]
- id: ma-pet-02
  text: 在飼料碗裡添一小把牠平常吃的乾糧。
  tags: [pet]
- id: ma-pet-03
  text: 伸手摸摸牠的頭，順著毛的方向慢慢撫過去。
  tags: [pet]
- id: ma-pet-04
  text: 拿鏟子清掉貓砂盆裡的一塊排泄物。
  tags: [pet]
- id: ma-pet-05
  text: 把牠愛玩的球丟出去，看牠追過去叼回來。
  tags: [pet]
- id: ma-pet-06
  text: 用梳子替牠梳幾下背上的毛。
  tags: [pet]
- id: ma-pet-07
  text: 把散落在地上的寵物玩具收回牠的小籃子。
  tags: [pet]
- id: ma-pet-08
  text: 拿濕紙巾擦一擦牠腳掌的肉墊。
  tags: [pet]
- id: ma-pet-09
  text: 抓一小撮零食，放在手心讓牠來吃。
  tags: [pet]
- id: ma-pet-10
  text: 打開窗，讓陽台上的鳥籠透一點新鮮空氣。
  tags: [pet]
- id: ma-pet-11
  text: 把牠睡覺的墊子抖一抖，撫平上面的皺褶。
  tags: [pet]
- id: ma-pet-12
  text: 蹲下來和牠對看幾秒，輕聲喊牠的名字。
  tags: [pet]
- id: ma-pet-13
  text: 幫魚缸的水面撈掉一片飄著的殘渣。
  tags: [pet]
- id: ma-pet-14
  text: 拿逗貓棒在牠面前晃幾下，陪牠撲一撲。
  tags: [pet]
- id: ma-pet-15
  text: 檢查牠的項圈鬆緊，把歪掉的名牌轉正。
  tags: [pet]
- id: ma-pet-16
  text: 替倉鼠的滾輪清掉卡住的一點木屑。
  tags: [pet]
- id: ma-pet-17
  text: 對著窗外的流浪貓，輕輕伸手打個招呼。
  tags: [pet]
- id: ma-pet-18
  text: 把牠的飼料袋口捲好，夾上夾子防潮。
  tags: [pet]
- id: ma-pet-19
  text: 抱起牠靠在胸前，感受牠呼吸的節奏。
  tags: [pet]
- id: ma-pet-20
  text: 在陽台撒幾顆穀粒，留給路過的麻雀。
  tags: [pet]
