# 微行動 · 記一筆帳。兩分鐘內做得完。
- id: ma-ledger-01
  text: 記下今天的一筆花費。
  tags: [ledger]
- id: ma-ledger-02
  text: 看一眼帳戶目前的餘額。
  tags: [ledger]
- id: ma-ledger-03
  text: 把早餐的金額寫進記帳本。
  tags: [ledger]
- id: ma-ledger-04
  text: 記下一個每月固定的訂閱項目。
  tags: [ledger]
- id: ma-ledger-05
  text: 寫下一項這個月想省下的開銷。
  tags: [ledger]
- id: ma-ledger-06
  text: 把錢包裡的發票金額登記起來。
  tags: [ledger]
- id: ma-ledger-07
  text: 為這筆消費標上一個分類。
  tags: [ledger]
- id: ma-ledger-08
  text: 記下昨天忘了寫的一筆支出。
  tags: [ledger]
- id: ma-ledger-09
  text: 把零錢罐裡的金額數一數記下。
  tags: [ledger]
- id: ma-ledger-10
  text: 登記一筆這週的收入。
  tags: [ledger]
- id: ma-ledger-11
  text: 查看一個訂閱下次的扣款日。
  tags: [ledger]
- id: ma-ledger-12
  text: 把交通費的金額補進帳本。
  tags: [ledger]
- id: ma-ledger-13
  text: 為飲料錢設一個小小的每日上限。
  tags: [ledger]
- id: ma-ledger-14
  text: 把一張電子收據存進記帳 App。
  tags: [ledger]
- id: ma-ledger-15
  text: 記下這個月的水電費金額。
  tags: [ledger]
- id: ma-ledger-16
  text: 標記一筆可以報帳的支出。
  tags: [ledger]
- id: ma-ledger-17
  text: 把找零的現金金額對一次帳。
  tags: [ledger]
- id: ma-ledger-18
  text: 列出一項打算取消的訂閱服務。
  tags: [ledger]
- id: ma-ledger-19
  text: 記下今天存進撲滿的一筆錢。
  tags: [ledger]
- id: ma-ledger-20
  text: 把一筆網購款項登記到帳本。
  tags: [ledger]
