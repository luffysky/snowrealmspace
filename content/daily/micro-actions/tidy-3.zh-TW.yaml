# 微行動 · 整理（第三批）。兩分鐘內做得完。
- id: ma-tidy-26
  text: 把纏成一團的一條充電線用束帶捲好。
  tags: [tidy]
- id: ma-tidy-27
  text: 把玄關地上多出來的一雙鞋擺回鞋櫃。
  tags: [tidy]
- id: ma-tidy-28
  text: 把錢包裡一張過期的集點卡抽出來丟掉。
  tags: [tidy]
- id: ma-tidy-29
  text: 把手機首頁一個半年沒開的 App 移除。
  tags: [tidy]
- id: ma-tidy-30
  text: 把電腦的資源回收筒清空一次。
  tags: [tidy]
- id: ma-tidy-31
  text: 把水槽裡的一個杯子洗好倒扣晾著。
  tags: [tidy]
- id: ma-tidy-32
  text: 把沙發上的抱枕拍鬆擺正。
  tags: [tidy]
- id: ma-tidy-33
  text: 把玄關的鑰匙掛回掛勾上。
  tags: [tidy]
- id: ma-tidy-34
  text: 把搭在椅背上的外套掛回衣架。
  tags: [tidy]
- id: ma-tidy-35
  text: 把一個快遞紙箱上的個資標籤撕掉。
  tags: [tidy]
- id: ma-tidy-36
  text: 把相簿裡一段誤拍的影片刪掉。
  tags: [tidy]
- id: ma-tidy-37
  text: 把行事曆上一個已取消的行程刪掉。
  tags: [tidy]
- id: ma-tidy-38
  text: 把瀏覽器書籤列一個用不到的書籤移除。
  tags: [tidy]
- id: ma-tidy-39
  text: 把筆筒裡一支寫不出來的筆挑出來丟掉。
  tags: [tidy]
- id: ma-tidy-40
  text: 把餐桌上的調味罐排回一列。
  tags: [tidy]
- id: ma-tidy-41
  text: 把陽台上一片枯掉的落葉撿走。
  tags: [tidy]
- id: ma-tidy-42
  text: 把浴室鏡子上的一處水漬擦掉。
  tags: [tidy]
- id: ma-tidy-43
  text: 把截圖資料夾裡一張看完就沒用的圖刪掉。
  tags: [tidy]
- id: ma-tidy-44
  text: 把訊息軟體裡一個不再看的群組通知關掉。
  tags: [tidy]
- id: ma-tidy-45
  text: 把手機裡兩個重複的聯絡人合併起來。
  tags: [tidy]
