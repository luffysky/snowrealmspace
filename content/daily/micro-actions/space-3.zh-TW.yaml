# 微行動 · 整理空間（第三批）。兩分鐘內做得完的小動作。
- id: ma-space-37
  text: 挑一首歌，設成進到這裡時的背景音樂。
  tags: [space]
- id: ma-space-38
  text: 把最喜歡的一張照片，設成這個空間的封面。
  tags: [space]
- id: ma-space-39
  text: 替這個空間想一個名字，寫進標題。
  tags: [space]
- id: ma-space-40
  text: 把一段想留住的話，貼在空間的角落。
  tags: [space]
- id: ma-space-41
  text: 替今天存下的東西，加上一個標籤。
  tags: [space]
- id: ma-space-42
  text: 把三個相關的檔案，收進同一個資料夾。
  tags: [space]
- id: ma-space-43
  text: 在收藏裡挑一個重複的東西，刪掉它。
  tags: [space]
- id: ma-space-44
  text: 替最近一週，選出一張代表照片。
  tags: [space]
- id: ma-space-45
  text: 把桌面上的圖示，排成整齊的一排。
  tags: [space]
- id: ma-space-46
  text: 替常開的幾個分頁，存成一個書籤群組。
  tags: [space]
- id: ma-space-47
  text: 把手機桌布，換成一張讓你放鬆的畫面。
  tags: [space]
- id: ma-space-48
  text: 替喜歡的一句話，設成這裡的歡迎語。
  tags: [space]
- id: ma-space-49
  text: 把椅子推回桌子底下，讓走道空出來。
  tags: [space]
- id: ma-space-50
  text: 替桌面挪出一塊手掌大的空白。
  tags: [space]
- id: ma-space-51
  text: 找一個托盤，把零散小物集中放上去。
  tags: [space]
- id: ma-space-52
  text: 把窗台上的東西，排成由矮到高。
  tags: [space]
- id: ma-space-53
  text: 把喜歡的一本書，封面朝外立起來。
  tags: [space]
- id: ma-space-54
  text: 替房間留一個什麼都不放的空角。
  tags: [space]
- id: ma-space-55
  text: 把兩樣同款的東西，擺成一對。
  tags: [space]
- id: ma-space-56
  text: 把桌燈的角度，調到照著你的手邊。
  tags: [space]
