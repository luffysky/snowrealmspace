# 微行動 · 摺衣與衣物。兩分鐘內做得完。
- id: ma-fold-01
  text: 摺好一件剛晾乾的衣服。
  tags: [fold]
- id: ma-fold-02
  text: 把一件外套掛回衣架。
  tags: [fold]
- id: ma-fold-03
  text: 配一雙襪子收進抽屜。
  tags: [fold]
- id: ma-fold-04
  text: 挑好明天要穿的上衣。
  tags: [fold]
- id: ma-fold-05
  text: 把三條毛巾疊成一落。
  tags: [fold]
- id: ma-fold-06
  text: 將一件襯衫沿肩線摺平。
  tags: [fold]
- id: ma-fold-07
  text: 把一條圍巾捲好放進籃子。
  tags: [fold]
- id: ma-fold-08
  text: 收起沙發上散落的一件衣物。
  tags: [fold]
- id: ma-fold-09
  text: 幫一件針織衫拍掉毛球。
  tags: [fold]
- id: ma-fold-10
  text: 把內衣褲分類放進各自的格子。
  tags: [fold]
- id: ma-fold-11
  text: 將一條長褲對摺掛上褲架。
  tags: [fold]
- id: ma-fold-12
  text: 把帽子放回衣櫃頂層。
  tags: [fold]
- id: ma-fold-13
  text: 收攏一疊摺好的睡衣。
  tags: [fold]
- id: ma-fold-14
  text: 把手帕摺成小方塊。
  tags: [fold]
- id: ma-fold-15
  text: 將一件連帽衫的帽子拉整齊再摺。
  tags: [fold]
- id: ma-fold-16
  text: 把運動服疊好放進健身包。
  tags: [fold]
- id: ma-fold-17
  text: 整理衣架間距讓外套不再擠。
  tags: [fold]
- id: ma-fold-18
  text: 把一雙手套配成一對收好。
  tags: [fold]
- id: ma-fold-19
  text: 將洗好的口袋巾摺角收起。
  tags: [fold]
- id: ma-fold-20
  text: 把明天的整套衣物擺到椅背上。
  tags: [fold]
