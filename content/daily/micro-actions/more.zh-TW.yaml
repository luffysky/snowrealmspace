# 微行動 · 連結/環境/休息/專注。兩分鐘內做得完。
- id: ma-connect-01
  text: 傳一則訊息給想念的人。
  tags: [connect]
- id: ma-connect-02
  text: 謝謝一個今天幫過你的人。
  tags: [connect]
- id: ma-connect-03
  text: 回一則你擱著沒回的訊息。
  tags: [connect]
- id: ma-env-01
  text: 把燈光調成你喜歡的亮度。
  tags: [env]
- id: ma-env-02
  text: 開一扇窗，讓空氣進來。
  tags: [env]
- id: ma-env-03
  text: 收走桌上一樣不需要的東西。
  tags: [env]
- id: ma-env-04
  text: 替空間放一首想聽的歌。
  tags: [env]
- id: ma-rest-01
  text: 閉上眼睛，什麼都不做一分鐘。
  tags: [rest]
- id: ma-rest-02
  text: 離開螢幕，看向遠方一會兒。
  tags: [rest]
- id: ma-rest-03
  text: 深呼吸三次，慢慢把氣吐長。
  tags: [rest]
- id: ma-rest-04
  text: 把雙腳踩實地面，坐正一點。
  tags: [rest, body]
- id: ma-rest-05
  text: 伸展一下，把肩膀往下放。
  tags: [rest, body]
- id: ma-focus-01
  text: 挑一件事，只做它五分鐘。
  tags: [focus]
- id: ma-focus-02
  text: 把手機翻面，專心十分鐘。
  tags: [focus]
- id: ma-focus-03
  text: 寫下現在最想完成的一件事。
  tags: [focus]
- id: ma-focus-04
  text: 關掉一個讓你分心的分頁。
  tags: [focus]
