# 微行動 · 閱讀一小段。兩分鐘內做得完。
- id: ma-read-01
  text: 讀一頁手邊的書。
  tags: [reading]
- id: ma-read-02
  text: 翻開書架上最靠近你的那本書，讀開頭第一段。
  tags: [reading]
- id: ma-read-03
  text: 唸出一句喜歡的句子給自己聽。
  tags: [reading]
- id: ma-read-04
  text: 讀完一篇短新聞的前三行。
  tags: [reading]
- id: ma-read-05
  text: 隨手翻到書的某一頁，讀那一頁的最後一段。
  tags: [reading]
- id: ma-read-06
  text: 讀一首短詩，慢慢讀到最後一行。
  tags: [reading]
- id: ma-read-07
  text: 讀手機裡收藏未看的一篇文章的開頭。
  tags: [reading]
- id: ma-read-08
  text: 把一段句子逐字讀一遍，注意每個字的形狀。
  tags: [reading]
- id: ma-read-09
  text: 讀食譜上一道菜的材料清單。
  tags: [reading]
- id: ma-read-10
  text: 讀桌上任何一張紙的內容，讀完為止。
  tags: [reading]
- id: ma-read-11
  text: 讀一則你追蹤帳號的貼文文字，讀到句號。
  tags: [reading]
- id: ma-read-12
  text: 打開字典，讀一個隨機字詞的解釋。
  tags: [reading]
- id: ma-read-13
  text: 讀一段電子郵件的正文，從頭讀到尾。
  tags: [reading]
- id: ma-read-14
  text: 把某個產品包裝上的說明文字讀一遍。
  tags: [reading]
- id: ma-read-15
  text: 讀漫畫的一格對白，看清楚每句話。
  tags: [reading]
- id: ma-read-16
  text: 讀一段歌詞，跟著文字默念一次。
  tags: [reading]
- id: ma-read-17
  text: 讀完一則短笑話或一則寓言。
  tags: [reading]
- id: ma-read-18
  text: 讀一頁筆記本裡自己以前寫下的字。
  tags: [reading]
- id: ma-read-19
  text: 讀一封舊訊息，從第一句讀到最後一句。
  tags: [reading]
- id: ma-read-20
  text: 讀書封底的簡介文字，讀完整段。
  tags: [reading]
