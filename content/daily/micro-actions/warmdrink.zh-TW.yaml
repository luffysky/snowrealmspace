# 微行動 · 泡杯溫飲。兩分鐘內做得完。
- id: ma-warm-01
  text: 燒一壺水，泡一杯溫熱的茶。
  tags: [warmdrink]
- id: ma-warm-02
  text: 沖一杯熱可可，用湯匙把粉攪到融化。
  tags: [warmdrink]
- id: ma-warm-03
  text: 溫一杯牛奶，捧著讓手掌吸收那份熱度。
  tags: [warmdrink]
- id: ma-warm-04
  text: 泡一包花草茶，聞著蒸氣裡飄出的香氣。
  tags: [warmdrink]
- id: ma-warm-05
  text: 倒一杯溫開水，小口小口慢慢喝完。
  tags: [warmdrink]
- id: ma-warm-06
  text: 沖一杯薑茶，讓暖意從喉嚨一路滑到胃裡。
  tags: [warmdrink]
- id: ma-warm-07
  text: 泡一杯熱奶茶，雙手貼著杯壁暖一暖手指。
  tags: [warmdrink]
- id: ma-warm-08
  text: 用溫水沖一杯蜂蜜水，攪勻後慢慢啜飲。
  tags: [warmdrink]
- id: ma-warm-09
  text: 煮一小杯熱豆漿，捧在手心邊吹邊喝。
  tags: [warmdrink]
- id: ma-warm-10
  text: 泡一壺紅茶，等它上色到你喜歡的深度再倒出來。
  tags: [warmdrink]
- id: ma-warm-11
  text: 沖一杯溫熱的咖啡，聞一聞剛沖好的氣味。
  tags: [warmdrink]
- id: ma-warm-12
  text: 用熱水泡一杯檸檬片，看它在杯裡慢慢舒展。
  tags: [warmdrink]
- id: ma-warm-13
  text: 溫一杯米漿，握著杯子讓掌心暖起來。
  tags: [warmdrink]
- id: ma-warm-14
  text: 泡一杯桂圓紅棗茶，讓甜香在蒸氣裡散開。
  tags: [warmdrink]
- id: ma-warm-15
  text: 沖一杯抹茶拿鐵，把泡沫攪出綿密的一層。
  tags: [warmdrink]
- id: ma-warm-16
  text: 燒水泡一杯烏龍，第一泡先聞香再入口。
  tags: [warmdrink]
- id: ma-warm-17
  text: 沖一杯熱麥茶，倒進保溫杯裡帶在身邊。
  tags: [warmdrink]
- id: ma-warm-18
  text: 泡一杯溫熱的洛神花茶，欣賞它染出的紅。
  tags: [warmdrink]
- id: ma-warm-19
  text: 溫一小碗甜酒釀，趁熱一口一口舀來喝。
  tags: [warmdrink]
- id: ma-warm-20
  text: 沖一杯熱柚子茶，讓酸甜的暖流過整個口腔。
  tags: [warmdrink]
