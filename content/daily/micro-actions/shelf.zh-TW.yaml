# 微行動 · 架櫃整理。兩分鐘內做得完。
- id: ma-shelf-01
  text: 把書架上一格的書按高矮排好。
  tags: [shelf]
- id: ma-shelf-02
  text: 從抽屜裡挑出一支沒水的筆丟掉。
  tags: [shelf]
- id: ma-shelf-03
  text: 把櫃子最上層歪掉的相框擺正。
  tags: [shelf]
- id: ma-shelf-04
  text: 收好散在層架邊緣的一疊便條紙。
  tags: [shelf]
- id: ma-shelf-05
  text: 把書背朝外，讓一整排書名都看得到。
  tags: [shelf]
- id: ma-shelf-06
  text: 清出抽屜一角，把充電線捲起來放進去。
  tags: [shelf]
- id: ma-shelf-07
  text: 擦一下櫃子門把上的灰塵。
  tags: [shelf]
- id: ma-shelf-08
  text: 把層架上的小盒子疊成一落。
  tags: [shelf]
- id: ma-shelf-09
  text: 挑一本讀完的雜誌放進回收堆。
  tags: [shelf]
- id: ma-shelf-10
  text: 把櫃子裡橫躺的書立起來。
  tags: [shelf]
- id: ma-shelf-11
  text: 替一格抽屜換上乾淨的分隔盒。
  tags: [shelf]
- id: ma-shelf-12
  text: 把架上重複的文具集中到同一格。
  tags: [shelf]
- id: ma-shelf-13
  text: 擦亮書架玻璃門的一小塊指印。
  tags: [shelf]
- id: ma-shelf-14
  text: 把層架上滾出來的橡皮筋歸回小盒。
  tags: [shelf]
- id: ma-shelf-15
  text: 將櫃子底層的鞋盒往內推齊。
  tags: [shelf]
- id: ma-shelf-16
  text: 把書架上的書籤夾回原本那本書。
  tags: [shelf]
- id: ma-shelf-17
  text: 替抽屜裡的鑰匙找一個固定角落放。
  tags: [shelf]
- id: ma-shelf-18
  text: 把層架上朝反面的擺飾轉回正面。
  tags: [shelf]
- id: ma-shelf-19
  text: 將櫃子上快滿出來的名片收進盒中。
  tags: [shelf]
- id: ma-shelf-20
  text: 把架上最重的書移到底層。
  tags: [shelf]
