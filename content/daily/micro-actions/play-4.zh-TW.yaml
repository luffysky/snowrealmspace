# 微行動 · 玩心（第四批）。兩分鐘內做得完。
- id: ma-play-46
  text: 用桌上三樣小東西，排成一張笑臉。
  tags: [play]
- id: ma-play-47
  text: 替窗外經過的第一個人，編一句內心台詞。
  tags: [play]
- id: ma-play-48
  text: 把眼前這個房間，想像成一艘太空船的艙房。
  tags: [play]
- id: ma-play-49
  text: 用氣音吹一段口哨，猜自己吹的是哪首歌。
  tags: [play]
- id: ma-play-50
  text: 閉眼摸出口袋裡的東西，靠手感猜是什麼。
  tags: [play]
- id: ma-play-51
  text: 幫手邊的杯子取一個很正經的名字。
  tags: [play]
- id: ma-play-52
  text: 用手指在空中把自己的名字反著寫一次。
  tags: [play]
- id: ma-play-53
  text: 挑一個字，用三種不同的口氣各念一遍。
  tags: [play]
- id: ma-play-54
  text: 把今天的心情，用一個表情符號畫在紙上。
  tags: [play]
- id: ma-play-55
  text: 把眼前的物品，全部改用台語念一遍。
  tags: [play]
- id: ma-play-56
  text: 用最慢的動作，假裝自己在水裡走三步。
  tags: [play]
- id: ma-play-57
  text: 替現在的天氣，配一個誇張的音效。
  tags: [play]
- id: ma-play-58
  text: 把兩個不相干的東西，硬湊成一個新發明。
  tags: [play]
- id: ma-play-59
  text: 學一種動物的走路方式，走到門口再走回來。
  tags: [play]
- id: ma-play-60
  text: 用左手畫一隻貓，看牠變成什麼樣子。
  tags: [play]
- id: ma-play-61
  text: 把手邊的筆當麥克風，對它說句開場白。
  tags: [play]
- id: ma-play-62
  text: 替下一首腦中冒出的歌，配一個舞步。
  tags: [play]
- id: ma-play-63
  text: 用注音符號，拼出一個好笑的假詞。
  tags: [play]
- id: ma-play-64
  text: 用眉毛做三種表情，對著鏡子看看。
  tags: [play]
- id: ma-play-65
  text: 給今天發生的一件小事，配一個電影片名。
  tags: [play]
