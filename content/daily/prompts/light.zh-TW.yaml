# 每日創作提示 — 光影
# 主題：以光與影為題材去「做」一件東西（不只觀察）。繁體中文（台灣用語），每一則獨一無二。

- id: p-light-001
  text: 只用明暗兩色，畫出一顆立體的球。
  tags: [light, minimal]
  estimatedMinutes: 10
- id: p-light-002
  text: 用剪影做一個你喜歡的角色，不畫細節。
  tags: [light, character]
  estimatedMinutes: 15
- id: p-light-003
  text: 找一道此刻的光，把它的形狀留下來。
  tags: [light, observation]
  estimatedMinutes: 5
- id: p-light-004
  text: 想像一盞燈，畫出它照亮的那個角落。
  tags: [light, mood]
  estimatedMinutes: 15
- id: p-light-005
  text: 用一張紙擋光，看影子變成什麼，記下來。
  tags: [light, play]
  estimatedMinutes: 8
- id: p-light-006
  text: 畫同一個物件，一次逆光、一次順光。
  tags: [light, study]
  estimatedMinutes: 20
- id: p-light-007
  text: 替一個場景決定：光從哪裡來？畫箭頭標出。
  tags: [light, framing]
  estimatedMinutes: 5
- id: p-light-008
  text: 用最深的黑，襯出一小塊最亮的白。
  tags: [light, minimal]
  estimatedMinutes: 10
- id: p-light-009
  text: 畫黃昏，只靠顏色的冷暖說出時間。
  tags: [light, color]
  estimatedMinutes: 20
- id: p-light-010
  text: 讓影子比主角更有戲，畫這樣一張圖。
  tags: [light, narrative]
  estimatedMinutes: 20
- id: p-light-011
  text: 把房間關暗，用手機光畫一張長曝照片。
  tags: [light, play]
  estimatedMinutes: 10
- id: p-light-012
  text: 想一個只在特定光線下才成立的畫面。
  tags: [light, deep]
  estimatedMinutes: 10
- id: p-light-013
  text: 用漸層做出「天快亮了」的那一刻。
  tags: [light, color]
  estimatedMinutes: 15
- id: p-light-014
  text: 畫水面上的光，只用短短的筆觸。
  tags: [light, texture]
  estimatedMinutes: 15
- id: p-light-015
  text: 替一個角色打一盞側光，看他多了什麼情緒。
  tags: [light, character]
  estimatedMinutes: 15
- id: p-light-016
  text: 用三階明暗，把一張照片重畫成剪影感。
  tags: [light, study]
  estimatedMinutes: 20
- id: p-light-017
  text: 畫窗簾縫裡漏進來的一條光。
  tags: [light, observation]
  estimatedMinutes: 10
- id: p-light-018
  text: 想像沒有影子的世界，畫一格它的樣子。
  tags: [light, abstract]
  estimatedMinutes: 12
- id: p-light-019
  text: 用光把觀眾的眼睛，帶到你要的那個點。
  tags: [light, framing]
  estimatedMinutes: 10
- id: p-light-020
  text: 畫一支蠟燭，和它照不到的那片黑。
  tags: [light, mood]
  estimatedMinutes: 15
