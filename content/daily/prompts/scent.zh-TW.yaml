# 每日創作提示 — 氣味／味道。把聞到的、嚐到的變成畫面。繁體中文，每一則獨一無二。
- id: p-scent-001
  text: 畫出「剛下過雨」的味道。
  tags: [scent, imagine]
  estimatedMinutes: 10
- id: p-scent-002
  text: 替一種你喜歡的氣味配一個顏色。
  tags: [scent, color]
  estimatedMinutes: 8
- id: p-scent-003
  text: 畫一杯讓你安心的熱飲。
  tags: [scent, mood]
  estimatedMinutes: 12
- id: p-scent-004
  text: 想像一種香味的形狀，把它畫出來。
  tags: [scent, abstract]
  estimatedMinutes: 12
- id: p-scent-005
  text: 用畫面表現「家的味道」。
  tags: [scent, deep]
  estimatedMinutes: 15
- id: p-scent-006
  text: 替一道記憶中的菜，設計一張菜單。
  tags: [scent, design]
  estimatedMinutes: 15
- id: p-scent-007
