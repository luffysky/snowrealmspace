# 每日創作提示 — 未來／想像。為還沒發生的事做點什麼。繁體中文，每一則獨一無二。
- id: p-future-001
  text: 畫十年後的這個房間會長什麼樣。
  tags: [future, imagine]
  estimatedMinutes: 15
- id: p-future-002
  text: 為一個還沒發生的節日設計一張卡。
  tags: [future, design]
  estimatedMinutes: 20
- id: p-future-003
  text: 想像未來的你，替他畫一件順手的工具。
  tags: [future, imagine]
  estimatedMinutes: 15
- id: p-future-004
  text: 設計一座你想住的城市的路標。
  tags: [future, design]
  estimatedMinutes: 20
- id: p-future-005
  text: 畫一個一百年後還在用的東西。
  tags: [future, imagine]
  estimatedMinutes: 15
- id: p-future-006
  text: 替「明天的自己」留一張便條的版面。
  tags: [future, typography]
  estimatedMinutes: 10
- id: p-future-007
  text: 想一個未來的職業，畫它的名片。
  tags: [future, design]
  estimatedMinutes: 15
- id: p-future-008
  text: 設計一面代表你理想生活的旗子。
  tags: [future, design]
  estimatedMinutes: 15
- id: p-future-009
  text: 畫下你希望被記得的一個畫面。
  tags: [future, deep]
  estimatedMinutes: 15
- id: p-future-010
  text: 為五年後的作品集想一個封面。
  tags: [future, design]
  estimatedMinutes: 20
- id: p-future-011
  text: 想像一種還沒被發明的樂器，畫它。
  tags: [future, imagine]
  estimatedMinutes: 15
- id: p-future-012
  text: 為未來的一封信，設計它的信封。
  tags: [future, design]
  estimatedMinutes: 10
- id: p-future-013
  text: 替「等我有空就要做」的清單畫張插圖。
  tags: [future, play]
  estimatedMinutes: 10
- id: p-future-014
  text: 設計一個屬於你的未來節日的圖標。
  tags: [future, design]
  estimatedMinutes: 12
- id: p-future-015
  text: 想像老了以後的興趣，畫一個場景。
  tags: [future, imagine]
  estimatedMinutes: 20
- id: p-future-016
  text: 為一個夢想中的空間，畫一張地圖。
  tags: [future, design]
  estimatedMinutes: 20
- id: p-future-017
  text: 畫下明年此刻你希望正在做的事。
  tags: [future, deep]
  estimatedMinutes: 10
- id: p-future-018
  text: 替未來的自己，排一句座右銘的版面。
  tags: [future, typography]
  estimatedMinutes: 10
- id: p-future-019
  text: 想一個未來的節日食物，把它畫出來。
  tags: [future, imagine]
  estimatedMinutes: 12
- id: p-future-020
  text: 為「還沒開始的那件事」畫下第一格。
  tags: [future, quick]
  estimatedMinutes: 8
