  text: 畫一種對稱的圖形。
  tags: [pattern, abstract]
  estimatedMinutes: 12
- id: p-pattern-016
  text: 設計一款地毯的花紋。
  tags: [pattern, design]
  estimatedMinutes: 20
- id: p-pattern-017
  text: 畫雨滴排成的規律。
  tags: [pattern, minimal]
  estimatedMinutes: 12
- id: p-pattern-018
  text: 用交錯的線，畫出編織感。
  tags: [pattern, abstract]
  estimatedMinutes: 15
- id: p-pattern-019
  text: 畫星星佈滿一整面的樣子。
  tags: [pattern, mood]
  estimatedMinutes: 15
- id: p-pattern-020
  text: 設計一個能無限延伸的圖案。
  tags: [pattern, design]
  estimatedMinutes: 20
