# 每日創作提示 — 圖案／重複。畫花紋、規律、拼貼。繁體中文，每一則獨一無二。
- id: p-pattern-001
  text: 用一個形狀，重複排成一整片。
  tags: [pattern, abstract]
  estimatedMinutes: 12
- id: p-pattern-002
  text: 設計一款你會想穿的布料花紋。
  tags: [pattern, design]
  estimatedMinutes: 20
- id: p-pattern-003
  text: 畫磁磚拼起來的規律。
  tags: [pattern, minimal]
  estimatedMinutes: 15
- id: p-pattern-004
  text: 用點和線，填滿一個方格。
  tags: [pattern, abstract]
  estimatedMinutes: 12
- id: p-pattern-005
  text: 畫大自然裡的一種重複（如鱗片）。
  tags: [pattern, nature]
  estimatedMinutes: 15
- id: p-pattern-006
  text: 設計一張包裝紙的圖案。
  tags: [pattern, design]
  estimatedMinutes: 20
- id: p-pattern-007
  text: 畫波浪一層層的紋路。
  tags: [pattern, minimal]
  estimatedMinutes: 12
- id: p-pattern-008
  text: 用三種顏色，畫一個幾何圖案。
  tags: [pattern, color]
