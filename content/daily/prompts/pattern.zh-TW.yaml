  text: 畫蜂巢的六角格。
  tags: [pattern, nature]
  estimatedMinutes: 12
- id: p-pattern-010
  text: 設計一款印章圖案。
  tags: [pattern, design]
  estimatedMinutes: 15
- id: p-pattern-011
  text: 畫由大到小排列的圓。
  tags: [pattern, minimal]
  estimatedMinutes: 12
- id: p-pattern-012
  text: 把你的名字，變成一個重複圖案。
  tags: [pattern, typography]
  estimatedMinutes: 15
- id: p-pattern-013
  text: 畫格子布的紋路。
  tags: [pattern, minimal]
  estimatedMinutes: 12
- id: p-pattern-014
  text: 用葉子形狀，排一圈花環。
  tags: [pattern, nature]
  estimatedMinutes: 15
