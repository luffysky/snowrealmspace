    text: 早安，深呼吸三次，心就安穩了
  - id: g-morning-699
    text: 起床囉，今天也不必太趕
  - id: g-morning-700
    text: 早安，聞聞早餐的香氣，日子就亮了
  - id: g-morning-701
    text: 陽光照到床邊了，慢慢醒來吧
  - id: g-morning-702
    text: 早安，先讓自己在被窩裡多待一分鐘也好
  - id: g-morning-703
    text: 一口熱湯或熱粥，替胃暖暖身
