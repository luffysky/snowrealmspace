# 問候補充（自動組裝、已去除近似重複與違規）。與其他 greetings 檔合併。
morning:
  - id: g-morning-676
    text: 早安，先喝一口溫水，讓身體慢慢醒過來
  - id: g-morning-677
    text: 窗外的光透進來了，今天也溫柔地開始吧
  - id: g-morning-678
    text: 睜開眼睛，深呼吸一口新鮮的早晨空氣
  - id: g-morning-679
    text: 早安呀，記得替自己準備一份簡單的早餐
  - id: g-morning-680
    text: 讓晨光陪你伸個懶腰，一整天就從容了
  - id: g-morning-681
    text: 慢慢起床沒關係，時間會等你一會兒
  - id: g-morning-682
    text: 第一口熱飲下肚，心也跟著暖起來了
  - id: g-morning-683
    text: 早安，今天的天氣很適合好好開始
  - id: g-morning-684
    text: 拉開窗簾，讓陽光替你道一聲早安
  - id: g-morning-685
    text: 伸展一下肩膀，把睡意輕輕抖落
  - id: g-morning-686
    text: 早安，願你今天的步調不疾不徐
  - id: g-morning-687
    text: 先坐一會兒，聽聽清晨安靜的聲音
  - id: g-morning-688
    text: 喝杯溫熱的茶，替一天鋪上暖底色
  - id: g-morning-689
    text: 早安，今天想吃點什麼當早餐呢
  - id: g-morning-690
    text: 讓深呼吸把新的一天輕輕迎進來
  - id: g-morning-691
    text: 早安，窗邊的光線正剛剛好
  - id: g-morning-692
    text: 起床後先喝水，身體會謝謝你的
  - id: g-morning-693
    text: 早安呀，慢慢地把眼睛睜開就好
  - id: g-morning-694
    text: 今天的清晨很清爽，適合輕輕開始
  - id: g-morning-695
    text: 先給自己一個伸展，再迎接這一天
  - id: g-morning-696
    text: 早安，一杯溫水是給自己最溫柔的問候
  - id: g-morning-697
    text: 讓晨風吹一吹，把昨天的疲憊帶走
