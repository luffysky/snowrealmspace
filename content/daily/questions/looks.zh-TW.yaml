# 每日一問 · 外表與形象。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-looks-001
  text: 你最喜歡自己外表的哪個地方？
  tags: [looks]
- id: qn-looks-002
  text: 照鏡子的時候，你的目光通常先停在哪裡？
  tags: [looks]
- id: qn-looks-003
  text: 有沒有一件衣服，穿上它你就特別有底氣？
  tags: [looks]
- id: qn-looks-004
  text: 別人形容你的長相時，哪個說法讓你印象最深？
  tags: [looks]
- id: qn-looks-005
  text: 你覺得自己的哪個表情，最像真正的你？
  tags: [looks]
- id: qn-looks-006
  text: 對你來說，打扮這件事比較像享受還是負擔？
  tags: [looks]
- id: qn-looks-007
  text: 拍照時你習慣怎麼站、怎麼笑，背後有什麼小心思嗎？
  tags: [looks]
- id: qn-looks-008
  text: 哪一種顏色穿在身上，會讓你覺得比較像自己？
  tags: [looks]
- id: qn-looks-009
  text: 你身上有沒有一個特徵，是家人也有的？
  tags: [looks]
- id: qn-looks-010
  text: 如果外表能透露一種訊息給陌生人，你希望是什麼？
  tags: [looks]
- id: qn-looks-011
  text: 這些年來，你和自己外表的關係有了什麼變化？
  tags: [looks]
- id: qn-looks-012
  text: 什麼樣的裝扮，會讓你一整天心情都輕快起來？
  tags: [looks]
- id: qn-looks-013
  text: 你曾經想改變的某個外表細節，現在還在意嗎？
  tags: [looks]
- id: qn-looks-014
  text: 在你眼中，一個人的哪種樣子最有吸引力？
  tags: [looks]
- id: qn-looks-015
  text: 你的髮型，藏著什麼樣的故事或習慣？
  tags: [looks]
- id: qn-looks-016
  text: 有哪個配件或小物，幾乎成了你的標誌？
  tags: [looks]
- id: qn-looks-017
  text: 素顏、隨性的樣子，你在誰面前最自在？
  tags: [looks]
- id: qn-looks-018
  text: 你覺得「好看」和「像自己」，對你哪個更重要？
  tags: [looks]
- id: qn-looks-019
  text: 若要為明天的自己挑一身裝扮，你會想傳達什麼氣氛？
  tags: [looks]
- id: qn-looks-020
  text: 回想某張你很喜歡的自己的照片，那天發生了什麼？
  tags: [looks]
