# 每日一問 · 老照片與相簿。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-photo-001
  text: 你家還留著實體相簿嗎，它現在放在哪裡？
  tags: [photo]
- id: qn-photo-002
  text: 翻開一本老相簿，你的目光通常最先停在哪一張？
  tags: [photo]
- id: qn-photo-003
  text: 有沒有一張照片，你怎麼看都覺得拍得很好笑？
  tags: [photo]
- id: qn-photo-004
  text: 小時候被大人拿相機對著你時，你是愛笑還是想躲？
  tags: [photo]
- id: qn-photo-005
  text: 如果只能挑一張照片掛在牆上，你會選哪一張？
  tags: [photo]
- id: qn-photo-006
  text: 你手機裡最舊的一張照片，是什麼畫面？
  tags: [photo]
- id: qn-photo-007
  text: 拍團體照時，你習慣站在中間還是邊邊？
  tags: [photo]
- id: qn-photo-008
  text: 有哪一張照片，是你希望自己當時多拍幾張的？
  tags: [photo]
- id: qn-photo-009
  text: 沖洗出來的相片和螢幕上的照片，你比較喜歡哪一種質感？
  tags: [photo]
- id: qn-photo-010
  text: 相簿裡有沒有一張，你已經想不起來是誰幫你拍的？
  tags: [photo]
- id: qn-photo-011
  text: 你會為了拍一張滿意的照片，重來很多次嗎？
  tags: [photo]
- id: qn-photo-012
  text: 看到自己很小很小時候的照片，你第一個念頭是什麼？
  tags: [photo]
- id: qn-photo-013
  text: 有沒有一張照片，背後藏著一段只有你知道的故事？
  tags: [photo]
- id: qn-photo-014
  text: 如果要幫一本相簿取個名字，你會怎麼命名？
  tags: [photo]
- id: qn-photo-015
  text: 你比較喜歡當按快門的人，還是被拍的人？
  tags: [photo]
- id: qn-photo-016
  text: 泛黃、褪色的老照片，在你眼中是缺點還是韻味？
  tags: [photo]
- id: qn-photo-017
  text: 曾經有哪一張照片，你偷偷把它從相簿裡抽掉過嗎？
  tags: [photo]
- id: qn-photo-018
  text: 若要為現在的生活拍一張代表照，你會怎麼構圖？
  tags: [photo]
- id: qn-photo-019
  text: 家族合照裡，最讓你想多看幾眼的是哪個人的表情？
  tags: [photo]
- id: qn-photo-020
  text: 五十年後有人翻到你今天拍的照片，你希望他看見什麼？
  tags: [photo]
