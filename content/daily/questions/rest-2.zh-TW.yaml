# 每日一問 · 休息（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-rest-021
  text: 對你來說，怎樣算是一個「有喘息」的日子？
  tags: [rest]
- id: qn-rest-022
  text: 身體有哪個部位，最近特別想被放鬆一下？
  tags: [rest]
- id: qn-rest-023
  text: 你會用什麼方式，替自己按下暫停鍵？
  tags: [rest]
- id: qn-rest-024
  text: 睡前做哪件小事，會讓你比較好入睡？
  tags: [rest]
- id: qn-rest-025
  text: 什麼樣的空間，待著待著就會鬆下來？
  tags: [rest]
- id: qn-rest-026
  text: 手機放下之後，你的時間通常會流向哪裡？
  tags: [rest]
- id: qn-rest-027
  text: 哪一種安靜，是你喜歡的那種安靜？
  tags: [rest]
- id: qn-rest-028
  text: 假如可以什麼都不做一整天，你想怎麼過？
  tags: [rest]
- id: qn-rest-029
  text: 你有沒有一個能讓自己安定下來的小儀式？
  tags: [rest]
- id: qn-rest-030
  text: 泡在水裡或曬著太陽時，你都在想些什麼？
  tags: [rest]
- id: qn-rest-031
  text: 什麼樣的溫度，會讓你覺得整個人被包住了？
  tags: [rest]
- id: qn-rest-032
  text: 你怎麼分辨自己是「真的累」還是「只是煩」？
  tags: [rest]
- id: qn-rest-033
  text: 有哪些事，你其實可以放心交給明天？
  tags: [rest]
- id: qn-rest-034
  text: 週末的哪個片段，是你最捨不得結束的？
  tags: [rest]
- id: qn-rest-035
  text: 什麼樣的陪伴，讓你就算不說話也很自在？
  tags: [rest]
- id: qn-rest-036
  text: 你想拒絕掉哪件事，好留一點空給自己？
  tags: [rest]
- id: qn-rest-037
  text: 哪一種天氣，最適合你窩著什麼都不管？
  tags: [rest]
- id: qn-rest-038
  text: 你上一次好好吃頓飯、不趕時間，是什麼感覺？
  tags: [rest]
- id: qn-rest-039
  text: 如果替今晚的自己選一首背景音，你會選什麼？
  tags: [rest]
- id: qn-rest-040
  text: 此刻的你，最想跟自己說哪一句貼心的話？
  tags: [rest]
