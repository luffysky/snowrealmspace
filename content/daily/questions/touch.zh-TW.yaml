# 每日一問 · 觸覺與質感。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-touch-001
  text: 有沒有一種材質，你只要摸到就會覺得安心？
  tags: [touch]
- id: qn-touch-002
  text: 你偏好光滑平整的表面，還是帶點顆粒的質地？
  tags: [touch]
- id: qn-touch-003
  text: 家裡哪一件物品，摸起來的手感是你特別喜歡的？
  tags: [touch]
- id: qn-touch-004
  text: 剛洗好曬乾的衣物貼上皮膚時，是什麼樣的感覺？
  tags: [touch]
- id: qn-touch-005
  text: 你喜歡厚重紮實的觸感，還是輕薄柔軟的那種？
  tags: [touch]
- id: qn-touch-006
  text: 有哪一種布料，是你穿在身上會覺得放鬆的？
  tags: [touch]
- id: qn-touch-007
  text: 赤腳踩在不同地面上，你最喜歡踩到什麼？
  tags: [touch]
- id: qn-touch-008
  text: 木頭、金屬、陶土，握在手裡你偏愛哪一種的感覺？
  tags: [touch]
- id: qn-touch-009
  text: 有沒有一種觸感，是你其實有點抗拒去碰的？
  tags: [touch]
- id: qn-touch-010
  text: 你手邊常拿的杯子，握起來的重量和質地如何？
  tags: [touch]
- id: qn-touch-011
  text: 冰涼和溫熱的觸感，此刻你的手更想要哪一種？
  tags: [touch]
- id: qn-touch-012
  text: 挑東西時，你會不會忍不住先用手去摸摸看？
  tags: [touch]
- id: qn-touch-013
  text: 哪一種被子或毯子的觸感，最能讓你睡得安穩？
  tags: [touch]
- id: qn-touch-014
  text: 翻書時紙張在指尖的感覺，對你來說重要嗎？
  tags: [touch]
- id: qn-touch-015
  text: 有沒有一個表面，你走過就想伸手滑過去？
  tags: [touch]
- id: qn-touch-016
  text: 毛茸茸的東西摸在手上，會帶給你什麼感覺？
  tags: [touch]
- id: qn-touch-017
  text: 你喜歡新東西的挺括，還是用久了磨出的柔軟？
  tags: [touch]
- id: qn-touch-018
  text: 揉捏或把玩一樣東西時，什麼樣的質地最順手？
  tags: [touch]
- id: qn-touch-019
  text: 有哪一種觸感，會讓你想起某個人或某個地方？
  tags: [touch]
- id: qn-touch-020
  text: 如果替今天的心情選一種質地，它摸起來是什麼樣子？
  tags: [touch]
