# 每日一問 · 鄰居與社區（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-neighbor-021
  text: 你住的這一帶，有沒有一種只有本地人才懂的日常景象？
  tags: [neighbor]
- id: qn-neighbor-022
  text: 清晨的社區裡，最先醒來的是哪些聲音？
  tags: [neighbor]
- id: qn-neighbor-023
  text: 你和鄰居之間，有沒有一種不必開口就默契十足的相處方式？
  tags: [neighbor]
- id: qn-neighbor-024
  text: 附近有沒有一棵樹或一面牆，是你每天都會經過的？
  tags: [neighbor]
- id: qn-neighbor-025
  text: 如果要帶朋友逛一圈你家周邊，你會先帶他去哪裡？
  tags: [neighbor]
- id: qn-neighbor-026
  text: 社區裡那位總在固定時間出現的人，你有沒有好奇過他的故事？
  tags: [neighbor]
- id: qn-neighbor-027
  text: 你覺得住處附近，哪個時段的樣子最迷人？
  tags: [neighbor]
- id: qn-neighbor-028
  text: 巷口那家店的老闆，和你之間累積了什麼樣的默契？
  tags: [neighbor]
- id: qn-neighbor-029
  text: 遇到鄰里間的小摩擦時，你多半會怎麼看待？
  tags: [neighbor]
- id: qn-neighbor-030
  text: 你家附近有沒有一個聲音，一聽到就知道幾點了？
  tags: [neighbor]
- id: qn-neighbor-031
  text: 假如社區牆上能貼一句話給大家看，你會想寫什麼？
  tags: [neighbor]
- id: qn-neighbor-032
  text: 你會不會記得某位鄰居家門口的擺設或盆栽？
  tags: [neighbor]
- id: qn-neighbor-033
  text: 下雨天的社區，和晴天時，給你的感覺差在哪裡？
  tags: [neighbor]
- id: qn-neighbor-034
  text: 附近有沒有一個地方，是你心情煩的時候會想去走走的？
  tags: [neighbor]
- id: qn-neighbor-035
  text: 你們這一帶的孩子們，通常都在哪裡玩耍？
  tags: [neighbor]
- id: qn-neighbor-036
  text: 如果要用一種氣味來記住現在住的地方，你會想到什麼？
  tags: [neighbor]
- id: qn-neighbor-037
  text: 逢年過節時，你的社區會出現什麼平常沒有的畫面？
  tags: [neighbor]
- id: qn-neighbor-038
  text: 你和哪一位鄰居的交集，是從一件很小的事開始的？
  tags: [neighbor]
- id: qn-neighbor-039
  text: 對你來說，什麼樣的一條街會讓人想放慢腳步？
  tags: [neighbor]
- id: qn-neighbor-040
  text: 多年以後回想現在的住處，你猜自己最先想起的會是什麼？
  tags: [neighbor]
