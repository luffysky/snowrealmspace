# 每日一問 · 運氣與迷信。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-luck-001
  text: 你相信運氣嗎，還是覺得一切都是自己努力來的？
  tags: [luck]
- id: qn-luck-002
  text: 有沒有哪個小習慣或小動作，是你偷偷相信會帶來好運的？
  tags: [luck]
- id: qn-luck-003
  text: 回想一件你覺得「運氣真好」的事，現在看它還算是運氣嗎？
  tags: [luck]
- id: qn-luck-004
  text: 如果好運真的存在，你會希望它出現在生活的哪個部分？
  tags: [luck]
- id: qn-luck-005
  text: 面對重要的日子，你會做些什麼來祈求順利？
  tags: [luck]
- id: qn-luck-006
  text: 小時候家裡有沒有流傳過某個禁忌，是你到現在都還記得的？
  tags: [luck]
- id: qn-luck-007
  text: 你身邊有沒有一件被你當成幸運物的東西，它的故事是什麼？
  tags: [luck]
- id: qn-luck-008
  text: 當事情不順時，你會歸咎於運氣不好，還是往別的方向想？
  tags: [luck]
- id: qn-luck-009
  text: 抽籤、星座或塔羅，這些預測對你來說代表著什麼？
  tags: [luck]
- id: qn-luck-010
  text: 你覺得一個人的運氣，是天生的還是可以慢慢養出來的？
  tags: [luck]
- id: qn-luck-011
  text: 假如今天能許一個一定會實現的願望，你會留給誰或留給什麼？
  tags: [luck]
- id: qn-luck-012
  text: 遇到黑貓、破鏡子或數字四這類說法，你心裡會有什麼反應？
  tags: [luck]
- id: qn-luck-013
  text: 在你眼中，努力和運氣的比例大概是幾比幾？
  tags: [luck]
- id: qn-luck-014
  text: 有沒有一次巧合，讓你忍不住覺得冥冥之中好像有安排？
  tags: [luck]
- id: qn-luck-015
  text: 考試前或比賽前，你有沒有非做不可的儀式？
  tags: [luck]
- id: qn-luck-016
  text: 如果把運氣想像成一個人，你覺得它對你算是好還是壞？
  tags: [luck]
- id: qn-luck-017
  text: 撿到一元硬幣或看到流星時，你通常會怎麼對待這種瞬間？
  tags: [luck]
- id: qn-luck-018
  text: 你會不會因為某個地方風水或氣氛，而覺得特別安心或不安？
  tags: [luck]
- id: qn-luck-019
  text: 別人說你很幸運的時候，你心裡是認同還是有點不服氣？
  tags: [luck]
- id: qn-luck-020
  text: 如果好運可以分給別人一些，你最想分給生命中的哪一位？
  tags: [luck]
