# 每日一問 · 聲音與寂靜。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sound-001
  text: 此刻靜下來，你能聽見的最細微的聲音是什麼？
  tags: [sound]
- id: qn-sound-002
  text: 哪一種日常聲響，會讓你莫名感到安心？
  tags: [sound]
- id: qn-sound-003
  text: 對你來說，真正的安靜是什麼樣子？
  tags: [sound]
- id: qn-sound-004
  text: 清晨最先傳進耳裡的聲音，通常是什麼？
  tags: [sound]
- id: qn-sound-005
  text: 有沒有一種噪音，久了反而讓你覺得像陪伴？
  tags: [sound]
- id: qn-sound-006
  text: 下雨打在窗上的聲音，會把你帶到哪裡去？
  tags: [sound]
- id: qn-sound-007
  text: 你最想逃離的是哪一種聲音？
  tags: [sound]
- id: qn-sound-008
  text: 某個人的笑聲，在你記憶裡是什麼樣的？
  tags: [sound]
- id: qn-sound-009
  text: 在完全無聲的房間待著，你會有什麼感覺？
  tags: [sound]
- id: qn-sound-010
  text: 大自然裡的哪一種聲音，最讓你想閉上眼睛去聽？
  tags: [sound]
- id: qn-sound-011
  text: 夜深人靜時，你家會發出哪些平常聽不到的聲響？
  tags: [sound]
- id: qn-sound-012
  text: 有沒有一句話的語氣或聲音，一直留在你心裡？
  tags: [sound]
- id: qn-sound-013
  text: 廚房裡切菜、燒水、鍋鏟的聲音，讓你想起什麼畫面？
  tags: [sound]
- id: qn-sound-014
  text: 你喜歡熱鬧的人聲，還是空曠的寂靜？為什麼？
  tags: [sound]
- id: qn-sound-015
  text: 走在街上時，哪一種環境音最容易抓住你的注意力？
  tags: [sound]
- id: qn-sound-016
  text: 如果要為「放鬆」錄一段聲音，你會錄下什麼？
  tags: [sound]
- id: qn-sound-017
  text: 遠處傳來卻聽不清的聲音，會勾起你什麼樣的想像？
  tags: [sound]
- id: qn-sound-018
  text: 童年住的地方，背景總是有著什麼樣的聲音？
  tags: [sound]
- id: qn-sound-019
  text: 什麼樣的寂靜讓你舒服，什麼樣的寂靜讓你不安？
  tags: [sound]
- id: qn-sound-020
  text: 今天有哪個聲音，讓你忍不住停下來多聽了一會兒？
  tags: [sound]
