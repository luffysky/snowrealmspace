# 每日一問 · 界線與拒絕（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-boundary-021
  text: 你比較容易替自己爭取的，是時間還是空間？
  tags: [boundary]
- id: qn-boundary-022
  text: 有沒有一種讚美，其實讓你覺得不太自在？
  tags: [boundary]
- id: qn-boundary-023
  text: 面對長輩的期待，你會怎麼守住自己的想法？
  tags: [boundary]
- id: qn-boundary-024
  text: 什麼樣的玩笑，會讓你笑不太出來？
  tags: [boundary]
- id: qn-boundary-025
  text: 你如何判斷一件事是幫忙，還是被理所當然地使喚？
  tags: [boundary]
- id: qn-boundary-026
  text: 在網路上，哪些關於你的事你會選擇不公開？
  tags: [boundary]
- id: qn-boundary-027
  text: 有沒有一個「以後再說」，其實是你委婉的拒絕？
  tags: [boundary]
- id: qn-boundary-028
  text: 當別人替你貼上標籤，你通常會怎麼回應？
  tags: [boundary]
- id: qn-boundary-029
  text: 你願意借給別人的，和不願意分享的，界線在哪？
  tags: [boundary]
- id: qn-boundary-030
  text: 面對情緒勒索，你有沒有一套保護自己的方式？
  tags: [boundary]
- id: qn-boundary-031
  text: 什麼樣的關心，會讓你覺得比較像是壓力？
  tags: [boundary]
- id: qn-boundary-032
  text: 你能不能自在地說出「這件事我需要想一想」？
  tags: [boundary]
- id: qn-boundary-033
  text: 在群體裡，你會怎麼保留一點只屬於自己的部分？
  tags: [boundary]
- id: qn-boundary-034
  text: 有沒有一個習慣，是你被越界後才慢慢學會的？
  tags: [boundary]
- id: qn-boundary-035
  text: 當對方一直追問，你會用什麼方式輕輕擋回去？
  tags: [boundary]
- id: qn-boundary-036
  text: 你覺得工作和生活之間，哪條線最需要守住？
  tags: [boundary]
- id: qn-boundary-037
  text: 有什麼事情是你願意讓步、卻不願意妥協的？
  tags: [boundary]
- id: qn-boundary-038
  text: 別人碰觸到你哪個話題時，你會想轉開？
  tags: [boundary]
- id: qn-boundary-039
  text: 你怎麼分辨一段關係是靠近，還是慢慢在越界？
  tags: [boundary]
- id: qn-boundary-040
  text: 如果要為自己立一條新的界線，你想從哪裡開始？
  tags: [boundary]
