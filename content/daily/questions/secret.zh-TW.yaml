# 每日一問 · 秘密與內心。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-secret-001
  text: 有沒有一件事，你藏在心裡很久卻從沒對任何人說過？
  tags: [secret]
- id: qn-secret-002
  text: 你最想被別人理解、卻很難說出口的一面是什麼？
  tags: [secret]
- id: qn-secret-003
  text: 獨處的時候，你腦中最常浮現的念頭是什麼？
  tags: [secret]
- id: qn-secret-004
  text: 有哪個夢想，你只敢在心裡默默想像？
  tags: [secret]
- id: qn-secret-005
  text: 你曾經對誰有過好感，卻始終沒讓對方知道？
  tags: [secret]
- id: qn-secret-006
  text: 什麼樣的話題，會讓你不自覺想把真心話收起來？
  tags: [secret]
- id: qn-secret-007
  text: 在別人面前，你最常戴上哪一種偽裝？
  tags: [secret]
- id: qn-secret-008
  text: 有沒有一種情緒，你習慣自己消化而不讓人看見？
  tags: [secret]
- id: qn-secret-009
  text: 你心裡有沒有一個地方，是誰都進不去的？
  tags: [secret]
- id: qn-secret-010
  text: 如果可以匿名說一句真話，你會想說什麼？
  tags: [secret]
- id: qn-secret-011
  text: 你曾經因為害怕被評價，而收起了哪個想法？
  tags: [secret]
- id: qn-secret-012
  text: 深夜獨自清醒時，你都在想些什麼？
  tags: [secret]
- id: qn-secret-013
  text: 有哪個關於自己的真相，你花了很久才願意承認？
  tags: [secret]
- id: qn-secret-014
  text: 你私底下的樣子，和別人眼中的你差多少？
  tags: [secret]
- id: qn-secret-015
  text: 什麼事情發生時，你會選擇一個人默默承受？
  tags: [secret]
- id: qn-secret-016
  text: 你心底有沒有一個一直放不下的人或畫面？
  tags: [secret]
- id: qn-secret-017
  text: 有哪句想對某個人說的話，至今還卡在喉嚨裡？
  tags: [secret]
- id: qn-secret-018
  text: 你會在什麼時刻，特別想找人說說心事？
  tags: [secret]
- id: qn-secret-019
  text: 對你來說，把秘密交給別人保管是什麼感覺？
  tags: [secret]
- id: qn-secret-020
  text: 如果今天可以放下一個心裡的重擔，你會選哪一個？
  tags: [secret]
