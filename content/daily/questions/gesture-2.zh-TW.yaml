# 每日一問 · 肢體與手勢（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-gesture-021
  text: 講電話的時候，你會不會邊講邊在空中比劃，明明對方看不到？
  tags: [gesture]
- id: qn-gesture-022
  text: 有沒有一個手勢，是你和某個人之間才懂的暗號？
  tags: [gesture]
- id: qn-gesture-023
  text: 走路的時候，你的雙手是自然擺動，還是習慣插口袋？
  tags: [gesture]
- id: qn-gesture-024
  text: 想不起某個字的瞬間，你的手指會做出什麼動作來幫忙？
  tags: [gesture]
- id: qn-gesture-025
  text: 有人在你面前哭的時候，你的第一個肢體反應是什麼？
  tags: [gesture]
- id: qn-gesture-026
  text: 吃到很燙或很辣的東西，你的臉和手會出現哪種標準反應？
  tags: [gesture]
- id: qn-gesture-027
  text: 你比較習慣用手指、用下巴，還是用眼神去指方向？
  tags: [gesture]
- id: qn-gesture-028
  text: 看恐怖片的時候，你的手最後都躲到哪裡去了？
  tags: [gesture]
- id: qn-gesture-029
  text: 認真聽別人說話時，你的頭會不會不自覺歪向某一邊？
  tags: [gesture]
- id: qn-gesture-030
  text: 有沒有一個動作，是你模仿某位偶像或角色學來的？
  tags: [gesture]
- id: qn-gesture-031
  text: 累到極點的時候，你的身體會用哪個姿勢來喊停？
  tags: [gesture]
- id: qn-gesture-032
  text: 在很安靜、不能出聲的場合，你會用什麼小動作跟同伴溝通？
  tags: [gesture]
- id: qn-gesture-033
  text: 你握手的力道，是偏用力，還是偏輕柔？
  tags: [gesture]
- id: qn-gesture-034
  text: 遇到超冷的天氣，你的身體會先縮起哪個部位取暖？
  tags: [gesture]
- id: qn-gesture-035
  text: 說謊或心虛的時候，你有沒有一個會出賣自己的小動作？
  tags: [gesture]
- id: qn-gesture-036
  text: 你笑到最開心的時候，是拍桌、跺腳，還是往後仰？
  tags: [gesture]
- id: qn-gesture-037
  text: 在人群裡想找一個人，你會踮腳、揮手，還是用別的方式？
  tags: [gesture]
- id: qn-gesture-038
  text: 有沒有哪個手勢，你小時候很愛比，長大後卻不好意思再做了？
  tags: [gesture]
- id: qn-gesture-039
  text: 面對鏡頭以外的場合，你的手在不知道放哪時會怎麼安置？
  tags: [gesture]
- id: qn-gesture-040
  text: 如果用一個肢體動作代表現在的你，那會是什麼樣子？
  tags: [gesture]
