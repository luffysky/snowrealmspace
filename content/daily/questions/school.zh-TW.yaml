# 每日一問 · 學生時代。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-school-001
  text: 學生時代哪一堂課，你到現在還記得？
  tags: [school]
- id: qn-school-002
  text: 唸書的時候，你最喜歡待在校園的哪個角落？
  tags: [school]
- id: qn-school-003
  text: 有沒有哪位老師，說過的一句話讓你一直放在心上？
  tags: [school]
- id: qn-school-004
  text: 回想學生時代，你都是怎麼度過午休時間的？
  tags: [school]
- id: qn-school-005
  text: 那時候的你，最怕遇到哪一種考試？
  tags: [school]
- id: qn-school-006
  text: 有沒有一個同學，讓你到現在還會偶爾想起？
  tags: [school]
- id: qn-school-007
  text: 放學回家的路上，你通常都在做些什麼？
  tags: [school]
- id: qn-school-008
  text: 制服、便當、鐘聲，哪一樣最能勾起你的校園回憶？
  tags: [school]
- id: qn-school-009
  text: 當年的你，對哪一個科目特別沒轍？
  tags: [school]
- id: qn-school-010
  text: 如果能回到學生時代的某一天，你想重新經歷哪一天？
  tags: [school]
- id: qn-school-011
  text: 那段日子裡，你曾經為了什麼事情熬夜過？
  tags: [school]
- id: qn-school-012
  text: 下課那短短十分鐘，你當年都拿來做什麼？
  tags: [school]
- id: qn-school-013
  text: 學生時代有哪一次的表現，讓你到現在還印象深刻？
  tags: [school]
- id: qn-school-014
  text: 校園裡的哪個活動，是你當年最期待的？
  tags: [school]
- id: qn-school-015
  text: 你還記得自己第一天上學時的心情嗎？
  tags: [school]
- id: qn-school-016
  text: 那時候你和朋友之間，流行過什麼樣的玩意兒？
  tags: [school]
- id: qn-school-017
  text: 學生時代的你，曾經偷偷嚮往成為什麼樣的人？
  tags: [school]
- id: qn-school-018
  text: 畢業那天，你心裡浮現的是什麼？
  tags: [school]
- id: qn-school-019
  text: 求學的路上，哪件事讓你第一次覺得自己長大了？
  tags: [school]
- id: qn-school-020
  text: 如果現在遇到當年的自己，你會想跟他聊些什麼？
  tags: [school]
