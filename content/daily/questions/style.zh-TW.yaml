# 每日一問 · 穿搭與風格。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-style-001
  text: 你今天穿的衣服，是憑什麼心情選的？
  tags: [style]
- id: qn-style-002
  text: 衣櫃裡有沒有一件，你怎麼穿都不會膩的單品？
  tags: [style]
- id: qn-style-003
  text: 對你來說，穿得舒服和穿得好看之間，你怎麼取捨？
  tags: [style]
- id: qn-style-004
  text: 哪一種顏色穿在身上，會讓你覺得更像自己？
  tags: [style]
- id: qn-style-005
  text: 你會為了不同場合換上不同的樣子嗎？
  tags: [style]
- id: qn-style-006
  text: 記憶中，有沒有一套衣服連結著某個特別的日子？
  tags: [style]
- id: qn-style-007
  text: 你挑衣服時，是先看款式、質料，還是先看價格？
  tags: [style]
- id: qn-style-008
  text: 如果衣櫃只能留三種顏色，你會留下哪些？
  tags: [style]
- id: qn-style-009
  text: 有沒有一種風格，是你欣賞卻還沒嘗試過的？
  tags: [style]
- id: qn-style-010
  text: 配件對你的整體造型，扮演著什麼角色？
  tags: [style]
- id: qn-style-011
  text: 你的穿衣風格，這幾年有沒有悄悄變化過？
  tags: [style]
- id: qn-style-012
  text: 什麼樣的一身打扮，會讓你走路時特別有底氣？
  tags: [style]
- id: qn-style-013
  text: 你會受身邊人的穿搭影響，還是比較走自己的路？
  tags: [style]
- id: qn-style-014
  text: 面對一件很喜歡卻不常穿的衣服，你都怎麼對待它？
  tags: [style]
- id: qn-style-015
  text: 鏡子前的你，最在意的是哪個部分的呈現？
  tags: [style]
- id: qn-style-016
  text: 對你而言，穿搭比較像是表達自己，還是融入環境？
  tags: [style]
- id: qn-style-017
  text: 有沒有一種材質，光是穿上就讓你覺得放鬆？
  tags: [style]
- id: qn-style-018
  text: 如果要用一件衣服代表現在的你，你會選哪一件？
  tags: [style]
- id: qn-style-019
  text: 你買衣服時，是計劃好才出手，還是遇到喜歡的就帶走？
  tags: [style]
- id: qn-style-020
  text: 換上一身全新的裝扮時，你心裡通常在期待什麼？
  tags: [style]
