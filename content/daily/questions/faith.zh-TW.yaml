# 每日一問 · 信仰與相信。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-faith-001
  text: 你相信的事情裡，有哪一件是說不清理由卻很篤定的？
  tags: [faith]
- id: qn-faith-002
  text: 心裡不安的時候，你會靠向什麼來安定自己？
  tags: [faith]
- id: qn-faith-003
  text: 有沒有一個小小的儀式，是你每天都會為自己保留的？
  tags: [faith]
- id: qn-faith-004
  text: 對你來說，「相信一件事」意味著什麼？
  tags: [faith]
- id: qn-faith-005
  text: 生活裡有哪個習慣，其實藏著你對某種東西的信任？
  tags: [faith]
- id: qn-faith-006
  text: 當事情開始失控，你心裡會抓住什麼不放？
  tags: [faith]
- id: qn-faith-007
  text: 有沒有一句話，你一直放在心底當作依靠？
  tags: [faith]
- id: qn-faith-008
  text: 你會相信直覺，還是比較相信想清楚後的判斷？
  tags: [faith]
- id: qn-faith-009
  text: 什麼樣的時刻，會讓你感覺到某種超越日常的東西？
  tags: [faith]
- id: qn-faith-010
  text: 你心中有沒有一個地方，去了就覺得被接住？
  tags: [faith]
- id: qn-faith-011
  text: 希望對你而言，是憑空長出來的，還是需要理由的？
  tags: [faith]
- id: qn-faith-012
  text: 有哪個信念，陪你走過某段不容易的日子？
  tags: [faith]
- id: qn-faith-013
  text: 你會為了心安，去做哪些看似沒必要的小事？
  tags: [faith]
- id: qn-faith-014
  text: 面對未知，你傾向交託，還是傾向掌控？
  tags: [faith]
- id: qn-faith-015
  text: 有沒有什麼，是你即使沒有證據也願意相信的？
  tags: [faith]
- id: qn-faith-016
  text: 你怎麼看待「緣分」這種說不明白的東西？
  tags: [faith]
- id: qn-faith-017
  text: 睡前那一刻，你心裡通常在對誰、對什麼說話？
  tags: [faith]
- id: qn-faith-018
  text: 讓你覺得世界仍然溫柔的，是哪些微小的證據？
  tags: [faith]
- id: qn-faith-019
  text: 你願意信任別人的速度，是快還是慢？
  tags: [faith]
- id: qn-faith-020
  text: 若要為自己挑一個護身的信念，你會選哪一個？
  tags: [faith]
