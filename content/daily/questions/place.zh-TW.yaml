# 每日一問 · 地方與城市。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-place-001
  text: 有沒有一個地方，光是想起就讓你安心？
  tags: [place]
- id: qn-place-002
  text: 如果可以住進任何一座城市，你會挑哪裡？
  tags: [place]
- id: qn-place-003
  text: 你成長的那個地方，留給你什麼樣的印象？
  tags: [place]
- id: qn-place-004
  text: 對你來說，怎樣的地方才算得上是「家」？
  tags: [place]
- id: qn-place-005
  text: 有哪個街角或小店，是你會特地繞過去看看的？
  tags: [place]
- id: qn-place-006
  text: 大城市的熱鬧和小鎮的安靜，你比較嚮往哪一種？
  tags: [place]
- id: qn-place-007
  text: 你心裡有沒有一個「總有一天要去住住看」的地方？
  tags: [place]
- id: qn-place-008
  text: 回到某個舊地方時，你通常會有什麼感覺？
  tags: [place]
- id: qn-place-009
  text: 什麼樣的氣味或聲音，會讓你想起某個特定的地方？
  tags: [place]
- id: qn-place-010
  text: 你居住的地方，最讓你捨不得離開的是什麼？
  tags: [place]
- id: qn-place-011
  text: 如果要向別人介紹你的城市，你會先帶他去哪裡？
  tags: [place]
- id: qn-place-012
  text: 有沒有一個地方，你去過一次就再也忘不掉？
  tags: [place]
- id: qn-place-013
  text: 靠海、靠山還是靠近市中心，你比較想生活在哪一種環境？
  tags: [place]
- id: qn-place-014
  text: 你心中理想的居住地，會是什麼樣的模樣？
  tags: [place]
- id: qn-place-015
  text: 哪個地方承載著你和某個人共同的回憶？
  tags: [place]
- id: qn-place-016
  text: 一座城市的哪些細節，會讓你覺得跟它親近起來？
  tags: [place]
- id: qn-place-017
  text: 你有沒有一個只屬於自己的秘密角落？
  tags: [place]
- id: qn-place-018
  text: 換個地方生活這件事，對你來說是期待還是猶豫？
  tags: [place]
- id: qn-place-019
  text: 你覺得一個地方的溫度，是由什麼決定的？
  tags: [place]
- id: qn-place-020
  text: 如果晚年可以選一個地方定居，你會怎麼描述它？
  tags: [place]
