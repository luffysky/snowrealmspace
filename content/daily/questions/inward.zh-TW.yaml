# 每日一問 · 身體/時間/勇氣/關係。溫和的反思，不評分、不比較。
- id: qn-body-01
  text: 今天你的身體，哪裡最需要放鬆？
  tags: [body]
- id: qn-body-02
  text: 上一次好好吃頓飯，是什麼時候？
  tags: [body]
- id: qn-body-03
  text: 今天你喝夠水了嗎？
  tags: [body]
- id: qn-body-04
  text: 如果累了，你會允許自己停下嗎？
  tags: [body, rest]
- id: qn-time-01
  text: 如果今天多出一小時，你會拿來做什麼？
  tags: [time]
- id: qn-time-02
  text: 最近你把時間花在哪，最值得？
  tags: [time]
- id: qn-time-03
  text: 有什麼事，你一直說「等有空再做」？
  tags: [time]
- id: qn-time-04
  text: 你希望三個月後的自己，正在做什麼？
  tags: [time]
- id: qn-courage-01
  text: 有什麼是你想試、卻一直沒敢的？
  tags: [courage]
- id: qn-courage-02
  text: 最近你為自己做過最勇敢的一件小事是什麼？
  tags: [courage]
- id: qn-courage-03
  text: 如果不會失敗，你今天想做什麼？
  tags: [courage]
- id: qn-courage-04
  text: 有什麼話，你一直想說卻還沒說？
  tags: [courage]
- id: qn-rel-01
  text: 最近誰讓你覺得被理解？
  tags: [relationship]
- id: qn-rel-02
  text: 有沒有一個人，你想謝謝卻還沒說？
  tags: [relationship]
- id: qn-rel-03
  text: 今天你想把好心情分給誰？
  tags: [relationship]
- id: qn-rel-04
  text: 上一次和人好好聊天，是什麼時候？
  tags: [relationship]
