# 每日一問 · 迷路與方向感（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-lost-021
  text: 有沒有一次迷路，反而成了你事後很喜歡回味的經歷？
  tags: [lost]
- id: qn-lost-022
  text: 在完全陌生的地方醒來，你會先靠哪個線索認出方位？
  tags: [lost]
- id: qn-lost-023
  text: 你記路是靠沿途的店家、招牌，還是靠拐彎的次數？
  tags: [lost]
- id: qn-lost-024
  text: 有沒有一座車站或地下街，總讓你在裡頭轉得暈頭轉向？
  tags: [lost]
- id: qn-lost-025
  text: 別人向你問路時，你多半答得清楚，還是也跟著慌了？
  tags: [lost]
- id: qn-lost-026
  text: 迷路時你會愈走愈快，還是索性放慢下來四處看看？
  tags: [lost]
- id: qn-lost-027
  text: 有沒有一個氣味或聲音，一出現你就知道快到家了？
  tags: [lost]
- id: qn-lost-028
  text: 在國外看不懂路牌時，你靠什麼撐過那段慌亂？
  tags: [lost]
- id: qn-lost-029
  text: 你分得出自己是路痴，還是只是懶得記路嗎？
  tags: [lost]
- id: qn-lost-030
  text: 有沒有一條你刻意繞開、寧可多走幾步的路？
  tags: [lost]
- id: qn-lost-031
  text: 跟著別人走時，你會默默記路，還是乾脆放空跟著？
  tags: [lost]
- id: qn-lost-032
  text: 搬到新的地方後，多久你才敢不看地圖出門？
  tags: [lost]
- id: qn-lost-033
  text: 有沒有哪個地方，你閉上眼睛也走得回去？
  tags: [lost]
- id: qn-lost-034
  text: 走在完全沒去過的巷弄裡，你心裡是興奮多還是不安多？
  tags: [lost]
- id: qn-lost-035
  text: 你會不會偶爾故意不看導航，讓自己憑感覺找找看？
  tags: [lost]
- id: qn-lost-036
  text: 天黑之後在陌生地方找路，你的感覺和白天有什麼不同？
  tags: [lost]
- id: qn-lost-037
  text: 有沒有一個路口或轉角，成了你心中某段回憶的座標？
  tags: [lost]
- id: qn-lost-038
  text: 同一段路來回走，去程和回程你的印象會不會差很多？
  tags: [lost]
- id: qn-lost-039
  text: 若同伴堅持往你覺得錯的方向走，你會開口還是先跟著？
  tags: [lost]
- id: qn-lost-040
  text: 這陣子的生活裡，你覺得自己是在找路，還是已認得方向？
  tags: [lost]
