# 每日一問 · 食物與味覺（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-food-021
  text: 你有沒有一道怎麼點都不會出錯的口袋名單餐廳菜色？
  tags: [food]
- id: qn-food-022
  text: 剩菜再加熱的隔天，哪一道反而比第一天更好吃？
  tags: [food]
- id: qn-food-023
  text: 你切菜、擺盤或收拾廚房時，腦袋裡通常在想些什麼？
  tags: [food]
- id: qn-food-024
  text: 如果餐桌上只能留一種調味料，你會捨不得丟掉哪一罐？
  tags: [food]
- id: qn-food-025
  text: 旅行途中吃到的哪一種食物，讓你回家後還想複製看看？
  tags: [food]
- id: qn-food-026
  text: 你偏好一次吃到飽，還是分成好幾小口慢慢品味？
  tags: [food]
- id: qn-food-027
  text: 有沒有一種食物的口感，光是想像就讓你起雞皮疙瘩？
  tags: [food]
- id: qn-food-028
  text: 節慶時餐桌上一定要出現的那道菜，對你代表著什麼？
  tags: [food]
- id: qn-food-029
  text: 如果幫今天的心情配一杯飲料，你會調出什麼樣的味道？
  tags: [food]
- id: qn-food-030
  text: 你在挑水果時，最相信自己的眼睛、鼻子還是手感？
  tags: [food]
- id: qn-food-031
  text: 別人推薦得天花亂墜、你卻始終無感的食物是哪一種？
  tags: [food]
- id: qn-food-032
  text: 廚房裡傳來的哪一種聲音，會讓你知道快要開飯了？
  tags: [food]
- id: qn-food-033
  text: 你會為了一種食材，特地繞去比較遠的店買嗎？
  tags: [food]
- id: qn-food-034
  text: 深夜的冰箱打開時，你最常伸手拿的是什麼？
  tags: [food]
- id: qn-food-035
  text: 有沒有一種食物，配上特定的天氣才顯得完整？
  tags: [food]
- id: qn-food-036
  text: 你吃辣的界線落在哪裡，又是怎麼摸索出來的？
  tags: [food]
- id: qn-food-037
  text: 假如要教一個從沒下過廚的人做菜，你會從哪一道開始？
  tags: [food]
- id: qn-food-038
  text: 一頓飯裡，你習慣先動筷子夾哪一樣？
  tags: [food]
- id: qn-food-039
  text: 有哪一種味道，是你長大之後才慢慢懂得欣賞的？
  tags: [food]
- id: qn-food-040
  text: 如果替你的家鄉選一種代表性的滋味，你會挑什麼？
  tags: [food]
