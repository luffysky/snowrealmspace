# 每日一問 · 星座與性格。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-zodiac-001
  text: 你覺得自己的個性，符合星座書上的描述嗎？
  tags: [zodiac]
- id: qn-zodiac-002
  text: 第一次認識新朋友時，你會好奇對方是什麼星座嗎？
  tags: [zodiac]
- id: qn-zodiac-003
  text: 如果用一個詞形容自己的性格，你會選哪一個？
  tags: [zodiac]
- id: qn-zodiac-004
  text: 十二星座裡，哪一個的形象讓你覺得最有趣？
  tags: [zodiac]
- id: qn-zodiac-005
  text: 你屬於偏內向還是偏外向的那一型？
  tags: [zodiac]
- id: qn-zodiac-006
  text: 有沒有哪個性格特質，是別人常說你有、你卻不太認同的？
  tags: [zodiac]
- id: qn-zodiac-007
  text: 看到每日運勢時，你通常抱著怎樣的心情去讀？
  tags: [zodiac]
- id: qn-zodiac-008
  text: 你覺得同星座的人，真的會有相似的地方嗎？
  tags: [zodiac]
- id: qn-zodiac-009
  text: 做決定的時候，你比較常靠直覺還是靠分析？
  tags: [zodiac]
- id: qn-zodiac-010
  text: 你身邊有沒有哪個星座的人，特別容易跟你聊得來？
  tags: [zodiac]
- id: qn-zodiac-011
  text: 如果性格可以微調一個地方，你會想改哪裡？
  tags: [zodiac]
- id: qn-zodiac-012
  text: 面對衝突時，你會傾向直接說出來還是先退一步？
  tags: [zodiac]
- id: qn-zodiac-013
  text: 你的哪一面，是熟了以後別人才會發現的？
  tags: [zodiac]
- id: qn-zodiac-014
  text: 星座配對這種說法，你會拿來當參考嗎？
  tags: [zodiac]
- id: qn-zodiac-015
  text: 獨處和跟一群人相處，哪一種比較能讓你充電？
  tags: [zodiac]
- id: qn-zodiac-016
  text: 你覺得自己是那種計畫派，還是隨遇而安派？
  tags: [zodiac]
- id: qn-zodiac-017
  text: 有沒有一個星座的特質，是你偷偷有點嚮往的？
  tags: [zodiac]
- id: qn-zodiac-018
  text: 心情起伏的時候，你通常會怎麼跟自己相處？
  tags: [zodiac]
- id: qn-zodiac-019
  text: 你相信性格是天生的，還是後來慢慢養成的？
  tags: [zodiac]
- id: qn-zodiac-020
  text: 如果要跟別人介紹你自己，你會從哪個特點講起？
  tags: [zodiac]
