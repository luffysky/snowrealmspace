# 每日一問 · 未來與想望。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-future-001
  text: 有沒有一個地方，你一直想去，卻還沒去成？
  tags: [future]
- id: qn-future-002
  text: 如果接下來一年可以學會一件新事情，你想學什麼？
  tags: [future]
- id: qn-future-003
  text: 你想像中五年後的某一天，會是什麼樣子？
  tags: [future]
- id: qn-future-004
  text: 有什麼事情是你一直想嘗試，卻還在等待合適時機的？
  tags: [future]
- id: qn-future-005
  text: 未來的你，會想住在什麼樣的地方？
  tags: [future]
- id: qn-future-006
  text: 如果可以無條件培養一個興趣，你想深入哪一種？
  tags: [future]
- id: qn-future-007
  text: 你希望自己將來成為什麼樣的人？
  tags: [future]
- id: qn-future-008
  text: 有沒有一種生活方式，是你很想親自試試看的？
  tags: [future]
- id: qn-future-009
  text: 接下來，你最想為自己安排什麼樣的一趟旅行？
  tags: [future]
- id: qn-future-010
  text: 你心裡有沒有一個還沒對誰說出口的計畫？
  tags: [future]
- id: qn-future-011
  text: 如果不用考慮現實條件，你最想投入哪一件事？
  tags: [future]
- id: qn-future-012
  text: 未來你想和誰一起度過更多時間？
  tags: [future]
- id: qn-future-013
  text: 有什麼能力是你希望到老了還能保有的？
  tags: [future]
- id: qn-future-014
  text: 你想像自己不必為生計奔波的日子，會怎麼過？
  tags: [future]
- id: qn-future-015
  text: 有沒有一個想望，你偷偷放在心裡很久了？
  tags: [future]
- id: qn-future-016
  text: 接下來這個季節，你想為自己創造什麼樣的體驗？
  tags: [future]
- id: qn-future-017
  text: 如果可以捎一句話給未來的自己，你會說什麼？
  tags: [future]
- id: qn-future-018
  text: 你希望將來所在的城市或環境，具備哪些條件？
  tags: [future]
- id: qn-future-019
  text: 有什麼是你現在還做不到、但很想有天做到的？
  tags: [future]
- id: qn-future-020
  text: 你心目中理想的一天，從早到晚會發生什麼？
  tags: [future]
