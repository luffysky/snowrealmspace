# 每日一問 · 飲料與咖啡茶。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-drink-001
  text: 今天想喝點什麼？
  tags: [drink]
- id: qn-drink-002
  text: 有沒有一種飲料，喝了就覺得整天被撫慰了？
  tags: [drink]
- id: qn-drink-003
  text: 你的手搖飲固定糖冰是怎麼搭配的？
  tags: [drink]
- id: qn-drink-004
  text: 咖啡和茶之間，你最近比較常靠近哪一邊？
  tags: [drink]
- id: qn-drink-005
  text: 記憶裡有哪杯飲料，是和某個人一起喝下的？
  tags: [drink]
- id: qn-drink-006
  text: 早晨的第一口，你習慣讓它是什麼味道？
  tags: [drink]
- id: qn-drink-007
  text: 什麼樣的天氣會讓你特別想來一杯熱的？
  tags: [drink]
- id: qn-drink-008
  text: 如果要形容你最愛的那杯咖啡，你會怎麼描述它？
  tags: [drink]
- id: qn-drink-009
  text: 珍珠、椰果、仙草這些配料，你偏心哪一種？
  tags: [drink]
- id: qn-drink-010
  text: 有沒有一款飲品，是你怎麼喝都不會膩的？
  tags: [drink]
- id: qn-drink-011
  text: 你會為了一杯特別的飲料，特地跑一趟遠一點的店嗎？
  tags: [drink]
- id: qn-drink-012
  text: 深夜想喝點東西時，手邊通常會是什麼？
  tags: [drink]
- id: qn-drink-013
  text: 無糖、微糖還是正常甜，這件事你有自己的堅持嗎？
  tags: [drink]
- id: qn-drink-014
  text: 哪一種茶的香氣，最能讓你鬆一口氣？
  tags: [drink]
- id: qn-drink-015
  text: 旅行時，你會想試試當地的什麼飲品？
  tags: [drink]
- id: qn-drink-016
  text: 你有沒有一個只屬於自己的私藏沖泡配方？
  tags: [drink]
- id: qn-drink-017
  text: 冰的還是熱的，這個選擇對你來說重要嗎？
  tags: [drink]
- id: qn-drink-018
  text: 一杯飲料要好喝，對你而言最關鍵的是哪一點？
  tags: [drink]
- id: qn-drink-019
  text: 帶氣泡的飲料，在你心裡是加分還是扣分？
  tags: [drink]
- id: qn-drink-020
  text: 若今天只能選一杯陪你到夜裡，你會選誰？
  tags: [drink]
