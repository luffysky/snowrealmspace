# 每日一問 · 座右銘與信念。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-motto-001
  text: 有沒有一句話，你一直放在心上？
  tags: [motto]
- id: qn-motto-002
  text: 你相信的事情裡，哪一件最難跟別人解釋清楚？
  tags: [motto]
- id: qn-motto-003
  text: 遇到猶豫不決的時候，你通常會問自己什麼？
  tags: [motto]
- id: qn-motto-004
  text: 小時候被教過的道理，哪一條到現在還算數？
  tags: [motto]
- id: qn-motto-005
  text: 如果要用一個字形容你做事的原則，會是哪個字？
  tags: [motto]
- id: qn-motto-006
  text: 曾經深信不疑、後來卻改觀的想法，是什麼？
  tags: [motto]
- id: qn-motto-007
  text: 在你看來，什麼樣的人算是活得誠實？
  tags: [motto]
- id: qn-motto-008
  text: 哪一句別人隨口說的話，意外地一直陪著你？
  tags: [motto]
- id: qn-motto-009
  text: 當你想放棄某件事，是什麼理由讓你留了下來？
  tags: [motto]
- id: qn-motto-010
  text: 你希望自己被記得的，是哪一種樣子？
  tags: [motto]
- id: qn-motto-011
  text: 面對不公平的事，你心裡那條底線畫在哪裡？
  tags: [motto]
- id: qn-motto-012
  text: 有什麼原則，是你就算吃虧也不願意退讓的？
  tags: [motto]
- id: qn-motto-013
  text: 你覺得善良和軟弱之間，差別在哪裡？
  tags: [motto]
- id: qn-motto-014
  text: 如果把你的價值觀寫成一句標語，會怎麼寫？
  tags: [motto]
- id: qn-motto-015
  text: 你欣賞一個人的時候，通常是被什麼特質打動？
  tags: [motto]
- id: qn-motto-016
  text: 讓你願意付出時間的事，背後是什麼樣的信念？
  tags: [motto]
- id: qn-motto-017
  text: 什麼樣的成功，對你來說才是真的成功？
  tags: [motto]
- id: qn-motto-018
  text: 你和過去的自己，在哪一件事的看法上分歧最大？
  tags: [motto]
- id: qn-motto-019
  text: 假如只能留一句話給後來的人，你想說什麼？
  tags: [motto]
- id: qn-motto-020
  text: 對你而言，什麼樣的一天算是沒有白過？
  tags: [motto]
