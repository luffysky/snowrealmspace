# 每日一問 · 金錢與慾望（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-money-021
  text: 小時候的零用錢，你多半怎麼分配掉？
  tags: [money]
- id: qn-money-022
  text: 面對訂閱制服務，你是怎麼決定哪個留、哪個退？
  tags: [money]
- id: qn-money-023
  text: 拿到薪水的那一刻，你腦中會浮現什麼畫面？
  tags: [money]
- id: qn-money-024
  text: 請客與被請之間，哪一種更讓你自在？
  tags: [money]
- id: qn-money-025
  text: 分期付款的選項出現時，你的心裡怎麼盤算？
  tags: [money]
- id: qn-money-026
  text: 收藏一件不實用的東西，對你來說值在哪裡？
  tags: [money]
- id: qn-money-027
  text: 你會為了體驗，還是為了留下實物而花錢？
  tags: [money]
- id: qn-money-028
  text: 談到錢，你和家人之間有哪些不成文的默契？
  tags: [money]
- id: qn-money-029
  text: 二手的東西，哪一類你買得下手、哪一類不行？
  tags: [money]
- id: qn-money-030
  text: 想像退休後的一天，你希望錢花在什麼上面？
  tags: [money]
- id: qn-money-031
  text: 你怎麼看待為別人送禮所花的那筆預算？
  tags: [money]
- id: qn-money-032
  text: 存下來的錢，對你而言代表著什麼？
  tags: [money]
- id: qn-money-033
  text: 帳戶數字掉到某個位置時，你會開始感到不安嗎？
  tags: [money]
- id: qn-money-034
  text: 一頓飯要多少錢，你才會覺得是在慰勞自己？
  tags: [money]
- id: qn-money-035
  text: 你身邊誰的金錢觀，悄悄影響了你？
  tags: [money]
- id: qn-money-036
  text: 免費的東西擺在眼前，你會用什麼標準決定拿不拿？
  tags: [money]
- id: qn-money-037
  text: 旅行時，你最捨得把錢花在哪一段體驗上？
  tags: [money]
- id: qn-money-038
  text: 借錢給人這件事，你心裡有沒有一條底線？
  tags: [money]
- id: qn-money-039
  text: 如果錢完全不是問題，你的一天會有什麼不同？
  tags: [money]
- id: qn-money-040
  text: 你對「夠用了」這三個字，是怎麼理解的？
  tags: [money]
