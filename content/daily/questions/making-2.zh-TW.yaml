# 每日一問 · 創作（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-making-021
  text: 如果作品可以發出聲音，你的會是什麼聲音？
  tags: [making]
- id: qn-making-022
  text: 你創作時習慣待在哪個角落，那裡有什麼？
  tags: [making]
- id: qn-making-023
  text: 哪一種顏色，最近一直想放進作品裡？
  tags: [making]
- id: qn-making-024
  text: 如果只能用一種工具創作一整年，你會選哪個？
  tags: [making]
- id: qn-making-025
  text: 你做東西時，通常放著什麼樣的背景音？
  tags: [making]
- id: qn-making-026
  text: 有沒有一個尺寸或規模，你一直想挑戰？
  tags: [making]
- id: qn-making-027
  text: 你會想跟誰一起合作一件作品？
  tags: [making]
- id: qn-making-028
  text: 如果作品要送去很遠的地方，你想它落腳在哪？
  tags: [making]
- id: qn-making-029
  text: 你創作時，哪個步驟最想跳過卻跳不掉？
  tags: [making]
- id: qn-making-030
  text: 有什麼平凡的東西，你想把它變成作品的材料？
  tags: [making]
- id: qn-making-031
  text: 如果替現在的自己做一件代表作，會是什麼形狀？
  tags: [making]
- id: qn-making-032
  text: 你想學會哪一項別人的手藝，好放進自己的創作？
  tags: [making]
- id: qn-making-033
  text: 哪個童年做過的東西，你想用現在的能力重做？
  tags: [making]
- id: qn-making-034
  text: 如果作品能保存一種氣味，你想封存哪一種？
  tags: [making]
- id: qn-making-035
  text: 你創作時的第一個動作，通常是什麼？
  tags: [making]
- id: qn-making-036
  text: 有沒有一個主題，你想用一整個系列去說？
  tags: [making]
- id: qn-making-037
  text: 如果限制自己只用三種元素，你會挑哪三種？
  tags: [making]
- id: qn-making-038
  text: 你想讓看到作品的人，第一眼注意到什麼？
  tags: [making]
- id: qn-making-039
  text: 哪一次和別人分享作品的經驗，還留在你心裡？
  tags: [making]
- id: qn-making-040
  text: 如果作品可以慢慢長大，你想它十年後變成什麼？
  tags: [making]
