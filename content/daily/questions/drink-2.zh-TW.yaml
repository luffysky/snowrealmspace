# 每日一問 · 飲料與咖啡茶（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-drink-021
  text: 你有沒有一間，光是踏進去就想坐下來的飲料店？
  tags: [drink]
- id: qn-drink-022
  text: 手裡捧著一杯溫熱的飲料時，你通常在想些什麼？
  tags: [drink]
- id: qn-drink-023
  text: 什麼樣的心情，會讓你特別想來點甜甜的？
  tags: [drink]
- id: qn-drink-024
  text: 你第一次愛上咖啡或茶，是被哪個部分打動的？
  tags: [drink]
- id: qn-drink-025
  text: 若要為某個朋友點一杯，你會依他的個性怎麼挑？
  tags: [drink]
- id: qn-drink-026
  text: 哪一種飲料的杯子或包裝，讓你光看就覺得舒服？
  tags: [drink]
- id: qn-drink-027
  text: 你會不會有一段時期，只固定喝某一款？
  tags: [drink]
- id: qn-drink-028
  text: 工作累了的下午，一杯什麼最能把你拉回精神？
  tags: [drink]
- id: qn-drink-029
  text: 你偏好在安靜獨處時喝，還是在熱鬧的桌邊喝？
  tags: [drink]
- id: qn-drink-030
  text: 有沒有一種味道，一喝就把你拉回某個季節？
  tags: [drink]
- id: qn-drink-031
  text: 從沖泡到入口的整段過程，哪一步最讓你期待？
  tags: [drink]
- id: qn-drink-032
  text: 你曾經嘗過什麼奇特組合，結果意外地喜歡？
  tags: [drink]
- id: qn-drink-033
  text: 一杯飲料的溫度變化，會影響你喝它的心情嗎？
  tags: [drink]
- id: qn-drink-034
  text: 你會怎麼替自己安排一天當中喝東西的節奏？
  tags: [drink]
- id: qn-drink-035
  text: 有沒有一款你只在特別日子才捨得點的？
  tags: [drink]
- id: qn-drink-036
  text: 你比較在意飲料的香氣、口感，還是入喉後的餘味？
  tags: [drink]
- id: qn-drink-037
  text: 如果要在家為某人泡一杯，你會想端出什麼？
  tags: [drink]
- id: qn-drink-038
  text: 哪一次和飲料有關的等待，讓你至今還記得？
  tags: [drink]
- id: qn-drink-039
  text: 你心裡有沒有一杯，是「怎麼都比不上當年那次」的？
  tags: [drink]
- id: qn-drink-040
  text: 若明天要嘗一種從沒喝過的，你會想從哪裡開始？
  tags: [drink]
