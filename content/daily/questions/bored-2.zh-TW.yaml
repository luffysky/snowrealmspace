# 每日一問 · 無聊時光（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-bored-021
  text: 一段沒有安排的時間交到你手上，你的直覺會怎麼運用它？
  tags: [bored]
- id: qn-bored-022
  text: 你身邊有沒有一樣東西，是專門陪你消磨零碎片刻的？
  tags: [bored]
- id: qn-bored-023
  text: 什麼樣的聲音，會讓你在放空時特別安心？
  tags: [bored]
- id: qn-bored-024
  text: 你分得出「休息」和「無聊」的界線嗎？
  tags: [bored]
- id: qn-bored-025
  text: 深夜睡不著又不想做事的時候，你都在想些什麼？
  tags: [bored]
- id: qn-bored-026
  text: 你會不會偶爾故意讓自己閒下來，只為了看看會發生什麼？
  tags: [bored]
- id: qn-bored-027
  text: 一整天什麼都不必負責，你猜自己會過得開心還是慌？
  tags: [bored]
- id: qn-bored-028
  text: 你有沒有一種很私人的、別人可能覺得無聊的樂趣？
  tags: [bored]
- id: qn-bored-029
  text: 通勤路上重複看見的風景，哪一段你反而看不膩？
  tags: [bored]
- id: qn-bored-030
  text: 當雙手閒著，你的腦袋通常忙著跑去哪裡？
  tags: [bored]
- id: qn-bored-031
  text: 你覺得無聊是身體在提醒你什麼，還是純粹只是無聊？
  tags: [bored]
- id: qn-bored-032
  text: 有沒有一種天氣，特別適合你什麼都不做？
  tags: [bored]
- id: qn-bored-033
  text: 假如把螢幕全部關掉一整天，你想像自己會怎麼度過？
  tags: [bored]
- id: qn-bored-034
  text: 你和無聊的關係，比起十年前是變好了還是變差了？
  tags: [bored]
- id: qn-bored-035
  text: 什麼樣的地方，會讓你甘願坐著發呆很久？
  tags: [bored]
- id: qn-bored-036
  text: 你有沒有在無所事事時，反而想通過某件卡很久的事？
  tags: [bored]
- id: qn-bored-037
  text: 面對一片空白的行事曆，你心裡浮起的是什麼感覺？
  tags: [bored]
- id: qn-bored-038
  text: 你最喜歡在哪個時段允許自己徹底放空？
  tags: [bored]
- id: qn-bored-039
  text: 如果無聊是一種顏色或氣味，你會怎麼形容它？
  tags: [bored]
- id: qn-bored-040
  text: 閒到不知道做什麼時，你希望有誰在身邊嗎？
  tags: [bored]
