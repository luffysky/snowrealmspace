# 每日一問 · 嗜好與興趣。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-hobby-001
  text: 有一件事，你可以一頭栽進去忘記時間，那是什麼？
  tags: [hobby]
- id: qn-hobby-002
  text: 你投入最久的興趣，最初是怎麼開始的？
  tags: [hobby]
- id: qn-hobby-003
  text: 為了某個愛好，你曾經花過最多心力在哪個環節？
  tags: [hobby]
- id: qn-hobby-004
  text: 有沒有一項興趣，是你私下鑽研卻很少對外提起的？
  tags: [hobby]
- id: qn-hobby-005
  text: 當你沉浸在喜歡的事情裡，身體會出現什麼感覺？
  tags: [hobby]
- id: qn-hobby-006
  text: 哪一樣工具或裝備，是你為愛好慎重挑選的？
  tags: [hobby]
- id: qn-hobby-007
  text: 你的興趣，帶你認識了什麼樣的人？
  tags: [hobby]
- id: qn-hobby-008
  text: 從那件長期喜歡的事裡，你學到了什麼帶得走的本領？
  tags: [hobby]
- id: qn-hobby-009
  text: 如果要向別人介紹你的愛好，你會從哪裡說起？
  tags: [hobby]
- id: qn-hobby-010
  text: 有沒有一個興趣，你曾經放下、後來又撿了回來？
  tags: [hobby]
- id: qn-hobby-011
  text: 你在這項愛好上，最近想挑戰什麼新的難度？
  tags: [hobby]
- id: qn-hobby-012
  text: 別人眼中很麻煩的過程，在你這裡卻是享受的是什麼？
  tags: [hobby]
- id: qn-hobby-013
  text: 你的興趣，佔據了家裡哪一塊專屬空間？
  tags: [hobby]
- id: qn-hobby-014
  text: 有哪個和你興趣相關的社群或圈子，讓你有歸屬感？
  tags: [hobby]
- id: qn-hobby-015
  text: 為了鑽研某樣愛好，你讀過或看過什麼難忘的東西？
  tags: [hobby]
- id: qn-hobby-016
  text: 你的哪一項興趣，長輩或朋友一開始並不太懂？
  tags: [hobby]
- id: qn-hobby-017
  text: 若有一整週只做喜歡的事，你會怎麼安排？
  tags: [hobby]
- id: qn-hobby-018
  text: 這項愛好裡，哪一個小小的成就讓你偷偷得意過？
  tags: [hobby]
- id: qn-hobby-019
  text: 你會想把哪個興趣，傳給身邊的某個人？
  tags: [hobby]
- id: qn-hobby-020
  text: 多年後回頭看，這項愛好在你生活裡扮演了什麼角色？
  tags: [hobby]
