# 每日一問 · 溫度與冷熱（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-temp-021
  text: 剛洗完澡走出浴室的那股熱氣，你喜歡嗎？
  tags: [temperature]
- id: qn-temp-022
  text: 對你來說，一個溫暖的擁抱大概有幾度？
  tags: [temperature]
- id: qn-temp-023
  text: 熱湯下肚的瞬間，身體是從哪裡開始暖起來的？
  tags: [temperature]
- id: qn-temp-024
  text: 你偏好被曬得暖烘烘的被子，還是冰涼的枕頭？
  tags: [temperature]
- id: qn-temp-025
  text: 有沒有一個地方，光是想到就讓你覺得很冷？
  tags: [temperature]
- id: qn-temp-026
  text: 握到別人冰冷的手時，你心裡會浮現什麼？
  tags: [temperature]
- id: qn-temp-027
  text: 早晨掀開被窩的那一刻，對你是享受還是煎熬？
  tags: [temperature]
- id: qn-temp-028
  text: 你會用什麼顏色，來形容「熱」這個感覺？
  tags: [temperature]
- id: qn-temp-029
  text: 一場突如其來的雨，把空氣變成了什麼溫度？
  tags: [temperature]
- id: qn-temp-030
  text: 你和身邊的人，對冷熱的感受一致嗎？
  tags: [temperature]
- id: qn-temp-031
  text: 圍巾繞上脖子的那一圈暖，讓你想起了誰？
  tags: [temperature]
- id: qn-temp-032
  text: 對你而言，「熱情」和「熱」有什麼相通之處？
  tags: [temperature]
- id: qn-temp-033
  text: 你曾經在多熱的地方，還是撐著沒開冷氣？
  tags: [temperature]
- id: qn-temp-034
  text: 手心冒汗的時候，通常代表你正處在什麼狀態？
  tags: [temperature]
- id: qn-temp-035
  text: 一碗剛端上桌還冒著煙的食物，先勾起你哪個感官？
  tags: [temperature]
- id: qn-temp-036
  text: 你覺得清晨和深夜，哪一段的涼更迷人？
  tags: [temperature]
- id: qn-temp-037
  text: 有沒有一種冷，是連加衣服都暖不回來的？
  tags: [temperature]
- id: qn-temp-038
  text: 踩進海水或溪水的第一步，你的反應是什麼？
  tags: [temperature]
- id: qn-temp-039
  text: 如果把心情換算成溫度，你今天大概幾度？
  tags: [temperature]
- id: qn-temp-040
  text: 你比較嚮往被爐火圍繞，還是被微風吹拂？
  tags: [temperature]
