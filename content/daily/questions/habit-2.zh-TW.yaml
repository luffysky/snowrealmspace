# 每日一問 · 習慣與日常（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-habit-021
  text: 你的手機裡，哪個 App 是你一天打開最多次的？
  tags: [habit]
- id: qn-habit-022
  text: 通勤或移動的路上，你都拿那段時間來做什麼？
  tags: [habit]
- id: qn-habit-023
  text: 有沒有一種聲音或氣味，會讓你立刻感覺回到家？
  tags: [habit]
- id: qn-habit-024
  text: 你整理東西的方式，比較像分門別類還是隨手就放？
  tags: [habit]
- id: qn-habit-025
  text: 一天當中，有哪個時刻是完全屬於你自己的？
  tags: [habit]
- id: qn-habit-026
  text: 你喝水、喝咖啡或喝茶，是照時間還是照心情？
  tags: [habit]
- id: qn-habit-027
  text: 有什麼小事，是你明知不必做卻還是每次都做的？
  tags: [habit]
- id: qn-habit-028
  text: 換季的時候，你的生活會跟著調整哪些地方？
  tags: [habit]
- id: qn-habit-029
  text: 睡不著的夜晚，你會讓自己做些什麼？
  tags: [habit]
- id: qn-habit-030
  text: 你記事情靠腦袋、靠筆記本，還是靠手機提醒？
  tags: [habit]
- id: qn-habit-031
  text: 家裡有沒有一樣舊東西，你一直捨不得換掉？
  tags: [habit]
- id: qn-habit-032
  text: 你買日用品時，是固定買同一種還是常常換換看？
  tags: [habit]
- id: qn-habit-033
  text: 一個人吃飯和跟人一起吃，你的感覺差在哪？
  tags: [habit]
- id: qn-habit-034
  text: 你出門前最後確認的那一件事，通常是什麼？
  tags: [habit]
- id: qn-habit-035
  text: 有沒有一段音樂，是你做某件事時固定會放的？
  tags: [habit]
- id: qn-habit-036
  text: 你洗澡的時候，腦袋裡最常浮現什麼？
  tags: [habit]
- id: qn-habit-037
  text: 週末的早晨，你允許自己賴床到什麼程度？
  tags: [habit]
- id: qn-habit-038
  text: 有什麼日常小事，做完會讓你莫名地滿足？
  tags: [habit]
- id: qn-habit-039
  text: 你跟身邊的人道別時，習慣用哪一句話或哪個動作？
  tags: [habit]
- id: qn-habit-040
  text: 如果要把今天濃縮成一個畫面，你會選哪一刻？
  tags: [habit]
