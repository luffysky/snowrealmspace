# 每日一問 · 流行與潮流（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-trend-021
  text: 有沒有一種流行，你當年很抗拒，後來卻默默入坑了？
  tags: [trend]
- id: qn-trend-022
  text: 你覺得哪一種正在紅的東西，過幾年可能會讓人尷尬到不想承認？
  tags: [trend]
- id: qn-trend-023
  text: 朋友都在追某部劇或某款遊戲時，你會跟上還是刻意錯開？
  tags: [trend]
- id: qn-trend-024
  text: 對你而言，一個流行從「新鮮」變成「膩了」大概要多久？
  tags: [trend]
- id: qn-trend-025
  text: 有沒有一句流行語，你其實不太懂意思卻還是跟著用？
  tags: [trend]
- id: qn-trend-026
  text: 你比較欣賞引領潮流的人，還是完全不理會潮流的人？
  tags: [trend]
- id: qn-trend-027
  text: 如果讓你把某個舊時代的流行帶回現在，你會選哪一樣？
  tags: [trend]
- id: qn-trend-028
  text: 你有沒有買過一個純粹因為爆紅、事後卻幾乎沒用的東西？
  tags: [trend]
- id: qn-trend-029
  text: 網路上那種一夜爆紅的人，你看的時候心裡在想什麼？
  tags: [trend]
- id: qn-trend-030
  text: 你覺得現在的流行，變得比以前更快還是更慢了？
  tags: [trend]
- id: qn-trend-031
  text: 有哪個領域的潮流，是你願意花心思一直追下去的？
  tags: [trend]
- id: qn-trend-032
  text: 當一樣你私下喜歡很久的東西突然爆紅，你的心情是什麼？
  tags: [trend]
- id: qn-trend-033
  text: 你怎麼看那些「反潮流」本身也變成一種潮流的現象？
  tags: [trend]
- id: qn-trend-034
  text: 有沒有一個流行，是你到現在都還沒搞懂它到底在紅什麼？
  tags: [trend]
- id: qn-trend-035
  text: 挑餐廳或景點時，網路上的排隊人氣對你的決定影響大嗎？
  tags: [trend]
- id: qn-trend-036
  text: 你身上有沒有哪個習慣或喜好，是被某一波風潮永久改變的？
  tags: [trend]
- id: qn-trend-037
  text: 如果流行是一陣風，你比較想當追風的人還是造風的人？
  tags: [trend]
- id: qn-trend-038
  text: 有沒有某個廣告或口號，紅到讓你到現在還能一字不漏背出來？
  tags: [trend]
- id: qn-trend-039
  text: 你覺得一個流行退燒之後，最先被大家遺忘的是哪個部分？
  tags: [trend]
- id: qn-trend-040
  text: 十年前的你，會怎麼看待今天你最常用的那個流行事物？
  tags: [trend]
