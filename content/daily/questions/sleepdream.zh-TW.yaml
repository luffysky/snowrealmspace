# 每日一問 · 睡夢與夢境。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sleepdream-001
  text: 昨晚睡覺時有做夢嗎，還記得夢裡的片段嗎？
  tags: [sleepdream]
- id: qn-sleepdream-002
  text: 你通常醒來後多久，夢的內容就會慢慢淡掉？
  tags: [sleepdream]
- id: qn-sleepdream-003
  text: 有沒有一個夢，你到現在都還記得它的畫面？
  tags: [sleepdream]
- id: qn-sleepdream-004
  text: 你的夢裡比較常出現熟人，還是不認識的臉孔？
  tags: [sleepdream]
- id: qn-sleepdream-005
  text: 有沒有一種場景，在你的夢中反覆地出現過？
  tags: [sleepdream]
- id: qn-sleepdream-006
  text: 你曾經在夢裡感覺到某種很真實的情緒嗎，那是什麼？
  tags: [sleepdream]
- id: qn-sleepdream-007
  text: 睡夢中你能飛、能奔跑，或做到什麼醒著做不到的事嗎？
  tags: [sleepdream]
- id: qn-sleepdream-008
  text: 有沒有被夢驚醒的經驗，醒來時是什麼感受？
  tags: [sleepdream]
- id: qn-sleepdream-009
  text: 你有沒有在夢裡意識到「這是一場夢」的時候？
  tags: [sleepdream]
- id: qn-sleepdream-010
  text: 白天發生的事，會不會偷偷跑進你當晚的夢裡？
  tags: [sleepdream]
- id: qn-sleepdream-011
  text: 你的夢多半是彩色的，還是有時像模糊的一片？
  tags: [sleepdream]
- id: qn-sleepdream-012
  text: 有沒有一個夢，醒來後讓你回味了一整天？
  tags: [sleepdream]
- id: qn-sleepdream-013
  text: 你入睡前的心情，會影響那一夜夢的感覺嗎？
  tags: [sleepdream]
- id: qn-sleepdream-014
  text: 夢裡去過哪些地方，是你現實中未曾造訪的？
  tags: [sleepdream]
- id: qn-sleepdream-015
  text: 有沒有一個久違的人，曾在你的夢中再次出現？
  tags: [sleepdream]
- id: qn-sleepdream-016
  text: 你會不會想把某些夢記下來，還是任它自然散去？
  tags: [sleepdream]
- id: qn-sleepdream-017
  text: 睡得深沉的夜晚，你隔天對夢還留有印象嗎？
  tags: [sleepdream]
- id: qn-sleepdream-018
  text: 有沒有哪個夢，在當下荒謬、醒來卻覺得意味深長？
  tags: [sleepdream]
- id: qn-sleepdream-019
  text: 你曾在夢裡聽見聲音、聞到氣味或嚐到味道嗎？
  tags: [sleepdream]
- id: qn-sleepdream-020
  text: 如果今晚能點一個夢來做，你會想夢見什麼？
  tags: [sleepdream]
