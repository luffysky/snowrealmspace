# 每日一問 · 平靜與安定。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-calm-001
  text: 什麼樣的時刻，會讓你覺得心裡很踏實？
  tags: [calm]
- id: qn-calm-002
  text: 當思緒亂了，你會用什麼方式讓自己安定下來？
  tags: [calm]
- id: qn-calm-003
  text: 有沒有一個地方，一想到就讓你覺得安心？
  tags: [calm]
- id: qn-calm-004
  text: 你心裡最平靜的一次，是什麼樣的畫面？
  tags: [calm]
- id: qn-calm-005
  text: 什麼樣的聲音，能讓你的內心慢慢沉靜？
  tags: [calm]
- id: qn-calm-006
  text: 和誰在一起的時候，你最能卸下心防？
  tags: [calm]
- id: qn-calm-007
  text: 哪一件小事，能悄悄安撫你緊繃的心？
  tags: [calm]
- id: qn-calm-008
  text: 你覺得什麼樣的日子，稱得上是安穩的？
  tags: [calm]
- id: qn-calm-009
  text: 心情浮動時，你會對自己說什麼樣的話？
  tags: [calm]
- id: qn-calm-010
  text: 有什麼東西握在手裡，會讓你感到安定？
  tags: [calm]
- id: qn-calm-011
  text: 你心中那份踏實感，通常從哪裡來？
  tags: [calm]
- id: qn-calm-012
  text: 一天之中，哪個片刻讓你覺得最平和？
  tags: [calm]
- id: qn-calm-013
  text: 面對未知時，是什麼讓你依然覺得穩穩的？
  tags: [calm]
- id: qn-calm-014
  text: 你會用哪一種氣味，讓自己的心緩下來？
  tags: [calm]
- id: qn-calm-015
  text: 什麼樣的空間，最能讓你的心安放下來？
  tags: [calm]
- id: qn-calm-016
  text: 心裡踏實的時候，你的身體有什麼感覺？
  tags: [calm]
- id: qn-calm-017
  text: 有哪一句話，曾經讓不安的你慢慢平靜？
  tags: [calm]
- id: qn-calm-018
  text: 你覺得安全感，比較像是什麼樣的存在？
  tags: [calm]
- id: qn-calm-019
  text: 什麼樣的節奏，會讓你的內心覺得剛剛好？
  tags: [calm]
- id: qn-calm-020
  text: 當一切都靜下來，你心底浮現的是什麼？
  tags: [calm]
