# 每日一問 · 物品與收藏。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-object-001
  text: 你身邊有沒有一件物品，捨不得丟卻也說不太上原因？
  tags: [objects]
- id: qn-object-002
  text: 如果搬家只能帶走三樣東西，你會選哪些？
  tags: [objects]
- id: qn-object-003
  text: 最近入手的物品裡，哪一件讓你覺得很值得？
  tags: [objects]
- id: qn-object-004
  text: 書桌或包包裡，總會固定出現的東西是什麼？
  tags: [objects]
- id: qn-object-005
  text: 有沒有一件禮物，多年後你依然記得是誰送的？
  tags: [objects]
- id: qn-object-006
  text: 你會為了什麼樣的東西，特地留一個角落來擺放？
  tags: [objects]
- id: qn-object-007
  text: 童年時最寶貝的那件玩具或物品，如今在哪裡？
  tags: [objects]
- id: qn-object-008
  text: 用久了、有點舊了，你卻更喜歡的東西是什麼？
  tags: [objects]
- id: qn-object-009
  text: 假如要為十年後的自己留下一件物品，你會留下什麼？
  tags: [objects]
- id: qn-object-010
  text: 什麼樣的東西，會讓你一看到就忍不住想收集？
  tags: [objects]
- id: qn-object-011
  text: 你的房間裡，最能代表你的是哪一件擺設？
  tags: [objects]
- id: qn-object-012
  text: 有沒有一件物品，承載著一段你很想保留的回憶？
  tags: [objects]
- id: qn-object-013
  text: 挑選日常用品時，你最先看重的是哪一點？
  tags: [objects]
- id: qn-object-014
  text: 曾經很想要、真正得到後感受又是如何的東西是什麼？
  tags: [objects]
- id: qn-object-015
  text: 如果要送自己一份小禮物犒賞，你會想要什麼？
  tags: [objects]
- id: qn-object-016
  text: 那些一直沒用到卻也留著的東西，對你意味著什麼？
  tags: [objects]
- id: qn-object-017
  text: 你手邊有沒有跟著你走過很多地方的隨身物？
  tags: [objects]
- id: qn-object-018
  text: 整理東西的時候，什麼樣的物品最容易讓你停下來回味？
  tags: [objects]
- id: qn-object-019
  text: 對你而言，一件東西具備什麼，才算得上「耐看」？
  tags: [objects]
- id: qn-object-020
  text: 如果要為某段時光挑一件紀念物，你腦中浮現的是什麼？
  tags: [objects]
