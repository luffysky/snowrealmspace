# 每日一問 · 交通與移動。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-transport-001
  text: 你最喜歡哪一種移動的方式？
  tags: [transport]
- id: qn-transport-002
  text: 搭捷運的時候，你通常會做些什麼來打發時間？
  tags: [transport]
- id: qn-transport-003
  text: 如果可以擁有一種交通工具當通勤夥伴，你會選什麼？
  tags: [transport]
- id: qn-transport-004
  text: 走路和騎車之間，哪一種比較讓你覺得放鬆？
  tags: [transport]
- id: qn-transport-005
  text: 長途火車上，你會靠窗還是靠走道？
  tags: [transport]
- id: qn-transport-006
  text: 有沒有一次搭車的經驗，到現在都還記得？
  tags: [transport]
- id: qn-transport-007
  text: 對你來說，開車和被載，感覺有什麼不一樣？
  tags: [transport]
- id: qn-transport-008
  text: 如果要去很遠的地方，你偏好飛機、火車還是自己開車？
  tags: [transport]
- id: qn-transport-009
  text: 騎腳踏車滑過街道的那種感覺，你會怎麼形容？
  tags: [transport]
- id: qn-transport-010
  text: 深夜搭車回家的路上，你腦子裡通常在想些什麼？
  tags: [transport]
- id: qn-transport-011
  text: 你比較享受一個人移動，還是有人同行的旅程？
  tags: [transport]
- id: qn-transport-012
  text: 塞在車陣裡動彈不得時，你會用什麼心情看待？
  tags: [transport]
- id: qn-transport-013
  text: 如果通勤時間可以完全屬於自己，你想拿來做什麼？
  tags: [transport]
- id: qn-transport-014
  text: 搭船在水面上前進，會帶給你怎樣的感受？
  tags: [transport]
- id: qn-transport-015
  text: 你有沒有特別偏愛的一段路線或一班車？
  tags: [transport]
- id: qn-transport-016
  text: 走路速度快慢，會影響你看待周遭的方式嗎？
  tags: [transport]
- id: qn-transport-017
  text: 小時候常搭的那種交通工具，現在想起來是什麼樣子？
  tags: [transport]
- id: qn-transport-018
  text: 在移動的過程中，哪個瞬間最容易讓你放空？
  tags: [transport]
- id: qn-transport-019
  text: 如果不必考慮時間和金錢，你想用什麼方式環遊一圈？
  tags: [transport]
- id: qn-transport-020
  text: 抵達目的地前的最後一段路，對你有什麼意義？
  tags: [transport]
