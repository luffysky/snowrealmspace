# 每日一問 · 願望清單。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-bucket-001
  text: 有沒有一個地方，你一直想親眼去看看？
  tags: [bucket]
- id: qn-bucket-002
  text: 如果時間和金錢都不是問題，你明天最想去做什麼？
  tags: [bucket]
- id: qn-bucket-003
  text: 哪一項技能，是你偷偷想學會很久了的？
  tags: [bucket]
- id: qn-bucket-004
  text: 你想體驗一次、但至今還沒機會的事情是什麼？
  tags: [bucket]
- id: qn-bucket-005
  text: 說到夢想，有哪個念頭是你不太敢跟別人講的？
  tags: [bucket]
- id: qn-bucket-006
  text: 假如可以和任何人吃一頓飯，你會選誰？
  tags: [bucket]
- id: qn-bucket-007
  text: 有什麼場景，你希望這輩子能親身站在裡面？
  tags: [bucket]
- id: qn-bucket-008
  text: 你曾經寫下、卻一直沒去實現的計畫是哪一個？
  tags: [bucket]
- id: qn-bucket-009
  text: 如果要為自己安排一趟旅行，你最想帶回什麼？
  tags: [bucket]
- id: qn-bucket-010
  text: 哪一種生活方式，你很想嘗試看看是什麼感覺？
  tags: [bucket]
- id: qn-bucket-011
  text: 你心裡有沒有一件想親手完成的作品？
  tags: [bucket]
- id: qn-bucket-012
  text: 什麼樣的挑戰，會讓你興奮到願意豁出去試一次？
  tags: [bucket]
- id: qn-bucket-013
  text: 假如能重新選一門專業從頭學起，你想學什麼？
  tags: [bucket]
- id: qn-bucket-014
  text: 有哪件小事，你總說「以後有空再做」的？
  tags: [bucket]
- id: qn-bucket-015
  text: 你想和誰一起，去完成一件難忘的事？
  tags: [bucket]
- id: qn-bucket-016
  text: 如果可以送給自己一份禮物，你會挑什麼經歷？
  tags: [bucket]
- id: qn-bucket-017
  text: 哪個國家或城市的日常，讓你好奇到想住住看？
  tags: [bucket]
- id: qn-bucket-018
  text: 你想在某一天，親口對某個人說出什麼話？
  tags: [bucket]
- id: qn-bucket-019
  text: 有什麼願望，是你希望在身體還硬朗時就去做的？
  tags: [bucket]
- id: qn-bucket-020
  text: 若要辦一場只屬於自己的慶祝，你會怎麼過？
  tags: [bucket]
