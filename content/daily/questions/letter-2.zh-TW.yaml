# 每日一問 · 手寫信與卡片（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-letter-021
  text: 挑筆寫信的時候，你偏好用哪一種筆的手感？
  tags: [letter]
- id: qn-letter-022
  text: 如果一封信可以夾一樣小東西寄出去，你會放什麼進去？
  tags: [letter]
- id: qn-letter-023
  text: 讀別人寫給你的字，你會不會忍不住猜他當下的心情？
  tags: [letter]
- id: qn-letter-024
  text: 對你來說，一封信要多長才算把話說清楚？
  tags: [letter]
- id: qn-letter-025
  text: 有沒有一種顏色的墨水，會讓你想到某個特定的人？
  tags: [letter]
- id: qn-letter-026
  text: 收到遠方寄來的信，郵戳上的地名會勾起你什麼想像？
  tags: [letter]
- id: qn-letter-027
  text: 你比較喜歡把心事寫成一封信，還是當面講出來？
  tags: [letter]
- id: qn-letter-028
  text: 假如要在賀卡裡藏一個只有對方看得懂的暗號，你會寫什麼？
  tags: [letter]
- id: qn-letter-029
  text: 翻到自己多年前寫的字，你會用什麼眼光看那時的自己？
  tags: [letter]
- id: qn-letter-030
  text: 一張卡片上，你在意的是紙的觸感，還是打開時的樣子？
  tags: [letter]
- id: qn-letter-031
  text: 若要替一位久未聯絡的人寫封信，你的第一句話會是什麼？
  tags: [letter]
- id: qn-letter-032
  text: 你曾經把一封信讀了很多遍嗎，那是誰寫的？
  tags: [letter]
- id: qn-letter-033
  text: 寫給長輩和寫給朋友時，你的用字習慣會有什麼不同？
  tags: [letter]
- id: qn-letter-034
  text: 如果信末可以附上一句給未來讀信人的話，你想留哪一句？
  tags: [letter]
- id: qn-letter-035
  text: 在卡片上署名時，你會寫全名、暱稱，還是只畫個記號？
  tags: [letter]
- id: qn-letter-036
  text: 有沒有一封信，你光是聞到紙的味道就想起某段日子？
  tags: [letter]
- id: qn-letter-037
  text: 要謝謝一個人的時候，你覺得寫下來和說出來哪個更貼近心意？
  tags: [letter]
- id: qn-letter-038
  text: 假如手邊只有一張便條紙，你會用它留言給誰？
  tags: [letter]
- id: qn-letter-039
  text: 收藏一疊舊信，對你而言像是收藏了什麼？
  tags: [letter]
- id: qn-letter-040
  text: 你心中一封難忘的信，它讓你難忘的是文字還是筆跡？
  tags: [letter]
