# 每日一問 · 成長（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-grow-021
  text: 有哪個觀念，是你長大之後才慢慢懂的？
  tags: [growth]
- id: qn-grow-022
  text: 誰曾經說過的一句話，一直陪著你到現在？
  tags: [growth]
- id: qn-grow-023
  text: 你最近讀到或聽到什麼，讓你想了很久？
  tags: [growth]
- id: qn-grow-024
  text: 有哪件小事，重複久了竟然變成你的底氣？
  tags: [growth]
- id: qn-grow-025
  text: 你怎麼看待自己曾經走過的那些冤枉路？
  tags: [growth]
- id: qn-grow-026
  text: 面對不確定的時候，你靠什麼撐住自己？
  tags: [growth]
- id: qn-grow-027
  text: 有哪種能力，是你希望五年後具備的？
  tags: [growth]
- id: qn-grow-028
  text: 誰的活法，讓你偷偷想學一點過來？
  tags: [growth]
- id: qn-grow-029
  text: 你最近願意承認自己「還不會」的是哪件事？
  tags: [growth]
- id: qn-grow-030
  text: 有什麼標準，你正在把它從別人的換成自己的？
  tags: [growth]
- id: qn-grow-031
  text: 回頭看，哪個當時的難關其實鍛鍊了你？
  tags: [growth]
- id: qn-grow-032
  text: 你怎麼判斷一件事值不值得再堅持下去？
  tags: [growth]
- id: qn-grow-033
  text: 有哪個小小的進步，只有你自己知道？
  tags: [growth]
- id: qn-grow-034
  text: 如果請人給你一句真話，你想聽哪方面的？
  tags: [growth]
- id: qn-grow-035
  text: 你最近對哪件原本抗拒的事，改觀了？
  tags: [growth]
- id: qn-grow-036
  text: 什麼樣的失敗，你已經能笑著說出口了？
  tags: [growth]
- id: qn-grow-037
  text: 你想培養哪個角度，去看待身邊的人事物？
  tags: [growth]
- id: qn-grow-038
  text: 有沒有一個問題，你到現在還在慢慢想答案？
  tags: [growth]
- id: qn-grow-039
  text: 你希望十年後回望今天，會慶幸自己做了什麼？
  tags: [growth]
- id: qn-grow-040
  text: 此刻的你，正在往哪一個更喜歡的自己靠近？
  tags: [growth]
