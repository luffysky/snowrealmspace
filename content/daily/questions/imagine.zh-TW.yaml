# 每日一問 · 想像力。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-imagine-001
  text: 如果可以擁有一種超能力，你會想要哪一種？
  tags: [imagine]
- id: qn-imagine-002
  text: 你小時候幻想過長大會過著怎樣的生活？
  tags: [imagine]
- id: qn-imagine-003
  text: 如果明天醒來世界少了一樣東西，你希望是什麼？
  tags: [imagine]
- id: qn-imagine-004
  text: 有沒有一個只存在你腦中的地方，你常常去那裡？
  tags: [imagine]
- id: qn-imagine-005
  text: 如果動物突然會說話，你最想聽誰先開口？
  tags: [imagine]
- id: qn-imagine-006
  text: 你曾經幻想過自己住進哪一個故事裡？
  tags: [imagine]
- id: qn-imagine-007
  text: 如果能變成任何一種生物一天，你想當什麼？
  tags: [imagine]
- id: qn-imagine-008
  text: 天空如果不是藍色的，你希望它會是什麼顏色？
  tags: [imagine]
- id: qn-imagine-009
  text: 如果時間能暫停，你想停在哪一刻好好待著？
  tags: [imagine]
- id: qn-imagine-010
  text: 你腦中有沒有一個從沒對別人提過的奇想？
  tags: [imagine]
- id: qn-imagine-011
  text: 如果能和任何一個虛構角色喝杯茶，你想找誰？
  tags: [imagine]
- id: qn-imagine-012
  text: 假如夢境可以錄下來，你最想重看哪一場？
  tags: [imagine]
- id: qn-imagine-013
  text: 如果房間裡某樣東西突然有了生命，你希望是哪個？
  tags: [imagine]
- id: qn-imagine-014
  text: 你會把未來的城市，想像成什麼樣子？
  tags: [imagine]
- id: qn-imagine-015
  text: 如果能把一種感覺變成看得見的東西，你想變哪一種？
  tags: [imagine]
- id: qn-imagine-016
  text: 假如可以親手設計一顆星球，上面會有些什麼？
  tags: [imagine]
- id: qn-imagine-017
  text: 如果雲朵能被摘下來，你想拿它來做什麼？
  tags: [imagine]
- id: qn-imagine-018
  text: 你曾經對著一片風景，在心裡編出過怎樣的故事？
  tags: [imagine]
- id: qn-imagine-019
  text: 如果能發明一樣讓世界更好玩的東西，那會是什麼？
  tags: [imagine]
- id: qn-imagine-020
  text: 假如可以走進一幅畫裡，你想走進哪一幅？
  tags: [imagine]
