# 每日一問 · 節日與紀念日。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-festival-001
  text: 哪一個節日，最能讓你想起小時候的自己？
  tags: [festival]
- id: qn-festival-002
  text: 你有沒有一個只屬於自己的紀念日？
  tags: [festival]
- id: qn-festival-003
  text: 過節的時候，你最期待的是哪個環節？
  tags: [festival]
- id: qn-festival-004
  text: 有沒有一個日子，每年到了都會讓你特別想念某個人？
  tags: [festival]
- id: qn-festival-005
  text: 你偏好熱鬧地過節，還是安安靜靜地度過？
  tags: [festival]
- id: qn-festival-006
  text: 哪一次過節的畫面，到現在還清楚留在你心裡？
  tags: [festival]
- id: qn-festival-007
  text: 如果可以發明一個新節日，你會想慶祝什麼？
  tags: [festival]
- id: qn-festival-008
  text: 你家過節時，有什麼別人家沒有的小習慣？
  tags: [festival]
- id: qn-festival-009
  text: 你收過最難忘的一份節日禮物是什麼？
  tags: [festival]
- id: qn-festival-010
  text: 你會怎麼為重要的人張羅一個紀念日？
  tags: [festival]
- id: qn-festival-011
  text: 有沒有哪個節日，你不特別喜歡卻還是年年會過？
  tags: [festival]
- id: qn-festival-012
  text: 對你來說，一個值得被記住的日子需要有什麼？
  tags: [festival]
- id: qn-festival-013
  text: 你曾在哪個節日裡，感受到滿滿的暖意？
  tags: [festival]
- id: qn-festival-014
  text: 如果今天就是你最愛的節日，你會想怎麼度過？
  tags: [festival]
- id: qn-festival-015
  text: 哪一個紀念日的意義，是隨著時間你才慢慢讀懂的？
  tags: [festival]
- id: qn-festival-016
  text: 過節的餐桌上，你最想看到哪一道菜？
  tags: [festival]
- id: qn-festival-017
  text: 和誰一起過的節，總是讓你覺得特別開心？
  tags: [festival]
- id: qn-festival-018
  text: 有沒有一首歌，一響起就讓你想到某個節日？
  tags: [festival]
- id: qn-festival-019
  text: 你習慣用什麼方式，把重要的日子記下來？
  tags: [festival]
- id: qn-festival-020
  text: 如果要為今年挑一個「屬於你們的日子」，你會選哪一天？
  tags: [festival]
