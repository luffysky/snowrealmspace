# 每日一問 · 溫度與冷熱。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-temp-001
  text: 今天的空氣摸起來是暖的還是涼的？
  tags: [temperature]
- id: qn-temp-002
  text: 你比較怕冷，還是比較怕熱？
  tags: [temperature]
- id: qn-temp-003
  text: 什麼樣的溫度，會讓你覺得最自在？
  tags: [temperature]
- id: qn-temp-004
  text: 冬天裡，哪一種暖意讓你最想靠近？
  tags: [temperature]
- id: qn-temp-005
  text: 手腳冰冷的時候，你會怎麼讓自己回暖？
  tags: [temperature]
- id: qn-temp-006
  text: 一杯剛好溫熱的飲料，會讓你想起什麼？
  tags: [temperature]
- id: qn-temp-007
  text: 夏天最熱的午後，你最想待在哪裡？
  tags: [temperature]
- id: qn-temp-008
  text: 對你來說，「涼爽」是什麼樣的感覺？
  tags: [temperature]
- id: qn-temp-009
  text: 有沒有一種氣味，讓你聯想到寒冷？
  tags: [temperature]
- id: qn-temp-010
  text: 睡覺時你喜歡棉被厚一點還是薄一點？
  tags: [temperature]
- id: qn-temp-011
  text: 走進冷氣房的那一刻，你的身體有什麼反應？
  tags: [temperature]
- id: qn-temp-012
  text: 你記得最冷的一天是在哪裡度過的嗎？
  tags: [temperature]
- id: qn-temp-013
  text: 泡在溫水裡的時候，你在想些什麼？
  tags: [temperature]
- id: qn-temp-014
  text: 陽光曬在身上的溫度，對你是舒服還是刺人？
  tags: [temperature]
- id: qn-temp-015
  text: 天氣一轉涼，你最先想做的是什麼？
  tags: [temperature]
- id: qn-temp-016
  text: 有沒有一個人的手，總是特別溫暖？
  tags: [temperature]
- id: qn-temp-017
  text: 冰塊在嘴裡融化的感覺，你喜歡嗎？
  tags: [temperature]
- id: qn-temp-018
  text: 如果可以永遠停在某個季節的溫度，你會選哪一個？
  tags: [temperature]
- id: qn-temp-019
  text: 寒流來的夜晚，什麼東西能給你安全感？
  tags: [temperature]
- id: qn-temp-020
  text: 你覺得「溫暖」比較像一種溫度，還是一種感受？
  tags: [temperature]
