# 每日一問 · 勇氣（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-courage-021
  text: 在一群人裡表達和多數人不同的想法，對你來說難在哪裡？
  tags: [courage]
- id: qn-courage-022
  text: 上一次你主動向別人開口求助，是什麼情況？
  tags: [courage]
- id: qn-courage-023
  text: 如果要對某件事說「不」，你會最先想到哪一件？
  tags: [courage]
- id: qn-courage-024
  text: 你欣賞誰身上的勇氣，那份勇氣是什麼模樣？
  tags: [courage]
- id: qn-courage-025
  text: 承認自己做錯，對你而言是容易還是困難？
  tags: [courage]
- id: qn-courage-026
  text: 有哪一種場合，會讓你光是站出來就需要鼓起勇氣？
  tags: [courage]
- id: qn-courage-027
  text: 讓別人看見真實的你，你願意到什麼程度？
  tags: [courage]
- id: qn-courage-028
  text: 面對害怕的事情時，你的身體通常會有什麼反應？
  tags: [courage]
- id: qn-courage-029
  text: 如果要離開一件你其實不想繼續的事，你會怎麼開口？
  tags: [courage]
- id: qn-courage-030
  text: 勇敢和魯莽之間，你會用什麼來分辨？
  tags: [courage]
- id: qn-courage-031
  text: 你曾經為了誰，做出比平常更大膽的舉動？
  tags: [courage]
- id: qn-courage-032
  text: 把不完美的作品拿給別人看，你會有哪些顧慮？
  tags: [courage]
- id: qn-courage-033
  text: 第一次獨自完成某件事的經驗，帶給你什麼感受？
  tags: [courage]
- id: qn-courage-034
  text: 當你改變了原本堅持的立場，是什麼讓你轉念的？
  tags: [courage]
- id: qn-courage-035
  text: 誠實說出自己的感受，哪一種感受最難出口？
  tags: [courage]
- id: qn-courage-036
  text: 童年時，是誰讓你第一次明白什麼叫勇敢？
  tags: [courage]
- id: qn-courage-037
  text: 如果不再在意別人的眼光，你想做的第一件事是什麼？
  tags: [courage]
- id: qn-courage-038
  text: 為別人挺身而出的時刻，你記得哪一次？
  tags: [courage]
- id: qn-courage-039
  text: 那些沒有鼓起勇氣去做的事，後來在你心裡留下什麼？
  tags: [courage]
- id: qn-courage-040
  text: 對你來說，安靜地堅持和大聲地爭取，哪一種更需要勇氣？
  tags: [courage]
