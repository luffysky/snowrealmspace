# 每日一問 · 流行與潮流。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-trend-001
  text: 最近有哪個流行的東西，是你怎麼都無法理解為什麼會紅的？
  tags: [trend]
- id: qn-trend-002
  text: 你曾經跟過哪一波風潮，現在回想起來覺得有點好笑？
  tags: [trend]
- id: qn-trend-003
  text: 有沒有一個迷因或流行語，你到現在還常掛在嘴邊？
  tags: [trend]
- id: qn-trend-004
  text: 面對正在爆紅的東西，你是先觀望，還是想馬上試試看？
  tags: [trend]
- id: qn-trend-005
  text: 你有沒有偷偷喜歡某個「已經退流行」的事物？
  tags: [trend]
- id: qn-trend-006
  text: 學生時代最流行的東西，現在的你怎麼看？
  tags: [trend]
- id: qn-trend-007
  text: 你都從哪裡得知現在大家在瘋什麼？
  tags: [trend]
- id: qn-trend-008
  text: 有哪一種流行，你堅持完全不碰，理由是什麼？
  tags: [trend]
- id: qn-trend-009
  text: 對你來說，「退流行」的東西是變舊了，還是變得更有味道？
  tags: [trend]
- id: qn-trend-010
  text: 你比較在意跟得上潮流，還是找到只屬於自己的東西？
  tags: [trend]
- id: qn-trend-011
  text: 有沒有一首曾經到處都在播的歌，一聽就把你拉回某段時光？
  tags: [trend]
- id: qn-trend-012
  text: 你覺得一個東西要具備什麼，才會突然變得人人都在談？
  tags: [trend]
- id: qn-trend-013
  text: 網路上的迷因，你比較常當觀眾，還是會轉給朋友？
  tags: [trend]
- id: qn-trend-014
  text: 曾經有哪個流行，是你身邊的人先愛上、後來才影響到你的？
  tags: [trend]
- id: qn-trend-015
  text: 你穿搭的時候，流行趨勢佔的比重大概有多少？
  tags: [trend]
- id: qn-trend-016
  text: 有沒有一種老東西，你反而覺得比現在流行的更耐看？
  tags: [trend]
- id: qn-trend-017
  text: 你怎麼分辨一個潮流是真的喜歡，還是只是被氣氛帶著走？
  tags: [trend]
- id: qn-trend-018
  text: 如果要跟十年後的人介紹此刻最紅的事物，你會挑哪一個？
  tags: [trend]
- id: qn-trend-019
  text: 你身邊誰最能帶動風向，讓大家跟著他喜歡上某樣東西？
  tags: [trend]
- id: qn-trend-020
  text: 有沒有什麼是你希望它趕快流行、或希望它永遠別退燒的？
  tags: [trend]
