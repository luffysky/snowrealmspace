# 每日一問 · 恐懼與害怕。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fear-001
  text: 小時候讓你害怕的東西，現在回想起來還會有同樣的感覺嗎？
  tags: [fear]
- id: qn-fear-002
  text: 有沒有一種害怕，是你到現在都還沒對別人說過的？
  tags: [fear]
- id: qn-fear-003
  text: 當你感到不安時，身體通常會先出現什麼樣的反應？
  tags: [fear]
- id: qn-fear-004
  text: 在夜深人靜的時候，最容易浮上心頭的擔憂是什麼？
  tags: [fear]
- id: qn-fear-005
  text: 如果害怕會說話，你覺得它最常對你重複哪一句話？
  tags: [fear]
- id: qn-fear-006
  text: 有沒有一個場合，光是想到就會讓你有點想退縮？
  tags: [fear]
- id: qn-fear-007
  text: 你比較怕失去某個人，還是比較怕失去某種感覺？
  tags: [fear]
- id: qn-fear-008
  text: 面對害怕的時候，你通常是選擇靠近它還是先離開一下？
  tags: [fear]
- id: qn-fear-009
  text: 有哪一種害怕，其實在陪你長大後也慢慢變柔軟了？
  tags: [fear]
- id: qn-fear-010
  text: 當你陪在害怕的人身邊時，你會用什麼方式讓對方安心？
  tags: [fear]
- id: qn-fear-011
  text: 對於未知的明天，你心裡浮現的是好奇多一點還是不安多一點？
  tags: [fear]
- id: qn-fear-012
  text: 有沒有一種聲音或畫面，能讓你在慌張時稍微放鬆下來？
  tags: [fear]
- id: qn-fear-013
  text: 你覺得害怕這種感覺，曾經替你擋下過什麼嗎？
  tags: [fear]
- id: qn-fear-014
  text: 如果可以溫柔地問問心裡的恐懼，你最想聽它說什麼？
  tags: [fear]
- id: qn-fear-015
  text: 在什麼樣的人身邊，你的害怕會自然而然變小一點？
  tags: [fear]
- id: qn-fear-016
  text: 童年的哪個瞬間，第一次讓你認識到「害怕」是什麼？
  tags: [fear]
- id: qn-fear-017
  text: 你害怕的事情裡，有沒有其實藏著你很在乎的東西？
  tags: [fear]
- id: qn-fear-018
  text: 如果害怕是一位訪客，你會想怎麼跟它相處一個下午？
  tags: [fear]
- id: qn-fear-019
  text: 那些你曾經很怕、後來卻走過來的事，現在感覺如何？
  tags: [fear]
- id: qn-fear-020
  text: 當恐懼來敲門，你希望身邊的人怎麼對待這時候的你？
  tags: [fear]
