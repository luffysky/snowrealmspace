# 每日一問 · 期待與盼望（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-anticipate-021
  text: 這個週末若能為自己留一段時光，你會想拿它來做什麼？
  tags: [anticipate]
- id: qn-anticipate-022
  text: 有沒有一封信或一則消息，是你正悄悄等著它到來的？
  tags: [anticipate]
- id: qn-anticipate-023
  text: 若要為明年的自己準備一份禮物，你會想送她什麼？
  tags: [anticipate]
- id: qn-anticipate-024
  text: 在你的日常裡，哪個時刻是你一整天最盼望抵達的？
  tags: [anticipate]
- id: qn-anticipate-025
  text: 有什麼手藝或本事，是你一直想找時間好好學的？
  tags: [anticipate]
- id: qn-anticipate-026
  text: 想像一個理想的清晨醒來，窗外和房裡會是什麼樣子？
  tags: [anticipate]
- id: qn-anticipate-027
  text: 有沒有一句話，是你期待著有一天能親口對某個人說的？
  tags: [anticipate]
- id: qn-anticipate-028
  text: 若能和很久沒見的人重逢，你最想和誰坐下來聊聊？
  tags: [anticipate]
- id: qn-anticipate-029
  text: 未來的家裡，你最想擁有的一個角落會是什麼模樣？
  tags: [anticipate]
- id: qn-anticipate-030
  text: 有什麼盼望，是你願意慢慢等、也不急著實現的？
  tags: [anticipate]
- id: qn-anticipate-031
  text: 想到即將到來的某個節日，你心裡最先浮現的畫面是什麼？
  tags: [anticipate]
- id: qn-anticipate-032
  text: 若能替一段友誼許下祝福，你會為它盼望什麼樣的未來？
  tags: [anticipate]
- id: qn-anticipate-033
  text: 有沒有一種味道或聲音，一出現就讓你覺得好日子要來了？
  tags: [anticipate]
- id: qn-anticipate-034
  text: 你正在培養的哪個習慣，是你期待它慢慢開花結果的？
  tags: [anticipate]
- id: qn-anticipate-035
  text: 如果可以為接下來的旅程取個名字，你會怎麼稱呼它？
  tags: [anticipate]
- id: qn-anticipate-036
  text: 有什麼小小的改變，是你盼望它能悄悄發生在生活裡的？
  tags: [anticipate]
- id: qn-anticipate-037
  text: 想到某個還沒發生的相聚，你會忍不住先準備些什麼？
  tags: [anticipate]
- id: qn-anticipate-038
  text: 若把心裡的盼望排成一列，走在最前面的那個是什麼？
  tags: [anticipate]
- id: qn-anticipate-039
  text: 有沒有一個夢想，你希望未來能和某個人一起完成？
  tags: [anticipate]
- id: qn-anticipate-040
  text: 對你來說，怎樣的一年結束時，會讓你覺得沒有辜負這份期待？
  tags: [anticipate]
