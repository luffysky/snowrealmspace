# 每日一問 · 動物與寵物（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-animal-021
  text: 你覺得動物身上的哪一種本領，最讓人類羨慕？
  tags: [animals]
- id: qn-animal-022
  text: 如果要替一群動物拍紀錄片，你最想跟拍哪一種的一天？
  tags: [animals]
- id: qn-animal-023
  text: 有沒有哪一種動物，你以前害怕、後來卻改觀了？
  tags: [animals]
- id: qn-animal-024
  text: 你會怎麼形容一隻動物「信任你」的那個瞬間？
  tags: [animals]
- id: qn-animal-025
  text: 假如家裡能養一種平常養不了的動物，你想試試哪一種？
  tags: [animals]
- id: qn-animal-026
  text: 動物園或水族館裡，哪一區是你會待最久的地方？
  tags: [animals]
- id: qn-animal-027
  text: 你覺得夜行性動物的世界，會是什麼樣的風景？
  tags: [animals]
- id: qn-animal-028
  text: 候鳥每年遷徙那麼遠，這件事讓你聯想到什麼？
  tags: [animals]
- id: qn-animal-029
  text: 如果替一種動物設計專屬的家，你會加進哪些巧思？
  tags: [animals]
- id: qn-animal-030
  text: 昆蟲那麼小卻活得認真，你怎麼看牠們的生活？
  tags: [animals]
- id: qn-animal-031
  text: 你觀察過動物之間相處的哪個畫面，久久難忘？
  tags: [animals]
- id: qn-animal-032
  text: 假如能陪一種瀕危動物走一段路，你想陪哪一種？
  tags: [animals]
- id: qn-animal-033
  text: 動物換季換毛、冬眠或遷徙，哪一種轉變最吸引你？
  tags: [animals]
- id: qn-animal-034
  text: 你覺得哪一種動物的叫聲，最能代表牠的性格？
  tags: [animals]
- id: qn-animal-035
  text: 如果動物界要選一位老師，你會想跟哪一種學什麼？
  tags: [animals]
- id: qn-animal-036
  text: 你曾經因為一隻動物，而改變了原本的行程嗎？
  tags: [animals]
- id: qn-animal-037
  text: 想像自己是一隻在都市裡生活的動物，你會住在哪個角落？
  tags: [animals]
- id: qn-animal-038
  text: 動物合作覓食或彼此照應的模樣，帶給你什麼想法？
  tags: [animals]
- id: qn-animal-039
  text: 你比較好奇天上飛的、地上跑的，還是水裡游的生物？
  tags: [animals]
- id: qn-animal-040
  text: 如果能替某種動物寫一句介紹，你會怎麼描述牠？
  tags: [animals]
