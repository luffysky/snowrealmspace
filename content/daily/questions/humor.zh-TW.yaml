# 每日一問 · 幽默與笑點。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-humor-001
  text: 最近哪件事，讓你笑到停不下來？
  tags: [humor]
- id: qn-humor-002
  text: 有哪個朋友的口頭禪，一想到就會讓你偷笑？
  tags: [humor]
- id: qn-humor-003
  text: 你自己講過最得意的一句冷笑話是什麼？
  tags: [humor]
- id: qn-humor-004
  text: 童年時有什麼糗事，現在回想起來反而覺得很好笑？
  tags: [humor]
- id: qn-humor-005
  text: 哪一部影片或迷因，你可以重看很多遍還是笑得出來？
  tags: [humor]
- id: qn-humor-006
  text: 如果要用一個表情符號代表你的笑點，你會選哪一個？
  tags: [humor]
- id: qn-humor-007
  text: 你身邊誰最容易被你逗笑，通常是靠什麼招數？
  tags: [humor]
- id: qn-humor-008
  text: 有沒有一種笑點是別人不懂、只有你覺得超好笑的？
  tags: [humor]
- id: qn-humor-009
  text: 在很嚴肅的場合忍不住想笑，你都怎麼撐過去？
  tags: [humor]
- id: qn-humor-010
  text: 你最喜歡哪種類型的搞笑，是諧音、反差還是無厘頭？
  tags: [humor]
- id: qn-humor-011
  text: 假如今天要用一個笑話開場，你手邊有現成的嗎？
  tags: [humor]
- id: qn-humor-012
  text: 曾經有哪句玩笑話，事後變成你和某人之間的暗號？
  tags: [humor]
- id: qn-humor-013
  text: 你覺得什麼樣的人，跟他相處起來最有喜感？
  tags: [humor]
- id: qn-humor-014
  text: 動物做過哪個動作，讓你當場笑翻？
  tags: [humor]
- id: qn-humor-015
  text: 你有沒有一秒讓氣氛從尷尬變好笑的獨門方法？
  tags: [humor]
- id: qn-humor-016
  text: 哪個綜藝節目或喜劇演員，是你的快樂來源？
  tags: [humor]
- id: qn-humor-017
  text: 生活裡有什麼小小的荒謬，總讓你哭笑不得？
  tags: [humor]
- id: qn-humor-018
  text: 你笑起來的時候，別人最常怎麼形容你的表情？
  tags: [humor]
- id: qn-humor-019
  text: 有哪個誤會或口誤，後來變成大家一直拿來笑的梗？
  tags: [humor]
- id: qn-humor-020
  text: 如果心情很低落，哪一種好笑的東西最能把你拉回來？
  tags: [humor]
