# 每日一問 · 閱讀與故事。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-read-001
  text: 最近讀到哪一句話，你想抄下來留著？
  tags: [reading]
- id: qn-read-002
  text: 有沒有一本書，讓你讀完後看世界的角度不太一樣了？
  tags: [reading]
- id: qn-read-003
  text: 你習慣在什麼時間、什麼地方讀東西？
  tags: [reading]
- id: qn-read-004
  text: 哪個故事裡的角色，讓你想起某個認識的人？
  tags: [reading]
- id: qn-read-005
  text: 你會把書讀到一半就放下嗎，通常是為什麼？
  tags: [reading]
- id: qn-read-006
  text: 小時候讀過的哪個故事，到現在你都還記得？
  tags: [reading]
- id: qn-read-007
  text: 挑一本書來讀時，你最先注意的是什麼？
  tags: [reading]
- id: qn-read-008
  text: 有沒有一本書，你想重讀卻一直沒動手？
  tags: [reading]
- id: qn-read-009
  text: 你比較喜歡結局明確，還是留白的故事？
  tags: [reading]
- id: qn-read-010
  text: 哪一類主題的書，你幾乎不會主動翻開？
  tags: [reading]
- id: qn-read-011
  text: 你讀書時會做記號或筆記嗎，怎麼做的？
  tags: [reading]
- id: qn-read-012
  text: 若要送一本書給朋友，你腦中先浮現哪一本？
  tags: [reading]
- id: qn-read-013
  text: 你曾經因為讀了一本書，而去做了什麼事？
  tags: [reading]
- id: qn-read-014
  text: 紙本書和電子書，你各在什麼時候會拿起來？
  tags: [reading]
- id: qn-read-015
  text: 哪個故事的開頭，讓你一讀就停不下來？
  tags: [reading]
- id: qn-read-016
  text: 面對那些「讀不懂」的書，你會怎麼看待？
  tags: [reading]
- id: qn-read-017
  text: 有沒有一個虛構角色，你很想找他聊聊？
  tags: [reading]
- id: qn-read-018
  text: 你上一本讀完的書，是怎麼被你找到的？
  tags: [reading]
- id: qn-read-019
  text: 讀到跟自己想法相反的內容時，你會怎麼讀下去？
  tags: [reading]
- id: qn-read-020
  text: 哪一種故事結局，會讓你闔上書後還想很久？
  tags: [reading]
