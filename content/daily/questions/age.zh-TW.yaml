# 每日一問 · 年紀與時光。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-age-001
  text: 現在這個年紀，和你小時候想像的一樣嗎？
  tags: [age]
- id: qn-age-002
  text: 有沒有哪個瞬間，讓你突然感覺到自己長大了？
  tags: [age]
- id: qn-age-003
  text: 回頭看十年前的自己，你最想跟他說什麼？
  tags: [age]
- id: qn-age-004
  text: 隨著年紀漸長，你發現自己變得更在意什麼了？
  tags: [age]
- id: qn-age-005
  text: 哪一段時光，你偶爾還會想回去待一會兒？
  tags: [age]
- id: qn-age-006
  text: 對你來說，變老這件事最有意思的地方是什麼？
  tags: [age]
- id: qn-age-007
  text: 什麼東西是你年輕時看不上、現在卻很珍惜的？
  tags: [age]
- id: qn-age-008
  text: 如果能和未來的自己聊天，你最想問他什麼？
  tags: [age]
- id: qn-age-009
  text: 這些年下來，哪一種焦慮悄悄離開了你？
  tags: [age]
- id: qn-age-010
  text: 你覺得時間對你最溫柔的地方，表現在哪裡？
  tags: [age]
- id: qn-age-011
  text: 童年裡的哪個氣味或聲音，至今一想起就很清晰？
  tags: [age]
- id: qn-age-012
  text: 到了現在，你對「來得及」這三個字怎麼理解？
  tags: [age]
- id: qn-age-013
  text: 曾經以為很嚴重的事，如今回想是什麼感覺？
  tags: [age]
- id: qn-age-014
  text: 哪個階段的自己，你其實最想給他一個擁抱？
  tags: [age]
- id: qn-age-015
  text: 隨著日子過去，你和家人的相處有了什麼改變？
  tags: [age]
- id: qn-age-016
  text: 你怎麼看待身上那些歲月留下的痕跡？
  tags: [age]
- id: qn-age-017
  text: 有什麼是你二十歲不懂、如今才慢慢明白的？
  tags: [age]
- id: qn-age-018
  text: 如果人生像四季，你覺得自己現在走到哪一季？
  tags: [age]
- id: qn-age-019
  text: 這一年裡，哪一天你會想好好收進記憶裡？
  tags: [age]
- id: qn-age-020
  text: 談到「一輩子」，浮現在你腦海的第一個畫面是什麼？
  tags: [age]
