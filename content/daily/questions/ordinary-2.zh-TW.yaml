# 每日一問 · 平凡的一天（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-ordinary-021
  text: 早上出門前，有哪個小小的儀式讓你覺得一天可以開始了？
  tags: [ordinary]
- id: qn-ordinary-022
  text: 廚房裡的哪個氣味，最能讓你感覺「這就是家的日常」？
  tags: [ordinary]
- id: qn-ordinary-023
  text: 你最近一次因為一件微不足道的小事而莞爾，是為了什麼？
  tags: [ordinary]
- id: qn-ordinary-024
  text: 那些你每天都會摸到的東西裡，哪一樣的觸感讓你安心？
  tags: [ordinary]
- id: qn-ordinary-025
  text: 一個沒有安排的午後，你會任由自己怎麼度過？
  tags: [ordinary]
- id: qn-ordinary-026
  text: 天氣普通的日子裡，抬頭看天空時你通常在想什麼？
  tags: [ordinary]
- id: qn-ordinary-027
  text: 你和身邊人重複最多次的那句對話，通常是什麼？
  tags: [ordinary]
- id: qn-ordinary-028
  text: 如果要為今天挑一個顏色，你會選哪一種，為什麼？
  tags: [ordinary]
- id: qn-ordinary-029
  text: 平常買菜或採買時，有沒有哪個習慣連你自己都覺得可愛？
  tags: [ordinary]
- id: qn-ordinary-030
  text: 一天當中哪個時刻的安靜，最讓你覺得舒服？
  tags: [ordinary]
- id: qn-ordinary-031
  text: 你最常穿的那件衣服，陪你走過哪些再普通不過的日子？
  tags: [ordinary]
- id: qn-ordinary-032
  text: 如果把今天濃縮成一個氣味，你覺得會是什麼味道？
  tags: [ordinary]
- id: qn-ordinary-033
  text: 那些你幾乎不會注意到的背景聲音，此刻正有哪一種在響？
  tags: [ordinary]
- id: qn-ordinary-034
  text: 一頓再簡單不過的飯，怎麼吃會讓你覺得格外滿足？
  tags: [ordinary]
- id: qn-ordinary-035
  text: 你有沒有一個專屬於平凡日子的小確幸，別人可能看不懂？
  tags: [ordinary]
- id: qn-ordinary-036
  text: 洗完澡到入睡之間那段時間，你喜歡怎麼跟自己相處？
  tags: [ordinary]
- id: qn-ordinary-037
  text: 如果朋友問你昨天過得如何，你會挑哪個平淡片段來說？
  tags: [ordinary]
- id: qn-ordinary-038
  text: 你家窗外的風景，最近有沒有什麼細微的變化被你察覺？
  tags: [ordinary]
- id: qn-ordinary-039
  text: 手邊那杯每天都會喝的飲料，對你而言代表著什麼？
  tags: [ordinary]
- id: qn-ordinary-040
  text: 一個什麼都沒發生的夜晚，你會想用什麼把它輕輕收尾？
  tags: [ordinary]
