# 每日一問 · 收納與整理。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-tidy-001
  text: 你家裡最井然有序的一個角落是哪裡？
  tags: [tidy]
- id: qn-tidy-002
  text: 整理東西時，你習慣從哪個地方先動手？
  tags: [tidy]
- id: qn-tidy-003
  text: 有沒有一種收納方式，是你用了之後覺得生活變輕鬆的？
  tags: [tidy]
- id: qn-tidy-004
  text: 當一樣東西你很久沒用，你會怎麼決定它的去留？
  tags: [tidy]
- id: qn-tidy-005
  text: 對你而言，桌面乾淨和堆滿東西，哪種狀態讓你更安心？
  tags: [tidy]
- id: qn-tidy-006
  text: 你收納時，是靠標籤、靠顏色，還是靠記憶找東西？
  tags: [tidy]
- id: qn-tidy-007
  text: 家裡有沒有一個抽屜，是什麼都往裡塞的？
  tags: [tidy]
- id: qn-tidy-008
  text: 整理到一半突然翻到舊物時，你通常會發生什麼事？
  tags: [tidy]
- id: qn-tidy-009
  text: 你覺得「留著」和「放手」之間，界線在哪裡？
  tags: [tidy]
- id: qn-tidy-010
  text: 如果只能保留一個收納盒，你會拿它裝什麼？
  tags: [tidy]
- id: qn-tidy-011
  text: 換季收拾衣物時，哪個步驟讓你最有感覺？
  tags: [tidy]
- id: qn-tidy-012
  text: 空間被整理好的那一刻，你的心情通常是什麼樣的？
  tags: [tidy]
- id: qn-tidy-013
  text: 你會不會為某些物品保留位置，即使它沒什麼實際用途？
  tags: [tidy]
- id: qn-tidy-014
  text: 別人幫你整理過的東西，你找起來會更順還是更亂？
  tags: [tidy]
- id: qn-tidy-015
  text: 對你來說，什麼樣的物品最難決定要不要留下？
  tags: [tidy]
- id: qn-tidy-016
  text: 如果要用一個詞形容你理想中的居住空間，會是哪個詞？
  tags: [tidy]
- id: qn-tidy-017
  text: 你收藏的東西裡，哪一類最不捨得整理掉？
  tags: [tidy]
- id: qn-tidy-018
  text: 整理數位檔案和整理實體物品，對你而言哪個更棘手？
  tags: [tidy]
- id: qn-tidy-019
  text: 你有沒有一套只屬於自己的擺放邏輯，別人看不懂？
  tags: [tidy]
- id: qn-tidy-020
  text: 一個空間要具備什麼，才會讓你覺得「這裡是我的」？
  tags: [tidy]
