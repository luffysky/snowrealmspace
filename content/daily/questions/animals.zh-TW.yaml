# 每日一問 · 動物與寵物。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-animal-001
  text: 如果能變成一種動物，你想成為哪一種？
  tags: [animals]
- id: qn-animal-002
  text: 童年時，有沒有一隻讓你難忘的動物？
  tags: [animals]
- id: qn-animal-003
  text: 你覺得貓和狗，哪一種比較懂你？
  tags: [animals]
- id: qn-animal-004
  text: 看到路邊的小動物，你通常會怎麼做？
  tags: [animals]
- id: qn-animal-005
  text: 哪一種動物的樣子，最能讓你放鬆下來？
  tags: [animals]
