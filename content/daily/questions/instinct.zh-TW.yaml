# 每日一問 · 直覺與感覺。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-instinct-001
  text: 你會相信自己的第一直覺嗎？
  tags: [instinct]
- id: qn-instinct-002
  text: 有沒有一次，你明明說不出原因，卻覺得應該這麼做？
  tags: [instinct]
- id: qn-instinct-003
  text: 見到一個陌生人，你多快會對他有感覺？
  tags: [instinct]
- id: qn-instinct-004
  text: 當理智和直覺打架時，你最後聽了哪一邊？
  tags: [instinct]
- id: qn-instinct-005
  text: 什麼樣的地方，一走進去你就覺得不太對勁？
  tags: [instinct]
- id: qn-instinct-006
  text: 你曾經因為一種預感，而改變了原本的決定嗎？
  tags: [instinct]
- id: qn-instinct-007
  text: 身體有沒有比腦袋更早察覺到某件事的時候？
  tags: [instinct]
- id: qn-instinct-008
  text: 面對選擇，你偏好想清楚，還是憑感覺往前走？
  tags: [instinct]
- id: qn-instinct-009
  text: 哪一種情況下，你會特別信任自己的感覺？
  tags: [instinct]
- id: qn-instinct-010
  text: 有沒有一個人，你一見面就莫名覺得親近？
  tags: [instinct]
- id: qn-instinct-011
  text: 你怎麼分辨那是直覺，還是只是害怕？
  tags: [instinct]
- id: qn-instinct-012
  text: 回頭看，你的直覺後來被證明是對的嗎？
  tags: [instinct]
- id: qn-instinct-013
  text: 什麼樣的氣氛，會讓你想立刻離開？
  tags: [instinct]
- id: qn-instinct-014
  text: 你有沒有那種說不上來、卻很篤定的喜歡？
  tags: [instinct]
- id: qn-instinct-015
  text: 遇到需要當下反應的事，你通常怎麼決定？
  tags: [instinct]
- id: qn-instinct-016
  text: 哪一種感覺，一浮現你就知道自己該停下來？
  tags: [instinct]
- id: qn-instinct-017
  text: 你是那種容易憑感覺信任別人的人嗎？
  tags: [instinct]
- id: qn-instinct-018
  text: 有沒有一件事，你的心比腦袋更早給了答案？
  tags: [instinct]
- id: qn-instinct-019
  text: 當一切看起來很好，你卻隱隱不安，那是什麼感覺？
  tags: [instinct]
- id: qn-instinct-020
  text: 你多久會給自己一次「就照感覺走」的機會？
  tags: [instinct]
