# 每日一問 · 動手修理。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fix-001
  text: 最近有沒有什麼東西壞了，是你自己動手修好的？
  tags: [fix]
- id: qn-fix-002
  text: 家裡有沒有一件工具，是你用起來特別順手的？
  tags: [fix]
- id: qn-fix-003
  text: 東西壞掉時，你會先自己試著修，還是直接送修或換新？
  tags: [fix]
- id: qn-fix-004
  text: 修東西的過程裡，哪一次最讓你有成就感？
  tags: [fix]
- id: qn-fix-005
  text: 有沒有哪次修理，反而愈弄愈糟的經驗？
  tags: [fix]
- id: qn-fix-006
  text: 面對故障，你是靠說明書、影片，還是憑感覺動手？
  tags: [fix]
- id: qn-fix-007
  text: 家裡有沒有一樣東西，壞了很久卻一直想把它修好？
  tags: [fix]
- id: qn-fix-008
  text: 你第一次學會修某樣東西，是誰教你的？
  tags: [fix]
- id: qn-fix-009
  text: 遇到不熟悉的毛病，你通常從哪裡開始下手？
  tags: [fix]
- id: qn-fix-010
  text: 有沒有一件東西，你捨不得丟，寧願一修再修？
  tags: [fix]
- id: qn-fix-011
  text: 修理和乾脆買新的，你會怎麼權衡？
  tags: [fix]
- id: qn-fix-012
  text: 你會保留舊零件或剩下的材料備用嗎？
  tags: [fix]
- id: qn-fix-013
  text: 動手拆開一樣東西之前，你心裡在想什麼？
  tags: [fix]
- id: qn-fix-014
  text: 有沒有哪次修理，讓你重新認識了那樣東西的構造？
  tags: [fix]
- id: qn-fix-015
  text: 怎麼修都修不好的時候，你會如何面對那份挫折？
  tags: [fix]
- id: qn-fix-016
  text: 家裡最常負責修東西的人是誰？
  tags: [fix]
- id: qn-fix-017
  text: 有沒有一種修繕技術，是你一直想學卻還沒試的？
  tags: [fix]
- id: qn-fix-018
  text: 把壞掉的東西恢復原狀的那一刻，感覺像什麼？
  tags: [fix]
- id: qn-fix-019
  text: 你修過最難、最花時間的東西是什麼？
  tags: [fix]
- id: qn-fix-020
  text: 對你來說，動手修理和直接換新，差別在哪裡？
  tags: [fix]
