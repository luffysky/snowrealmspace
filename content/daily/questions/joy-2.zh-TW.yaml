# 每日一問 · 快樂（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-joy-021
  text: 誰的存在，會讓一個普通的日子變得不太一樣？
  tags: [joy]
- id: qn-joy-022
  text: 童年裡哪個玩耍的畫面，現在想起來還會笑？
  tags: [joy]
- id: qn-joy-023
  text: 如果快樂有形狀，你覺得它長什麼樣子？
  tags: [joy]
- id: qn-joy-024
  text: 手邊有哪個小東西，看到就覺得心暖？
  tags: [joy]
- id: qn-joy-025
  text: 收到過哪份禮物，到現在都還記得？
  tags: [joy]
- id: qn-joy-026
  text: 哪一種手感或觸感，摸起來特別舒服？
  tags: [joy]
- id: qn-joy-027
  text: 什麼樣的巧合，會讓你覺得今天很幸運？
  tags: [joy]
- id: qn-joy-028
  text: 和朋友相處時，哪個瞬間最讓你放鬆？
  tags: [joy]
- id: qn-joy-029
  text: 一個人默默完成一件事的時候，你在享受什麼？
  tags: [joy]
- id: qn-joy-030
  text: 哪一道菜或哪一口食物，會讓你眼睛發亮？
  tags: [joy]
- id: qn-joy-031
  text: 假日的清晨，你最想被什麼喚醒？
  tags: [joy]
- id: qn-joy-032
  text: 走在路上時，什麼樣的風景會讓你停下腳步？
  tags: [joy]
- id: qn-joy-033
  text: 哪一部作品或故事，讓你看完心情特別好？
  tags: [joy]
- id: qn-joy-034
  text: 你身上有什麼小小的興趣，別人可能猜不到？
  tags: [joy]
- id: qn-joy-035
  text: 什麼樣的擁抱或陪伴，會讓你覺得被接住？
  tags: [joy]
- id: qn-joy-036
  text: 完成什麼事的那一刻，會讓你想給自己拍拍手？
  tags: [joy]
- id: qn-joy-037
  text: 哪一段旋律或哪一句歌詞，會讓你會心一笑？
  tags: [joy]
- id: qn-joy-038
  text: 你會為了什麼，特地繞一段路也甘願？
  tags: [joy]
- id: qn-joy-039
  text: 深夜裡有什麼小確幸，是專屬於你的？
  tags: [joy]
- id: qn-joy-040
  text: 如果要把今天的好心情裝進一句話，你會怎麼寫？
  tags: [joy]
