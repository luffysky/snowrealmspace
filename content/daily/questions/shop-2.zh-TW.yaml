# 每日一問 · 購物與買東西（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-shop-021
  text: 對你來說，什麼樣的東西才稱得上是「值得」？
  tags: [shop]
- id: qn-shop-022
  text: 拿到剛買的東西時，你會先做的一件事是什麼？
  tags: [shop]
- id: qn-shop-023
  text: 假如今天不設任何預算，你想去逛哪一種店？
  tags: [shop]
- id: qn-shop-024
  text: 店員主動走過來介紹時，你心裡的感覺是什麼？
  tags: [shop]
- id: qn-shop-025
  text: 一樣東西的價格標籤，會影響你多少對它的判斷？
  tags: [shop]
- id: qn-shop-026
  text: 你會把逛過想要的東西記下來，還是看過就算了？
  tags: [shop]
- id: qn-shop-027
  text: 對哪一類商品，你反而愈便宜就愈猶豫？
  tags: [shop]
- id: qn-shop-028
  text: 逛市場和逛百貨，帶給你的感受有什麼不一樣？
  tags: [shop]
- id: qn-shop-029
  text: 有沒有一樣東西，是你用壞了會立刻再買一個的？
  tags: [shop]
- id: qn-shop-030
  text: 別人推薦的商品，你會照單收下還是先觀望？
  tags: [shop]
- id: qn-shop-031
  text: 買東西這件事，對你而言更像享受還是任務？
  tags: [shop]
- id: qn-shop-032
  text: 手裡拿著兩樣二選一時，你靠什麼做最後決定？
  tags: [shop]
- id: qn-shop-033
  text: 有什麼小東西，能在買下的當下讓你心情變好？
  tags: [shop]
- id: qn-shop-034
  text: 你怎麼分辨自己是真的需要，還是一時想要？
  tags: [shop]
- id: qn-shop-035
  text: 一家店裡的氣氛，會怎麼影響你停留的時間？
  tags: [shop]
- id: qn-shop-036
  text: 收到不太合意的贈品時，你通常會怎麼處理？
  tags: [shop]
- id: qn-shop-037
  text: 你更容易被商品的外觀吸引，還是它的用途？
  tags: [shop]
- id: qn-shop-038
  text: 換季出清的時候，你的購物習慣會有什麼變化？
  tags: [shop]
- id: qn-shop-039
  text: 有沒有一種店，你光是走進去就覺得放鬆？
  tags: [shop]
- id: qn-shop-040
  text: 回想小時候，最想擁有卻買不起的是什麼？
  tags: [shop]
