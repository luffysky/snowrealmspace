# 每日一問 · 旅行與探索。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-travel-001
  text: 最近一次旅行，讓你印象最深的一幕是什麼？
  tags: [travel]
- id: qn-travel-002
  text: 如果現在可以出發，你最想去哪個地方？
  tags: [travel]
- id: qn-travel-003
  text: 你旅行時，比較喜歡照著計畫走，還是隨性亂逛？
  tags: [travel]
- id: qn-travel-004
  text: 有沒有一個城市，讓你一到就有種說不出的親切感？
  tags: [travel]
- id: qn-travel-005
  text: 對你而言，旅行中最不能少的一件東西是什麼？
  tags: [travel]
- id: qn-travel-006
  text: 你曾在陌生的地方，遇過什麼難忘的人嗎？
  tags: [travel]
- id: qn-travel-007
  text: 一個人旅行和結伴同行，你偏好哪一種？
  tags: [travel]
- id: qn-travel-008
  text: 旅途中吃過哪一餐，到現在還會想念？
  tags: [travel]
- id: qn-travel-009
  text: 如果只帶一個背包出門，你會裝進哪些東西？
  tags: [travel]
- id: qn-travel-010
  text: 你比較嚮往熱鬧的城市，還是安靜的小鎮？
  tags: [travel]
- id: qn-travel-011
  text: 有哪個地方，是你去過還想再去一次的？
  tags: [travel]
- id: qn-travel-012
  text: 迷路的時候，你通常會有什麼樣的反應？
  tags: [travel]
- id: qn-travel-013
  text: 你旅行時習慣拍很多照片，還是更想用眼睛記住？
  tags: [travel]
- id: qn-travel-014
  text: 什麼樣的風景，會讓你覺得這趟路走得很值得？
  tags: [travel]
- id: qn-travel-015
  text: 你有沒有一直放在心裡、還沒實現的旅行夢想？
  tags: [travel]
- id: qn-travel-016
  text: 到了新的地方，你最先想去體驗的是什麼？
  tags: [travel]
- id: qn-travel-017
  text: 搭火車、開車還是走路，你最喜歡哪種移動方式？
  tags: [travel]
- id: qn-travel-018
  text: 旅行帶給你的改變，你自己有察覺到嗎？
  tags: [travel]
- id: qn-travel-019
  text: 如果要為某趟旅程配一首歌，你會選哪一首？
  tags: [travel]
- id: qn-travel-020
  text: 對你來說，怎樣才算是一趟真正放鬆的旅行？
  tags: [travel]
