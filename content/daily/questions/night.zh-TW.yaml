# 每日一問 · 夜晚與睡眠。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-night-001
  text: 睡前你習慣做的最後一件事是什麼？
  tags: [night]
- id: qn-night-002
  text: 當房間只剩一盞燈時，你的心情通常會有什麼變化？
  tags: [night]
- id: qn-night-003
  text: 有沒有哪一種聲音，會讓你在黑暗中覺得安心？
  tags: [night]
- id: qn-night-004
  text: 你曾經在半夜醒來時，腦中浮現的第一個念頭是什麼？
  tags: [night]
- id: qn-night-005
  text: 對你來說，深夜和清晨的安靜有什麼不一樣？
  tags: [night]
- id: qn-night-006
  text: 如果要用一種顏色形容你的夜晚，那會是什麼顏色？
  tags: [night]
- id: qn-night-007
  text: 你最近一次做的夢，還記得哪些片段？
  tags: [night]
- id: qn-night-008
  text: 躺下之後，你的思緒最常飄向哪裡？
  tags: [night]
- id: qn-night-009
  text: 有沒有一個夜晚，你到現在都還會偶爾想起？
  tags: [night]
- id: qn-night-010
  text: 你喜歡讓臥室維持全黑，還是留一點微光？
  tags: [night]
- id: qn-night-011
  text: 對你而言，「一夜好眠」是什麼樣的感覺？
  tags: [night]
- id: qn-night-012
  text: 夜裡如果睡不著，你會怎麼陪自己度過那段時間？
  tags: [night]
- id: qn-night-013
  text: 你曾在哪個地方看過最難忘的夜空？
  tags: [night]
- id: qn-night-014
  text: 枕頭旁邊，你會放些什麼東西？
  tags: [night]
- id: qn-night-015
  text: 一天當中，哪個時刻你會感覺夜晚真正開始了？
  tags: [night]
- id: qn-night-016
  text: 你和小時候相比，對黑暗的感受有什麼改變？
  tags: [night]
- id: qn-night-017
  text: 如果今晚能夢見任何人，你希望是誰？
  tags: [night]
- id: qn-night-018
  text: 深夜裡的哪一種氣味，會勾起你某段記憶？
  tags: [night]
- id: qn-night-019
  text: 你怎麼區分「累了」和「想睡了」這兩種感覺？
  tags: [night]
- id: qn-night-020
  text: 假如夜晚能對你說一句話，你猜它會說什麼？
  tags: [night]
