# 每日一問 · 工作與創作。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-work-001
  text: 今天做的事情裡，哪一件讓你覺得動手起來特別順？
  tags: [work]
- id: qn-work-002
  text: 手邊有沒有一件事，光是要開始就得先深呼吸一下？
  tags: [work]
- id: qn-work-003
  text: 卡在一個地方過不去時，你通常會怎麼繞過去？
  tags: [work]
- id: qn-work-004
  text: 把一件事做完的那一刻，你身體的感覺是什麼？
  tags: [work]
- id: qn-work-005
  text: 有沒有一個點子，你一直想找時間把它真正做出來？
  tags: [work]
- id: qn-work-006
  text: 專心做一件事的時候，你最容易被什麼打斷？
  tags: [work]
- id: qn-work-007
  text: 如果能重來今天其中一段工作，你會怎麼安排？
  tags: [work]
- id: qn-work-008
  text: 做東西的整個過程裡，哪個環節最讓你享受？
  tags: [work]
- id: qn-work-009
  text: 你都怎麼判斷一件作品「這樣就夠了」？
  tags: [work]
- id: qn-work-010
  text: 什麼樣的環境，會讓你做事特別投入？
  tags: [work]
- id: qn-work-011
  text: 正在進行的那件東西，最近走到哪個階段了？
  tags: [work]
- id: qn-work-012
  text: 哪一種事情做起來，會讓你完全忘記時間？
  tags: [work]
- id: qn-work-013
  text: 面對不想做卻必須做的事，你會用什麼方式讓自己起步？
  tags: [work]
- id: qn-work-014
  text: 上一次為某件事投入很久，是為了什麼？
  tags: [work]
- id: qn-work-015
  text: 做事時你偏好一次專心一件，還是同時開好幾個？
  tags: [work]
- id: qn-work-016
  text: 什麼樣的回饋，會讓你更想把作品打磨得更好？
  tags: [work]
- id: qn-work-017
  text: 如果今天的工作只能留下一件，你會留下哪一件？
  tags: [work]
- id: qn-work-018
  text: 動手之前，你習慣先規劃清楚，還是先試試看？
  tags: [work]
- id: qn-work-019
  text: 有哪個小地方，是你會忍不住想做到很細緻的？
  tags: [work]
- id: qn-work-020
  text: 一天結束時，怎樣才算「今天真的有做出東西」？
  tags: [work]
