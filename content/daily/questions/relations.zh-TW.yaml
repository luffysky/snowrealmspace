# 每日一問 · 關係／人際。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: q-rel-001
  text: 最近有沒有想聯絡、卻還沒聯絡的人？
  tags: [relations]
- id: q-rel-002
  text: 今天有誰讓你覺得溫暖？
  tags: [relations]
- id: q-rel-003
  text: 你上一次好好道謝，是對誰？
  tags: [relations]
- id: q-rel-004
  text: 有沒有一句話，你一直想對某人說？
  tags: [relations]
- id: q-rel-005
  text: 誰是你累的時候，會想到的人？
  tags: [relations]
- id: q-rel-006
  text: 最近你陪伴了誰，或被誰陪伴？
  tags: [relations]
- id: q-rel-007
  text: 有沒有一段關係，你想更靠近一點？
  tags: [relations]
- id: q-rel-008
  text: 今天你對別人，多了一點耐心嗎？
  tags: [relations]
- id: q-rel-009
  text: 你希望別人怎麼記得你？
  tags: [relations]
- id: q-rel-010
  text: 最近誰的話，讓你放在了心上？
  tags: [relations]
- id: q-rel-011
  text: 有沒有一個人，你想為他留點時間？
  tags: [relations]
- id: q-rel-012
  text: 你上一次原諒別人，是為了什麼？
  tags: [relations]
- id: q-rel-013
  text: 誰在你身邊，讓你可以做自己？
  tags: [relations]
- id: q-rel-014
  text: 今天你有沒有，好好聽某人說話？
  tags: [relations]
- id: q-rel-015
  text: 有沒有一段關係，需要你先鬆手？
  tags: [relations]
- id: q-rel-016
  text: 你最想和誰，一起吃頓飯？
  tags: [relations]
- id: q-rel-017
  text: 最近有沒有人，讓你想成為更好的人？
  tags: [relations]
- id: q-rel-018
  text: 你會用什麼，記住重要的人？
  tags: [relations]
- id: q-rel-019
  text: 有沒有一個久違的名字，今天浮上心頭？
  tags: [relations]
- id: q-rel-020
  text: 今天，你想給誰一個擁抱？
  tags: [relations]
