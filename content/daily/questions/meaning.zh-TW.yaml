# 每日一問 · 人生意義。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-meaning-001
  text: 最近有什麼事，讓你覺得「還好我有做」？
  tags: [meaning]
- id: qn-meaning-002
  text: 你希望別人記得你的哪一面？
  tags: [meaning]
- id: qn-meaning-003
  text: 什麼樣的一天，會讓你覺得過得很值得？
  tags: [meaning]
- id: qn-meaning-004
  text: 有沒有一件小事，是你很想一直保有的？
  tags: [meaning]
- id: qn-meaning-005
  text: 對你來說，什麼東西是再忙也不想放掉的？
  tags: [meaning]
- id: qn-meaning-006
  text: 你最近一次覺得「活著真好」，是在什麼時刻？
  tags: [meaning]
- id: qn-meaning-007
  text: 如果可以留下一樣東西給在乎的人，你想留什麼？
  tags: [meaning]
- id: qn-meaning-008
  text: 哪一段關係，讓你覺得自己被好好珍惜著？
  tags: [meaning]
- id: qn-meaning-009
  text: 有什麼事，你做起來會忘記時間的流逝？
  tags: [meaning]
- id: qn-meaning-010
  text: 你心裡有沒有一個，怎麼樣都不想妥協的東西？
  tags: [meaning]
- id: qn-meaning-011
  text: 什麼樣的陪伴，會讓你覺得特別安心？
  tags: [meaning]
- id: qn-meaning-012
  text: 你希望十年後的自己，還在乎著什麼？
  tags: [meaning]
- id: qn-meaning-013
  text: 有沒有一個瞬間，讓你確定自己走在對的路上？
  tags: [meaning]
- id: qn-meaning-014
  text: 對現在的你來說，什麼算是「夠了」？
  tags: [meaning]
- id: qn-meaning-015
  text: 你曾經幫過誰，讓你到現在想起還覺得溫暖？
  tags: [meaning]
- id: qn-meaning-016
  text: 如果生活只能留下三件事，你會留哪三件？
  tags: [meaning]
- id: qn-meaning-017
  text: 什麼樣的小小成就，會讓你打從心底開心？
  tags: [meaning]
- id: qn-meaning-018
  text: 你想在這個世界留下一點什麼樣的痕跡？
  tags: [meaning]
- id: qn-meaning-019
  text: 有沒有一種生活的樣子，是你正慢慢靠近的？
  tags: [meaning]
- id: qn-meaning-020
  text: 回頭看，是什麼一直在支撐著你往前走？
  tags: [meaning]
