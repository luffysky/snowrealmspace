# 每日一問 · 失敗與挫折。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fail-001
  text: 最近哪件不順的事，其實悄悄教了你一點什麼？
  tags: [failure]
- id: qn-fail-002
  text: 有沒有一次跌倒的經驗，現在回頭看反而覺得慶幸？
  tags: [failure]
- id: qn-fail-003
  text: 當事情沒有照你想的走時，你通常先注意到自己身體的哪個反應？
  tags: [failure]
- id: qn-fail-004
  text: 你會怎麼對一個剛剛搞砸的朋友說話，那些話你捨得對自己說嗎？
  tags: [failure]
- id: qn-fail-005
  text: 哪一種挫折，是你到現在還沒完全和解的？
  tags: [failure]
- id: qn-fail-006
  text: 如果失敗會留下痕跡，你身上這道痕跡長什麼樣子？
  tags: [failure]
- id: qn-fail-007
  text: 曾經你以為是終點的事，後來變成了通往哪裡的路口？
  tags: [failure]
- id: qn-fail-008
  text: 面對做不好的時候，你是傾向責怪自己，還是傾向理解自己？
  tags: [failure]
- id: qn-fail-009
  text: 有什麼是你努力過、也沒成功，但你依然不後悔投入的？
  tags: [failure]
- id: qn-fail-010
  text: 你記憶裡最早的一次挫折，現在還握著它的哪個部分？
  tags: [failure]
- id: qn-fail-011
  text: 當別人看見你的失手時，你最在意的是他們怎麼想的哪一點？
  tags: [failure]
- id: qn-fail-012
  text: 有沒有一種失敗，讓你重新認識了自己真正想要的東西？
  tags: [failure]
- id: qn-fail-013
  text: 你如何分辨「這次先停下來」和「就這樣放棄了」的差別？
  tags: [failure]
- id: qn-fail-014
  text: 若可以帶一句話回去給那個沮喪的自己，你想說什麼？
  tags: [failure]
- id: qn-fail-015
  text: 哪些不完美的地方，你其實漸漸能夠與它共處了？
  tags: [failure]
- id: qn-fail-016
  text: 在別人眼中的失敗裡，你自己私下珍惜的是哪一部分？
  tags: [failure]
- id: qn-fail-017
  text: 當一件重視的事情落空，你會用什麼方式慢慢陪自己走過？
  tags: [failure]
- id: qn-fail-018
  text: 你心裡有沒有一個「原本會怎樣」的版本，還偶爾想起它？
  tags: [failure]
- id: qn-fail-019
  text: 哪一次的搞砸，讓你和某個人的距離反而變近了？
  tags: [failure]
- id: qn-fail-020
  text: 對現在的你來說，失敗這兩個字的重量，和以前有什麼不同？
  tags: [failure]
