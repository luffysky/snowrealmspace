# 每日一問 · 金錢與價值觀（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-value-021
  text: 你會怎麼跟晚輩解釋「什麼樣的東西值得買」？
  tags: [values]
- id: qn-value-022
  text: 看到別人擁有你買不起的東西時，心裡會冒出什麼？
  tags: [values]
- id: qn-value-023
  text: 有沒有一種價值，是你就算吃虧也不願意讓步的？
  tags: [values]
- id: qn-value-024
  text: 收到一份很貴的禮物，你的心情會是什麼樣的？
  tags: [values]
- id: qn-value-025
  text: 你怎麼看待把錢捐出去這件事？
  tags: [values]
- id: qn-value-026
  text: 如果薪水一樣，你會選喜歡的工作還是輕鬆的工作？
  tags: [values]
- id: qn-value-027
  text: 在你心裡，時間和金錢哪一個更難補回來？
  tags: [values]
- id: qn-value-028
  text: 有沒有一樣二手的東西，你反而覺得比全新的更有意思？
  tags: [values]
- id: qn-value-029
  text: 你怎麼判斷一個人是不是真的過得富足？
  tags: [values]
- id: qn-value-030
  text: 面對打折促銷，你通常是什麼樣的反應？
  tags: [values]
- id: qn-value-031
  text: 如果要留一筆錢給未來的自己，你會希望他拿去做什麼？
  tags: [values]
- id: qn-value-032
  text: 什麼樣的東西，你買的時候特別願意多研究一下？
  tags: [values]
- id: qn-value-033
  text: 你覺得「便宜」和「划算」之間，差別在哪裡？
  tags: [values]
- id: qn-value-034
  text: 有沒有一次為了原則，你放棄了到手的好處？
  tags: [values]
- id: qn-value-035
  text: 跟朋友分帳的時候，你心裡會怎麼算這件事？
  tags: [values]
- id: qn-value-036
  text: 你會怎麼形容一個「用錢很聰明」的人？
  tags: [values]
- id: qn-value-037
  text: 如果錢完全不是問題，你的一天會變成什麼樣？
  tags: [values]
- id: qn-value-038
  text: 有什麼是你年輕時捨不得花、現在卻覺得值得的？
  tags: [values]
- id: qn-value-039
  text: 你怎麼看待為了面子而多花的那一筆錢？
  tags: [values]
- id: qn-value-040
  text: 對你來說，「有價值的一天」跟花多少錢有關嗎？
  tags: [values]
