# 每日一問 · 名字與稱呼。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-name-001
  text: 你的名字背後，藏著什麼樣的故事？
  tags: [name]
- id: qn-name-002
  text: 家人平常都怎麼叫你？
  tags: [name]
- id: qn-name-003
  text: 有沒有一個稱呼，只有某個人會這樣喚你？
  tags: [name]
- id: qn-name-004
  text: 聽到別人喊你的全名時，你會有什麼感覺？
  tags: [name]
- id: qn-name-005
  text: 如果可以替自己重取一個名字，你想叫什麼？
  tags: [name]
- id: qn-name-006
  text: 小時候的綽號，是怎麼來的？
  tags: [name]
- id: qn-name-007
  text: 哪一個對你的稱呼，聽了會讓你心頭一暖？
  tags: [name]
- id: qn-name-008
  text: 你喜歡替身邊的人、寵物或東西取名字嗎？
  tags: [name]
- id: qn-name-009
  text: 有沒有一個名字，你光是聽到就會想起某個人？
  tags: [name]
- id: qn-name-010
  text: 在網路上，你都用什麼名字現身？
  tags: [name]
- id: qn-name-011
  text: 你希望別人第一次見面時怎麼稱呼你？
  tags: [name]
- id: qn-name-012
  text: 有哪個舊稱呼，是你其實不太想再被叫到的？
  tags: [name]
- id: qn-name-013
  text: 你會怎麼稱呼你最親近的那個人？
  tags: [name]
- id: qn-name-014
  text: 名字裡的哪一個字，是你特別喜歡的？
  tags: [name]
- id: qn-name-015
  text: 有沒有一個稱呼，會隨著關係變化而慢慢改變？
  tags: [name]
- id: qn-name-016
  text: 別人念錯你的名字時，你通常怎麼回應？
  tags: [name]
- id: qn-name-017
  text: 如果要為未來的孩子取名，你會從哪裡尋找靈感？
  tags: [name]
- id: qn-name-018
  text: 哪個角色或人物的名字，曾讓你印象深刻？
  tags: [name]
- id: qn-name-019
  text: 你和某個人之間，有沒有只有你們懂的暱稱？
  tags: [name]
- id: qn-name-020
  text: 一個名字要具備什麼，才會讓你覺得好聽？
  tags: [name]
