# 每日一問 · 回顧（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-lookback-021
  text: 這一週你認識了誰、或多懂了誰一點？
  tags: [looking_back]
- id: qn-lookback-022
  text: 最近哪個地方，你去過之後還常想起？
  tags: [looking_back]
- id: qn-lookback-023
  text: 上一次改變主意，是被什麼打動的？
  tags: [looking_back]
- id: qn-lookback-024
  text: 這陣子哪一頓飯，你到現在還記得味道？
  tags: [looking_back]
- id: qn-lookback-025
  text: 過去這段日子，你替誰做過一件他不知道的事？
  tags: [looking_back]
- id: qn-lookback-026
  text: 最近讀到或聽到的哪句話，你想收進口袋？
  tags: [looking_back]
- id: qn-lookback-027
  text: 這一年你走過最遠的一段路，是去哪裡？
  tags: [looking_back]
- id: qn-lookback-028
  text: 上一次為別人的事高興，是什麼場合？
  tags: [looking_back]
- id: qn-lookback-029
  text: 最近哪個選擇，當時猶豫、現在慶幸？
  tags: [looking_back]
- id: qn-lookback-030
  text: 這陣子你和誰的關係，悄悄變近了？
  tags: [looking_back]
- id: qn-lookback-031
  text: 回頭看，哪個當初的失望其實藏著轉機？
  tags: [looking_back]
- id: qn-lookback-032
  text: 最近一次熬夜或早起，是為了什麼？
  tags: [looking_back]
- id: qn-lookback-033
  text: 這段時間裡，你戒掉或減少了什麼？
  tags: [looking_back]
- id: qn-lookback-034
  text: 上一次收到禮物，是誰送的、送了什麼？
  tags: [looking_back]
- id: qn-lookback-035
  text: 過去幾個月，哪一件小事重複發生、你其實蠻喜歡？
  tags: [looking_back]
- id: qn-lookback-036
  text: 最近你為哪件事道過謝，或想補一句謝謝？
  tags: [looking_back]
- id: qn-lookback-037
  text: 這一季你花最多心思的，是哪一件事？
  tags: [looking_back]
- id: qn-lookback-038
  text: 上一次和老朋友聯絡，聊到了什麼？
  tags: [looking_back]
- id: qn-lookback-039
  text: 回想起來，今年哪個季節對你比較溫柔？
  tags: [looking_back]
- id: qn-lookback-040
  text: 最近哪個曾經的難題，如今你已經越過了？
  tags: [looking_back]
