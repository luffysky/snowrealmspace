# 每日一問 · 自然與四季（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-nature-021
  text: 一陣風吹過來的時候，你會注意它帶著什麼氣息嗎？
  tags: [nature]
- id: qn-nature-022
  text: 說到某種水果，你會立刻聯想到哪個季節？
  tags: [nature]
- id: qn-nature-023
  text: 落葉鋪滿地面的路，你走過去會是什麼感受？
  tags: [nature]
- id: qn-nature-024
  text: 如果冬天下起雪，你最想第一時間做的事情是什麼？
  tags: [nature]
- id: qn-nature-025
  text: 潮水漲退之間，哪一種狀態比較貼近你現在的步調？
  tags: [nature]
- id: qn-nature-026
  text: 夜裡蟲鳴此起彼落時，你腦中會浮現什麼樣的畫面？
  tags: [nature]
- id: qn-nature-027
  text: 一顆種子慢慢長成的過程，讓你聯想到自己的哪一段經歷？
  tags: [nature]
- id: qn-nature-028
  text: 春天萬物冒出新芽時，你身上有沒有什麼也跟著甦醒？
  tags: [nature]
- id: qn-nature-029
  text: 起霧的早晨，能見度變低的世界給你什麼樣的想像？
  tags: [nature]
- id: qn-nature-030
  text: 每個季節如果各有一種顏色，你會怎麼替它們上色？
  tags: [nature]
- id: qn-nature-031
  text: 溪水流動的樣子，和你嚮往的生活節奏有幾分相似？
  tags: [nature]
- id: qn-nature-032
  text: 打雷閃電的夜晚，你心裡是敬畏多一些，還是好奇多一些？
  tags: [nature]
- id: qn-nature-033
  text: 光腳踩過石頭、泥土或落葉，哪一種觸感讓你最有印象？
  tags: [nature]
- id: qn-nature-034
  text: 隨著季節替換衣物時，你會有什麼樣的心情轉變？
  tags: [nature]
- id: qn-nature-035
  text: 候鳥遷徙、動物冬眠這些自然現象，哪一個最觸動你？
  tags: [nature]
- id: qn-nature-036
  text: 白天的森林和夜晚的森林，你更好奇哪一種面貌？
  tags: [nature]
- id: qn-nature-037
  text: 一整年裡，你最期待哪個節氣或哪一天的到來？
  tags: [nature]
- id: qn-nature-038
  text: 收成的季節帶給你的，是滿足感還是別種滋味？
  tags: [nature]
- id: qn-nature-039
  text: 抬頭看見一大片流動的雲，你會替它們編出什麼故事？
  tags: [nature]
- id: qn-nature-040
  text: 如果讓你在某種自然環境裡住上一整年，你會挑哪裡？
  tags: [nature]
