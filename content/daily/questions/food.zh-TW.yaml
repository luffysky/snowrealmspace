# 每日一問 · 食物與味覺。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-food-001
  text: 今天吃到的東西裡，哪一樣最合胃口？
  tags: [food]
- id: qn-food-002
  text: 有沒有一種味道，一聞到就會想起某個地方？
  tags: [food]
- id: qn-food-003
  text: 如果要為這個星期挑一頓最難忘的飯，你會選哪一頓？
  tags: [food]
- id: qn-food-004
  text: 你偏好熱騰騰的食物，還是放涼了再吃比較對味？
  tags: [food]
- id: qn-food-005
  text: 小時候餐桌上常出現、現在卻少見的菜是什麼？
  tags: [food]
- id: qn-food-006
  text: 酸、甜、苦、辣、鹹之中，哪一種滋味最貼近你最近的心情？
  tags: [food]
- id: qn-food-007
  text: 有什麼食物是你願意排很久的隊也想吃到的？
  tags: [food]
- id: qn-food-008
  text: 一個人吃飯的時候，你通常會怎麼安排這頓？
  tags: [food]
- id: qn-food-009
  text: 你記憶中最好喝的一杯飲料，是在什麼情境下喝到的？
  tags: [food]
- id: qn-food-010
  text: 假如明天要親手做一道菜給別人，你想做什麼？
  tags: [food]
- id: qn-food-011
  text: 對你來說，怎樣的一頓飯才稱得上「療癒」？
  tags: [food]
- id: qn-food-012
  text: 有沒有一種食材，你以前不敢碰、後來卻愛上了？
  tags: [food]
- id: qn-food-013
  text: 逛市場或超市時，最容易讓你停下腳步的是哪一區？
  tags: [food]
- id: qn-food-014
  text: 你心中的宵夜首選是什麼，理由又是什麼？
  tags: [food]
- id: qn-food-015
  text: 換季的時候，你的餐桌會出現哪些不一樣的東西？
  tags: [food]
- id: qn-food-016
  text: 甜點在你的一天裡，扮演著什麼樣的角色？
  tags: [food]
- id: qn-food-017
  text: 和誰一起吃飯，會讓食物嚐起來格外不同？
  tags: [food]
- id: qn-food-018
  text: 出門在外時，你最想念家裡的哪一道味道？
  tags: [food]
- id: qn-food-019
  text: 早餐這件事，你是隨性應付還是有固定的儀式？
  tags: [food]
- id: qn-food-020
  text: 若用一種食物來形容今天的自己，你會挑哪一種？
  tags: [food]
