# 每日一問 · 承諾與責任（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-promise-021
  text: 什麼樣的情況，會讓你重新考慮一個已經給出的約定？
  tags: [promise]
- id: qn-promise-022
  text: 有沒有一次，你因為守住一個約定而放下了別的機會？
  tags: [promise]
- id: qn-promise-023
  text: 在攬下一件事之前，你通常會先問自己哪些問題？
  tags: [promise]
- id: qn-promise-024
  text: 有沒有一種責任，是你原本想推掉、後來卻慶幸接下的？
  tags: [promise]
- id: qn-promise-025
  text: 當別人默默替你守著某個約定，你心裡是什麼滋味？
  tags: [promise]
- id: qn-promise-026
  text: 一句「我保證」和「我盡量」，在你聽來差在哪裡？
  tags: [promise]
- id: qn-promise-027
  text: 當肩上的擔子重得喘不過氣，你會怎麼安放自己？
  tags: [promise]
- id: qn-promise-028
  text: 你是憑什麼，決定一件事要不要說出口變成承諾？
  tags: [promise]
- id: qn-promise-029
  text: 兩個都答應了卻只能完成一個，你會怎麼取捨？
  tags: [promise]
- id: qn-promise-030
  text: 有沒有一個承諾，隨著年歲在你心裡換了新的意義？
  tags: [promise]
- id: qn-promise-031
  text: 你希望別人記得的，是一個怎麼樣守約的你？
  tags: [promise]
- id: qn-promise-032
  text: 替人扛下一份責任之後，你都怎麼照顧自己的疲累？
  tags: [promise]
- id: qn-promise-033
  text: 什麼時候你會覺得，鬆手放下反而才是負責？
  tags: [promise]
- id: qn-promise-034
  text: 一段關係裡，哪些沒說出口的約定其實一直都在？
  tags: [promise]
- id: qn-promise-035
  text: 你怎麼分辨一個承諾是出於真心，還是出於當下的氣氛？
  tags: [promise]
- id: qn-promise-036
  text: 有沒有誰對你許下的約定，改變了你看待自己的方式？
  tags: [promise]
- id: qn-promise-037
  text: 當你實在無法兌現，你希望對方怎麼對待這件事？
  tags: [promise]
- id: qn-promise-038
  text: 在你看來，「負責」和「討好別人」之間的界線在哪裡？
  tags: [promise]
- id: qn-promise-039
  text: 哪一種託付，會讓你感覺自己被深深地信任著？
  tags: [promise]
- id: qn-promise-040
  text: 若要卸下一份背了很久的責任，你會怎麼跟它道別？
  tags: [promise]
