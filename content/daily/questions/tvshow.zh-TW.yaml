# 每日一問 · 電視劇與追劇。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-tvshow-001
  text: 你最近在追的是哪一部劇？
  tags: [tvshow]
- id: qn-tvshow-002
  text: 有沒有一部劇，你曾經一口氣就看完的？
  tags: [tvshow]
- id: qn-tvshow-003
  text: 哪個劇中角色，讓你覺得特別真實或難忘？
  tags: [tvshow]
- id: qn-tvshow-004
  text: 追劇時你偏好一集一集慢慢看，還是一次看好幾集？
  tags: [tvshow]
- id: qn-tvshow-005
  text: 有哪一部劇的結局，讓你到現在還在回味？
  tags: [tvshow]
- id: qn-tvshow-006
  text: 什麼題材的影集，最容易讓你點下去？
  tags: [tvshow]
- id: qn-tvshow-007
  text: 你會重看同一部劇嗎，是哪一部？
  tags: [tvshow]
- id: qn-tvshow-008
  text: 有沒有一部劇，是別人推薦後你才愛上的？
  tags: [tvshow]
- id: qn-tvshow-009
  text: 劇裡的哪一句台詞，你到現在還記得？
  tags: [tvshow]
- id: qn-tvshow-010
  text: 你習慣配著什麼一起追劇？
  tags: [tvshow]
- id: qn-tvshow-011
  text: 追劇時，你比較在意劇情、角色，還是畫面氣氛？
  tags: [tvshow]
- id: qn-tvshow-012
  text: 有沒有一部劇讓你看完後，好一陣子走不出那個世界？
  tags: [tvshow]
- id: qn-tvshow-013
  text: 你會追國外的影集嗎，哪個國家的最合你胃口？
  tags: [tvshow]
- id: qn-tvshow-014
  text: 一部劇要具備什麼，才能讓你願意一直追下去？
  tags: [tvshow]
- id: qn-tvshow-015
  text: 有沒有哪部劇，你追到一半就放棄了，當時發生了什麼？
  tags: [tvshow]
- id: qn-tvshow-016
  text: 和別人一起追劇，跟自己一個人看，感覺差在哪裡？
  tags: [tvshow]
- id: qn-tvshow-017
  text: 哪個劇中的世界或設定，讓你想住進去看看？
  tags: [tvshow]
- id: qn-tvshow-018
  text: 你會去看劇評或網路討論，還是喜歡自己慢慢體會？
  tags: [tvshow]
- id: qn-tvshow-019
  text: 最近有沒有哪部劇，讓你想推薦給身邊的人？
  tags: [tvshow]
- id: qn-tvshow-020
  text: 追完一部長劇的那一刻，你心裡通常是什麼感覺？
  tags: [tvshow]
