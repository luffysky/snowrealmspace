# 每日一問 · 界線與拒絕。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-boundary-001
  text: 最近有沒有一件事，你其實想拒絕卻答應了？
  tags: [boundary]
- id: qn-boundary-002
  text: 什麼樣的請求，會讓你覺得越過了你的界線？
  tags: [boundary]
- id: qn-boundary-003
  text: 你通常會怎麼向別人表達「我不想這樣」？
  tags: [boundary]
- id: qn-boundary-004
  text: 有沒有哪一種場合，讓你特別難開口說不？
  tags: [boundary]
- id: qn-boundary-005
  text: 對你來說，怎樣算是別人尊重了你的空間？
  tags: [boundary]
- id: qn-boundary-006
  text: 有什麼事是你希望別人不要再替你決定的？
  tags: [boundary]
- id: qn-boundary-007
  text: 當你需要獨處時，你會怎麼讓身邊的人知道？
  tags: [boundary]
- id: qn-boundary-008
  text: 有沒有一句「請不要這樣對我」，你一直想對某個人說？
  tags: [boundary]
- id: qn-boundary-009
  text: 你在什麼情況下，會選擇和某些人保持距離？
  tags: [boundary]
- id: qn-boundary-010
  text: 對你而言，哪些話題是你不太想被追問的？
  tags: [boundary]
- id: qn-boundary-011
  text: 你曾經因為拒絕別人而感到為難嗎，那是什麼情況？
  tags: [boundary]
- id: qn-boundary-012
  text: 什麼樣的相處方式，會讓你覺得自在又安全？
  tags: [boundary]
- id: qn-boundary-013
  text: 有沒有一種要求，你現在已經能坦然說不的？
  tags: [boundary]
- id: qn-boundary-014
  text: 當別人越過界線時，你的身體或情緒通常會有什麼反應？
  tags: [boundary]
- id: qn-boundary-015
  text: 你希望別人在靠近你之前，先問過你什麼？
  tags: [boundary]
- id: qn-boundary-016
  text: 有什麼是你願意為某些人破例、卻不對所有人開放的？
  tags: [boundary]
- id: qn-boundary-017
  text: 面對不想回答的問題，你會怎麼回應？
  tags: [boundary]
- id: qn-boundary-018
  text: 你有沒有替自己設下、而且一直守住的一條底線？
  tags: [boundary]
- id: qn-boundary-019
  text: 什麼時候你會意識到，自己需要退一步保護自己？
  tags: [boundary]
- id: qn-boundary-020
  text: 對你來說，說出「不」之後，最不容易的部分是什麼？
  tags: [boundary]
