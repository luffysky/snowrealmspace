# 每日一問 · 友誼。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-friend-001
  text: 最近哪位朋友，讓你覺得待在一起特別自在？
  tags: [friendship]
- id: qn-friend-002
  text: 你和朋友之間，有沒有一個只有你們懂的默契？
  tags: [friendship]
- id: qn-friend-003
  text: 如果要描述你心中的好友，你會先想到哪個畫面？
  tags: [friendship]
- id: qn-friend-004
  text: 認識一個朋友的哪個瞬間，讓你決定想繼續走近？
  tags: [friendship]
- id: qn-friend-005
  text: 你通常怎麼讓一段友誼，慢慢變得更深？
  tags: [friendship]
- id: qn-friend-006
  text: 有哪句朋友說過的話，到現在你還記得？
  tags: [friendship]
- id: qn-friend-007
  text: 對你來說，朋友之間最珍貴的是什麼？
  tags: [friendship]
- id: qn-friend-008
  text: 你和某位朋友，是怎麼從陌生變熟的？
  tags: [friendship]
- id: qn-friend-009
  text: 遇到煩心事時，你最想找哪一位朋友聊聊？
  tags: [friendship]
- id: qn-friend-010
  text: 有沒有一位很久沒聯絡、卻依然想念的朋友？
  tags: [friendship]
- id: qn-friend-011
  text: 你曾經在哪件小事上，感受到朋友的用心？
  tags: [friendship]
- id: qn-friend-012
  text: 和朋友一起做過哪件事，讓你笑到現在還會回味？
  tags: [friendship]
- id: qn-friend-013
  text: 你希望朋友怎麼形容和你相處的感覺？
  tags: [friendship]
- id: qn-friend-014
  text: 什麼樣的朋友，會讓你願意展現最真實的自己？
  tags: [friendship]
- id: qn-friend-015
  text: 你和朋友吵過架又和好的經驗，教會了你什麼？
  tags: [friendship]
- id: qn-friend-016
  text: 若要為某位朋友挑一份禮物，你腦中浮現的是什麼？
  tags: [friendship]
- id: qn-friend-017
  text: 哪一段友誼，改變了你看待世界的方式？
  tags: [friendship]
- id: qn-friend-018
  text: 你覺得自己是哪一種類型的朋友？
  tags: [friendship]
- id: qn-friend-019
  text: 和朋友之間，你最想守護的是哪一種感覺？
  tags: [friendship]
- id: qn-friend-020
  text: 如果現在能和一位朋友說句話，你想說什麼？
  tags: [friendship]
