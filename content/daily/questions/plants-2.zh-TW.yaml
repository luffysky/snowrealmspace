# 每日一問 · 植物與園藝（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-plant-021
  text: 你有沒有偷偷替某株植物取過名字，那是什麼名字？
  tags: [plants]
- id: qn-plant-022
  text: 葉子上停著一滴露水的樣子，會讓你想到什麼？
  tags: [plants]
- id: qn-plant-023
  text: 如果要把一株植物送去某個房間，你會挑哪個空間？
  tags: [plants]
- id: qn-plant-024
  text: 你偏好花開得熱鬧，還是喜歡安靜的一片綠？
  tags: [plants]
- id: qn-plant-025
  text: 曾經有株植物枯萎，那件事讓你學到了什麼？
  tags: [plants]
- id: qn-plant-026
  text: 市場或花店裡，是什麼會讓你忍不住多看兩眼？
  tags: [plants]
- id: qn-plant-027
  text: 你對某種植物的第一印象，後來有沒有改變過？
  tags: [plants]
- id: qn-plant-028
  text: 雨後的葉子和陽光下的葉子，你更喜歡哪一種？
  tags: [plants]
- id: qn-plant-029
  text: 如果讓你在陽台種一樣可以吃的作物，你想種什麼？
  tags: [plants]
- id: qn-plant-030
  text: 換盆、鬆土這些動作，做起來給你什麼樣的觸感？
  tags: [plants]
- id: qn-plant-031
  text: 你曾經把植物分株或扦插送給誰嗎，那是怎樣的心情？
  tags: [plants]
- id: qn-plant-032
  text: 一棵老樹和一株剛冒芽的小苗，哪一個更吸引你？
  tags: [plants]
- id: qn-plant-033
  text: 植物的香氣裡，有沒有一種和某段回憶綁在一起？
  tags: [plants]
- id: qn-plant-034
  text: 你會怎麼判斷一株植物「過得好不好」？
  tags: [plants]
- id: qn-plant-035
  text: 攀藤、垂墜、直立，這些生長的姿態你最欣賞哪一種？
  tags: [plants]
- id: qn-plant-036
  text: 如果在旅途中遇見一種沒見過的植物，你會怎麼認識它？
  tags: [plants]
- id: qn-plant-037
  text: 落葉鋪滿地的那一幕，帶給你什麼樣的感受？
  tags: [plants]
- id: qn-plant-038
  text: 你和植物相處時，比較像在照顧誰，還是被誰陪伴？
  tags: [plants]
- id: qn-plant-039
  text: 有哪種顏色的花或葉，總是特別容易吸引你的目光？
  tags: [plants]
- id: qn-plant-040
  text: 如果要用一株植物代表這個季節的你，會是哪一種？
  tags: [plants]
