# 每日一問 · 斷捨離與丟東西（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-declutter-021
  text: 桌面上那些小東西，你多久會整理一次？
  tags: [declutter]
- id: qn-declutter-022
  text: 你手機裡最捨不得刪的是哪一類照片？
  tags: [declutter]
- id: qn-declutter-023
  text: 收到一份包裝精美的空盒子，你會怎麼處置它？
  tags: [declutter]
- id: qn-declutter-024
  text: 對你來說，什麼樣的物品算是「有溫度」的？
  tags: [declutter]
- id: qn-declutter-025
  text: 整理房間時，你是先動手，還是先想好再開始？
  tags: [declutter]
- id: qn-declutter-026
  text: 有沒有一樣別人眼中的垃圾，在你心裡是寶貝？
  tags: [declutter]
- id: qn-declutter-027
  text: 你比較容易被新東西吸引，還是被舊東西牽絆？
  tags: [declutter]
- id: qn-declutter-028
  text: 如果把童年的玩具攤在眼前，你會留下哪一個？
  tags: [declutter]
- id: qn-declutter-029
  text: 一份用不到的紀念品，對你的意義藏在哪裡？
  tags: [declutter]
- id: qn-declutter-030
  text: 你會為了買新的而先清掉舊的嗎？
  tags: [declutter]
- id: qn-declutter-031
  text: 冰箱裡最常被你遺忘的是什麼？
  tags: [declutter]
- id: qn-declutter-032
  text: 面對一疊多年的信件或卡片，你的手會怎麼動？
  tags: [declutter]
- id: qn-declutter-033
  text: 什麼樣的空間，會讓你一走進去就想深呼吸？
  tags: [declutter]
- id: qn-declutter-034
  text: 你覺得「留白」和「空蕩」之間，界線在哪？
  tags: [declutter]
- id: qn-declutter-035
  text: 有沒有一次整理，讓你意外翻出忘記的自己？
  tags: [declutter]
- id: qn-declutter-036
  text: 你會把東西分給誰，勝過直接把它丟掉？
  tags: [declutter]
- id: qn-declutter-037
  text: 一件穿舊了的衣服，退場的方式你想怎麼安排？
  tags: [declutter]
- id: qn-declutter-038
  text: 對你而言，擁有一樣東西和被它綁住，差在哪裡？
  tags: [declutter]
- id: qn-declutter-039
  text: 假如物品會道別，你希望聽到它說什麼？
  tags: [declutter]
- id: qn-declutter-040
  text: 十年後回頭看今天的家，你猜自己會想留下什麼？
  tags: [declutter]
