# 每日一問 · 存錢與省錢（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-saving-021
  text: 衝動買下一樣東西後，你事後多半是什麼心情？
  tags: [saving]
- id: qn-saving-022
  text: 用借的、租的或二手的來替代購買，你試過哪些？
  tags: [saving]
- id: qn-saving-023
  text: 手機裡的記帳或理財工具，有幫上你的忙嗎？
  tags: [saving]
- id: qn-saving-024
  text: 付現金和用電子支付，哪一種讓你更有花錢的實感？
  tags: [saving]
- id: qn-saving-025
  text: 存錢計畫中途破功的時候，你會怎麼重新開始？
  tags: [saving]
- id: qn-saving-026
  text: 在別人眼中，你是個怎麼看待用錢的人？
  tags: [saving]
- id: qn-saving-027
  text: 如果收到一筆意料之外的錢，你的第一個念頭是什麼？
  tags: [saving]
- id: qn-saving-028
  text: 每個月的訂閱項目，你多久會回頭檢視一次？
  tags: [saving]
- id: qn-saving-029
  text: 有沒有一個大目標，是你正一點一點存錢往它靠近的？
  tags: [saving]
- id: qn-saving-030
  text: 買東西前比價這件事，你會花多少心思？
  tags: [saving]
- id: qn-saving-031
  text: 免費的東西或贈品，對你有多大的吸引力？
  tags: [saving]
- id: qn-saving-032
  text: 省了一陣子之後，你會用什麼方式犒賞自己？
  tags: [saving]
- id: qn-saving-033
  text: 和朋友出去分攤費用時，你心裡是怎麼拿捏的？
  tags: [saving]
- id: qn-saving-034
  text: 小時候拿到零用錢，你是怎麼分配它的？
  tags: [saving]
- id: qn-saving-035
  text: 同樣一筆錢愈來愈不經花，這種感覺你有嗎？
  tags: [saving]
- id: qn-saving-036
  text: 把用不到的東西清掉，和存錢之間有什麼關聯嗎？
  tags: [saving]
- id: qn-saving-037
  text: 存錢的過程裡，有沒有什麼小小的儀式讓你想維持？
  tags: [saving]
- id: qn-saving-038
  text: 把錢花在體驗和花在物品上，你偏向哪一邊？
  tags: [saving]
- id: qn-saving-039
  text: 為了預防萬一而留的那筆錢，你心裡放多少才安心？
  tags: [saving]
- id: qn-saving-040
  text: 如果替十年後的自己存一筆錢，你想留給他什麼？
  tags: [saving]
