# 每日一問 · 外表與形象（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-looks-021
  text: 有沒有一個角度或光線，讓你覺得鏡頭裡的自己最好看？
  tags: [looks]
- id: qn-looks-022
  text: 別人第一眼看你時，你猜他們會先注意到哪裡？
  tags: [looks]
- id: qn-looks-023
  text: 你的穿衣風格，這幾年悄悄往哪個方向走了？
  tags: [looks]
- id: qn-looks-024
  text: 有沒有一種場合，你會特別想把自己打理得不太一樣？
  tags: [looks]
- id: qn-looks-025
  text: 你身上有沒有一道疤或一顆痣，藏著一段回憶？
  tags: [looks]
- id: qn-looks-026
  text: 香味對你的整體形象來說，扮演著什麼角色？
  tags: [looks]
- id: qn-looks-027
  text: 若把流行擺一邊，只憑自己的喜好，你會怎麼打扮？
  tags: [looks]
- id: qn-looks-028
  text: 鏡子裡的自己和照片裡的自己，哪個比較接近你心中的樣子？
  tags: [looks]
- id: qn-looks-029
  text: 有沒有一件收了很久、卻總捨不得丟的舊衣服？
  tags: [looks]
- id: qn-looks-030
  text: 你曾羨慕過別人的哪一種外型或氣質嗎？
  tags: [looks]
- id: qn-looks-031
  text: 化妝或造型，對你比較像一張面具，還是另一種真實？
  tags: [looks]
- id: qn-looks-032
  text: 你走路、說話的姿態，有沒有被人說像某個誰？
  tags: [looks]
- id: qn-looks-033
  text: 一天當中，哪個時刻的你看起來最放鬆自在？
  tags: [looks]
- id: qn-looks-034
  text: 有沒有一種打扮，你很想試、卻一直沒鼓起勇氣？
  tags: [looks]
- id: qn-looks-035
  text: 別人記住你的模樣，你希望是哪一個版本？
  tags: [looks]
- id: qn-looks-036
  text: 對於時間在自己身上留下的痕跡，像白髮或細紋，你怎麼看？
  tags: [looks]
- id: qn-looks-037
  text: 你的聲音或笑聲，算不算你形象的一部分？
  tags: [looks]
- id: qn-looks-038
  text: 打扮給自己看，和打扮給別人看，對你來說有差別嗎？
  tags: [looks]
- id: qn-looks-039
  text: 有沒有一張別人替你拍的照片，比自拍更像真正的你？
  tags: [looks]
- id: qn-looks-040
  text: 十年後的自己，你希望還維持著哪一種模樣或氣質？
  tags: [looks]
