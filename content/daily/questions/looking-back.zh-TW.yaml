# 每日一問 · 回顧。溫和的反思，不評分、不比較。
- id: qn-lookback-01
  text: 最近哪件小事，讓你覺得今天沒有白過？
  tags: [looking_back]
- id: qn-lookback-02
  text: 這禮拜有沒有一個瞬間，你希望能停久一點？
  tags: [looking_back]
- id: qn-lookback-03
  text: 上一次覺得「還好我有做」，是什麼時候？
  tags: [looking_back]
- id: qn-lookback-04
  text: 最近放下了什麼，現在回頭看覺得放得對？
  tags: [looking_back]
- id: qn-lookback-05
  text: 有沒有一件擱著很久的事，其實你已經不那麼在意了？
  tags: [looking_back]
- id: qn-lookback-06
  text: 過去一個月，你最想謝謝自己哪一個決定？
  tags: [looking_back]
- id: qn-lookback-07
  text: 最近一次真心笑出來，是因為什麼？
  tags: [looking_back]
- id: qn-lookback-08
  text: 這陣子你把時間花在哪，而你其實不後悔？
  tags: [looking_back]
- id: qn-lookback-09
  text: 有什麼是你以前很怕、現在覺得還好的？
  tags: [looking_back]
- id: qn-lookback-10
  text: 最近哪句別人說的話，你到現在還記得？
  tags: [looking_back]
- id: qn-lookback-11
  text: 上一次完成一件事的感覺，還記得嗎？
  tags: [looking_back]
- id: qn-lookback-12
  text: 這段日子裡，你悄悄變好的地方是什麼？
  tags: [looking_back]
- id: qn-lookback-13
  text: 回頭看，今年哪一天你會想再過一次？
  tags: [looking_back]
- id: qn-lookback-14
  text: 最近有沒有什麼，你以為做不到卻做到了？
  tags: [looking_back]
- id: qn-lookback-15
  text: 哪個習慣是你慶幸自己一直沒放掉的？
  tags: [looking_back]
- id: qn-lookback-16
  text: 上次好好休息，是什麼時候的事了？
  tags: [looking_back, rest]
