# 每日一問 · 好奇與探問。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-curious-001
  text: 有什麼問題，是你一直很想知道答案卻還沒問出口的？
  tags: [curiosity]
- id: qn-curious-002
  text: 如果可以親眼看見一個平常看不到的過程，你想看什麼？
  tags: [curiosity]
- id: qn-curious-003
  text: 最近有什麼東西的運作方式，讓你忍不住想弄懂？
  tags: [curiosity]
- id: qn-curious-004
  text: 假如動物能開口說話一天，你最想聽哪一種動物講話？
  tags: [curiosity]
- id: qn-curious-005
  text: 有沒有一個「為什麼」，從小到大都還沒被解答？
  tags: [curiosity]
- id: qn-curious-006
  text: 如果能穿牆看見別人家的日常，你最好奇哪一戶？
  tags: [curiosity]
- id: qn-curious-007
  text: 你曾經對什麼冷門的小知識，莫名著迷過？
  tags: [curiosity]
- id: qn-curious-008
  text: 假設可以問未來的自己一個問題，你會問什麼？
  tags: [curiosity]
- id: qn-curious-009
  text: 有什麼看似理所當然的事，你其實很想追問到底？
  tags: [curiosity]
- id: qn-curious-010
  text: 如果世界某條規則可以改一次，你會想試著改哪一條？
  tags: [curiosity]
- id: qn-curious-011
  text: 哪一種你沒去過的地方，最勾起你想一探究竟的念頭？
  tags: [curiosity]
- id: qn-curious-012
  text: 假如能偷聽歷史上某個房間裡的對話，你會選哪一場？
  tags: [curiosity]
- id: qn-curious-013
  text: 有什麼現象，你看了很多次卻始終覺得神奇？
  tags: [curiosity]
- id: qn-curious-014
  text: 如果可以在腦中植入一個問題的完整答案，你想放哪個？
  tags: [curiosity]
- id: qn-curious-015
  text: 你會對哪一種陌生的職業，忍不住想追問細節？
  tags: [curiosity]
- id: qn-curious-016
  text: 假設能變小走進某樣東西裡面，你想鑽進什麼？
  tags: [curiosity]
- id: qn-curious-017
  text: 有沒有一個假設性的「如果」，常在你腦中打轉？
  tags: [curiosity]
- id: qn-curious-018
  text: 如果能得到某個一直沒人回答你的疑問，你希望是哪個？
  tags: [curiosity]
- id: qn-curious-019
  text: 你最想親自實驗看看，卻還沒機會試的點子是什麼？
  tags: [curiosity]
- id: qn-curious-020
  text: 假如宇宙願意如實回答一句話，你會想問它什麼？
  tags: [curiosity]
