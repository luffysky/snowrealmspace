# 每日一問 · 通勤與路上。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-road-001
  text: 上一次在路上，你注意到什麼有趣的畫面？
  tags: [road]
- id: qn-road-002
  text: 如果從家門到目的地可以任選一種交通工具，你今天想搭什麼？
  tags: [road]
- id: qn-road-003
  text: 通勤時你的耳朵裡通常放著什麼聲音？
  tags: [road]
- id: qn-road-004
  text: 有哪一段路，是你走過無數次卻依然覺得舒服的？
  tags: [road]
- id: qn-road-005
  text: 車窗外的哪一種天氣，最能改變你當下的心情？
  tags: [road]
- id: qn-road-006
  text: 如果把每天的移動畫成一條線，它大概是什麼形狀？
  tags: [road]
- id: qn-road-007
  text: 你曾在某個站牌或路口，遇過什麼難忘的陌生人嗎？
  tags: [road]
- id: qn-road-008
  text: 對你來說，散步和趕路之間的差別是什麼？
  tags: [road]
- id: qn-road-009
  text: 哪一種城市的氣味，會立刻把你帶回某段記憶？
  tags: [road]
- id: qn-road-010
  text: 在移動的途中，你最常想起的是誰？
  tags: [road]
- id: qn-road-011
  text: 如果今天可以繞一條沒走過的路回家，你會期待看到什麼？
  tags: [road]
- id: qn-road-012
  text: 塞在車陣或人潮裡時，你都用什麼方式和自己相處？
  tags: [road]
- id: qn-road-013
  text: 夜晚的路和白天的路，在你眼中有什麼不一樣？
  tags: [road]
- id: qn-road-014
  text: 你心中有沒有一個地方，是光是想到路程就覺得值得的？
  tags: [road]
- id: qn-road-015
  text: 旅途中的哪一種聲響，會讓你覺得「啊，我正在移動」？
  tags: [road]
- id: qn-road-016
  text: 如果讓你為每天的通勤配一句旁白，那會是什麼？
  tags: [road]
- id: qn-road-017
  text: 你比較喜歡靠窗還是靠走道，背後有什麼原因嗎？
  tags: [road]
- id: qn-road-018
  text: 有什麼風景，是只有慢下來走路才看得見的？
  tags: [road]
- id: qn-road-019
  text: 路上遇到紅燈的那幾秒，你的腦袋通常飄到哪裡？
  tags: [road]
- id: qn-road-020
  text: 如果可以和路上的一個路人聊三分鐘，你會想問他什麼？
  tags: [road]
