# 每日一問 · 星座與性格（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-zodiac-021
  text: 讀到自己星座的缺點描述時，你心裡會冒出什麼反應？
  tags: [zodiac]
- id: qn-zodiac-022
  text: 假如可以體驗別的星座一整天，你想試試哪一個？
  tags: [zodiac]
- id: qn-zodiac-023
  text: 家人之間的星座差異，有沒有讓你觀察到什麼有趣的地方？
  tags: [zodiac]
- id: qn-zodiac-024
  text: 你會不會因為對方的星座，而對他多一分好奇？
  tags: [zodiac]
- id: qn-zodiac-025
  text: 在你眼中，性格裡最像自己、也最難改的是哪一塊？
  tags: [zodiac]
- id: qn-zodiac-026
  text: 別人替你貼上的星座標籤，哪一個你聽了會想笑？
  tags: [zodiac]
- id: qn-zodiac-027
  text: 累的時候，你會用什麼方式讓自己慢慢回到平常的狀態？
  tags: [zodiac]
- id: qn-zodiac-028
  text: 談到「本命」這種說法，你會聯想到什麼樣的畫面？
  tags: [zodiac]
- id: qn-zodiac-029
  text: 一群朋友聊起星座話題時，你多半是帶頭的還是旁聽的？
  tags: [zodiac]
- id: qn-zodiac-030
  text: 你覺得自己在陌生場合，和在熟人面前，會不會像兩個人？
  tags: [zodiac]
- id: qn-zodiac-031
  text: 若把童年的你和現在的你擺在一起，性格上多了什麼、少了什麼？
  tags: [zodiac]
- id: qn-zodiac-032
  text: 遇到選擇困難時，你腦中通常會浮現哪一種聲音？
  tags: [zodiac]
- id: qn-zodiac-033
  text: 有沒有一種性格特質，是你在別人身上看到才學會欣賞的？
  tags: [zodiac]
- id: qn-zodiac-034
  text: 你會怎麼形容自己生氣時的樣子？
  tags: [zodiac]
- id: qn-zodiac-035
  text: 對於「上升星座」這類進階說法，你抱著怎樣的態度？
  tags: [zodiac]
- id: qn-zodiac-036
  text: 假如要用一種天氣來比喻你的性格，你會挑哪一種？
  tags: [zodiac]
- id: qn-zodiac-037
  text: 別人第一眼對你的印象，和相處之後的印象，落差大嗎？
  tags: [zodiac]
- id: qn-zodiac-038
  text: 你在團體裡，比較常扮演什麼樣的角色？
  tags: [zodiac]
- id: qn-zodiac-039
  text: 面對變動與未知，你身上有哪一部分會特別跳出來反應？
  tags: [zodiac]
- id: qn-zodiac-040
  text: 如果性格也有季節，你覺得自己最像哪一季？
  tags: [zodiac]
