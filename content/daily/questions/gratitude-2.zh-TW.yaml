# 每日一問 · 感謝（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-thanks-021
  text: 有哪個季節的景色，讓你想放慢腳步多看幾眼？
  tags: [gratitude]
- id: qn-thanks-022
  text: 生活中哪樣工具或物品，默默替你省下不少力氣？
  tags: [gratitude]
- id: qn-thanks-023
  text: 曾經有位陌生人的善意，至今還留在你心裡嗎？
  tags: [gratitude]
- id: qn-thanks-024
  text: 你的哪一項能力，讓日子過得順手一些？
  tags: [gratitude]
- id: qn-thanks-025
  text: 最近讀到或聽到的哪句話，讓你想收藏起來？
  tags: [gratitude]
- id: qn-thanks-026
  text: 回想成長的地方，有哪個角落讓你懷念？
  tags: [gratitude]
- id: qn-thanks-027
  text: 你的哪個感官，替你接住了生活裡的美好？
  tags: [gratitude]
- id: qn-thanks-028
  text: 曾有哪段難走的路，後來回頭看反而慶幸走過？
  tags: [gratitude]
- id: qn-thanks-029
  text: 誰曾經相信過你，讓你到現在仍記得？
  tags: [gratitude]
- id: qn-thanks-030
  text: 一天當中，哪個時段最讓你覺得屬於自己？
  tags: [gratitude]
- id: qn-thanks-031
  text: 你手邊哪本書或哪首歌，陪你度過某段日子？
  tags: [gratitude]
- id: qn-thanks-032
  text: 能自由決定今天怎麼過，這件事你怎麼看？
  tags: [gratitude]
- id: qn-thanks-033
  text: 家人或朋友平安健康，對你來說意味著什麼？
  tags: [gratitude]
- id: qn-thanks-034
  text: 曾經有過哪次「幸好再試了一次」的經驗？
  tags: [gratitude]
- id: qn-thanks-035
  text: 誰在你學習的路上，指點過關鍵的一步？
  tags: [gratitude]
- id: qn-thanks-036
  text: 獨處的時光，帶給你哪些說不出口的好處？
  tags: [gratitude]
- id: qn-thanks-037
  text: 能好好休息的夜晚，對你有多重要？
  tags: [gratitude]
- id: qn-thanks-038
  text: 你會做的哪件小事，剛好幫上了某個人？
  tags: [gratitude]
- id: qn-thanks-039
  text: 最近看見的哪個景象，美得讓你停下腳步？
  tags: [gratitude]
- id: qn-thanks-040
  text: 曾經被誰體諒或包容，讓你鬆了一口氣？
  tags: [gratitude]
