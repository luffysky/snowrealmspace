# 每日一問 · 文字與表達。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-words-001
  text: 如果用一個詞形容今天，你會選哪個？
  tags: [words]
- id: qn-words-002
  text: 有沒有哪句話，你一直記到現在？
  tags: [words]
- id: qn-words-003
  text: 最近讓你會心一笑的一句話是什麼？
  tags: [words]
- id: qn-words-004
  text: 你習慣用文字還是說話，來把心裡的事說清楚？
  tags: [words]
- id: qn-words-005
  text: 有什麼感受，是你到現在還找不到詞來形容的？
  tags: [words]
- id: qn-words-006
  text: 你最喜歡自己名字裡的哪個字？
  tags: [words]
- id: qn-words-007
  text: 如果要對一年後的自己留一句話，你想寫什麼？
  tags: [words]
- id: qn-words-008
  text: 哪個字或詞，光是唸出來就讓你覺得舒服？
  tags: [words]
- id: qn-words-009
  text: 你有沒有一句捨不得刪掉、一直留在草稿裡的話？
  tags: [words]
- id: qn-words-010
  text: 最近一次認真寫給別人的訊息，是寫給誰的？
  tags: [words]
- id: qn-words-011
  text: 有什麼話你在心裡練習過很多次，卻還沒說出口？
  tags: [words]
- id: qn-words-012
  text: 你會怎麼向沒見過雪的人，形容雪的樣子？
  tags: [words]
- id: qn-words-013
  text: 哪個表情符號最能代替你此刻的心情？
  tags: [words]
- id: qn-words-014
  text: 你最近讀到哪段文字，讓你想停下來多看幾遍？
  tags: [words]
- id: qn-words-015
  text: 如果今天是一本書的其中一頁，你會給它下什麼標題？
  tags: [words]
- id: qn-words-016
  text: 你比較喜歡別人怎麼稱呼你？
  tags: [words]
- id: qn-words-017
  text: 有沒有一種語氣，是你只在特定的人面前才會用的？
  tags: [words]
- id: qn-words-018
  text: 你想對現在的自己說一句怎樣的悄悄話？
  tags: [words]
- id: qn-words-019
  text: 哪三個詞，最能拼湊出這個星期的你？
  tags: [words]
- id: qn-words-020
  text: 如果情緒能被翻譯成顏色，你今天是什麼顏色？
  tags: [words]
