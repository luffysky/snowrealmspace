# 每日一問 · 社群與貼文。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-social-001
  text: 你最近一則貼文，發的是什麼？
  tags: [socialmedia]
- id: qn-social-002
  text: 有沒有一種內容，你只想看、卻從不會自己發？
  tags: [socialmedia]
- id: qn-social-003
  text: 當按讚數比預期少很多，你心裡會冒出什麼念頭？
  tags: [socialmedia]
- id: qn-social-004
  text: 你追蹤的帳號裡，哪一個最常讓你停下滑動的手指？
  tags: [socialmedia]
- id: qn-social-005
  text: 發文之前，你通常會反覆修改哪個部分？
  tags: [socialmedia]
- id: qn-social-006
  text: 對你來說，限時動態和一般貼文各自適合放什麼？
  tags: [socialmedia]
- id: qn-social-007
  text: 曾經有哪一則陌生人的留言，讓你記到現在？
  tags: [socialmedia]
- id: qn-social-008
  text: 如果社群只能保留一個平台，你會留下哪一個？
  tags: [socialmedia]
- id: qn-social-009
  text: 你會在什麼情況下，選擇默默取消追蹤一個帳號？
  tags: [socialmedia]
- id: qn-social-010
  text: 別人在社群上呈現的你，和你認識的自己差在哪裡？
  tags: [socialmedia]
- id: qn-social-011
  text: 滑到深夜停不下來時，你在追著什麼？
  tags: [socialmedia]
- id: qn-social-012
  text: 哪一類貼文，你看到就會忍不住想分享出去？
  tags: [socialmedia]
- id: qn-social-013
  text: 你希望別人從你的個人頁面，讀到什麼樣的你？
  tags: [socialmedia]
- id: qn-social-014
  text: 面對留言區的爭吵，你多半會怎麼反應？
  tags: [socialmedia]
- id: qn-social-015
  text: 有沒有一則貼文，你發了之後又悄悄刪掉？
  tags: [socialmedia]
- id: qn-social-016
  text: 追蹤者的數字，對你而言意味著什麼？
  tags: [socialmedia]
- id: qn-social-017
  text: 你按下分享鍵前，會考慮誰可能會看到？
  tags: [socialmedia]
- id: qn-social-018
  text: 如果幫自己的社群帳號取一個主題，會是什麼？
  tags: [socialmedia]
- id: qn-social-019
  text: 哪一個帳號的貼文風格，你私底下很想模仿？
  tags: [socialmedia]
- id: qn-social-020
  text: 離開社群一段時間後，你最先想念的是哪個部分？
  tags: [socialmedia]
