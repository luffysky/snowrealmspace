# 每日一問 · 口音與說話腔調（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-dialect-021
  text: 講到激動的時候，你的腔調會不會偷偷跑出來？
  tags: [dialect]
- id: qn-dialect-022
  text: 哪個字詞，你和身邊的人念法就是不一樣？
  tags: [dialect]
- id: qn-dialect-023
  text: 對你而言，一個人的口頭禪透露了什麼？
  tags: [dialect]
- id: qn-dialect-024
  text: 假如要教外地朋友一句你們的方言，你會挑哪一句？
  tags: [dialect]
- id: qn-dialect-025
  text: 打電話和面對面說話時，你的語氣會有差別嗎？
  tags: [dialect]
- id: qn-dialect-026
  text: 有沒有一種腔調，聽了會讓你忍不住想笑？
  tags: [dialect]
- id: qn-dialect-027
  text: 你覺得罵人的話，用方言講起來是不是特別有味道？
  tags: [dialect]
- id: qn-dialect-028
  text: 在什麼場合，你會刻意收起自己平常的說話方式？
  tags: [dialect]
- id: qn-dialect-029
  text: 長輩的某句口頭語，有沒有一直留在你嘴邊？
  tags: [dialect]
- id: qn-dialect-030
  text: 你比較喜歡說話慢條斯理，還是連珠炮般地講？
  tags: [dialect]
- id: qn-dialect-031
  text: 哪一個詞，換成方言講就是比國語傳神？
  tags: [dialect]
- id: qn-dialect-032
  text: 聽到陌生腔調時，你會好奇對方是從哪裡來的嗎？
  tags: [dialect]
- id: qn-dialect-033
  text: 你有沒有為了融入某個地方，而改過自己的說話習慣？
  tags: [dialect]
- id: qn-dialect-034
  text: 撒嬌或哄人的時候，你的聲音會變成什麼樣子？
  tags: [dialect]
- id: qn-dialect-035
  text: 對你來說，說話大聲和說話溫柔各代表了什麼？
  tags: [dialect]
- id: qn-dialect-036
  text: 有哪句方言，是你懂意思卻怎麼也說不出口的？
  tags: [dialect]
- id: qn-dialect-037
  text: 你會不會不自覺地被身邊人的說話腔調感染？
  tags: [dialect]
- id: qn-dialect-038
  text: 唱歌時的咬字，和平常講話的你像不像？
  tags: [dialect]
- id: qn-dialect-039
  text: 如果口音是一件衣服，你的那件是什麼顏色？
  tags: [dialect]
- id: qn-dialect-040
  text: 多年以後，你希望自己的孩子記得你怎麼講話？
  tags: [dialect]
