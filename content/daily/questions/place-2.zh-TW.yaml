# 每日一問 · 地方與城市（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-place-021
  text: 你居住的地方，一天當中哪個時段最有它的味道？
  tags: [place]
- id: qn-place-022
  text: 如果要用一種食物代表某座城市，你會想到哪一味？
  tags: [place]
- id: qn-place-023
  text: 你去過最遙遠的地方，帶回了什麼樣的畫面？
  tags: [place]
- id: qn-place-024
  text: 一座城市的夜晚和白天，在你眼中是兩個世界嗎？
  tags: [place]
- id: qn-place-025
  text: 有沒有一條路，你走過無數次卻從沒膩過？
  tags: [place]
- id: qn-place-026
  text: 你會被什麼樣的建築或街景多看幾眼？
  tags: [place]
- id: qn-place-027
  text: 若要在一個地方待上整整一天，你想怎麼度過？
  tags: [place]
- id: qn-place-028
  text: 你心中「觀光客」和「生活者」看到的城市，差在哪裡？
  tags: [place]
- id: qn-place-029
  text: 曾有哪個地方，實際去了才發現和想像完全不同？
  tags: [place]
- id: qn-place-030
  text: 你偏好在人潮裡穿梭，還是往人少的角落走？
  tags: [place]
- id: qn-place-031
  text: 一座城市的公園或綠地，對你意味著什麼？
  tags: [place]
- id: qn-place-032
  text: 如果替現在住的地方取一個外號，你會怎麼叫它？
  tags: [place]
- id: qn-place-033
  text: 你曾在哪個異鄉的瞬間，忽然覺得像回到了熟悉的地方？
  tags: [place]
- id: qn-place-034
  text: 對你來說，一個地方的四季各自穿著什麼樣的衣裳？
  tags: [place]
- id: qn-place-035
  text: 有沒有一家店或一個攤子，是你判斷一區好壞的依據？
  tags: [place]
- id: qn-place-036
  text: 你比較被古老的地方吸引，還是嶄新的地方？
  tags: [place]
- id: qn-place-037
  text: 若能在世界任何一處看一場日出，你想站在哪裡？
  tags: [place]
- id: qn-place-038
  text: 一個地方的方言或口音，會替它添上什麼樣的色彩？
  tags: [place]
- id: qn-place-039
  text: 你曾經路過卻沒停下、事後很想再回去的是哪裡？
  tags: [place]
- id: qn-place-040
  text: 如果要在一張明信片上寫下你的城市，你會挑哪個瞬間？
  tags: [place]
