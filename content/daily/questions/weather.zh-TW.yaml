# 每日一問 · 天氣與季節感受。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-weather-001
  text: 今天的天氣，讓你想做什麼？
  tags: [weather]
- id: qn-weather-002
  text: 你最喜歡哪一種天氣的聲音？
  tags: [weather]
- id: qn-weather-003
  text: 下雨的午後，你通常會待在哪裡？
  tags: [weather]
- id: qn-weather-004
  text: 一年四季裡，哪個季節最像你？
  tags: [weather]
- id: qn-weather-005
  text: 陽光灑進窗戶時，你會注意到什麼？
  tags: [weather]
- id: qn-weather-006
  text: 有沒有一種氣味，會讓你想起某個季節？
  tags: [weather]
- id: qn-weather-007
  text: 起風的日子，你的心情通常是怎樣的？
  tags: [weather]
- id: qn-weather-008
  text: 冬天的早晨，你最想握著一杯什麼？
  tags: [weather]
- id: qn-weather-009
  text: 如果可以許願，你想讓明天是什麼樣的天空？
  tags: [weather]
- id: qn-weather-010
  text: 夏夜的涼風吹來時，你會想起誰？
  tags: [weather]
- id: qn-weather-011
  text: 你記得最深的一場雨，是在哪裡遇上的？
  tags: [weather]
- id: qn-weather-012
  text: 換季的時候，你身邊會有什麼小小的改變？
  tags: [weather]
- id: qn-weather-013
  text: 抬頭看見雲的形狀，你會聯想到什麼？
  tags: [weather]
- id: qn-weather-014
  text: 哪一種天氣，最適合和喜歡的人一起度過？
  tags: [weather]
- id: qn-weather-015
  text: 清晨的空氣摸起來，給你什麼感覺？
  tags: [weather]
- id: qn-weather-016
  text: 秋天的落葉，讓你想留住什麼？
  tags: [weather]
- id: qn-weather-017
  text: 陰天時，你會怎麼陪自己度過？
  tags: [weather]
- id: qn-weather-018
  text: 如果季節有顏色，此刻的你是哪一種？
  tags: [weather]
- id: qn-weather-019
  text: 雪或霜這樣的畫面，在你心裡是什麼樣子？
  tags: [weather]
- id: qn-weather-020
  text: 你會為了什麼樣的天氣，特地走到戶外？
  tags: [weather]
