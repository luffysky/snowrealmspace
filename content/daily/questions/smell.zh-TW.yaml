# 每日一問 · 氣味與嗅覺。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-smell-001
  text: 哪一種氣味，會立刻讓你想起某個地方？
  tags: [smell]
- id: qn-smell-002
  text: 雨後的空氣聞起來像什麼？
  tags: [smell]
- id: qn-smell-003
  text: 如果要為現在的季節挑一種代表氣味，你會選哪一種？
  tags: [smell]
- id: qn-smell-004
  text: 童年的家裡，最常飄著什麼味道？
  tags: [smell]
- id: qn-smell-005
  text: 有沒有一種氣味，別人不喜歡但你偏偏很著迷？
  tags: [smell]
- id: qn-smell-006
  text: 走進廚房時，什麼香氣最能讓你放鬆下來？
  tags: [smell]
- id: qn-smell-007
  text: 你身邊某個人，會讓你聯想到什麼氣味？
  tags: [smell]
- id: qn-smell-008
  text: 打開衣櫃的那一刻，你聞到的是什麼？
  tags: [smell]
- id: qn-smell-009
  text: 哪一種花草的香氣，最貼近你此刻的心情？
  tags: [smell]
- id: qn-smell-010
  text: 旅行途中，哪一個地方的味道最讓你難忘？
  tags: [smell]
- id: qn-smell-011
  text: 早晨醒來後，你最想聞到的第一個味道是什麼？
  tags: [smell]
- id: qn-smell-012
  text: 書本、紙張或墨水的氣味，對你來說意味著什麼？
  tags: [smell]
- id: qn-smell-013
  text: 有沒有某種氣味，會不知不覺讓你想哭或想笑？
  tags: [smell]
- id: qn-smell-014
  text: 海邊、森林、山上——哪裡的空氣最讓你想再回去一次？
  tags: [smell]
- id: qn-smell-015
  text: 你會用什麼氣味來形容「安心」這兩個字？
  tags: [smell]
- id: qn-smell-016
  text: 煮咖啡或泡茶時飄出的香氣，帶給你什麼感覺？
  tags: [smell]
- id: qn-smell-017
  text: 換季時空氣裡的變化，你是靠鼻子先察覺的嗎？
  tags: [smell]
- id: qn-smell-018
  text: 若把一段美好回憶封進香水瓶，裡面會是什麼味道？
  tags: [smell]
- id: qn-smell-019
  text: 剛洗好曬乾的衣物那股味道，讓你想到誰？
  tags: [smell]
- id: qn-smell-020
  text: 這一整天裡，有哪個瞬間的氣味被你悄悄記了下來？
  tags: [smell]
