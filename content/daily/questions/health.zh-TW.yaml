# 每日一問 · 身體與健康。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-health-001
  text: 昨晚的睡眠，讓你今天醒來時身體是什麼狀態？
  tags: [health]
- id: qn-health-002
  text: 今天你的身體最想要的，是多動一點還是多歇一點？
  tags: [health]
- id: qn-health-003
  text: 最近一餐吃下去後，你的身體有什麼感覺？
  tags: [health]
- id: qn-health-004
  text: 如果身體會說話，它現在最想跟你講哪件事？
  tags: [health]
- id: qn-health-005
  text: 今天你喝的水，大概是多還是少？
  tags: [health]
- id: qn-health-006
  text: 這幾天有沒有哪個部位在悄悄提醒你注意它？
  tags: [health]
- id: qn-health-007
  text: 你最近一次流汗或喘氣，是因為做了什麼？
  tags: [health]
- id: qn-health-008
  text: 早上剛起床的那幾分鐘，你的身體通常是輕盈還是沉重的？
  tags: [health]
- id: qn-health-009
  text: 今天有什麼食物讓你吃得特別滿足？
  tags: [health]
- id: qn-health-010
  text: 這一週你的作息，大致是什麼樣的節奏？
  tags: [health]
- id: qn-health-011
  text: 當你久坐之後站起來，身體給了你什麼訊號？
  tags: [health]
- id: qn-health-012
  text: 最近讓你睡得比較安穩的一晚，前面發生了什麼？
  tags: [health]
- id: qn-health-013
  text: 你的眼睛在一天結束時，通常是什麼感覺？
  tags: [health]
- id: qn-health-014
  text: 如果要為身體挑一種讓它舒服的活動，你會想到什麼？
  tags: [health]
- id: qn-health-015
  text: 今天的你，餓和飽之間比較靠近哪一端？
  tags: [health]
- id: qn-health-016
  text: 最近哪一種姿勢，讓你的身體覺得最放鬆？
  tags: [health]
- id: qn-health-017
  text: 你注意過自己在什麼時候呼吸會變得比較深嗎？
  tags: [health]
- id: qn-health-018
  text: 這陣子你的胃口，跟平常比起來有什麼不同？
  tags: [health]
- id: qn-health-019
  text: 走一段路之後，你的雙腿會告訴你什麼？
  tags: [health]
- id: qn-health-020
  text: 如果今天能給身體一份小小的照顧，你想給它什麼？
  tags: [health]
