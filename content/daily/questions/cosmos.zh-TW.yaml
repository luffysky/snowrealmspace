# 每日一問 · 星空與遼闊。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-cosmos-001
  text: 上一次抬頭好好看星星，是什麼時候的事了？
  tags: [cosmos]
- id: qn-cosmos-002
  text: 如果能到宇宙的任何一個角落待一晚，你想去哪裡？
  tags: [cosmos]
- id: qn-cosmos-003
  text: 想到自己只是浩瀚裡的一小點，你會覺得渺小還是自在？
  tags: [cosmos]
- id: qn-cosmos-004
  text: 夜空對你來說，比較像一片海，還是一張地圖？
  tags: [cosmos]
- id: qn-cosmos-005
  text: 你會為哪一顆星，或哪一片天，取一個屬於自己的名字？
  tags: [cosmos]
- id: qn-cosmos-006
  text: 如果有一顆星星專屬於你，你希望它在天邊還是身旁？
  tags: [cosmos]
- id: qn-cosmos-007
  text: 站在很開闊的地方時，你腦海裡通常會浮現什麼？
  tags: [cosmos]
- id: qn-cosmos-008
  text: 光走了好久才抵達你眼裡，這件事讓你想到什麼？
  tags: [cosmos]
- id: qn-cosmos-009
  text: 你覺得月亮比較像陪伴，還是像遠遠的旁觀者？
  tags: [cosmos]
- id: qn-cosmos-010
  text: 如果能寄一封信給宇宙，你會在信裡寫下什麼？
  tags: [cosmos]
- id: qn-cosmos-011
  text: 面對一望無際的地平線，你會想放下什麼、又想帶走什麼？
  tags: [cosmos]
- id: qn-cosmos-012
  text: 你想像中的銀河，是安靜的，還是熱鬧的？
  tags: [cosmos]
- id: qn-cosmos-013
  text: 有沒有一片風景，讓你第一次感覺到世界好大？
  tags: [cosmos]
- id: qn-cosmos-014
  text: 如果流星劃過，你會許願，還是只是靜靜看著它？
  tags: [cosmos]
- id: qn-cosmos-015
  text: 夜深人靜仰望天空時，你最常有的心情是什麼？
  tags: [cosmos]
- id: qn-cosmos-016
  text: 你覺得星星之間的那片黑，是空的，還是藏著什麼？
  tags: [cosmos]
- id: qn-cosmos-017
  text: 如果可以和某個人一起看一次極光，你會想找誰？
  tags: [cosmos]
- id: qn-cosmos-018
  text: 遼闊的天地讓你變得很小，這種感覺你喜歡嗎？
  tags: [cosmos]
- id: qn-cosmos-019
  text: 想像自己漂浮在群星之間，你最想聽見什麼聲音？
  tags: [cosmos]
- id: qn-cosmos-020
  text: 如果夜空會回應你，你最想問它一個什麼問題？
  tags: [cosmos]
