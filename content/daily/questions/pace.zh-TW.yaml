# 每日一問 · 節奏與步調。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-pace-001
  text: 今天的你，是用什麼樣的步調在過的？
  tags: [pace]
- id: qn-pace-002
  text: 一天當中，哪個時段的節奏最讓你覺得自在？
  tags: [pace]
- id: qn-pace-003
  text: 你喜歡把事情一件件慢慢做，還是一口氣做完？
  tags: [pace]
- id: qn-pace-004
  text: 上一次覺得時間過得剛剛好，是在做什麼的時候？
  tags: [pace]
- id: qn-pace-005
  text: 如果可以調整生活的速度，你想快一點還是慢一點？
  tags: [pace]
- id: qn-pace-006
  text: 走路時，你習慣快步向前，還是隨意漫步？
  tags: [pace]
- id: qn-pace-007
  text: 什麼樣的活動，會讓你自然而然慢下來？
  tags: [pace]
- id: qn-pace-008
  text: 假日的節奏和平日相比，對你來說差在哪裡？
  tags: [pace]
- id: qn-pace-009
  text: 你身邊有沒有一個人，步調總跟你很合拍？
  tags: [pace]
- id: qn-pace-010
  text: 在忙碌之中，你都靠什麼替自己找回從容？
  tags: [pace]
- id: qn-pace-011
  text: 一段音樂、一頓飯、一場對話——什麼的節奏最貼近你？
  tags: [pace]
- id: qn-pace-012
  text: 早晨你偏好從容鋪陳，還是俐落地展開一天？
  tags: [pace]
- id: qn-pace-013
  text: 有沒有一件事，是你刻意留給自己慢慢享受的？
  tags: [pace]
- id: qn-pace-014
  text: 季節更替時，你的生活步調會跟著變化嗎？
  tags: [pace]
- id: qn-pace-015
  text: 當周圍的人都很匆忙時，你會怎麼安放自己？
  tags: [pace]
- id: qn-pace-016
  text: 傍晚到夜裡，你的節奏是漸漸放緩的嗎？
  tags: [pace]
- id: qn-pace-017
  text: 對你而言，理想的一天會有什麼樣的起伏與韻律？
  tags: [pace]
- id: qn-pace-018
  text: 哪一種等待，你反而覺得挺享受的？
  tags: [pace]
- id: qn-pace-019
  text: 你是靠什麼判斷自己該歇一歇、換個步調了？
  tags: [pace]
- id: qn-pace-020
  text: 回顧這一天，它的節奏和你心裡想要的接近嗎？
  tags: [pace]
