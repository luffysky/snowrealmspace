# 每日一問 · 無聊時光。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-bored-001
  text: 無聊的時候，你最常做的第一件事是什麼？
  tags: [bored]
- id: qn-bored-002
  text: 有沒有一種發呆，是你私心蠻享受的？
  tags: [bored]
- id: qn-bored-003
  text: 空白的一個下午，你會讓它怎麼流過去？
  tags: [bored]
- id: qn-bored-004
  text: 無聊對你來說是需要被填滿，還是可以就這樣放著？
  tags: [bored]
- id: qn-bored-005
  text: 手機以外，你還有什麼打發時間的方式？
  tags: [bored]
- id: qn-bored-006
  text: 最近一次覺得無聊，你後來做了什麼？
  tags: [bored]
- id: qn-bored-007
  text: 有沒有一件小事，越無聊做起來越有味道？
  tags: [bored]
- id: qn-bored-008
  text: 你會在無聊時想起哪些平常不會想的事？
  tags: [bored]
- id: qn-bored-009
  text: 排隊或等車的空檔，你的心思通常飄到哪裡？
  tags: [bored]
- id: qn-bored-010
  text: 什麼樣的無聊，反而讓你覺得放鬆？
  tags: [bored]
- id: qn-bored-011
  text: 你有沒有一個專門在放空時會去的地方？
  tags: [bored]
- id: qn-bored-012
  text: 如果無聊也能收藏，你想留下哪一種？
  tags: [bored]
- id: qn-bored-013
  text: 小時候無聊時，你都在玩些什麼？
  tags: [bored]
- id: qn-bored-014
  text: 一個人閒著的時候，你和自己相處得好嗎？
  tags: [bored]
- id: qn-bored-015
  text: 你會刻意留一點無聊給自己嗎？
  tags: [bored]
- id: qn-bored-016
  text: 無所事事的日子，對你來說是奢侈還是難熬？
  tags: [bored]
- id: qn-bored-017
  text: 有沒有哪個念頭，總在你發呆時悄悄冒出來？
  tags: [bored]
- id: qn-bored-018
  text: 你打發時間的方式，這幾年有什麼變化？
  tags: [bored]
- id: qn-bored-019
  text: 窗外如果沒什麼在發生，你會看多久？
  tags: [bored]
- id: qn-bored-020
  text: 下一段空下來的時間，你想拿它來做什麼？
  tags: [bored]
