# 每日一問 · 愛與親密（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-love-021
  text: 你比較容易透過言語，還是行動，感覺到被愛？
  tags: [love]
- id: qn-love-022
  text: 在親近的關係裡，你怎麼面對彼此不同的意見？
  tags: [love]
- id: qn-love-023
  text: 和重要的人分隔兩地時，你靠什麼維繫那份連結？
  tags: [love]
- id: qn-love-024
  text: 一段關係裡的哪個小小儀式，是你們專屬的？
  tags: [love]
- id: qn-love-025
  text: 對你來說，願意向某個人求助，代表著什麼？
  tags: [love]
- id: qn-love-026
  text: 你和所愛的人道別時，習慣說些或做些什麼？
  tags: [love]
- id: qn-love-027
  text: 有沒有一個承諾，是你想好好守著的？
  tags: [love]
- id: qn-love-028
  text: 你覺得兩個人要怎麼一起，慢慢變成更好的樣子？
  tags: [love]
- id: qn-love-029
  text: 在關係裡，你會怎麼替對方留一點空間？
  tags: [love]
- id: qn-love-030
  text: 一段已經結束的關係，教會了你什麼？
  tags: [love]
- id: qn-love-031
  text: 是什麼讓你願意，在某個人面前卸下防備？
  tags: [love]
- id: qn-love-032
  text: 你第一次真切感覺到愛，是在什麼情境裡？
  tags: [love]
- id: qn-love-033
  text: 不靠言語的時候，你怎麼傳達對一個人的在乎？
  tags: [love]
- id: qn-love-034
  text: 在親密的人面前，你比較能自在地表達哪種心情？
  tags: [love]
- id: qn-love-035
  text: 你欣賞某個人愛你的方式裡的哪一點？
  tags: [love]
- id: qn-love-036
  text: 傾聽一個重要的人時，你會特別留意什麼？
  tags: [love]
- id: qn-love-037
  text: 對你而言，被一個人真正看懂，是什麼感覺？
  tags: [love]
- id: qn-love-038
  text: 有沒有一件事，是你和所愛之人共同期待著的？
  tags: [love]
- id: qn-love-039
  text: 若要為一段關係注入新的溫度，你會想試什麼？
  tags: [love]
- id: qn-love-040
  text: 在愛裡，你正在學習的是哪一件事？
  tags: [love]
