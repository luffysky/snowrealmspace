# 每日一問 · 自然與四季。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-nature-001
  text: 最近哪個自然的畫面，讓你忍不住停下腳步？
  tags: [nature]
- id: qn-nature-002
  text: 對你來說，一年四季裡哪一季最像你此刻的心情？
  tags: [nature]
- id: qn-nature-003
  text: 如果要用一種天氣形容你今天，你會選什麼？
  tags: [nature]
- id: qn-nature-004
  text: 你上一次赤腳踩在草地或沙灘上，是什麼時候？
  tags: [nature]
- id: qn-nature-005
  text: 清晨的空氣和傍晚的空氣，你比較喜歡哪一種？
  tags: [nature]
- id: qn-nature-006
  text: 有沒有一種花或一棵樹，會讓你想起某個特定的人？
  tags: [nature]
- id: qn-nature-007
  text: 下雨的時候，你通常會做些什麼？
  tags: [nature]
- id: qn-nature-008
  text: 你記憶中最美的一次日落，發生在哪裡？
  tags: [nature]
- id: qn-nature-009
  text: 山和海，如果只能靠近其中一個生活，你會選哪個？
  tags: [nature]
- id: qn-nature-010
  text: 什麼樣的聲音，會讓你覺得自己正身處大自然裡？
  tags: [nature]
- id: qn-nature-011
  text: 你有觀察過月亮這幾天的變化嗎？
  tags: [nature]
- id: qn-nature-012
  text: 換季的時候，你身體最先感覺到的是什麼？
  tags: [nature]
- id: qn-nature-013
  text: 如果能在戶外過一整天，你想怎麼安排？
  tags: [nature]
- id: qn-nature-014
  text: 哪一種季節的氣味，最能把你帶回童年？
  tags: [nature]
- id: qn-nature-015
  text: 你曾經被哪種動物的樣子或行為打動過嗎？
  tags: [nature]
- id: qn-nature-016
  text: 星空對你而言，是遙遠的還是親近的？
  tags: [nature]
- id: qn-nature-017
  text: 在城市裡，你都去哪裡尋找一點綠意？
  tags: [nature]
- id: qn-nature-018
  text: 你比較享受陽光灑下來，還是被雲層遮住的天空？
  tags: [nature]
- id: qn-nature-019
  text: 如果要種一樣植物陪伴你，你會挑什麼？
  tags: [nature]
- id: qn-nature-020
  text: 面對一片遼闊的風景時，你心裡通常浮現什麼念頭？
  tags: [nature]
