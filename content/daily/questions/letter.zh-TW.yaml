# 每日一問 · 手寫信與卡片。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-letter-001
  text: 你上一次手寫東西給別人，是什麼時候？
  tags: [letter]
- id: qn-letter-002
  text: 如果現在要提筆寫一封信，你最想寄給誰？
  tags: [letter]
- id: qn-letter-003
  text: 有沒有一張卡片，你一直捨不得丟？
  tags: [letter]
- id: qn-letter-004
  text: 收到手寫的字和收到打字的訊息，對你來說感覺差在哪裡？
  tags: [letter]
- id: qn-letter-005
  text: 你會怎麼形容自己的字跡？
  tags: [letter]
- id: qn-letter-006
  text: 挑一張生日卡的時候，你通常在意的是圖案還是裡面能寫的空間？
  tags: [letter]
- id: qn-letter-007
  text: 有哪句話，你只敢寫下來、卻說不出口？
  tags: [letter]
- id: qn-letter-008
  text: 走進文具店看到一整排信紙，你會被哪一種吸引？
  tags: [letter]
- id: qn-letter-009
  text: 寫卡片給人時，你會先在腦中打稿，還是想到哪寫到哪？
  tags: [letter]
- id: qn-letter-010
  text: 貼上郵票、把信投進郵筒的那一刻，是什麼心情？
  tags: [letter]
- id: qn-letter-011
  text: 假如可以寄一封信給十年前的自己，開頭你會怎麼寫？
  tags: [letter]
- id: qn-letter-012
  text: 你保留過誰寫給你的字條嗎，那上面寫了什麼？
  tags: [letter]
- id: qn-letter-013
  text: 一封信要怎麼結尾，你才覺得剛剛好？
  tags: [letter]
- id: qn-letter-014
  text: 如果不用文字，只能畫一張卡片給重要的人，你會畫什麼？
  tags: [letter]
- id: qn-letter-015
  text: 手寫時寫錯字，你是塗掉繼續，還是換一張重來？
  tags: [letter]
- id: qn-letter-016
  text: 有沒有一封信，你寫好了卻始終沒寄出去？
  tags: [letter]
- id: qn-letter-017
  text: 對你而言，一張卡片裡最珍貴的是署名，還是內文？
  tags: [letter]
- id: qn-letter-018
  text: 若要在明信片背面只留一行字，你會留下哪一句？
  tags: [letter]
- id: qn-letter-019
  text: 拆開一封信封的那個瞬間，你期待的是什麼？
  tags: [letter]
- id: qn-letter-020
  text: 這輩子你最想收到誰親手寫的一封信？
  tags: [letter]
