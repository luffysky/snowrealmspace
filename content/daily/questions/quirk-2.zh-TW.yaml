# 每日一問 · 習性與怪癖（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-quirk-021
  text: 手機裡的 app，你會照什麼邏輯排列？
  tags: [quirk]
- id: qn-quirk-022
  text: 你對數字有沒有偏好，比如偏愛單數或雙數？
  tags: [quirk]
- id: qn-quirk-023
  text: 訊息送出前，你會反覆讀過幾遍才按下去？
  tags: [quirk]
- id: qn-quirk-024
  text: 拿杯子的時候，你的手指習慣怎麼擺？
  tags: [quirk]
- id: qn-quirk-025
  text: 上下樓梯時，你會不會在心裡默數階數？
  tags: [quirk]
- id: qn-quirk-026
  text: 摺衣服，你有沒有一套非得這樣摺的方式？
  tags: [quirk]
- id: qn-quirk-027
  text: 拿到新書或新本子，你會不會先湊近聞一下？
  tags: [quirk]
- id: qn-quirk-028
  text: 出門前，你會回頭確認門鎖幾次？
  tags: [quirk]
- id: qn-quirk-029
  text: 獨自在家時，你會對著植物或家具說話嗎？
  tags: [quirk]
- id: qn-quirk-030
  text: 一盤菜裡最喜歡的那一口，你習慣先吃還是留到最後？
  tags: [quirk]
- id: qn-quirk-031
  text: 正式開始做事之前，你會有什麼固定的暖身儀式？
  tags: [quirk]
- id: qn-quirk-032
  text: 貼紙或標籤黏在東西上，你會不會忍不住想撕乾淨？
  tags: [quirk]
- id: qn-quirk-033
  text: 桌上的東西，你會不會非得排成某種對稱才安心？
  tags: [quirk]
- id: qn-quirk-034
  text: 有沒有一個杯子或座位，是你每次都會挑的？
  tags: [quirk]
- id: qn-quirk-035
  text: 講電話時，你的手會不自覺做些什麼？
  tags: [quirk]
- id: qn-quirk-036
  text: 看書或追劇，你會不會忍不住先偷看結局？
  tags: [quirk]
- id: qn-quirk-037
  text: 回家的路有好幾條，你為什麼總走同一條？
  tags: [quirk]
- id: qn-quirk-038
  text: 手腳冰冷時，你有什麼自己的一套取暖招式？
  tags: [quirk]
- id: qn-quirk-039
  text: 一個人做事時，你會不會邊做邊碎念旁白？
  tags: [quirk]
- id: qn-quirk-040
  text: 有沒有哪個小迷信，你到現在還默默遵守著？
  tags: [quirk]
