# 每日一問 · 電視劇與追劇（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-tvshow-021
  text: 有沒有一部劇的片頭曲，光是聽到前奏你就會跟著哼？
  tags: [tvshow]
- id: qn-tvshow-022
  text: 哪一個反派角色，反而讓你偷偷替他心疼過？
  tags: [tvshow]
- id: qn-tvshow-023
  text: 你會為了一部劇特地守著首播，還是寧願等它全部上架？
  tags: [tvshow]
- id: qn-tvshow-024
  text: 曾經有哪一集，讓你按了暫停，緩一下才敢繼續看嗎？
  tags: [tvshow]
- id: qn-tvshow-025
  text: 對你來說，一部劇的節奏太慢和太趕，哪一種更難忍受？
  tags: [tvshow]
- id: qn-tvshow-026
  text: 有沒有哪部劇，你嘴上嫌它，卻還是一集不落地看完了？
  tags: [tvshow]
- id: qn-tvshow-027
  text: 童年時陪你長大的那部劇，如今再看又是什麼滋味？
  tags: [tvshow]
- id: qn-tvshow-028
  text: 若要把一部劇送進某個人手裡，你會挑哪部、送給誰？
  tags: [tvshow]
- id: qn-tvshow-029
  text: 哪一段劇情的轉折，曾讓你完全沒料到？
  tags: [tvshow]
- id: qn-tvshow-030
  text: 你偏愛結局收得乾淨俐落，還是留一點餘韻和想像？
  tags: [tvshow]
- id: qn-tvshow-031
  text: 有沒有哪部劇裡的一頓飯、一道菜，看著看著就餓了？
  tags: [tvshow]
- id: qn-tvshow-032
  text: 若能走進某部劇當個配角一天，你想選哪部、演什麼？
  tags: [tvshow]
- id: qn-tvshow-033
  text: 一部劇如果原著是小說，你偏好先看書還是先看劇？
  tags: [tvshow]
- id: qn-tvshow-034
  text: 哪一對劇中人物之間的關係，最觸動到你？
  tags: [tvshow]
- id: qn-tvshow-035
  text: 有沒有一部劇，是某段特別的日子裡陪著你的？
  tags: [tvshow]
- id: qn-tvshow-036
  text: 遇到爛尾的劇，你會選擇一笑置之，還是耿耿於懷？
  tags: [tvshow]
- id: qn-tvshow-037
  text: 那些看似不起眼的小配角，有沒有哪個讓你格外喜歡？
  tags: [tvshow]
- id: qn-tvshow-038
  text: 劇裡出現過的哪個場景或城市，讓你動了想親自去看看的念頭？
  tags: [tvshow]
- id: qn-tvshow-039
  text: 一部劇播完多年後，你偶爾還會想起它的哪個畫面？
  tags: [tvshow]
- id: qn-tvshow-040
  text: 如果用一部劇來形容你這一年，你會選哪一部？
  tags: [tvshow]
