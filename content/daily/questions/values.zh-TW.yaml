# 每日一問 · 金錢與價值觀。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-value-001
  text: 上一次花錢買到覺得很值得的東西，是什麼？
  tags: [values]
- id: qn-value-002
  text: 對你來說，什麼東西再貴也願意花下去？
  tags: [values]
- id: qn-value-003
  text: 存錢和花錢之間，你怎麼拿捏那個平衡？
  tags: [values]
- id: qn-value-004
  text: 有沒有一種消費，你事後常常會後悔？
  tags: [values]
- id: qn-value-005
  text: 如果收入突然多了一倍，你的生活會有什麼改變？
  tags: [values]
- id: qn-value-006
  text: 對你而言，「夠用」大概是什麼樣的狀態？
  tags: [values]
- id: qn-value-007
  text: 為了省一點錢，你願意多花時間或力氣到什麼程度？
  tags: [values]
- id: qn-value-008
  text: 小時候家裡對錢的態度，怎麼影響了現在的你？
  tags: [values]
- id: qn-value-009
  text: 什麼東西是你覺得再多錢也買不到的？
  tags: [values]
- id: qn-value-010
  text: 面對一筆比較大的支出，你通常怎麼做決定？
  tags: [values]
- id: qn-value-011
  text: 你願意為別人花錢到什麼樣的程度？
  tags: [values]
- id: qn-value-012
  text: 錢在你心裡，比較像安全感，還是自由？
  tags: [values]
- id: qn-value-013
  text: 有沒有一樣東西，你寧可自己動手也不想花錢買？
  tags: [values]
- id: qn-value-014
  text: 你怎麼看待跟人借錢或被借錢這件事？
  tags: [values]
- id: qn-value-015
  text: 如果只能留下三樣你認為有價值的東西，會是哪三樣？
  tags: [values]
- id: qn-value-016
  text: 花在體驗上和花在物品上，你更偏向哪一種？
  tags: [values]
- id: qn-value-017
  text: 什麼時候你會覺得，自己好像對錢太計較了？
  tags: [values]
- id: qn-value-018
  text: 認真賺錢這件事，對你而言是為了什麼？
  tags: [values]
- id: qn-value-019
  text: 有沒有一種花費，是你心甘情願的「浪費」？
  tags: [values]
- id: qn-value-020
  text: 你希望自己跟金錢的關係，變成什麼樣子？
  tags: [values]
