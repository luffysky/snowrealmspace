# 每日一問 · 座右銘與信念（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-motto-021
  text: 你心裡有沒有一個從不輕易妥協的順序，什麼要排在前面？
  tags: [motto]
- id: qn-motto-022
  text: 遇到跟你信念相左的人，你會怎麼跟自己解釋這份差異？
  tags: [motto]
- id: qn-motto-023
  text: 你判斷一件事值不值得做，最先看的是什麼？
  tags: [motto]
- id: qn-motto-024
  text: 在你身上，有哪個習慣其實藏著你的一套價值觀？
  tags: [motto]
- id: qn-motto-025
  text: 什麼樣的承諾，你一旦說出口就會拚了命守住？
  tags: [motto]
- id: qn-motto-026
  text: 你覺得一個人的品格，最容易在什麼時刻露出來？
  tags: [motto]
- id: qn-motto-027
  text: 如果要選一件你願意為它站出來的事，會是什麼？
  tags: [motto]
- id: qn-motto-028
  text: 你信奉的道理裡，有哪一條是吃過虧才真正懂的？
  tags: [motto]
- id: qn-motto-029
  text: 對你來說，自由和責任之間該怎麼拿捏？
  tags: [motto]
- id: qn-motto-030
  text: 你欣賞的長輩身上，有哪種特質是你也想活成的？
  tags: [motto]
- id: qn-motto-031
  text: 面對誘惑時，你靠什麼把自己拉回來？
  tags: [motto]
- id: qn-motto-032
  text: 你認為什麼樣的謊，即使是善意也不該說？
  tags: [motto]
- id: qn-motto-033
  text: 有沒有一種原則，你嘴上不提卻用行動一直守著？
  tags: [motto]
- id: qn-motto-034
  text: 你怎麼分辨「堅持」和「固執」在自己身上的差別？
  tags: [motto]
- id: qn-motto-035
  text: 什麼事情發生時，你會覺得自己背叛了信念？
  tags: [motto]
- id: qn-motto-036
  text: 你希望別人在背後怎麼形容你這個人？
  tags: [motto]
- id: qn-motto-037
  text: 對你而言，尊重一個人是從哪裡開始的？
  tags: [motto]
- id: qn-motto-038
  text: 你相信的價值裡，有哪一項是你想傳給下一代的？
  tags: [motto]
- id: qn-motto-039
  text: 當現實逼你選邊站，你會用什麼標準做取捨？
  tags: [motto]
- id: qn-motto-040
  text: 你覺得所謂「對得起自己」，具體是什麼樣子？
  tags: [motto]
