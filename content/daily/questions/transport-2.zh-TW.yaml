# 每日一問 · 交通與移動（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-transport-021
  text: 站在月台等車的那幾分鐘，你的視線通常落在哪裡？
  tags: [transport]
- id: qn-transport-022
  text: 公車上偶然聽見的一段對話，曾讓你留下什麼印象嗎？
  tags: [transport]
- id: qn-transport-023
  text: 對你而言，方向盤握在自己手上代表著什麼？
  tags: [transport]
- id: qn-transport-024
  text: 清晨第一班車和末班車，帶給你的感受哪裡不同？
  tags: [transport]
- id: qn-transport-025
  text: 迷路的那段繞遠路，後來在你記憶裡變成什麼樣子？
  tags: [transport]
- id: qn-transport-026
  text: 車窗外快速掠過的風景，你會怎麼形容那種流動感？
  tags: [transport]
- id: qn-transport-027
  text: 遇上誤點或臨時改道時，你會怎麼安放那份等待？
  tags: [transport]
- id: qn-transport-028
  text: 若要背起行囊只帶一種交通工具上路，你會挑哪個？
  tags: [transport]
- id: qn-transport-029
  text: 一段熟到不用看路的路線，對你來說像什麼？
  tags: [transport]
- id: qn-transport-030
  text: 步行穿越一座陌生城市時，你會用什麼方式認路？
  tags: [transport]
- id: qn-transport-031
  text: 曾經有哪一趟旅程，途中比抵達更讓你難忘？
  tags: [transport]
- id: qn-transport-032
  text: 你偏好把路線規劃得清清楚楚，還是走到哪算哪？
  tags: [transport]
- id: qn-transport-033
  text: 在車上聽音樂和什麼都不聽，各自是怎樣的心境？
  tags: [transport]
- id: qn-transport-034
  text: 送別或接人的月台上，你心裡常翻湧著什麼？
  tags: [transport]
- id: qn-transport-035
  text: 交通號誌前停下等待的空檔，你的思緒會飄向哪？
  tags: [transport]
- id: qn-transport-036
  text: 若某天所有街道都淨空只留給你，你想怎麼移動？
  tags: [transport]
- id: qn-transport-037
  text: 徒步、單車與開車，各自讓你看見城市的哪一面？
  tags: [transport]
- id: qn-transport-038
  text: 你對「順路」這件事，抱著什麼樣的看法？
  tags: [transport]
- id: qn-transport-039
  text: 在人擠人的尖峰車廂裡，你是怎麼替自己找到安身之處的？
  tags: [transport]
- id: qn-transport-040
  text: 一趟需要轉好幾次車的路程，會勾起你怎樣的心情？
  tags: [transport]
