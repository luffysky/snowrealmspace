# 每日一問 · 平凡的一天。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-ordinary-001
  text: 今天有哪個再普通不過的瞬間，其實讓你覺得剛剛好？
  tags: [ordinary]
- id: qn-ordinary-002
  text: 你每天都會重複做的小動作裡，藏著哪一種安心感？
  tags: [ordinary]
- id: qn-ordinary-003
  text: 如果把今天拍成一段影片，你會留下哪個毫不起眼的畫面？
  tags: [ordinary]
- id: qn-ordinary-004
  text: 一日三餐之中，哪一頓的味道最像平常的你？
  tags: [ordinary]
- id: qn-ordinary-005
  text: 在固定的通勤路上，有沒有什麼細節被你悄悄記住了？
  tags: [ordinary]
- id: qn-ordinary-006
  text: 你家裡有哪個角落，是每天都會經過卻很少細看的？
  tags: [ordinary]
- id: qn-ordinary-007
  text: 今天的例行公事裡，哪一件其實你做得挺開心？
  tags: [ordinary]
- id: qn-ordinary-008
  text: 如果日子像一杯溫開水，你覺得今天的溫度大概是幾度？
  tags: [ordinary]
- id: qn-ordinary-009
  text: 那些習以為常的聲音裡，哪一種你會想念如果它消失？
  tags: [ordinary]
- id: qn-ordinary-010
  text: 平淡的一天結束時，你最想窩在哪裡休息？
  tags: [ordinary]
- id: qn-ordinary-011
  text: 有沒有一個尋常的物件，陪你度過很多不特別的日子？
  tags: [ordinary]
- id: qn-ordinary-012
  text: 今天你為自己做的最小一件事，是什麼？
  tags: [ordinary]
- id: qn-ordinary-013
  text: 如果要向別人形容你的一個普通早晨，你會怎麼說？
  tags: [ordinary]
- id: qn-ordinary-014
  text: 生活中哪一段空白的時間，反而讓你覺得放鬆？
  tags: [ordinary]
- id: qn-ordinary-015
  text: 那些每天都會遇見的人事物裡，哪一樣讓你嘴角上揚？
  tags: [ordinary]
- id: qn-ordinary-016
  text: 今天窗外的光線，有沒有哪一刻讓你多看了兩眼？
  tags: [ordinary]
- id: qn-ordinary-017
  text: 你重複最多次的日常路線上，最喜歡哪一段風景？
  tags: [ordinary]
- id: qn-ordinary-018
  text: 如果平凡也有滋味，今天嚐起來像什麼？
  tags: [ordinary]
- id: qn-ordinary-019
  text: 在什麼都沒發生的一天裡，你會怎麼陪伴自己？
  tags: [ordinary]
- id: qn-ordinary-020
  text: 今天有哪件小事，讓你覺得日子這樣過也不錯？
  tags: [ordinary]
