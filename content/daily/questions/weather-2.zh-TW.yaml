# 每日一問 · 天氣與季節感受（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-weather-021
  text: 出門前查看天氣時，你最在意的是哪一項數字？
  tags: [weather]
- id: qn-weather-022
  text: 悶熱到讓人提不起勁的午後，你會用什麼方式讓自己舒服一點？
  tags: [weather]
- id: qn-weather-023
  text: 有沒有一種天氣，總是讓你的睡眠變得特別沉？
  tags: [weather]
- id: qn-weather-024
  text: 一場突如其來的雷陣雨，會打亂還是意外點亮你的一天？
  tags: [weather]
- id: qn-weather-025
  text: 你衣櫃裡有哪一件，是專門為某種天氣準備的？
  tags: [weather]
- id: qn-weather-026
  text: 潮濕黏膩的日子，你和它是怎麼相處的？
  tags: [weather]
- id: qn-weather-027
  text: 溫差很大的一天裡，你會怎麼替自己拿捏穿著？
  tags: [weather]
- id: qn-weather-028
  text: 哪一種天氣最適合你想做的那件拖了很久的事？
  tags: [weather]
- id: qn-weather-029
  text: 颱風要來之前的那種氣氛，在你心裡是什麼樣子？
  tags: [weather]
- id: qn-weather-030
  text: 你比較能忍受濕冷還是乾熱，理由是什麼？
  tags: [weather]
- id: qn-weather-031
  text: 一整週都是同一種天氣的話，你猜自己會有什麼變化？
  tags: [weather]
- id: qn-weather-032
  text: 霧氣籠罩的清晨，走在其中你會放慢還是加快腳步？
  tags: [weather]
- id: qn-weather-033
  text: 你會因為某種天氣而特別想聯絡某個人嗎？
  tags: [weather]
- id: qn-weather-034
  text: 日照時間變短的那段日子，你的作息會跟著挪動嗎？
  tags: [weather]
- id: qn-weather-035
  text: 哪一種天氣的光線，最適合替眼前的景色拍張照？
  tags: [weather]
- id: qn-weather-036
  text: 悶了好幾天終於放晴時，你第一件想做的事是什麼？
  tags: [weather]
- id: qn-weather-037
  text: 如果讓你挑一個地方的氣候長住，你會選在哪裡？
  tags: [weather]
- id: qn-weather-038
  text: 你身體有沒有哪個部位，會比氣象預報更早察覺變天？
  tags: [weather]
- id: qn-weather-039
  text: 星空清朗的夜晚，會勾起你什麼樣的念頭？
  tags: [weather]
- id: qn-weather-040
  text: 對你而言，一年之中哪個節氣的轉換最有感覺？
  tags: [weather]
