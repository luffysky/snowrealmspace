# 每日一問 · 電影與影像。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-film-001
  text: 有哪一部電影，你願意一看再看？
  tags: [film]
- id: qn-film-002
  text: 銀幕上的哪一個畫面，曾在你心裡停留很久？
  tags: [film]
- id: qn-film-003
  text: 你看電影時，比較在意故事，還是畫面的氛圍？
  tags: [film]
- id: qn-film-004
  text: 哪一句電影台詞，你到現在還記得？
  tags: [film]
- id: qn-film-005
  text: 對你來說，走進電影院和在家看片有什麼不同？
  tags: [film]
- id: qn-film-006
  text: 如果把自己的人生拍成電影，你會用什麼當片名？
  tags: [film]
- id: qn-film-007
  text: 哪一種類型的電影，最容易讓你投入其中？
  tags: [film]
- id: qn-film-008
  text: 有沒有一個角色，讓你覺得像在看自己？
  tags: [film]
- id: qn-film-009
  text: 電影裡的音樂，曾經如何改變你對某個場景的感受？
  tags: [film]
- id: qn-film-010
  text: 你喜歡結局說得明白，還是留給你想像的空間？
  tags: [film]
- id: qn-film-011
  text: 哪一部作品，曾經讓你對某件事的看法變得不一樣？
  tags: [film]
- id: qn-film-012
  text: 看完一部好片後，你通常想立刻和誰分享？
  tags: [film]
- id: qn-film-013
  text: 如果能走進任何一部電影的世界，你想去哪裡？
  tags: [film]
- id: qn-film-014
  text: 你會被預告片吸引，還是靠別的方式挑片？
  tags: [film]
- id: qn-film-015
  text: 童年時看過的哪一部影片，至今仍留在你記憶裡？
  tags: [film]
- id: qn-film-016
  text: 對你而言，一部電影要有什麼，才算真正打動你？
  tags: [film]
- id: qn-film-017
  text: 你偏好安靜地看完，還是邊看邊和人討論？
  tags: [film]
- id: qn-film-018
  text: 哪一個電影場景，讓你想親眼到那個地方看看？
  tags: [film]
- id: qn-film-019
  text: 如果要推薦一部片給多年後的自己，你會選哪一部？
  tags: [film]
- id: qn-film-020
  text: 影像和文字相比，哪一種更容易觸動你？
  tags: [film]
