# 每日一問 · 慶祝與儀式。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-ritual-001
  text: 有沒有一個只屬於你、外人看來微不足道的小儀式？
  tags: [ritual]
- id: qn-ritual-002
  text: 上一次真心為自己慶祝，是因為什麼樣的事？
  tags: [ritual]
- id: qn-ritual-003
  text: 對你來說，一場好的慶祝，缺了什麼就不對味了？
  tags: [ritual]
- id: qn-ritual-004
  text: 你家裡有哪個代代相傳、或自己新創的過節方式？
  tags: [ritual]
- id: qn-ritual-005
  text: 哪個平凡的日常動作，其實被你偷偷當成一種儀式？
  tags: [ritual]
- id: qn-ritual-006
  text: 如果要替一件小成就辦個慶祝，你會怎麼設計它？
  tags: [ritual]
- id: qn-ritual-007
  text: 有什麼味道、聲音或畫面，一出現就讓你想起某個節慶？
  tags: [ritual]
- id: qn-ritual-008
  text: 你比較享受和眾人同歡，還是一個人靜靜地紀念？
  tags: [ritual]
- id: qn-ritual-009
  text: 哪一次的慶祝，多年後仍在你心裡閃著光？
  tags: [ritual]
- id: qn-ritual-010
  text: 每天開始或結束時，你有沒有一個固定會做的小動作？
  tags: [ritual]
- id: qn-ritual-011
  text: 有什麼值得慶祝的事，是你常常忘了給自己肯定的？
  tags: [ritual]
- id: qn-ritual-012
  text: 如果替今年的自己辦一場典禮，你想頒獎給哪個時刻？
  tags: [ritual]
- id: qn-ritual-013
  text: 你會用什麼方式，替一段結束的關係或篇章好好告別？
  tags: [ritual]
- id: qn-ritual-014
  text: 換季或跨年的時候，你有沒有想重新開始的某種小約定？
  tags: [ritual]
- id: qn-ritual-015
  text: 哪一個和某人共享的習慣，成了你們之間的默契暗號？
  tags: [ritual]
- id: qn-ritual-016
  text: 對你而言，把日子過得有儀式感，究竟是在守護什麼？
  tags: [ritual]
- id: qn-ritual-017
  text: 有沒有一個你一直想做、卻還沒替自己辦的慶祝？
  tags: [ritual]
- id: qn-ritual-018
  text: 收到或送出的哪一份心意，讓一個尋常日子變得特別？
  tags: [ritual]
- id: qn-ritual-019
  text: 你會怎麼標記一個對別人無感、對你卻重要的紀念日？
  tags: [ritual]
- id: qn-ritual-020
  text: 若要為此刻的自己點一根蠟燭，你想在心裡許下什麼？
  tags: [ritual]
