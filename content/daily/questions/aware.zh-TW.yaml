# 每日一問 · 當下覺察。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-aware-001
  text: 此刻你的呼吸，是快還是慢？
  tags: [aware]
- id: qn-aware-002
  text: 如果現在把注意力放到雙腳，它們正踩在什麼上面？
  tags: [aware]
- id: qn-aware-003
  text: 你所在的地方，最靠近你的聲音是什麼？
  tags: [aware]
- id: qn-aware-004
  text: 這一刻，你的肩膀是鬆的還是緊的？
  tags: [aware]
- id: qn-aware-005
  text: 現在腦中冒出來的第一個念頭，是關於什麼？
  tags: [aware]
- id: qn-aware-006
  text: 如果不去改變它，此刻的心情比較接近哪一種溫度？
  tags: [aware]
- id: qn-aware-007
  text: 你此刻的視線落在哪裡，那裡有什麼？
  tags: [aware]
- id: qn-aware-008
  text: 現在空氣聞起來，帶著什麼味道？
  tags: [aware]
- id: qn-aware-009
  text: 這個瞬間，你的手正在做什麼、或碰著什麼？
  tags: [aware]
- id: qn-aware-010
  text: 若把今天此刻的感覺畫成一種顏色，會是哪一種？
  tags: [aware]
- id: qn-aware-011
  text: 現在身體裡，哪個部位的存在感最明顯？
  tags: [aware]
- id: qn-aware-012
  text: 你周圍的光線，此刻是明亮還是柔和的？
  tags: [aware]
- id: qn-aware-013
  text: 這一刻停下來，你注意到自己正想著誰？
  tags: [aware]
- id: qn-aware-014
  text: 如果閉上眼睛三秒，最先浮現的畫面是什麼？
  tags: [aware]
- id: qn-aware-015
  text: 此刻坐著或站著的你，重心偏向哪一邊？
  tags: [aware]
- id: qn-aware-016
  text: 現在這個空間的溫度，讓你的身體有什麼反應？
  tags: [aware]
- id: qn-aware-017
  text: 你剛剛喝下或吃進嘴裡的東西，留下了什麼餘味？
  tags: [aware]
- id: qn-aware-018
  text: 此刻若要形容心裡的節奏，它像哪一種拍子？
  tags: [aware]
- id: qn-aware-019
  text: 現在的你，身邊有什麼是平常會忽略、此刻卻注意到的？
  tags: [aware]
- id: qn-aware-020
  text: 讓念頭自由飄一下，它最後停在哪個地方？
  tags: [aware]
