# 每日一問 · 勇氣與嘗試。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-try-001
  text: 有沒有一件事，你想做很久卻一直放在心底？
  tags: [tryit]
- id: qn-try-002
  text: 如果失敗不會被任何人看見，你會偷偷嘗試什麼？
  tags: [tryit]
- id: qn-try-003
  text: 最近有什麼「第一次」，是你想親手體驗看看的？
  tags: [tryit]
- id: qn-try-004
  text: 有什麼小事，光是想到要跨出去就讓你心跳加快？
  tags: [tryit]
- id: qn-try-005
  text: 你曾經因為害怕而錯過、現在想再試一次的是什麼？
  tags: [tryit]
- id: qn-try-006
  text: 如果有人陪著你，你最想一起去挑戰什麼？
  tags: [tryit]
- id: qn-try-007
  text: 你想學會哪一項讓自己驚訝一下的新技能？
  tags: [tryit]
- id: qn-try-008
  text: 有沒有一句話，你很想鼓起勇氣對某個人說？
  tags: [tryit]
- id: qn-try-009
  text: 哪個地方是你一直想去、卻遲遲沒動身的？
  tags: [tryit]
- id: qn-try-010
  text: 如果今天可以做一件平常不敢做的事，你會選什麼？
  tags: [tryit]
- id: qn-try-011
  text: 你想給哪個興趣一次認真開始的機會？
  tags: [tryit]
- id: qn-try-012
  text: 有什麼事情，你只差一點點勇氣就會去做？
  tags: [tryit]
- id: qn-try-013
  text: 你最近一次踏出舒適圈，是什麼時候的事？
  tags: [tryit]
- id: qn-try-014
  text: 如果不用管別人怎麼想，你想試著成為怎樣的自己？
  tags: [tryit]
- id: qn-try-015
  text: 有沒有一個舞台或場合，你偷偷想站上去看看？
  tags: [tryit]
- id: qn-try-016
  text: 你想主動認識、卻還沒開口的人是誰？
  tags: [tryit]
- id: qn-try-017
  text: 哪一件被你標成「以後再說」的事，其實你很想現在做？
  tags: [tryit]
- id: qn-try-018
  text: 如果勇氣可以先借你一天，你想拿去做什麼？
  tags: [tryit]
- id: qn-try-019
  text: 有什麼嘗試，就算結果不如預期你也不會後悔？
  tags: [tryit]
- id: qn-try-020
  text: 你想對那個猶豫不決的自己，說些什麼？
  tags: [tryit]
