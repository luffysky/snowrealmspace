# 每日一問 · 嗜好與興趣（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-hobby-021
  text: 最近有什麼新東西勾起了你想動手試試的念頭？
  tags: [hobby]
- id: qn-hobby-022
  text: 在你喜歡的事情裡，哪一個瞬間最讓你感到平靜？
  tags: [hobby]
- id: qn-hobby-023
  text: 假如身邊沒有任何人知道，你會偷偷去玩什麼？
  tags: [hobby]
- id: qn-hobby-024
  text: 你的興趣有沒有一條自己摸索出來的獨門訣竅？
  tags: [hobby]
- id: qn-hobby-025
  text: 小時候玩得入迷的那件事，如今還在你身上留著什麼痕跡？
  tags: [hobby]
- id: qn-hobby-026
  text: 若要用一種顏色形容你最投入的愛好，你會挑哪個？
  tags: [hobby]
- id: qn-hobby-027
  text: 什麼樣的聲音或氣味，會讓你聯想到正在做喜歡的事？
  tags: [hobby]
- id: qn-hobby-028
  text: 你曾經因為哪個愛好，去過一個原本不會踏進的地方？
  tags: [hobby]
- id: qn-hobby-029
  text: 在興趣這件事上，你比較享受獨自埋頭，還是有人作伴？
  tags: [hobby]
- id: qn-hobby-030
  text: 有哪件收藏或作品，是你捨不得讓別人碰的？
  tags: [hobby]
- id: qn-hobby-031
  text: 你會怎麼形容剛完成一件作品時，心裡浮起的那種感覺？
  tags: [hobby]
- id: qn-hobby-032
  text: 假如把興趣換成一份工作，你猜自己會更愛它還是更累？
  tags: [hobby]
- id: qn-hobby-033
  text: 哪一個看似無用的小技能，是你玩出來的意外收穫？
  tags: [hobby]
- id: qn-hobby-034
  text: 你有沒有一個一直想學、卻遲遲沒開始的興趣？
  tags: [hobby]
- id: qn-hobby-035
  text: 在你喜歡的領域裡，誰是你私下默默佩服的人？
  tags: [hobby]
- id: qn-hobby-036
  text: 如果要把你的愛好濃縮成一個畫面，那會是什麼樣子？
  tags: [hobby]
- id: qn-hobby-037
  text: 有哪次玩到一半的失敗，反而成了你難忘的經驗？
  tags: [hobby]
- id: qn-hobby-038
  text: 你會用什麼方式，替一段獨處的興趣時光收尾？
  tags: [hobby]
- id: qn-hobby-039
  text: 對你而言，一項愛好要陪你多久，才算是真的喜歡？
  tags: [hobby]
- id: qn-hobby-040
  text: 假如今晚多出三個小時，你會拿來玩哪一樣？
  tags: [hobby]
