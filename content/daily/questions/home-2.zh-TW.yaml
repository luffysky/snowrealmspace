# 每日一問 · 家與空間（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-home-021
  text: 剛進家門的頭幾分鐘，你習慣先做哪一件事？
  tags: [home]
- id: qn-home-022
  text: 家裡有沒有一個角落，總是不知不覺就堆滿了東西？
  tags: [home]
- id: qn-home-023
  text: 如果要替家中的地板換一種材質，你會嚮往踩起來是什麼感覺？
  tags: [home]
- id: qn-home-024
  text: 你比較喜歡把窗簾拉開讓光進來，還是留一室柔和的昏暗？
  tags: [home]
- id: qn-home-025
  text: 家裡哪一件物品，其實藏著一段別人不知道的故事？
  tags: [home]
- id: qn-home-026
  text: 冬天的家和夏天的家，在你眼中會有什麼不一樣？
  tags: [home]
- id: qn-home-027
  text: 你會怎麼安排一個讓自己專心的角落？
  tags: [home]
- id: qn-home-028
  text: 如果家裡能多一扇門或一道牆，你想拿它來分隔什麼？
  tags: [home]
- id: qn-home-029
  text: 對你來說，一個空間要放上什麼，才開始有了溫度？
  tags: [home]
- id: qn-home-030
  text: 你和同住的人，會為了空間的擺設有過哪些不同想法？
  tags: [home]
- id: qn-home-031
  text: 家裡的哪一種聲音，是你希望永遠留著的？
  tags: [home]
- id: qn-home-032
  text: 陽台或門口那一小塊地方，你會想讓它變成什麼樣子？
  tags: [home]
- id: qn-home-033
  text: 搬家的時候，你最捨不得帶走又不得不留下的會是什麼？
  tags: [home]
- id: qn-home-034
  text: 一個人在家的夜晚，你通常怎麼度過？
  tags: [home]
- id: qn-home-035
  text: 如果要用一種顏色替房間重新粉刷，你心裡浮現哪一種？
  tags: [home]
- id: qn-home-036
  text: 你家餐桌上，最常出現的是食物、雜物還是別的什麼？
  tags: [home]
- id: qn-home-037
  text: 收納一直收不好的那樣東西，對你來說是什麼？
  tags: [home]
- id: qn-home-038
  text: 你希望家給來訪的人留下哪一種第一印象？
  tags: [home]
- id: qn-home-039
  text: 家裡有沒有一個位置，是你會固定發呆或放空的地方？
  tags: [home]
- id: qn-home-040
  text: 如果房子會記得住過的人，你希望它記住你哪一面？
  tags: [home]
