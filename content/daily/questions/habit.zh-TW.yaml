# 每日一問 · 習慣與日常。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-habit-001
  text: 早上起床後，你做的第一件事通常是什麼？
  tags: [habit]
- id: qn-habit-002
  text: 有沒有一個小習慣，讓你的一天順了很多？
  tags: [habit]
- id: qn-habit-003
  text: 睡前那段時間，你喜歡怎麼度過？
  tags: [habit]
- id: qn-habit-004
  text: 哪一個日常動作，是你幾乎每天都會重複的？
  tags: [habit]
- id: qn-habit-005
  text: 有沒有想養成、卻一直沒能穩定下來的習慣？
  tags: [habit]
- id: qn-habit-006
  text: 一個人獨處的時間，你會怎麼安排？
  tags: [habit]
- id: qn-habit-007
  text: 一週裡面，哪一天的節奏最讓你舒服？
  tags: [habit]
- id: qn-habit-008
  text: 有什麼小東西，是你出門一定要帶在身上的？
  tags: [habit]
- id: qn-habit-009
  text: 吃飯的時候，你習慣配著什麼一起？
  tags: [habit]
- id: qn-habit-010
  text: 家裡哪個角落，是你最常待著的地方？
  tags: [habit]
- id: qn-habit-011
  text: 你有沒有什麼固定會走的路線，或常去的地方？
  tags: [habit]
- id: qn-habit-012
  text: 心情煩的時候，你會用哪個小動作讓自己靜下來？
  tags: [habit]
- id: qn-habit-013
  text: 一天當中，哪個時段你的狀態最好？
  tags: [habit]
- id: qn-habit-014
  text: 有沒有一個習慣，是你從別人身上學來的？
  tags: [habit]
- id: qn-habit-015
  text: 每天要穿什麼，你都是怎麼決定的？
  tags: [habit]
- id: qn-habit-016
  text: 假日的你和平常的你，作息差多少？
  tags: [habit]
- id: qn-habit-017
  text: 有什麼事情，你一旦開始做就很難停下來？
  tags: [habit]
- id: qn-habit-018
  text: 天氣的變化，會怎麼影響你一天的安排？
  tags: [habit]
- id: qn-habit-019
  text: 放鬆的時候，你有沒有一個專屬自己的小儀式？
  tags: [habit]
- id: qn-habit-020
  text: 如果要為明天先做一點小準備，你會先做哪件事？
  tags: [habit]
