# 每日一問 · 休息／照顧自己。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-rest-001
  text: 今天你有讓自己好好休息嗎？
  tags: [rest]
- id: qn-rest-002
  text: 什麼樣的休息，最能替你充電？
  tags: [rest]
- id: qn-rest-003
  text: 你上一次真正放空，是什麼時候？
  tags: [rest]
- id: qn-rest-004
  text: 現在的你，最需要哪一種放鬆？
  tags: [rest]
- id: qn-rest-005
  text: 累的時候，你都怎麼照顧自己？
  tags: [rest]
- id: qn-rest-006
  text: 有沒有一件事，能讓你瞬間放鬆？
  tags: [rest]
- id: qn-rest-007
  text: 你今天睡得如何？
  tags: [rest]
- id: qn-rest-008
  text: 什麼地方，能讓你安心地休息？
  tags: [rest]
- id: qn-rest-009
  text: 你會用什麼方式，寵愛自己一下？
  tags: [rest]
- id: qn-rest-010
  text: 最近你有沒有硬撐、忘了休息？
  tags: [rest]
- id: qn-rest-011
  text: 一個人的時候，你喜歡做什麼？
  tags: [rest]
- id: qn-rest-012
  text: 你理想中的一個懶散午後，長怎樣？
  tags: [rest]
- id: qn-rest-013
  text: 今天有哪個片刻，讓你喘了口氣？
  tags: [rest]
- id: qn-rest-014
  text: 你想給自己安排什麼樣的休息？
  tags: [rest]
- id: qn-rest-015
  text: 什麼能讓緊繃的你慢下來？
  tags: [rest]
- id: qn-rest-016
  text: 你最近有沒有對自己太嚴格？
  tags: [rest]
- id: qn-rest-017
  text: 如果今天能偷閒一小時，你想怎麼用？
  tags: [rest]
- id: qn-rest-018
  text: 哪一種獨處，會讓你覺得被療癒？
  tags: [rest]
- id: qn-rest-019
  text: 你現在的身體，想要什麼？
  tags: [rest]
- id: qn-rest-020
  text: 今天你願意，對自己溫柔一點嗎？
  tags: [rest]
