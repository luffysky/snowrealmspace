# 每日一問 · 下廚與料理（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-cooking-021
  text: 一頓飯吃完後的洗碗收拾，你會怎麼看待這段時間？
  tags: [cooking]
- id: qn-cooking-022
  text: 到市場或超市挑食材時，你最在意的是哪一點？
  tags: [cooking]
- id: qn-cooking-023
  text: 菜做壞了的當下，你會怎麼替它想辦法？
  tags: [cooking]
- id: qn-cooking-024
  text: 童年餐桌上的哪一道菜，味道到現在還留在記憶裡？
  tags: [cooking]
- id: qn-cooking-025
  text: 同樣一道菜，外面買和自己煮，你會怎麼權衡？
  tags: [cooking]
- id: qn-cooking-026
  text: 擺盤和外觀對你而言，在一頓飯裡佔多少分量？
  tags: [cooking]
- id: qn-cooking-027
  text: 把食譜分享給別人、對方做出來時，你會期待什麼？
  tags: [cooking]
- id: qn-cooking-028
  text: 站在爐火前的時候，你習慣讓周圍是安靜還是有點聲音？
  tags: [cooking]
- id: qn-cooking-029
  text: 某個季節一到，你就會特別想做哪一道應景的料理？
  tags: [cooking]
- id: qn-cooking-030
  text: 只煮一人份的時候，你會替自己準備什麼？
  tags: [cooking]
- id: qn-cooking-031
  text: 夜深了突然想開伙，多半是什麼心情帶著你走進廚房？
  tags: [cooking]
- id: qn-cooking-032
  text: 做甜點或烘焙這種需要精準的料理，帶給你的是什麼感受？
  tags: [cooking]
- id: qn-cooking-033
  text: 想複製長輩手裡那道菜的味道時，你會卡在哪一步？
  tags: [cooking]
- id: qn-cooking-034
  text: 若要替明天的自己準備一個便當，你會裝進哪些菜？
  tags: [cooking]
- id: qn-cooking-035
  text: 端出去請客的幾道菜，你會怎麼決定它們的順序或搭配？
  tags: [cooking]
- id: qn-cooking-036
  text: 你的廚房抽屜和調味架，透露出你是個怎樣的人？
  tags: [cooking]
- id: qn-cooking-037
  text: 前一晚的剩菜，到了隔天你會怎麼讓它換個樣子上桌？
  tags: [cooking]
- id: qn-cooking-038
  text: 火候大小這件事，你是靠什麼在拿捏？
  tags: [cooking]
- id: qn-cooking-039
  text: 手裡那把用順的刀，和你之間有什麼樣的默契？
  tags: [cooking]
- id: qn-cooking-040
  text: 如果能站在某個人身邊看他做菜，你會想學誰的手藝？
  tags: [cooking]
