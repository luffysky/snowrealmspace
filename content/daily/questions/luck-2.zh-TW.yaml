# 每日一問 · 運氣與迷信（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-luck-021
  text: 出門前發現忘了帶東西又折返，你會覺得這是壞兆頭嗎？
  tags: [luck]
- id: qn-luck-022
  text: 你會不會特別偏好某個數字，覺得它跟著你就比較安心？
  tags: [luck]
- id: qn-luck-023
  text: 如果連續遇到幾件倒楣事，你會怎麼安撫那時候的自己？
  tags: [luck]
- id: qn-luck-024
  text: 你相信有些人天生就是「帶財」或「帶旺」的體質嗎？
  tags: [luck]
- id: qn-luck-025
  text: 過年時的那些吉祥話和習俗，哪一個是你至今仍會照做的？
  tags: [luck]
- id: qn-luck-026
  text: 你有沒有一件穿了就覺得會順利的「戰袍」？
  tags: [luck]
- id: qn-luck-027
  text: 別人送你的護身符或平安符，你通常會放在哪裡？
  tags: [luck]
- id: qn-luck-028
  text: 你覺得替自己招來好運，比較靠心態還是靠儀式？
  tags: [luck]
- id: qn-luck-029
  text: 有沒有一次你明明準備充分，卻還是把成敗歸給了運氣？
  tags: [luck]
- id: qn-luck-030
  text: 假如運氣有存款和透支，你覺得自己現在是哪一種狀態？
  tags: [luck]
- id: qn-luck-031
  text: 你會不會因為做了某個夢，而改變當天的某個決定？
  tags: [luck]
- id: qn-luck-032
  text: 生日蠟燭吹熄前，你許願的心情是認真的還是隨意的？
  tags: [luck]
- id: qn-luck-033
  text: 在你看來，「趨吉避凶」這件事是智慧還是想太多？
  tags: [luck]
- id: qn-luck-034
  text: 有沒有一句長輩傳下來的話，你半信半疑卻還是照著避開？
  tags: [luck]
- id: qn-luck-035
  text: 你會挑良辰吉日來做重要的事，還是覺得哪天都一樣？
  tags: [luck]
- id: qn-luck-036
  text: 如果好運和壞運總是成對出現，你比較怕哪一種先來？
  tags: [luck]
- id: qn-luck-037
  text: 你有沒有一個從沒說出口、卻默默維持很久的私人迷信？
  tags: [luck]
- id: qn-luck-038
  text: 看到別人接連走運，你心裡浮現的第一個念頭是什麼？
  tags: [luck]
- id: qn-luck-039
  text: 假如可以偷偷得知自己明年的運勢，你會想知道嗎？
  tags: [luck]
- id: qn-luck-040
  text: 對你來說，把命運交給運氣和交給自己，哪一種比較自在？
  tags: [luck]
