# 每日一問 · 社群與貼文（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-social-021
  text: 早上醒來，你多快會點開第一個社群軟體？
  tags: [socialmedia]
- id: qn-social-022
  text: 有沒有一則舊貼文，你偶爾會回頭翻出來重看？
  tags: [socialmedia]
- id: qn-social-023
  text: 你的大頭貼，上一次換掉是為了什麼？
  tags: [socialmedia]
- id: qn-social-024
  text: 私訊裡的對話，和公開留言對你有什麼不同？
  tags: [socialmedia]
- id: qn-social-025
  text: 演算法推給你的內容，和你真正想看的差多遠？
  tags: [socialmedia]
- id: qn-social-026
  text: 哪一類貼文，你會默默收藏起來卻不按讚？
  tags: [socialmedia]
- id: qn-social-027
  text: 看到朋友的日子過得精彩，你心裡會浮現什麼？
  tags: [socialmedia]
- id: qn-social-028
  text: 你的個人簡介那一欄，現在寫著什麼？
  tags: [socialmedia]
- id: qn-social-029
  text: 有沒有一種內容，你只在「摯友」名單裡才願意發？
  tags: [socialmedia]
- id: qn-social-030
  text: 通知響起的那一刻，你最期待看到誰的名字？
  tags: [socialmedia]
- id: qn-social-031
  text: 你會為了誰，特地把某則動態設成不讓他看見？
  tags: [socialmedia]
- id: qn-social-032
  text: 一則迷因或短片，要好笑到什麼程度你才會轉給朋友？
  tags: [socialmedia]
- id: qn-social-033
  text: 你有沒有把某個帳號靜音、卻沒有取消追蹤？
  tags: [socialmedia]
- id: qn-social-034
  text: 把朋友標記進貼文之前，你會先斟酌些什麼？
  tags: [socialmedia]
- id: qn-social-035
  text: 如果哪天你的貼文突然被很多人看見，你想像那會是什麼感覺？
  tags: [socialmedia]
- id: qn-social-036
  text: 在社群上，你比較常出聲，還是安靜地看著？
  tags: [socialmedia]
- id: qn-social-037
  text: 生日那天收到滿版的祝福，對你來說是什麼滋味？
  tags: [socialmedia]
- id: qn-social-038
  text: 你多久會清理一次追蹤名單或過去的貼文？
  tags: [socialmedia]
- id: qn-social-039
  text: 若有人翻遍你這些年的貼文，會拼湊出一個怎樣的你？
  tags: [socialmedia]
- id: qn-social-040
  text: 決定關掉某個軟體通知的那一刻，你是怎麼想的？
  tags: [socialmedia]
