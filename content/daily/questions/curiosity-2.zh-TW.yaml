# 每日一問 · 好奇與探問（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-curious-021
  text: 你最近一次因為好奇而查資料，查的是什麼？
  tags: [curiosity]
- id: qn-curious-022
  text: 身邊哪個人的腦袋裡，你最想借來逛一整天？
  tags: [curiosity]
- id: qn-curious-023
  text: 有什麼字或詞，你講了很多年卻沒認真想過它的由來？
  tags: [curiosity]
- id: qn-curious-024
  text: 如果能看見某段記憶當時的真實畫面，你想調閱哪一段？
  tags: [curiosity]
- id: qn-curious-025
  text: 哪一種你不擅長的技能，讓你私底下偷偷嚮往？
  tags: [curiosity]
- id: qn-curious-026
  text: 你走在路上時，最容易被什麼細節吸引住目光？
  tags: [curiosity]
- id: qn-curious-027
  text: 如果能把一天縮成十秒快轉，你想看哪個地方的變化？
  tags: [curiosity]
- id: qn-curious-028
  text: 有沒有一個領域，你總覺得「哪天有空要好好研究一下」？
  tags: [curiosity]
- id: qn-curious-029
  text: 你曾經拆開過什麼東西，只為了看看裡面長怎樣？
  tags: [curiosity]
- id: qn-curious-030
  text: 假如能聽懂植物之間的溝通，你想從哪棵樹開始聽？
  tags: [curiosity]
- id: qn-curious-031
  text: 哪一段別人的人生故事，讓你聽了還想追問下去？
  tags: [curiosity]
- id: qn-curious-032
  text: 如果眼前多出一扇沒見過的門，你會期待門後是什麼？
  tags: [curiosity]
- id: qn-curious-033
  text: 有什麼看似簡單的東西，你越想越覺得其實不簡單？
  tags: [curiosity]
- id: qn-curious-034
  text: 你最想親手做一次、但還沒動手的實驗或嘗試是什麼？
  tags: [curiosity]
- id: qn-curious-035
  text: 假設能在某個專家旁邊看他工作一天，你會挑誰？
  tags: [curiosity]
- id: qn-curious-036
  text: 哪一種聲音，你會忍不住想知道它是怎麼發出來的？
  tags: [curiosity]
- id: qn-curious-037
  text: 如果整座城市的燈光背後各有一個故事，你想知道哪一盞？
  tags: [curiosity]
- id: qn-curious-038
  text: 你心裡有沒有一個一直沒查證、卻很想弄清的傳聞？
  tags: [curiosity]
- id: qn-curious-039
  text: 假如能把某個抽象概念變成看得見的形狀，你想看哪個？
  tags: [curiosity]
- id: qn-curious-040
  text: 最近有什麼事讓你冒出「這到底是怎麼辦到的」念頭？
  tags: [curiosity]
