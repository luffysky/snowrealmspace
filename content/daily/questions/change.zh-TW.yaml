# 每日一問 · 改變與轉變。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-change-001
  text: 最近你的生活，有哪個小地方悄悄變了？
  tags: [change]
- id: qn-change-002
  text: 有沒有一件事，是你一年前絕對想不到自己會喜歡的？
  tags: [change]
- id: qn-change-003
  text: 如果讓現在的你，去和五年前的自己喝杯茶，你會先聊什麼？
  tags: [change]
- id: qn-change-004
  text: 你身上有什麼是這些年來一直沒變的？
  tags: [change]
- id: qn-change-005
  text: 當你搬到一個新的地方，最先想安頓好的會是哪件事？
  tags: [change]
- id: qn-change-006
  text: 你曾經抗拒過某個改變，後來卻覺得幸好發生了嗎？
  tags: [change]
- id: qn-change-007
  text: 有哪個習慣，是你在不知不覺中養成的？
  tags: [change]
- id: qn-change-008
  text: 對你而言，「換一種活法」聽起來是自由，還是有點不安？
  tags: [change]
- id: qn-change-009
  text: 你最近一次改變主意，是為了什麼？
  tags: [change]
- id: qn-change-010
  text: 假如可以保留人生某一段時光的樣子，你會選哪一段？
  tags: [change]
- id: qn-change-011
  text: 季節轉換的時候，你會不會也想調整一下自己的節奏？
  tags: [change]
- id: qn-change-012
  text: 有什麼東西，是你以前很在意、現在卻能笑著放下的？
  tags: [change]
- id: qn-change-013
  text: 你覺得成長比較像慢慢長高，還是像某天突然的頓悟？
  tags: [change]
- id: qn-change-014
  text: 如果明天可以換一個全新的身分過一天，你想試試看什麼？
  tags: [change]
- id: qn-change-015
  text: 回頭看，是哪個決定，讓你走到了現在這裡？
  tags: [change]
- id: qn-change-016
  text: 你的房間或桌面，最近多了或少了什麼？
  tags: [change]
- id: qn-change-017
  text: 有沒有一種味道或聲音，會把你瞬間帶回從前？
  tags: [change]
- id: qn-change-018
  text: 面對變動時，你比較想抓住什麼來讓自己安心？
  tags: [change]
- id: qn-change-019
  text: 你希望一年後的自己，記得今天的哪一件事？
  tags: [change]
- id: qn-change-020
  text: 如果把這一年畫成一條線，它會是什麼形狀？
  tags: [change]
