# 每日一問 · 創作。關於做東西這件事。
- id: qn-making-01
  text: 你最近想做卻還沒開始的，是什麼？
  tags: [making]
- id: qn-making-02
  text: 如果不怕做壞，你會想試哪件作品？
  tags: [making]
- id: qn-making-03
  text: 手邊哪個半成品，其實只差最後一步？
  tags: [making, finishing]
- id: qn-making-04
  text: 你想被記得是一個做什麼的人？
  tags: [making]
- id: qn-making-05
  text: 最近哪個靈感，你怕忘記卻還沒記下？
  tags: [making]
- id: qn-making-06
  text: 如果今天的作品只給自己看，你會做什麼？
  tags: [making]
- id: qn-making-07
  text: 你創作時，最享受的是哪個階段？
  tags: [making]
- id: qn-making-08
  text: 有什麼題材，你一直繞著它打轉卻沒動手？
  tags: [making]
- id: qn-making-09
  text: 你最想重做以前哪一件作品？
  tags: [making]
- id: qn-making-10
  text: 如果材料不限，你第一個想試什麼？
  tags: [making]
- id: qn-making-11
  text: 哪個你欣賞的作品，偷偷影響了你？
  tags: [making]
- id: qn-making-12
  text: 你做東西時，什麼時候最容易卡住？
  tags: [making]
- id: qn-making-13
  text: 如果給自己一個沒有目的的下午，你會創作什麼？
  tags: [making]
- id: qn-making-14
  text: 你最近一次為了做東西而忘了時間，是在做什麼？
  tags: [making]
- id: qn-making-15
  text: 有什麼是你只想做給某一個人的？
  tags: [making]
- id: qn-making-16
  text: 你希望今天留下的，是什麼樣的痕跡？
  tags: [making]
