# 每日一問 · 靈感與創意來源。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-inspire-001
  text: 最近哪個念頭像火花一樣，突然在你腦中亮了一下？
  tags: [inspire]
- id: qn-inspire-002
  text: 你的靈感通常在什麼樣的時刻悄悄冒出來？
  tags: [inspire]
- id: qn-inspire-003
  text: 有哪個地方，一走進去你的想像力就活了起來？
  tags: [inspire]
- id: qn-inspire-004
  text: 如果要為一個想法找養分，你會往哪裡去汲取？
  tags: [inspire]
- id: qn-inspire-005
  text: 最近看過的哪一幕畫面，讓你很想把它變成什麼？
  tags: [inspire]
- id: qn-inspire-006
  text: 你會被什麼樣的顏色或聲音牽動出創作的衝動？
  tags: [inspire]
- id: qn-inspire-007
  text: 哪一個看似無關的東西，曾意外給了你點子？
  tags: [inspire]
- id: qn-inspire-008
  text: 當腦袋卡住時，你都用什麼方式重新打開它？
  tags: [inspire]
- id: qn-inspire-009
  text: 有沒有一句話或一段文字，一直在你心裡發酵？
  tags: [inspire]
- id: qn-inspire-010
  text: 你最近好奇的哪件事，可能藏著下一個創作的種子？
  tags: [inspire]
- id: qn-inspire-011
  text: 如果靈感是一位訪客，你會怎麼佈置迎接它的空間？
  tags: [inspire]
- id: qn-inspire-012
  text: 哪一種散步或移動的方式，最容易讓你想東想西？
  tags: [inspire]
- id: qn-inspire-013
  text: 你曾從誰的作品裡，偷學到一種看世界的角度？
  tags: [inspire]
- id: qn-inspire-014
  text: 生活中哪個微小的觀察，讓你忍不住想記下來？
  tags: [inspire]
- id: qn-inspire-015
  text: 如果把此刻的心情做成一件作品，它會是什麼形狀？
  tags: [inspire]
- id: qn-inspire-016
  text: 你都把突然閃現的點子，收藏在哪裡？
  tags: [inspire]
- id: qn-inspire-017
  text: 哪一種天氣或光線，特別能勾起你的創作慾？
  tags: [inspire]
- id: qn-inspire-018
  text: 最近有什麼事物，讓你想用不同的方式重新詮釋它？
  tags: [inspire]
- id: qn-inspire-019
  text: 當你想放空找靈感時，最常回到哪一種狀態？
  tags: [inspire]
- id: qn-inspire-020
  text: 如果可以向某個人請教創意的祕訣，你會想問誰？
  tags: [inspire]
