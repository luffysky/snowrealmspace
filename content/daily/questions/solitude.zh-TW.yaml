# 每日一問 · 獨處。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-solo-001
  text: 一個人的時候，你最喜歡做些什麼？
  tags: [solitude]
- id: qn-solo-002
  text: 獨處對你來說，是充電，還是別的意義？
  tags: [solitude]
- id: qn-solo-003
  text: 有沒有一個只屬於你自己的角落或時段？
  tags: [solitude]
- id: qn-solo-004
  text: 安靜下來的時候，你的腦海裡通常會浮現什麼？
  tags: [solitude]
- id: qn-solo-005
  text: 你會怎麼形容跟自己相處時的那份感覺？
  tags: [solitude]
- id: qn-solo-006
  text: 獨自散步時，你最常注意到周遭的哪些細節？
  tags: [solitude]
- id: qn-solo-007
  text: 一個人吃飯或看電影，對你是什麼樣的體驗？
  tags: [solitude]
- id: qn-solo-008
  text: 你有沒有一件只想一個人默默完成的事？
  tags: [solitude]
- id: qn-solo-009
  text: 在獨處的片刻，你最想聽見什麼聲音？
  tags: [solitude]
- id: qn-solo-010
  text: 當四周無人，你會對自己說些什麼？
  tags: [solitude]
- id: qn-solo-011
  text: 你是在什麼時候，開始享受一個人的時光？
  tags: [solitude]
- id: qn-solo-012
  text: 獨處讓你更認識自己的哪一部分？
  tags: [solitude]
- id: qn-solo-013
  text: 有哪個一個人度過的夜晚，讓你印象深刻？
  tags: [solitude]
- id: qn-solo-014
  text: 你會用什麼方式，把獨處的時間變得更豐富？
  tags: [solitude]
- id: qn-solo-015
  text: 一個人放空的時候，思緒最常飄去哪裡？
  tags: [solitude]
- id: qn-solo-016
  text: 你覺得獨處和寂寞之間，差別在哪裡？
  tags: [solitude]
- id: qn-solo-017
  text: 如果有一整天完全屬於自己，你想怎麼安排？
  tags: [solitude]
- id: qn-solo-018
  text: 在無人打擾時，你最容易想通哪一類的事？
  tags: [solitude]
- id: qn-solo-019
  text: 獨自面對自己的心情時，你會怎麼溫柔以待？
  tags: [solitude]
- id: qn-solo-020
  text: 跟自己獨處久了，你發現了什麼一直沒察覺的事？
  tags: [solitude]
