# 每日一問 · 作息與規律（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-routine-021
  text: 一天裡，你會在什麼時刻感覺「終於能喘口氣」？
  tags: [routine]
- id: qn-routine-022
  text: 你習慣在前一晚就決定隔天要穿什麼嗎？
  tags: [routine]
- id: qn-routine-023
  text: 讓你真正清醒過來的那杯飲料，通常出現在幾點？
  tags: [routine]
- id: qn-routine-024
  text: 天氣的變化，會怎麼牽動你一天的安排？
  tags: [routine]
- id: qn-routine-025
  text: 換季的時候，你的生活步調有什麼不一樣？
  tags: [routine]
- id: qn-routine-026
  text: 最需要專注的事，你會留到哪個時段來處理？
  tags: [routine]
- id: qn-routine-027
  text: 出門前的準備，你大概花多少時間？
  tags: [routine]
- id: qn-routine-028
  text: 一天結束時，你用什麼方式向自己道晚安？
  tags: [routine]
- id: qn-routine-029
  text: 通勤或移動的路上，你多半在做些什麼？
  tags: [routine]
- id: qn-routine-030
  text: 你有沒有一段固定拿來整理房間或環境的時間？
  tags: [routine]
- id: qn-routine-031
  text: 肚子餓的時候，你會先找什麼來墊一下？
  tags: [routine]
- id: qn-routine-032
  text: 生病的那幾天，你的日常會變成什麼模樣？
  tags: [routine]
- id: qn-routine-033
  text: 放長假時，你的生活節奏會往哪個方向偏移？
  tags: [routine]
- id: qn-routine-034
  text: 該做的事，你習慣寫下來，還是記在腦子裡？
  tags: [routine]
- id: qn-routine-035
  text: 早晨出門前，有沒有一個非做不可的小動作？
  tags: [routine]
- id: qn-routine-036
  text: 忙到一半，你會在哪個空檔想起要喝口水或伸展一下？
  tags: [routine]
- id: qn-routine-037
  text: 睡前你和手機之間，通常保持什麼樣的距離？
  tags: [routine]
- id: qn-routine-038
  text: 運動或走動的時間，你會怎麼塞進一天裡？
  tags: [routine]
- id: qn-routine-039
  text: 從忙碌切換到休息，你需要一段什麼樣的過渡？
  tags: [routine]
- id: qn-routine-040
  text: 一天當中，哪個瞬間讓你覺得節奏剛剛好？
  tags: [routine]
