# 每日一問 · 習性與怪癖。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-quirk-001
  text: 你有哪個小習慣，是別人覺得奇怪的？
  tags: [quirk]
- id: qn-quirk-002
  text: 睡前非做不可的一件事是什麼？
  tags: [quirk]
- id: qn-quirk-003
  text: 吃東西時，你會不會有一套自己的順序？
  tags: [quirk]
- id: qn-quirk-004
  text: 有沒有什麼聲音，是你聽了就渾身不對勁的？
  tags: [quirk]
- id: qn-quirk-005
  text: 走在路上，你會下意識避開或踩上某些東西嗎？
  tags: [quirk]
- id: qn-quirk-006
  text: 你收拾房間時，會從哪個角落開始動手？
  tags: [quirk]
- id: qn-quirk-007
  text: 手邊有筆，你會不自覺畫些什麼？
  tags: [quirk]
- id: qn-quirk-008
  text: 哪個食物的搭配，是你愛吃但別人一臉困惑的？
  tags: [quirk]
- id: qn-quirk-009
  text: 專注的時候，你的身體會出現什麼小動作？
  tags: [quirk]
- id: qn-quirk-010
  text: 你有沒有一個只在獨處時才會做的怪動作？
  tags: [quirk]
- id: qn-quirk-011
  text: 東西擺得不整齊，哪一種會讓你忍不住想動手調？
  tags: [quirk]
- id: qn-quirk-012
  text: 洗澡的時候，你腦袋裡通常在轉什麼？
  tags: [quirk]
- id: qn-quirk-013
  text: 你會對哪些日常物品默默取綽號？
  tags: [quirk]
- id: qn-quirk-014
  text: 排隊或等紅燈時，你會用什麼方式打發那幾分鐘？
  tags: [quirk]
- id: qn-quirk-015
  text: 有哪句口頭禪，是你自己都沒發現常掛在嘴邊的？
  tags: [quirk]
- id: qn-quirk-016
  text: 遇到卡住的瓶蓋或包裝，你會用什麼奇招對付？
  tags: [quirk]
- id: qn-quirk-017
  text: 你對水的溫度、燈的亮度，有沒有很挑剔的堅持？
  tags: [quirk]
- id: qn-quirk-018
  text: 心情好的時候，你會不自覺哼起哪類旋律？
  tags: [quirk]
- id: qn-quirk-019
  text: 買回家後總是捨不得丟掉的，是哪一種小東西？
  tags: [quirk]
- id: qn-quirk-020
  text: 從小到大，哪個怪癖一直跟著你沒變過？
  tags: [quirk]
