# 每日一問 · 工作與創作（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-work-021
  text: 別人看你的作品時，你最希望他們先注意到哪個部分？
  tags: [work]
- id: qn-work-022
  text: 你怎麼看待把還沒完成的東西拿給別人看這件事？
  tags: [work]
- id: qn-work-023
  text: 有沒有一種工具或材料，用起來就讓你特別安心？
  tags: [work]
- id: qn-work-024
  text: 遇到跟你想法很不一樣的合作對象，你會怎麼跟他磨合？
  tags: [work]
- id: qn-work-025
  text: 你的靈感通常是在什麼情況下冒出來的？
  tags: [work]
- id: qn-work-026
  text: 一件作品完成之後，你會隔多久才敢再回頭看它？
  tags: [work]
- id: qn-work-027
  text: 如果要教一個新手你最擅長的事，你會從哪裡講起？
  tags: [work]
- id: qn-work-028
  text: 你怎麼分辨「這是我的風格」和「這只是我的習慣」？
  tags: [work]
- id: qn-work-029
  text: 手上這件事，如果沒有截止時間，你會想做成什麼樣子？
  tags: [work]
- id: qn-work-030
  text: 有哪一次失敗的嘗試，反而給了你意外的收穫？
  tags: [work]
- id: qn-work-031
  text: 你在意作品被人記住，還是在意做的當下自己過癮？
  tags: [work]
- id: qn-work-032
  text: 面對一張空白的紙或畫面，你第一筆會先放什麼？
  tags: [work]
- id: qn-work-033
  text: 有沒有一個領域，你一直很好奇卻還沒敢踏進去？
  tags: [work]
- id: qn-work-034
  text: 你怎麼決定一件事要親自做，還是交給別人？
  tags: [work]
- id: qn-work-035
  text: 讓你願意重做一遍的理由，通常是什麼？
  tags: [work]
- id: qn-work-036
  text: 你的工作裡，哪一部分是外人很難想像的？
  tags: [work]
- id: qn-work-037
  text: 如果把你做過的東西排成一排，你會看見什麼樣的變化？
  tags: [work]
- id: qn-work-038
  text: 靈感枯竭的日子，你會去哪裡找回感覺？
  tags: [work]
- id: qn-work-039
  text: 你比較享受從無到有，還是把既有的東西修得更好？
  tags: [work]
- id: qn-work-040
  text: 十年後回頭看今天的作品，你猜自己會怎麼評價？
  tags: [work]
