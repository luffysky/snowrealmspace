# 每日一問 · 動手修理（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fix-021
  text: 拆開一樣東西後，你多半能原樣裝回去，還是常剩幾顆螺絲？
  tags: [fix]
- id: qn-fix-022
  text: 有沒有一種聲音或氣味，讓你一聽一聞就知道哪裡出了狀況？
  tags: [fix]
- id: qn-fix-023
  text: 動手之前，你會先把零件排好、拍張照，還是邊拆邊記？
  tags: [fix]
- id: qn-fix-024
  text: 修東西時弄髒了手，那種感覺對你來說是什麼樣的？
  tags: [fix]
- id: qn-fix-025
  text: 有沒有哪次，你用了完全不搭的替代品，卻意外湊合成功？
  tags: [fix]
- id: qn-fix-026
  text: 面對一台完全不懂的機器，你會從外觀哪裡開始摸索？
  tags: [fix]
- id: qn-fix-027
  text: 家裡那個放工具的角落或抽屜，藏著什麼樣的故事？
  tags: [fix]
- id: qn-fix-028
  text: 修好之後，你會告訴別人是你弄的，還是默默看它運作？
  tags: [fix]
- id: qn-fix-029
  text: 有沒有一樣東西，明明修不划算，你還是想親手救它一次？
  tags: [fix]
- id: qn-fix-030
  text: 幫別人修東西和修自己的，兩種心情差在哪裡？
  tags: [fix]
- id: qn-fix-031
  text: 卡在某個步驟很久之後，靈光一閃解開的那一刻像什麼？
  tags: [fix]
- id: qn-fix-032
  text: 你會不會捨不得丟掉那些早就用不上的舊零件？
  tags: [fix]
- id: qn-fix-033
  text: 對你而言，一件工具用久了，是不是也多了點感情？
  tags: [fix]
- id: qn-fix-034
  text: 有沒有哪個修理小訣竅，是你自己摸索出來的？
  tags: [fix]
- id: qn-fix-035
  text: 遇到黏死、鏽死、卡死的零件，你通常怎麼跟它耗？
  tags: [fix]
- id: qn-fix-036
  text: 你偏好把東西修到看不出痕跡，還是留下修補過的樣子？
  tags: [fix]
- id: qn-fix-037
  text: 小時候有沒有拆過什麼東西，結果再也裝不回去的？
  tags: [fix]
- id: qn-fix-038
  text: 如果能無師自通一項修繕手藝，你最想擁有哪一種？
  tags: [fix]
- id: qn-fix-039
  text: 你身邊有沒有一個修東西特別厲害、讓你佩服的人？
  tags: [fix]
- id: qn-fix-040
  text: 把一件老東西重新救活，對你來說意味著什麼？
  tags: [fix]
