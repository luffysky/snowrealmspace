# 每日一問 · 青春期與年少。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-teen-001
  text: 十幾歲的你，最在意別人怎麼看你哪一點？
  tags: [teen]
- id: qn-teen-002
  text: 那時候有沒有一首歌，被你反覆聽到爛熟？
  tags: [teen]
- id: qn-teen-003
  text: 青春期的你，房間牆上貼著什麼？
  tags: [teen]
- id: qn-teen-004
  text: 有哪件事，是你當年拚了命想讓大人理解的？
  tags: [teen]
- id: qn-teen-005
  text: 少年時代的你，偷偷崇拜著誰？
  tags: [teen]
- id: qn-teen-006
  text: 回想起來，那時的你最想快點長大的原因是什麼？
  tags: [teen]
- id: qn-teen-007
  text: 十五歲的你，如果看到現在的自己，會說什麼？
  tags: [teen]
- id: qn-teen-008
  text: 青春期裡，哪一次的難堪讓你至今還記得？
  tags: [teen]
- id: qn-teen-009
  text: 那個年紀的你，把什麼當成天大的事？
  tags: [teen]
- id: qn-teen-010
  text: 年少時的你，最想擁有卻得不到的是什麼？
  tags: [teen]
- id: qn-teen-011
  text: 十幾歲時，你和爸媽最常為了什麼僵持不下？
  tags: [teen]
- id: qn-teen-012
  text: 那段日子裡，哪個地方是你的秘密基地？
  tags: [teen]
- id: qn-teen-013
  text: 青春期的你，寫過或想過寫給誰的信？
  tags: [teen]
- id: qn-teen-014
  text: 少年的你，第一次感覺自己「不再是小孩」是什麼時候？
  tags: [teen]
- id: qn-teen-015
  text: 那時候的你，偷偷煩惱著身體的哪個變化？
  tags: [teen]
- id: qn-teen-016
  text: 十幾歲的你，最想融入哪一群人？
  tags: [teen]
- id: qn-teen-017
  text: 回頭看，那個年紀的你其實比想像中勇敢在哪裡？
  tags: [teen]
- id: qn-teen-018
  text: 青春期的你，夜裡躺著會想些什麼？
  tags: [teen]
- id: qn-teen-019
  text: 年少的你，曾經對未來有過什麼樣的想像？
  tags: [teen]
- id: qn-teen-020
  text: 如果能陪十六歲的自己走一段路，你想告訴他什麼？
  tags: [teen]
