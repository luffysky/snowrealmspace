# 每日一問 · 學習（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-learn-021
  text: 你是靠什麼方式，最容易把一件事記住？
  tags: [learn]
- id: qn-learn-022
  text: 有沒有一項技能，是看著別人做才學會的？
  tags: [learn]
- id: qn-learn-023
  text: 誰是你人生裡意想不到的老師？
  tags: [learn]
- id: qn-learn-024
  text: 有什麼事，你曾經以為很難，後來發現其實還好？
  tags: [learn]
- id: qn-learn-025
  text: 你最近重新理解了哪個以前背過、卻沒真懂的概念？
  tags: [learn]
- id: qn-learn-026
  text: 如果要教別人一件你擅長的事，你會從哪裡開始講？
  tags: [learn]
- id: qn-learn-027
  text: 有哪個科目或領域，你以前不喜歡、現在卻有點想碰？
  tags: [learn]
- id: qn-learn-028
  text: 上一次因為犯錯而學到東西，是什麼樣的錯？
  tags: [learn]
- id: qn-learn-029
  text: 你比較喜歡跟著步驟學，還是自己邊做邊摸索？
  tags: [learn]
- id: qn-learn-030
  text: 有什麼是你用手做過一次，就再也忘不掉的？
  tags: [learn]
- id: qn-learn-031
  text: 小孩問過你哪個問題，讓你一時答不上來？
  tags: [learn]
- id: qn-learn-032
  text: 有沒有一句話或一個觀念，改變了你看事情的角度？
  tags: [learn]
- id: qn-learn-033
  text: 你曾經放棄學某樣東西，現在偶爾還會想起它嗎？
  tags: [learn]
- id: qn-learn-034
  text: 如果可以花一整年只鑽研一件事，你會挑什麼？
  tags: [learn]
- id: qn-learn-035
  text: 有什麼知識，是你從陌生人那裡偶然得到的？
  tags: [learn]
- id: qn-learn-036
  text: 你學一樣新東西時，最享受哪個階段？
  tags: [learn]
- id: qn-learn-037
  text: 有沒有一種技能，你以前會、現在卻生疏了？
  tags: [learn]
- id: qn-learn-038
  text: 你怎麼分辨自己是「真的懂」還是「只是聽過」？
  tags: [learn]
- id: qn-learn-039
  text: 如果不為了任何用途，你想純粹了解什麼？
  tags: [learn]
- id: qn-learn-040
  text: 最近哪個影片、文章或對話，讓你多知道了一點世界？
  tags: [learn]
