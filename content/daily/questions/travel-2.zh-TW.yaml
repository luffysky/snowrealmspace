# 每日一問 · 旅行與探索（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-travel-021
  text: 出發前的打包過程，對你來說是期待還是煩惱？
  tags: [travel]
- id: qn-travel-022
  text: 抵達一個新地方時，你會先靠哪種感官去認識它？
  tags: [travel]
- id: qn-travel-023
  text: 你曾經因為一張照片或一句話，就決定去某個地方嗎？
  tags: [travel]
- id: qn-travel-024
  text: 在異地醒來的第一個早晨，你腦中通常想些什麼？
  tags: [travel]
- id: qn-travel-025
  text: 如果旅程中多出一整天空檔，你會怎麼填滿它？
  tags: [travel]
- id: qn-travel-026
  text: 你比較願意花時間逛市場，還是走進博物館？
  tags: [travel]
- id: qn-travel-027
  text: 語言不通的時候，你都靠什麼方式和當地人溝通？
  tags: [travel]
- id: qn-travel-028
  text: 旅途上遇過的哪一次天氣，反而成了難忘的回憶？
  tags: [travel]
- id: qn-travel-029
  text: 你會替旅行帶回什麼，來留住那段時光？
  tags: [travel]
- id: qn-travel-030
  text: 出門在外遇上計畫全被打亂，你會怎麼看待這種情況？
  tags: [travel]
- id: qn-travel-031
  text: 有沒有一個地方，去之前和去之後的想像差很多？
  tags: [travel]
- id: qn-travel-032
  text: 你偏好每天換一個城市，還是待在同一處慢慢待著？
  tags: [travel]
- id: qn-travel-033
  text: 旅行中哪一個當地習慣，讓你想帶回日常生活裡？
  tags: [travel]
- id: qn-travel-034
  text: 夜晚的陌生街道，對你是吸引還是有點卻步？
  tags: [travel]
- id: qn-travel-035
  text: 你有沒有在某趟旅程中，重新認識了自己的一面？
  tags: [travel]
- id: qn-travel-036
  text: 比起知名景點，哪一種不起眼的角落更能吸引你停留？
  tags: [travel]
- id: qn-travel-037
  text: 回程的路上，你心裡通常是什麼樣的滋味？
  tags: [travel]
- id: qn-travel-038
  text: 如果要帶一個人一起去旅行，你會想找誰同行？
  tags: [travel]
- id: qn-travel-039
  text: 你會在旅途中留下文字或紀錄嗎，都寫些什麼？
  tags: [travel]
- id: qn-travel-040
  text: 對現在的你而言，出走一趟是為了尋找還是為了放下？
  tags: [travel]
