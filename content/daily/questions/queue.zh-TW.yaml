# 每日一問 · 排隊與等候。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-queue-001
  text: 排隊等待的時候，你都在做些什麼？
  tags: [queue]
- id: qn-queue-002
  text: 一條隊伍要多長，你才會考慮放棄？
  tags: [queue]
- id: qn-queue-003
  text: 有沒有一次排隊，讓你到現在都印象深刻？
  tags: [queue]
- id: qn-queue-004
  text: 等候的時候，什麼事情最容易讓你分心？
  tags: [queue]
- id: qn-queue-005
  text: 你會為了什麼，願意排上很久的隊？
  tags: [queue]
- id: qn-queue-006
  text: 前面的人動作很慢時，你心裡通常怎麼想？
  tags: [queue]
- id: qn-queue-007
  text: 等紅綠燈的那幾十秒，你腦中在想什麼？
  tags: [queue]
- id: qn-queue-008
  text: 比起排隊，你更受不了哪一種等待？
  tags: [queue]
- id: qn-queue-009
  text: 有什麼小方法，能讓等待變得沒那麼難熬？
  tags: [queue]
- id: qn-queue-010
  text: 赴約時，你習慣提早到，還是壓線才出現？
  tags: [queue]
- id: qn-queue-011
  text: 待在等候室裡，你會怎麼打發時間？
  tags: [queue]
- id: qn-queue-012
  text: 有一次等太久而快沒耐性，是在什麼場合？
  tags: [queue]
- id: qn-queue-013
  text: 排隊時碰到有人插隊，你會出聲嗎？
  tags: [queue]
- id: qn-queue-014
  text: 對你來說，怎樣的等待最讓人安心？
  tags: [queue]
- id: qn-queue-015
  text: 在等一個人赴約時，你的心情是什麼樣子？
  tags: [queue]
- id: qn-queue-016
  text: 排了很久才買到的東西，會因此感覺更特別嗎？
  tags: [queue]
- id: qn-queue-017
  text: 網頁載入很慢的那幾秒，你會做什麼？
  tags: [queue]
- id: qn-queue-018
  text: 你覺得自己算是很能等，還是挺沒耐性的人？
  tags: [queue]
- id: qn-queue-019
  text: 有沒有一段等待，事後回想覺得很值得？
  tags: [queue]
- id: qn-queue-020
  text: 該輪到你卻臨時被延後，你會怎麼反應？
  tags: [queue]
