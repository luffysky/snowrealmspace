# 每日一問 · 羨慕與比較（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-envy-021
  text: 有沒有一種才華，你看著別人揮灑時心裡會泛起一絲嚮往？
  tags: [envy]
- id: qn-envy-022
  text: 你羨慕的那個人，身上是不是也藏著你正在努力的方向？
  tags: [envy]
- id: qn-envy-023
  text: 當比較悄悄冒出來時，你通常在心裡對自己說些什麼？
  tags: [envy]
- id: qn-envy-024
  text: 有哪一種從容的模樣，是你偶爾希望自己也能自然流露的？
  tags: [envy]
- id: qn-envy-025
  text: 你覺得有時候羨慕的，會不會其實是對方擁有的某段時光？
  tags: [envy]
- id: qn-envy-026
  text: 若把注意力從別人身上收回來，你最想先看看自己的哪裡？
  tags: [envy]
- id: qn-envy-027
  text: 別人擁有而你暫時沒有的東西裡，哪一樣讓你最有感覺？
  tags: [envy]
- id: qn-envy-028
  text: 你會在什麼樣的心情下，特別容易被別人的光亮吸引？
  tags: [envy]
- id: qn-envy-029
  text: 有沒有一次比較，讓你後來反而更清楚自己想要什麼？
  tags: [envy]
- id: qn-envy-030
  text: 你怎麼看待「羨慕」這種心情，它對你來說是敵人還是提醒？
  tags: [envy]
- id: qn-envy-031
  text: 有哪一種生活的樣子，你欣賞，卻也知道那未必是你的路？
  tags: [envy]
- id: qn-envy-032
  text: 當你發現有人也在羨慕你時，那一刻你心裡的感覺是什麼？
  tags: [envy]
- id: qn-envy-033
  text: 你比較容易羨慕別人的成就，還是他們相處時的自在？
  tags: [envy]
- id: qn-envy-034
  text: 有沒有一項你早已擁有的東西，是別人正默默盼望著的？
  tags: [envy]
- id: qn-envy-035
  text: 若把一次比較拆開來看，最底下藏著的是你在意的什麼？
  tags: [envy]
- id: qn-envy-036
  text: 你覺得在哪一個領域裡，自己其實不太需要和誰較量？
  tags: [envy]
- id: qn-envy-037
  text: 看著別人走得比較快時，你會怎麼陪自己的步調待著？
  tags: [envy]
- id: qn-envy-038
  text: 有沒有一種安靜的滿足，是比較從來拿不走的？
  tags: [envy]
- id: qn-envy-039
  text: 如果羨慕能轉化成一句給自己的祝福，你會怎麼寫下它？
  tags: [envy]
- id: qn-envy-040
  text: 對你而言，怎樣的時候你最能單純地為別人的好而開心？
  tags: [envy]
