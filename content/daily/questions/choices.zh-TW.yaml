# 每日一問 · 選擇／身體感受。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: q-choice-001
  text: 今天有沒有一個小決定，其實你很滿意？
  tags: [choice]
- id: q-choice-002
  text: 如果可以只做一件事，你會留下哪件？
  tags: [choice]
- id: q-choice-003
  text: 最近你放下了什麼，現在覺得如何？
  tags: [choice]
- id: q-choice-004
  text: 有沒有一件事，你一直在等一個「剛好」的時機？
  tags: [choice]
- id: q-choice-005
  text: 如果今天多出一小時，你會給誰或給什麼？
  tags: [choice]
- id: q-choice-006
  text: 你上一次改變主意，是為了什麼？
  tags: [choice]
- id: q-choice-007
  text: 有沒有一個選項，你其實早就知道答案？
  tags: [choice]
- id: q-choice-008
  text: 現在的你，最想對哪件事說「不」？
  tags: [choice]
- id: q-choice-009
  text: 如果不用顧慮別人眼光，你今天會怎麼過？
  tags: [choice]
- id: q-choice-010
  text: 你最近一次說「好」，是心甘情願的嗎？
  tags: [choice]
- id: q-feel-001
  text: 此刻你的身體，哪個部位最想被放鬆？
  tags: [body]
- id: q-feel-002
  text: 今天你有好好吃一頓飯嗎？
  tags: [body]
- id: q-feel-003
  text: 你上一次深呼吸，是什麼時候？
  tags: [body]
- id: q-feel-004
  text: 如果累是一種顏色，今天的你是什麼色？
  tags: [body]
- id: q-feel-005
  text: 現在的你，比較想睡、想動、還是想靜？
  tags: [body]
- id: q-feel-006
  text: 今天有哪個瞬間，讓你覺得放鬆下來？
  tags: [body]
- id: q-feel-007
  text: 你的肩膀現在是鬆的，還是緊的？
  tags: [body]
- id: q-feel-008
  text: 最近有沒有一種味道，讓你特別安心？
  tags: [body]
- id: q-feel-009
  text: 如果身體會說話，它今天想跟你講什麼？
  tags: [body]
- id: q-feel-010
  text: 今天你給自己喝了幾杯水？
  tags: [body]
