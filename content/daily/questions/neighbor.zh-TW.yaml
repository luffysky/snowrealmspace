# 每日一問 · 鄰居與社區。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-neighbor-001
  text: 你叫得出隔壁鄰居的名字嗎？
  tags: [neighbor]
- id: qn-neighbor-002
  text: 住的地方附近，有沒有一位讓你印象特別深的鄰居？
  tags: [neighbor]
- id: qn-neighbor-003
  text: 跟鄰居在電梯或門口相遇時，你們通常會聊些什麼？
  tags: [neighbor]
- id: qn-neighbor-004
  text: 你家這一帶，有沒有一間大家都會去的老店？
  tags: [neighbor]
- id: qn-neighbor-005
  text: 曾經有鄰居幫過你一個小忙嗎，那是什麼樣的情況？
  tags: [neighbor]
- id: qn-neighbor-006
  text: 你理想中的鄰里關係，會是親近一點還是保持距離？
  tags: [neighbor]
- id: qn-neighbor-007
  text: 社區裡有沒有哪個角落，是大家喜歡聚在一起的地方？
  tags: [neighbor]
- id: qn-neighbor-008
  text: 你家附近那隻常出沒的貓或狗，你有沒有替牠取過名字？
  tags: [neighbor]
- id: qn-neighbor-009
  text: 剛搬到一個新社區時，你會怎麼慢慢熟悉周遭的人？
  tags: [neighbor]
- id: qn-neighbor-010
  text: 你們這棟或這條巷子，有沒有流傳著什麼小故事？
  tags: [neighbor]
- id: qn-neighbor-011
  text: 早市或黃昏市場裡，有沒有一個攤販你固定會光顧？
  tags: [neighbor]
- id: qn-neighbor-012
  text: 如果社區要辦一場活動，你會想參加哪一種？
  tags: [neighbor]
- id: qn-neighbor-013
  text: 你住的地方，白天和夜晚的氣氛差別大嗎？
  tags: [neighbor]
- id: qn-neighbor-014
  text: 有沒有一位鄰居長輩，讓你覺得像自家人一樣？
  tags: [neighbor]
- id: qn-neighbor-015
  text: 社區裡最讓你感到安心的，是哪一個畫面或聲音？
  tags: [neighbor]
- id: qn-neighbor-016
  text: 你會不會跟鄰居分享自家做的食物或多出來的東西？
  tags: [neighbor]
- id: qn-neighbor-017
  text: 附近有沒有一條你散步時最常走的路線？
  tags: [neighbor]
- id: qn-neighbor-018
  text: 你覺得一個社區的人情味，通常從哪些小地方看得出來？
  tags: [neighbor]
- id: qn-neighbor-019
  text: 搬離舊社區之後，你最懷念那裡的什麼？
  tags: [neighbor]
- id: qn-neighbor-020
  text: 如果能為住的這一帶許一個願望，你會希望它變得怎樣？
  tags: [neighbor]
