# 每日一問 · 名字與稱呼（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-name-021
  text: 你的名字用另一種語言念出來，會是什麼樣子？
  tags: [name]
- id: qn-name-022
  text: 如果名字是一種顏色或季節，你的會是哪一種？
  tags: [name]
- id: qn-name-023
  text: 你比較喜歡自己的名字被寫下來，還是被念出來？
  tags: [name]
- id: qn-name-024
  text: 你有沒有替自己取過一個只給自己用的稱呼？
  tags: [name]
- id: qn-name-025
  text: 對於自己的姓氏，你抱著什麼樣的感覺？
  tags: [name]
- id: qn-name-026
  text: 父母當初有沒有考慮過別的名字，那個名字你喜歡嗎？
  tags: [name]
- id: qn-name-027
  text: 被人用職稱或輩分稱呼時，你心裡是什麼滋味？
  tags: [name]
- id: qn-name-028
  text: 你覺得自己的名字，和你的個性合得來嗎？
  tags: [name]
- id: qn-name-029
  text: 有沒有哪一種稱呼，是你怎樣都不想被套上的？
  tags: [name]
- id: qn-name-030
  text: 第一次見面的人，常把你的名字猜成什麼？
  tags: [name]
- id: qn-name-031
  text: 在工作場合和在家裡，別人對你的稱呼有什麼不同？
  tags: [name]
- id: qn-name-032
  text: 簽名的時候，你會怎麼寫下自己的名字？
  tags: [name]
- id: qn-name-033
  text: 有沒有一種暱稱，是你私心希望某個人這樣叫你的？
  tags: [name]
- id: qn-name-034
  text: 什麼樣的名字，會讓你一聽就很難忘記？
  tags: [name]
- id: qn-name-035
  text: 你知道自己名字字面上的意思嗎，那個意思你喜歡嗎？
  tags: [name]
- id: qn-name-036
  text: 生氣時被人連名帶姓地叫，你會有什麼反應？
  tags: [name]
- id: qn-name-037
  text: 需要自我介紹時，你習慣怎麼把名字說出口？
  tags: [name]
- id: qn-name-038
  text: 有沒有一個名字，會讓你想起某個特定的地方？
  tags: [name]
- id: qn-name-039
  text: 如果要在筆名和本名之間選一個示人，你會選哪個？
  tags: [name]
- id: qn-name-040
  text: 現在的你，和小時候的你，對自己名字的感覺變了嗎？
  tags: [name]
