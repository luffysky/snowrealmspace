# 每日一問 · 音樂與感官。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sense-001
  text: 最近一首讓你想單曲循環的歌，是哪一首？
  tags: [senses]
- id: qn-sense-002
  text: 有哪一種聲音，一聽到就能讓你放鬆下來？
  tags: [senses]
- id: qn-sense-003
  text: 今天你嚐到的味道裡，哪一個最讓你記得？
  tags: [senses]
- id: qn-sense-004
  text: 如果要用一種樂器代表現在的心情，你會選什麼？
  tags: [senses]
- id: qn-sense-005
  text: 你喜歡的觸感，是柔軟、粗糙，還是別的什麼？
  tags: [senses]
- id: qn-sense-006
  text: 哪一種氣味，會突然把你帶回某個地方或某段時光？
  tags: [senses]
- id: qn-sense-007
  text: 一天當中，你最想聽見的是哪種聲音？
  tags: [senses]
- id: qn-sense-008
  text: 最近有沒有一段旋律，一直在你腦中繞著？
  tags: [senses]
- id: qn-sense-009
  text: 你偏好安靜的環境，還是有一點背景聲音？
  tags: [senses]
- id: qn-sense-010
  text: 如果替今天配一首背景音樂，你會挑什麼風格？
  tags: [senses]
- id: qn-sense-011
  text: 哪一種食物的口感，是你會特別想念的？
  tags: [senses]
- id: qn-sense-012
  text: 此刻若能聞到一種香味，你希望是什麼？
  tags: [senses]
- id: qn-sense-013
  text: 你手邊有什麼東西，摸起來的感覺讓你喜歡？
  tags: [senses]
- id: qn-sense-014
  text: 哪一首歌會讓你不自覺跟著哼或打拍子？
  tags: [senses]
- id: qn-sense-015
  text: 對你來說，雨聲聽起來是什麼樣的感覺？
  tags: [senses]
- id: qn-sense-016
  text: 你最喜歡的一種飲料，喝下去的第一口是什麼味道？
  tags: [senses]
- id: qn-sense-017
  text: 有哪個人的聲音，是你聽了會覺得安心的？
  tags: [senses]
- id: qn-sense-018
  text: 如果閉上眼睛只用耳朵，此刻你會聽見幾種聲音？
  tags: [senses]
- id: qn-sense-019
  text: 陽光曬在皮膚上的感覺，對你來說像什麼？
  tags: [senses]
- id: qn-sense-020
  text: 哪一種聲音或音樂，能幫你進入專注的狀態？
  tags: [senses]
