# 每日一問 · 手作與 DIY。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-craft-001
  text: 你上一次動手做東西，是做了什麼？
  tags: [craft]
- id: qn-craft-002
  text: 有沒有一種材料，光是摸到它就讓你想開始創作？
  tags: [craft]
- id: qn-craft-003
  text: 如果桌上現在有一堆廢紙箱，你會把它變成什麼？
  tags: [craft]
- id: qn-craft-004
  text: 對你來說，親手做的東西和買現成的差在哪裡？
  tags: [craft]
- id: qn-craft-005
  text: 學一項新手藝時，最讓你著迷的是哪個環節？
  tags: [craft]
- id: qn-craft-006
  text: 你做過最花時間的一件作品，是什麼樣子的？
  tags: [craft]
- id: qn-craft-007
  text: 當作品和你想像的不一樣時，你通常會怎麼看待這個結果？
  tags: [craft]
- id: qn-craft-008
  text: 有哪件工具是你用久了、特別順手的？
  tags: [craft]
- id: qn-craft-009
  text: 如果要教別人一個小手作，你最想分享哪一個？
  tags: [craft]
- id: qn-craft-010
  text: 動手做的過程裡，哪一刻會讓你忘了時間？
  tags: [craft]
- id: qn-craft-011
  text: 你會把手作的成品留著、送人，還是自己用？
  tags: [craft]
- id: qn-craft-012
  text: 童年時期做過的勞作，還有哪一件留在你記憶裡？
  tags: [craft]
- id: qn-craft-013
  text: 面對一張空白的材料，你是先計劃還是先下手？
  tags: [craft]
- id: qn-craft-014
  text: 有沒有一種顏色或質地，是你手作時特別偏愛的？
  tags: [craft]
- id: qn-craft-015
  text: 修理一件壞掉的東西，和從零做一件新的，哪種感覺你更喜歡？
  tags: [craft]
- id: qn-craft-016
  text: 你曾經想挑戰、卻還沒開始的手作是什麼？
  tags: [craft]
- id: qn-craft-017
  text: 完成一件作品後，你會怎麼慶祝那個瞬間？
  tags: [craft]
- id: qn-craft-018
  text: 手作時放的音樂或環境，對你來說重要嗎？
  tags: [craft]
- id: qn-craft-019
  text: 如果家裡有一個角落專門給你做東西，你希望它長什麼樣子？
  tags: [craft]
- id: qn-craft-020
  text: 你覺得一件手作作品裡，最能透露做的人是誰的地方在哪？
  tags: [craft]
