# 每日一問 · 童年與回憶。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-memory-001
  text: 小時候哪個地方，你現在還記得很清楚？
  tags: [memory]
- id: qn-memory-002
  text: 童年時有沒有一種味道，聞到就會把你帶回某個瞬間？
  tags: [memory]
- id: qn-memory-003
  text: 你記憶裡第一個要好的朋友，是怎麼認識的？
  tags: [memory]
- id: qn-memory-004
  text: 小時候家裡有沒有一樣東西，你到現在還印象深刻？
  tags: [memory]
- id: qn-memory-005
  text: 有沒有一首歌或一段旋律，一聽到就想起某段童年時光？
  tags: [memory]
- id: qn-memory-006
  text: 你小時候最常玩的遊戲是什麼，都跟誰一起玩？
  tags: [memory]
- id: qn-memory-007
  text: 回想起來，童年裡哪一頓飯或哪道菜讓你特別難忘？
  tags: [memory]
- id: qn-memory-008
  text: 小時候你最喜歡待在家裡的哪個角落？
  tags: [memory]
- id: qn-memory-009
  text: 有沒有一位長輩說過的話，你到現在還記得？
  tags: [memory]
- id: qn-memory-010
  text: 你童年時養過或想養的動物，後來怎麼了？
  tags: [memory]
- id: qn-memory-011
  text: 小時候放學後的那段時間，你通常都在做什麼？
  tags: [memory]
- id: qn-memory-012
  text: 有哪一次生日或節日，是你童年裡特別鮮明的？
  tags: [memory]
- id: qn-memory-013
  text: 你記得自己第一次覺得「好像長大了」是什麼時候嗎？
  tags: [memory]
- id: qn-memory-014
  text: 小時候有沒有一個你很崇拜的人？
  tags: [memory]
- id: qn-memory-015
  text: 童年裡有沒有一個祕密基地，只有你或幾個人知道？
  tags: [memory]
- id: qn-memory-016
  text: 你小時候最怕的東西是什麼？
  tags: [memory]
- id: qn-memory-017
  text: 有沒有一件小時候的衣服、玩具或書，你一直捨不得丟？
  tags: [memory]
- id: qn-memory-018
  text: 回頭看，童年裡哪一段時光你最想再經歷一次？
  tags: [memory]
- id: qn-memory-019
  text: 小時候你家附近的街道或風景，長什麼樣子？
  tags: [memory]
- id: qn-memory-020
  text: 有沒有一句家人常掛在嘴邊的話，成了你童年的背景音？
  tags: [memory]
