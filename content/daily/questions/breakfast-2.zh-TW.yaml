# 每日一問 · 早餐與第一餐（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-breakfast-021
  text: 早晨第一口食物入口的那個味道，會影響你一整天的感覺嗎？
  tags: [breakfast]
- id: qn-breakfast-022
  text: 你點早餐時，是每次都換花樣，還是幾乎都點同一樣？
  tags: [breakfast]
- id: qn-breakfast-023
  text: 一份剛煎好、還冒著熱氣的蛋餅，會讓你聯想到哪個場景？
  tags: [breakfast]
- id: qn-breakfast-024
  text: 你偏好邊走邊吃的早餐，還是坐下來慢慢享用的那種？
  tags: [breakfast]
- id: qn-breakfast-025
  text: 早餐店老闆記得你的口味，那是一種怎麼樣的感覺？
  tags: [breakfast]
- id: qn-breakfast-026
  text: 如果早晨只能配一種聲音吃飯，你想聽什麼？
  tags: [breakfast]
- id: qn-breakfast-027
  text: 甜的和鹹的早餐擺在你面前，你的手會先伸向哪一邊？
  tags: [breakfast]
- id: qn-breakfast-028
  text: 有沒有一種早餐的香味，一飄過來就能把你叫醒？
  tags: [breakfast]
- id: qn-breakfast-029
  text: 你會為早餐特地擺盤，還是覺得順手吃完就好？
  tags: [breakfast]
- id: qn-breakfast-030
  text: 和別人一起吃早餐，跟一個人吃，氣氛差在哪裡？
  tags: [breakfast]
- id: qn-breakfast-031
  text: 假如要幫自己設計一份完美早餐，你會擺上哪三樣？
  tags: [breakfast]
- id: qn-breakfast-032
  text: 早餐配的那杯飲料，是熱的還是冰的，比較合你的口味？
  tags: [breakfast]
- id: qn-breakfast-033
  text: 有沒有一間早已收掉的早餐店，是你偶爾還會想起的？
  tags: [breakfast]
- id: qn-breakfast-034
  text: 你記憶中，哪一頓早餐是在很特別的地方吃的？
  tags: [breakfast]
- id: qn-breakfast-035
  text: 早晨的餐桌上，你最喜歡聞到的是哪一種味道？
  tags: [breakfast]
- id: qn-breakfast-036
  text: 如果早餐可以永遠留住一種口味，你想留哪一種？
  tags: [breakfast]
- id: qn-breakfast-037
  text: 準備給別人的早餐，跟做給自己吃的，你會有什麼不同？
  tags: [breakfast]
- id: qn-breakfast-038
  text: 你心中一頓理想早餐的時間，大概落在幾點？
  tags: [breakfast]
- id: qn-breakfast-039
  text: 童年餐桌上那份早餐，現在還能在哪裡找到相近的味道嗎？
  tags: [breakfast]
- id: qn-breakfast-040
  text: 換個季節、換個城市，你想吃的第一餐會跟著改變嗎？
  tags: [breakfast]
