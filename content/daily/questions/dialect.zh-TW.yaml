# 每日一問 · 口音與說話腔調。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-dialect-001
  text: 你喜歡自己說話的腔調嗎？
  tags: [dialect]
- id: qn-dialect-002
  text: 聽到哪一種口音，會讓你莫名覺得親切？
  tags: [dialect]
- id: qn-dialect-003
  text: 有沒有一句家鄉話，是你特別想留下來的？
  tags: [dialect]
- id: qn-dialect-004
  text: 你會因為對象不同，而調整自己說話的方式嗎？
  tags: [dialect]
- id: qn-dialect-005
  text: 小時候家裡的人講話，聽起來是什麼樣的味道？
  tags: [dialect]
- id: qn-dialect-006
  text: 有哪個詞或說法，只有你們那邊的人才懂？
  tags: [dialect]
- id: qn-dialect-007
  text: 別人模仿你的口音時，你會有什麼反應？
  tags: [dialect]
- id: qn-dialect-008
  text: 對你而言，腔調透露了一個人的哪些事？
  tags: [dialect]
- id: qn-dialect-009
  text: 你有沒有偷偷學過某種說話腔調？
  tags: [dialect]
- id: qn-dialect-010
  text: 用母語和用外語說話時，你覺得自己有什麼不同？
  tags: [dialect]
- id: qn-dialect-011
  text: 哪一種語言的聲音，最能打動你的耳朵？
  tags: [dialect]
- id: qn-dialect-012
  text: 你身邊有沒有誰的說話方式，讓你印象特別深？
  tags: [dialect]
- id: qn-dialect-013
  text: 換到新環境後，你的說話習慣有跟著改變嗎？
  tags: [dialect]
- id: qn-dialect-014
  text: 對你來說，鄉音代表的是什麼？
  tags: [dialect]
- id: qn-dialect-015
  text: 有沒有一個發音，是你怎麼練都覺得彆扭的？
  tags: [dialect]
- id: qn-dialect-016
  text: 聽到自己錄音裡的聲音，你會有什麼感覺？
  tags: [dialect]
- id: qn-dialect-017
  text: 你覺得語速和語調，會怎麼影響別人對你的印象？
  tags: [dialect]
- id: qn-dialect-018
  text: 家鄉的說話方式，有哪個部分是你想傳給下一代的？
  tags: [dialect]
- id: qn-dialect-019
  text: 遇到聽不懂的方言時，你心裡會浮現什麼想法？
  tags: [dialect]
- id: qn-dialect-020
  text: 如果聲音也算一種家鄉，你的家鄉聽起來是怎樣的？
  tags: [dialect]
