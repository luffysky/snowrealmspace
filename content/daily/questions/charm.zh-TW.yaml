# 每日一問 · 幸運物與護身。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-charm-001
  text: 你身上有沒有一件會隨時帶著的幸運小物？
  tags: [charm]
- id: qn-charm-002
  text: 遇到重要場合前，你會做什麼像儀式一樣的小動作嗎？
  tags: [charm]
- id: qn-charm-003
  text: 如果要挑一個護身符送給自己，你會想要什麼樣的？
  tags: [charm]
- id: qn-charm-004
  text: 有沒有哪個顏色或數字，讓你覺得特別吉利？
  tags: [charm]
- id: qn-charm-005
  text: 小時候的你，曾經相信過哪些帶來好運的說法？
  tags: [charm]
- id: qn-charm-006
  text: 你抽屜裡有沒有一樣捨不得丟、卻也說不清用途的護身物？
  tags: [charm]
- id: qn-charm-007
  text: 考試或面試前，你會不會特地帶上某樣東西壯膽？
  tags: [charm]
- id: qn-charm-008
  text: 對你來說，一件小物要具備什麼，才算得上「有力量」？
  tags: [charm]
- id: qn-charm-009
  text: 你有沒有從某個人手上收過、被當成護身符珍藏的東西？
  tags: [charm]
- id: qn-charm-010
  text: 如果幸運可以濃縮成一個形狀，你覺得它會長什麼樣子？
  tags: [charm]
- id: qn-charm-011
  text: 廟裡求來的平安符，你通常會怎麼安放它？
  tags: [charm]
- id: qn-charm-012
  text: 出門遠行時，你會習慣帶上哪一樣讓自己安心的小東西？
  tags: [charm]
- id: qn-charm-013
  text: 有沒有一個小舉動，是你相信能替自己招來好運的？
  tags: [charm]
- id: qn-charm-014
  text: 你會不會特別留意路上撿到的某些「幸運象徵」？
  tags: [charm]
- id: qn-charm-015
  text: 假如要為新的一年準備一件護身物，你想選什麼？
  tags: [charm]
- id: qn-charm-016
  text: 錢包或包包裡，有沒有一樣你偷偷當作幸運符的東西？
  tags: [charm]
- id: qn-charm-017
  text: 你覺得幸運物的作用，比較像陪伴還是像庇佑？
  tags: [charm]
- id: qn-charm-018
  text: 有哪一種儀式感的小事，能讓你覺得今天會順利一點？
  tags: [charm]
- id: qn-charm-019
  text: 如果要傳一件護身小物給重要的人，你會挑什麼給他？
  tags: [charm]
- id: qn-charm-020
  text: 對你而言，一樣東西是怎麼從普通變成「幸運物」的？
  tags: [charm]
