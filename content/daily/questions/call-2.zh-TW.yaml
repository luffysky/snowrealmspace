# 每日一問 · 電話與通話（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-call-021
  text: 對你來說，一通好的電話該有什麼樣的感覺？
  tags: [call]
- id: qn-call-022
  text: 講電話和面對面聊天，你更能放開來說話的是哪一種？
  tags: [call]
- id: qn-call-023
  text: 若能撥一通電話給多年沒聯絡的人，你會找誰？
  tags: [call]
- id: qn-call-024
  text: 電話那頭沉默了幾秒，你會怎麼理解那段安靜？
  tags: [call]
- id: qn-call-025
  text: 有沒有一種聲音，光是在電話裡聽到就讓你安心？
  tags: [call]
- id: qn-call-026
  text: 通話中對方的語氣，你多半聽得出背後的心情嗎？
  tags: [call]
- id: qn-call-027
  text: 你會為了哪一種消息，特地選擇用電話說？
  tags: [call]
- id: qn-call-028
  text: 一邊講電話一邊散步時，你的思緒會有什麼變化？
  tags: [call]
- id: qn-call-029
  text: 若電話只能再講一分鐘，你會把它留給誰？
  tags: [call]
- id: qn-call-030
  text: 掛掉電話之後，你心裡通常留下什麼樣的餘韻？
  tags: [call]
- id: qn-call-031
  text: 對你而言，講電話是拉近距離還是有點負擔？
  tags: [call]
- id: qn-call-032
  text: 有沒有一句話，你只敢在電話裡對人說出口？
  tags: [call]
- id: qn-call-033
  text: 接起電話前看到來電顯示，你的心情會怎麼轉？
  tags: [call]
- id: qn-call-034
  text: 你和家人通話時，話題大多繞著什麼打轉？
  tags: [call]
- id: qn-call-035
  text: 一通報平安的電話，對你來說代表著什麼？
  tags: [call]
- id: qn-call-036
  text: 若對方講個不停，你會怎麼找到收尾的空檔？
  tags: [call]
- id: qn-call-037
  text: 有哪一通電話，是你事後很慶幸自己撥了的？
  tags: [call]
- id: qn-call-038
  text: 聽筒裡傳來熟悉的背景聲音時，你會聯想到什麼？
  tags: [call]
- id: qn-call-039
  text: 你更喜歡短短講重點，還是慢慢聊到盡興？
  tags: [call]
- id: qn-call-040
  text: 童年時家裡的電話，在你記憶中是什麼模樣？
  tags: [call]
