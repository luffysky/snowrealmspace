# 每日一問 · 遺憾與如果。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-regret-001
  text: 回頭看，有哪件事你會想用不一樣的方式再走一次？
  tags: [regret]
- id: qn-regret-002
  text: 如果能對過去的自己說一句話，你會想說什麼？
  tags: [regret]
- id: qn-regret-003
  text: 有沒有一段關係，你偶爾會想像它若延續下去的樣子？
  tags: [regret]
- id: qn-regret-004
  text: 哪個當年沒說出口的謝謝，還留在你心裡？
  tags: [regret]
- id: qn-regret-005
  text: 如果時間可以慢一點，你最想多停留在哪一段時光？
  tags: [regret]
- id: qn-regret-006
  text: 有沒有一條沒選的路，你偶爾會好奇它會通往哪裡？
  tags: [regret]
- id: qn-regret-007
  text: 你曾經和誰漸行漸遠，現在想起來是什麼感受？
  tags: [regret]
- id: qn-regret-008
  text: 有哪個地方，是你一直想去卻始終沒去成的？
  tags: [regret]
- id: qn-regret-009
  text: 如果能重新道別一次，你會想怎麼跟某個人說再見？
  tags: [regret]
- id: qn-regret-010
  text: 年輕時的哪個決定，如今在你心裡有了不同的意義？
  tags: [regret]
- id: qn-regret-011
  text: 有沒有一句話，你希望當時能更溫柔地說出口？
  tags: [regret]
- id: qn-regret-012
  text: 哪件你以為還有時間去做的事，後來才發現錯過了？
  tags: [regret]
- id: qn-regret-013
  text: 假如可以再見某個人一面，你會想跟他聊些什麼？
  tags: [regret]
- id: qn-regret-014
  text: 你和過去的自己，現在算是和解了嗎？
  tags: [regret]
- id: qn-regret-015
  text: 有哪個曾經很在意的東西，如今你已經願意放下了？
  tags: [regret]
- id: qn-regret-016
  text: 如果那天做了不同的選擇，你猜現在的生活會是什麼樣子？
  tags: [regret]
- id: qn-regret-017
  text: 有沒有一份心意，你一直後悔沒有好好表達？
  tags: [regret]
- id: qn-regret-018
  text: 哪一段你曾經想逃離的日子，現在反而有點想念？
  tags: [regret]
- id: qn-regret-019
  text: 對於曾經的自己，你現在最想給的是諒解還是什麼？
  tags: [regret]
- id: qn-regret-020
  text: 如果遺憾也能好好收著，你會想怎麼安放它？
  tags: [regret]
