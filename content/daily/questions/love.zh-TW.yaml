# 每日一問 · 愛與親密。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-love-001
  text: 你最近一次感覺被深深在乎，是什麼時候？
  tags: [love]
- id: qn-love-002
  text: 對你來說，親密是一種怎樣的感受？
  tags: [love]
- id: qn-love-003
  text: 你會用什麼方式，讓在乎的人知道你的心意？
  tags: [love]
- id: qn-love-004
  text: 家人身上有哪個習慣，讓你感到溫暖？
  tags: [love]
- id: qn-love-005
  text: 有沒有一句你一直想對某個人說、卻還沒說出口的話？
  tags: [love]
- id: qn-love-006
  text: 你心裡的愛，比較像陪伴、理解，還是別的什麼？
  tags: [love]
- id: qn-love-007
  text: 和所愛的人相處時，哪個瞬間讓你特別安心？
  tags: [love]
- id: qn-love-008
  text: 你從家人那裡，學到了怎樣去愛一個人？
  tags: [love]
- id: qn-love-009
  text: 若要表達感謝，你會想先對誰、說些什麼？
  tags: [love]
- id: qn-love-010
  text: 你覺得自己在關係裡，最柔軟的一面是什麼？
  tags: [love]
- id: qn-love-011
  text: 有哪個微小的舉動，會讓你感覺被愛？
  tags: [love]
- id: qn-love-012
  text: 你和某個重要的人之間，藏著哪段特別的回憶？
  tags: [love]
- id: qn-love-013
  text: 當你想念一個人時，通常會浮現什麼樣的畫面？
  tags: [love]
- id: qn-love-014
  text: 你希望被愛的方式，和你付出愛的方式一樣嗎？
  tags: [love]
- id: qn-love-015
  text: 有沒有一個人，光是想到就讓你嘴角上揚？
  tags: [love]
- id: qn-love-016
  text: 你會怎麼陪伴一個正在難過的所愛之人？
  tags: [love]
- id: qn-love-017
  text: 在你的成長裡，是誰教會你什麼叫溫柔？
  tags: [love]
- id: qn-love-018
  text: 對你而言，把真心交給一個人，需要什麼？
  tags: [love]
- id: qn-love-019
  text: 你想在哪個人的生命裡，留下怎樣的存在？
  tags: [love]
- id: qn-love-020
  text: 如果能為所愛的人做一件事，你會選擇做什麼？
  tags: [love]
