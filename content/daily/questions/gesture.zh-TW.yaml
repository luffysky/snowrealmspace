# 每日一問 · 肢體與手勢。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-gesture-001
  text: 你講話的時候，手會不會不自覺地跟著動？
  tags: [gesture]
- id: qn-gesture-002
  text: 緊張的時候，你的身體會出現哪個小動作？
  tags: [gesture]
- id: qn-gesture-003
  text: 有沒有一個手勢，是你從家人身上學來的？
  tags: [gesture]
- id: qn-gesture-004
  text: 專心思考的時候，你的手通常放在哪裡？
  tags: [gesture]
- id: qn-gesture-005
  text: 你習慣用點頭、揮手，還是眼神來跟人打招呼？
  tags: [gesture]
- id: qn-gesture-006
  text: 坐著的時候，你會不會有抖腳或轉筆之類的習慣？
  tags: [gesture]
- id: qn-gesture-007
  text: 開心到說不出話時，你的身體會怎麼表達？
  tags: [gesture]
- id: qn-gesture-008
  text: 有沒有哪個朋友，光看背影或走路姿態你就認得出來？
  tags: [gesture]
- id: qn-gesture-009
  text: 拍照的時候，你的手最常擺出什麼樣子？
  tags: [gesture]
- id: qn-gesture-010
  text: 你數數字的時候，是從哪一根手指開始的？
  tags: [gesture]
- id: qn-gesture-011
  text: 尷尬的一刻，你的手會下意識去摸哪裡？
  tags: [gesture]
- id: qn-gesture-012
  text: 有沒有一種手勢，換個國家意思就完全不一樣，讓你印象深刻？
  tags: [gesture]
- id: qn-gesture-013
  text: 別人跟你比一個手勢，你最看不懂的是哪一個？
  tags: [gesture]
- id: qn-gesture-014
  text: 你睡覺時的姿勢，多年來有變過嗎？
  tags: [gesture]
- id: qn-gesture-015
  text: 聽到喜歡的音樂，你的身體會先動起來的是哪個部位？
  tags: [gesture]
- id: qn-gesture-016
  text: 跟很熟的人在一起，你的坐姿會變得更放鬆嗎？
  tags: [gesture]
- id: qn-gesture-017
  text: 你有沒有一個從小到大都改不掉的小動作？
  tags: [gesture]
- id: qn-gesture-018
  text: 排隊或等人的時候，你的雙手通常在做什麼？
  tags: [gesture]
- id: qn-gesture-019
  text: 如果不能出聲，只能用身體，你會怎麼表達「謝謝」？
  tags: [gesture]
- id: qn-gesture-020
  text: 在你身邊的人裡，誰的招牌動作最讓你會心一笑？
  tags: [gesture]
