# 每日一問 · 排隊與等候（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-queue-021
  text: 對你來說，等待中最珍貴的是哪一段時光？
  tags: [queue]
- id: qn-queue-022
  text: 看到兩條隊伍，你會憑什麼挑要站哪一條？
  tags: [queue]
- id: qn-queue-023
  text: 手機沒電又得排很久時，你會靠什麼撐過去？
  tags: [queue]
- id: qn-queue-024
  text: 在等待裡，你更在意的是快，還是有個明確結果？
  tags: [queue]
- id: qn-queue-025
  text: 隊伍前進得比預期快時，你心裡是什麼滋味？
  tags: [queue]
- id: qn-queue-026
  text: 你曾經為了誰，願意多等上一會兒？
  tags: [queue]
- id: qn-queue-027
  text: 若身邊有人陪著一起等，感受會有什麼不同？
  tags: [queue]
- id: qn-queue-028
  text: 有沒有一種等候，反而讓你覺得挺自在的？
  tags: [queue]
- id: qn-queue-029
  text: 站在隊伍最後一位時，你腦中會浮現什麼念頭？
  tags: [queue]
- id: qn-queue-030
  text: 等候一件結果揭曉的心情，你會怎麼形容？
  tags: [queue]
- id: qn-queue-031
  text: 你比較怕的是不知道要等多久，還是明知很久？
  tags: [queue]
- id: qn-queue-032
  text: 排隊時和陌生人搭上話，那會是什麼樣的經驗？
  tags: [queue]
- id: qn-queue-033
  text: 什麼樣的場合，讓你甘願一大早就去卡位？
  tags: [queue]
- id: qn-queue-034
  text: 在等待中，你會觀察周圍的人還是沉浸在自己世界？
  tags: [queue]
- id: qn-queue-035
  text: 一段漫長的等候結束後，你最想做的是什麼？
  tags: [queue]
- id: qn-queue-036
  text: 你覺得等一個人和等一件事，哪一種比較磨人？
  tags: [queue]
- id: qn-queue-037
  text: 有沒有一次等待，讓你意外遇見了什麼好事？
  tags: [queue]
- id: qn-queue-038
  text: 排隊時看到隊伍愈來愈長，你會有什麼想法？
  tags: [queue]
- id: qn-queue-039
  text: 對你而言，怎樣的等待才算是有意義的？
  tags: [queue]
- id: qn-queue-040
  text: 小時候等待某個節日到來，是什麼樣的心情？
  tags: [queue]
