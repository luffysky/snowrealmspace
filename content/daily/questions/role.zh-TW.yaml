# 每日一問 · 身分與角色。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-role-001
  text: 在不同人面前，你會展現不一樣的自己嗎？
  tags: [role]
- id: qn-role-002
  text: 別人第一次認識你時，最常怎麼形容你？
  tags: [role]
- id: qn-role-003
  text: 有沒有一個身分，是你戴久了才慢慢習慣的？
  tags: [role]
- id: qn-role-004
  text: 你希望別人記得的你，和你眼中的自己一樣嗎？
  tags: [role]
- id: qn-role-005
  text: 當你獨處時，哪一個版本的你會浮現出來？
  tags: [role]
- id: qn-role-006
  text: 在一群人裡，你通常會自然扮演什麼樣的位置？
  tags: [role]
- id: qn-role-007
  text: 有哪個稱呼或頭銜，聽起來其實不太像你？
  tags: [role]
- id: qn-role-008
  text: 你曾經因為某個角色，而暫時把自己放到一旁嗎？
  tags: [role]
- id: qn-role-009
  text: 如果拿掉所有你正在扮演的角色，剩下的你會是誰？
  tags: [role]
- id: qn-role-010
  text: 面對家人和面對朋友，你說話的方式差別大嗎？
  tags: [role]
- id: qn-role-011
  text: 你身上哪一個特質，是無論在哪都不會變的？
  tags: [role]
- id: qn-role-012
  text: 小時候的你，會怎麼看現在的你？
  tags: [role]
- id: qn-role-013
  text: 有沒有一種身分，是你很想試著成為的？
  tags: [role]
- id: qn-role-014
  text: 你覺得別人對你的期待，貼近真實的你嗎？
  tags: [role]
- id: qn-role-015
  text: 在哪一種場合，你最能放心做自己？
  tags: [role]
- id: qn-role-016
  text: 你的名字，對你來說帶著什麼樣的感覺？
  tags: [role]
- id: qn-role-017
  text: 有沒有一個角色，你其實一直想卸下來？
  tags: [role]
- id: qn-role-018
  text: 如果要用一句話介紹自己，你會怎麼說？
  tags: [role]
- id: qn-role-019
  text: 你更常是那個照顧別人的人，還是被照顧的人？
  tags: [role]
- id: qn-role-020
  text: 這幾年下來，你眼中的自己有什麼不一樣了？
  tags: [role]
