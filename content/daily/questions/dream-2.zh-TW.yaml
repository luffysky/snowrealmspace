# 每日一問 · 夢想（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-dream-021
  text: 如果有一整年可以自由運用，你想拿來完成什麼？
  tags: [dream]
- id: qn-dream-022
  text: 你心裡有沒有一個想去、卻還沒去的地方？
  tags: [dream]
- id: qn-dream-023
  text: 如果能親眼看見未來的某一刻，你想看哪一幕？
  tags: [dream]
- id: qn-dream-024
  text: 有什麼事，你希望這輩子至少做過一次？
  tags: [dream]
- id: qn-dream-025
  text: 如果可以擁有一種超能力，你會拿它來做什麼？
  tags: [dream]
- id: qn-dream-026
  text: 你理想中的一天，從早到晚會是什麼樣子？
  tags: [dream]
- id: qn-dream-027
  text: 如果能和任何一個人共進晚餐，你想邀請誰？
  tags: [dream]
- id: qn-dream-028
  text: 有什麼樣的生活，是你偶爾會幻想的？
  tags: [dream]
- id: qn-dream-029
  text: 如果你的名字將來會和一件事連在一起，你希望是什麼？
  tags: [dream]
- id: qn-dream-030
  text: 你曾經在哪個瞬間，覺得離夢想很近？
  tags: [dream]
- id: qn-dream-031
  text: 如果能送給十年後的自己一份禮物，你想送什麼？
  tags: [dream]
- id: qn-dream-032
  text: 有什麼是你希望能親手打造出來的？
  tags: [dream]
- id: qn-dream-033
  text: 如果世界願意為你改變一件事，你想改哪一件？
  tags: [dream]
- id: qn-dream-034
  text: 你心中有沒有一個「有一天」的清單？
  tags: [dream]
- id: qn-dream-035
  text: 如果可以住在任何一個地方，你會選哪裡，過怎樣的日子？
  tags: [dream]
- id: qn-dream-036
  text: 有什麼夢想，是你和某個人共同擁有的？
  tags: [dream]
- id: qn-dream-037
  text: 如果能無償把一件事做到最好，你想做什麼？
  tags: [dream]
- id: qn-dream-038
  text: 你希望被人記得的，是什麼樣的一個你？
  tags: [dream]
- id: qn-dream-039
  text: 如果今晚的夢可以自己決定，你想夢見什麼？
  tags: [dream]
- id: qn-dream-040
  text: 有什麼樣的成就，會讓你打從心底為自己驕傲？
  tags: [dream]
