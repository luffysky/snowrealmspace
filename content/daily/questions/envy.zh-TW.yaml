# 每日一問 · 羨慕與比較。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-envy-001
  text: 最近有沒有羨慕過誰的生活，是哪個部分讓你多看了一眼？
  tags: [envy]
- id: qn-envy-002
  text: 當你羨慕一個人時，身體或心裡通常會先出現什麼感覺？
  tags: [envy]
- id: qn-envy-003
  text: 有沒有一種能力，你看到別人擁有時會特別有感觸？
  tags: [envy]
- id: qn-envy-004
  text: 你會不會有時候羨慕的其實不是那個人，而是他背後的某種可能？
  tags: [envy]
- id: qn-envy-005
  text: 小時候你曾經羨慕過同伴的什麼，現在回想起來覺得如何？
  tags: [envy]
- id: qn-envy-006
  text: 拿自己和別人比較的那一刻，你通常是在比哪一件事？
  tags: [envy]
- id: qn-envy-007
  text: 滑手機看到別人的近況時，哪一類貼文最容易讓你停下來？
  tags: [envy]
- id: qn-envy-008
  text: 你覺得羨慕和欣賞之間，對你來說界線在哪裡？
  tags: [envy]
- id: qn-envy-009
  text: 有沒有誰的步調或從容，是你偶爾希望自己也能擁有的？
  tags: [envy]
- id: qn-envy-010
  text: 如果有人正在羨慕你，你猜他可能看上了你的哪一點？
  tags: [envy]
- id: qn-envy-011
  text: 你會在什麼樣的場合，比較容易和身邊的人做起比較？
  tags: [envy]
- id: qn-envy-012
  text: 曾經羨慕過的某樣東西，後來真的到手了嗎，感覺又是如何？
  tags: [envy]
- id: qn-envy-013
  text: 有沒有一種生活方式，你既嚮往又覺得未必真的適合自己？
  tags: [envy]
- id: qn-envy-014
  text: 當比較讓你不太舒服時，你通常會怎麼安放那份心情？
  tags: [envy]
- id: qn-envy-015
  text: 你更容易羨慕離自己很近的人，還是遙遠的陌生人？
  tags: [envy]
- id: qn-envy-016
  text: 有哪件別人眼中的「順利」，你其實不太確定自己是否想要？
  tags: [envy]
- id: qn-envy-017
  text: 回想某次羨慕的心情，它後來把你帶往了什麼方向？
  tags: [envy]
- id: qn-envy-018
  text: 你身上有沒有一項特質，是很少拿去和別人比、也很珍惜的？
  tags: [envy]
- id: qn-envy-019
  text: 如果暫時關掉所有比較，你想先好好看看自己的哪一部分？
  tags: [envy]
- id: qn-envy-020
  text: 對你而言，什麼時候的比較會變成一種前進的力量？
  tags: [envy]
