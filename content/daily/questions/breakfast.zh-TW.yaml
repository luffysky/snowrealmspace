# 每日一問 · 早餐與第一餐。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-breakfast-001
  text: 你今天的第一餐吃了什麼？
  tags: [breakfast]
- id: qn-breakfast-002
  text: 小時候記憶裡最常出現的早餐是什麼？
  tags: [breakfast]
- id: qn-breakfast-003
  text: 假日的早餐和平日相比，有什麼不一樣？
  tags: [breakfast]
- id: qn-breakfast-004
  text: 如果要向外國朋友介紹一種台灣早餐，你會選哪一樣？
  tags: [breakfast]
- id: qn-breakfast-005
  text: 你習慣起床後多久，才吃下第一餐？
  tags: [breakfast]
- id: qn-breakfast-006
  text: 有沒有哪一間早餐店是你固定會去的，那裡的什麼吸引你？
  tags: [breakfast]
- id: qn-breakfast-007
  text: 早餐要配飲料的話，你偏好哪一種？
  tags: [breakfast]
- id: qn-breakfast-008
  text: 在家做早餐和在外面買，你比較常選哪一種？
  tags: [breakfast]
- id: qn-breakfast-009
  text: 旅行時，早晨醒來你會想先找什麼來吃？
  tags: [breakfast]
- id: qn-breakfast-010
  text: 有沒有一種早餐，是你怎麼吃都不會膩的？
  tags: [breakfast]
- id: qn-breakfast-011
  text: 睡到接近中午才起床，那頓算早餐還是午餐，你怎麼看？
  tags: [breakfast]
- id: qn-breakfast-012
  text: 能不能描述一個讓你印象深刻的早晨餐桌畫面？
  tags: [breakfast]
- id: qn-breakfast-013
  text: 你會為了一份早餐特地早起或排隊嗎？
  tags: [breakfast]
- id: qn-breakfast-014
  text: 匆忙的早晨，你通常靠什麼解決第一餐？
  tags: [breakfast]
- id: qn-breakfast-015
  text: 冷天和熱天，你想吃的早餐會不一樣嗎？
  tags: [breakfast]
- id: qn-breakfast-016
  text: 有沒有誰做的早餐，是你特別想念的？
  tags: [breakfast]
- id: qn-breakfast-017
  text: 換到陌生的城市，早餐的差異最先讓你注意到什麼？
  tags: [breakfast]
- id: qn-breakfast-018
  text: 你理想中悠閒的早晨，餐桌上會擺些什麼？
  tags: [breakfast]
- id: qn-breakfast-019
  text: 中式、西式、日式早餐，你今天比較想要哪一種？
  tags: [breakfast]
- id: qn-breakfast-020
  text: 早餐這件事，對你來說偏向必需，還是一種享受？
  tags: [breakfast]
