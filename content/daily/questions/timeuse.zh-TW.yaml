# 每日一問 · 時間分配。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-timeuse-001
  text: 你的一天裡，哪一段時間是完全屬於自己的？
  tags: [timeuse]
- id: qn-timeuse-002
  text: 如果每天能多出一小時，你會把它放進哪件事？
  tags: [timeuse]
- id: qn-timeuse-003
  text: 最近你的時間，大多花在哪些地方？
  tags: [timeuse]
- id: qn-timeuse-004
  text: 有沒有一件事，你其實很想多留一點時間給它？
  tags: [timeuse]
- id: qn-timeuse-005
  text: 一天結束時，你會怎麼回顧這一天的分配？
  tags: [timeuse]
- id: qn-timeuse-006
  text: 什麼樣的活動，讓你覺得時間花得特別值得？
  tags: [timeuse]
- id: qn-timeuse-007
  text: 你習慣把一天切成好幾塊，還是讓它自然流動？
  tags: [timeuse]
- id: qn-timeuse-008
  text: 哪件例行公事，其實佔用了比你以為更多的時間？
  tags: [timeuse]
- id: qn-timeuse-009
  text: 如果要為明天空出一段留白，你會安排在什麼時候？
  tags: [timeuse]
- id: qn-timeuse-010
  text: 你和喜歡的人相處的時間，通常都怎麼安排？
  tags: [timeuse]
- id: qn-timeuse-011
  text: 一週裡，哪一天的時間感覺和其他天最不一樣？
  tags: [timeuse]
- id: qn-timeuse-012
  text: 有什麼事，你願意花時間卻不願意花錢去做？
  tags: [timeuse]
- id: qn-timeuse-013
  text: 你怎麼決定一件事值不值得投入一個下午？
  tags: [timeuse]
- id: qn-timeuse-014
  text: 通勤或移動的那段時間，你通常拿來做什麼？
  tags: [timeuse]
- id: qn-timeuse-015
  text: 假日的時間，你比較喜歡怎麼分給自己？
  tags: [timeuse]
- id: qn-timeuse-016
  text: 有沒有一種時間的用法，讓你事後覺得特別踏實？
  tags: [timeuse]
- id: qn-timeuse-017
  text: 你手上有哪些事，是可以交給別人或放掉的？
  tags: [timeuse]
- id: qn-timeuse-018
  text: 睡前的最後半小時，你通常都在做什麼？
  tags: [timeuse]
- id: qn-timeuse-019
  text: 如果重新規劃一天，你會想調整哪一段的比重？
  tags: [timeuse]
- id: qn-timeuse-020
  text: 對你來說，怎樣的一天算是時間分配得剛剛好？
  tags: [timeuse]
