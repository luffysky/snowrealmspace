# 每日一問 · 等待與耐心。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-wait-001
  text: 此刻的你，心裡正在等著哪一件還沒到來的事？
  tags: [waiting]
- id: qn-wait-002
  text: 有沒有一段等待的時光，事後想起來竟意外地溫柔？
  tags: [waiting]
- id: qn-wait-003
  text: 當時間好像走得特別慢，你通常都在想些什麼？
  tags: [waiting]
- id: qn-wait-004
  text: 你會怎麼安放那些「還不知道結果」的日子？
  tags: [waiting]
- id: qn-wait-005
  text: 對你而言，耐心比較像是天生的，還是慢慢練出來的？
  tags: [waiting]
- id: qn-wait-006
  text: 有什麼是你願意花很長時間去守候，也不覺得可惜的？
  tags: [waiting]
- id: qn-wait-007
  text: 在等一個人回覆的時候，你的心裡通常上演著哪些畫面？
  tags: [waiting]
- id: qn-wait-008
  text: 哪一種等待，讓你學會了和不確定感相處？
  tags: [waiting]
- id: qn-wait-009
  text: 若把等待想像成一個季節，你現在正走在哪一段？
  tags: [waiting]
- id: qn-wait-010
  text: 你分得清楚什麼時候該繼續守候、什麼時候該轉身嗎？
  tags: [waiting]
- id: qn-wait-011
  text: 有沒有一件事，是你等了很久才終於明白它的意義？
  tags: [waiting]
- id: qn-wait-012
  text: 當週遭的人都往前衝，你怎麼守住自己的節奏？
  tags: [waiting]
- id: qn-wait-013
  text: 童年裡最讓你坐立難安的一次等待，是為了什麼？
  tags: [waiting]
- id: qn-wait-014
  text: 你有沒有一個正在默默醞釀、還不想說出口的期盼？
  tags: [waiting]
- id: qn-wait-015
  text: 在無法掌控的過程裡，你都靠什麼安頓自己的心？
  tags: [waiting]
- id: qn-wait-016
  text: 哪一段慢下來的時光，反而讓你看見了平常忽略的風景？
  tags: [waiting]
- id: qn-wait-017
  text: 你比較能等結果，還是比較能等一個人的改變？
  tags: [waiting]
- id: qn-wait-018
  text: 如果可以，你想對正在苦等的自己遞上什麼？
  tags: [waiting]
- id: qn-wait-019
  text: 有什麼東西，是急也急不來、只能陪著它慢慢長成的？
  tags: [waiting]
- id: qn-wait-020
  text: 回望那些等過的日子，它們在你身上留下了什麼？
  tags: [waiting]
