# 每日一問 · 專注與分心。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-focusq-001
  text: 做哪件事的時候，你最容易忘記時間的流動？
  tags: [focusq]
- id: qn-focusq-002
  text: 你通常是被什麼東西打斷專注的？
  tags: [focusq]
- id: qn-focusq-003
  text: 什麼樣的環境，能讓你比較容易沉進一件事裡？
  tags: [focusq]
- id: qn-focusq-004
  text: 當思緒飄走時，它最常飄到哪裡去？
  tags: [focusq]
- id: qn-focusq-005
  text: 有沒有一段音樂或聲音，能幫你進入狀態？
  tags: [focusq]
- id: qn-focusq-006
  text: 手機放在看得到的地方時，你的心會有什麼變化？
  tags: [focusq]
- id: qn-focusq-007
  text: 你怎麼分辨自己是在休息，還是只是在逃避？
  tags: [focusq]
- id: qn-focusq-008
  text: 一天當中，哪個時段你的頭腦最清晰？
  tags: [focusq]
- id: qn-focusq-009
  text: 面對一件很想拖延的事，你都怎麼哄自己開始？
  tags: [focusq]
- id: qn-focusq-010
  text: 分心對你來說，有沒有帶來過什麼意外的收穫？
  tags: [focusq]
- id: qn-focusq-011
  text: 你有沒有一個能幫自己收心的小動作或儀式？
  tags: [focusq]
- id: qn-focusq-012
  text: 同時處理很多事的時候，你心裡是什麼感覺？
  tags: [focusq]
- id: qn-focusq-013
  text: 什麼樣的念頭，最常在你想專心時冒出來？
  tags: [focusq]
- id: qn-focusq-014
  text: 完全投入一件事之後，你身上會留下什麼樣的感覺？
  tags: [focusq]
- id: qn-focusq-015
  text: 你覺得自己是容易被吸引，還是容易被打散的人？
  tags: [focusq]
- id: qn-focusq-016
  text: 有哪個看似無聊的時刻，反而讓你的腦袋很放鬆？
  tags: [focusq]
- id: qn-focusq-017
  text: 螢幕之外，什麼事情能真正抓住你的注意力？
  tags: [focusq]
- id: qn-focusq-018
  text: 當你發現自己滑手機滑了很久，心裡會浮現什麼？
  tags: [focusq]
- id: qn-focusq-019
  text: 你理想中「專心一整段時間」是什麼樣子？
  tags: [focusq]
- id: qn-focusq-020
  text: 如果可以替自己擋掉一種干擾，你會先擋哪一個？
  tags: [focusq]
