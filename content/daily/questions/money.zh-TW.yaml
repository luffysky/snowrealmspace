# 每日一問 · 金錢與慾望。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-money-001
  text: 最近一次讓你猶豫很久才買下的東西是什麼？
  tags: [money]
- id: qn-money-002
  text: 你的支付紀錄裡，最常出現的一筆小額花費是什麼？
  tags: [money]
- id: qn-money-003
  text: 有沒有一樣東西，你願意花比別人更多的錢去擁有？
  tags: [money]
- id: qn-money-004
  text: 你買過最後悔的一件商品是什麼？
  tags: [money]
- id: qn-money-005
  text: 看到限時折扣時，你通常會怎麼反應？
  tags: [money]
- id: qn-money-006
  text: 哪一類東西，你寧可多花一點也要買好的？
  tags: [money]
- id: qn-money-007
  text: 你現在最想擁有、卻遲遲沒下手的物品是什麼？
  tags: [money]
- id: qn-money-008
  text: 如果收到一筆意外的錢，你腦中第一個想花在哪？
  tags: [money]
- id: qn-money-009
  text: 你有沒有為了省一小筆錢，反而繞了很大一圈？
  tags: [money]
- id: qn-money-010
  text: 哪一種花費，你花起來完全不心疼？
  tags: [money]
- id: qn-money-011
  text: 你身上正在用的東西裡，哪一件最物超所值？
  tags: [money]
- id: qn-money-012
  text: 逛街時，什麼樣的東西最容易讓你伸手拿起來？
  tags: [money]
- id: qn-money-013
  text: 「限量」這兩個字，會讓你願意多付多少？
  tags: [money]
- id: qn-money-014
  text: 有沒有一樣你一直想要、得到後卻沒那麼喜歡的東西？
  tags: [money]
- id: qn-money-015
  text: 你靠什麼判斷一件想要的東西值不值得買？
  tags: [money]
- id: qn-money-016
  text: 你上一次衝動購物，帶回家的是什麼？
  tags: [money]
- id: qn-money-017
  text: 哪一種商品的定價，讓你覺得完全不合理？
  tags: [money]
- id: qn-money-018
  text: 如果衣櫃只能留下三件單品，你會保留哪三件？
  tags: [money]
- id: qn-money-019
  text: 那些花在「讓自己開心」上的錢，通常流向哪裡？
  tags: [money]
- id: qn-money-020
  text: 別人覺得浪費、你卻覺得值得的一筆花費是什麼？
  tags: [money]
