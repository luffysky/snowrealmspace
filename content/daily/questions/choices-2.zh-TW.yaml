# 每日一問 · 選擇（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-choice-021
  text: 如果今天只能專心完成一件事，你會挑哪一件？
  tags: [choice]
- id: qn-choice-022
  text: 有沒有一個習慣，你正考慮讓它留下或離開？
  tags: [choice]
- id: qn-choice-023
  text: 面對兩條都不錯的路，你通常靠什麼做決定？
  tags: [choice]
- id: qn-choice-024
  text: 如果可以把一件煩心事交給別人處理，你會交出哪件？
  tags: [choice]
- id: qn-choice-025
  text: 你最近一次憑直覺選的東西，後來覺得如何？
  tags: [choice]
- id: qn-choice-026
  text: 有沒有一個「再想想」的念頭，其實已經想很久了？
  tags: [choice]
- id: qn-choice-027
  text: 如果今天的行程能刪掉一項，你想拿掉哪一個？
  tags: [choice]
- id: qn-choice-028
  text: 眼前有樣東西想擁有，你會選現在要還是慢慢等？
  tags: [choice]
- id: qn-choice-029
  text: 你上一次為自己爭取的選項，是什麼？
  tags: [choice]
- id: qn-choice-030
  text: 如果一天只能回覆一個人的訊息，你會先選誰？
  tags: [choice]
- id: qn-choice-031
  text: 有沒有一件事，你已經決定卻還沒告訴任何人？
  tags: [choice]
- id: qn-choice-032
  text: 面對一個難選的題目，你比較想快點定還是多留些空間？
  tags: [choice]
- id: qn-choice-033
  text: 如果可以替明天的自己先安排一件好事，你會排什麼？
  tags: [choice]
- id: qn-choice-034
  text: 你手邊有什麼，是留著或送走都可以、正在猶豫的？
  tags: [choice]
- id: qn-choice-035
  text: 最近有一個選擇，你發現自己其實在替別人而選嗎？
  tags: [choice]
- id: qn-choice-036
  text: 如果能重來一次上週的某個決定，你想回到哪一刻？
  tags: [choice]
- id: qn-choice-037
  text: 你比較常先想清楚再動，還是邊做邊調整？
  tags: [choice]
- id: qn-choice-038
  text: 有沒有一件事，你選擇了不去知道結果？
  tags: [choice]
- id: qn-choice-039
  text: 如果現在能為自己挑一種節奏過今天，你會挑快還是慢？
  tags: [choice]
- id: qn-choice-040
  text: 眼前這個當下，你最想把注意力放在哪裡？
  tags: [choice]
