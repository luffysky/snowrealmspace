# 每日一問 · 睡夢與夢境（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sleepdream-021
  text: 有沒有一種夢境，總在你壓力大的時候找上門？
  tags: [sleepdream]
- id: qn-sleepdream-022
  text: 你入睡的姿勢或習慣，有沒有什麼非它不可的講究？
  tags: [sleepdream]
- id: qn-sleepdream-023
  text: 從躺下到真正睡著，你的腦袋通常在忙些什麼？
  tags: [sleepdream]
- id: qn-sleepdream-024
  text: 有沒有一個夢，情節荒唐到讓你醒來忍不住笑出來？
  tags: [sleepdream]
- id: qn-sleepdream-025
  text: 你曾夢見未來，或某種像預感般的畫面嗎？
  tags: [sleepdream]
- id: qn-sleepdream-026
  text: 夢裡的你，性格和平常一樣，還是判若兩人？
  tags: [sleepdream]
- id: qn-sleepdream-027
  text: 有沒有一種聲音或光線，總能把你從夢中拉回現實？
  tags: [sleepdream]
- id: qn-sleepdream-028
  text: 半夜醒來又睡回去時，前一個夢會接著演下去嗎？
  tags: [sleepdream]
- id: qn-sleepdream-029
  text: 你比較喜歡睡到自然醒，還是被鬧鐘拉出夢境？
  tags: [sleepdream]
- id: qn-sleepdream-030
  text: 童年時期做的夢，和現在做的夢有什麼不一樣？
  tags: [sleepdream]
- id: qn-sleepdream-031
  text: 有沒有一個夢中的角色，其實映著你自己的某一面？
  tags: [sleepdream]
- id: qn-sleepdream-032
  text: 睡前滑的手機或讀的故事，會不會改頭換面地溜進你的夢？
  tags: [sleepdream]
- id: qn-sleepdream-033
  text: 你有沒有為了睡得安穩，而養成的一套小儀式？
  tags: [sleepdream]
- id: qn-sleepdream-034
  text: 夢到墜落、被追，或怎麼趕都趕不上，這類夢你熟悉嗎？
  tags: [sleepdream]
- id: qn-sleepdream-035
  text: 醒來後最想找人分享的，是哪一種夢？
  tags: [sleepdream]
- id: qn-sleepdream-036
  text: 你的夢有沒有配樂，或某種說不清的背景氛圍？
  tags: [sleepdream]
- id: qn-sleepdream-037
  text: 有沒有一夜，你捨不得醒來，只想繼續待在那個夢裡？
  tags: [sleepdream]
- id: qn-sleepdream-038
  text: 睡不著的夜裡，你和自己的思緒是怎麼相處的？
  tags: [sleepdream]
- id: qn-sleepdream-039
  text: 你相信夢裡，藏著一些自己還沒察覺的心事嗎？
  tags: [sleepdream]
- id: qn-sleepdream-040
  text: 對你而言，一夜好眠比較像身體的休息，還是心的放鬆？
  tags: [sleepdream]
