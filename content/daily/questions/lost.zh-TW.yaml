# 每日一問 · 迷路與方向感。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-lost-001
  text: 你上一次迷路，是在哪裡？
  tags: [lost]
- id: qn-lost-002
  text: 到了陌生的城市，你習慣先靠什麼找路？
  tags: [lost]
- id: qn-lost-003
  text: 如果手機沒了訊號，你會怎麼判斷方向？
  tags: [lost]
- id: qn-lost-004
  text: 有沒有一條路，你走過很多次卻始終記不起來怎麼走？
  tags: [lost]
- id: qn-lost-005
  text: 迷路的時候，你會停下來問人，還是自己繼續找？
  tags: [lost]
- id: qn-lost-006
  text: 對你來說，「認得路」是靠地標、街名，還是一種感覺？
  tags: [lost]
- id: qn-lost-007
  text: 童年住家附近，哪一條巷子你到現在還閉著眼睛都走得出來？
  tags: [lost]
- id: qn-lost-008
  text: 你分得清東南西北嗎，還是只認得左跟右？
  tags: [lost]
- id: qn-lost-009
  text: 曾經因為走錯路，反而遇見了什麼意外的風景嗎？
  tags: [lost]
- id: qn-lost-010
  text: 在一棟很大的建築裡繞不出來時，你心裡通常在想什麼？
  tags: [lost]
- id: qn-lost-011
  text: 你比較容易在城市迷路，還是在山裡、海邊那樣的自然裡？
  tags: [lost]
- id: qn-lost-012
  text: 有沒有一個地方，是你怎麼都不會迷路的？
  tags: [lost]
- id: qn-lost-013
  text: 你信任導航到什麼程度，會不會明知它錯了還照著走？
  tags: [lost]
- id: qn-lost-014
  text: 如果要跟別人形容從家到常去的地方，你會怎麼描述這段路？
  tags: [lost]
- id: qn-lost-015
  text: 走夜路和走白天的同一條路，感覺對你來說一樣嗎？
  tags: [lost]
- id: qn-lost-016
  text: 你記得住回家的路，卻常常忘記去程怎麼走嗎？
  tags: [lost]
- id: qn-lost-017
  text: 帶路的人和跟著走的人，你更常是哪一種？
  tags: [lost]
- id: qn-lost-018
  text: 有沒有哪個轉角，讓你每次經過都會多看一眼？
  tags: [lost]
- id: qn-lost-019
  text: 「繞遠路」對你而言是浪費時間，還是另一種散步？
  tags: [lost]
- id: qn-lost-020
  text: 如果生活也算一種路，你現在感覺自己走在哪個路口？
  tags: [lost]
