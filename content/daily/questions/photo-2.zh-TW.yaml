# 每日一問 · 老照片與相簿（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-photo-021
  text: 翻相簿時，是照片裡的人先吸引你，還是背景的場景？
  tags: [photo]
- id: qn-photo-022
  text: 有沒有一張照片，你每次看衣著打扮都覺得很有時代感？
  tags: [photo]
- id: qn-photo-023
  text: 假如要把一張老照片放大貼在房間，你會挑哪一張？
  tags: [photo]
- id: qn-photo-024
  text: 照片背面若寫著日期和地點，那些字跡會讓你想到誰？
  tags: [photo]
- id: qn-photo-025
  text: 你比較喜歡刻意擺拍的照片，還是不經意抓拍的瞬間？
  tags: [photo]
- id: qn-photo-026
  text: 有哪一張全家福，缺了誰會讓你覺得畫面不完整？
  tags: [photo]
- id: qn-photo-027
  text: 看到自己某個年紀的照片，你會想對那時的自己說什麼？
  tags: [photo]
- id: qn-photo-028
  text: 相片裡的天氣和光線，會不會替你保存了那天的空氣感？
  tags: [photo]
- id: qn-photo-029
  text: 如果要用三張照片串成你的成長故事，你會怎麼挑？
  tags: [photo]
- id: qn-photo-030
  text: 有沒有一張照片，是被誰無意間拍到、你卻特別喜歡的？
  tags: [photo]
- id: qn-photo-031
  text: 老照片裡出現的某個物件，會勾起你對哪個地方的記憶？
  tags: [photo]
- id: qn-photo-032
  text: 你會替哪一張照片配上一段當時聽的音樂？
  tags: [photo]
- id: qn-photo-033
  text: 一張照片模糊、失焦了，對你而言反而多了什麼味道嗎？
  tags: [photo]
- id: qn-photo-034
  text: 如果能走進某張老照片待上一天，你想選哪一天？
  tags: [photo]
- id: qn-photo-035
  text: 相簿裡有沒有一張，你到現在還認不出那是哪裡？
  tags: [photo]
- id: qn-photo-036
  text: 幫別人拍照時，你習慣等他準備好，還是趁他自然的時候按下？
  tags: [photo]
- id: qn-photo-037
  text: 看著長輩年輕時的照片，你會從中找到自己的影子嗎？
  tags: [photo]
- id: qn-photo-038
  text: 有沒有一個地方，你想帶著舊照片回去，拍一張一樣角度的？
  tags: [photo]
- id: qn-photo-039
  text: 一張照片裡最打動你的，是笑容、動作，還是眼神？
  tags: [photo]
- id: qn-photo-040
  text: 若要為這一整年選出一張代表照，你腦中先浮現哪個畫面？
  tags: [photo]
