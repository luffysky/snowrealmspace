# 每日一問 · 期待與盼望。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-anticipate-001
  text: 最近有沒有一件小事，是你每天醒來會偷偷期待的？
  tags: [anticipate]
- id: qn-anticipate-002
  text: 如果為今年留一個盼望，你會把它寫成什麼樣的一句話？
  tags: [anticipate]
- id: qn-anticipate-003
  text: 有沒有一個地方，是你一直盼著哪天能親自去走走的？
  tags: [anticipate]
- id: qn-anticipate-004
  text: 對於未來的自己，你最想在哪一方面看見她的改變？
  tags: [anticipate]
- id: qn-anticipate-005
  text: 童年時你曾經盼望長大後能做的事，現在實現了嗎？
  tags: [anticipate]
- id: qn-anticipate-006
  text: 接下來的季節裡，有什麼畫面是你光想到就會微笑的？
  tags: [anticipate]
- id: qn-anticipate-007
  text: 你心裡有沒有一個一直放著、還沒開始的計畫？
  tags: [anticipate]
- id: qn-anticipate-008
  text: 如果盼望可以寄給某個人，你會把它寄給誰？
  tags: [anticipate]
- id: qn-anticipate-009
  text: 對於一段關係，你最溫柔的期待會是什麼樣子？
  tags: [anticipate]
- id: qn-anticipate-010
  text: 有沒有一件你正在等待的事，讓平凡的日子多了點色彩？
  tags: [anticipate]
- id: qn-anticipate-011
  text: 十年後的生活，你最想在裡面看見哪一個畫面？
  tags: [anticipate]
- id: qn-anticipate-012
  text: 你會怎麼形容那種「有事情在前方等你」的心情？
  tags: [anticipate]
- id: qn-anticipate-013
  text: 如果明天可以收到一個驚喜，你最希望它是什麼？
  tags: [anticipate]
- id: qn-anticipate-014
  text: 在你心中，有沒有一個一直沒說出口的小小願望？
  tags: [anticipate]
- id: qn-anticipate-015
  text: 這陣子有什麼新事物，讓你重新燃起了好奇與盼望？
  tags: [anticipate]
- id: qn-anticipate-016
  text: 假如可以預約一個未來的午後，你會把它安排成什麼樣子？
  tags: [anticipate]
- id: qn-anticipate-017
  text: 你最期待和誰一起度過接下來的某個特別日子？
  tags: [anticipate]
- id: qn-anticipate-018
  text: 有沒有一種生活的樣貌，是你一直悄悄嚮往的？
  tags: [anticipate]
- id: qn-anticipate-019
  text: 若要為心裡的盼望種下一顆種子，你會選擇種下什麼？
  tags: [anticipate]
- id: qn-anticipate-020
  text: 想到未來時，是哪一份期待讓你的眼睛會亮起來？
  tags: [anticipate]
