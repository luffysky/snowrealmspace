# 每日一問 · 人生意義（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-meaning-021
  text: 如果用一種顏色形容現在的生活，你會選哪一種？
  tags: [meaning]
- id: qn-meaning-022
  text: 有沒有一句話，是你想寫下來提醒未來的自己的？
  tags: [meaning]
- id: qn-meaning-023
  text: 你覺得自己是為了什麼，願意早起面對一天？
  tags: [meaning]
- id: qn-meaning-024
  text: 童年的你，會怎麼看現在的你？
  tags: [meaning]
- id: qn-meaning-025
  text: 什麼樣的付出，會讓你感覺自己有在被需要？
  tags: [meaning]
- id: qn-meaning-026
  text: 若時間可以慢下來，你最想留住哪一段日子？
  tags: [meaning]
- id: qn-meaning-027
  text: 對你來說，怎樣算是把日子過成自己的樣子？
  tags: [meaning]
- id: qn-meaning-028
  text: 有沒有一件事，你做的時候會覺得整個人是完整的？
  tags: [meaning]
- id: qn-meaning-029
  text: 你心裡有沒有一個地方，去了就會覺得踏實？
  tags: [meaning]
- id: qn-meaning-030
  text: 如果生命是一本書，你現在寫到哪一章了？
  tags: [meaning]
- id: qn-meaning-031
  text: 什麼樣的話，你聽了會突然覺得被理解？
  tags: [meaning]
- id: qn-meaning-032
  text: 你曾經在哪一刻，感覺自己和世界是連著的？
  tags: [meaning]
- id: qn-meaning-033
  text: 有什麼信念，是你就算沒人認同也想守著的？
  tags: [meaning]
- id: qn-meaning-034
  text: 若要送給二十年後的自己一句話，你想說什麼？
  tags: [meaning]
- id: qn-meaning-035
  text: 平凡的一天裡，哪個片刻最讓你覺得知足？
  tags: [meaning]
- id: qn-meaning-036
  text: 你希望自己老去時，還保有哪一種心情？
  tags: [meaning]
- id: qn-meaning-037
  text: 有沒有一種聲音或氣味，會讓你想起「這就是家」？
  tags: [meaning]
- id: qn-meaning-038
  text: 什麼時候你會覺得，辛苦是有它的價值的？
  tags: [meaning]
- id: qn-meaning-039
  text: 你想用什麼方式，好好謝謝走到現在的自己？
  tags: [meaning]
- id: qn-meaning-040
  text: 如果生活是一趟旅程，你此刻最想帶上什麼同行？
  tags: [meaning]
