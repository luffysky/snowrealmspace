# 每日一問 · 運動與身體活動（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sport-021
  text: 換上運動鞋、綁緊鞋帶的那一刻，你心裡浮現什麼？
  tags: [sport]
- id: qn-sport-022
  text: 你的身體最近有沒有某個動作，做起來比以前更順了？
  tags: [sport]
- id: qn-sport-023
  text: 音樂和運動搭在一起時，哪一種節拍最能帶動你？
  tags: [sport]
- id: qn-sport-024
  text: 爬樓梯到一半有點喘的時候，你通常在想些什麼？
  tags: [sport]
- id: qn-sport-025
  text: 對你來說，「暖身」這件事在生活裡還有哪些對應？
  tags: [sport]
- id: qn-sport-026
  text: 你更喜歡追求速度的痛快，還是慢慢延展的舒緩？
  tags: [sport]
- id: qn-sport-027
  text: 有沒有哪個運動場地，光是走進去就讓你精神一振？
  tags: [sport]
- id: qn-sport-028
  text: 運動完之後的那頓飯或那杯水，滋味有什麼不一樣？
  tags: [sport]
- id: qn-sport-029
  text: 你和身體的距離，最近是靠近了還是有點疏遠？
  tags: [sport]
- id: qn-sport-030
  text: 光腳踩在草地或沙灘上的感覺，讓你想起什麼？
  tags: [sport]
- id: qn-sport-031
  text: 你曾經在運動中突然發現自己做得到什麼事嗎？
  tags: [sport]
- id: qn-sport-032
  text: 陪別人一起動、當個加油的人，帶給你什麼感受？
  tags: [sport]
- id: qn-sport-033
  text: 如果讓你設計一段十分鐘的活動，你會怎麼安排？
  tags: [sport]
- id: qn-sport-034
  text: 呼吸的節奏和動作對上的那一瞬間，你有察覺過嗎？
  tags: [sport]
- id: qn-sport-035
  text: 哪一種季節的空氣，最讓你想在戶外好好活動一下？
  tags: [sport]
- id: qn-sport-036
  text: 你怎麼看待「休息」在身體活動裡扮演的角色？
  tags: [sport]
- id: qn-sport-037
  text: 有沒有一個人的運動樣子，讓你看了也想試試看？
  tags: [sport]
- id: qn-sport-038
  text: 身體僵硬了一整天後，你最想先舒展哪個部位？
  tags: [sport]
- id: qn-sport-039
  text: 在水裡、在跑道上、在山徑間，哪種環境最讓你放鬆？
  tags: [sport]
- id: qn-sport-040
  text: 如果身體會寫日記，今天它可能記下哪一段活動？
  tags: [sport]
