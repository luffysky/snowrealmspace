# 每日一問 · 成長／學習。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-grow-001
  text: 最近你嘗試了哪件新的事？
  tags: [growth]
- id: qn-grow-002
  text: 有沒有一件事，你比以前更擅長了？
  tags: [growth]
- id: qn-grow-003
  text: 今年的你，跟去年有什麼不同？
  tags: [growth]
- id: qn-grow-004
  text: 上一次踏出舒適圈，是什麼時候？
  tags: [growth]
- id: qn-grow-005
  text: 有沒有一個錯誤，其實教了你很多？
  tags: [growth]
- id: qn-grow-006
  text: 你想在哪方面，變得更好一點？
  tags: [growth]
- id: qn-grow-007
  text: 最近有什麼想法改變了？
  tags: [growth]
- id: qn-grow-008
  text: 你正在練習的一件事是什麼？
  tags: [growth]
- id: qn-grow-009
  text: 有沒有一個習慣，你想慢慢養成？
  tags: [growth]
- id: qn-grow-010
  text: 你欣賞現在的自己哪一點？
  tags: [growth]
- id: qn-grow-011
  text: 最近有什麼挑戰，你撐過來了？
  tags: [growth]
- id: qn-grow-012
  text: 你想放下哪個對自己沒幫助的想法？
  tags: [growth]
- id: qn-grow-013
  text: 有沒有一件事，你越做越有心得？
  tags: [growth]
- id: qn-grow-014
  text: 你希望明年的自己，記得今天什麼？
  tags: [growth]
- id: qn-grow-015
  text: 最近你對什麼產生了新的好奇？
  tags: [growth]
- id: qn-grow-016
  text: 有沒有一個恐懼，你正在慢慢面對？
  tags: [growth]
- id: qn-grow-017
  text: 你想跟過去的自己說什麼？
  tags: [growth]
- id: qn-grow-018
  text: 最近一次「原來如此」，是為了什麼？
  tags: [growth]
- id: qn-grow-019
  text: 你正在往哪個方向，一點點靠近？
  tags: [growth]
- id: qn-grow-020
  text: 有什麼事，你想給自己更多耐心？
  tags: [growth]
