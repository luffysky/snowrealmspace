# 每日一問 · 恐懼與害怕（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fear-021
  text: 有沒有一種害怕，是別人覺得沒什麼、對你卻很真實的？
  tags: [fear]
- id: qn-fear-022
  text: 你會怎麼形容緊張到最高點時，胸口那種說不出來的感覺？
  tags: [fear]
- id: qn-fear-023
  text: 遇到讓你發慌的事，你比較習慣先找人說，還是先自己待一會兒？
  tags: [fear]
- id: qn-fear-024
  text: 回頭看，有哪個曾讓你退縮的決定，其實藏著你很珍惜的東西？
  tags: [fear]
- id: qn-fear-025
  text: 什麼樣的一句話，能在你慌亂時讓你稍微穩下來？
  tags: [fear]
- id: qn-fear-026
  text: 你心裡最不想讓別人看見的那份脆弱，長什麼樣子？
  tags: [fear]
- id: qn-fear-027
  text: 如果把害怕分成很多層，最外面那層通常是什麼？
  tags: [fear]
- id: qn-fear-028
  text: 有沒有一個地方或角落，能讓緊繃的你慢慢鬆下來？
  tags: [fear]
- id: qn-fear-029
  text: 你覺得自己是從什麼時候開始，比較懂得跟不安相處的？
  tags: [fear]
- id: qn-fear-030
  text: 當某個人在你面前發抖時，你會想先為他做點什麼？
  tags: [fear]
- id: qn-fear-031
  text: 有哪種害怕，其實是因為你太在乎某段關係才會出現？
  tags: [fear]
- id: qn-fear-032
  text: 面對讓你卻步的事，什麼樣的準備會讓你覺得踏實一點？
  tags: [fear]
- id: qn-fear-033
  text: 你曾經在哪一刻，發現原本很怕的事沒有想像中那麼可怕？
  tags: [fear]
- id: qn-fear-034
  text: 如果不安是一種天氣，此刻你心裡的天空是什麼樣子？
  tags: [fear]
- id: qn-fear-035
  text: 有沒有一種擔心，是你希望自己能溫柔一點看待的？
  tags: [fear]
- id: qn-fear-036
  text: 你怎麼分辨哪些害怕值得聽，哪些只是舊日留下的迴音？
  tags: [fear]
- id: qn-fear-037
  text: 在你需要勇氣的時候，通常是誰的存在讓你敢往前一步？
  tags: [fear]
- id: qn-fear-038
  text: 有沒有一件小事，是你偷偷練習了很久才敢去做的？
  tags: [fear]
- id: qn-fear-039
  text: 若能對年幼、曾經很害怕的自己說句話，你會想說什麼？
  tags: [fear]
- id: qn-fear-040
  text: 當恐懼漸漸退去後，留在你心裡的通常是什麼樣的感覺？
  tags: [fear]
