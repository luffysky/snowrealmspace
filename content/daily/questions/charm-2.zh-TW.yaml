# 每日一問 · 幸運物與護身（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-charm-021
  text: 童年時你最寶貝的那樣小東西，後來去哪了？
  tags: [charm]
- id: qn-charm-022
  text: 假如幸運物會說話，你希望它平常對你說些什麼？
  tags: [charm]
- id: qn-charm-023
  text: 你會不會替某件物品編一個屬於它的故事？
  tags: [charm]
- id: qn-charm-024
  text: 在你心裡，護身物和紀念品之間的界線在哪裡？
  tags: [charm]
- id: qn-charm-025
  text: 有沒有一種味道或聲音，能像護身符一樣讓你安下心？
  tags: [charm]
- id: qn-charm-026
  text: 如果要把好運裝進一個盒子，你會放進哪些東西？
  tags: [charm]
- id: qn-charm-027
  text: 你手機或書桌上，有沒有一樣默默陪你很久的小物？
  tags: [charm]
- id: qn-charm-028
  text: 別人送你的護身物裡，哪一件背後有段特別的緣分？
  tags: [charm]
- id: qn-charm-029
  text: 換季或搬家時，你會怎麼決定一件幸運小物該留還是該走？
  tags: [charm]
- id: qn-charm-030
  text: 對你而言，親手做的護身物和買來的，感覺哪裡不一樣？
  tags: [charm]
- id: qn-charm-031
  text: 你有沒有一句話或一段旋律，是自己私下的「幸運咒語」？
  tags: [charm]
- id: qn-charm-032
  text: 如果幸運可以借給別人一天，你會想借給誰？
  tags: [charm]
- id: qn-charm-033
  text: 你覺得一件護身物，是越舊越有力量，還是越新越好？
  tags: [charm]
- id: qn-charm-034
  text: 旅行途中撿到的小東西，有哪一件被你留到了現在？
  tags: [charm]
- id: qn-charm-035
  text: 假如要為朋友的低潮挑一件護身小物，你會選什麼？
  tags: [charm]
- id: qn-charm-036
  text: 你身上的哪一樣配件，其實藏著只有自己知道的意義？
  tags: [charm]
- id: qn-charm-037
  text: 若讓你設計一款專屬護身符，它會長成什麼模樣？
  tags: [charm]
- id: qn-charm-038
  text: 你會不會把某個地方或某段時光，也當成一種護身的力量？
  tags: [charm]
- id: qn-charm-039
  text: 一件幸運物弄丟的時候，你心裡通常是什麼感覺？
  tags: [charm]
- id: qn-charm-040
  text: 對現在的你來說，什麼東西最接近「讓我安心」這幾個字？
  tags: [charm]
