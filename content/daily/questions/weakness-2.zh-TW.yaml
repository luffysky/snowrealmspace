# 每日一問 · 不擅長的事（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-weakness-021
  text: 有人稱讚你某件其實不太拿手的事時，你心裡是什麼滋味？
  tags: [weakness]
- id: qn-weakness-022
  text: 遇到別人輕鬆做到、你卻費力的事，你會怎麼看待這種差距？
  tags: [weakness]
- id: qn-weakness-023
  text: 有沒有哪一次，因為某項不擅長，反而意外把你帶往別的路？
  tags: [weakness]
- id: qn-weakness-024
  text: 剛認識一個人時，你會藏起自己的短處，還是大方讓對方知道？
  tags: [weakness]
- id: qn-weakness-025
  text: 若要挑一個弱項，你最不希望親近的人放在心上，會是哪個？
  tags: [weakness]
- id: qn-weakness-026
  text: 曾經有誰很有耐心地陪你練習不會的事嗎，那段回憶是什麼樣子？
  tags: [weakness]
- id: qn-weakness-027
  text: 對於不拿手的事，你會不會替自己設一個比較寬鬆的標準？
  tags: [weakness]
- id: qn-weakness-028
  text: 有哪件不擅長的事，是你選擇乾脆繞過、而不去硬碰硬的？
  tags: [weakness]
- id: qn-weakness-029
  text: 有沒有一件事，你寧可花錢或請人代勞，也不想自己動手？
  tags: [weakness]
- id: qn-weakness-030
  text: 如果能一夜之間補強一個弱項，你反而會有點捨不得失去什麼嗎？
  tags: [weakness]
- id: qn-weakness-031
  text: 有沒有一種笨拙，只有你自己知道、外人幾乎察覺不到？
  tags: [weakness]
- id: qn-weakness-032
  text: 反過來說，有沒有別人以為你不行、你其實默默應付得來的事？
  tags: [weakness]
- id: qn-weakness-033
  text: 需要在眾人面前做不拿手的事時，你的身體會出現什麼反應？
  tags: [weakness]
- id: qn-weakness-034
  text: 你會用開玩笑的方式聊自己的短處嗎，通常怎麼說？
  tags: [weakness]
- id: qn-weakness-035
  text: 在讀書或工作裡，哪一種任務老是把你的弱點翻出來？
  tags: [weakness]
- id: qn-weakness-036
  text: 隨著年紀或處境不同，你的某個弱項有沒有悄悄鬆動？
  tags: [weakness]
- id: qn-weakness-037
  text: 有哪個短處你已願意接受，又有哪個你仍想跟它較勁一番？
  tags: [weakness]
- id: qn-weakness-038
  text: 因為某件事做不好，你會不會不自覺地避開某些場合或某些人？
  tags: [weakness]
- id: qn-weakness-039
  text: 假如某個弱項變成了你的強項，你猜自己會懷念它帶來的什麼？
  tags: [weakness]
- id: qn-weakness-040
  text: 當弱點又冒出來時，什麼樣的小事能讓你對自己溫柔一點？
  tags: [weakness]
