# 每日一問 · 運動與身體活動。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-sport-001
  text: 最近一次流汗運動，身體給了你什麼感覺？
  tags: [sport]
- id: qn-sport-002
  text: 哪一種身體活動，會讓你不知不覺就投入其中？
  tags: [sport]
- id: qn-sport-003
  text: 對你來說，動起來的時候心裡在想些什麼？
  tags: [sport]
- id: qn-sport-004
  text: 清晨的散步和夜晚的伸展，你更偏好哪一個？
  tags: [sport]
- id: qn-sport-005
  text: 有沒有一項運動，是你一直很想嘗試卻還沒開始的？
  tags: [sport]
- id: qn-sport-006
  text: 學生時代的體育課，留給你什麼樣的回憶？
  tags: [sport]
- id: qn-sport-007
  text: 你喜歡獨自運動，還是有人作伴一起動？
  tags: [sport]
- id: qn-sport-008
  text: 身體累但心情舒暢的那一刻，通常發生在什麼時候？
  tags: [sport]
- id: qn-sport-009
  text: 走路、游泳、騎車，哪一種節奏最讓你自在？
  tags: [sport]
- id: qn-sport-010
  text: 什麼樣的天氣，會讓你特別想到戶外走走？
  tags: [sport]
- id: qn-sport-011
  text: 你的身體有沒有哪個部位，是運動後最先向你抱怨的？
  tags: [sport]
- id: qn-sport-012
  text: 看別人比賽的時候，最打動你的是哪個瞬間？
  tags: [sport]
- id: qn-sport-013
  text: 如果把運動想成一種對話，你的身體最近想告訴你什麼？
  tags: [sport]
- id: qn-sport-014
  text: 有哪個地方，是你覺得特別適合活動筋骨的？
  tags: [sport]
- id: qn-sport-015
  text: 讓你願意持續動下去的理由，會是什麼？
  tags: [sport]
- id: qn-sport-016
  text: 團體運動裡傳球或接力的默契，帶給你什麼感受？
  tags: [sport]
- id: qn-sport-017
  text: 你曾經因為運動而認識了誰，或去了哪裡嗎？
  tags: [sport]
- id: qn-sport-018
  text: 伸個懶腰、深呼吸的那一下，身體有什麼變化？
  tags: [sport]
- id: qn-sport-019
  text: 哪一種動作或姿勢，做起來會讓你覺得特別踏實？
  tags: [sport]
- id: qn-sport-020
  text: 如果明天有一小時完全屬於身體，你想怎麼度過？
  tags: [sport]
