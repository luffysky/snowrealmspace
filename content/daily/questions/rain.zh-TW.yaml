# 每日一問 · 下雨天。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-rain-001
  text: 下雨天待在家，你最想做的一件事是什麼？
  tags: [rain]
- id: qn-rain-002
  text: 雨打在窗戶上的聲音，聽起來讓你想到什麼？
  tags: [rain]
- id: qn-rain-003
  text: 你喜歡毛毛細雨，還是傾盆的大雨？
  tags: [rain]
- id: qn-rain-004
  text: 出門遇到突然下起的雨，你會怎麼反應？
  tags: [rain]
- id: qn-rain-005
  text: 雨後那股泥土和空氣的味道，你聞到時會想起哪裡？
  tags: [rain]
- id: qn-rain-006
  text: 撐傘走在雨裡，你的腳步會變快還是變慢？
  tags: [rain]
- id: qn-rain-007
  text: 小時候踩水窪的畫面，你還記得嗎？
  tags: [rain]
- id: qn-rain-008
  text: 如果雨一整天都不停，你會覺得煩，還是覺得放鬆？
  tags: [rain]
- id: qn-rain-009
  text: 雨天最適合配上什麼樣的音樂或聲音？
  tags: [rain]
- id: qn-rain-010
  text: 你有沒有故意淋過一場雨？
  tags: [rain]
- id: qn-rain-011
  text: 隔著車窗看外面的雨，那種感覺你會怎麼形容？
  tags: [rain]
- id: qn-rain-012
  text: 下雨天的餐桌上，你最想吃到哪一道熱的？
  tags: [rain]
- id: qn-rain-013
  text: 雨停之後天空放晴的那一刻，你的心情是什麼樣子？
  tags: [rain]
- id: qn-rain-014
  text: 如果要用一種顏色來形容雨天，你會選哪一個？
  tags: [rain]
- id: qn-rain-015
  text: 你手邊那把常用的傘，長什麼樣子？
  tags: [rain]
- id: qn-rain-016
  text: 半夜被雨聲吵醒時，你通常會做什麼？
  tags: [rain]
- id: qn-rain-017
  text: 和某個人一起躲雨的經驗，你有印象深刻的嗎？
  tags: [rain]
- id: qn-rain-018
  text: 雨天的街景裡，最吸引你目光的是什麼畫面？
  tags: [rain]
- id: qn-rain-019
  text: 如果可以決定，你希望雨在一天當中哪個時段落下？
  tags: [rain]
- id: qn-rain-020
  text: 對你來說，怎樣的雨天算是一個舒服的雨天？
  tags: [rain]
