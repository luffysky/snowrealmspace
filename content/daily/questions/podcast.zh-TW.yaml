# 每日一問 · Podcast 與聲音內容。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-podcast-001
  text: 最近有哪一集 Podcast，讓你聽完還想再回味？
  tags: [podcast]
- id: qn-podcast-002
  text: 你通常在什麼場景下戴上耳機聽節目？
  tags: [podcast]
- id: qn-podcast-003
  text: 一個聲音節目要具備什麼，你才會願意訂閱下去？
  tags: [podcast]
- id: qn-podcast-004
  text: 主持人的哪一種說話方式，會讓你想一直聽下去？
  tags: [podcast]
- id: qn-podcast-005
  text: 有沒有哪個聲音，已經變成你生活裡固定的陪伴？
  tags: [podcast]
- id: qn-podcast-006
  text: 你偏好一個人獨白的節目，還是好幾個人聊天的？
  tags: [podcast]
- id: qn-podcast-007
  text: 如果要開一檔屬於自己的節目，你會想聊什麼？
  tags: [podcast]
- id: qn-podcast-008
  text: 知識型、閒聊型、故事型的聲音內容，哪一種最抓得住你？
  tags: [podcast]
- id: qn-podcast-009
  text: 你聽節目時會加速播放，還是喜歡照原速慢慢聽？
  tags: [podcast]
- id: qn-podcast-010
  text: 有哪一段話是從某集節目聽來、後來一直記在心裡的？
  tags: [podcast]
- id: qn-podcast-011
  text: 通勤、做家事、睡前，你最常在哪個時段聽聲音內容？
  tags: [podcast]
- id: qn-podcast-012
  text: 你是怎麼發現那些後來很愛的節目的？
  tags: [podcast]
- id: qn-podcast-013
  text: 廣播、有聲書、Podcast 之間，你和哪一種聲音最親近？
  tags: [podcast]
- id: qn-podcast-014
  text: 什麼樣的話題，你會特別想聽別人用聲音來談？
  tags: [podcast]
- id: qn-podcast-015
  text: 節目的音質、配樂或剪輯，會影響你的收聽感受嗎？
  tags: [podcast]
- id: qn-podcast-016
  text: 有沒有哪一位聲音創作者，是你會想推薦給朋友的？
  tags: [podcast]
- id: qn-podcast-017
  text: 聽節目對你而言，比較像陪伴、學習，還是別的？
  tags: [podcast]
- id: qn-podcast-018
  text: 你會邊聽節目邊做別的事，還是專心只聽它？
  tags: [podcast]
- id: qn-podcast-019
  text: 若要讓某位嘉賓來上你的節目，你想邀誰、想問什麼？
  tags: [podcast]
- id: qn-podcast-020
  text: 聲音和文字、影像相比，帶給你的感覺哪裡不一樣？
  tags: [podcast]
