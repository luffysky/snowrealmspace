# 每日一問 · 下廚與料理。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-cooking-001
  text: 你最拿手的一道菜是什麼？
  tags: [cooking]
- id: qn-cooking-002
  text: 上一次走進廚房動手做飯，是為了什麼樣的場合？
  tags: [cooking]
- id: qn-cooking-003
  text: 切菜、翻炒、燉煮這些步驟裡，哪一個讓你覺得最療癒？
  tags: [cooking]
- id: qn-cooking-004
  text: 如果要教別人做一道菜，你會從哪一道開始教？
  tags: [cooking]
- id: qn-cooking-005
  text: 家裡的冰箱剩下零散食材時，你通常會變出怎樣的一餐？
  tags: [cooking]
- id: qn-cooking-006
  text: 有沒有哪一種廚房工具，是你用了就再也回不去的？
  tags: [cooking]
- id: qn-cooking-007
  text: 你調味的時候是照著食譜量，還是憑手感抓？
  tags: [cooking]
- id: qn-cooking-008
  text: 第一次下廚失敗的畫面，現在想起來是什麼樣子？
  tags: [cooking]
- id: qn-cooking-009
  text: 煎、煮、炒、炸、烤，哪一種烹調方式最合你的性子？
  tags: [cooking]
- id: qn-cooking-010
  text: 有什麼料理是你一直想挑戰、卻還沒動手做的？
  tags: [cooking]
- id: qn-cooking-011
  text: 誰教會你握起鍋鏟的？那道菜還記得嗎？
  tags: [cooking]
- id: qn-cooking-012
  text: 為別人下廚和只煮給自己吃，感覺有什麼不一樣？
  tags: [cooking]
- id: qn-cooking-013
  text: 廚房裡的哪一種香味，最能讓你安下心來？
  tags: [cooking]
- id: qn-cooking-014
  text: 你會怎麼把一道普通的家常菜，做出屬於自己的味道？
  tags: [cooking]
- id: qn-cooking-015
  text: 備料到上桌的整段過程中，哪個瞬間最讓你有成就感？
  tags: [cooking]
- id: qn-cooking-016
  text: 手邊如果只有一口鍋，你想用它做出什麼？
  tags: [cooking]
- id: qn-cooking-017
  text: 跟著影片或食譜做菜時，你會照著做還是自己改？
  tags: [cooking]
- id: qn-cooking-018
  text: 有哪一種食材，是你到現在都還處理不太順手的？
  tags: [cooking]
- id: qn-cooking-019
  text: 如果替家人辦一桌菜，你會怎麼安排這幾道料理？
  tags: [cooking]
- id: qn-cooking-020
  text: 對你來說，下廚這件事帶來的是放鬆還是別的感受？
  tags: [cooking]
