# 每日一問 · 存錢與省錢。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-saving-001
  text: 你有沒有一套屬於自己的存錢方法？
  tags: [saving]
- id: qn-saving-002
  text: 上一次為了省下一筆錢，你做了什麼樣的調整？
  tags: [saving]
- id: qn-saving-003
  text: 存下來的錢，你心裡通常會替它們安排什麼用途？
  tags: [saving]
- id: qn-saving-004
  text: 記帳這件事，對你來說是有幫助還是負擔？
  tags: [saving]
- id: qn-saving-005
  text: 生活裡有哪一項花費，是你後來刻意縮減下來的？
  tags: [saving]
- id: qn-saving-006
  text: 面對想買和需要買，你怎麼替自己做取捨？
  tags: [saving]
- id: qn-saving-007
  text: 你會固定每個月撥一筆錢存起來，還是有剩才存？
  tags: [saving]
- id: qn-saving-008
  text: 有沒有哪個省錢的小習慣，是你維持了很久的？
  tags: [saving]
- id: qn-saving-009
  text: 你是怎麼分辨一樣東西究竟划不划算的？
  tags: [saving]
- id: qn-saving-010
  text: 如果替明年設一個存錢的小目標，你會設多少？
  tags: [saving]
- id: qn-saving-011
  text: 從小到大，家裡對用錢和存錢的態度影響了你多少？
  tags: [saving]
- id: qn-saving-012
  text: 存零錢、存整筆、還是自動轉存，哪一種方式最適合你？
  tags: [saving]
- id: qn-saving-013
  text: 有沒有哪一次省下的錢，讓你後來覺得特別值得？
  tags: [saving]
- id: qn-saving-014
  text: 促銷或折扣出現時，你會怎麼判斷該不該出手？
  tags: [saving]
- id: qn-saving-015
  text: 你會把存下的錢放著不動，還是拿去做別的規劃？
  tags: [saving]
- id: qn-saving-016
  text: 哪一類開銷你願意省，哪一類你捨得多花？
  tags: [saving]
- id: qn-saving-017
  text: 如果朋友問你怎麼開始存錢，你會給他什麼建議？
  tags: [saving]
- id: qn-saving-018
  text: 帳戶數字慢慢變多的時候，你心裡是什麼感覺？
  tags: [saving]
- id: qn-saving-019
  text: 有沒有一樣看似小、卻幫你省下不少的日常習慣？
  tags: [saving]
- id: qn-saving-020
  text: 對你來說，存錢比較像安全感，還是為了某個想望？
  tags: [saving]
