# 每日一問 · 時間（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-time-021
  text: 最近有沒有哪個瞬間，讓你覺得時間彷彿慢了下來？
  tags: [time]
- id: qn-time-022
  text: 回想過去這一年，你感覺過得快還是慢？
  tags: [time]
- id: qn-time-023
  text: 你和時鐘的關係，是常盯著它，還是常忘了它？
  tags: [time]
- id: qn-time-024
  text: 哪一段人生時光，如果能重新經歷一次，你想再走一遍？
  tags: [time]
- id: qn-time-025
  text: 對你來說，「當下」是容易把握，還是容易溜走？
  tags: [time]
- id: qn-time-026
  text: 隨著年紀增長，你對時間的感覺有什麼改變？
  tags: [time]
- id: qn-time-027
  text: 有沒有一種等待，你其實並不介意它久一點？
  tags: [time]
- id: qn-time-028
  text: 一天當中，哪個時刻你最能感覺到時間的流動？
  tags: [time]
- id: qn-time-029
  text: 如果時間能暫停十分鐘，你想在哪一刻按下暫停？
  tags: [time]
- id: qn-time-030
  text: 童年的某個夏天，在你記憶裡有多長？
  tags: [time]
- id: qn-time-031
  text: 你覺得自己活在過去、現在還是未來的成分多一些？
  tags: [time]
- id: qn-time-032
  text: 什麼樣的事情，會讓你願意慢慢來、不趕時間？
  tags: [time]
- id: qn-time-033
  text: 回頭看，哪一段時期在當時很難熬，如今卻覺得很短？
  tags: [time]
- id: qn-time-034
  text: 面對期限，你是提早完成的人，還是最後一刻的人？
  tags: [time]
- id: qn-time-035
  text: 有哪一刻，你希望它可以停留久一點？
  tags: [time]
- id: qn-time-036
  text: 你怎麼看待「浪費時間」這回事？
  tags: [time]
- id: qn-time-037
  text: 一年四季裡，哪個季節讓你最感覺到時間在走？
  tags: [time]
- id: qn-time-038
  text: 如果可以借五年給未來、或還五年給過去，你會怎麼選？
  tags: [time]
- id: qn-time-039
  text: 什麼樣的相處，會讓你覺得時間過得特別快？
  tags: [time]
- id: qn-time-040
  text: 對現在的你而言，時間是朋友還是對手？
  tags: [time]
