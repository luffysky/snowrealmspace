# 每日一問 · 樂趣（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-fun-021
  text: 你小時候最愛玩的遊戲是什麼？
  tags: [fun]
- id: qn-fun-022
  text: 有什麼是你一個人也能玩得很開心的？
  tags: [fun]
- id: qn-fun-023
  text: 什麼樣的聲音或音樂，會讓你想動起來？
  tags: [fun]
- id: qn-fun-024
  text: 如果今天是完全屬於你的假日，你想怎麼揮霍？
  tags: [fun]
- id: qn-fun-025
  text: 有哪件事，別人覺得無聊、你卻樂在其中？
  tags: [fun]
- id: qn-fun-026
  text: 上一次玩到滿身大汗或笑到肚子痛，是什麼場合？
  tags: [fun]
- id: qn-fun-027
  text: 你有沒有什麼奇怪但療癒的小娛樂？
  tags: [fun]
- id: qn-fun-028
  text: 如果能和朋友一起做一件蠢事，你想做什麼？
  tags: [fun]
- id: qn-fun-029
  text: 什麼樣的遊戲或活動，會讓你變得很好勝？
  tags: [fun]
- id: qn-fun-030
  text: 你最近想重溫哪個小時候的娛樂？
  tags: [fun]
- id: qn-fun-031
  text: 有什麼影片或內容，你可以一看再看都不膩？
  tags: [fun]
- id: qn-fun-032
  text: 如果現在窗外在下雨，你會想玩什麼？
  tags: [fun]
- id: qn-fun-033
  text: 你覺得自己玩起來最放得開的是哪一面？
  tags: [fun]
- id: qn-fun-034
  text: 有沒有一種玩法，是你長大後才發現很好玩的？
  tags: [fun]
- id: qn-fun-035
  text: 什麼東西一到手，你就會忍不住把玩？
  tags: [fun]
- id: qn-fun-036
  text: 如果要辦一場只有你想得出來的派對，會是什麼樣子？
  tags: [fun]
- id: qn-fun-037
  text: 你最喜歡在哪裡發呆或閒晃？
  tags: [fun]
- id: qn-fun-038
  text: 有什麼是你玩過一次就上癮的？
  tags: [fun]
- id: qn-fun-039
  text: 如果今天可以不做正事，你想拿來享受什麼？
  tags: [fun]
- id: qn-fun-040
  text: 什麼樣的小驚喜，會讓你一整天都很開心？
  tags: [fun]
