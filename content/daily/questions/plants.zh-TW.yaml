# 每日一問 · 植物與園藝。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-plant-001
  text: 你身邊有沒有一株植物，是你會特別留意它的？
  tags: [plants]
- id: qn-plant-002
  text: 哪一種花或葉子，看到就會讓你停下腳步？
  tags: [plants]
- id: qn-plant-003
  text: 如果要在窗邊種點什麼，你的第一個念頭是什麼？
  tags: [plants]
- id: qn-plant-004
  text: 泥土的氣味，會讓你想起哪些畫面？
  tags: [plants]
- id: qn-plant-005
  text: 照顧植物的過程中，你觀察到它哪些細微的變化？
  tags: [plants]
- id: qn-plant-006
  text: 對你來說，一座理想的小花園會是什麼模樣？
  tags: [plants]
- id: qn-plant-007
  text: 多肉、香草、觀葉，哪一類最合你的心意？
  tags: [plants]
- id: qn-plant-008
  text: 有沒有哪株植物，是別人送的、對你別具意義？
  tags: [plants]
- id: qn-plant-009
  text: 澆水的那幾分鐘，通常帶給你什麼樣的心情？
  tags: [plants]
- id: qn-plant-010
  text: 你曾經看著一顆種子發芽嗎，那是什麼感覺？
  tags: [plants]
- id: qn-plant-011
  text: 季節更替時，哪些植物的變化最讓你在意？
  tags: [plants]
- id: qn-plant-012
  text: 如果家裡多一個角落給綠意，你想把它擺在哪？
  tags: [plants]
- id: qn-plant-013
  text: 修剪枝葉的時候，你心裡通常在想些什麼？
  tags: [plants]
- id: qn-plant-014
  text: 有哪種植物的名字或樣子，讓你覺得特別有趣？
  tags: [plants]
- id: qn-plant-015
  text: 走在有樹蔭的路上，你會注意到哪些細節？
  tags: [plants]
- id: qn-plant-016
  text: 你和植物之間，有沒有一段照顧不來的故事？
  tags: [plants]
- id: qn-plant-017
  text: 如果一株植物會說話，你最想問它什麼？
  tags: [plants]
- id: qn-plant-018
  text: 陽台、庭院、室內窗台，哪裡最適合你和綠意相處？
  tags: [plants]
- id: qn-plant-019
  text: 看著植物慢慢長大，帶給你什麼樣的體會？
  tags: [plants]
- id: qn-plant-020
  text: 如果要送一盆植物給重要的人，你會挑哪一種？
  tags: [plants]
