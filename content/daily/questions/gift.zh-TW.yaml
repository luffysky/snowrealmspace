# 每日一問 · 收禮與送禮。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-gift-001
  text: 你收過最難忘的一份禮物是什麼？
  tags: [gift]
- id: qn-gift-002
  text: 挑禮物送人的時候，你最看重的是什麼？
  tags: [gift]
- id: qn-gift-003
  text: 有沒有一份禮物，你到現在都還好好留著？
  tags: [gift]
- id: qn-gift-004
  text: 對你來說，收到什麼樣的禮物會最開心？
  tags: [gift]
- id: qn-gift-005
  text: 送禮這件事，你覺得心意和價格哪個更重要？
  tags: [gift]
- id: qn-gift-006
  text: 你比較喜歡收到驚喜，還是自己挑想要的？
  tags: [gift]
- id: qn-gift-007
  text: 上一次送人禮物，是為了什麼樣的場合？
  tags: [gift]
- id: qn-gift-008
  text: 有沒有哪份禮物，讓你感覺對方很懂你？
  tags: [gift]
- id: qn-gift-009
  text: 如果不必考慮預算，你最想送某個人什麼？
  tags: [gift]
- id: qn-gift-010
  text: 收到不太合心意的禮物時，你會怎麼回應？
  tags: [gift]
- id: qn-gift-011
  text: 你送過最用心的一份禮物，背後有什麼故事？
  tags: [gift]
- id: qn-gift-012
  text: 對你而言，親手做的禮物有什麼不一樣？
  tags: [gift]
- id: qn-gift-013
  text: 有沒有一份禮物，讓你連帶記住了送禮的人？
  tags: [gift]
- id: qn-gift-014
  text: 你習慣提早準備禮物，還是常常臨時才想？
  tags: [gift]
- id: qn-gift-015
  text: 什麼樣的禮物，會讓你覺得收到了滿滿的心意？
  tags: [gift]
- id: qn-gift-016
  text: 如果要送一份禮物給現在的自己，你會挑什麼？
  tags: [gift]
- id: qn-gift-017
  text: 你收過最出乎意料的一份禮物是什麼？
  tags: [gift]
- id: qn-gift-018
  text: 送禮的時候，你會很在意對方喜不喜歡嗎？
  tags: [gift]
- id: qn-gift-019
  text: 有沒有一份你很想送、卻始終沒送出的禮物？
  tags: [gift]
- id: qn-gift-020
  text: 一份好的禮物，對你來說要具備什麼？
  tags: [gift]
