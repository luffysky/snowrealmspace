# 每日一問 · 當下覺察（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-present-021
  text: 閉上眼睛數三個呼吸之後，你注意到了什麼？
  tags: [present]
- id: qn-present-022
  text: 此刻房間裡最細微的聲音，是從哪裡來的？
  tags: [present]
- id: qn-present-023
  text: 你腳掌現在踩著的地面，是什麼觸感？
  tags: [present]
- id: qn-present-024
  text: 如果把注意力放在雙手，它們現在正在做什麼？
  tags: [present]
- id: qn-present-025
  text: 此刻光線落在哪裡，讓你多看了一眼？
  tags: [present]
- id: qn-present-026
  text: 現在的空氣聞起來，帶著什麼味道？
  tags: [present]
- id: qn-present-027
  text: 你此刻的坐姿或站姿，透露出什麼？
  tags: [present]
- id: qn-present-028
  text: 眼前哪一種顏色，此刻特別跳進你的視線？
  tags: [present]
- id: qn-present-029
  text: 如果現在慢下來一半的速度，會有什麼不一樣？
  tags: [present]
- id: qn-present-030
  text: 此刻你的肩膀，是鬆的還是緊的？
  tags: [present]
- id: qn-present-031
  text: 現在觸手可及的東西裡，哪一樣你其實很喜歡？
  tags: [present]
- id: qn-present-032
  text: 這一刻的溫度，落在身上是什麼感覺？
  tags: [present]
- id: qn-present-033
  text: 你剛才的那個念頭，是從哪裡冒出來的？
  tags: [present]
- id: qn-present-034
  text: 如果此刻替現在的心情選一種天氣，會是哪一種？
  tags: [present]
- id: qn-present-035
  text: 現在窗外或門外，正在發生什麼？
  tags: [present]
- id: qn-present-036
  text: 此刻你嘴角的弧度，比較靠近哪一邊？
  tags: [present]
- id: qn-present-037
  text: 如果用一個字形容此刻的自己，你會選哪個？
  tags: [present]
- id: qn-present-038
  text: 現在你的呼吸，是深的還是淺的？
  tags: [present]
- id: qn-present-039
  text: 此刻若把手機放下，你的視線會落向哪？
  tags: [present]
- id: qn-present-040
  text: 這一刻正在陪著你的東西，是什麼？
  tags: [present]
