# 每日一問 · 收禮與送禮（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-gift-021
  text: 拆開一份禮物的那一刻，你心裡通常會浮現什麼？
  tags: [gift]
- id: qn-gift-022
  text: 你送禮時，會想在裡頭悄悄藏進什麼樣的訊息？
  tags: [gift]
- id: qn-gift-023
  text: 有沒有一份禮物，是你想了好久才決定要送什麼？
  tags: [gift]
- id: qn-gift-024
  text: 對你而言，包裝和卡片在一份禮物裡佔了多少分量？
  tags: [gift]
- id: qn-gift-025
  text: 收下一份禮物後，你會用什麼方式讓對方知道你的心情？
  tags: [gift]
- id: qn-gift-026
  text: 有沒有一份禮物，時隔多年你才慢慢讀懂它的意義？
  tags: [gift]
- id: qn-gift-027
  text: 送禮和收禮，哪一邊讓你更容易感到緊張？
  tags: [gift]
- id: qn-gift-028
  text: 挑禮物時，你比較相信自己的直覺，還是對方給的提示？
  tags: [gift]
- id: qn-gift-029
  text: 有沒有一份禮物，讓你和某個人的關係悄悄有了變化？
  tags: [gift]
- id: qn-gift-030
  text: 你會為了送禮，特地把對方平時說過的話記下來嗎？
  tags: [gift]
- id: qn-gift-031
  text: 一份禮物要陪你多久，你才會覺得它真正屬於你？
  tags: [gift]
- id: qn-gift-032
  text: 有沒有一種禮物，你收下之後也很想轉送給別人？
  tags: [gift]
- id: qn-gift-033
  text: 把禮物送出去後，你會回頭想像對方使用它的模樣嗎？
  tags: [gift]
- id: qn-gift-034
  text: 對你來說，一份禮物最動人的往往是它的哪個部分？
  tags: [gift]
- id: qn-gift-035
  text: 有沒有一份禮物，其實你更想留給自己，最後卻送了出去？
  tags: [gift]
- id: qn-gift-036
  text: 你怎麼看待那種「派不上用場卻很浪漫」的禮物？
  tags: [gift]
- id: qn-gift-037
  text: 收到別人特地為你挑選的禮物時，你會注意到哪些細節？
  tags: [gift]
- id: qn-gift-038
  text: 如果用一句話代替一份禮物，你會對某個人說什麼？
  tags: [gift]
- id: qn-gift-039
  text: 有沒有一份遲了很久才送出的禮物，後來變得怎麼樣了？
  tags: [gift]
- id: qn-gift-040
  text: 你希望自己送出的禮物，在對方的生活裡扮演什麼角色？
  tags: [gift]
