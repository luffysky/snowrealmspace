# 每日一問 · 關係（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-rel-021
  text: 在一段關係裡，你比較容易先開口的是道歉還是道謝？
  tags: [relations]
- id: qn-rel-022
  text: 有沒有一個人，讓你重新認識了「信任」這兩個字？
  tags: [relations]
- id: qn-rel-023
  text: 當朋友和你意見不同時，你們通常怎麼收場？
  tags: [relations]
- id: qn-rel-024
  text: 你和誰之間，有一種不用多說也懂的默契？
  tags: [relations]
- id: qn-rel-025
  text: 哪一種相處方式，會讓你覺得被真正看見？
  tags: [relations]
- id: qn-rel-026
  text: 若要為某段友情取一個名字，你會取什麼？
  tags: [relations]
- id: qn-rel-027
  text: 隨著年紀，你對「朋友」的定義有沒有悄悄改變？
  tags: [relations]
- id: qn-rel-028
  text: 和家人之間，有什麼是你們從沒說出口卻都明白的？
  tags: [relations]
- id: qn-rel-029
  text: 你欣賞某個人的哪個特質，卻還沒告訴過他？
  tags: [relations]
- id: qn-rel-030
  text: 當別人向你傾訴，你會怎麼讓他覺得安心？
  tags: [relations]
- id: qn-rel-031
  text: 有沒有一段漸行漸遠的關係，你心裡其實還惦記著？
  tags: [relations]
- id: qn-rel-032
  text: 你身邊有誰，是靠時間慢慢熬出來的交情？
  tags: [relations]
- id: qn-rel-033
  text: 遇到誤會時，你偏向解釋清楚，還是給彼此空間？
  tags: [relations]
- id: qn-rel-034
  text: 什麼樣的一句問候，會讓平淡的一天忽然亮起來？
  tags: [relations]
- id: qn-rel-035
  text: 你曾經因為某個人，而學會了怎麼付出嗎？
  tags: [relations]
- id: qn-rel-036
  text: 在關係裡，你更需要的是被理解，還是被支持？
  tags: [relations]
- id: qn-rel-037
  text: 有哪一個人的存在，讓你覺得世界沒那麼難熬？
  tags: [relations]
- id: qn-rel-038
  text: 你和誰之間的相處，是可以安靜待著也不尷尬的？
  tags: [relations]
- id: qn-rel-039
  text: 若能和某個人重新認識一次，你會選誰？
  tags: [relations]
- id: qn-rel-040
  text: 這一年裡，是誰悄悄成了你生活的一部分？
  tags: [relations]
