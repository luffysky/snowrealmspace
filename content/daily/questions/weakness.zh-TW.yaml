# 每日一問 · 不擅長的事。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-weakness-001
  text: 有沒有一件事，你試了很多次仍然覺得自己不太在行？
  tags: [weakness]
- id: qn-weakness-002
  text: 當你意識到某件事做不太來時，心裡通常會冒出什麼念頭？
  tags: [weakness]
- id: qn-weakness-003
  text: 有哪種場合會讓你明顯感覺到自己的笨拙？
  tags: [weakness]
- id: qn-weakness-004
  text: 你會怎麼面對別人看見你不擅長的那一面？
  tags: [weakness]
- id: qn-weakness-005
  text: 小時候被說做不好的某件事，如今在你眼中變成什麼樣子？
  tags: [weakness]
- id: qn-weakness-006
  text: 有沒有一項技能，你其實不太行、卻也不打算勉強自己精通？
  tags: [weakness]
- id: qn-weakness-007
  text: 面對不拿手的任務時，你偏向自己慢慢摸索，還是找人幫忙？
  tags: [weakness]
- id: qn-weakness-008
  text: 哪一類事情，光是想到要開始就讓你有點卻步？
  tags: [weakness]
- id: qn-weakness-009
  text: 你覺得「不擅長」和「還沒熟悉」對你來說有什麼不一樣？
  tags: [weakness]
- id: qn-weakness-010
  text: 有沒有某個弱項，反而讓你更懂得欣賞擅長它的人？
  tags: [weakness]
- id: qn-weakness-011
  text: 當你在不熟悉的領域出錯時，你會用什麼方式對待自己？
  tags: [weakness]
- id: qn-weakness-012
  text: 有哪件事你嘴上說不會，其實心裡有點想試試看？
  tags: [weakness]
- id: qn-weakness-013
  text: 你身邊有沒有誰的擅長，剛好補上了你的不擅長？
  tags: [weakness]
- id: qn-weakness-014
  text: 如果可以坦然承認一項自己的短處，你會想先說哪一個？
  tags: [weakness]
- id: qn-weakness-015
  text: 有沒有一種「做不好也沒關係」的事，讓你反而玩得很放鬆？
  tags: [weakness]
- id: qn-weakness-016
  text: 你覺得自己在人際、動手、還是思考哪一塊比較不順手？
  tags: [weakness]
- id: qn-weakness-017
  text: 曾經很怕自己做不好的某件事，後來和它的關係有變化嗎？
  tags: [weakness]
- id: qn-weakness-018
  text: 當不擅長的事非做不可時，你會替自己準備些什麼？
  tags: [weakness]
- id: qn-weakness-019
  text: 有哪個弱點，你已經學會和它自在地共處了？
  tags: [weakness]
- id: qn-weakness-020
  text: 如果不用一定變厲害，你會想單純去體驗哪件不拿手的事？
  tags: [weakness]
