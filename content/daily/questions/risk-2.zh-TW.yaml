# 每日一問 · 冒險與挑戰（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-risk-021
  text: 回頭看，哪一次跨出舒適圈的經驗，讓你至今仍會想起？
  tags: [risk]
- id: qn-risk-022
  text: 你心裡有沒有一份還沒實現、卻始終沒放下的挑戰清單？
  tags: [risk]
- id: qn-risk-023
  text: 什麼樣的恐懼，你反而想找一天正面去面對？
  tags: [risk]
- id: qn-risk-024
  text: 如果冒險不一定要驚天動地，你想從哪件小事開始試膽？
  tags: [risk]
- id: qn-risk-025
  text: 面對一扇不知通往何處的門，你會是那個先推開的人嗎？
  tags: [risk]
- id: qn-risk-026
  text: 有什麼你一直說「總有一天」的挑戰，其實很想現在就動身？
  tags: [risk]
- id: qn-risk-027
  text: 你覺得自己願意為了哪一種收穫，去承擔一點失敗的可能？
  tags: [risk]
- id: qn-risk-028
  text: 一個人獨自完成的探險，和一群人一起闖，你更被哪種吸引？
  tags: [risk]
- id: qn-risk-029
  text: 什麼樣的挑戰，就算沒人知道結果，你也想為自己試一次？
  tags: [risk]
- id: qn-risk-030
  text: 如果要跳脫熟悉的生活軌道半年，你會想把自己丟到哪裡？
  tags: [risk]
- id: qn-risk-031
  text: 有哪種你不擅長的事，反而勾起你想挑戰看看的念頭？
  tags: [risk]
- id: qn-risk-032
  text: 當別人都勸你別冒這個險，什麼理由會讓你仍想試試？
  tags: [risk]
- id: qn-risk-033
  text: 你想在身體還撐得住的時候，去征服哪一種地形或距離？
  tags: [risk]
- id: qn-risk-034
  text: 假如可以無痛重來一次，你會想在哪件事上更大膽？
  tags: [risk]
- id: qn-risk-035
  text: 什麼樣的挑戰，會讓你願意連續練習很久也不喊累？
  tags: [risk]
- id: qn-risk-036
  text: 你比較嚮往征服自然的險，還是挑戰自己極限的險？
  tags: [risk]
- id: qn-risk-037
  text: 有沒有一種文化或生活方式，陌生到讓你想親身跳進去體驗？
  tags: [risk]
- id: qn-risk-038
  text: 如果冒險的代價是暫時的狼狽，你願意換取什麼樣的故事？
  tags: [risk]
- id: qn-risk-039
  text: 你想在幾歲之前，替自己完成哪一場說走就走的壯遊？
  tags: [risk]
- id: qn-risk-040
  text: 當一個大膽的念頭冒出來，你通常會先問自己什麼？
  tags: [risk]
