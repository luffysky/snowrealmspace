# 每日一問 · 青春期與年少（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-teen-021
  text: 十幾歲時，你偷偷喜歡過的人，是什麼樣子的？
  tags: [teen]
- id: qn-teen-022
  text: 那時候放學之後，你最常和誰待在一起？
  tags: [teen]
- id: qn-teen-023
  text: 學生時代，哪一門課或哪位老師讓你特別有印象？
  tags: [teen]
- id: qn-teen-024
  text: 青春期的你，曾經為了什麼事鼓起勇氣反抗？
  tags: [teen]
- id: qn-teen-025
  text: 那個年紀，你的零用錢多半花在什麼上面？
  tags: [teen]
- id: qn-teen-026
  text: 十幾歲的你，最喜歡的打扮是什麼模樣？
  tags: [teen]
- id: qn-teen-027
  text: 少年時代，你有沒有寫日記的習慣，都寫些什麼？
  tags: [teen]
- id: qn-teen-028
  text: 那時候有沒有一部電影或一本書，改變了你看世界的方式？
  tags: [teen]
- id: qn-teen-029
  text: 青春期的你，心底最害怕的是什麼？
  tags: [teen]
- id: qn-teen-030
  text: 那段日子，同學們都怎麼稱呼你？
  tags: [teen]
- id: qn-teen-031
  text: 那個年紀，你最期待的假期或節日是哪一個？
  tags: [teen]
- id: qn-teen-032
  text: 少年時代，有沒有一款遊戲或一部漫畫，讓你廢寢忘食？
  tags: [teen]
- id: qn-teen-033
  text: 青春期裡，你和好朋友之間發生過什麼樣的爭執？
  tags: [teen]
- id: qn-teen-034
  text: 那個年紀，你最想從事的職業是什麼？
  tags: [teen]
- id: qn-teen-035
  text: 青春期的你，週末通常是怎麼打發的？
  tags: [teen]
- id: qn-teen-036
  text: 十幾歲時，有沒有一個大人，讓你覺得他真心相信你？
  tags: [teen]
- id: qn-teen-037
  text: 少年時代，有沒有一種氣味或聲音，能立刻把你拉回那段時光？
  tags: [teen]
- id: qn-teen-038
  text: 那個年紀，你笑得最開懷的一次是為了什麼？
  tags: [teen]
- id: qn-teen-039
  text: 青春期裡，哪一次的道別讓你難以釋懷？
  tags: [teen]
- id: qn-teen-040
  text: 十幾歲的你，最珍惜卻沒能好好留住的東西是什麼？
  tags: [teen]
