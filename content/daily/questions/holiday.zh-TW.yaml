# 每日一問 · 假期與休假。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-holiday-001
  text: 如果明天突然多出一天假，你會怎麼安排？
  tags: [holiday]
- id: qn-holiday-002
  text: 對你來說，理想的週末是怎麼度過的？
  tags: [holiday]
- id: qn-holiday-003
  text: 放長假時，你比較想出門走走，還是待在家裡？
  tags: [holiday]
- id: qn-holiday-004
  text: 上一個休假日，你把時間花在了哪些事情上？
  tags: [holiday]
- id: qn-holiday-005
  text: 有沒有一種放假方式，光是想到就讓你嘴角上揚？
  tags: [holiday]
- id: qn-holiday-006
  text: 忙了好一陣子之後，你最想給自己放什麼樣的假？
  tags: [holiday]
- id: qn-holiday-007
  text: 連假的第一天早上，你通常想先做什麼？
  tags: [holiday]
- id: qn-holiday-008
  text: 如果可以請上一整週的假，你心裡浮現的是哪個計畫？
  tags: [holiday]
- id: qn-holiday-009
  text: 度假時，你喜歡把行程排滿，還是多留一點空白？
  tags: [holiday]
- id: qn-holiday-010
  text: 什麼樣的假期結束後，會讓你覺得真的休息夠了？
  tags: [holiday]
- id: qn-holiday-011
  text: 你有沒有一個一直想去、卻還沒排進假期的地方？
  tags: [holiday]
- id: qn-holiday-012
  text: 放假的日子裡，你最珍惜的是哪一段時光？
  tags: [holiday]
- id: qn-holiday-013
  text: 對現在的你來說，怎樣的休假算得上奢侈？
  tags: [holiday]
- id: qn-holiday-014
  text: 如果這個假期只能做一件事，你會選擇做什麼？
  tags: [holiday]
- id: qn-holiday-015
  text: 一個完全沒有安排的假日，你會想怎麼度過？
  tags: [holiday]
- id: qn-holiday-016
  text: 小時候的寒暑假，你大多是怎麼過的？
  tags: [holiday]
- id: qn-holiday-017
  text: 假期快到的時候，你心裡最期待的是什麼？
  tags: [holiday]
- id: qn-holiday-018
  text: 有沒有哪一次休假，讓你回味到現在？
  tags: [holiday]
- id: qn-holiday-019
  text: 如果要規劃一個只屬於自己的假期，你想怎麼安排？
  tags: [holiday]
- id: qn-holiday-020
  text: 假期結束、要回到日常之前，你會想為自己留下些什麼？
  tags: [holiday]
