# 每日一問 · 未來與想望（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-future-021
  text: 十年後回頭看現在的自己，你希望那時的你會說什麼？
  tags: [future]
- id: qn-future-022
  text: 有沒有一件事，你想慢慢做、做上好幾年？
  tags: [future]
- id: qn-future-023
  text: 你希望將來的世界，保有哪一樣現在就存在的美好？
  tags: [future]
- id: qn-future-024
  text: 如果將來要留下一點什麼給後來的人，你想留下什麼？
  tags: [future]
- id: qn-future-025
  text: 接下來的日子裡，你想養成哪一個新習慣？
  tags: [future]
- id: qn-future-026
  text: 想像自己年老的模樣，你最希望那時是什麼狀態？
  tags: [future]
- id: qn-future-027
  text: 往後的人生，你想多要一些什麼、少要一些什麼？
  tags: [future]
- id: qn-future-028
  text: 有哪一段對話，是你期待將來某天能發生的？
  tags: [future]
- id: qn-future-029
  text: 你想在哪一項本事上，慢慢磨到很純熟？
  tags: [future]
- id: qn-future-030
  text: 若干年後的某個早晨，你希望自己是怎麼醒來的？
  tags: [future]
- id: qn-future-031
  text: 對於將來的科技或生活方式，你最好奇哪一種變化？
  tags: [future]
- id: qn-future-032
  text: 你想和哪一段關係，一起走得更長更遠？
  tags: [future]
- id: qn-future-033
  text: 如果將來達成了一個心願，你會想怎麼慶祝？
  tags: [future]
- id: qn-future-034
  text: 有什麼是你想趁著行動自如時去完成的？
  tags: [future]
- id: qn-future-035
  text: 你希望自己的下一個階段，圍繞著什麼展開？
  tags: [future]
- id: qn-future-036
  text: 對於往後的生活節奏，你希望它比現在快一些還是慢一些？
  tags: [future]
- id: qn-future-037
  text: 有沒有一個目標，你打算一步一步慢慢接近？
  tags: [future]
- id: qn-future-038
  text: 你想像將來的居所裡，會有什麼樣的聲音或氣味？
  tags: [future]
- id: qn-future-039
  text: 未來的你，會因為現在的哪個決定而心懷感謝？
  tags: [future]
- id: qn-future-040
  text: 如果能預先安排一場將來的相聚，你想找誰、在哪裡？
  tags: [future]
