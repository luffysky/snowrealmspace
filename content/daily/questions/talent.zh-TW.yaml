# 每日一問 · 天賦與才能。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-talent-001
  text: 有什麼事，別人覺得困難、你卻做得很自然？
  tags: [talent]
- id: qn-talent-002
  text: 小時候的你，最常被大人稱讚哪一點？
  tags: [talent]
- id: qn-talent-003
  text: 做哪一件事的時候，你會忘記時間的流逝？
  tags: [talent]
- id: qn-talent-004
  text: 如果朋友遇到麻煩，他們通常會為了什麼來找你？
  tags: [talent]
- id: qn-talent-005
  text: 你身上有沒有一種「不太顯眼卻很好用」的能力？
  tags: [talent]
- id: qn-talent-006
  text: 有什麼技能，是你光靠觀察就學會的？
  tags: [talent]
- id: qn-talent-007
  text: 在一群人裡，你自然而然會扮演什麼角色？
  tags: [talent]
- id: qn-talent-008
  text: 哪一種類型的問題，一到你手上就變得容易許多？
  tags: [talent]
- id: qn-talent-009
  text: 你覺得自己身上最像禮物的一項特質是什麼？
  tags: [talent]
- id: qn-talent-010
  text: 有沒有一種手感或直覺，是你說不太清楚卻很信任的？
  tags: [talent]
- id: qn-talent-011
  text: 別人請你幫忙時，最常指名的是哪方面的你？
  tags: [talent]
- id: qn-talent-012
  text: 你在哪一種情境下，會感覺自己特別靈光？
  tags: [talent]
- id: qn-talent-013
  text: 如果要教別人一件你擅長的事，你會從哪裡開始？
  tags: [talent]
- id: qn-talent-014
  text: 有什麼才能，是你直到長大才發現原來自己有的？
  tags: [talent]
- id: qn-talent-015
  text: 你的哪一種感官，比一般人更敏銳一些？
  tags: [talent]
- id: qn-talent-016
  text: 面對混亂時，你身上什麼樣的能力會自動啟動？
  tags: [talent]
- id: qn-talent-017
  text: 如果把你的長處變成一件工具，那會是什麼樣子？
  tags: [talent]
- id: qn-talent-018
  text: 哪一件小事，你做起來比多數人更有耐心？
  tags: [talent]
- id: qn-talent-019
  text: 你曾在什麼時刻，因為自己的某項本領而暗自開心？
  tags: [talent]
- id: qn-talent-020
  text: 如果讓最了解你的人來形容你的天賦，他會怎麼說？
  tags: [talent]
