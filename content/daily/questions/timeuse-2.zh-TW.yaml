# 每日一問 · 時間分配（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-timeuse-021
  text: 一整年下來，你最捨得把大把時間投進哪一件事？
  tags: [timeuse]
- id: qn-timeuse-022
  text: 有沒有一段等待的空檔，被你悄悄變成了喜歡的時光？
  tags: [timeuse]
- id: qn-timeuse-023
  text: 當很多事同時擠過來，你會憑什麼決定先碰哪一件？
  tags: [timeuse]
- id: qn-timeuse-024
  text: 早晨醒來後的頭幾分鐘，你偏好留給什麼？
  tags: [timeuse]
- id: qn-timeuse-025
  text: 你覺得自己在哪一類事情上，容易不知不覺待得太久？
  tags: [timeuse]
- id: qn-timeuse-026
  text: 如果一天只能好好做完一件事，你會挑哪一件？
  tags: [timeuse]
- id: qn-timeuse-027
  text: 忙碌與空閒之間，你比較嚮往哪一種節奏？
  tags: [timeuse]
- id: qn-timeuse-028
  text: 有哪段時光，你回想起來會希望當時放得更慢一些？
  tags: [timeuse]
- id: qn-timeuse-029
  text: 你會用什麼方式，替自己保留一段誰都打擾不到的時間？
  tags: [timeuse]
- id: qn-timeuse-030
  text: 一件事要花多久，你才會開始考慮換個做法？
  tags: [timeuse]
- id: qn-timeuse-031
  text: 季節變化時，你的時間安排會跟著怎麼調整？
  tags: [timeuse]
- id: qn-timeuse-032
  text: 有沒有哪種消磨時間的方式，讓你事後覺得很值得？
  tags: [timeuse]
- id: qn-timeuse-033
  text: 你會怎麼分配「陪別人」和「陪自己」的比例？
  tags: [timeuse]
- id: qn-timeuse-034
  text: 一整個月裡，你期待哪一段時間的到來？
  tags: [timeuse]
- id: qn-timeuse-035
  text: 當時間突然多出一塊，你最先想到的是什麼？
  tags: [timeuse]
- id: qn-timeuse-036
  text: 你怎麼分辨一件事是在充實你，還是在耗掉你的時間？
  tags: [timeuse]
- id: qn-timeuse-037
  text: 有哪個時段，是你一天當中思緒最清晰的？
  tags: [timeuse]
- id: qn-timeuse-038
  text: 如果要送給某個人一段你的時間，你會怎麼安排那段相處？
  tags: [timeuse]
- id: qn-timeuse-039
  text: 你希望十年後回頭看，這一年的時間主要花在了哪裡？
  tags: [timeuse]
- id: qn-timeuse-040
  text: 對現在的你來說，時間夠不夠用，取決於什麼？
  tags: [timeuse]
