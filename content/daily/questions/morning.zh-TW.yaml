# 每日一問 · 早晨與開始。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-morning-001
  text: 睜開眼睛後，你會先注意到什麼？
  tags: [morning]
- id: qn-morning-002
  text: 你的早晨如果有一種味道，你希望是哪一種？
  tags: [morning]
- id: qn-morning-003
  text: 一天當中，你覺得清晨的光線和其他時候有什麼不同？
  tags: [morning]
- id: qn-morning-004
  text: 起床後最想聽見的第一個聲音是什麼？
  tags: [morning]
- id: qn-morning-005
  text: 對你來說，「重新開始」通常從哪一個動作算起？
  tags: [morning]
- id: qn-morning-006
  text: 你在早餐桌上最珍惜的是哪一刻？
  tags: [morning]
- id: qn-morning-007
  text: 如果可以自由決定，你理想的早晨會怎麼度過？
  tags: [morning]
- id: qn-morning-008
  text: 走出家門前，你會不會有某個固定的小習慣？
  tags: [morning]
- id: qn-morning-009
  text: 哪一種天氣，會讓你的早晨心情特別不一樣？
  tags: [morning]
- id: qn-morning-010
  text: 你和清晨的關係，是熟悉還是有點陌生？
  tags: [morning]
- id: qn-morning-011
  text: 曾經有哪個早晨，讓你到現在還記得它的樣子？
  tags: [morning]
- id: qn-morning-012
  text: 你喜歡在一天剛開始時獨處，還是有人相伴？
  tags: [morning]
- id: qn-morning-013
  text: 如果要為今天挑一個字當作起點，你會選哪個字？
  tags: [morning]
- id: qn-morning-014
  text: 早晨的哪一件小事，最容易讓你嘴角上揚？
  tags: [morning]
- id: qn-morning-015
  text: 你怎麼判斷自己「真的醒了」？
  tags: [morning]
- id: qn-morning-016
  text: 窗外的第一道光，會讓你想到什麼？
  tags: [morning]
- id: qn-morning-017
  text: 對你而言，一杯飲料在早晨扮演什麼角色？
  tags: [morning]
- id: qn-morning-018
  text: 假如今天可以換一種方式醒來，你想試試哪一種？
  tags: [morning]
- id: qn-morning-019
  text: 童年的早晨，和現在的早晨有哪裡不一樣？
  tags: [morning]
- id: qn-morning-020
  text: 當新的一天在你眼前展開時，你心裡浮現的是什麼？
  tags: [morning]
