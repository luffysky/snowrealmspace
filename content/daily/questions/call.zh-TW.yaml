# 每日一問 · 電話與通話。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-call-001
  text: 你上一通電話是打給誰？
  tags: [call]
- id: qn-call-002
  text: 接到陌生號碼來電，你通常會接嗎？
  tags: [call]
- id: qn-call-003
  text: 什麼情況下，你會選擇打電話而不是傳訊息？
  tags: [call]
- id: qn-call-004
  text: 講電話時，你習慣站著、坐著，還是走來走去？
  tags: [call]
- id: qn-call-005
  text: 有沒有一通電話，你到現在都還記得？
  tags: [call]
- id: qn-call-006
  text: 收到語音訊息，你會馬上點開來聽嗎？
  tags: [call]
- id: qn-call-007
  text: 電話突然響起的那一刻，你第一個反應是什麼？
  tags: [call]
- id: qn-call-008
  text: 你比較喜歡主動打電話，還是被動接電話？
  tags: [call]
- id: qn-call-009
  text: 講到一半訊號突然斷掉，你會怎麼處理？
  tags: [call]
- id: qn-call-010
  text: 打給不太熟的人之前，你會先想好要說什麼嗎？
  tags: [call]
- id: qn-call-011
  text: 有沒有一通電話，你猶豫很久才撥出去？
  tags: [call]
- id: qn-call-012
  text: 通話快結束時，你習慣用什麼話收尾？
  tags: [call]
- id: qn-call-013
  text: 你會留一段語音訊息，還是寧願晚點再打一次？
  tags: [call]
- id: qn-call-014
  text: 講電話的同時，你會順手做別的事嗎？
  tags: [call]
- id: qn-call-015
  text: 深夜接到電話，你心裡會先閃過什麼？
  tags: [call]
- id: qn-call-016
  text: 和誰講電話，你可以一聊就聊上好久？
  tags: [call]
- id: qn-call-017
  text: 有沒有哪一種電話，你會盡量拖著不想接？
  tags: [call]
- id: qn-call-018
  text: 電話裡的聲音，和本人給你的感覺一樣嗎？
  tags: [call]
- id: qn-call-019
  text: 打電話時，你開頭第一句話通常怎麼說？
  tags: [call]
- id: qn-call-020
  text: 最近一次講很久的電話，聊的是些什麼？
  tags: [call]
