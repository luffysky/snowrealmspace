# 每日一問 · 靈感與創意來源（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-inspire-021
  text: 童年時你最著迷去做的那件事，如今還在你身上留下什麼痕跡？
  tags: [inspire]
- id: qn-inspire-022
  text: 什麼樣的限制或框架，反而逼出了你意想不到的做法？
  tags: [inspire]
- id: qn-inspire-023
  text: 無所事事、什麼都不做的時候，你的腦袋會飄到哪去？
  tags: [inspire]
- id: qn-inspire-024
  text: 有沒有一種材料或媒材，光是觸碰就讓你想動手做點什麼？
  tags: [inspire]
- id: qn-inspire-025
  text: 若把兩個毫不相干的領域湊在一起，你會想試哪兩個？
  tags: [inspire]
- id: qn-inspire-026
  text: 一件作品完成的那一刻，你心裡浮現的通常是什麼？
  tags: [inspire]
- id: qn-inspire-027
  text: 夢境曾經給過你什麼奇怪又難忘的畫面嗎？
  tags: [inspire]
- id: qn-inspire-028
  text: 你怎麼分辨自己是在模仿，還是真的長出了自己的東西？
  tags: [inspire]
- id: qn-inspire-029
  text: 哪一種自然現象，會讓你停下來久久出神？
  tags: [inspire]
- id: qn-inspire-030
  text: 一段旋律或某類音樂，會把你帶進怎樣的想像裡？
  tags: [inspire]
- id: qn-inspire-031
  text: 你手邊有沒有一件舊物，一看到就湧出許多念頭？
  tags: [inspire]
- id: qn-inspire-032
  text: 曾經有誰隨口說的一句話，替你打開了新的方向？
  tags: [inspire]
- id: qn-inspire-033
  text: 面對一張空白的紙或畫面，你的第一步通常是什麼？
  tags: [inspire]
- id: qn-inspire-034
  text: 你在獨處和與人交談之間，哪一邊更容易迸出點子？
  tags: [inspire]
- id: qn-inspire-035
  text: 有沒有一件別人不太理解、你卻很想做下去的事？
  tags: [inspire]
- id: qn-inspire-036
  text: 一次失手或意外，曾意外帶你走向哪個新發現？
  tags: [inspire]
- id: qn-inspire-037
  text: 哪一本書或一部電影，悄悄改變了你看事情的方式？
  tags: [inspire]
- id: qn-inspire-038
  text: 如果要用一種氣味來描述你的創作狀態，會是什麼？
  tags: [inspire]
- id: qn-inspire-039
  text: 你會怎麼替一個還很模糊的想法，找到它的第一個形狀？
  tags: [inspire]
- id: qn-inspire-040
  text: 若能留下一件作品給很久以後的人，你希望它訴說什麼？
  tags: [inspire]
