# 每日一問 · 願望清單（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-bucket-021
  text: 有沒有一種季節限定的風景，你想特地為它安排一趟出門？
  tags: [bucket]
- id: qn-bucket-022
  text: 你想在哪一種舞台或場合，體驗一次被眾人看見的感覺？
  tags: [bucket]
- id: qn-bucket-023
  text: 假如能親手栽種或養育某樣生命，你想陪伴什麼長大？
  tags: [bucket]
- id: qn-bucket-024
  text: 你希望有一天能用哪種語言，和當地人自在地聊天？
  tags: [bucket]
- id: qn-bucket-025
  text: 若要為家人留下一樣他們會珍惜的東西，你想做什麼？
  tags: [bucket]
- id: qn-bucket-026
  text: 有哪種極端環境的體驗，你既害怕又忍不住嚮往？
  tags: [bucket]
- id: qn-bucket-027
  text: 你想學會一道菜，做給誰吃看看他的反應？
  tags: [bucket]
- id: qn-bucket-028
  text: 假如能參與一件比自己更大的事，你想投入哪一種？
  tags: [bucket]
- id: qn-bucket-029
  text: 你想在人生某一頁，替自己記下什麼樣的第一次？
  tags: [bucket]
- id: qn-bucket-030
  text: 有沒有一種交通方式的旅行，你一直想試著慢慢走一遭？
  tags: [bucket]
- id: qn-bucket-031
  text: 你希望某天能站上哪座山、或望向哪片海？
  tags: [bucket]
- id: qn-bucket-032
  text: 如果能重返某個年紀去補做一件事，你會補上什麼？
  tags: [bucket]
- id: qn-bucket-033
  text: 你想收藏一段怎樣的聲音或畫面，留給未來的自己？
  tags: [bucket]
- id: qn-bucket-034
  text: 有哪門手藝，你想磨到能拿去換一頓飯或送人？
  tags: [bucket]
- id: qn-bucket-035
  text: 你想在哪一場典禮或節慶裡，親身感受它的氣氛？
  tags: [bucket]
- id: qn-bucket-036
  text: 假如能為某段友情或愛情做一件浪漫的事，你想做什麼？
  tags: [bucket]
- id: qn-bucket-037
  text: 你希望哪一項恐懼，有一天能被自己親手跨過去？
  tags: [bucket]
- id: qn-bucket-038
  text: 若能替某個陌生人實現一個小願望，你想試試看嗎？
  tags: [bucket]
- id: qn-bucket-039
  text: 你想帶著誰，一起回到某個對你倆有意義的地方？
  tags: [bucket]
- id: qn-bucket-040
  text: 關於老後的生活，有沒有一個畫面是你早就想好的？
  tags: [bucket]
