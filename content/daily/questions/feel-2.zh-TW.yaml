# 每日一問 · 身體感受（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-feel-021
  text: 此刻你的呼吸，是淺淺的還是深深的？
  tags: [body]
- id: qn-feel-022
  text: 今天雙腳走了多遠，你有感覺到它們嗎？
  tags: [body]
- id: qn-feel-023
  text: 如果現在能立刻換個姿勢，你的身體想怎麼擺？
  tags: [body]
- id: qn-feel-024
  text: 你上一次感覺到肚子餓，是聽它說還是被時間提醒的？
  tags: [body]
- id: qn-feel-025
  text: 現在手心是暖的還是涼的？
  tags: [body]
- id: qn-feel-026
  text: 今天有哪個動作，讓你覺得身體很順、很舒服？
  tags: [body]
- id: qn-feel-027
  text: 如果眼睛能說話，它今天想跟你要什麼？
  tags: [body]
- id: qn-feel-028
  text: 此刻你身上哪個地方，正悄悄用著力？
  tags: [body]
- id: qn-feel-029
  text: 今天有沒有一種觸感，讓你想多停留一下？
  tags: [body]
- id: qn-feel-030
  text: 你現在的坐姿，身體覺得被撐住了嗎？
  tags: [body]
- id: qn-feel-031
  text: 如果把今天的體力畫成一條線，它現在走到哪？
  tags: [body]
- id: qn-feel-032
  text: 最近哪一種溫度，讓你的身體感到最自在？
  tags: [body]
- id: qn-feel-033
  text: 此刻你的下巴和額頭，是放鬆的還是繃著的？
  tags: [body]
- id: qn-feel-034
  text: 今天有沒有一個瞬間，你清楚感覺到心跳？
  tags: [body]
- id: qn-feel-035
  text: 如果身體現在能點一樣東西，它會想要什麼？
  tags: [body]
- id: qn-feel-036
  text: 你的雙手今天大多在忙，還是有機會歇著？
  tags: [body]
- id: qn-feel-037
  text: 此刻若閉上眼，你最先注意到身上哪種感覺？
  tags: [body]
- id: qn-feel-038
  text: 今天有沒有哪個聲音，讓你的身體不自覺放軟？
  tags: [body]
- id: qn-feel-039
  text: 你的睡眠最近是黏著你、還是離你有點遠？
  tags: [body]
- id: qn-feel-040
  text: 如果現在給身體一分鐘做主，它會帶你去做什麼？
  tags: [body]
