# 每日一問 · 友誼（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-friend-021
  text: 你和某位朋友的相遇，是從什麼樣的場合開始的？
  tags: [friendship]
- id: qn-friend-022
  text: 有沒有一位和你個性很不一樣、卻很合得來的朋友？
  tags: [friendship]
- id: qn-friend-023
  text: 當朋友取得好成績時，你通常會有什麼反應？
  tags: [friendship]
- id: qn-friend-024
  text: 哪位朋友身上的某個特質，是你也想學的？
  tags: [friendship]
- id: qn-friend-025
  text: 你對某個朋友的第一印象，後來有沒有被推翻？
  tags: [friendship]
- id: qn-friend-026
  text: 和朋友一起沉默不說話時，是什麼樣的感覺？
  tags: [friendship]
- id: qn-friend-027
  text: 你有沒有欠某位朋友一句道謝或道歉？
  tags: [friendship]
- id: qn-friend-028
  text: 學生時代或某段時期的哪位朋友，你特別想念？
  tags: [friendship]
- id: qn-friend-029
  text: 朋友之間需要保留一點距離嗎，你怎麼看？
  tags: [friendship]
- id: qn-friend-030
  text: 有哪位朋友，會坦白指出你沒注意到的地方？
  tags: [friendship]
- id: qn-friend-031
  text: 你比較喜歡一群人的熱鬧，還是和好友單獨相處？
  tags: [friendship]
- id: qn-friend-032
  text: 哪位朋友對你來說，已經像家人一樣？
  tags: [friendship]
- id: qn-friend-033
  text: 你曾為某位朋友，特地繞路去做過什麼嗎？
  tags: [friendship]
- id: qn-friend-034
  text: 和朋友久別重逢時，你最期待的是什麼？
  tags: [friendship]
- id: qn-friend-035
  text: 有沒有哪件事，你一直放在心裡沒對好友提起？
  tags: [friendship]
- id: qn-friend-036
  text: 朋友陷入低潮時，你會用什麼方式陪在旁邊？
  tags: [friendship]
- id: qn-friend-037
  text: 你和某位朋友的關係，是怎麼熬過一段變化的？
  tags: [friendship]
- id: qn-friend-038
  text: 哪位朋友的支持，曾在你猶豫時推了你一把？
  tags: [friendship]
- id: qn-friend-039
  text: 你希望和朋友之間，保有哪一種相處的節奏？
  tags: [friendship]
- id: qn-friend-040
  text: 若能重溫和某位朋友的一天，你會挑哪一天？
  tags: [friendship]
