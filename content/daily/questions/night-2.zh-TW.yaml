# 每日一問 · 夜晚與睡眠（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-night-021
  text: 你入睡時，身體最習慣朝哪個方向側躺？
  tags: [night]
- id: qn-night-022
  text: 夜班或熬夜過後的清晨，世界在你眼中是什麼樣子？
  tags: [night]
- id: qn-night-023
  text: 棉被的重量與觸感，對你的睡意有什麼影響？
  tags: [night]
- id: qn-night-024
  text: 你有沒有一段只屬於深夜的小儀式？
  tags: [night]
- id: qn-night-025
  text: 窗外的路燈或月光，會怎麼進到你的房間裡？
  tags: [night]
- id: qn-night-026
  text: 假日的夜晚和平日的夜晚，對你來說差在哪？
  tags: [night]
- id: qn-night-027
  text: 你曾在夜裡聽見什麼聲音，久久無法忘記？
  tags: [night]
- id: qn-night-028
  text: 睡前滑手機這件事，在你身上是怎麼開始的？
  tags: [night]
- id: qn-night-029
  text: 如果夜晚能延長一小時，你想拿來做什麼？
  tags: [night]
- id: qn-night-030
  text: 你怎麼形容賴床時那種半夢半醒的感覺？
  tags: [night]
- id: qn-night-031
  text: 一個人的夜晚和有人陪的夜晚，你各自喜歡什麼？
  tags: [night]
- id: qn-night-032
  text: 你的夢裡，比較常出現熟悉的地方還是陌生的地方？
  tags: [night]
- id: qn-night-033
  text: 半夜肚子餓的時候，你腦中會浮現哪一道食物？
  tags: [night]
- id: qn-night-034
  text: 夜晚的哪一種天氣，最能觸動你的心緒？
  tags: [night]
- id: qn-night-035
  text: 你曾在深夜傳出或收到哪一則難忘的訊息？
  tags: [night]
- id: qn-night-036
  text: 露營或旅途中的夜晚，和家裡的夜晚哪裡不一樣？
  tags: [night]
- id: qn-night-037
  text: 你會用什麼方式，讓自己從白天切換進夜晚？
  tags: [night]
- id: qn-night-038
  text: 童年時的夜晚，家裡通常是什麼樣的氛圍？
  tags: [night]
- id: qn-night-039
  text: 睡不著的夜裡，你和自己都聊些什麼？
  tags: [night]
- id: qn-night-040
  text: 你理想中的一張床，會是什麼模樣？
  tags: [night]
