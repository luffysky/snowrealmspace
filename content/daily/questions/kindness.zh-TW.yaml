# 每日一問 · 溫柔與善意。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-kindness-001
  text: 今天，有誰的一句話讓你心裡暖暖的？
  tags: [kindness]
- id: qn-kindness-002
  text: 你會用什麼方式，讓一個累了的朋友覺得被接住？
  tags: [kindness]
- id: qn-kindness-003
  text: 最近一次有人替你著想，是在什麼樣的時刻？
  tags: [kindness]
- id: qn-kindness-004
  text: 如果要對自己說一句體貼的話，你會怎麼說？
  tags: [kindness]
- id: qn-kindness-005
  text: 有沒有一個陌生人的小舉動，讓你記到了現在？
  tags: [kindness]
- id: qn-kindness-006
  text: 你覺得溫柔對待自己，可以從哪件小事開始？
  tags: [kindness]
- id: qn-kindness-007
  text: 當身邊的人心情低落，你通常會怎麼陪伴他？
  tags: [kindness]
- id: qn-kindness-008
  text: 有什麼善意，是你一直想表達卻還沒說出口的？
  tags: [kindness]
- id: qn-kindness-009
  text: 你被誰照顧過，而那份照顧至今仍在心裡？
  tags: [kindness]
- id: qn-kindness-010
  text: 如果今天可以送一個人一份無形的禮物，你想送什麼？
  tags: [kindness]
- id: qn-kindness-011
  text: 在你心裡，「溫柔」是柔軟，還是一種安靜的力量？
  tags: [kindness]
- id: qn-kindness-012
  text: 有沒有一次，你原諒了某個人，也讓自己輕鬆了？
  tags: [kindness]
- id: qn-kindness-013
  text: 你會怎麼向不擅長示弱的人，表達你的關心？
  tags: [kindness]
- id: qn-kindness-014
  text: 對你來說，被理解和被幫助，哪一個更像溫柔？
  tags: [kindness]
- id: qn-kindness-015
  text: 今天有什麼小事，是你可以為別人多做一點的？
  tags: [kindness]
- id: qn-kindness-016
  text: 你記得自己曾經對誰特別有耐心嗎，那是因為什麼？
  tags: [kindness]
- id: qn-kindness-017
  text: 如果善意會傳遞，你希望它從你這裡流向誰？
  tags: [kindness]
- id: qn-kindness-018
  text: 有沒有一種安慰的方式，是你自己特別受用的？
  tags: [kindness]
- id: qn-kindness-019
  text: 你會怎麼謝謝一個默默在你身邊的人？
  tags: [kindness]
- id: qn-kindness-020
  text: 當你對自己嚴厲的時候，能試著換成哪句更柔軟的話？
  tags: [kindness]
