# 每日一問 · 購物與買東西。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-shop-001
  text: 你最近買的一樣東西，是什麼？
  tags: [shop]
- id: qn-shop-002
  text: 逛店的時候，你習慣先走去哪一區？
  tags: [shop]
- id: qn-shop-003
  text: 一件商品要放進購物車之前，你會先考慮什麼？
  tags: [shop]
- id: qn-shop-004
  text: 有沒有一次買了之後有點後悔的東西？
  tags: [shop]
- id: qn-shop-005
  text: 比起實體店，你更喜歡在網路上買哪一類東西？
  tags: [shop]
- id: qn-shop-006
  text: 遇到很想要卻有點貴的東西，你會怎麼做決定？
  tags: [shop]
- id: qn-shop-007
  text: 結帳前看到限時優惠，你通常的反應是什麼？
  tags: [shop]
- id: qn-shop-008
  text: 挑衣服的時候，你最看重的是哪一點？
  tags: [shop]
- id: qn-shop-009
  text: 有哪一類東西，你總是願意多花一點錢？
  tags: [shop]
- id: qn-shop-010
  text: 你會為了一樣東西，比價比上好一陣子嗎？
  tags: [shop]
- id: qn-shop-011
  text: 要挑禮物送人時，你都從哪裡開始找？
  tags: [shop]
- id: qn-shop-012
  text: 走進一家不熟的商店，你第一個注意到的是什麼？
  tags: [shop]
- id: qn-shop-013
  text: 家裡有沒有一樣買了卻幾乎沒用過的東西？
  tags: [shop]
- id: qn-shop-014
  text: 你比較常臨時起意就買，還是計畫好才出手？
  tags: [shop]
- id: qn-shop-015
  text: 什麼樣的包裝或陳列，會讓你忍不住多看一眼？
  tags: [shop]
- id: qn-shop-016
  text: 買日用品時，你會固定選同一個牌子嗎？
  tags: [shop]
- id: qn-shop-017
  text: 有沒有一次購物，讓你覺得特別划算？
  tags: [shop]
- id: qn-shop-018
  text: 面對一整排選擇時，你怎麼把範圍縮小？
  tags: [shop]
- id: qn-shop-019
  text: 你逛街，多半是為了買東西，還是為了別的？
  tags: [shop]
- id: qn-shop-020
  text: 最近有什麼東西，你考慮很久卻還沒下手？
  tags: [shop]
