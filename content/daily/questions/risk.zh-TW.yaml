# 每日一問 · 冒險與挑戰。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-risk-001
  text: 想到「未知」這兩個字，你心裡浮現的是興奮還是別的什麼？
  tags: [risk]
- id: qn-risk-002
  text: 有什麼刺激的事，光是想像畫面就讓你眼睛一亮？
  tags: [risk]
- id: qn-risk-003
  text: 如果人生可以賭一把，你會把籌碼押在哪裡？
  tags: [risk]
- id: qn-risk-004
  text: 哪一種速度感，是你渴望親身衝一次的？
  tags: [risk]
- id: qn-risk-005
  text: 假如明天就要出發去一場沒有地圖的旅程，你會帶著什麼心情？
  tags: [risk]
- id: qn-risk-006
  text: 什麼樣的挑戰，會讓你血液跟著沸騰起來？
  tags: [risk]
- id: qn-risk-007
  text: 你想在哪個瞬間，體驗一次「豁出去」的痛快？
  tags: [risk]
- id: qn-risk-008
  text: 有沒有一片你從未踏足的領域，讓你好奇到想一探究竟？
  tags: [risk]
- id: qn-risk-009
  text: 如果安全網先收起來，你反而想去玩哪一種大冒險？
  tags: [risk]
- id: qn-risk-010
  text: 什麼樣的高度或深度，是你想親自站上去感受的？
  tags: [risk]
- id: qn-risk-011
  text: 你嚮往哪一種在路上隨遇而安、走到哪算哪的探險？
  tags: [risk]
- id: qn-risk-012
  text: 面對一個結果全然未知的機會，你最想抓住的是哪一個？
  tags: [risk]
- id: qn-risk-013
  text: 有什麼極限運動或刺激玩法，是你偷偷列在心裡的？
  tags: [risk]
- id: qn-risk-014
  text: 如果可以把日子過得更野一點，你想從哪裡開始？
  tags: [risk]
- id: qn-risk-015
  text: 哪一場冒險故事，讓你看完就想換自己上場？
  tags: [risk]
- id: qn-risk-016
  text: 你想在哪件事上，體驗一次孤注一擲的感覺？
  tags: [risk]
- id: qn-risk-017
  text: 什麼樣的陌生環境，反而讓你躍躍欲試？
  tags: [risk]
- id: qn-risk-018
  text: 如果把「穩定」暫時擺一邊，你最想去追哪一種刺激？
  tags: [risk]
- id: qn-risk-019
  text: 有哪個瘋狂的念頭，你其實一直很想放手一搏？
  tags: [risk]
- id: qn-risk-020
  text: 想像自己正站在起跳點上，你最期待落地時看見什麼？
  tags: [risk]
