# 每日一問 · 承諾與責任。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-promise-001
  text: 你曾對自己許下什麼樣的約定？
  tags: [promise]
- id: qn-promise-002
  text: 有沒有一句話，你說出口後就一直記在心上？
  tags: [promise]
- id: qn-promise-003
  text: 對你而言，把一件事扛在肩上是什麼感覺？
  tags: [promise]
- id: qn-promise-004
  text: 你會為誰主動攬下不屬於自己的責任？
  tags: [promise]
- id: qn-promise-005
  text: 小時候答應過大人的事，哪一件你到現在還記得？
  tags: [promise]
- id: qn-promise-006
  text: 當你說出「交給我」，心裡通常在想些什麼？
  tags: [promise]
- id: qn-promise-007
  text: 面對難以兌現的約定，你會怎麼跟對方說？
  tags: [promise]
- id: qn-promise-008
  text: 哪一種託付，會讓你願意排開其他事去完成？
  tags: [promise]
- id: qn-promise-009
  text: 你心中「說到做到」的樣子，是什麼模樣？
  tags: [promise]
- id: qn-promise-010
  text: 有沒有一份責任，是你接下後才慢慢愛上的？
  tags: [promise]
- id: qn-promise-011
  text: 對別人失信的那一次，後來在你心裡留下什麼？
  tags: [promise]
- id: qn-promise-012
  text: 你會用什麼方式，讓對方相信你不會反悔？
  tags: [promise]
- id: qn-promise-013
  text: 哪一種承諾，你寧可不開口也不願隨便給出？
  tags: [promise]
- id: qn-promise-014
  text: 當責任落在你和別人之間，你怎麼劃出那條線？
  tags: [promise]
- id: qn-promise-015
  text: 有沒有一件事，是你默默替某人守著的？
  tags: [promise]
- id: qn-promise-016
  text: 你覺得一個可靠的人，會有哪些樣子？
  tags: [promise]
- id: qn-promise-017
  text: 答應了卻沒能做到時，你怎麼跟自己和解？
  tags: [promise]
- id: qn-promise-018
  text: 哪個人的託付，讓你至今仍放在心上惦記？
  tags: [promise]
- id: qn-promise-019
  text: 你願意為一段關係，長久守住哪一種約定？
  tags: [promise]
- id: qn-promise-020
  text: 如果要對未來的自己承諾一件事，會是什麼？
  tags: [promise]
