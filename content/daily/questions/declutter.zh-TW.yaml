# 每日一問 · 斷捨離與丟東西。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-declutter-001
  text: 有沒有一樣東西，你留了很久卻用不到？
  tags: [declutter]
- id: qn-declutter-002
  text: 如果只能帶走三樣東西搬家，你會選哪些？
  tags: [declutter]
- id: qn-declutter-003
  text: 上一次丟掉東西後，你的心情是什麼樣子？
  tags: [declutter]
- id: qn-declutter-004
  text: 你家裡哪個角落最想清空？
  tags: [declutter]
- id: qn-declutter-005
  text: 什麼樣的東西，你明知該放手卻總是留著？
  tags: [declutter]
- id: qn-declutter-006
  text: 對你來說，決定「留下」的理由通常是什麼？
  tags: [declutter]
- id: qn-declutter-007
  text: 有沒有一件禮物，你不喜歡卻捨不得丟？
  tags: [declutter]
- id: qn-declutter-008
  text: 衣櫃裡有多少件衣服，是你這一年沒穿過的？
  tags: [declutter]
- id: qn-declutter-009
  text: 如果家裡可以少一半的東西，你會感覺如何？
  tags: [declutter]
- id: qn-declutter-010
  text: 你最容易囤積的是哪一類物品？
  tags: [declutter]
- id: qn-declutter-011
  text: 什麼東西一旦丟了，你可能會後悔？
  tags: [declutter]
- id: qn-declutter-012
  text: 抽屜最深處那樣東西，現在還對你有意義嗎？
  tags: [declutter]
- id: qn-declutter-013
  text: 你會把「以後可能用得到」當作留下的理由嗎？
  tags: [declutter]
- id: qn-declutter-014
  text: 對你而言，一個清爽的空間是什麼樣的畫面？
  tags: [declutter]
- id: qn-declutter-015
  text: 有沒有一樣東西，是因為回憶才留著的？
  tags: [declutter]
- id: qn-declutter-016
  text: 你比較捨得丟舊物，還是捨得送人？
  tags: [declutter]
- id: qn-declutter-017
  text: 如果今天要送走一箱東西，你會先放進什麼？
  tags: [declutter]
- id: qn-declutter-018
  text: 什麼理由能讓你願意放下一樣珍藏很久的東西？
  tags: [declutter]
- id: qn-declutter-019
  text: 你覺得「擁有得少」對生活會帶來什麼？
  tags: [declutter]
- id: qn-declutter-020
  text: 假如空間會說話，它最想請你搬走什麼？
  tags: [declutter]
