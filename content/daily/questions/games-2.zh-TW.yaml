# 每日一問 · 遊戲與玩心（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-game-021
  text: 有沒有一款遊戲，是你半途放下卻始終沒忘記的？
  tags: [games]
- id: qn-game-022
  text: 當規則被打破、大家開始亂玩的時候，你覺得如何？
  tags: [games]
- id: qn-game-023
  text: 你會怎麼向沒玩過的人，描述你最喜歡的那款遊戲？
  tags: [games]
- id: qn-game-024
  text: 在遊戲裡當隊長帶頭，和默默當個輔助，哪個比較像你？
  tags: [games]
- id: qn-game-025
  text: 有沒有哪一次，你為了讓對手也玩得開心而故意放水？
  tags: [games]
- id: qn-game-026
  text: 玩到一半突然被打斷，那種心情你會怎麼形容？
  tags: [games]
- id: qn-game-027
  text: 對你而言，遊戲和工作之間的界線畫在哪裡？
  tags: [games]
- id: qn-game-028
  text: 你收藏過哪些和遊戲有關的小東西，它們現在還在嗎？
  tags: [games]
- id: qn-game-029
  text: 排隊、等車這種空檔，你會用什麼小遊戲打發？
  tags: [games]
- id: qn-game-030
  text: 教別人玩一款你熟悉的遊戲時，最難說清楚的是哪一步？
  tags: [games]
- id: qn-game-031
  text: 一群人玩牌或桌遊時，你最享受的是哪個環節？
  tags: [games]
- id: qn-game-032
  text: 遊戲裡的哪一個選擇，讓你事後還在回味當時的決定？
  tags: [games]
- id: qn-game-033
  text: 你有沒有遇過玩到反而更累的遊戲，那是什麼樣的？
  tags: [games]
- id: qn-game-034
  text: 假如童年的自己看到你現在玩的遊戲，會說些什麼？
  tags: [games]
- id: qn-game-035
  text: 運氣和實力，在你喜歡的遊戲裡各佔了多少分量？
  tags: [games]
- id: qn-game-036
  text: 你會為了某款遊戲特地去認識新朋友嗎，那是怎麼開始的？
  tags: [games]
- id: qn-game-037
  text: 有哪個遊戲的結局，讓你久久沒辦法立刻開始下一款？
  tags: [games]
- id: qn-game-038
  text: 把日常的一件家事變成遊戲，你會怎麼設計它的規則？
  tags: [games]
- id: qn-game-039
  text: 觀戰別人玩和自己上場，這兩種樂趣對你有什麼不同？
  tags: [games]
- id: qn-game-040
  text: 如果玩心可以借給某個大人，你最想借給誰？
  tags: [games]
