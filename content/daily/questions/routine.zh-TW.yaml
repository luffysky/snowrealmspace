# 每日一問 · 作息與規律。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-routine-001
  text: 你昨晚幾點入睡的？
  tags: [routine]
- id: qn-routine-002
  text: 早上醒來後，你做的第一件事通常是什麼？
  tags: [routine]
- id: qn-routine-003
  text: 你的生理時鐘偏向早起，還是晚睡？
  tags: [routine]
- id: qn-routine-004
  text: 週末的作息，和平日差多少？
  tags: [routine]
- id: qn-routine-005
  text: 一天當中，哪個時段你的精神最好？
  tags: [routine]
- id: qn-routine-006
  text: 如果沒有鬧鐘，你會自然在幾點醒來？
  tags: [routine]
- id: qn-routine-007
  text: 睡前那半小時，你習慣怎麼度過？
  tags: [routine]
- id: qn-routine-008
  text: 你有午睡的習慣嗎，通常睡多久？
  tags: [routine]
- id: qn-routine-009
  text: 對你來說，理想的一天是幾點開始的？
  tags: [routine]
- id: qn-routine-010
  text: 熬夜之後的隔天，你的節奏會如何變化？
  tags: [routine]
- id: qn-routine-011
  text: 什麼事情最容易打亂你的日常節奏？
  tags: [routine]
- id: qn-routine-012
  text: 你比較享受規律的生活，還是隨性的一天？
  tags: [routine]
- id: qn-routine-013
  text: 一天裡有沒有一段固定屬於自己的時間？
  tags: [routine]
- id: qn-routine-014
  text: 早晨和夜晚，哪一段時光讓你更放鬆？
  tags: [routine]
- id: qn-routine-015
  text: 你的三餐大約落在哪些時間？
  tags: [routine]
- id: qn-routine-016
  text: 如果可以重新安排一天的順序，你會怎麼排？
  tags: [routine]
- id: qn-routine-017
  text: 換了環境之後，你的作息花多久才穩定下來？
  tags: [routine]
- id: qn-routine-018
  text: 你怎麼判斷自己今天睡得夠不夠？
  tags: [routine]
- id: qn-routine-019
  text: 一週裡有沒有哪一天的節奏特別不一樣？
  tags: [routine]
- id: qn-routine-020
  text: 對你而言，「規律的生活」是什麼樣子？
  tags: [routine]
