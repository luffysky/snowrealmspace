# 每日一問 · 信仰與相信（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-faith-021
  text: 你心裡是否有一個，即使動搖過仍願意重新相信的東西？
  tags: [faith]
- id: qn-faith-022
  text: 當別人和你的想法完全不同，你會怎麼安放自己的相信？
  tags: [faith]
- id: qn-faith-023
  text: 有沒有一種畫面或風景，讓你感到某種說不出的踏實？
  tags: [faith]
- id: qn-faith-024
  text: 你覺得自己的相信，比較多來自經歷，還是來自感受？
  tags: [faith]
- id: qn-faith-025
  text: 在需要做決定卻沒有把握時，你會聽從心裡的哪個聲音？
  tags: [faith]
- id: qn-faith-026
  text: 有哪一件事，是你希望它是真的，也一直當它是真的？
  tags: [faith]
- id: qn-faith-027
  text: 你怎麼看待那些暫時無法解釋、卻真實發生過的巧合？
  tags: [faith]
- id: qn-faith-028
  text: 若要把一份安心託付出去，你會想交給什麼樣的存在？
  tags: [faith]
- id: qn-faith-029
  text: 從小到大，你對某件事的相信，是變得更淡還是更深？
  tags: [faith]
- id: qn-faith-030
  text: 什麼樣的時刻，會讓你重新覺得「這一切也許有它的道理」？
  tags: [faith]
- id: qn-faith-031
  text: 你會不會替某些看不見的東西，在心裡留一個位置？
  tags: [faith]
- id: qn-faith-032
  text: 當你對自己失去把握時，是什麼把你穩穩地接住了？
  tags: [faith]
- id: qn-faith-033
  text: 有沒有一個念頭，是你反覆對自己說、慢慢就信了的？
  tags: [faith]
- id: qn-faith-034
  text: 面對還沒到來的事，你是傾向期待，還是傾向靜靜等候？
  tags: [faith]
- id: qn-faith-035
  text: 你覺得相信一個人，和相信一件事，感覺一樣嗎？
  tags: [faith]
- id: qn-faith-036
  text: 哪一種安靜的時刻，最能讓你聽見自己內心的想法？
  tags: [faith]
- id: qn-faith-037
  text: 若要向孩子解釋「值得相信的東西」，你會怎麼開口？
  tags: [faith]
- id: qn-faith-038
  text: 有沒有什麼，是你即使世界說它天真也不想放掉的？
  tags: [faith]
- id: qn-faith-039
  text: 你會用什麼方式，讓一份搖晃中的信任慢慢站穩？
  tags: [faith]
- id: qn-faith-040
  text: 到了此刻，你最想守著哪一個關於「相信」的答案？
  tags: [faith]
