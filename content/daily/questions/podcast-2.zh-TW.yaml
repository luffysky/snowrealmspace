# 每日一問 · Podcast 與聲音內容（續）。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-podcast-021
  text: 待聽清單裡累積的那些集數，你都怎麼處理？
  tags: [podcast]
- id: qn-podcast-022
  text: 一集節目多長，對你來說剛剛好？
  tags: [podcast]
- id: qn-podcast-023
  text: 聽到和自己想法不同的觀點時，你心裡會怎麼反應？
  tags: [podcast]
- id: qn-podcast-024
  text: 主持人和來賓之間的那種火花，哪一種讓你聽得最過癮？
  tags: [podcast]
- id: qn-podcast-025
  text: 節目中插入的廣告，你是怎麼看待的？
  tags: [podcast]
- id: qn-podcast-026
  text: 一檔節目的名稱或封面，會影響你點不點開嗎？
  tags: [podcast]
- id: qn-podcast-027
  text: 曾經很愛、後來卻不再追的節目，是什麼讓你停下來的？
  tags: [podcast]
- id: qn-podcast-028
  text: 聽到很有共鳴的內容，你會停下來記點什麼嗎？
  tags: [podcast]
- id: qn-podcast-029
  text: 你會聽外語或不同地方口音的聲音節目嗎？
  tags: [podcast]
- id: qn-podcast-030
  text: 聽完某一集後，你會想找誰一起聊聊裡面的內容？
  tags: [podcast]
- id: qn-podcast-031
  text: 心情低落的時候，你會想打開哪一種聲音來聽？
  tags: [podcast]
- id: qn-podcast-032
  text: 光憑聲音，你會不會替說話的人想像出一個模樣？
  tags: [podcast]
- id: qn-podcast-033
  text: 那些小眾、聽的人不多的節目，對你有什麼吸引力？
  tags: [podcast]
- id: qn-podcast-034
  text: 有沒有哪一檔老節目，是你會一遍又一遍重聽的？
  tags: [podcast]
- id: qn-podcast-035
  text: 哪一集節目，曾經悄悄改變了你原本的某個看法？
  tags: [podcast]
- id: qn-podcast-036
  text: 現場錄音或開放聽眾參與的節目，帶給你的是什麼感覺？
  tags: [podcast]
- id: qn-podcast-037
  text: 長途移動的路上，你會用什麼樣的聲音陪自己？
  tags: [podcast]
- id: qn-podcast-038
  text: 一檔節目的片頭音樂或開場白，對你來說重要嗎？
  tags: [podcast]
- id: qn-podcast-039
  text: 同一段空檔，你會選擇聽節目還是聽音樂？
  tags: [podcast]
- id: qn-podcast-040
  text: 如果一直在聽的節目宣布完結，你會是什麼心情？
  tags: [podcast]
