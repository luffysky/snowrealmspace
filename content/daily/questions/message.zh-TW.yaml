# 每日一問 · 訊息與聯繫。開放式，不預設對錯。繁體中文，每一則獨一無二。
- id: qn-message-001
  text: 有沒有一則訊息，你一直想傳卻沒傳？
  tags: [message]
- id: qn-message-002
  text: 你上一次主動聯絡別人，是為了什麼事？
  tags: [message]
- id: qn-message-003
  text: 手機裡有哪個對話框，你會不自覺一直往回滑？
  tags: [message]
- id: qn-message-004
  text: 收到怎樣的訊息，會讓你想立刻回覆？
  tags: [message]
- id: qn-message-005
  text: 你比較習慣傳長長的一段話，還是一句一句慢慢說？
  tags: [message]
- id: qn-message-006
  text: 有沒有一個號碼，是你到現在都還背得出來的？
  tags: [message]
- id: qn-message-007
  text: 面對面說不出口的話，你會願意用訊息傳給對方嗎？
  tags: [message]
- id: qn-message-008
  text: 打完一段字又整段刪掉的那一刻，你在猶豫什麼？
  tags: [message]
- id: qn-message-009
  text: 如果要在半夜傳一則訊息，你腦中先浮現的是誰？
  tags: [message]
- id: qn-message-010
  text: 有沒有一個人，你很想再和他好好聊一次？
  tags: [message]
- id: qn-message-011
  text: 你喜歡用哪種方式和在乎的人保持聯繫？
  tags: [message]
- id: qn-message-012
  text: 收到訊息時，你通常會馬上讀，還是留到有空再看？
  tags: [message]
- id: qn-message-013
  text: 有沒有一句「在嗎」，其實一直卡在你的輸入框裡？
  tags: [message]
- id: qn-message-014
  text: 什麼樣的訊息，會讓你捨不得把它刪掉？
  tags: [message]
- id: qn-message-015
  text: 你會怎麼重新開啟一段好久沒往來的對話？
  tags: [message]
- id: qn-message-016
  text: 傳訊息給重要的人之前，你會反覆看過幾遍嗎？
  tags: [message]
- id: qn-message-017
  text: 有沒有誰，光是名字跳出來就會讓你嘴角上揚？
  tags: [message]
- id: qn-message-018
  text: 此刻你最想收到誰傳來的一句話？
  tags: [message]
- id: qn-message-019
  text: 你和某個人之間，有沒有一段只有你們看得懂的訊息？
  tags: [message]
- id: qn-message-020
  text: 如果能傳一則訊息到過去，你想對那時的自己說什麼？
  tags: [message]
