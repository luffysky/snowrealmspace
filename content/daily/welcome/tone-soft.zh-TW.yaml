# 歡迎鏈 · 軟性打氣。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-soft-01
  text: 回來就好，今天不必做到滿分。
  tags: [welcome]
- id: wl-soft-02
  text: 慢慢來也很好，這裡從不趕人。
  tags: [welcome]
- id: wl-soft-03
  text: 你已經夠了，剩下的都可以放輕一點。
  tags: [welcome]
- id: wl-soft-04
  text: 累的話就先坐著，什麼都不做也是被允許的。
  tags: [welcome]
- id: wl-soft-05
  text: 不完美的一天，一樣值得被溫柔對待。
  tags: [welcome]
- id: wl-soft-06
  text: 這裡沒有標準答案，只有你舒服的樣子。
  tags: [welcome]
- id: wl-soft-07
  text: 想休息就休息，沒有人在計較。
  tags: [welcome]
- id: wl-soft-08
  text: 帶著疲憊進來也沒關係，你不用先整理好自己。
  tags: [welcome]
- id: wl-soft-09
  text: 一小步就很好，微小的事也算數。
  tags: [welcome]
- id: wl-soft-10
  text: 允許自己今天只是存在，這樣就足夠。
  tags: [welcome]
- id: wl-soft-11
  text: 難過的時候，這裡會靜靜陪著你。
  tags: [welcome]
- id: wl-soft-12
  text: 你不必解釋為什麼累，我懂的。
  tags: [welcome]
- id: wl-soft-13
  text: 把肩膀放下來，這裡不需要你撐著。
  tags: [welcome]
- id: wl-soft-14
  text: 想空著手回來，也完全可以。
  tags: [welcome]
- id: wl-soft-15
  text: 溫柔一點對待自己，你今天辛苦了。
  tags: [welcome]
- id: wl-soft-16
  text: 沒力氣的日子，也是被接住的日子。
  tags: [welcome]
- id: wl-soft-17
  text: 你的節奏就是對的節奏，不用跟誰比。
  tags: [welcome]
- id: wl-soft-18
  text: 卡住也沒關係，停在原地也是一種前進。
  tags: [welcome]
- id: wl-soft-19
  text: 想哭就哭吧，這裡的門一直為你開著。
  tags: [welcome]
- id: wl-soft-20
  text: 今天的你，已經很好了。
  tags: [welcome]
