# 歡迎鏈 · 俏皮輕鬆。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-play-01
  text: 你終於出現了，燈我早開好了。
  tags: [welcome]
- id: wl-play-02
  text: 想你了欸，正好你就來了。
  tags: [welcome]
- id: wl-play-03
  text: 哎呀是你，這裡瞬間熱鬧起來。
  tags: [welcome]
- id: wl-play-04
  text: 我就知道你會回來，果然吧。
  tags: [welcome]
- id: wl-play-05
  text: 位子我幫你佔著，誰都別想坐。
  tags: [welcome]
- id: wl-play-06
  text: 來啦來啦，就等你這位主角。
  tags: [welcome]
- id: wl-play-07
  text: 偷偷說，這裡沒你有點無聊。
  tags: [welcome]
- id: wl-play-08
  text: 你一進門，整個空間都亮眼了。
  tags: [welcome]
- id: wl-play-09
  text: 猜你今天會來，被我猜中了吧。
  tags: [welcome]
- id: wl-play-10
  text: 歡迎光臨，貴賓只有你一位。
  tags: [welcome]
- id: wl-play-11
  text: 你走這幾天，這裡可是天天張望。
  tags: [welcome]
- id: wl-play-12
  text: 你的角落我擦得亮晶晶，就等你驗收。
  tags: [welcome]
- id: wl-play-13
  text: 咦，稀客稀客，快進來坐。
  tags: [welcome]
- id: wl-play-14
  text: 你不在的時候，這裡都在偷偷想你。
  tags: [welcome]
- id: wl-play-15
  text: 終於等到你，快把外套掛好。
  tags: [welcome]
- id: wl-play-16
  text: 主人回來了，這裡立刻精神了。
  tags: [welcome]
- id: wl-play-17
  text: 你來得剛好，這裡正想找人說話。
  tags: [welcome]
- id: wl-play-18
  text: 噔噔，你的專屬角落已就位。
  tags: [welcome]
- id: wl-play-19
  text: 一看就是你，這身影我最熟。
  tags: [welcome]
- id: wl-play-20
  text: 你回來啦，這裡剛剛還在數日子呢。
  tags: [welcome]
