# 歡迎鏈 · 感官細節（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-sense-21
  text: 熱水壺剛燒開，咕嚕聲還沒散。
  tags: [welcome]
- id: wl-sense-22
  text: 門口的燈，早在你到之前就亮著。
  tags: [welcome]
- id: wl-sense-23
  text: 沙發上的靠枕，還留著上次的凹痕。
  tags: [welcome]
- id: wl-sense-24
  text: 廚房飄來一點薑湯的甜味。
  tags: [welcome]
- id: wl-sense-25
  text: 你踩過的門墊，鬆鬆軟軟的。
  tags: [welcome]
- id: wl-sense-26
  text: 窗簾縫裡漏進一線傍晚的橘。
  tags: [welcome]
- id: wl-sense-27
  text: 桌上攤著的書，還停在你上次那一頁。
  tags: [welcome]
- id: wl-sense-28
  text: 暖氣悄悄把屋角的涼意趕走了。
  tags: [welcome]
- id: wl-sense-29
  text: 木頭櫃子裡，有一點乾燥花的香。
  tags: [welcome]
- id: wl-sense-30
  text: 屋簷下的燈罩，把光染得軟軟的。
  tags: [welcome]
- id: wl-sense-31
  text: 你熟悉的那條毯子，疊在椅背等著。
  tags: [welcome]
- id: wl-sense-32
  text: 剛擦過的桌面，映著一點窗光。
  tags: [welcome]
- id: wl-sense-33
  text: 鍋裡的湯還冒著小小的泡。
  tags: [welcome]
- id: wl-sense-34
  text: 走廊盡頭那盞夜燈，一直沒關。
  tags: [welcome]
- id: wl-sense-35
  text: 窗外的樹影，慢慢爬過牆面。
  tags: [welcome]
- id: wl-sense-36
  text: 抽屜裡的舊信紙，還有淡淡墨味。
  tags: [welcome]
- id: wl-sense-37
  text: 剛洗好的杯子，倒扣著晾在架上。
  tags: [welcome]
- id: wl-sense-38
  text: 屋裡的空氣，比外頭慢了一拍。
  tags: [welcome]
- id: wl-sense-39
  text: 爐邊的柴火，偶爾劈啪一聲。
  tags: [welcome]
- id: wl-sense-40
  text: 你脫下外套時，衣架輕輕搖了搖。
  tags: [welcome]
