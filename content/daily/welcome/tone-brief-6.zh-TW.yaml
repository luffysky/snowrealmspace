# 歡迎鏈 · 極短一句（第六批）。回家的感覺。繁體中文，每一則獨一無二。每句 14 字以內。
- id: wl-brief-101
  text: 雪落無聲。
  tags: [welcome]
- id: wl-brief-102
  text: 爐煙裊裊。
  tags: [welcome]
- id: wl-brief-103
  text: 月光鋪滿窗。
  tags: [welcome]
- id: wl-brief-104
  text: 歸鳥入林了。
  tags: [welcome]
- id: wl-brief-105
  text: 井水正甜。
  tags: [welcome]
- id: wl-brief-106
  text: 石階通往你。
  tags: [welcome]
- id: wl-brief-107
  text: 磚牆替你擋風。
  tags: [welcome]
- id: wl-brief-108
  text: 稻香飄過來。
  tags: [welcome]
- id: wl-brief-109
  text: 竹簾半捲著。
  tags: [welcome]
- id: wl-brief-110
  text: 藤椅空著等你。
  tags: [welcome]
- id: wl-brief-111
  text: 篝火不熄。
  tags: [welcome]
- id: wl-brief-112
  text: 溪聲哄著你。
  tags: [welcome]
- id: wl-brief-113
  text: 田埂通向家。
  tags: [welcome]
- id: wl-brief-114
  text: 松針鋪成路。
  tags: [welcome]
- id: wl-brief-115
  text: 薑茶暖著胃。
  tags: [welcome]
- id: wl-brief-116
  text: 煙囪冒著白。
  tags: [welcome]
- id: wl-brief-117
  text: 屋瓦接住雨。
  tags: [welcome]
- id: wl-brief-118
  text: 白帆入港了。
  tags: [welcome]
- id: wl-brief-119
  text: 蒲團留給你。
  tags: [welcome]
- id: wl-brief-120
  text: 暮色收了工。
  tags: [welcome]
