  - id: wl-x1a-0328
    text: 你可以待著，這裡是你的地方。
    tags: [companion]
  - id: wl-x1a-0329
    text: 這一刻先屬於你，這片雪地還在等你。
    tags: [buddy]
  - id: wl-x1a-0330
    text: 慢慢來就好，光還亮著。
    tags: [poem]
  - id: wl-x1a-0331
    text: 歡迎回來，一切都為你留著。
    tags: [warm]
  - id: wl-x1a-0332
    text: 你回來了，我哪裡都沒去。
    tags: [cozy]
  - id: wl-x1a-0333
    text: 回來就好，這裡很安靜。
    tags: [gentle]
  - id: wl-x1a-0334
    text: 又見到你了，可以什麼都不做。
