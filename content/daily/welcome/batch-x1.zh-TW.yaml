  - id: wl-x1b-0054
    text: 回來就好。
    tags: [brief]
  - id: wl-x1b-0055
    text: 你回到這裡，來點好玩的怎麼樣。
    tags: [play]
  - id: wl-x1b-0056
    text: 你來了，早晨就有了理由變柔軟。
