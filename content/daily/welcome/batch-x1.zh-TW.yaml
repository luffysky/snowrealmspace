  - id: wl-x1b-0036
    text: 你一進門，空氣就柔了下來。
    tags: [sense]
  - id: wl-x1b-0037
    text: 累的時候回來就好，什麼都不用說。
    tags: [tired]
  - id: wl-x1b-0038
    text: 你回來了，這裡的節日才算開始。
    tags: [festive]
  - id: wl-x1b-0039
    text: 你來了，週末就有了鬆懈的理由。
