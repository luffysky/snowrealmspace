  - id: wl-x1a-0347
    text: 不用急，這裡等你很久了。
    tags: [home]
  - id: wl-x1a-0348
    text: 你辛苦了，你被好好接住了。
    tags: [companion]
  - id: wl-x1a-0349
    text: 歡迎回到你的小空間，這裡一直為你亮著燈。
    tags: [buddy]
  - id: wl-x1a-0350
    text: 抱抱，歡迎回來，這裡一直都在。
    tags: [poem]
  - id: wl-x1a-0351
    text: 嘿，你回來了，這裡沒有變。
    tags: [warm]
  - id: wl-x1a-0352
    text: 悄悄跟你說聲歡迎回來，一切都好好的。
