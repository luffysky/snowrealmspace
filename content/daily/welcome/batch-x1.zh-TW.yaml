# 歡迎鏈補充批次 x1（自動組裝、全池去重）。tags 為 tone。
  - id: wl-x1a-0001
    text: 歡迎回來，這裡一直都在。
    tags: [warm]
  - id: wl-x1a-0002
    text: 你回來了，這裡沒有變。
    tags: [cozy]
  - id: wl-x1a-0003
    text: 回來就好，一切都好好的。
    tags: [gentle]
  - id: wl-x1a-0004
    text: 又見到你了，時間在這裡走得很慢。
    tags: [quiet]
  - id: wl-x1a-0005
    text: 你來啦，你可以慢慢來。
    tags: [soft]
  - id: wl-x1a-0006
    text: 回家了呢，沒有人在催你。
    tags: [hello]
  - id: wl-x1a-0007
    text: 歡迎回到這裡，想待多久都可以。
    tags: [home]
  - id: wl-x1a-0008
    text: 你終於回來了，這裡是你的地方。
    tags: [companion]
  - id: wl-x1a-0009
    text: 很高興你回來，這片雪地還在等你。
    tags: [buddy]
  - id: wl-x1a-0010
    text: 回來坐坐吧，光還亮著。
    tags: [poem]
  - id: wl-x1a-0011
    text: 進來吧，窩還是暖的。
    tags: [warm]
  - id: wl-x1a-0012
    text: 慢慢走進來，一切都為你留著。
    tags: [cozy]
  - id: wl-x1a-0013
    text: 把外套放下吧，我哪裡都沒去。
    tags: [gentle]
  - id: wl-x1a-0014
    text: 先坐一會兒，這裡很安靜。
    tags: [quiet]
  - id: wl-x1a-0015
    text: 把今天放下吧，可以什麼都不做。
    tags: [soft]
  - id: wl-x1a-0016
    text: 深呼吸一下，坐著發呆也很好。
    tags: [hello]
  - id: wl-x1a-0017
    text: 不用急，這裡只屬於你。
    tags: [home]
  - id: wl-x1a-0018
    text: 你辛苦了，你不需要準備好才進來。
    tags: [companion]
  - id: wl-x1a-0019
    text: 歡迎回到你的小空間，來了就是休息。
    tags: [buddy]
  - id: wl-x1a-0020
    text: 抱抱，歡迎回來，這裡很柔軟。
    tags: [poem]
  - id: wl-x1a-0021
    text: 嘿，你回來了，風雪都被關在門外了。
    tags: [warm]
  - id: wl-x1a-0022
    text: 悄悄跟你說聲歡迎回來，世界的吵鬧先留在外面。
    tags: [cozy]
  - id: wl-x1a-0023
    text: 看到你回來真好，這裡收得下你的疲憊。
    tags: [gentle]
  - id: wl-x1a-0024
    text: 一路辛苦了，你只要在就好。
    tags: [quiet]
  - id: wl-x1a-0025
    text: 把鞋子脫了吧，不必說話也沒關係。
    tags: [soft]
  - id: wl-x1a-0026
    text: 先喝口熱的，慢一點也沒關係。
    tags: [hello]
  - id: wl-x1a-0027
    text: 讓自己軟下來吧，這份安靜為你留著。
    tags: [home]
  - id: wl-x1a-0028
    text: 你可以待著，這裡等你很久了。
    tags: [companion]
  - id: wl-x1a-0029
    text: 這一刻先屬於你，你被好好接住了。
    tags: [buddy]
  - id: wl-x1a-0030
    text: 慢慢來就好，這裡一直為你亮著燈。
