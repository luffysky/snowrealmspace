    tags: [poem]
  - id: wl-x1b-0001
    text: 早安，這裡的光還替你留著。
    tags: [morning]
  - id: wl-x1b-0002
    text: 晚安前，先回到這裡歇一會兒。
    tags: [evening]
  - id: wl-x1b-0003
    text: 熟悉的味道還在，你一聞就認得。
    tags: [sense]
  - id: wl-x1b-0004
    text: 累了就回來，這裡不必逞強。
    tags: [tired]
  - id: wl-x1b-0005
    text: 節日裡回來，這裡也替你點了燈。
    tags: [festive]
  - id: wl-x1b-0006
    text: 週末了，這裡陪你慢慢過。
    tags: [weekend]
  - id: wl-x1b-0007
    text: 好久沒來了，這裡一直沒變。
    tags: [longtime]
  - id: wl-x1b-0008
    text: 踏進來，先站穩，這裡很實在。
    tags: [ground]
  - id: wl-x1b-0009
    text: 你回來了，今天也好好過完了。
    tags: [daily]
  - id: wl-x1b-0010
    text: 你回來了。
    tags: [brief]
  - id: wl-x1b-0011
    text: 你回來了，這裡替你藏了點好玩的。
    tags: [play]
  - id: wl-x1b-0012
    text: 你回來了，晨光也剛好醒著。
    tags: [morning]
  - id: wl-x1b-0013
    text: 夜色來了，這裡的燈替你亮著。
    tags: [evening]
  - id: wl-x1b-0014
    text: 這裡的溫度，剛好是你記得的樣子。
    tags: [sense]
  - id: wl-x1b-0015
    text: 辛苦了，先把包袱放在門口。
    tags: [tired]
  - id: wl-x1b-0016
    text: 今天很特別，這裡陪你一起過。
    tags: [festive]
  - id: wl-x1b-0017
    text: 放假的日子，回這裡懶一下吧。
    tags: [weekend]
  - id: wl-x1b-0018
    text: 隔了一陣子，你的位置還在。
    tags: [longtime]
  - id: wl-x1b-0019
    text: 這裡的地板很穩，你可以放心踩著。
    tags: [ground]
  - id: wl-x1b-0020
    text: 每天回到這裡，就是一種安穩。
    tags: [daily]
  - id: wl-x1b-0021
    text: 這裡一直在。
    tags: [brief]
  - id: wl-x1b-0022
    text: 回家啦，來這裡輕鬆一下吧。
    tags: [play]
  - id: wl-x1b-0023
    text: 新的一天，這個角落先幫你暖好了。
    tags: [morning]
  - id: wl-x1b-0024
    text: 你回來了，剛好趕上今晚的安靜。
    tags: [evening]
  - id: wl-x1b-0025
    text: 腳步聲一響，這裡就知道是你。
    tags: [sense]
  - id: wl-x1b-0026
    text: 你撐了一整天，這裡接住你。
    tags: [tired]
  - id: wl-x1b-0027
    text: 過節了，這個角落也熱鬧了起來。
    tags: [festive]
  - id: wl-x1b-0028
    text: 週末回家，時間可以走得很慢。
    tags: [weekend]
  - id: wl-x1b-0029
    text: 多久沒回都沒關係，門一直開著。
    tags: [longtime]
  - id: wl-x1b-0030
    text: 回來就好，這裡替你把腳步穩住。
    tags: [ground]
  - id: wl-x1b-0031
    text: 你來了，這一天就有了收尾的地方。
    tags: [daily]
  - id: wl-x1b-0032
    text: 歡迎回家。
    tags: [brief]
  - id: wl-x1b-0033
    text: 你來了，這裡想陪你玩一會兒。
    tags: [play]
  - id: wl-x1b-0034
    text: 早起的你，這裡也早就在等這一刻。
