  - id: wl-x1a-0342
    text: 慢慢走進來，這裡收得下你的疲憊。
    tags: [cozy]
  - id: wl-x1a-0343
    text: 把外套放下吧，你只要在就好。
    tags: [gentle]
  - id: wl-x1a-0344
    text: 先坐一會兒，不必說話也沒關係。
    tags: [quiet]
  - id: wl-x1a-0345
    text: 把今天放下吧，慢一點也沒關係。
