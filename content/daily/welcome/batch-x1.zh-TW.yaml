  - id: wl-x1b-0059
    text: 你回來了，肩膀可以先放下來。
    tags: [tired]
  - id: wl-x1b-0060
    text: 今天值得慶祝，你回來得剛好。
    tags: [festive]
  - id: wl-x1b-0061
    text: 週末的光很懶，剛好配你的節奏。
    tags: [weekend]
  - id: wl-x1b-0062
    text: 隔了好些天，這裡照樣認得你。
    tags: [longtime]
  - id: wl-x1b-0063
    text: 回家的意思，是重新站回穩的地方。
    tags: [ground]
  - id: wl-x1b-0064
    text: 你回到這裡，平常的一天也變柔軟。
    tags: [daily]
  - id: wl-x1b-0065
    text: 門一直開著。
    tags: [brief]
  - id: wl-x1b-0066
    text: 回家的路上辛苦，來這裡逗自己笑一下。
    tags: [play]
  - id: wl-x1b-0067
    text: 睜開眼就想到這裡，真好。
    tags: [morning]
  - id: wl-x1b-0068
    text: 晚上好，這裡一直沒關門等你。
    tags: [evening]
  - id: wl-x1b-0069
    text: 推開門的那一下，心就安了。
    tags: [sense]
  - id: wl-x1b-0070
    text: 疲憊沒關係，這裡替你擋一擋。
    tags: [tired]
  - id: wl-x1b-0071
    text: 節日的光很暖，正照著你的位置。
    tags: [festive]
  - id: wl-x1b-0072
    text: 放假回來，先什麼都不做也行。
    tags: [weekend]
  - id: wl-x1b-0073
    text: 回來就好，這裡從沒把你當外人。
    tags: [longtime]
  - id: wl-x1b-0074
    text: 你踏進來，地就替你穩了。
    tags: [ground]
  - id: wl-x1b-0075
    text: 每天這一刻，這裡都替你留著。
    tags: [daily]
  - id: wl-x1b-0076
    text: 這裡等著你。
    tags: [brief]
  - id: wl-x1b-0077
    text: 你來了，這裡替你留了一份輕鬆。
    tags: [play]
  - id: wl-x1b-0078
    text: 早安，慢慢來，這裡不趕時間。
    tags: [morning]
  - id: wl-x1b-0079
    text: 夜深一點也沒關係，這裡都在。
    tags: [evening]
  - id: wl-x1b-0080
    text: 這裡的安靜，是你聽得懂的那種。
    tags: [sense]
  - id: wl-x1b-0081
    text: 累壞了吧，先在這裡喘口氣。
    tags: [tired]
  - id: wl-x1b-0082
    text: 你來了，這裡也想跟你說聲節日快樂。
    tags: [festive]
  - id: wl-x1b-0083
    text: 你回來了，週末才算真的開始。
    tags: [weekend]
  - id: wl-x1b-0084
    text: 你久沒來，這裡也一直好好的。
    tags: [longtime]
  - id: wl-x1b-0085
    text: 這裡不搖不晃，你可以安心站著。
    tags: [ground]
  - id: wl-x1b-0086
    text: 你來了，尋常的日子也發著光。
    tags: [daily]
  - id: wl-x1b-0087
    text: 你回來，就對了。
    tags: [brief]
  - id: wl-x1b-0088
    text: 回來吧，這裡陪你把心情調亮。
    tags: [play]
  - id: wl-x1b-0089
    text: 一早回到這裡，像喝了一口溫水。
