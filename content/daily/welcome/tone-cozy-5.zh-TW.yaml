# 歡迎鏈 · 溫馨居家（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-81
  text: 鍋裡的牛奶溫著，杯子也先燙過了。
  tags: [welcome]
- id: wl-cozy-82
  text: 一盞小燈串繞著窗框，把夜色點成暖暖的顆粒。
  tags: [welcome]
- id: wl-cozy-83
  text: 剛進門，暖氣就把外頭那股冷從你身上接了過去。
  tags: [welcome]
- id: wl-cozy-84
  text: 針織毯疊在床尾，一拉開就是熟悉的重量。
  tags: [welcome]
- id: wl-cozy-85
  text: 熱可可上頭浮著棉花糖，慢慢化成一圈甜。
  tags: [welcome]
- id: wl-cozy-86
  text: 桌角那支香氛蠟燭燃著小火，屋裡多了層安穩。
  tags: [welcome]
- id: wl-cozy-87
  text: 廚房的碗盤瀝著水，一件件都在慢慢歸位。
  tags: [welcome]
- id: wl-cozy-88
  text: 老唱片轉著沙沙的底噪，把安靜填得剛剛好。
  tags: [welcome]
- id: wl-cozy-89
  text: 暖手瓶灌滿了熱水，塞進被窩替你先焐著。
  tags: [welcome]
- id: wl-cozy-90
  text: 木窗框上結了薄薄一層霜，屋裡卻是暖的。
  tags: [welcome]
- id: wl-cozy-91
  text: 玄關的感應燈輕輕亮起，替你認出了回家的腳步。
  tags: [welcome]
- id: wl-cozy-92
  text: 一鍋白粥在爐上咕嘟著，米香把整個廚房都熬軟了。
  tags: [welcome]
- id: wl-cozy-93
  text: 沙發縫裡塞著你上回落下的髮夾，屋子替你收著。
  tags: [welcome]
- id: wl-cozy-94
  text: 床單換成了絨的，躺上去像陷進一朵雲。
  tags: [welcome]
- id: wl-cozy-95
  text: 窗外飄起細雪，屋簷的燈把每片都照得暖橘。
  tags: [welcome]
- id: wl-cozy-96
  text: 熱敷袋在肩上壓著，一天的緊繃慢慢鬆開。
  tags: [welcome]
- id: wl-cozy-97
  text: 灶上的餘溫還留著，圍裙掛在門後，飯剛做完等你。
  tags: [welcome]
- id: wl-cozy-98
  text: 一杯溫水擱在床頭，夜裡渴了伸手就有。
  tags: [welcome]
- id: wl-cozy-99
  text: 屋裡的燈調成一片琥珀色，把牆角的影子都焐軟了。
  tags: [welcome]
- id: wl-cozy-100
  text: 門一闔上，世界的喧嘩就被隔在那層厚厚的木頭外面。
  tags: [welcome]
