# 歡迎鏈補充批次 3 · 各種語氣。回家的感覺。
- id: wl-home-41
  text: 你回來的時間，剛剛好。
  tags: [welcome]
- id: wl-home-42
  text: 嗨，今天你也來了。
  tags: [welcome]
- id: wl-home-43
  text: 歡迎回來，先不用交代什麼。
  tags: [welcome]
- id: wl-home-44
  text: 這裡的一切，都照你離開時的樣子。
  tags: [welcome]
- id: wl-home-45
  text: 回來就好，慢慢暖機。
  tags: [welcome]
- id: wl-home-46
  text: 嗨，把心裡的行李放下吧。
  tags: [welcome]
- id: wl-home-47
  text: 你來的每個時刻，這裡都空著位子。
  tags: [welcome]
- id: wl-home-48
  text: 歡迎回來，做你想做的，或什麼都不做。
  tags: [welcome]
- id: wl-home-49
  text: 這裡認得你，不用自我介紹。
  tags: [welcome]
- id: wl-home-50
  text: 回來了，深呼吸，你安全了。
  tags: [welcome]
- id: wl-home-51
  text: 嗨，今天想安靜還是熱鬧，都可以。
  tags: [welcome]
- id: wl-home-52
  text: 歡迎回來，你的東西都好好的。
  tags: [welcome]
- id: wl-home-53
  text: 這一刻，這裡只屬於你。
  tags: [welcome]
- id: wl-home-54
  text: 回來就好，外面的事先關在外面。
  tags: [welcome]
- id: wl-home-55
  text: 嗨，好久沒見，位子還熱著。
  tags: [welcome]
- id: wl-home-56
  text: 歡迎回來，讓自己慢慢落地。
  tags: [welcome]
- id: wl-home-57
  text: 你回來，這裡就有了聲音。
  tags: [welcome]
- id: wl-home-58
  text: 這裡不趕你，你也別趕自己。
  tags: [welcome]
- id: wl-home-59
  text: 嗨，把今天的重，先卸一半。
  tags: [welcome]
- id: wl-home-60
  text: 歡迎回來，一切都可以慢慢來。
  tags: [welcome]
- id: wl-home-61
  text: 你在的時候，這裡最有溫度。
  tags: [welcome]
- id: wl-home-62
  text: 回來了，先坐下，喝口水。
  tags: [welcome]
- id: wl-home-63
  text: 嗨，這裡替你留著昨天的燈。
  tags: [welcome]
- id: wl-home-64
  text: 歡迎回來，今天的你也很好。
  tags: [welcome]
- id: wl-home-65
  text: 這裡收著你的節奏，不催不趕。
  tags: [welcome]
- id: wl-home-66
  text: 回來就好，剩下的慢慢說。
  tags: [welcome]
- id: wl-home-67
  text: 嗨，門一直為你半掩著。
  tags: [welcome]
- id: wl-home-68
  text: 歡迎回來，把肩上的都放下。
  tags: [welcome]
- id: wl-home-69
  text: 這裡一直都在，不吵不鬧。
  tags: [welcome]
- id: wl-home-70
  text: 回來了，今天就先這樣，很好。
  tags: [welcome]
