# 歡迎鏈 · 溫暖直接（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-21
  text: 空氣裡還留著你上次待過的痕跡，一點沒散。
  tags: [welcome]
- id: wl-warm-22
  text: 這裡的一切，都照你離開時的樣子等著。
  tags: [welcome]
- id: wl-warm-23
  text: 你不用敲門，這扇門本來就朝你開。
  tags: [welcome]
- id: wl-warm-24
  text: 回來的路你閉著眼都認得，因為這裡是你的。
  tags: [welcome]
- id: wl-warm-25
  text: 牆上那些舊痕，每一道都記得你。
  tags: [welcome]
- id: wl-warm-26
  text: 你屬於這裡，這件事從來沒變過。
  tags: [welcome]
- id: wl-warm-27
  text: 就算全世界都不懂你，這裡懂。
  tags: [welcome]
- id: wl-warm-28
  text: 你隨手擱下的東西，還在原地等你。
  tags: [welcome]
- id: wl-warm-29
  text: 這裡替你收著那些你捨不得丟的小事。
  tags: [welcome]
- id: wl-warm-30
  text: 你回來的樣子，這裡看再多遍都還是歡喜。
  tags: [welcome]
- id: wl-warm-31
  text: 別的地方要你證明什麼，這裡只要你人來了就好。
  tags: [welcome]
- id: wl-warm-32
  text: 你在外頭是誰都行，進了這裡就只是你自己。
  tags: [welcome]
- id: wl-warm-33
  text: 這裡的門把，最熟悉你的手心。
  tags: [welcome]
- id: wl-warm-34
  text: 你踩過的地板，記得你的重量。
  tags: [welcome]
- id: wl-warm-35
  text: 這方寸之間，滿是你留下的痕跡在陪你。
  tags: [welcome]
- id: wl-warm-36
  text: 你不必開口，這裡也曉得你今天過得如何。
  tags: [welcome]
- id: wl-warm-37
  text: 這裡最會的一件事，就是原原本本把你留住。
  tags: [welcome]
- id: wl-warm-38
  text: 你每回來一次，這裡就更像你一點。
  tags: [welcome]
- id: wl-warm-39
  text: 外頭的門一扇扇關上時，這一扇還替你開著。
  tags: [welcome]
- id: wl-warm-40
  text: 你是這裡唯一的主人，天塌下來也不變。
  tags: [welcome]
