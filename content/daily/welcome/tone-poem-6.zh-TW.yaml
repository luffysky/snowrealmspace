# 歡迎鏈 · 詩意留白（第六批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-101
  text: 苔痕爬上石階，把回家的路走得更軟了。
  tags: [welcome]
- id: wl-poem-102
  text: 屋瓦接住整夜的雨，一滴都沒落到你肩上。
  tags: [welcome]
- id: wl-poem-103
  text: 紙窗把天光揉薄，只留一層剛好的亮給你。
  tags: [welcome]
- id: wl-poem-104
  text: 香爐裡的煙慢慢盤上去，替這屋子繫住一縷安穩。
  tags: [welcome]
- id: wl-poem-105
  text: 燈芯剪短了些，火光更定，正好陪你到夜深。
  tags: [welcome]
- id: wl-poem-106
  text: 松林在牆外起了濤聲，把喧囂都揉成睡意。
  tags: [welcome]
- id: wl-poem-107
  text: 石橋那頭的燈認得你，一過橋就到家了。
  tags: [welcome]
- id: wl-poem-108
  text: 陶碗盛的熱還冒著氣，捧在手裡人就定了。
  tags: [welcome]
- id: wl-poem-109
  text: 南飛的雁排成一行，替你把最後一段天色領回門前。
  tags: [welcome]
- id: wl-poem-110
  text: 一片楓葉貼在窗上，給這扇窗添了點暖色。
  tags: [welcome]
- id: wl-poem-111
  text: 屏風替你把穿堂的風，攔在了外邊。
  tags: [welcome]
- id: wl-poem-112
  text: 蜂巢裡積著整季的甜，這屋子替你留著一勺。
  tags: [welcome]
- id: wl-poem-113
  text: 霜爬滿了窗櫺，玻璃這頭卻一直是暖的。
  tags: [welcome]
- id: wl-poem-114
  text: 岸邊的柳垂到水面，把夜色梳得很輕很輕。
  tags: [welcome]
- id: wl-poem-115
  text: 一朵流雲停在屋脊上，像也想在這裡歇歇腳。
  tags: [welcome]
- id: wl-poem-116
  text: 泉水順著竹筒噹地一傾，替這院子輕輕報了時辰。
  tags: [welcome]
- id: wl-poem-117
  text: 瓶裡的花開到最好的一刻，剛好等你進門看見。
  tags: [welcome]
- id: wl-poem-118
  text: 簷下的冰稜化了一截，滴答聲替你數著暖回來的速度。
  tags: [welcome]
- id: wl-poem-119
  text: 硯台裡的墨還潤著，等你回來把今天寫完最後一筆。
  tags: [welcome]
- id: wl-poem-120
  text: 遠處的燈塔轉了一圈，把你這艘船引回最靜的港。
  tags: [welcome]
