# 歡迎鏈 · 安靜溫柔（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-61
  text: 圍巾解下來，脖子鬆一口氣。
  tags: [welcome]
- id: wl-quiet-62
  text: 坐下以後，別急著起身。
  tags: [welcome]
- id: wl-quiet-63
  text: 讓後背找到椅子，整個人就有依靠了。
  tags: [welcome]
- id: wl-quiet-64
  text: 今天走了很遠，腳可以先不動了。
  tags: [welcome]
- id: wl-quiet-65
  text: 掌心朝上放在膝上，什麼都不必抓。
  tags: [welcome]
- id: wl-quiet-66
  text: 這裡暖得剛好，冷可以慢慢退了。
  tags: [welcome]
- id: wl-quiet-67
  text: 咬一口熱的，胃暖了心也跟著暖。
  tags: [welcome]
- id: wl-quiet-68
  text: 沒有誰在計較你今天做了多少。
  tags: [welcome]
- id: wl-quiet-69
  text: 眉頭鬆開一點，那裡皺了一整天了。
  tags: [welcome]
- id: wl-quiet-70
  text: 頭靠上枕，脖子終於不用自己撐了。
  tags: [welcome]
- id: wl-quiet-71
  text: 想安靜就安靜，這裡不需要熱鬧。
  tags: [welcome]
- id: wl-quiet-72
  text: 把肩上的包放下，它今天也累了。
  tags: [welcome]
- id: wl-quiet-73
  text: 讓下巴鬆一鬆，牙齒別再咬那麼緊。
  tags: [welcome]
- id: wl-quiet-74
  text: 這裡很穩，晃了一天的心可以停下來。
  tags: [welcome]
- id: wl-quiet-75
  text: 慢慢眨一次眼，把白天的光都放掉。
  tags: [welcome]
- id: wl-quiet-76
  text: 誰都不在看你，怎麼舒服怎麼待。
  tags: [welcome]
- id: wl-quiet-77
  text: 讓胸口的那口氣，一點一點吐乾淨。
  tags: [welcome]
- id: wl-quiet-78
  text: 手腳放軟，交給這張床就好。
  tags: [welcome]
- id: wl-quiet-79
  text: 這裡替你把明天先關在門外。
  tags: [welcome]
- id: wl-quiet-80
  text: 睏了就睏著，有人替你把夜守好。
  tags: [welcome]
