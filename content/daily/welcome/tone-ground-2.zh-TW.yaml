# 歡迎鏈 · 踏實安定（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-ground-21
  text: 根扎得夠深，這片地你踩多重都不會晃。
  tags: [welcome]
- id: wl-ground-22
  text: 樑柱一根都沒少，屋頂替你頂著天。
  tags: [welcome]
- id: wl-ground-23
  text: 潮水漲了又退，這塊礁石始終露在水面上。
  tags: [welcome]
- id: wl-ground-24
  text: 這裡的秩序自己會運轉，你不用操心它散掉。
  tags: [welcome]
- id: wl-ground-25
  text: 石階被踩了很多年，紋路都認得你的腳步。
  tags: [welcome]
- id: wl-ground-26
  text: 爐火壓得低低的，一整夜都不會熄。
  tags: [welcome]
- id: wl-ground-27
  text: 卸下背上的重量吧，這張桌子承得起。
  tags: [welcome]
- id: wl-ground-28
  text: 季節換過幾輪，這口井的水位一直沒降。
  tags: [welcome]
- id: wl-ground-29
  text: 錨已經下到底了，這條船不會被浪帶走。
  tags: [welcome]
- id: wl-ground-30
  text: 這裡的規矩很簡單，就是永遠替你空著一格。
  tags: [welcome]
- id: wl-ground-31
  text: 大樹的影子每年都在同一個位置等你。
  tags: [welcome]
- id: wl-ground-32
  text: 慌張的心跳到這裡，會慢慢跟上這裡的節拍。
  tags: [welcome]
- id: wl-ground-33
  text: 屋簷底下的乾燥，是替你留了一整季的。
  tags: [welcome]
- id: wl-ground-34
  text: 這條路你走過無數遍，閉著眼都不會迷。
  tags: [welcome]
- id: wl-ground-35
  text: 鐘擺一下一下地走，替這裡守著不變的分寸。
  tags: [welcome]
- id: wl-ground-36
  text: 地下的管線、頭頂的橫梁，都在你看不見的地方撐著。
  tags: [welcome]
- id: wl-ground-37
  text: 這片土地記得每一顆你埋下的種子。
  tags: [welcome]
- id: wl-ground-38
  text: 山不會走，這裡背靠著它，也就跟著不動。
  tags: [welcome]
- id: wl-ground-39
  text: 陳舊的木頭最耐重，這房子越老越站得穩。
  tags: [welcome]
- id: wl-ground-40
  text: 把腳步放慢，這裡的地面接得住每一步。
  tags: [welcome]
