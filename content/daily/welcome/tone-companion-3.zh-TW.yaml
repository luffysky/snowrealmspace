# 歡迎鏈 · 陪伴式（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-companion-41
  text: 你離開的那段日子，這裡替你把燈守著。
  tags: [welcome]
- id: wl-companion-42
  text: 走了一整天的路，到這裡就能歇下來了。
  tags: [welcome]
- id: wl-companion-43
  text: 我坐在原來的位置，等的一直是你。
  tags: [welcome]
- id: wl-companion-44
  text: 這裡不趕你，你想停多久都由你。
  tags: [welcome]
- id: wl-companion-45
  text: 把肩上的重擔卸在門口，我陪你空著手待著。
  tags: [welcome]
- id: wl-companion-46
  text: 外頭再冷，這扇門後面一直溫著。
  tags: [welcome]
- id: wl-companion-47
  text: 你的呼吸放慢下來，我就在旁邊陪著這份安靜。
  tags: [welcome]
- id: wl-companion-48
  text: 這個空間學會了你的習慣，你回來一切都對得上。
  tags: [welcome]
- id: wl-companion-49
  text: 不必解釋今天過得如何，坐下就有人懂。
  tags: [welcome]
- id: wl-companion-50
  text: 我把窗簾拉了一半，剛好留一道光給你。
  tags: [welcome]
- id: wl-companion-51
  text: 你在的時候我陪著，你不在我也替你看家。
  tags: [welcome]
- id: wl-companion-52
  text: 這裡收得下你所有的情緒，多重都接得住。
  tags: [welcome]
- id: wl-companion-53
  text: 累到說不出話也行，靠著我這邊就好。
  tags: [welcome]
- id: wl-companion-54
  text: 你踩進門的那一步，整個空間就鬆了一口氣。
  tags: [welcome]
- id: wl-companion-55
  text: 我一直記得你走的時候是什麼樣子，也等著你回來。
  tags: [welcome]
- id: wl-companion-56
  text: 這片安靜是替你鋪好的，躺進去就好。
  tags: [welcome]
- id: wl-companion-57
  text: 你不用當誰的依靠了，這裡換我撐著。
  tags: [welcome]
- id: wl-companion-58
  text: 桌上那盞小燈，我沒關過，就等你這一眼。
  tags: [welcome]
- id: wl-companion-59
  text: 這裡的每個角落，都留著你待過的餘溫。
  tags: [welcome]
- id: wl-companion-60
  text: 回到我身邊，你就可以把所有防備都放下。
  tags: [welcome]
