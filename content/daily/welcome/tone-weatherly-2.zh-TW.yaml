# 歡迎鏈 · 天氣意象（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-weatherly-21
  text: 梅雨連下了好幾天，這裡的乾爽像是特地為你保留的。
  tags: [welcome]
- id: wl-weatherly-22
  text: 冰雹敲得屋外劈啪響，這片屋頂底下什麼都碰不到你。
  tags: [welcome]
- id: wl-weatherly-23
  text: 露水還掛在草尖的清晨，你踩著微涼進門，這裡先替你烘了一份暖。
  tags: [welcome]
- id: wl-weatherly-24
  text: 沙塵讓天空黃濛濛的一整天，這裡的空氣一直清清爽爽等你。
  tags: [welcome]
- id: wl-weatherly-25
  text: 熱浪把柏油路都曬軟了，這裡的陰涼像一口井，接住了你的疲憊。
  tags: [welcome]
- id: wl-weatherly-26
  text: 結霜的清晨窗上結了花紋，你哈氣擦開一角，看見裡頭的燈為你亮著。
  tags: [welcome]
- id: wl-weatherly-27
  text: 颱風把整座城吹得緊閉門窗，這裡的窗縫一絲風都不漏，只漏進安心。
  tags: [welcome]
- id: wl-weatherly-28
  text: 彩虹在雨後架上天空，你沒抬頭追它，因為這裡的顏色已經夠暖了。
  tags: [welcome]
- id: wl-weatherly-29
  text: 濃霧把遠山都藏起來，你憑著記憶走回這裡，門就在原來的位置。
  tags: [welcome]
- id: wl-weatherly-30
  text: 傾盆大雨把傘都打翻了，你狼狽地進來，這裡遞給你的是乾毛巾般的靜。
  tags: [welcome]
- id: wl-weatherly-31
  text: 回南天讓牆面都在冒汗，這裡卻乾爽如舊，替你隔開那身黏膩。
  tags: [welcome]
- id: wl-weatherly-32
  text: 晚霞把半邊天燒得通紅，你把那片橘光帶進門，這裡收下了。
  tags: [welcome]
- id: wl-weatherly-33
  text: 細雪初落還沾不住地，你踏著薄薄一層進來，鞋印停在門邊就好。
  tags: [welcome]
- id: wl-weatherly-34
  text: 乾冷的北風刮得臉頰發疼，這裡的暖意一點一點把它揉開。
  tags: [welcome]
- id: wl-weatherly-35
  text: 悶雷在雲後低鳴了整個下午，這個房間穩得像沒聽見似的，托著你。
  tags: [welcome]
- id: wl-weatherly-36
  text: 朝陽剛翻過屋脊，第一道光就落在你慣坐的那張椅子上。
  tags: [welcome]
- id: wl-weatherly-37
  text: 冷雨夾著碎冰打在窗上，這裡的燈把那片冰冷擋成了窗外的風景。
  tags: [welcome]
- id: wl-weatherly-38
  text: 海風帶著鹹味吹了一路，你進門後，只剩下屋裡熟悉的氣息陪你。
  tags: [welcome]
- id: wl-weatherly-39
  text: 久旱之後的第一場雨落下時，你已經在這裡，聽著雨聲鬆了肩膀。
  tags: [welcome]
- id: wl-weatherly-40
  text: 霜降過後草木都凝了白，你踩過那片脆響，回到這個不結霜的暖處。
  tags: [welcome]
