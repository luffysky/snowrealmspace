# 歡迎鏈 · 感官細節（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-sense-41
  text: 玄關那雙拖鞋，早擺好朝著你。
  tags: [welcome]
- id: wl-sense-42
  text: 掛鐘的滴答，把安靜襯得更深。
  tags: [welcome]
- id: wl-sense-43
  text: 果盤裡的蘋果，紅得剛剛好。
  tags: [welcome]
- id: wl-sense-44
  text: 廚房飄來一鍋飯菜的熱香。
  tags: [welcome]
- id: wl-sense-45
  text: 窗玻璃蒙上一層薄薄的霧。
  tags: [welcome]
- id: wl-sense-46
  text: 檯燈底下，圈出一小片暖光。
  tags: [welcome]
- id: wl-sense-47
  text: 冰箱在牆角，嗡嗡地低聲哼著。
  tags: [welcome]
- id: wl-sense-48
  text: 陽台收回的衣服，還帶著皂香。
  tags: [welcome]
- id: wl-sense-49
  text: 熱可可表面，浮著一層細細的奶泡。
  tags: [welcome]
- id: wl-sense-50
  text: 桌上那根蠟燭，火苗輕輕搖著。
  tags: [welcome]
- id: wl-sense-51
  text: 剛拖過的地板，散著一點木頭清香。
  tags: [welcome]
- id: wl-sense-52
  text: 門縫裡，透進走廊那盞燈的光。
  tags: [welcome]
- id: wl-sense-53
  text: 茶几上剝開的橘子，香氣散了滿桌。
  tags: [welcome]
- id: wl-sense-54
  text: 窗外的街燈，一盞接一盞亮了起來。
  tags: [welcome]
- id: wl-sense-55
  text: 那把舊木椅，坐上去會吱呀一聲。
  tags: [welcome]
- id: wl-sense-56
  text: 桌曆翻到今天，停在這一頁。
  tags: [welcome]
- id: wl-sense-57
  text: 熱毛巾疊在盆邊，還冒著白氣。
  tags: [welcome]
- id: wl-sense-58
  text: 收音機開著，低低地說著話。
  tags: [welcome]
- id: wl-sense-59
  text: 牆角的暖爐，紅著小小的一塊。
  tags: [welcome]
- id: wl-sense-60
  text: 你的杯子，仍擺在慣常那個位置。
  tags: [welcome]
