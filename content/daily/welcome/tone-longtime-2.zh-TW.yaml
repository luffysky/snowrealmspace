# 歡迎鏈 · 久違回來（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-longtime-21
  text: 這麼長一段日子，這裡替你原封不動地收著。
  tags: [welcome]
- id: wl-longtime-22
  text: 你走的那天到今天，這個位置沒讓給誰。
  tags: [welcome]
- id: wl-longtime-23
  text: 過了好久好久，回來還是這麼剛好。
  tags: [welcome]
- id: wl-longtime-24
  text: 空了這麼久的椅子，總算等到你坐回去。
  tags: [welcome]
- id: wl-longtime-25
  text: 中間隔了幾個季節都算了，人回來就好。
  tags: [welcome]
- id: wl-longtime-26
  text: 一直亮著的那盞，是留給此刻的你。
  tags: [welcome]
- id: wl-longtime-27
  text: 遠行的你回來了，這裡和記憶裡一樣。
  tags: [welcome]
- id: wl-longtime-28
  text: 這段空白，這裡沒拿去換成別的。
  tags: [welcome]
- id: wl-longtime-29
  text: 再久沒踏進來，門把仍記得你的手。
  tags: [welcome]
- id: wl-longtime-30
  text: 你不在的日子，這個空間一直留著暖氣。
  tags: [welcome]
- id: wl-longtime-31
  text: 睽違許久，坐回原位就像沒離開過。
  tags: [welcome]
- id: wl-longtime-32
  text: 你把這裡擱了好一陣，這裡沒把你擱下。
  tags: [welcome]
- id: wl-longtime-33
  text: 走得再遠，這個角落一直朝你留著方向。
  tags: [welcome]
- id: wl-longtime-34
  text: 這麼久才回頭，連灰塵這裡都替你擋著。
  tags: [welcome]
- id: wl-longtime-35
  text: 分開的這些時候，你的座位一直溫著。
  tags: [welcome]
- id: wl-longtime-36
  text: 那段沒有你的日子，這裡照樣為你點著。
  tags: [welcome]
- id: wl-longtime-37
  text: 久違歸來，熟悉的味道還在原地等你。
  tags: [welcome]
- id: wl-longtime-38
  text: 你離線了很久，這裡的連線一直沒斷。
  tags: [welcome]
- id: wl-longtime-39
  text: 相隔一大段，回來仍舊嚴絲合縫地對上。
  tags: [welcome]
- id: wl-longtime-40
  text: 這麼多天沒見，這裡把你的樣子記得清清楚楚。
  tags: [welcome]
