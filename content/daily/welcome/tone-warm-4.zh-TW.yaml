# 歡迎鏈 · 溫暖直接（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-61
  text: 門一推開，屋裡的暖就迎上來。
  tags: [welcome]
- id: wl-warm-62
  text: 鞋子擱在門邊，這裡就是你落腳的地方。
  tags: [welcome]
- id: wl-warm-63
  text: 這裡的每個角落，都替你留著呼吸的餘地。
  tags: [welcome]
- id: wl-warm-64
  text: 深夜回來也不怕，這裡的燈守著你。
  tags: [welcome]
- id: wl-warm-65
  text: 你不在的時候，這裡也一直惦著你。
  tags: [welcome]
- id: wl-warm-66
  text: 桌角那盞小燈，是為你亮的。
  tags: [welcome]
- id: wl-warm-67
  text: 卸下鞋、卸下心事，這裡都接得住。
  tags: [welcome]
- id: wl-warm-68
  text: 這裡從不催你，你想坐多久就多久。
  tags: [welcome]
- id: wl-warm-69
  text: 有你在，屋子才算真的活了過來。
  tags: [welcome]
- id: wl-warm-70
  text: 外面颳風下雪，這裡替你擋著。
  tags: [welcome]
- id: wl-warm-71
  text: 窗簾後那一角光，一直替你留著。
  tags: [welcome]
- id: wl-warm-72
  text: 這裡收著你所有沒說出口的話。
  tags: [welcome]
- id: wl-warm-73
  text: 一坐下你就明白，這裡向來只認你。
  tags: [welcome]
- id: wl-warm-74
  text: 難過就難過吧，這裡不會嫌你。
  tags: [welcome]
- id: wl-warm-75
  text: 木頭的暖、被子的軟，都在等你回來。
  tags: [welcome]
- id: wl-warm-76
  text: 這裡的時鐘，只替你一個人走得慢。
  tags: [welcome]
- id: wl-warm-77
  text: 你把外頭的臉摘下來，這裡才看得見真的你。
  tags: [welcome]
- id: wl-warm-78
  text: 每一次推門的聲音，這裡都聽得出是你。
  tags: [welcome]
- id: wl-warm-79
  text: 這裡像一雙手，穩穩托著疲累的你。
  tags: [welcome]
- id: wl-warm-80
  text: 放下背包的那一刻，你就到家了。
  tags: [welcome]
