# 歡迎鏈 · 久違回來。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-longtime-01
  text: 好久不見，位子還是你走時的樣子。
  tags: [welcome]
- id: wl-longtime-02
  text: 想你了，你終於回來了。
  tags: [welcome]
- id: wl-longtime-03
  text: 時間替你留著這裡，一分都沒少。
  tags: [welcome]
- id: wl-longtime-04
  text: 隔了這麼久，接上就好，不用從頭。
  tags: [welcome]
- id: wl-longtime-05
  text: 這裡一直在等，哪裡也沒去。
  tags: [welcome]
- id: wl-longtime-06
  text: 你離開的那些日子，這個空間都幫你收著。
  tags: [welcome]
- id: wl-longtime-07
  text: 桌上的東西沒動過，就等你回來。
  tags: [welcome]
- id: wl-longtime-08
  text: 再遠的路，這裡都在原地。
  tags: [welcome]
- id: wl-longtime-09
  text: 你不在的時候，燈也沒關過。
  tags: [welcome]
- id: wl-longtime-10
  text: 久違了，像什麼都沒變過一樣坐下吧。
  tags: [welcome]
- id: wl-longtime-11
  text: 這麼久沒來，這裡也沒把你忘了。
  tags: [welcome]
- id: wl-longtime-12
  text: 你的角落一直空著，剛好等你填回來。
  tags: [welcome]
- id: wl-longtime-13
  text: 回來的路你記得，這裡也記得你。
  tags: [welcome]
- id: wl-longtime-14
  text: 隔了好一段，門還是為你開著。
  tags: [welcome]
- id: wl-longtime-15
  text: 時間過得再快，這裡替你按了暫停。
  tags: [welcome]
- id: wl-longtime-16
  text: 從你離開到現在，這裡沒有一天是冷的。
  tags: [welcome]
- id: wl-longtime-17
  text: 好久沒見的你，還是熟悉的樣子。
  tags: [welcome]
- id: wl-longtime-18
  text: 不管離開多久，接回來只要一瞬間。
  tags: [welcome]
- id: wl-longtime-19
  text: 這裡把你的位置守得好好的。
  tags: [welcome]
- id: wl-longtime-20
  text: 久別之後，你回到的還是原本那個地方。
  tags: [welcome]
