# 歡迎鏈 · 溫暖直接（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-81
  text: 傘還滴著水，你已經站在暖裡了。
  tags: [welcome]
- id: wl-warm-82
  text: 鑰匙轉開的那一聲，是這裡最愛聽的響動。
  tags: [welcome]
- id: wl-warm-83
  text: 玄關的燈，總是先替你亮了一步。
  tags: [welcome]
- id: wl-warm-84
  text: 這裡不必你解釋什麼，坐下它就懂了。
  tags: [welcome]
- id: wl-warm-85
  text: 圍巾一解下來，寒意就被關在門外了。
  tags: [welcome]
- id: wl-warm-86
  text: 泡好的茶剛好燙嘴，等的就是你這一口。
  tags: [welcome]
- id: wl-warm-87
  text: 窗台上的貓抬了頭，是牠也認得你。
  tags: [welcome]
- id: wl-warm-88
  text: 屋裡的鐘擺，慢慢替你數著回家的分秒。
  tags: [welcome]
- id: wl-warm-89
  text: 手一搭上門把，緊繃就先鬆了一半。
  tags: [welcome]
- id: wl-warm-90
  text: 屋角那株植物，替你多曬了一整天的太陽。
  tags: [welcome]
- id: wl-warm-91
  text: 掛在架上的外套，等著替你接下一身疲累。
  tags: [welcome]
- id: wl-warm-92
  text: 廚房飄來的香，是這裡替你守著的煙火氣。
  tags: [welcome]
- id: wl-warm-93
  text: 踏上這塊地毯，腳步就不必再逞強。
  tags: [welcome]
- id: wl-warm-94
  text: 沿路的燈一盞盞暗了，這一盞偏偏替你留著。
  tags: [welcome]
- id: wl-warm-95
  text: 抽屜裡那些小物，都還照你排的順序躺著。
  tags: [welcome]
- id: wl-warm-96
  text: 靠墊拍鬆了，就等你把身子整個交出去。
  tags: [welcome]
- id: wl-warm-97
  text: 落地窗外天黑透了，屋裡的光剛剛好。
  tags: [welcome]
- id: wl-warm-98
  text: 一進門，白天憋著的那口氣才敢吐出來。
  tags: [welcome]
- id: wl-warm-99
  text: 這裡把你的那些怪癖，都當成理所當然。
  tags: [welcome]
- id: wl-warm-100
  text: 卸下今天的角色，剩下那個你這裡最疼。
  tags: [welcome]
