# 歡迎鏈 · 每天一句歡迎。給人「回家」的感覺：安靜、不催、一直都在。
- id: wl-home-01
  text: 歡迎回來，這裡一直為你留著。
  tags: [welcome]
- id: wl-home-02
  text: 你回來了，這裡也還在原地。
  tags: [welcome]
- id: wl-home-03
  text: 慢慢來，這個地方不趕你。
  tags: [welcome]
- id: wl-home-04
  text: 今天也謝謝你，願意回來看看它。
  tags: [welcome]
- id: wl-home-05
  text: 這個角落，一直都是你的。
  tags: [welcome]
- id: wl-home-06
  text: 不管過多久，門都替你開著。
  tags: [welcome]
- id: wl-home-07
  text: 回來就好，什麼都不用急著做。
  tags: [welcome]
- id: wl-home-08
  text: 這裡沒有進度，只有你想待多久。
  tags: [welcome]
- id: wl-home-09
  text: 又見面了，坐一下，喘口氣。
  tags: [welcome]
- id: wl-home-10
  text: 你離開的時候，它就安安靜靜地等。
  tags: [welcome]
- id: wl-home-11
  text: 歡迎回到只屬於你的地方。
  tags: [welcome]
- id: wl-home-12
  text: 這裡記得你，也記得你放進來的每一樣。
  tags: [welcome]
- id: wl-home-13
  text: 今天回來，什麼心情都可以帶進來。
  tags: [welcome]
- id: wl-home-14
  text: 不必打招呼，這裡本來就有你的位置。
  tags: [welcome]
- id: wl-home-15
  text: 你來了，這一天就多了一個安靜的角落。
  tags: [welcome]
- id: wl-home-16
  text: 回來得好，這裡一切如常。
  tags: [welcome]
- id: wl-home-17
  text: 想來就來，想走也行，它都不會不見。
  tags: [welcome]
- id: wl-home-18
  text: 這裡一直在，等你想起它的時候。
  tags: [welcome]
- id: wl-home-19
  text: 歡迎回來，慢慢把今天過成你的。
  tags: [welcome]
- id: wl-home-20
  text: 你回來的每一次，這裡都記得。
  tags: [welcome]
