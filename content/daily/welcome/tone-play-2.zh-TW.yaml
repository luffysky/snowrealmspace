# 歡迎鏈 · 俏皮輕鬆（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-play-21
  text: 門鈴還沒響，我就聞到是你的腳步聲。
  tags: [welcome]
- id: wl-play-22
  text: 今天的頭號嘉賓報到，掌聲省下來給自己。
  tags: [welcome]
- id: wl-play-23
  text: 剛剛的空氣有點無聊，你一來就活過來了。
  tags: [welcome]
- id: wl-play-24
  text: 別客氣，這地方本來就是照你脾氣長大的。
  tags: [welcome]
- id: wl-play-25
  text: 你不知道吧，剛才時鐘走得特別慢，就為了等你。
  tags: [welcome]
- id: wl-play-26
  text: 我一整天都在排練這句歡迎，總算派上用場。
  tags: [welcome]
- id: wl-play-27
  text: 你踏進來的那一步，正好踩在我準備好的節拍上。
  tags: [welcome]
- id: wl-play-28
  text: 恭喜你解鎖今日限定入口，人數上限一位。
  tags: [welcome]
- id: wl-play-29
  text: 我剛把煩惱掃到門後，這下地方全空給你了。
  tags: [welcome]
- id: wl-play-30
  text: 你來的時機真準，我這邊零秒完成接人準備。
  tags: [welcome]
- id: wl-play-31
  text: 這裡剛剛還在打瞌睡，聽見是你就精神抖擻。
  tags: [welcome]
- id: wl-play-32
  text: 別看我沒說話，剛才可是一直豎著耳朵聽門。
  tags: [welcome]
- id: wl-play-33
  text: 你回來這件事，是我今天排程裡最期待的一項。
  tags: [welcome]
- id: wl-play-34
  text: 我把最舒服的那束光偷偷留給你，別聲張。
  tags: [welcome]
- id: wl-play-35
  text: 世界很吵，這扇門後面只播你喜歡的頻率。
  tags: [welcome]
- id: wl-play-36
  text: 你一坐下，我就知道今天可以正式開場了。
  tags: [welcome]
- id: wl-play-37
  text: 剛才我還在數天花板的格子，你來得正是時候。
  tags: [welcome]
- id: wl-play-38
  text: 這裡的規矩只有一條，就是照你舒服的來。
  tags: [welcome]
- id: wl-play-39
  text: 你進來的瞬間，我把「營業中」的牌子翻正了。
  tags: [welcome]
- id: wl-play-40
  text: 別懷疑，這整片安靜都是專門為你留的場。
  tags: [welcome]
