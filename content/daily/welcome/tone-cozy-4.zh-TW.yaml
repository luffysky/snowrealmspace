# 歡迎鏈 · 溫馨居家（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-61
  text: 一推開門，屋裡那股熟悉的木頭味先迎了上來。
  tags: [welcome]
- id: wl-cozy-62
  text: 簷下的風鈴叮了一聲，像替你報了平安。
  tags: [welcome]
- id: wl-cozy-63
  text: 電視關著，屋裡只剩檯燈和你，靜靜地待著。
  tags: [welcome]
- id: wl-cozy-64
  text: 熱水瓶按著保溫，紅燈一直亮著等你倒一杯。
  tags: [welcome]
- id: wl-cozy-65
  text: 廚房的砂鍋還蓋著蓋，掀開就是一碗溫熱。
  tags: [welcome]
- id: wl-cozy-66
  text: 掛鉤上空著一格，那是留給你外套的位置。
  tags: [welcome]
- id: wl-cozy-67
  text: 窗外天色暗了，屋裡的燈把影子拉得長長軟軟的。
  tags: [welcome]
- id: wl-cozy-68
  text: 床邊的絨拖鞋擺得整整齊齊，鞋頭朝著你。
  tags: [welcome]
- id: wl-cozy-69
  text: 抽屜裡那件穿舊的家居服，洗得軟軟的等你換上。
  tags: [welcome]
- id: wl-cozy-70
  text: 陽台曬的橘子皮飄著淡香，屋裡一整晚都清爽。
  tags: [welcome]
- id: wl-cozy-71
  text: 電鍋跳到保溫了，白飯的熱氣還在鍋蓋上凝著。
  tags: [welcome]
- id: wl-cozy-72
  text: 沙發旁的落地燈調成暖黃，剛好照著你翻書。
  tags: [welcome]
- id: wl-cozy-73
  text: 屋角的加濕器噴著細霧，空氣潤潤的很舒服。
  tags: [welcome]
- id: wl-cozy-74
  text: 玄關踏墊剛換過，踩上去乾爽，把外頭的濕氣都擋住。
  tags: [welcome]
- id: wl-cozy-75
  text: 茶壺墊上溫著一壺熱水，隨時替你續一杯。
  tags: [welcome]
- id: wl-cozy-76
  text: 臥室的窗簾是厚厚的絨布，把夜色和寒意都攔在外面。
  tags: [welcome]
- id: wl-cozy-77
  text: 餐桌邊的椅子早拉開了，坐墊也墊得軟軟的。
  tags: [welcome]
- id: wl-cozy-78
  text: 屋裡一盞夜燈徹夜沒熄，替你把黑暗守在門外。
  tags: [welcome]
- id: wl-cozy-79
  text: 剛燙好的襯衫掛在門後，還帶著一點蒸氣的暖。
  tags: [welcome]
- id: wl-cozy-80
  text: 灶上小火燉著紅豆湯，甜香一路飄到門口迎你。
  tags: [welcome]
