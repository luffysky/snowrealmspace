# 歡迎鏈 · 陪伴式（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-companion-21
  text: 門一推開，熟悉的味道就迎上來了。
  tags: [welcome]
- id: wl-companion-22
  text: 這裡認得你，你不必多做解釋。
  tags: [welcome]
- id: wl-companion-23
  text: 你什麼都不用帶，空手回來就好。
  tags: [welcome]
- id: wl-companion-24
  text: 在這裡，做回自己就好，不用扮演誰。
  tags: [welcome]
- id: wl-companion-25
  text: 時間走到這裡會放慢，我陪你一起慢。
  tags: [welcome]
- id: wl-companion-26
  text: 想說話我聽著，不想說話我也在旁邊。
  tags: [welcome]
- id: wl-companion-27
  text: 這方寸之地，記得你的模樣。
  tags: [welcome]
- id: wl-companion-28
  text: 卸下的東西，先擱在門邊也沒關係。
  tags: [welcome]
- id: wl-companion-29
  text: 我們就這樣待著，什麼都不做也很好。
  tags: [welcome]
- id: wl-companion-30
  text: 你留下的痕跡都還在，這裡因你而完整。
  tags: [welcome]
- id: wl-companion-31
  text: 每一盞燈的位置，都是照你習慣擺的。
  tags: [welcome]
- id: wl-companion-32
  text: 疲憊也可以帶進來，我不會嫌。
  tags: [welcome]
- id: wl-companion-33
  text: 這裡的空氣，一直替你留著一份溫度。
  tags: [welcome]
- id: wl-companion-34
  text: 回到這裡，你就不必再撐著了。
  tags: [welcome]
- id: wl-companion-35
  text: 靠著坐一會兒吧，外面的事我替你擋著。
  tags: [welcome]
- id: wl-companion-36
  text: 這裡不看你做了什麼，只在乎你回來了。
  tags: [welcome]
- id: wl-companion-37
  text: 你的名字，這個空間一直都記得。
  tags: [welcome]
- id: wl-companion-38
  text: 想待多久就待多久，我沒有別的地方要去。
  tags: [welcome]
- id: wl-companion-39
  text: 這扇門後面，永遠有你的一席之地。
  tags: [welcome]
- id: wl-companion-40
  text: 你一回來，這裡才算真正亮了起來。
  tags: [welcome]
