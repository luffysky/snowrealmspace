# 歡迎鏈 · 老友般。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-01
  text: 好久不見，位子還幫你留著呢。
  tags: [welcome]
- id: wl-buddy-02
  text: 來啦，就知道你今天會出現。
  tags: [welcome]
- id: wl-buddy-03
  text: 欸，不用脫鞋不用客套，進來坐就對了。
  tags: [welcome]
- id: wl-buddy-04
  text: 你來的時間，跟我猜的差不多。
  tags: [welcome]
- id: wl-buddy-05
  text: 這扇門對你從來不用敲，推開就是。
  tags: [welcome]
- id: wl-buddy-06
  text: 老樣子，我這邊什麼都沒變，等你回來聊。
  tags: [welcome]
- id: wl-buddy-07
  text: 看到你就想起以前那些沒營養的閒話。
  tags: [welcome]
- id: wl-buddy-08
  text: 隨便找個地方癱著，這裡沒外人。
  tags: [welcome]
- id: wl-buddy-09
  text: 去了哪不用解釋，回來就好。
  tags: [welcome]
- id: wl-buddy-10
  text: 我懂你那個表情，累了對吧，坐著喘口氣。
  tags: [welcome]
- id: wl-buddy-11
  text: 話不用多說，我大概也猜得到。
  tags: [welcome]
- id: wl-buddy-12
  text: 你這人啊，總算捨得回來這一趟。
  tags: [welcome]
- id: wl-buddy-13
  text: 燈我一直沒關，就等你哪天推門進來。
  tags: [welcome]
- id: wl-buddy-14
  text: 熟門熟路的，冰箱在哪你比我還清楚。
  tags: [welcome]
- id: wl-buddy-15
  text: 剛好想到你，你就來了，真巧。
  tags: [welcome]
- id: wl-buddy-16
  text: 不必報備行蹤，這裡永遠有你一份。
  tags: [welcome]
- id: wl-buddy-17
  text: 那些客氣的話就免了，我們之間用不上。
  tags: [welcome]
- id: wl-buddy-18
  text: 你走的時候什麼樣，回來還是什麼樣，我不介意。
  tags: [welcome]
- id: wl-buddy-19
  text: 坐吧，茶我隨手就泡，聊到多晚都行。
  tags: [welcome]
- id: wl-buddy-20
  text: 這麼久沒來，我這張老臉還是替你留著笑。
  tags: [welcome]
