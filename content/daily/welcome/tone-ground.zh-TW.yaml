# 歡迎鏈 · 踏實安定。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-ground-01
  text: 這裡不會變，你隨時回來都找得到它。
  tags: [welcome]
- id: wl-ground-02
  text: 地基還在，風雨都被擋在外面了。
  tags: [welcome]
- id: wl-ground-03
  text: 門一直開著，燈也一直為你亮著。
  tags: [welcome]
- id: wl-ground-04
  text: 有我在，這個角落穩穩地屬於你。
  tags: [welcome]
- id: wl-ground-05
  text: 外面再吵，這裡永遠是安靜的。
  tags: [welcome]
- id: wl-ground-06
  text: 你放在這裡的東西，都好好地待著。
  tags: [welcome]
- id: wl-ground-07
  text: 這是你的地方，沒有人能把它拿走。
  tags: [welcome]
- id: wl-ground-08
  text: 落腳吧，這裡的地板一直是實的。
  tags: [welcome]
- id: wl-ground-09
  text: 時間在外面跑，這裡替你留了原樣。
  tags: [welcome]
- id: wl-ground-10
  text: 你離開多久都無所謂，位子一直空著等你。
  tags: [welcome]
- id: wl-ground-11
  text: 這裡的牆很厚，把喧囂都隔在門外。
  tags: [welcome]
- id: wl-ground-12
  text: 無論外頭發生什麼，這裡都不動如常。
  tags: [welcome]
- id: wl-ground-13
  text: 把重的東西先放下，這裡撐得住。
  tags: [welcome]
- id: wl-ground-14
  text: 這是一塊不會塌的地，站上來就安穩了。
  tags: [welcome]
- id: wl-ground-15
  text: 天黑了也不怕，這裡的燈由我看著。
  tags: [welcome]
- id: wl-ground-16
  text: 你熟悉的一切都在原位，沒有跑掉。
  tags: [welcome]
- id: wl-ground-17
  text: 這裡替你記得你是誰，不會忘。
  tags: [welcome]
- id: wl-ground-18
  text: 風雨是外面的事，屋簷下有你的一席。
  tags: [welcome]
- id: wl-ground-19
  text: 這個空間會陪你變老，一直都在。
  tags: [welcome]
- id: wl-ground-20
  text: 回到這裡，腳步就能踏實下來。
  tags: [welcome]
