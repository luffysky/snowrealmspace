# 歡迎鏈 · 週末放假回來。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-weekend-01
  text: 週末的你回來了，什麼都可以慢慢來。
  tags: [welcome]
- id: wl-weekend-02
  text: 睡飽的臉最好看，這裡等你等得很悠哉。
  tags: [welcome]
- id: wl-weekend-03
  text: 這個地方一整個週末都沒動，就靜靜留著你的位子。
  tags: [welcome]
- id: wl-weekend-04
  text: 假日的空氣是軟的，踏進來就自動放鬆一格。
  tags: [welcome]
- id: wl-weekend-05
  text: 不趕時間的日子最適合回來坐坐，隨你想待多久。
  tags: [welcome]
- id: wl-weekend-06
  text: 陽光斜斜地照著，這裡替你把節奏調成了最慢。
  tags: [welcome]
- id: wl-weekend-07
  text: 放假的你，連腳步聲聽起來都輕鬆了一點。
  tags: [welcome]
- id: wl-weekend-08
  text: 這裡沒有鬧鐘，你想賴著就賴著，沒人會催。
  tags: [welcome]
- id: wl-weekend-09
  text: 懶洋洋的午後也好，被窩到中午也好，你回來就好。
  tags: [welcome]
- id: wl-weekend-10
  text: 週末把世界的音量轉小了，剩下你和這片安靜。
  tags: [welcome]
- id: wl-weekend-11
  text: 拖鞋、熱茶、沒有行程，這裡幫你把週末鋪好了。
  tags: [welcome]
- id: wl-weekend-12
  text: 你走進來的時候，這個空間正好也在偷懶。
  tags: [welcome]
- id: wl-weekend-13
  text: 假日的門是半掩著的，推開就是熟悉的味道。
  tags: [welcome]
- id: wl-weekend-14
  text: 這一天屬於你自己，愛做什麼、不做什麼都行。
  tags: [welcome]
- id: wl-weekend-15
  text: 悠閒是今天的主題，這裡陪你一起發呆。
  tags: [welcome]
- id: wl-weekend-16
  text: 週末回來的你，肩膀好像也垮得更舒服了些。
  tags: [welcome]
- id: wl-weekend-17
  text: 沒有非做不可的事，這裡就是這麼一個地方。
  tags: [welcome]
- id: wl-weekend-18
  text: 光是坐下來喘口氣，這個假日就已經很值得了。
  tags: [welcome]
- id: wl-weekend-19
  text: 你把忙碌留在門外了，這裡只剩下慢慢的時間。
  tags: [welcome]
- id: wl-weekend-20
  text: 回來得剛剛好，這裡把最鬆的一角留給了週末的你。
  tags: [welcome]
