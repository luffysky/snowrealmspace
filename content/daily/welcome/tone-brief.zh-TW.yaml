# 歡迎鏈 · 極短一句。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-brief-01
  text: 你回來了，真好。
  tags: [welcome]
- id: wl-brief-02
  text: 位子還熱著。
  tags: [welcome]
- id: wl-brief-03
  text: 燈一直亮著。
  tags: [welcome]
- id: wl-brief-04
  text: 回來啦。
  tags: [welcome]
- id: wl-brief-05
  text: 門為你開著。
  tags: [welcome]
- id: wl-brief-06
  text: 這裡有你的位子。
  tags: [welcome]
- id: wl-brief-07
  text: 今天也在呢。
  tags: [welcome]
- id: wl-brief-08
  text: 慢慢來就好。
  tags: [welcome]
- id: wl-brief-09
  text: 剛好也想著你。
  tags: [welcome]
- id: wl-brief-10
  text: 一切都還在。
  tags: [welcome]
- id: wl-brief-11
  text: 空間記得你。
  tags: [welcome]
- id: wl-brief-12
  text: 我們又見面了。
  tags: [welcome]
- id: wl-brief-13
  text: 熟悉的地方。
  tags: [welcome]
- id: wl-brief-14
  text: 你的角落還在。
  tags: [welcome]
- id: wl-brief-15
  text: 靜靜等著你。
  tags: [welcome]
- id: wl-brief-16
  text: 世界在這放慢。
  tags: [welcome]
- id: wl-brief-17
  text: 這裡認得你。
  tags: [welcome]
- id: wl-brief-18
  text: 腳步聲很熟。
  tags: [welcome]
- id: wl-brief-19
  text: 屬於你的時刻。
  tags: [welcome]
- id: wl-brief-20
  text: 就這樣待著吧。
  tags: [welcome]
