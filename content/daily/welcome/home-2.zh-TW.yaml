# 歡迎鏈補充批次 · 各種語氣（俏皮/安靜/溫暖/鼓勵）。回家的感覺。
- id: wl-home-21
  text: 又來啦，歡迎歡迎。
  tags: [welcome]
- id: wl-home-22
  text: 你回來的樣子，這裡最熟悉。
  tags: [welcome]
- id: wl-home-23
  text: 嗨，把外面的忙先擱在門口。
  tags: [welcome]
- id: wl-home-24
  text: 回來了呀，先坐一下。
  tags: [welcome]
- id: wl-home-25
  text: 這裡沒別人，就你和你的東西。
  tags: [welcome]
- id: wl-home-26
  text: 歡迎回來，今天想從哪開始都行。
  tags: [welcome]
- id: wl-home-27
  text: 你在的時候，這裡才完整。
  tags: [welcome]
- id: wl-home-28
  text: 回家的路，永遠替你留著。
  tags: [welcome]
- id: wl-home-29
  text: 嗨，好久不見也沒關係。
  tags: [welcome]
- id: wl-home-30
  text: 這一方角落，一直是你的形狀。
  tags: [welcome]
- id: wl-home-31
  text: 歡迎回來，深呼吸，到家了。
  tags: [welcome]
- id: wl-home-32
  text: 你來，這裡就亮了一點。
  tags: [welcome]
- id: wl-home-33
  text: 慢慢逛，這裡不趕時間。
  tags: [welcome]
- id: wl-home-34
  text: 回來就好，其他都不急。
  tags: [welcome]
- id: wl-home-35
  text: 嗨，今天也謝謝你想起這裡。
  tags: [welcome]
- id: wl-home-36
  text: 這裡收著你的痕跡，等你回味。
  tags: [welcome]
- id: wl-home-37
  text: 歡迎回來，把今天輕輕放下。
  tags: [welcome]
- id: wl-home-38
  text: 你回來的每一次，都算數。
  tags: [welcome]
- id: wl-home-39
  text: 嗨，這裡一直是安靜的那個。
  tags: [welcome]
- id: wl-home-40
  text: 回來了，先什麼都不用做。
  tags: [welcome]
