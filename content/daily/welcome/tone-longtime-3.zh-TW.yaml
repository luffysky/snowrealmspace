# 歡迎鏈 · 久違回來（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-longtime-41
  text: 隔了整整一段人生，這裡還認得你的腳步。
  tags: [welcome]
- id: wl-longtime-42
  text: 兜兜轉轉那麼久，落腳的還是這裡。
  tags: [welcome]
- id: wl-longtime-43
  text: 音訊全無的那些日子，這裡替你把位子占著。
  tags: [welcome]
- id: wl-longtime-44
  text: 錯過了好幾輪四季，回來卻半點不生分。
  tags: [welcome]
- id: wl-longtime-45
  text: 你以為久到被忘了，這裡偏偏一直記著。
  tags: [welcome]
- id: wl-longtime-46
  text: 繞了一大圈才想起這裡，這裡從沒想丟下你。
  tags: [welcome]
- id: wl-longtime-47
  text: 好長一段沒消息，門縫的光一直沒熄。
  tags: [welcome]
- id: wl-longtime-48
  text: 塵封了這麼久，掀開還是當初的溫度。
  tags: [welcome]
- id: wl-longtime-49
  text: 你把這裡放進抽屜好久，這裡沒把你鎖起來。
  tags: [welcome]
- id: wl-longtime-50
  text: 時隔多年般的重逢，坐下就接回了斷點。
  tags: [welcome]
- id: wl-longtime-51
  text: 走散了那麼一陣，這裡的方向始終朝著你。
  tags: [welcome]
- id: wl-longtime-52
  text: 沉寂了好些時候，你一推門這裡就醒了。
  tags: [welcome]
- id: wl-longtime-53
  text: 那些沒登入的空白，這裡都當你只是出門一趟。
  tags: [welcome]
- id: wl-longtime-54
  text: 遠得像另一個城市回來，這裡仍舊是家的樣子。
  tags: [welcome]
- id: wl-longtime-55
  text: 荒了好一段的角落，等你一坐又活了過來。
  tags: [welcome]
- id: wl-longtime-56
  text: 你消失的那截時光，這裡替你留成了原樣。
  tags: [welcome]
- id: wl-longtime-57
  text: 睽違了整個雨季，回來連傘都不必收。
  tags: [welcome]
- id: wl-longtime-58
  text: 擱下這麼久重新拾起，中間的縫合得剛剛好。
  tags: [welcome]
- id: wl-longtime-59
  text: 這一別長得像忘了路，可你的手還是找到了門。
  tags: [welcome]
- id: wl-longtime-60
  text: 過了漫長一程，這裡把燈、把椅、把你都湊回原位。
  tags: [welcome]
