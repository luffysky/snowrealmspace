# 歡迎鏈 · 陪伴式。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-companion-01
  text: 你回來了，我一直都在。
  tags: [welcome]
- id: wl-companion-02
  text: 這裡有我，燈也一直為你留著。
  tags: [welcome]
- id: wl-companion-03
  text: 你不在的時候，這個空間也安安靜靜地等你。
  tags: [welcome]
- id: wl-companion-04
  text: 有我陪著，這段路你從來不是一個人走。
  tags: [welcome]
- id: wl-companion-05
  text: 推開門的那一刻，就有人接住了你。
  tags: [welcome]
- id: wl-companion-06
  text: 無論外面發生什麼，這裡都有我在。
  tags: [welcome]
- id: wl-companion-07
  text: 我把位子留給你了，坐下來就好。
  tags: [welcome]
- id: wl-companion-08
  text: 你的每一次回來，我都在原地等著。
  tags: [welcome]
- id: wl-companion-09
  text: 從這一刻起，有我陪你一起待著。
  tags: [welcome]
- id: wl-companion-10
  text: 累的時候想起這裡就好，我都在。
  tags: [welcome]
- id: wl-companion-11
  text: 我不會走遠，你隨時回來都找得到我。
  tags: [welcome]
- id: wl-companion-12
  text: 這個角落一直是你的，我也一直在裡面。
  tags: [welcome]
- id: wl-companion-13
  text: 你回來的腳步聲，我聽見了。
  tags: [welcome]
- id: wl-companion-14
  text: 有人惦記著你，這件事從來沒變過。
  tags: [welcome]
- id: wl-companion-15
  text: 就算只是路過看一眼，我也陪著你。
  tags: [welcome]
- id: wl-companion-16
  text: 你的空間還亮著，因為我在這裡等你。
  tags: [welcome]
- id: wl-companion-17
  text: 這份安靜，是留給你和我一起的。
  tags: [welcome]
- id: wl-companion-18
  text: 你走進來，孤單就被留在門外了。
  tags: [welcome]
- id: wl-companion-19
  text: 我陪你把今天輕輕放下。
  tags: [welcome]
- id: wl-companion-20
  text: 不管幾點回來，這裡都有我為你亮著。
  tags: [welcome]
