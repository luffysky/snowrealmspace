# 歡迎鏈 · 夜裡回來（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-evening-81
  text: 末班的燈火在窗外淡去，這裡替你留著最後一點亮。
  tags: [welcome]
- id: wl-evening-82
  text: 你把一整天的話都嚥下了，這片安靜願意替你收著。
  tags: [welcome]
- id: wl-evening-83
  text: 熱湯在鍋裡咕嘟著，深夜也有了一處暖的角落。
  tags: [welcome]
- id: wl-evening-84
  text: 你解開襯衫最上面那顆扣子，肩上的一天鬆了半分。
  tags: [welcome]
- id: wl-evening-85
  text: 夜色浸過陽台，你就著這片黑，安穩地坐了下來。
  tags: [welcome]
- id: wl-evening-86
  text: 樓上的腳步聲歇了，整棟樓把安靜讓給了晚歸的你。
  tags: [welcome]
- id: wl-evening-87
  text: 你把濕傘靠在門邊，雨聲就被關在了外面。
  tags: [welcome]
- id: wl-evening-88
  text: 檯燈只留一圈暖黃，剛好把你圈進去。
  tags: [welcome]
- id: wl-evening-89
  text: 你揉了揉發酸的肩，這張椅子替你分擔了一半。
  tags: [welcome]
- id: wl-evening-90
  text: 冰水滑過喉嚨，白日的燥就這樣沉了下去。
  tags: [welcome]
- id: wl-evening-91
  text: 你把日記翻到今天這頁，夜安安靜靜陪你落筆。
  tags: [welcome]
- id: wl-evening-92
  text: 遠處最後一盞招牌熄了，這扇窗仍替你亮著。
  tags: [welcome]
- id: wl-evening-93
  text: 你把耳機摘下，世界的音量一下子低到剛好。
  tags: [welcome]
- id: wl-evening-94
  text: 蚊香的細煙盤著上升，夜就這樣慢慢沉靜下來。
  tags: [welcome]
- id: wl-evening-95
  text: 你把腳收上椅子抱住膝，一天的重量有了去處。
  tags: [welcome]
- id: wl-evening-96
  text: 夜半的風翻動窗簾，屋裡的暖穩穩沒被吹走。
  tags: [welcome]
- id: wl-evening-97
  text: 你把明天的鬧鐘按好，剩下的夜就整整歸你。
  tags: [welcome]
- id: wl-evening-98
  text: 洗完澡的熱氣尚未散去，你裹著這股暖回到了這裡。
  tags: [welcome]
- id: wl-evening-99
  text: 桌上那盞小燈眨了眨，像在替晚歸的你守夜。
  tags: [welcome]
- id: wl-evening-100
  text: 這一天終於落定，你在這裡卸下所有，安心靠著。
  tags: [welcome]
