# 歡迎鏈 · 溫馨居家（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-21
  text: 鑰匙轉開的那聲喀噠，屋裡就鬆了一口氣。
  tags: [welcome]
- id: wl-cozy-22
  text: 曬了一天的棉被收進來，還留著陽光的味道。
  tags: [welcome]
- id: wl-cozy-23
  text: 木地板踩上去嘎吱一聲，是它認得你的腳步。
  tags: [welcome]
- id: wl-cozy-24
  text: 窗外開始下雨，屋簷把聲音接得很溫柔。
  tags: [welcome]
- id: wl-cozy-25
  text: 爐上的湯咕嘟咕嘟，慢慢熬著等你回來。
  tags: [welcome]
- id: wl-cozy-26
  text: 書桌那盞燈留了一圈黃光，剛好照到你的位置。
  tags: [welcome]
- id: wl-cozy-27
  text: 陽台的花今早開了一朵，正對著你進門的方向。
  tags: [welcome]
- id: wl-cozy-28
  text: 洗好的衣服疊得整齊，一件件都是你熟悉的觸感。
  tags: [welcome]
- id: wl-cozy-29
  text: 牆上的時鐘滴答著，把屋裡的安靜襯得更厚。
  tags: [welcome]
- id: wl-cozy-30
  text: 門口那雙靴子擦乾淨了，泥都留在外頭。
  tags: [welcome]
- id: wl-cozy-31
  text: 廚房的窗開了條縫，晚風把飯香輕輕捲進來。
  tags: [welcome]
- id: wl-cozy-32
  text: 書架上那本翻到一半的書，還夾著你放的葉子。
  tags: [welcome]
- id: wl-cozy-33
  text: 暖氣悄悄運轉，屋裡的空氣是剛剛好的溫度。
  tags: [welcome]
- id: wl-cozy-34
  text: 餐桌鋪了乾淨的桌布，中間擺著你喜歡的那盤。
  tags: [welcome]
- id: wl-cozy-35
  text: 走進來會經過那面舊鏡子，它一直記得你的樣子。
  tags: [welcome]
- id: wl-cozy-36
  text: 樓梯口的小燈亮著，一階一階替你把路照亮。
  tags: [welcome]
- id: wl-cozy-37
  text: 陽光斜斜落在木桌上，塵埃在光裡慢慢飄。
  tags: [welcome]
- id: wl-cozy-38
  text: 水龍頭的水放到溫了，洗把臉正好卸下一天。
  tags: [welcome]
- id: wl-cozy-39
  text: 收音機轉著低低的音樂，屋裡有人聲就不空了。
  tags: [welcome]
- id: wl-cozy-40
  text: 窗邊的搖椅慢慢晃著，像在替你留一個位置。
  tags: [welcome]
