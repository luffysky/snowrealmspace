# 歡迎鏈 · 溫馨居家（第六批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-101
  text: 一進門就聞到爐上烤地瓜的甜，外皮都焦得流蜜了。
  tags: [welcome]
- id: wl-cozy-102
  text: 蒸籠掀開一角，白胖的包子正冒著熱氣等你。
  tags: [welcome]
- id: wl-cozy-103
  text: 陶壺在小炭爐上煨著茶，咕嘟一聲又一聲。
  tags: [welcome]
- id: wl-cozy-104
  text: 窗台上一隻麻雀縮著取暖，屋裡屋外都不趕牠。
  tags: [welcome]
- id: wl-cozy-105
  text: 竹編的籃子裡堆著剛洗的橘子，隨手就能拿一顆。
  tags: [welcome]
- id: wl-cozy-106
  text: 牆上那張舊相框歪了一點，裡頭的笑還是老樣子。
  tags: [welcome]
- id: wl-cozy-107
  text: 針線盒攤在桌上，那件毛衣的破口早替你補好了。
  tags: [welcome]
- id: wl-cozy-108
  text: 木梳擺在床頭，梳齒上還纏著你昨夜落下的髮。
  tags: [welcome]
- id: wl-cozy-109
  text: 熱毛巾在盆裡捲得緊緊的，敷上臉一整天就化開。
  tags: [welcome]
- id: wl-cozy-110
  text: 保溫杯灌滿了溫水，杯身摸起來剛好不燙手。
  tags: [welcome]
- id: wl-cozy-111
  text: 電暖器亮著橘紅的絲，把腳邊那一圈空氣先焙暖了。
  tags: [welcome]
- id: wl-cozy-112
  text: 烘被機鑽進被裡忙了半天，掀開全是蓬鬆的暖。
  tags: [welcome]
- id: wl-cozy-113
  text: 信箱裡沒有半張帳單，只擱著一封寫你名字的。
  tags: [welcome]
- id: wl-cozy-114
  text: 桌曆翻到今天，格子裡被人悄悄畫了個小記號。
  tags: [welcome]
- id: wl-cozy-115
  text: 屋簷下掛著一串風乾的柿餅，甜味隨風飄進屋裡。
  tags: [welcome]
- id: wl-cozy-116
  text: 落葉被掃到牆角堆成一小丘，掃帚還斜靠在門邊。
  tags: [welcome]
- id: wl-cozy-117
  text: 紅棗湯盛在粗瓷碗裡溫著，甜香在碗口慢慢打轉。
  tags: [welcome]
- id: wl-cozy-118
  text: 老掛鐘剛上過鏈，滴答聲把屋裡的靜穩穩托著。
  tags: [welcome]
- id: wl-cozy-119
  text: 藤椅鋪上了厚坐墊，靠背的角度剛好接住你的懶。
  tags: [welcome]
- id: wl-cozy-120
  text: 被爐底下暖烘烘的，腿一伸進去就不想再抽出來。
  tags: [welcome]
