# 歡迎鏈 · 老友般（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-81
  text: 喂，燈我還亮著，你這時間點掐得剛好。
  tags: [welcome]
- id: wl-buddy-82
  text: 桌邊那張椅子我沒收，一直斜著等你來坐。
  tags: [welcome]
- id: wl-buddy-83
  text: 這鬼天氣把你吹成這樣，先進來擋一擋。
  tags: [welcome]
- id: wl-buddy-84
  text: 不用你開口，那張臉寫著累，坐吧。
  tags: [welcome]
- id: wl-buddy-85
  text: 茶葉還是你上次挑剩那罐，我留著沒動。
  tags: [welcome]
- id: wl-buddy-86
  text: 別跟我拘謹，你的杯子還擺老位置。
  tags: [welcome]
- id: wl-buddy-87
  text: 一看你走進來我就把手邊的事擱下了。
  tags: [welcome]
- id: wl-buddy-88
  text: 好一陣子沒鬥嘴了，我這嘴都閒生鏽了，坐下陪我磨牙。
  tags: [welcome]
- id: wl-buddy-89
  text: 有什麼爛脾氣都朝我卸，擺這就行。
  tags: [welcome]
- id: wl-buddy-90
  text: 剛把手機掏出來想找你，你人先站門口了。
  tags: [welcome]
- id: wl-buddy-91
  text: 外套丟哪都行，這裡沒人替你檢查儀容。
  tags: [welcome]
- id: wl-buddy-92
  text: 冰櫃裡冰著你上回沒喝完的那手啤酒。
  tags: [welcome]
- id: wl-buddy-93
  text: 那副老花鏡你落在這，我擦乾淨收抽屜了。
  tags: [welcome]
- id: wl-buddy-94
  text: 進來就別提外頭那些煩心事，門一關全數作廢。
  tags: [welcome]
- id: wl-buddy-95
  text: 唱片機還擺著你愛的那張，針一放又是那首。
  tags: [welcome]
- id: wl-buddy-96
  text: 想發呆就發，想倒垃圾話就倒，我這都接。
  tags: [welcome]
- id: wl-buddy-97
  text: 才一坐下你整個人就塌了，看來今天真夠嗆。
  tags: [welcome]
- id: wl-buddy-98
  text: 裡頭有你的杯、有你的位，別老杵在門邊。
  tags: [welcome]
- id: wl-buddy-99
  text: 咱這交情不用暖場，坐下就能接上上回那句。
  tags: [welcome]
- id: wl-buddy-100
  text: 人到了我就踏實，別的話擺後頭慢慢說。
  tags: [welcome]
