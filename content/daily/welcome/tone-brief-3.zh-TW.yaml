# 歡迎鏈 · 極短一句（第三批）。回家的感覺。繁體中文，每一則獨一無二。每句 8 字以內。
- id: wl-brief-41
  text: 火爐正旺。
  tags: [welcome]
- id: wl-brief-42
  text: 別急，坐下。
  tags: [welcome]
- id: wl-brief-43
  text: 影子都熟了。
  tags: [welcome]
- id: wl-brief-44
  text: 風替你掩門。
  tags: [welcome]
- id: wl-brief-45
  text: 桌上留了碗。
  tags: [welcome]
- id: wl-brief-46
  text: 抱枕還軟著。
  tags: [welcome]
- id: wl-brief-47
  text: 鐘擺慢半拍。
  tags: [welcome]
- id: wl-brief-48
  text: 被褥曬過了。
  tags: [welcome]
- id: wl-brief-49
  text: 貓也在等你。
  tags: [welcome]
- id: wl-brief-50
  text: 舊椅陪著你。
  tags: [welcome]
- id: wl-brief-51
  text: 簾子透著光。
  tags: [welcome]
- id: wl-brief-52
  text: 拖鞋在門口。
  tags: [welcome]
- id: wl-brief-53
  text: 屋簷替你遮。
  tags: [welcome]
- id: wl-brief-54
  text: 呼吸放慢些。
  tags: [welcome]
- id: wl-brief-55
  text: 心跳也緩了。
  tags: [welcome]
- id: wl-brief-56
  text: 港灣暖著。
  tags: [welcome]
- id: wl-brief-57
  text: 卸甲歸來。
  tags: [welcome]
- id: wl-brief-58
  text: 泡杯熱的。
  tags: [welcome]
- id: wl-brief-59
  text: 星光照著路。
  tags: [welcome]
- id: wl-brief-60
  text: 歸處就在此。
  tags: [welcome]
