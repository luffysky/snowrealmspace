# 歡迎鏈 · 陪伴式（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-companion-81
  text: 這裡替你把外頭的世界調成了靜音。
  tags: [welcome]
- id: wl-companion-82
  text: 儘管在這裡老老實實地累，沒人盯著你。
  tags: [welcome]
- id: wl-companion-83
  text: 我陪你一塊兒發呆，正事一件都不用談。
  tags: [welcome]
- id: wl-companion-84
  text: 這張椅子還記得你坐下去的重量。
  tags: [welcome]
- id: wl-companion-85
  text: 累了就把整個人的重量交過來，我托得住。
  tags: [welcome]
- id: wl-companion-86
  text: 摘下的面具就擱在桌上，這裡不用你戴著。
  tags: [welcome]
- id: wl-companion-87
  text: 你的杯子，我擺回慣用的那一側了。
  tags: [welcome]
- id: wl-companion-88
  text: 冷了別硬撐，這裡替你把手心焐熱。
  tags: [welcome]
- id: wl-companion-89
  text: 一呼一吸都有回音陪著，你不算孤單。
  tags: [welcome]
- id: wl-companion-90
  text: 燈芯替你留著一小簇火，夜裡不會暗。
  tags: [welcome]
- id: wl-companion-91
  text: 哭也好，笑也好，這裡都有人陪你收場。
  tags: [welcome]
- id: wl-companion-92
  text: 這片屋簷替你把整個天空撐住了。
  tags: [welcome]
- id: wl-companion-93
  text: 你的影子在這裡有伴，不必獨自晃著。
  tags: [welcome]
- id: wl-companion-94
  text: 側過身歇著吧，我這邊的肩膀一直空著。
  tags: [welcome]
- id: wl-companion-95
  text: 這裡不問你今天值不值得，回來就夠了。
  tags: [welcome]
- id: wl-companion-96
  text: 你留下的話，這裡都收著，沒漏掉一句。
  tags: [welcome]
- id: wl-companion-97
  text: 把奔了一天的心跳放慢，我陪它一起緩。
  tags: [welcome]
- id: wl-companion-98
  text: 門一關，這裡就只剩你和一份安穩。
  tags: [welcome]
- id: wl-companion-99
  text: 你不必在這裡繃著形象，鬆垮著就好。
  tags: [welcome]
- id: wl-companion-100
  text: 這一方天地是向著你的，你回來就安穩了。
  tags: [welcome]
