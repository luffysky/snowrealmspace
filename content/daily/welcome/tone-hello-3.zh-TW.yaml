# 歡迎鏈 · 招呼式（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-hello-41
  text: 來了來了，門我先幫你留著。
  tags: [welcome]
- id: wl-hello-42
  text: 踏進來吧，這裡的地板記得你的重量。
  tags: [welcome]
- id: wl-hello-43
  text: 一抬眼就撞見你，這時機真剛好。
  tags: [welcome]
- id: wl-hello-44
  text: 燈還溫著，你的位子也沒涼。
  tags: [welcome]
- id: wl-hello-45
  text: 咚咚兩聲，我就知道是你上來了。
  tags: [welcome]
- id: wl-hello-46
  text: 回家了齁，把腳步放慢一點。
  tags: [welcome]
- id: wl-hello-47
  text: 窗邊的光剛好斜進來，配上你正好。
  tags: [welcome]
- id: wl-hello-48
  text: 手邊的事先擱著，你人到了最要緊。
  tags: [welcome]
- id: wl-hello-49
  text: 這個時間點你出現，我一點都不意外。
  tags: [welcome]
- id: wl-hello-50
  text: 進來吧，外頭的喧鬧就留在門外。
  tags: [welcome]
- id: wl-hello-51
  text: 茶杯我擺好兩個了，你這就到。
  tags: [welcome]
- id: wl-hello-52
  text: 熟悉的推門聲，一聽就放心了。
  tags: [welcome]
- id: wl-hello-53
  text: 剛把桌面收乾淨，你就走進來了。
  tags: [welcome]
- id: wl-hello-54
  text: 慢慢上樓沒關係，我在門口守著。
  tags: [welcome]
- id: wl-hello-55
  text: 這裡的空氣認得你，一進門就親近了。
  tags: [welcome]
- id: wl-hello-56
  text: 見到你這張臉，一天就有了著落。
  tags: [welcome]
- id: wl-hello-57
  text: 把鞋子脫了吧，地板暖著呢。
  tags: [welcome]
- id: wl-hello-58
  text: 你這一到，房間裡的燈都亮得更暖了。
  tags: [welcome]
- id: wl-hello-59
  text: 剛好聽見電梯停在這層，果然是你。
  tags: [welcome]
- id: wl-hello-60
  text: 坐吧坐吧，這裡的一切都替你留著。
  tags: [welcome]
