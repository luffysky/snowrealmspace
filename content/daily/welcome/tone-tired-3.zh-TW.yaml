# 歡迎鏈 · 疲憊時回來（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-tired-41
  text: 終於到家了，把一整天卸在門口吧。
  tags: [welcome]
- id: wl-tired-42
  text: 別撐了，這裡的牆會替你頂著。
  tags: [welcome]
- id: wl-tired-43
  text: 眉頭鬆開來，這裡沒有事情等你處理。
  tags: [welcome]
- id: wl-tired-44
  text: 攤成一片也好看，這裡不挑姿勢。
  tags: [welcome]
- id: wl-tired-45
  text: 想癱多久就多久，鐘擺在這裡不催人。
  tags: [welcome]
- id: wl-tired-46
  text: 累到說不出話，也算是一種抵達。
  tags: [welcome]
- id: wl-tired-47
  text: 卸妝卸掉一整天的表情，這裡只留素顏的你。
  tags: [welcome]
- id: wl-tired-48
  text: 腳步拖回來也沒關係，門口一直亮著。
  tags: [welcome]
- id: wl-tired-49
  text: 靠上來吧，這面牆撐過很多個這樣的夜。
  tags: [welcome]
- id: wl-tired-50
  text: 讓思緒空一陣，這裡不會塞新的東西進來。
  tags: [welcome]
- id: wl-tired-51
  text: 掏空了也無妨，這裡不等你補回什麼。
  tags: [welcome]
- id: wl-tired-52
  text: 沉下去吧，這片安靜托得住你。
  tags: [welcome]
- id: wl-tired-53
  text: 一屁股坐下，剩下的姿態隨便你。
  tags: [welcome]
- id: wl-tired-54
  text: 把撐了一天的笑放下，這裡看你哪個樣子都行。
  tags: [welcome]
- id: wl-tired-55
  text: 累得發沉的身體，這張沙發認得。
  tags: [welcome]
- id: wl-tired-56
  text: 鬆手吧，抓了一天的東西可以先掉在地上。
  tags: [welcome]
- id: wl-tired-57
  text: 縮進毯子裡，外頭的冷進不來。
  tags: [welcome]
- id: wl-tired-58
  text: 這裡不驗收你今天做了什麼，坐著就夠了。
  tags: [welcome]
- id: wl-tired-59
  text: 眼皮沉就讓它沉，這裡替你看著門。
  tags: [welcome]
- id: wl-tired-60
  text: 走了一天的路，到這裡就能把腳收起來。
  tags: [welcome]
