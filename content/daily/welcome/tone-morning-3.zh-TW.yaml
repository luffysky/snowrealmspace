# 歡迎鏈 · 早晨回來（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-morning-41
  text: 雲層縫裡漏下第一道亮，剛好落在你進門的地方。
  tags: [welcome]
- id: wl-morning-42
  text: 巷口的貓還在打盹，你已經先醒在這裡了。
  tags: [welcome]
- id: wl-morning-43
  text: 收音機都還沒開，這片安靜就先陪著你。
  tags: [welcome]
- id: wl-morning-44
  text: 昨晚關上的那頁書，攤在原處等你翻回去。
  tags: [welcome]
- id: wl-morning-45
  text: 屋簷還滴著昨夜的雨，你踩進來，一切就乾爽了。
  tags: [welcome]
- id: wl-morning-46
  text: 剛磨好的豆子香氣散開，桌邊那把椅子是你的。
  tags: [welcome]
- id: wl-morning-47
  text: 遠處的鐘敲了一下，把清晨輕輕交到你手上。
  tags: [welcome]
- id: wl-morning-48
  text: 陽台的盆栽伸了個腰，你也剛好推門進來。
  tags: [welcome]
- id: wl-morning-49
  text: 睡意還黏在眼皮上，這裡不催你，慢慢來就好。
  tags: [welcome]
- id: wl-morning-50
  text: 出門的人潮還沒湧起，你先在這兒安穩坐著。
  tags: [welcome]
- id: wl-morning-51
  text: 檯燈不必開了，晨色已經把桌面鋪得溫柔。
  tags: [welcome]
- id: wl-morning-52
  text: 掀開杯蓋，熱氣先你一步醒了過來。
  tags: [welcome]
- id: wl-morning-53
  text: 走廊還帶著昨夜的涼，你一來就有了暖意。
  tags: [welcome]
- id: wl-morning-54
  text: 早班的麻雀在簷下說話，這裡替你留了整片安靜。
  tags: [welcome]
- id: wl-morning-55
  text: 揉了揉眼睛，你就把新的一天看清楚了些。
  tags: [welcome]
- id: wl-morning-56
  text: 拉高窗，讓晨風先進來認你，再慢慢坐下。
  tags: [welcome]
- id: wl-morning-57
  text: 昨天沒寫完的那行字，正靜靜等你續下去。
  tags: [welcome]
- id: wl-morning-58
  text: 太陽才爬過屋脊，這片刻先妥妥地屬於你。
  tags: [welcome]
- id: wl-morning-59
  text: 鞋帶還沒繫緊也沒關係，這裡本來就不趕你。
  tags: [welcome]
- id: wl-morning-60
  text: 晾在窗邊的衣角被風掀動，像在跟剛到的你招手。
  tags: [welcome]
