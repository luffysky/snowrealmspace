# 歡迎鏈 · 安靜溫柔。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-01
  text: 回來了，先坐下，慢慢來。
  tags: [welcome]
- id: wl-quiet-02
  text: 門關上以後，這裡就只剩你和安靜了。
  tags: [welcome]
- id: wl-quiet-03
  text: 把外面的事先擱在門口，晚點再拿都行。
  tags: [welcome]
- id: wl-quiet-04
  text: 今天辛苦了，肩膀可以放下來一點。
  tags: [welcome]
- id: wl-quiet-05
  text: 不必交代什麼，待著就好。
  tags: [welcome]
- id: wl-quiet-06
  text: 這裡的時間走得慢，你也可以慢。
  tags: [welcome]
- id: wl-quiet-07
  text: 深呼吸一次，房間會慢慢暖起來。
  tags: [welcome]
- id: wl-quiet-08
  text: 沒有人在等你做什麼，安心待著。
  tags: [welcome]
- id: wl-quiet-09
  text: 累了就靠著，這裡撐得住你。
  tags: [welcome]
- id: wl-quiet-10
  text: 手機可以先放遠一點，這一刻是你的。
  tags: [welcome]
- id: wl-quiet-11
  text: 泡杯熱的，讓手心先暖過來。
  tags: [welcome]
- id: wl-quiet-12
  text: 什麼都不想，也是一種休息。
  tags: [welcome]
- id: wl-quiet-13
  text: 燈光調得剛好，眼睛可以放鬆了。
  tags: [welcome]
- id: wl-quiet-14
  text: 回到自己這裡，不用再撐著誰。
  tags: [welcome]
- id: wl-quiet-15
  text: 外頭再吵，這扇門裡都是靜的。
  tags: [welcome]
- id: wl-quiet-16
  text: 想發呆就發呆，沒關係的。
  tags: [welcome]
- id: wl-quiet-17
  text: 把心跳的節奏調回自己的速度。
  tags: [welcome]
- id: wl-quiet-18
  text: 這裡很小，剛好夠你安穩地待著。
  tags: [welcome]
- id: wl-quiet-19
  text: 一整天的緊繃，到這裡可以鬆開了。
  tags: [welcome]
- id: wl-quiet-20
  text: 你在的地方就有溫度，晚安前先坐一會。
  tags: [welcome]
