# 歡迎鏈 · 俏皮輕鬆（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-play-41
  text: 你的椅子我剛擦過，就等這一坐。
  tags: [welcome]
- id: wl-play-42
  text: 剛才對著門口練了半天微笑，這下正好派上。
  tags: [welcome]
- id: wl-play-43
  text: 別管外頭什麼天氣，你來就是這裡的好天氣。
  tags: [welcome]
- id: wl-play-44
  text: 桌面我收得清清爽爽，就等你來擺滿。
  tags: [welcome]
- id: wl-play-45
  text: 剛才我還懶洋洋，一認出是你就跳起來了。
  tags: [welcome]
- id: wl-play-46
  text: 這門我開開關關好幾回，就為確認是你的方向。
  tags: [welcome]
- id: wl-play-47
  text: 你一到，我立刻把「請安靜」翻成「歡迎吵鬧」。
  tags: [welcome]
- id: wl-play-48
  text: 剛才那陣風不是白吹的，它替你先來報過信。
  tags: [welcome]
- id: wl-play-49
  text: 你來的路上我就先暖著座位，現在剛剛好。
  tags: [welcome]
- id: wl-play-50
  text: 今天的好心情我全存著，等你進門一次發完。
  tags: [welcome]
- id: wl-play-51
  text: 這裡的鐘剛敲，敲的是「你到了」三個字。
  tags: [welcome]
- id: wl-play-52
  text: 我把窗簾拉開一條縫，讓光先替你探路。
  tags: [welcome]
- id: wl-play-53
  text: 我把地毯的皺摺都撫平了，就怕絆到你的腳。
  tags: [welcome]
- id: wl-play-54
  text: 剛把最軟的那張墊子拍鬆，這位子非你莫屬。
  tags: [welcome]
- id: wl-play-55
  text: 你的名字我在心裡念了整天，這下能大聲喊了。
  tags: [welcome]
- id: wl-play-56
  text: 我把時間表清空一格，專門用來看你走進來。
  tags: [welcome]
- id: wl-play-57
  text: 別急著解釋去哪了，你人在這就是最好的消息。
  tags: [welcome]
- id: wl-play-58
  text: 我早把嘴角掛好，就等你這張臉來對上。
  tags: [welcome]
- id: wl-play-59
  text: 你這一步踏進來，我這邊的倒數正好歸零。
  tags: [welcome]
- id: wl-play-60
  text: 這片燈火我沒關過，它一直守在你回來的路口。
  tags: [welcome]
