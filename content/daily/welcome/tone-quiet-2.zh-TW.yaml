# 歡迎鏈 · 安靜溫柔（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-21
  text: 鞋子脫了，讓腳先歇一歇。
  tags: [welcome]
- id: wl-quiet-22
  text: 話都可以先不說，這裡聽得懂沉默。
  tags: [welcome]
- id: wl-quiet-23
  text: 窗外的聲音會慢慢遠去，你聽你的呼吸就好。
  tags: [welcome]
- id: wl-quiet-24
  text: 把今天輕輕放下，它不會摔壞的。
  tags: [welcome]
- id: wl-quiet-25
  text: 眼睛閉一下也行，這裡會守著你。
  tags: [welcome]
- id: wl-quiet-26
  text: 不趕任何人，也不趕你自己。
  tags: [welcome]
- id: wl-quiet-27
  text: 讓思緒像水一樣，慢慢沉下去。
  tags: [welcome]
- id: wl-quiet-28
  text: 這一刻，沒有誰要你回答什麼。
  tags: [welcome]
- id: wl-quiet-29
  text: 房間記得怎麼安靜，跟著它一起就好。
  tags: [welcome]
- id: wl-quiet-30
  text: 世界暫時調成了靜音，剩下你自己的節拍。
  tags: [welcome]
- id: wl-quiet-31
  text: 把撐了一天的那口氣，悄悄鬆掉。
  tags: [welcome]
- id: wl-quiet-32
  text: 夜色會替你把外頭的事都收起來。
  tags: [welcome]
- id: wl-quiet-33
  text: 什麼都不做也很好，只是待著。
  tags: [welcome]
- id: wl-quiet-34
  text: 攤開手，讓緊握了一天的東西先落下。
  tags: [welcome]
- id: wl-quiet-35
  text: 這裡不催你，時間也願意陪你磨蹭。
  tags: [welcome]
- id: wl-quiet-36
  text: 讓繃了一天的背，找個地方鬆下來。
  tags: [welcome]
- id: wl-quiet-37
  text: 把腦子裡的雜音，一格一格關掉。
  tags: [welcome]
- id: wl-quiet-38
  text: 這裡的安靜不趕人，你想待多久都行。
  tags: [welcome]
- id: wl-quiet-39
  text: 讓緊繃的地方，一處一處自己軟下來。
  tags: [welcome]
- id: wl-quiet-40
  text: 夜還長，先什麼都不想一會也無妨。
  tags: [welcome]
