# 歡迎鏈 · 早晨回來（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-morning-21
  text: 露水還掛在葉尖，你就到了。
  tags: [welcome]
- id: wl-morning-22
  text: 街道尚在沉睡，你先醒在這裡，剛好。
  tags: [welcome]
- id: wl-morning-23
  text: 你拉開窗簾的手，順便把一天也拉開了。
  tags: [welcome]
- id: wl-morning-24
  text: 天邊泛起魚肚白，這裡先替你亮著。
  tags: [welcome]
- id: wl-morning-25
  text: 第一班車尚未出發，你已經有了要去的地方——這裡。
  tags: [welcome]
- id: wl-morning-26
  text: 水壺快燒開了，聲音和你一起到的。
  tags: [welcome]
- id: wl-morning-27
  text: 昨晚疊好的被子，正等你重新把它弄亂。
  tags: [welcome]
- id: wl-morning-28
  text: 你赤腳踩上地板，涼意醒了，你也醒了。
  tags: [welcome]
- id: wl-morning-29
  text: 撕下一頁日曆，新的一格是空白的，隨你填。
  tags: [welcome]
- id: wl-morning-30
  text: 窗開了一條縫，早上的空氣先來認你。
  tags: [welcome]
- id: wl-morning-31
  text: 麵包還在烤箱裡，桌子已經替你擺好了位子。
  tags: [welcome]
- id: wl-morning-32
  text: 你來的時候，霧才剛從河面散開。
  tags: [welcome]
- id: wl-morning-33
  text: 一夜的安靜尚未走遠，留給剛到的你。
  tags: [welcome]
- id: wl-morning-34
  text: 你伸了個懶腰，這個房間也跟著鬆開。
  tags: [welcome]
- id: wl-morning-35
  text: 天光很淡，淡得剛好托住你的睡意。
  tags: [welcome]
- id: wl-morning-36
  text: 你回來了，早晨才捨得把顏色一點點鋪上來。
  tags: [welcome]
- id: wl-morning-37
  text: 昨天的杯子洗好晾著，今天換你來用。
  tags: [welcome]
- id: wl-morning-38
  text: 你進門的腳步，比鬧鐘更輕，也更準。
  tags: [welcome]
- id: wl-morning-39
  text: 這裡的早晨不趕時間，它陪你一起慢。
  tags: [welcome]
- id: wl-morning-40
  text: 你坐下的時候，一整個上午都還是新的。
  tags: [welcome]
