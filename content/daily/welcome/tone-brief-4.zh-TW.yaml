# 歡迎鏈 · 極短一句（第四批）。回家的感覺。繁體中文，每一則獨一無二。每句 8 字以內。
- id: wl-brief-61
  text: 壁爐劈啪響。
  tags: [welcome]
- id: wl-brief-62
  text: 毯子攤好了。
  tags: [welcome]
- id: wl-brief-63
  text: 熱湯正冒煙。
  tags: [welcome]
- id: wl-brief-64
  text: 門縫透著光。
  tags: [welcome]
- id: wl-brief-65
  text: 枕頭在等你。
  tags: [welcome]
- id: wl-brief-66
  text: 木香繞著你。
  tags: [welcome]
- id: wl-brief-67
  text: 燭火替你搖。
  tags: [welcome]
- id: wl-brief-68
  text: 歸巢時分。
  tags: [welcome]
- id: wl-brief-69
  text: 腳步輕下來。
  tags: [welcome]
- id: wl-brief-70
  text: 肩頭鬆了。
  tags: [welcome]
- id: wl-brief-71
  text: 這裡收留你。
  tags: [welcome]
- id: wl-brief-72
  text: 暖意漫上來。
  tags: [welcome]
- id: wl-brief-73
  text: 窩著就好。
  tags: [welcome]
- id: wl-brief-74
  text: 舊夢還在。
  tags: [welcome]
- id: wl-brief-75
  text: 爐邊留了位。
  tags: [welcome]
- id: wl-brief-76
  text: 靠岸了。
  tags: [welcome]
- id: wl-brief-77
  text: 夜燈守著你。
  tags: [welcome]
- id: wl-brief-78
  text: 落地生根。
  tags: [welcome]
- id: wl-brief-79
  text: 屋裡飄著香。
  tags: [welcome]
- id: wl-brief-80
  text: 你到了，安心。
  tags: [welcome]
