# 歡迎鏈 · 老友般（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-61
  text: 喲，稀客，不過在我這你從來不算客。
  tags: [welcome]
- id: wl-buddy-62
  text: 剛泡的那壺還熱著，多一個杯子的事，順手就給你倒。
  tags: [welcome]
- id: wl-buddy-63
  text: 你那口氣一嘆，我就知道今天不好過，坐下講。
  tags: [welcome]
- id: wl-buddy-64
  text: 鞋子亂踢一邊沒關係，反正只有我看見。
  tags: [welcome]
- id: wl-buddy-65
  text: 這麼晚才晃過來，我料到了，飯我沒收。
  tags: [welcome]
- id: wl-buddy-66
  text: 甭裝沒事，你眼神騙得了別人騙不了我。
  tags: [welcome]
- id: wl-buddy-67
  text: 記得你不吃香菜，我剛才特地挑乾淨了。
  tags: [welcome]
- id: wl-buddy-68
  text: 就等你這句廢話開場，我這耳朵閒好久了。
  tags: [welcome]
- id: wl-buddy-69
  text: 你上回借走的傘還我啦，不過人比傘重要，先進來。
  tags: [welcome]
- id: wl-buddy-70
  text: 咱倆坐一塊什麼都不聊，也比外頭熱鬧強。
  tags: [welcome]
- id: wl-buddy-71
  text: 我把電視聲關小了，就怕蓋過你要碎念的那些。
  tags: [welcome]
- id: wl-buddy-72
  text: 你這黑眼圈又深了，別辯，我拿眼睛一掃就懂。
  tags: [welcome]
- id: wl-buddy-73
  text: 冰箱最上層那罐是你的，我一口都沒偷。
  tags: [welcome]
- id: wl-buddy-74
  text: 想賴著不走就賴著，這沙發夜裡歸你。
  tags: [welcome]
- id: wl-buddy-75
  text: 你走後那串鑰匙圈我還掛在門邊，看著就像你沒離開。
  tags: [welcome]
- id: wl-buddy-76
  text: 話講一半哽住也行，我替你把後半句猜完。
  tags: [welcome]
- id: wl-buddy-77
  text: 上回那頓沒吃完的火鍋，我心裡一直記著要補請你。
  tags: [welcome]
- id: wl-buddy-78
  text: 別客氣個沒完，你越見外我越覺得生分。
  tags: [welcome]
- id: wl-buddy-79
  text: 瞧你進門那步子多沉，包先卸了，肩膀鬆一鬆。
  tags: [welcome]
- id: wl-buddy-80
  text: 我這門檻你跨過幾百回了，閉著眼都摸得到位子。
  tags: [welcome]
