# 歡迎鏈 · 招呼式。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-hello-01
  text: 嗨，你來啦。
  tags: [welcome]
- id: wl-hello-02
  text: 哈囉，我看見你了。
  tags: [welcome]
- id: wl-hello-03
  text: 欸，你回來了。
  tags: [welcome]
- id: wl-hello-04
  text: 來了喔，進來坐。
  tags: [welcome]
- id: wl-hello-05
  text: 嘿，等你有一會兒了。
  tags: [welcome]
- id: wl-hello-06
  text: 你來啦，我就在這裡。
  tags: [welcome]
- id: wl-hello-07
  text: 哈囉，正想著你差不多要來了。
  tags: [welcome]
- id: wl-hello-08
  text: 嗨，好久不見也沒關係的。
  tags: [welcome]
- id: wl-hello-09
  text: 欸，是你，太好了。
  tags: [welcome]
- id: wl-hello-10
  text: 你來了，我很高興。
  tags: [welcome]
- id: wl-hello-11
  text: 嘿嘿，門開著，你就進來了。
  tags: [welcome]
- id: wl-hello-12
  text: 哈囉哈囉，位子都替你留好了。
  tags: [welcome]
- id: wl-hello-13
  text: 嗨，先把手上的事放一放。
  tags: [welcome]
- id: wl-hello-14
  text: 欸，你這時候回來，剛剛好。
  tags: [welcome]
- id: wl-hello-15
  text: 你來啦，先喘口氣吧。
  tags: [welcome]
- id: wl-hello-16
  text: 嘿，這裡一直亮著燈等你。
  tags: [welcome]
- id: wl-hello-17
  text: 哈囉，今天也能見到你。
  tags: [welcome]
- id: wl-hello-18
  text: 嗨，你一進門我就知道是你。
  tags: [welcome]
- id: wl-hello-19
  text: 欸欸，真的是你回來了呢。
  tags: [welcome]
- id: wl-hello-20
  text: 你來了呀，這裡一下就熱鬧起來。
  tags: [welcome]
