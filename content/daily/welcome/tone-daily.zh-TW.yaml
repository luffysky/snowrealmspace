# 歡迎鏈 · 日常感。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-daily-01
  text: 又見面了，跟平常一樣就好。
  tags: [welcome]
- id: wl-daily-02
  text: 老樣子，這個角落一直都在。
  tags: [welcome]
- id: wl-daily-03
  text: 你來了，這一天就照舊開始。
  tags: [welcome]
- id: wl-daily-04
  text: 日子照舊過，這裡什麼也沒變。
  tags: [welcome]
- id: wl-daily-05
  text: 又是你，門一直為你留著。
  tags: [welcome]
- id: wl-daily-06
  text: 燈還亮著，位置也替你空著。
  tags: [welcome]
- id: wl-daily-07
  text: 回來就好，別的都不急。
  tags: [welcome]
- id: wl-daily-08
  text: 這裡跟你離開的時候一模一樣。
  tags: [welcome]
- id: wl-daily-09
  text: 你回來的時候，這裡剛好在。
  tags: [welcome]
- id: wl-daily-10
  text: 一切照舊，坐下來就是了。
  tags: [welcome]
- id: wl-daily-11
  text: 這個空間認得你的腳步。
  tags: [welcome]
- id: wl-daily-12
  text: 沒什麼特別的，這樣才自在。
  tags: [welcome]
- id: wl-daily-13
  text: 熟悉的地方，也是熟悉的你。
  tags: [welcome]
- id: wl-daily-14
  text: 進來吧，這裡向來為你開著。
  tags: [welcome]
- id: wl-daily-15
  text: 又到了你回來的時候。
  tags: [welcome]
- id: wl-daily-16
  text: 這裡的時間，總是等你到了才走。
  tags: [welcome]
- id: wl-daily-17
  text: 你不在的時候，這裡什麼都沒動。
  tags: [welcome]
- id: wl-daily-18
  text: 隨手把外頭放下，這裡收得住。
  tags: [welcome]
- id: wl-daily-19
  text: 就這樣走回來，剛剛好。
  tags: [welcome]
- id: wl-daily-20
  text: 你在的地方，就是這裡最像家的樣子。
  tags: [welcome]
