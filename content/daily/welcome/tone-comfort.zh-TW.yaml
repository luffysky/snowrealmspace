# 歡迎鏈 · 受挫回來的安慰。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-comfort-01
  text: 沒關係的，這裡不會問你今天過得怎麼樣。
  tags: [welcome]
- id: wl-comfort-02
  text: 累成這樣還願意回來，這件事本身就很溫柔。
  tags: [welcome]
- id: wl-comfort-03
  text: 想難過就難過，這個地方不會評判任何一種你。
  tags: [welcome]
- id: wl-comfort-04
  text: 外面碰壁了也沒事，這裡的門一直是軟的。
  tags: [welcome]
- id: wl-comfort-05
  text: 你不用整理好情緒才進來，帶著亂七八糟也行。
  tags: [welcome]
- id: wl-comfort-06
  text: 這裡先把你接住，其他的事情等等再說。
  tags: [welcome]
- id: wl-comfort-07
  text: 委屈可以先放下來，這個角落幫你收著。
  tags: [welcome]
- id: wl-comfort-08
  text: 就算今天什麼都不順，你回到這裡依然是被歡迎的。
  tags: [welcome]
- id: wl-comfort-09
  text: 想哭的話這裡很安全，沒有人會在旁邊看。
  tags: [welcome]
- id: wl-comfort-10
  text: 不必解釋發生了什麼，坐下來就好，我懂。
  tags: [welcome]
- id: wl-comfort-11
  text: 這裡不需要你堅強，卸下來一點也沒關係。
  tags: [welcome]
- id: wl-comfort-12
  text: 跌了一跤才回來，這裡替你留了一個軟軟的地方。
  tags: [welcome]
- id: wl-comfort-13
  text: 難受是真的，你的難受在這裡是被認真對待的。
  tags: [welcome]
- id: wl-comfort-14
  text: 先深呼吸一下，這個空間會陪你把氣慢慢吐完。
  tags: [welcome]
- id: wl-comfort-15
  text: 就算全世界都吵，這裡願意只是安安靜靜地在。
  tags: [welcome]
- id: wl-comfort-16
  text: 你已經撐了很久，這裡讓你暫時不必撐著。
  tags: [welcome]
- id: wl-comfort-17
  text: 心裡破了個洞也沒關係，這裡不急著把它補上。
  tags: [welcome]
- id: wl-comfort-18
  text: 想被抱一下的話，這個地方一直張開著手。
  tags: [welcome]
- id: wl-comfort-19
  text: 失望和疲憊都可以帶進來，這裡裝得下。
  tags: [welcome]
- id: wl-comfort-20
  text: 不管今天多糟，你能回到這裡，就已經夠好了。
  tags: [welcome]
