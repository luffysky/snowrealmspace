# 歡迎鏈 · 溫柔叮嚀（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-gentle-21
  text: 伸個懶腰，讓筋骨舒展開來。
  tags: [welcome]
- id: wl-gentle-22
  text: 洗把臉，把一天的倦意沖淡一些。
  tags: [welcome]
- id: wl-gentle-23
  text: 手機先擱一邊，讓眼睛歇口氣。
  tags: [welcome]
- id: wl-gentle-24
  text: 肚子空了就墊點東西，別硬撐著。
  tags: [welcome]
- id: wl-gentle-25
  text: 泡杯熱茶捧在手心，暖意會慢慢上來。
  tags: [welcome]
- id: wl-gentle-26
  text: 躺平一會兒也好，讓背貼著床鬆一鬆。
  tags: [welcome]
- id: wl-gentle-27
  text: 領口鬆開一些，呼吸也會順一些。
  tags: [welcome]
- id: wl-gentle-28
  text: 腳邊蓋條毯子，暖意從腳底升起來。
  tags: [welcome]
- id: wl-gentle-29
  text: 螢幕調暗一點，對眼睛溫柔些。
  tags: [welcome]
- id: wl-gentle-30
  text: 放首輕輕的歌，讓心跟著慢下來。
  tags: [welcome]
- id: wl-gentle-31
  text: 泡個熱水澡，把一身寒氣都泡走。
  tags: [welcome]
- id: wl-gentle-32
  text: 脖子痠了，輕輕轉一轉就舒服了。
  tags: [welcome]
- id: wl-gentle-33
  text: 三餐別將就，好好餵飽自己。
  tags: [welcome]
- id: wl-gentle-34
  text: 襪子穿上，別讓腳丫著了涼。
  tags: [welcome]
- id: wl-gentle-35
  text: 喉嚨乾就含顆糖，潤一潤。
  tags: [welcome]
- id: wl-gentle-36
  text: 窗簾拉上，把夜色都擋在外頭。
  tags: [welcome]
- id: wl-gentle-37
  text: 往後靠著椅背，把身上的重量交出去。
  tags: [welcome]
- id: wl-gentle-38
  text: 喝碗熱湯，從裡頭一路暖到外頭。
  tags: [welcome]
- id: wl-gentle-39
  text: 抹點護手霜，讓手也被好好照顧到。
  tags: [welcome]
- id: wl-gentle-40
  text: 背包卸下來，肩膀立刻就輕了。
  tags: [welcome]
