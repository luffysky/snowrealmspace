# 歡迎鏈 · 夜裡回來（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-evening-61
  text: 電梯把你送到頂樓，這扇門後的燈一直亮著。
  tags: [welcome]
- id: wl-evening-62
  text: 妝卸乾淨了，鏡子裡的你比白天鬆了許多。
  tags: [welcome]
- id: wl-evening-63
  text: 一首慢歌在房裡輕輕轉著，替這個夜鋪了層軟墊。
  tags: [welcome]
- id: wl-evening-64
  text: 你嘆出一口長氣，這房間安安靜靜替你收下。
  tags: [welcome]
- id: wl-evening-65
  text: 街角的便利店還亮著，陪你走完回家的最後一段。
  tags: [welcome]
- id: wl-evening-66
  text: 泡麵的熱氣升起來，深夜也有了一點人味。
  tags: [welcome]
- id: wl-evening-67
  text: 把手機倒扣在桌上，這段時間就只屬於你了。
  tags: [welcome]
- id: wl-evening-68
  text: 換上寬鬆的家居服，一天的束縛也一併鬆了。
  tags: [welcome]
- id: wl-evening-69
  text: 你把窗推開一條縫，讓夜風替你收走白日的燥。
  tags: [welcome]
- id: wl-evening-70
  text: 廚房只剩一盞小燈，替晚歸的你留著一口熱。
  tags: [welcome]
- id: wl-evening-71
  text: 熱牛奶在杯裡冒著小泡，替你把夜暖成可以入睡的溫度。
  tags: [welcome]
- id: wl-evening-72
  text: 拖鞋在門邊擺正了方向，等的就是你這雙腳。
  tags: [welcome]
- id: wl-evening-73
  text: 提示音一個個按熄了，世界就安靜得剛好。
  tags: [welcome]
- id: wl-evening-74
  text: 夜雨敲著窗，屋裡卻乾乾暖暖地把你圍住。
  tags: [welcome]
- id: wl-evening-75
  text: 床頭燈調到最柔，替你把夜的邊角都磨圓了。
  tags: [welcome]
- id: wl-evening-76
  text: 讀到一半的書攤開著，夜陪你安靜往下走。
  tags: [welcome]
- id: wl-evening-77
  text: 泡腳的熱水漫過腳踝，一天的路程就慢慢化開了。
  tags: [welcome]
- id: wl-evening-78
  text: 鬧鐘往後撥了撥，今夜允許自己睡得沉一點。
  tags: [welcome]
- id: wl-evening-79
  text: 貓跳上你的膝頭窩著，這一夜就有了重量也有了暖。
  tags: [welcome]
- id: wl-evening-80
  text: 這一天走到末尾，你終於停下來，這裡穩穩接住你。
  tags: [welcome]
