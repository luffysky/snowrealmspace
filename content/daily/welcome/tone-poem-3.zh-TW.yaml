# 歡迎鏈 · 詩意留白（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-41
  text: 巷口那盞燈認得你的影子。
  tags: [welcome]
- id: wl-poem-42
  text: 推開木門，屋裡的暖先迎上來。
  tags: [welcome]
- id: wl-poem-43
  text: 階梯一級一級，把你送回最安穩的那一層。
  tags: [welcome]
- id: wl-poem-44
  text: 廊下的燈籠替你把夜色挑亮了一角。
  tags: [welcome]
- id: wl-poem-45
  text: 曬過太陽的棉被，還留著白天的暖。
  tags: [welcome]
- id: wl-poem-46
  text: 枕頭記得你頭的形狀，一直沒忘。
  tags: [welcome]
- id: wl-poem-47
  text: 被窩裡藏著一整夜的溫，只等你鑽進來。
  tags: [welcome]
- id: wl-poem-48
  text: 簷下的麻雀睡了，屋裡的燈替你醒著。
  tags: [welcome]
- id: wl-poem-49
  text: 米缸是滿的，爐是溫的，你不會餓著。
  tags: [welcome]
- id: wl-poem-50
  text: 舊照片在牆上笑著，看你平安走回來。
  tags: [welcome]
- id: wl-poem-51
  text: 鑰匙轉開的那一聲，是家對你說的第一句話。
  tags: [welcome]
- id: wl-poem-52
  text: 信箱空了，該回來的都回來了。
  tags: [welcome]
- id: wl-poem-53
  text: 木炭在爐裡輕輕地紅，像替你捂著手。
  tags: [welcome]
- id: wl-poem-54
  text: 井水很涼，屋子很暖，剛好一冷一熱把你圈住。
  tags: [welcome]
- id: wl-poem-55
  text: 晨霧散去以前，這裡替你把夜守到了底。
  tags: [welcome]
- id: wl-poem-56
  text: 蒲團上的凹痕，是你坐過無數次的印子。
  tags: [welcome]
- id: wl-poem-57
  text: 針線籃還擺在老地方，破的都能補回來。
  tags: [welcome]
- id: wl-poem-58
  text: 露水沿著窗滑下，屋裡一滴都沒沾到你。
  tags: [welcome]
- id: wl-poem-59
  text: 溪聲在牆外流著，把喧囂都帶往下游去了。
  tags: [welcome]
- id: wl-poem-60
  text: 門檻很低，跨過來就到家了。
  tags: [welcome]
