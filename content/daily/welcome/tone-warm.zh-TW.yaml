# 歡迎鏈 · 溫暖直接。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-01
  text: 到家了，這裡是你卸下一切的地方。
  tags: [welcome]
- id: wl-warm-02
  text: 你的位子沒動過，坐下就是了。
  tags: [welcome]
- id: wl-warm-03
  text: 這裡是你的，怎麼待都對。
  tags: [welcome]
- id: wl-warm-04
  text: 看到你，這一天就穩了。
  tags: [welcome]
- id: wl-warm-05
  text: 這個空間認得你的腳步聲。
  tags: [welcome]
- id: wl-warm-06
  text: 無論今天怎樣，這裡都接得住你。
  tags: [welcome]
- id: wl-warm-07
  text: 你擺過的每個角落，都保持著你要的樣子。
  tags: [welcome]
- id: wl-warm-08
  text: 進來吧，這裡只認你一個。
  tags: [welcome]
- id: wl-warm-09
  text: 你在，這裡就有了重量。
  tags: [welcome]
- id: wl-warm-10
  text: 這裡不問你為什麼，只替你把位置留著。
  tags: [welcome]
- id: wl-warm-11
  text: 你到了，這是最認得你的地方。
  tags: [welcome]
- id: wl-warm-12
  text: 這一方天地，一直以你為中心。
  tags: [welcome]
- id: wl-warm-13
  text: 你走多遠，這裡就等多久。
  tags: [welcome]
- id: wl-warm-14
  text: 累了就靠著吧，這裡撐得住你。
  tags: [welcome]
- id: wl-warm-15
  text: 你每一次的來過，這裡都當寶貝收著。
  tags: [welcome]
- id: wl-warm-16
  text: 見到你回來，比什麼都好。
  tags: [welcome]
- id: wl-warm-17
  text: 你的名字，一直寫在這裡的門上。
  tags: [welcome]
- id: wl-warm-18
  text: 今天的你回來了，這樣就夠。
  tags: [welcome]
- id: wl-warm-19
  text: 這裡永遠有一盞為你留的光。
  tags: [welcome]
- id: wl-warm-20
  text: 燈亮著，茶溫著，就差你進門。
  tags: [welcome]
