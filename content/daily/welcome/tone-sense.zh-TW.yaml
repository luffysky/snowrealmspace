# 歡迎鏈 · 感官細節。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-sense-01
  text: 茶還溫著，等你坐下。
  tags: [welcome]
- id: wl-sense-02
  text: 木地板的味道，還是老樣子。
  tags: [welcome]
- id: wl-sense-03
  text: 窗邊留了一格光給你。
  tags: [welcome]
- id: wl-sense-04
  text: 風鈴剛才輕輕響了一下。
  tags: [welcome]
- id: wl-sense-05
  text: 空氣裡有淡淡的舊書味。
  tags: [welcome]
- id: wl-sense-06
  text: 桌上那盞燈，是暖黃色的。
  tags: [welcome]
- id: wl-sense-07
  text: 你進門時，門簾輕輕晃了晃。
  tags: [welcome]
- id: wl-sense-08
  text: 遠處有雨聲，屋裡很乾爽。
  tags: [welcome]
- id: wl-sense-09
  text: 爐火的溫度剛剛好。
  tags: [welcome]
- id: wl-sense-10
  text: 桌角那杯水，還微微冒著氣。
  tags: [welcome]
- id: wl-sense-11
  text: 陽光斜斜落在你常坐的椅子上。
  tags: [welcome]
- id: wl-sense-12
  text: 空氣裡飄著剛烘過的暖意。
  tags: [welcome]
- id: wl-sense-13
  text: 腳底下的地毯還是那樣柔軟。
  tags: [welcome]
- id: wl-sense-14
  text: 窗台上的植物又抽了新葉。
  tags: [welcome]
- id: wl-sense-15
  text: 牆上的時鐘慢慢地走著。
  tags: [welcome]
- id: wl-sense-16
  text: 被曬過的棉被味道還留在這裡。
  tags: [welcome]
- id: wl-sense-17
  text: 門把是涼的，屋裡是暖的。
  tags: [welcome]
- id: wl-sense-18
  text: 一縷茶香先繞到你身邊。
  tags: [welcome]
- id: wl-sense-19
  text: 檯燈把影子拉得長長的。
  tags: [welcome]
- id: wl-sense-20
  text: 窗外的風，被關在玻璃外面了。
  tags: [welcome]
