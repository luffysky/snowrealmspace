# 歡迎鏈 · 節慶（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-festive-41
  text: 父親節的餐廳一位難求，你沒去排隊，先回到這個一直留著位子的地方。
  tags: [welcome]
- id: wl-festive-42
  text: 兒童節的樂園擠滿了笑聲，你把童心收進口袋，帶回這片不吵的角落。
  tags: [welcome]
- id: wl-festive-43
  text: 清明的細雨落在山路上，掃過墓你繞回這裡，門後是活著的溫度。
  tags: [welcome]
- id: wl-festive-44
  text: 七夕的橋在傳說裡搭起來，這裡不必等一年一次，天天都替你亮著。
  tags: [welcome]
- id: wl-festive-45
  text: 重陽登高的人潮往山頂爬，你留在低處，這裡的高度剛好放得下你。
  tags: [welcome]
- id: wl-festive-46
  text: 冬至的湯圓在鍋裡浮起來，這裡的碗也一直溫著，數過就多你一歲。
  tags: [welcome]
- id: wl-festive-47
  text: 萬聖節的糖果敲遍了每扇門，這扇門不給驚嚇，只給你熟悉的安穩。
  tags: [welcome]
- id: wl-festive-48
  text: 燈會的光雕把河岸點成白晝，你看夠了，回到這裡只留一盞剛好的燈。
  tags: [welcome]
- id: wl-festive-49
  text: 音樂節的低音震得整片草地發燙，你退到人群外，這裡的安靜接住了你的耳朵。
  tags: [welcome]
- id: wl-festive-50
  text: 補班日撞上別人的連假，你上完工回來，這裡從不問你今天算不算假。
  tags: [welcome]
- id: wl-festive-51
  text: 國慶的煙火在天空排成隊，你關上窗，這裡的光比煙火更耐久地陪你。
  tags: [welcome]
- id: wl-festive-52
  text: 開學日的鐘聲把校園叫醒，你早已離開那個年紀，這裡收留現在的你。
  tags: [welcome]
- id: wl-festive-53
  text: 婚宴的喜氣在會場流動了一整晚，你敬完最後一杯，回到這個不必客套的家。
  tags: [welcome]
- id: wl-festive-54
  text: 滿月酒的紅蛋分了滿桌，你祝福過別人的新生，也把自己交還給這片安靜。
  tags: [welcome]
- id: wl-festive-55
  text: 春節初一的拜年電話響個不停，你放下手機，這裡不需要你說任何吉祥話。
  tags: [welcome]
- id: wl-festive-56
  text: 同學會的舊照片在群組裡翻了一輪，你笑完關掉，回到只有現在的這裡。
  tags: [welcome]
- id: wl-festive-57
  text: 復活節的彩蛋藏在草坪各處，你不必尋找，這裡本來就把溫暖放在明處等你。
  tags: [welcome]
- id: wl-festive-58
  text: 燈籠遊行的隊伍拐過街角走遠，你往反方向走，這裡的光一直在原地。
  tags: [welcome]
- id: wl-festive-59
  text: 年終的頒獎典禮把掌聲留給了台上，你退場之後，這裡替你留了一份安穩。
  tags: [welcome]
- id: wl-festive-60
  text: 節慶的最後一串鞭炮在遠處炸開，餘煙散盡時，這裡的門早已為你敞著。
  tags: [welcome]
