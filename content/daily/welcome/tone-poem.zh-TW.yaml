# 歡迎鏈 · 詩意留白。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-01
  text: 燈一直為你亮著，沒有熄過。
  tags: [welcome]
- id: wl-poem-02
  text: 風替你留了門，你回來了。
  tags: [welcome]
- id: wl-poem-03
  text: 時間在這裡等你，從不著急。
  tags: [welcome]
- id: wl-poem-04
  text: 夜色鋪好了，像一張軟軟的床。
  tags: [welcome]
- id: wl-poem-05
  text: 你的位子空著，一直空著，等你坐下。
  tags: [welcome]
- id: wl-poem-06
  text: 窗外的光散去，屋裡的光留給你。
  tags: [welcome]
- id: wl-poem-07
  text: 腳步聲落下的地方，就是家。
  tags: [welcome]
- id: wl-poem-08
  text: 這裡收著白天沒說完的那口氣。
  tags: [welcome]
- id: wl-poem-09
  text: 影子跟著你進門，一起卸下重量。
  tags: [welcome]
- id: wl-poem-10
  text: 靜靜的，連空氣都認得你。
  tags: [welcome]
- id: wl-poem-11
  text: 星星在外頭數著，你在裡頭歇著。
  tags: [welcome]
- id: wl-poem-12
  text: 一盞燈、一張椅、一個你，剛剛好。
  tags: [welcome]
- id: wl-poem-13
  text: 門後的世界，只按你的呼吸走。
  tags: [welcome]
- id: wl-poem-14
  text: 牆會記得你靠過的溫度。
  tags: [welcome]
- id: wl-poem-15
  text: 遠路走完了，這裡是最後一站，也是最軟的一站。
  tags: [welcome]
- id: wl-poem-16
  text: 把疲憊掛在門邊的鉤子上，它會自己晾乾。
  tags: [welcome]
- id: wl-poem-17
  text: 月亮沒說話，只是把光留在你的窗台。
  tags: [welcome]
- id: wl-poem-18
  text: 這方寸之地，替你把喧囂關在門外。
  tags: [welcome]
- id: wl-poem-19
  text: 你走進來，屋子就有了心跳。
  tags: [welcome]
- id: wl-poem-20
  text: 所有的燈都朝你，像一群安靜的守候。
  tags: [welcome]
