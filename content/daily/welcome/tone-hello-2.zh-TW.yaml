# 歡迎鏈 · 招呼式（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-hello-21
  text: 喔，是你的聲音，我認得。
  tags: [welcome]
- id: wl-hello-22
  text: 早啊，這裡剛醒，你就到了。
  tags: [welcome]
- id: wl-hello-23
  text: 唉唷，是你，快進來。
  tags: [welcome]
- id: wl-hello-24
  text: 看到你了，把肩膀放鬆一點。
  tags: [welcome]
- id: wl-hello-25
  text: 你呀，一來我這裡就穩了。
  tags: [welcome]
- id: wl-hello-26
  text: 咦，門口那個熟悉的影子是你。
  tags: [welcome]
- id: wl-hello-27
  text: 晚安時分你也來了，正好作伴。
  tags: [welcome]
- id: wl-hello-28
  text: 我這邊一切都在，就等你這一步。
  tags: [welcome]
- id: wl-hello-29
  text: 好啦好啦，你到了，慢慢來就行。
  tags: [welcome]
- id: wl-hello-30
  text: 遠遠就聽到你，心裡先亮了一下。
  tags: [welcome]
- id: wl-hello-31
  text: 阿，趕上了，你剛好走進來。
  tags: [welcome]
- id: wl-hello-32
  text: 招呼都還沒說完，你人就在眼前了。
  tags: [welcome]
- id: wl-hello-33
  text: 你這麼一出現，這裡就有了溫度。
  tags: [welcome]
- id: wl-hello-34
  text: 唷，帶著一身外頭的風進來了。
  tags: [welcome]
- id: wl-hello-35
  text: 那雙鞋的聲音，一聽就是你。
  tags: [welcome]
- id: wl-hello-36
  text: 我在門邊坐著，看你推門進來。
  tags: [welcome]
- id: wl-hello-37
  text: 呼，你總算到了，我這就迎上去。
  tags: [welcome]
- id: wl-hello-38
  text: 是你耶，把外套掛好，這裡歸你。
  tags: [welcome]
- id: wl-hello-39
  text: 剛好抬頭，就對上你進門的臉。
  tags: [welcome]
- id: wl-hello-40
  text: 誒，你來的正是時候，我等著呢。
  tags: [welcome]
