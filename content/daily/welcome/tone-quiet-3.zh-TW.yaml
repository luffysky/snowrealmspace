# 歡迎鏈 · 安靜溫柔（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-41
  text: 外套先掛著，身子輕一點了。
  tags: [welcome]
- id: wl-quiet-42
  text: 喝口水，喉嚨和心都潤一下。
  tags: [welcome]
- id: wl-quiet-43
  text: 沙發那頭空著，過去窩著就好。
  tags: [welcome]
- id: wl-quiet-44
  text: 今天發生的事，明天再理也不遲。
  tags: [welcome]
- id: wl-quiet-45
  text: 讓肩膀往下沉一寸，再沉一寸。
  tags: [welcome]
- id: wl-quiet-46
  text: 這裡沒有時鐘在催，慢慢喘口氣。
  tags: [welcome]
- id: wl-quiet-47
  text: 想哭就哭一下，這裡不會笑你。
  tags: [welcome]
- id: wl-quiet-48
  text: 把重的心事，先擱在桌上放涼。
  tags: [welcome]
- id: wl-quiet-49
  text: 腳踩在地上，你是穩穩落地的。
  tags: [welcome]
- id: wl-quiet-50
  text: 燈暗一點也好，眼睛跟著鬆下來。
  tags: [welcome]
- id: wl-quiet-51
  text: 累到不想動，就這樣攤著也行。
  tags: [welcome]
- id: wl-quiet-52
  text: 這一晚是你的，誰都借不走。
  tags: [welcome]
- id: wl-quiet-53
  text: 呼吸放長一點，胸口的結會自己散。
  tags: [welcome]
- id: wl-quiet-54
  text: 手邊的事先停著，它們等得起。
  tags: [welcome]
- id: wl-quiet-55
  text: 靠在這裡，有人替你頂著背後那片黑。
  tags: [welcome]
- id: wl-quiet-56
  text: 讓白天的臉先卸下來，這裡只要你自己。
  tags: [welcome]
- id: wl-quiet-57
  text: 心裡的浪退一退，慢慢就平了。
  tags: [welcome]
- id: wl-quiet-58
  text: 蓋上毯子，把自己好好裹起來。
  tags: [welcome]
- id: wl-quiet-59
  text: 這裡接得住你，垮下來也沒關係。
  tags: [welcome]
- id: wl-quiet-60
  text: 夜很安穩，你也可以跟著安穩下來。
  tags: [welcome]
