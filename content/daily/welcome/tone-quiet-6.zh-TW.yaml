# 歡迎鏈 · 安靜溫柔（第六批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-101
  text: 換上最鬆的那件衣服，身體先鬆掉一半。
  tags: [welcome]
- id: wl-quiet-102
  text: 腰帶鬆一格，肚子那口氣才吐得乾淨。
  tags: [welcome]
- id: wl-quiet-103
  text: 讓後頸靠上椅背，那裡替你撐了一整天。
  tags: [welcome]
- id: wl-quiet-104
  text: 頭皮也是緊的，用指腹輕輕揉開它。
  tags: [welcome]
- id: wl-quiet-105
  text: 把明天的清單先蓋起來，它不會自己跑掉。
  tags: [welcome]
- id: wl-quiet-106
  text: 腳收進毯子裡，涼就一寸一寸退了。
  tags: [welcome]
- id: wl-quiet-107
  text: 讓房間暗到只剩輪廓，眼睛就不必再認路。
  tags: [welcome]
- id: wl-quiet-108
  text: 抱著膝蓋坐一會，也是一種被自己抱住。
  tags: [welcome]
- id: wl-quiet-109
  text: 把手機調成勿擾，這一晚沒人找得到你。
  tags: [welcome]
- id: wl-quiet-110
  text: 太陽穴按一按，那裡撐著你整天的念頭。
  tags: [welcome]
- id: wl-quiet-111
  text: 讓熱水沖過後背，把僵掉的地方一寸寸澆軟。
  tags: [welcome]
- id: wl-quiet-112
  text: 腳踝轉兩圈，走了一天的路就從那裡鬆開。
  tags: [welcome]
- id: wl-quiet-113
  text: 把窗開一條縫，讓夜的涼氣替你換口氣。
  tags: [welcome]
- id: wl-quiet-114
  text: 舌頭從上顎放下來，連嘴裡都能鬆一鬆。
  tags: [welcome]
- id: wl-quiet-115
  text: 讓體溫慢慢回到指尖，冷會自己走的。
  tags: [welcome]
- id: wl-quiet-116
  text: 眼皮沉了就讓它沉，不必再撐著看什麼。
  tags: [welcome]
- id: wl-quiet-117
  text: 把今天說過的話都先靜音，耳朵可以歇了。
  tags: [welcome]
- id: wl-quiet-118
  text: 讓房間的味道慢慢包住你，那是只有這裡才有的安穩。
  tags: [welcome]
- id: wl-quiet-119
  text: 手肘擱在桌上，把頭的重量先交出去一會。
  tags: [welcome]
- id: wl-quiet-120
  text: 數三個呼吸就好，數完什麼都不必做。
  tags: [welcome]
