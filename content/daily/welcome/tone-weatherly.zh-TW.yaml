# 歡迎鏈 · 天氣意象。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-weatherly-01
  text: 下著雨你也來了，門口的傘架先替你空出來。
  tags: [welcome]
- id: wl-weatherly-02
  text: 天冷成這樣，路上辛苦了，這裡的暖氣一直開著。
  tags: [welcome]
- id: wl-weatherly-03
  text: 大晴天配上你剛好，窗邊那道光正照在你常坐的位子。
  tags: [welcome]
- id: wl-weatherly-04
  text: 風大的日子，你一進門，外面的呼呼聲就被關在後頭了。
  tags: [welcome]
- id: wl-weatherly-05
  text: 外面在飄雪，這裡的溫度剛好，你可以把外套掛下了。
  tags: [welcome]
- id: wl-weatherly-06
  text: 起霧的早晨看不清路，你還是找到了回這裡的方向。
  tags: [welcome]
- id: wl-weatherly-07
  text: 雷聲在遠處滾動，這個房間穩穩的，什麼都晃不到。
  tags: [welcome]
- id: wl-weatherly-08
  text: 悶熱了一整天，這裡有一片你需要的陰涼。
  tags: [welcome]
- id: wl-weatherly-09
  text: 陰天壓得人有點沉，你走進來，燈就把那片灰擋在外面。
  tags: [welcome]
- id: wl-weatherly-10
  text: 雨停的空檔你趕過來，地上的水光一路陪你到門口。
  tags: [welcome]
- id: wl-weatherly-11
  text: 寒流來的夜裡，這裡是城裡少數還亮著暖光的角落。
  tags: [welcome]
- id: wl-weatherly-12
  text: 太陽剛露臉，你也剛好推門，光和你一起進來了。
  tags: [welcome]
- id: wl-weatherly-13
  text: 潮濕的黃昏，這裡乾爽如常，等你把濕氣抖在門外。
  tags: [welcome]
- id: wl-weatherly-14
  text: 冷風把街上的人都吹回家，你也順著風回到了這裡。
  tags: [welcome]
- id: wl-weatherly-15
  text: 毛毛雨黏在肩上，進來坐一會兒，它自己就乾了。
  tags: [welcome]
- id: wl-weatherly-16
  text: 一場午後雷陣雨過後，你踩著水痕回到這片乾淨的安靜。
  tags: [welcome]
- id: wl-weatherly-17
  text: 秋風把落葉掃了一地，你踏過它們，回到這個不落葉的地方。
  tags: [welcome]
- id: wl-weatherly-18
  text: 天色暗得早，這裡的燈比夜色先亮，一直等著你。
  tags: [welcome]
- id: wl-weatherly-19
  text: 晴朗得不像話的一天，你把好天氣也一起帶進了門。
  tags: [welcome]
- id: wl-weatherly-20
  text: 積雪把世界蓋得安靜，這裡本來就安靜，正好接住你。
  tags: [welcome]
