# 歡迎鏈 · 溫柔叮嚀（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-gentle-81
  text: 抱著熱水袋暖暖肚子，寒氣就散了。
  tags: [welcome]
- id: wl-gentle-82
  text: 冷掉的飯菜先熱過再吃，別將就。
  tags: [welcome]
- id: wl-gentle-83
  text: 十指張開再握攏幾下，手就活絡了。
  tags: [welcome]
- id: wl-gentle-84
  text: 睏意來了就順著它，不必硬撐。
  tags: [welcome]
- id: wl-gentle-85
  text: 用溫水漱漱口，喉頭清爽一些。
  tags: [welcome]
- id: wl-gentle-86
  text: 抬頭望望窗外，讓視線放遠一點。
  tags: [welcome]
- id: wl-gentle-87
  text: 盤起腿窩在沙發，怎麼舒服怎麼來。
  tags: [welcome]
- id: wl-gentle-88
  text: 熱一杯豆漿，暖暖地喝下去。
  tags: [welcome]
- id: wl-gentle-89
  text: 打噴嚏就打出來，別憋著。
  tags: [welcome]
- id: wl-gentle-90
  text: 吃飯慢慢嚼，別囫圇吞下去。
  tags: [welcome]
- id: wl-gentle-91
  text: 睡前把手機放遠一點，讓自己好眠。
  tags: [welcome]
- id: wl-gentle-92
  text: 冷了就把窗戶掩上，別讓風灌進來。
  tags: [welcome]
- id: wl-gentle-93
  text: 手涼的話揣進口袋暖著，慢慢就回溫。
  tags: [welcome]
- id: wl-gentle-94
  text: 打開暖氣，讓屋子先暖起來再說。
  tags: [welcome]
- id: wl-gentle-95
  text: 補點維他命，給身子添點底氣。
  tags: [welcome]
- id: wl-gentle-96
  text: 洗澡別拖太晚，暖著身子好入睡。
  tags: [welcome]
- id: wl-gentle-97
  text: 讓熱風吹吹後腦，暖意就一路上來了。
  tags: [welcome]
- id: wl-gentle-98
  text: 咳嗽的話沖杯熱蜂蜜水，潤一潤。
  tags: [welcome]
- id: wl-gentle-99
  text: 把重心交給沙發，整個人陷進去也好。
  tags: [welcome]
- id: wl-gentle-100
  text: 這一刻什麼都不必想，安穩地待著就好。
  tags: [welcome]
