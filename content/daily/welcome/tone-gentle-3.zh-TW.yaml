# 歡迎鏈 · 溫柔叮嚀（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-gentle-41
  text: 換上拖鞋，讓腳踏著軟軟的舒服。
  tags: [welcome]
- id: wl-gentle-42
  text: 明天不必太早，鬧鐘就晚一點吧。
  tags: [welcome]
- id: wl-gentle-43
  text: 頭髮吹乾了再睡，別著了涼。
  tags: [welcome]
- id: wl-gentle-44
  text: 嘴饞的話，抽屜裡的零食隨你拿。
  tags: [welcome]
- id: wl-gentle-45
  text: 眉頭鬆開，那些事都先擱著。
  tags: [welcome]
- id: wl-gentle-46
  text: 把一天的忙碌留在門外，這裡不用。
  tags: [welcome]
- id: wl-gentle-47
  text: 泡泡腳，暖意會順著小腿爬上來。
  tags: [welcome]
- id: wl-gentle-48
  text: 唇乾就抹點護唇膏，別忽略了它。
  tags: [welcome]
- id: wl-gentle-49
  text: 靠著枕頭窩一會兒，姿勢隨你舒服。
  tags: [welcome]
- id: wl-gentle-50
  text: 熱牛奶溫在杯裡，睡前喝一口正好。
  tags: [welcome]
- id: wl-gentle-51
  text: 搓熱手心敷敷眼，疲倦會化開一些。
  tags: [welcome]
- id: wl-gentle-52
  text: 腰痠的話，背後墊個抱枕撐著。
  tags: [welcome]
- id: wl-gentle-53
  text: 待辦本先合上，字句明天還在那裡。
  tags: [welcome]
- id: wl-gentle-54
  text: 冷氣別調太強，暖著身子睡才安穩。
  tags: [welcome]
- id: wl-gentle-55
  text: 手錶解下來，手腕也想透透氣。
  tags: [welcome]
- id: wl-gentle-56
  text: 夜還長，別讓自己撐得太晚。
  tags: [welcome]
- id: wl-gentle-57
  text: 心裡壓著的事，先放到一邊吧。
  tags: [welcome]
- id: wl-gentle-58
  text: 枕頭拍鬆一些，頭靠上去就軟了。
  tags: [welcome]
- id: wl-gentle-59
  text: 想哭就哭一場，這裡替你收著。
  tags: [welcome]
- id: wl-gentle-60
  text: 慢慢卸下今天，剩下的交給明天。
  tags: [welcome]
