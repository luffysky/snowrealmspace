# 歡迎鏈 · 老友般（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-41
  text: 欸，剛還在想你會不會來，門就響了。
  tags: [welcome]
- id: wl-buddy-42
  text: 位子我沒讓給別人，一直空著替你擋。
  tags: [welcome]
- id: wl-buddy-43
  text: 瞧你這一身風塵，先坐下，別的等等再說。
  tags: [welcome]
- id: wl-buddy-44
  text: 我們這種交情，遲到早退都不算事。
  tags: [welcome]
- id: wl-buddy-45
  text: 燒水的壺我早按下去了，就等你這張嘴。
  tags: [welcome]
- id: wl-buddy-46
  text: 廢話連篇也好，靜靜坐著也好，我都陪。
  tags: [welcome]
- id: wl-buddy-47
  text: 你那件老外套還掛在牆上，我一直沒收。
  tags: [welcome]
- id: wl-buddy-48
  text: 甭管外頭多亂，跨進這道門就自動歸零。
  tags: [welcome]
- id: wl-buddy-49
  text: 認得你這腳步聲，遠遠一聽我就笑了。
  tags: [welcome]
- id: wl-buddy-50
  text: 想擺爛就擺，我這沙發專收爛人。
  tags: [welcome]
- id: wl-buddy-51
  text: 你上次沒吵完的架，我這耳朵還替你留著。
  tags: [welcome]
- id: wl-buddy-52
  text: 多久沒露臉都行，我這裡的帳從不算利息。
  tags: [welcome]
- id: wl-buddy-53
  text: 挑你順眼的角落塞著，別跟我見外。
  tags: [welcome]
- id: wl-buddy-54
  text: 瞧見你我就放心了，剩下的慢慢講。
  tags: [welcome]
- id: wl-buddy-55
  text: 肚子餓了自己翻櫃子，這裡沒有你的客人身份。
  tags: [welcome]
- id: wl-buddy-56
  text: 話到嘴邊卡住也沒事，我等得起。
  tags: [welcome]
- id: wl-buddy-57
  text: 咱倆之間，沉默都比別人的熱鬧來得自在。
  tags: [welcome]
- id: wl-buddy-58
  text: 你走前擱下的那盤棋，我一顆都沒碰。
  tags: [welcome]
- id: wl-buddy-59
  text: 累成這樣還肯來，我這老朋友當得值了。
  tags: [welcome]
- id: wl-buddy-60
  text: 什麼都不必交代，人回來了就是最好的消息。
  tags: [welcome]
