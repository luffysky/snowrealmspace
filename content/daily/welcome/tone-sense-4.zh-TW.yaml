# 歡迎鏈 · 感官細節（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-sense-61
  text: 咖啡剛磨好，香氣還黏在杯口。
  tags: [welcome]
- id: wl-sense-62
  text: 門後掛著的外套，還帶著外頭的涼。
  tags: [welcome]
- id: wl-sense-63
  text: 書架上那排書脊，安安靜靜排著。
  tags: [welcome]
- id: wl-sense-64
  text: 水龍頭偶爾滴答一下，在廚房那頭。
  tags: [welcome]
- id: wl-sense-65
  text: 花瓶裡的那束花，開得正好。
  tags: [welcome]
- id: wl-sense-66
  text: 保溫瓶握在手裡，還是溫的。
  tags: [welcome]
- id: wl-sense-67
  text: 紗窗把陽光篩成一格一格的影。
  tags: [welcome]
- id: wl-sense-68
  text: 碗邊擺好的那雙筷子，等著開飯。
  tags: [welcome]
- id: wl-sense-69
  text: 舊唱片轉著，沙沙地流出老歌。
  tags: [welcome]
- id: wl-sense-70
  text: 門上的便條被磁鐵壓著，一直沒動。
  tags: [welcome]
- id: wl-sense-71
  text: 相框裡的那張照片，笑意還留著。
  tags: [welcome]
- id: wl-sense-72
  text: 鑰匙掛回門邊的鉤子，叮了一聲。
  tags: [welcome]
- id: wl-sense-73
  text: 熱鍋掀蓋，白霧一下子湧了上來。
  tags: [welcome]
- id: wl-sense-74
  text: 籃子裡織到一半的毛線，靜靜擱著。
  tags: [welcome]
- id: wl-sense-75
  text: 溫度計掛在牆上，指著暖暖的刻度。
  tags: [welcome]
- id: wl-sense-76
  text: 鹽罐和糖罐並排靠著，擺在桌邊。
  tags: [welcome]
- id: wl-sense-77
  text: 餅乾罐的蓋子，蓋得不太緊。
  tags: [welcome]
- id: wl-sense-78
  text: 竹簾捲起一半，光就從那兒漏進來。
  tags: [welcome]
- id: wl-sense-79
  text: 桌墊上留著一圈淡淡的茶漬。
  tags: [welcome]
- id: wl-sense-80
  text: 火柴劃開的那點硫磺味，很快就散了。
  tags: [welcome]
