# 歡迎鏈 · 詩意留白（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-21
  text: 雪停了，屋簷替你收好一整個冬天。
  tags: [welcome]
- id: wl-poem-22
  text: 這裡的地板記得每一雙鞋的重量。
  tags: [welcome]
- id: wl-poem-23
  text: 桌角的木紋，是替你數過的年輪。
  tags: [welcome]
- id: wl-poem-24
  text: 你把外面的雨關在傘裡，屋裡是乾的。
  tags: [welcome]
- id: wl-poem-25
  text: 一整座山的安靜，都搬進了這個房間。
  tags: [welcome]
- id: wl-poem-26
  text: 潮水退到很遠，這裡是它碰不到的岸。
  tags: [welcome]
- id: wl-poem-27
  text: 書還攤在昨天那一頁，等你把它讀完。
  tags: [welcome]
- id: wl-poem-28
  text: 貓睡過的地方還溫著，剛好留給你。
  tags: [welcome]
- id: wl-poem-29
  text: 毛毯把你圈成一個小小的、完整的島。
  tags: [welcome]
- id: wl-poem-30
  text: 爐子裡的火不急不徐，像替你守夜的人。
  tags: [welcome]
- id: wl-poem-31
  text: 這裡的鐘走得慢，慢到能裝下你的整個下午。
  tags: [welcome]
- id: wl-poem-32
  text: 你落坐的那一刻，房間就把肩膀借給了你。
  tags: [welcome]
- id: wl-poem-33
  text: 抽屜裡收著你忘了的、卻一直被記得的東西。
  tags: [welcome]
- id: wl-poem-34
  text: 天花板不高，卻正好蓋住你所有的心事。
  tags: [welcome]
- id: wl-poem-35
  text: 泡開的茶葉在杯底舒展，像你終於鬆開的手。
  tags: [welcome]
- id: wl-poem-36
  text: 這片地毯踩上去很軟，軟得像被人接住。
  tags: [welcome]
- id: wl-poem-37
  text: 屋子替你把世界調成了靜音。
  tags: [welcome]
- id: wl-poem-38
  text: 你回來了，連塵埃都停在原地不敢驚動你。
  tags: [welcome]
- id: wl-poem-39
  text: 磚牆外頭吵得很，磚牆裡頭只剩你的呼吸。
  tags: [welcome]
- id: wl-poem-40
  text: 這裡不趕人，你想待多久都行。
  tags: [welcome]
