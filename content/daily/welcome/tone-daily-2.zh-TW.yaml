# 歡迎鏈 · 日常感（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-daily-21
  text: 窗邊那束光還在，跟昨天同一個角度。
  tags: [welcome]
- id: wl-daily-22
  text: 茶杯擺在原位，等你順手拿起來。
  tags: [welcome]
- id: wl-daily-23
  text: 外頭忙成什麼樣，這裡都接得住你。
  tags: [welcome]
- id: wl-daily-24
  text: 這扇門不上鎖，你隨時走得回來。
  tags: [welcome]
- id: wl-daily-25
  text: 過了一整天，這片安靜還替你留著。
  tags: [welcome]
- id: wl-daily-26
  text: 坐哪個位子都行，反正都是你的。
  tags: [welcome]
- id: wl-daily-27
  text: 慢一點沒關係，這裡的時間很有耐性。
  tags: [welcome]
- id: wl-daily-28
  text: 就算什麼都不說，待著也很自在。
  tags: [welcome]
- id: wl-daily-29
  text: 熟門熟路地走進來，剛好。
  tags: [welcome]
- id: wl-daily-30
  text: 桌上那盞燈記得你的習慣。
  tags: [welcome]
- id: wl-daily-31
  text: 把鞋子脫了吧，這裡不用撐著。
  tags: [welcome]
- id: wl-daily-32
  text: 空氣裡還有你上次留下的味道。
  tags: [welcome]
- id: wl-daily-33
  text: 天塌下來以前，先在這裡歇一會。
  tags: [welcome]
- id: wl-daily-34
  text: 這個角落安安靜靜地認得你。
  tags: [welcome]
- id: wl-daily-35
  text: 回來以後，肩上那些就放地上吧。
  tags: [welcome]
- id: wl-daily-36
  text: 平常心進來，這裡也是平常的樣子。
  tags: [welcome]
- id: wl-daily-37
  text: 抱枕還在沙發角，等你靠過去。
  tags: [welcome]
- id: wl-daily-38
  text: 每次回來，這裡都在同一個地方等。
  tags: [welcome]
- id: wl-daily-39
  text: 隨便你待多久，這裡不趕人的。
  tags: [welcome]
- id: wl-daily-40
  text: 走這一趟回來，剛好落在安穩裡。
  tags: [welcome]
