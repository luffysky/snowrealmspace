# 歡迎鏈 · 節慶。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-festive-01
  text: 不管外頭多熱鬧，這裡都替你留了一角安靜。
  tags: [welcome]
- id: wl-festive-02
  text: 街上燈火通明的時候，你回到這個只點一盞燈的地方。
  tags: [welcome]
- id: wl-festive-03
  text: 佳節這天，鞭炮和人聲都在門外，門內只有你和熟悉的一切。
  tags: [welcome]
- id: wl-festive-04
  text: 過節的人潮把城裡擠得滿滿，你選了往這裡走。
  tags: [welcome]
- id: wl-festive-05
  text: 團圓的日子總是吵吵鬧鬧，你在這裡也算是回了另一個家。
  tags: [welcome]
- id: wl-festive-06
  text: 節日把每個人都拉去湊熱鬧，這裡剛好空出來等你。
  tags: [welcome]
- id: wl-festive-07
  text: 煙火在別處綻放，這裡的光線一直是柔的，等你坐下。
  tags: [welcome]
- id: wl-festive-08
  text: 連假第一天，你哪裡都沒去，先來了這裡。
  tags: [welcome]
- id: wl-festive-09
  text: 生日這種日子，有人記得就夠了，這個空間一直記得。
  tags: [welcome]
- id: wl-festive-10
  text: 紅包和賀詞在群組裡飛，你關掉螢幕，回到這片安靜。
  tags: [welcome]
- id: wl-festive-11
  text: 別人在圍爐，你在這裡，桌上一樣有替你留的位子。
  tags: [welcome]
- id: wl-festive-12
  text: 逢年過節的忙亂裡，這裡是你可以放下一切的房間。
  tags: [welcome]
- id: wl-festive-13
  text: 新的一年剛翻頁，這裡沒有倒數的喧嘩，只有慢慢走的時間。
  tags: [welcome]
- id: wl-festive-14
  text: 節慶的擁擠讓人有點累，你推開這扇門就鬆了一口氣。
  tags: [welcome]
- id: wl-festive-15
  text: 城市在慶祝，你在這裡休息，兩件事並不衝突。
  tags: [welcome]
- id: wl-festive-16
  text: 家家戶戶都在張燈結綵，這裡只為你亮著。
  tags: [welcome]
- id: wl-festive-17
  text: 熱鬧是別人的，安靜是你的，這裡把安靜整片留給你。
  tags: [welcome]
- id: wl-festive-18
  text: 過年的紛擾都擋在外面，進來以後你就只是你。
  tags: [welcome]
- id: wl-festive-19
  text: 佳節的喧囂散去之前，這裡先替你留好一段獨處。
  tags: [welcome]
- id: wl-festive-20
  text: 節日再盛大，也大不過你想安靜下來的這個念頭，這裡懂。
  tags: [welcome]
