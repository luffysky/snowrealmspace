# 歡迎鏈 · 夜裡回來（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-evening-41
  text: 巷子盡頭那扇窗還亮著，那是替你留的。
  tags: [welcome]
- id: wl-evening-42
  text: 路燈一盞盞把你送到門口，剩下的它接手。
  tags: [welcome]
- id: wl-evening-43
  text: 卸下背包的那一刻，肩膀總算記起了自己的輕。
  tags: [welcome]
- id: wl-evening-44
  text: 茶還溫著，夜再涼也涼不進這個角落。
  tags: [welcome]
- id: wl-evening-45
  text: 抬頭看不見星，低頭這裡就有一盞夠亮的燈。
  tags: [welcome]
- id: wl-evening-46
  text: 收起白日的聲音，夜把柔軟的那面翻給你。
  tags: [welcome]
- id: wl-evening-47
  text: 沙發陷下一小塊，那是留給你靠著的形狀。
  tags: [welcome]
- id: wl-evening-48
  text: 忙到這時候才停下，這裡一直沒關門等你。
  tags: [welcome]
- id: wl-evening-49
  text: 窗簾半掩著夜色，把喧囂都攔在了外頭。
  tags: [welcome]
- id: wl-evening-50
  text: 熱水嘩啦地流，一天的塵埃就這樣沖淡了。
  tags: [welcome]
- id: wl-evening-51
  text: 樓下的車聲遠了，這份靜是特意替你留的。
  tags: [welcome]
- id: wl-evening-52
  text: 摘下錶，時間就不再追著你跑了。
  tags: [welcome]
- id: wl-evening-53
  text: 披上這件舊毛毯，夜就替你把體溫收好。
  tags: [welcome]
- id: wl-evening-54
  text: 走這麼晚回來，這裡的燈始終沒替你熄過。
  tags: [welcome]
- id: wl-evening-55
  text: 冰箱嗡嗡地響，像屋子在替你數著夜的節拍。
  tags: [welcome]
- id: wl-evening-56
  text: 攤開手掌，白天攥著的東西可以先鬆開了。
  tags: [welcome]
- id: wl-evening-57
  text: 檯燈把影子拉長，替你在牆上圈出一塊安穩。
  tags: [welcome]
- id: wl-evening-58
  text: 夜色漫過窗台，這屋裡有你，就不算空。
  tags: [welcome]
- id: wl-evening-59
  text: 靠上椅背深吸一口氣，這裡替你接住這口氣。
  tags: [welcome]
- id: wl-evening-60
  text: 最後一班車也停了，你剛好停靠在這裡。
  tags: [welcome]
