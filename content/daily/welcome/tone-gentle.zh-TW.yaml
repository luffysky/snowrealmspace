# 歡迎鏈 · 溫柔叮嚀。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-gentle-01
  text: 記得喝口水，讓身體暖一暖。
  tags: [welcome]
- id: wl-gentle-02
  text: 坐下來歇一會兒，這裡不趕時間。
  tags: [welcome]
- id: wl-gentle-03
  text: 天氣涼了，多添一件也好。
  tags: [welcome]
- id: wl-gentle-04
  text: 別餓著自己，記得好好吃頓飯。
  tags: [welcome]
- id: wl-gentle-05
  text: 肩膀鬆一鬆，這裡可以慢慢來。
  tags: [welcome]
- id: wl-gentle-06
  text: 眼睛也累了，讓它休息一下下。
  tags: [welcome]
- id: wl-gentle-07
  text: 今天辛苦了，先深深吸一口氣。
  tags: [welcome]
- id: wl-gentle-08
  text: 手邊放杯溫水，想到就喝一口。
  tags: [welcome]
- id: wl-gentle-09
  text: 睏了就閉上眼，這裡替你守著。
  tags: [welcome]
- id: wl-gentle-10
  text: 腳步慢一點也沒關係，路一直都在。
  tags: [welcome]
- id: wl-gentle-11
  text: 忙了一天，記得替自己留點空白。
  tags: [welcome]
- id: wl-gentle-12
  text: 外頭冷，圍巾就在你隨手可及的地方。
  tags: [welcome]
- id: wl-gentle-13
  text: 想吃點什麼就去吃，別委屈了肚子。
  tags: [welcome]
- id: wl-gentle-14
  text: 燈光調柔一些，讓自己舒服最要緊。
  tags: [welcome]
- id: wl-gentle-15
  text: 深呼吸幾次，把緊繃輕輕放掉。
  tags: [welcome]
- id: wl-gentle-16
  text: 起身走幾步，讓身子鬆開來。
  tags: [welcome]
- id: wl-gentle-17
  text: 夜深了，早些鑽進被窩也很好。
  tags: [welcome]
- id: wl-gentle-18
  text: 今天就到這裡吧，剩下的明天再說。
  tags: [welcome]
- id: wl-gentle-19
  text: 手腳冰的話，先搓一搓暖起來。
  tags: [welcome]
- id: wl-gentle-20
  text: 累積了一整天，讓自己安穩地歇下。
  tags: [welcome]
