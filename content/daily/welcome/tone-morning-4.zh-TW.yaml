# 歡迎鏈 · 早晨回來（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-morning-61
  text: 報紙尚未送達，你先一步替這清晨開了門。
  tags: [welcome]
- id: wl-morning-62
  text: 爐火剛升起一點暖，恰好等你坐過來。
  tags: [welcome]
- id: wl-morning-63
  text: 曬衣繩空著整條，一天等你慢慢安排。
  tags: [welcome]
- id: wl-morning-64
  text: 河堤那頭的霧沒散，你這頭已經穩穩落腳。
  tags: [welcome]
- id: wl-morning-65
  text: 你哈出一口白氣，屋裡的暖就把它接了過去。
  tags: [welcome]
- id: wl-morning-66
  text: 剝開橘子的清香散開，桌邊的位子一直是你的。
  tags: [welcome]
- id: wl-morning-67
  text: 樓梯間還留著夜的涼，你上來就成了暖的。
  tags: [welcome]
- id: wl-morning-68
  text: 掛鐘的分針才剛過六，這片安靜先歸你。
  tags: [welcome]
- id: wl-morning-69
  text: 圍巾還沒摘下，這裡的暖已經先繞上你的脖子。
  tags: [welcome]
- id: wl-morning-70
  text: 磨蹭著不想起床也行，這裡替你把早晨延長一點。
  tags: [welcome]
- id: wl-morning-71
  text: 灑水車剛過，路面亮著，你踏進來就更亮了。
  tags: [welcome]
- id: wl-morning-72
  text: 抽屜裡那本記事空著今天，等你慢慢寫。
  tags: [welcome]
- id: wl-morning-73
  text: 爬過窗台的藤蔓沾著露，你來得比陽光還早一些。
  tags: [welcome]
- id: wl-morning-74
  text: 你把睡衣袖子捲起，這一天就從最鬆的地方開始。
  tags: [welcome]
- id: wl-morning-75
  text: 遠山剛描出一道輪廓，你已在近處安頓好自己。
  tags: [welcome]
- id: wl-morning-76
  text: 郵筒還沒人光顧，你是這清晨頭一個被記得的人。
  tags: [welcome]
- id: wl-morning-77
  text: 泡開的燕麥還冒著熱，這張桌子替你留了整個上午。
  tags: [welcome]
- id: wl-morning-78
  text: 抖開一條乾淨的毛巾，新的一天也跟著攤平了。
  tags: [welcome]
- id: wl-morning-79
  text: 洗過臉的涼還掛在頰上，你就清醒地坐進了這裡。
  tags: [welcome]
- id: wl-morning-80
  text: 你輕輕帶上門，把昨天留在門外，今天只剩你。
  tags: [welcome]
