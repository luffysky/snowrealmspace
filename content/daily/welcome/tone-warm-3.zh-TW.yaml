# 歡迎鏈 · 溫暖直接（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-41
  text: 把外頭的雨都關在門外，這裡是乾的。
  tags: [welcome]
- id: wl-warm-42
  text: 慢慢脫下今天，這裡不趕你走。
  tags: [welcome]
- id: wl-warm-43
  text: 這一室的安靜，是特地為你留的。
  tags: [welcome]
- id: wl-warm-44
  text: 沙發還記得你窩著時的形狀。
  tags: [welcome]
- id: wl-warm-45
  text: 走了一整天的人，終於有地方好好坐下。
  tags: [welcome]
- id: wl-warm-46
  text: 就算只是發呆，這裡也奉陪到底。
  tags: [welcome]
- id: wl-warm-47
  text: 燈光特地調成你最喜歡的暖，不刺眼。
  tags: [welcome]
- id: wl-warm-48
  text: 肩上那些重的，進了門就可以先擱著。
  tags: [welcome]
- id: wl-warm-49
  text: 熟悉的味道一飄過來，你就知道到家了。
  tags: [welcome]
- id: wl-warm-50
  text: 整晚不說一個字也行，這裡不嫌你悶。
  tags: [welcome]
- id: wl-warm-51
  text: 煩心的事先擱著，這裡會替你看顧一陣。
  tags: [welcome]
- id: wl-warm-52
  text: 窗外再冷，這一格空間始終是溫的。
  tags: [welcome]
- id: wl-warm-53
  text: 疲憊到了門口就停住，進來的只有你。
  tags: [welcome]
- id: wl-warm-54
  text: 那本沒讀完的書，還停在你放下的那頁。
  tags: [welcome]
- id: wl-warm-55
  text: 最會把你穩穩接住的，就是這個地方。
  tags: [welcome]
- id: wl-warm-56
  text: 喧囂都留在門外了，這裡只剩你和安穩。
  tags: [welcome]
- id: wl-warm-57
  text: 不必撐著給誰看，這裡收下的是真的你。
  tags: [welcome]
- id: wl-warm-58
  text: 屋裡的暖，是照著你的樣子養出來的。
  tags: [welcome]
- id: wl-warm-59
  text: 這面牆靠過你無數回，今晚照樣穩穩的。
  tags: [welcome]
- id: wl-warm-60
  text: 回到這裡，時間才肯替你慢下來。
  tags: [welcome]
