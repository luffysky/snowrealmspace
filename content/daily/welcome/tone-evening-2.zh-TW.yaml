# 歡迎鏈 · 夜裡回來（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-evening-21
  text: 星星都出來了，你也回到了自己的位置。
  tags: [welcome]
- id: wl-evening-22
  text: 熄了外頭的燈之後，這一盞才是你的。
  tags: [welcome]
- id: wl-evening-23
  text: 走了那麼遠的路，終究還是拐回這裡。
  tags: [welcome]
- id: wl-evening-24
  text: 枕著這片夜色，肩膀可以慢慢鬆下來。
  tags: [welcome]
- id: wl-evening-25
  text: 時鐘走到這一格，剛好是屬於你的鐘點。
  tags: [welcome]
- id: wl-evening-26
  text: 白日裡沒說出口的，夜裡都替你收著。
  tags: [welcome]
- id: wl-evening-27
  text: 屋簷底下有微光，那是為晚歸的你點的。
  tags: [welcome]
- id: wl-evening-28
  text: 把鞋子擱在門口，剩下的路交給沙發就好。
  tags: [welcome]
- id: wl-evening-29
  text: 這座城市睏了，只有這扇窗還替你亮著。
  tags: [welcome]
- id: wl-evening-30
  text: 晚風吹了一路，把你妥妥地送到了這裡。
  tags: [welcome]
- id: wl-evening-31
  text: 今夜不必趕什麼，時間願意陪你慢慢耗。
  tags: [welcome]
- id: wl-evening-32
  text: 月光斜斜落在桌角，像替你留的一盞小夜燈。
  tags: [welcome]
- id: wl-evening-33
  text: 熬了整天的你，此刻總算有地方擱著疲憊。
  tags: [welcome]
- id: wl-evening-34
  text: 夜這麼深，你還願意回來，這裡很珍惜。
  tags: [welcome]
- id: wl-evening-35
  text: 關上門，外頭的紛擾就被隔在另一個世界。
  tags: [welcome]
- id: wl-evening-36
  text: 被褥般的安靜圍上來，把你整個人裹住。
  tags: [welcome]
- id: wl-evening-37
  text: 熄燈前的最後一段時光，留給你和自己。
  tags: [welcome]
- id: wl-evening-38
  text: 你帶回一身夜色，這裡替你烘得暖暖的。
  tags: [welcome]
- id: wl-evening-39
  text: 走廊的燈感應到你，一路替你亮到底。
  tags: [welcome]
- id: wl-evening-40
  text: 這晚有你落腳，屋子才算真正睡得安穩。
  tags: [welcome]
