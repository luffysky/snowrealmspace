# 歡迎鏈 · 軟性打氣（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-soft-41
  text: 進門這一刻，外面的事就交給門擋著。
  tags: [welcome]
- id: wl-soft-42
  text: 燈替你留著，多晚回來都不會是暗的。
  tags: [welcome]
- id: wl-soft-43
  text: 這裡記得你的模樣，不必重新交代自己。
  tags: [welcome]
- id: wl-soft-44
  text: 手上的事先擱下，這裡會替你看顧時間。
  tags: [welcome]
- id: wl-soft-45
  text: 縮成一小團也可以，這裡的空間夠柔軟。
  tags: [welcome]
- id: wl-soft-46
  text: 把呼吸放長，這裡的空氣是留給你的。
  tags: [welcome]
- id: wl-soft-47
  text: 心事收著進來也行，這裡不催你倒出來。
  tags: [welcome]
- id: wl-soft-48
  text: 想發呆就發呆，這裡不會當那是浪費。
  tags: [welcome]
- id: wl-soft-49
  text: 說不出口的委屈，這裡願意等它慢慢浮上來。
  tags: [welcome]
- id: wl-soft-50
  text: 你回來的每一次，這裡都悄悄記成好事。
  tags: [welcome]
- id: wl-soft-51
  text: 坐進最角落也行，那個位子替你空著。
  tags: [welcome]
- id: wl-soft-52
  text: 做不成的那些，這裡替你輕輕挪到一旁。
  tags: [welcome]
- id: wl-soft-53
  text: 讓眼睛歇一會，這裡的光不會刺你。
  tags: [welcome]
- id: wl-soft-54
  text: 帶著沒說完的一天回來，這裡聽得下去。
  tags: [welcome]
- id: wl-soft-55
  text: 手腳冷的日子，這裡一直是暖的。
  tags: [welcome]
- id: wl-soft-56
  text: 把心裡打結的地方鬆開，這裡有的是時間。
  tags: [welcome]
- id: wl-soft-57
  text: 就算腳步很沉，這裡的地板穩穩接著。
  tags: [welcome]
- id: wl-soft-58
  text: 不想笑的時候不用勉強，這裡收得下你的臉色。
  tags: [welcome]
- id: wl-soft-59
  text: 你只要走到這，剩下的交給這裡就好。
  tags: [welcome]
- id: wl-soft-60
  text: 這一刻是你的，誰也不會來討走。
  tags: [welcome]
