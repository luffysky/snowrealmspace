# 歡迎鏈 · 溫暖直接（第六批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-warm-101
  text: 這裡不需要你變好才肯收你，本來的樣子就夠。
  tags: [welcome]
- id: wl-warm-102
  text: 你今天丟了什麼、輸了什麼，一進門都不算數。
  tags: [welcome]
- id: wl-warm-103
  text: 就算搞砸了整天，這裡照樣替你留著那頓晚飯。
  tags: [welcome]
- id: wl-warm-104
  text: 你哭花的臉，這裡見過很多回，從不當一回事。
  tags: [welcome]
- id: wl-warm-105
  text: 別人記的是你的頭銜，這裡只記你的名字。
  tags: [welcome]
- id: wl-warm-106
  text: 你在外頭弄丟的力氣，這裡一點一點還給你。
  tags: [welcome]
- id: wl-warm-107
  text: 這裡收得下你的疲憊，也收得下你的沉默。
  tags: [welcome]
- id: wl-warm-108
  text: 你把盔甲卸在門口，這裡摟住的是最軟的那個你。
  tags: [welcome]
- id: wl-warm-109
  text: 這裡替你把「應付」兩個字，關在了門外。
  tags: [welcome]
- id: wl-warm-110
  text: 你回來得再晚，這裡都當你剛剛好。
  tags: [welcome]
- id: wl-warm-111
  text: 就算全世界都在趕，這裡偏要陪著你慢。
  tags: [welcome]
- id: wl-warm-112
  text: 你缺的那一點安穩，這裡向來管夠。
  tags: [welcome]
- id: wl-warm-113
  text: 這裡不查你去了哪、做了什麼，只在乎你回來了。
  tags: [welcome]
- id: wl-warm-114
  text: 你今天被誰為難了，這裡都想替你討回一點暖。
  tags: [welcome]
- id: wl-warm-115
  text: 這裡替你記著，那些連你自己都忘了的好。
  tags: [welcome]
- id: wl-warm-116
  text: 你當了一整天的大人，這裡讓你當回自己。
  tags: [welcome]
- id: wl-warm-117
  text: 這裡熱著飯，也熱著一句等你很久的「回來啦」。
  tags: [welcome]
- id: wl-warm-118
  text: 你不必贏過誰才配待在這，這扇門一直就是你的。
  tags: [welcome]
- id: wl-warm-119
  text: 就算你今天什麼都沒做成，這裡照樣為你把燈點上。
  tags: [welcome]
- id: wl-warm-120
  text: 你把重的那半個自己交過來，這裡替你扛一晚。
  tags: [welcome]
