# 歡迎鏈 · 軟性打氣（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-soft-21
  text: 門後的一切都能等，先讓自己喘口氣。
  tags: [welcome]
- id: wl-soft-22
  text: 走到這裡就算數了，其餘的都是多的。
  tags: [welcome]
- id: wl-soft-23
  text: 就算兩手空空，這裡也一樣為你留著位子。
  tags: [welcome]
- id: wl-soft-24
  text: 撐了一整天，現在換這裡撐著你。
  tags: [welcome]
- id: wl-soft-25
  text: 亂糟糟的心情帶進來也行，沒有人會嫌。
  tags: [welcome]
- id: wl-soft-26
  text: 慢半拍的日子，一樣是被好好收下的日子。
  tags: [welcome]
- id: wl-soft-27
  text: 什麼都想不清楚也沒關係，先靠著坐一會。
  tags: [welcome]
- id: wl-soft-28
  text: 給自己一點空白，這裡不會催你填滿。
  tags: [welcome]
- id: wl-soft-29
  text: 力氣用完了就先擱著，這裡替你守著。
  tags: [welcome]
- id: wl-soft-30
  text: 回到熟悉的地方，本身就是一種休息。
  tags: [welcome]
- id: wl-soft-31
  text: 別急著整理今天，它會自己慢慢沉下去。
  tags: [welcome]
- id: wl-soft-32
  text: 卸下來吧，這裡不需要你隨時站得直挺挺。
  tags: [welcome]
- id: wl-soft-33
  text: 就算只是路過坐一下，也一樣被歡迎。
  tags: [welcome]
- id: wl-soft-34
  text: 疲憊不用先藏起來，這裡看得懂它。
  tags: [welcome]
- id: wl-soft-35
  text: 想安靜就安靜，沉默在這裡是被容許的。
  tags: [welcome]
- id: wl-soft-36
  text: 沒做成的那些，今天先不追究了。
  tags: [welcome]
- id: wl-soft-37
  text: 讓步調鬆下來，這裡跟得上任何速度。
  tags: [welcome]
- id: wl-soft-38
  text: 心裡的重，先放在門邊，進來歇著。
  tags: [welcome]
- id: wl-soft-39
  text: 就這樣待著也很好，不必變成更好的誰。
  tags: [welcome]
- id: wl-soft-40
  text: 願意回來，就已經對自己很溫柔了。
  tags: [welcome]
