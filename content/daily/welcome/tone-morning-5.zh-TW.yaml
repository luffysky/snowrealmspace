# 歡迎鏈 · 早晨回來（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-morning-81
  text: 巷口的早餐店冒起白煙，你也剛好轉進這裡。
  tags: [welcome]
- id: wl-morning-82
  text: 昨夜的夢尚未散盡，你就把腳步輕輕落回了這裡。
  tags: [welcome]
- id: wl-morning-83
  text: 曬台上的棉被還帶著陽光的味道，你進門就沾了一身暖。
  tags: [welcome]
- id: wl-morning-84
  text: 剛燒好的開水在壺裡靜著，這一角一直替你溫著。
  tags: [welcome]
- id: wl-morning-85
  text: 你揉開惺忪的眼，這裡的光正好不刺眼。
  tags: [welcome]
- id: wl-morning-86
  text: 樓下的鐵門才拉開一半，你先一步安頓在這片安靜裡。
  tags: [welcome]
- id: wl-morning-87
  text: 晨霧貼著玻璃慢慢化開，你就在化開的地方坐了下來。
  tags: [welcome]
- id: wl-morning-88
  text: 掛在牆上的月曆翻到今天，這一格空著等你。
  tags: [welcome]
- id: wl-morning-89
  text: 冰箱門開了又關，你把早晨的第一口涼收進了掌心。
  tags: [welcome]
- id: wl-morning-90
  text: 你踩著拖鞋走過來，木地板替你記著每一步的輕。
  tags: [welcome]
- id: wl-morning-91
  text: 清早的第一通鳥鳴落下，這裡替你把它接住。
  tags: [welcome]
- id: wl-morning-92
  text: 昨晚讀到一半的信攤在桌上，晨光替你翻到了下一頁。
  tags: [welcome]
- id: wl-morning-93
  text: 你把窗台的水杯挪回原位，一天就從這個小動作展開。
  tags: [welcome]
- id: wl-morning-94
  text: 熱毛巾敷過臉，睡意退去，你清清醒醒回到了這裡。
  tags: [welcome]
- id: wl-morning-95
  text: 巷弄裡的腳踏車鈴響過，你已經穩穩落腳在這片暖。
  tags: [welcome]
- id: wl-morning-96
  text: 你伸手接住一縷斜進屋的光，這裡替你把它留住。
  tags: [welcome]
- id: wl-morning-97
  text: 廚房飄來蛋香，桌邊那把椅子從昨天就等著你。
  tags: [welcome]
- id: wl-morning-98
  text: 你把亂了一夜的頭髮撥順，早晨也跟著服貼下來。
  tags: [welcome]
- id: wl-morning-99
  text: 陽台的風鈴輕輕搖了搖，像替剛到的你打了聲招呼。
  tags: [welcome]
- id: wl-morning-100
  text: 你坐進晨光裡，一整個上午就這樣妥妥地歸你。
  tags: [welcome]
