# 歡迎鏈 · 天氣意象（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-weatherly-41
  text: 春分的日照剛好把白晝和黑夜分成兩半，你踩著這份平衡回到門前。
  tags: [welcome]
- id: wl-weatherly-42
  text: 融雪的水沿著屋簷滴成一串，你聽著那節奏進門，這裡的暖正接手融化你。
  tags: [welcome]
- id: wl-weatherly-43
  text: 悶了整天的雲終於裂開一道縫，光就順著那道縫落在你進門的肩上。
  tags: [welcome]
- id: wl-weatherly-44
  text: 焚風把山那頭的熱氣灌了過來，這裡的陰涼像一層薄毯，替你隔開燥意。
  tags: [welcome]
- id: wl-weatherly-45
  text: 初秋的第一陣涼意鑽進袖口，你縮著肩進來，這裡的暖先一步等在門內。
  tags: [welcome]
- id: wl-weatherly-46
  text: 冰晶掛滿了電線閃著光，你踏過一路脆響，回到這個不必防滑的安穩地板。
  tags: [welcome]
- id: wl-weatherly-47
  text: 潮汐把海風推得一陣強一陣弱，你逆著它走回來，門後的空氣穩穩不動。
  tags: [welcome]
- id: wl-weatherly-48
  text: 積雨雲在頭頂堆成一座灰山，你趕在它塌下來前進門，這裡替你擋住那場傾盆。
  tags: [welcome]
- id: wl-weatherly-49
  text: 乾季的塵土讓每口呼吸都發澀，這裡的空氣潤潤的，等你把喉頭的乾放下。
  tags: [welcome]
- id: wl-weatherly-50
  text: 極光在很北的地方翻動色彩，你不必遠行，這裡的暖光就夠你看一整晚。
  tags: [welcome]
- id: wl-weatherly-51
  text: 冷氣團南下的頭一夜，街上的溫度計一路往下掉，這裡的數字卻穩穩不動。
  tags: [welcome]
- id: wl-weatherly-52
  text: 午後的積雲把陽光切成一塊塊光斑，你踩著那片碎光，走回這裡的整片明亮。
  tags: [welcome]
- id: wl-weatherly-53
  text: 春雨綿密得像沒有盡頭，你撐著傘進來，這裡的乾燥像替你按下了暫停。
  tags: [welcome]
- id: wl-weatherly-54
  text: 白露節氣一到，草上的水珠一顆比一顆重，你抖落那身涼，這裡先烘好了暖。
  tags: [welcome]
- id: wl-weatherly-55
  text: 落山風把海邊的旗子扯得筆直，你背著它回來，門一關就把呼嘯留在外頭。
  tags: [welcome]
- id: wl-weatherly-56
  text: 高氣壓把天空撐得又高又藍，你把那片開闊帶進門，這裡替你收得好好的。
  tags: [welcome]
- id: wl-weatherly-57
  text: 夜裡的凝露在玻璃上匯成細流，你隔著那層水看見裡頭的燈，正等你推門。
  tags: [welcome]
- id: wl-weatherly-58
  text: 雨絲被路燈染成一片金黃時，你穿過那片光回來，這裡的暖比燈色更長久。
  tags: [welcome]
- id: wl-weatherly-59
  text: 大寒這天冷到骨子裡，全城都躲進屋內，這裡的暖光是特地為你留的那一格。
  tags: [welcome]
- id: wl-weatherly-60
  text: 晨霧在日出後慢慢退散，你踩著最後一縷白進門，這裡的清明一直在等你。
  tags: [welcome]
