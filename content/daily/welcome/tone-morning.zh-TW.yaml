# 歡迎鏈 · 早晨回來。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-morning-01
  text: 早晨好，你來了，這裡也醒了。
  tags: [welcome]
- id: wl-morning-02
  text: 晨光剛落在窗邊，正好等到你。
  tags: [welcome]
- id: wl-morning-03
  text: 你回來的時候，一天才算真正開始。
  tags: [welcome]
- id: wl-morning-04
  text: 咖啡的香氣還在，這裡一直為你留著位子。
  tags: [welcome]
- id: wl-morning-05
  text: 天亮沒多久，你就找到了回來的路。
  tags: [welcome]
- id: wl-morning-06
  text: 空氣裡有清晨的涼，你一進門就暖了起來。
  tags: [welcome]
- id: wl-morning-07
  text: 這個角落睡了一夜，聽見你的腳步就亮了。
  tags: [welcome]
- id: wl-morning-08
  text: 新的一天攤在眼前，你不必急著走進它。
  tags: [welcome]
- id: wl-morning-09
  text: 窗外的光慢慢鋪開，你在這裡剛剛好。
  tags: [welcome]
- id: wl-morning-10
  text: 早起的人有早起的安靜，這份安靜是你的。
  tags: [welcome]
- id: wl-morning-11
  text: 你踏進來的瞬間，整個空間輕輕呼吸了一下。
  tags: [welcome]
- id: wl-morning-12
  text: 昨夜的一切都收好了，今天從這裡重新展開。
  tags: [welcome]
- id: wl-morning-13
  text: 這裡的燈不用開，晨光已經幫你點亮。
  tags: [welcome]
- id: wl-morning-14
  text: 你來得剛好，鳥叫和光線都還新鮮。
  tags: [welcome]
- id: wl-morning-15
  text: 一杯茶的時間，讓自己慢慢從夢裡走出來。
  tags: [welcome]
- id: wl-morning-16
  text: 清晨屬於未被打擾的人，這片刻是你的。
  tags: [welcome]
- id: wl-morning-17
  text: 你回到這裡，像回到一個從不催你的地方。
  tags: [welcome]
- id: wl-morning-18
  text: 世界剛睜開眼，你已經有了落腳的地方。
  tags: [welcome]
- id: wl-morning-19
  text: 桌上還留著昨天的樣子，它認得你。
  tags: [welcome]
- id: wl-morning-20
  text: 今天的第一縷光，是先為你留下的。
  tags: [welcome]
