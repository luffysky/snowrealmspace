# 歡迎鏈 · 疲憊時回來。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-tired-01
  text: 累了吧，回來就先什麼都別想。
  tags: [welcome]
- id: wl-tired-02
  text: 這裡不用交代什麼，坐下就好。
  tags: [welcome]
- id: wl-tired-03
  text: 燈幫你留著，癱著也沒關係。
  tags: [welcome]
- id: wl-tired-04
  text: 進門那一刻，肩上的東西可以先放地上。
  tags: [welcome]
- id: wl-tired-05
  text: 沒力氣說話也行，我都懂。
  tags: [welcome]
- id: wl-tired-06
  text: 外面的事就擋在門外，這裡只剩你。
  tags: [welcome]
- id: wl-tired-07
  text: 想發呆多久都可以，時間在這裡是軟的。
  tags: [welcome]
- id: wl-tired-08
  text: 把自己整個丟進來，剩下的交給這個空間。
  tags: [welcome]
- id: wl-tired-09
  text: 沒有人在這裡等你解釋今天。
  tags: [welcome]
- id: wl-tired-10
  text: 什麼都不做也可以，就只是喘口氣。
  tags: [welcome]
- id: wl-tired-11
  text: 沙發一直空著，等的就是這樣累壞的你。
  tags: [welcome]
- id: wl-tired-12
  text: 回來了就好，別的以後再說。
  tags: [welcome]
- id: wl-tired-13
  text: 這裡不需要你撐著，靠著就行。
  tags: [welcome]
- id: wl-tired-14
  text: 全身的重量，這個地方接得住。
  tags: [welcome]
- id: wl-tired-15
  text: 卸下來吧，這裡不會問你為什麼這麼累。
  tags: [welcome]
- id: wl-tired-16
  text: 累到不想動的時候，這裡最適合。
  tags: [welcome]
- id: wl-tired-17
  text: 世界的音量，一進來就自動調小了。
  tags: [welcome]
- id: wl-tired-18
  text: 你不必是完好的樣子才能進來。
  tags: [welcome]
- id: wl-tired-19
  text: 疲憊也是你的一部分，帶進來沒關係。
  tags: [welcome]
- id: wl-tired-20
  text: 慢慢來，這裡沒有下一件事在排隊。
  tags: [welcome]
