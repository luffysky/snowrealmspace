# 歡迎鏈 · 踏實安定（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-ground-41
  text: 鑰匙一直放在你知道的那個地方，伸手就有。
  tags: [welcome]
- id: wl-ground-42
  text: 這裡的空氣壓得很穩，呼吸跟著就慢了下來。
  tags: [welcome]
- id: wl-ground-43
  text: 牆上的釘子還牢牢釘著，掛什麼上去都不會掉。
  tags: [welcome]
- id: wl-ground-44
  text: 地窖裡的存糧夠撐過任何一個冬天。
  tags: [welcome]
- id: wl-ground-45
  text: 這片屋頂替你擋過的雨，多到數不清。
  tags: [welcome]
- id: wl-ground-46
  text: 燈塔的光轉一圈又一圈，總會掃回你這一邊。
  tags: [welcome]
- id: wl-ground-47
  text: 門檻被磨得很平，進出都不絆你的腳。
  tags: [welcome]
- id: wl-ground-48
  text: 就算全世界都在搬家，這個地址也不會改。
  tags: [welcome]
- id: wl-ground-49
  text: 桌腳墊得很實，你放下手的時候不會晃。
  tags: [welcome]
- id: wl-ground-50
  text: 灶上那口鍋一直溫著，你回來就有熱的。
  tags: [welcome]
- id: wl-ground-51
  text: 磚縫裡的水泥早就乾透，一塊都鬆不了。
  tags: [welcome]
- id: wl-ground-52
  text: 這裡的地基比你想的還深，撐得住更重的日子。
  tags: [welcome]
- id: wl-ground-53
  text: 圍牆把野風攔在外頭，院子裡永遠是靜的。
  tags: [welcome]
- id: wl-ground-54
  text: 這盞燈的油我替你添滿了，燒到天亮沒問題。
  tags: [welcome]
- id: wl-ground-55
  text: 走廊的盡頭一直是同一扇門，你不會走錯。
  tags: [welcome]
- id: wl-ground-56
  text: 牆上的時鐘走得很穩，不快也不慢。
  tags: [welcome]
- id: wl-ground-57
  text: 你踩過的每一級台階，都記得替你受力。
  tags: [welcome]
- id: wl-ground-58
  text: 屋樑上積的灰，是替你守著、沒動過的證據。
  tags: [welcome]
- id: wl-ground-59
  text: 這塊招牌掛了很久，風吹日曬也沒歪一分。
  tags: [welcome]
- id: wl-ground-60
  text: 落地生根的東西不怕搬遷，這裡就是你的根。
  tags: [welcome]
