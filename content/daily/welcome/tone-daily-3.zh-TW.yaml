# 歡迎鏈 · 日常感（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-daily-41
  text: 剛好趕上這裡的午後，光都還沒走。
  tags: [welcome]
- id: wl-daily-42
  text: 拖鞋在門口擺正了，你一踏進來就有得穿。
  tags: [welcome]
- id: wl-daily-43
  text: 冰箱裡還留著你上次沒喝完的那一瓶。
  tags: [welcome]
- id: wl-daily-44
  text: 你進門的聲音，這裡一聽就知道是你。
  tags: [welcome]
- id: wl-daily-45
  text: 今天也一樣，什麼都不必特別準備。
  tags: [welcome]
- id: wl-daily-46
  text: 水壺剛燒開，你來得正是時候。
  tags: [welcome]
- id: wl-daily-47
  text: 外套隨手往掛勾上一掛，這裡不挑你今天的樣子。
  tags: [welcome]
- id: wl-daily-48
  text: 日曆翻到今天，這裡照樣替你留了一頁。
  tags: [welcome]
- id: wl-daily-49
  text: 你回來這件事，本身就夠平常了。
  tags: [welcome]
- id: wl-daily-50
  text: 收音機還開在同一個頻道，跟你走的時候一樣。
  tags: [welcome]
- id: wl-daily-51
  text: 桌上的碗筷擺了兩副，本來就算你一份。
  tags: [welcome]
- id: wl-daily-52
  text: 窗簾是半開的，跟你習慣的那個樣子一樣。
  tags: [welcome]
- id: wl-daily-53
  text: 包包隨手往沙發上一丟，這裡不會嫌亂。
  tags: [welcome]
- id: wl-daily-54
  text: 你不在的這段時間，這裡只是安安靜靜地等著。
  tags: [welcome]
- id: wl-daily-55
  text: 燈的開關還在你摸得到的地方，沒挪過。
  tags: [welcome]
- id: wl-daily-56
  text: 今天過得如何都行，這裡照收不誤。
  tags: [welcome]
- id: wl-daily-57
  text: 進來先坐著喘口氣，別的等等再說。
  tags: [welcome]
- id: wl-daily-58
  text: 這裡的傍晚跟昨天一樣，慢慢暗下來。
  tags: [welcome]
- id: wl-daily-59
  text: 掛勾上還留著你的傘，這裡一直替你收著。
  tags: [welcome]
- id: wl-daily-60
  text: 一天到頭，能這樣走回來就夠了。
  tags: [welcome]
