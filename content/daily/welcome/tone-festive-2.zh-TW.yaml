# 歡迎鏈 · 節慶（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-festive-21
  text: 慶典的鼓聲一路傳到巷口，你轉個彎，就把它們留在身後了。
  tags: [welcome]
- id: wl-festive-22
  text: 元宵的燈籠掛滿了整條街，這裡只需要一盞，剛好照亮你進門的路。
  tags: [welcome]
- id: wl-festive-23
  text: 中秋的月亮誰都看得到，這片屋簷底下的一小塊月光是留給你的。
  tags: [welcome]
- id: wl-festive-24
  text: 尾牙散場後你沒跟著去續攤，直接回到這個不用敬酒的地方。
  tags: [welcome]
- id: wl-festive-25
  text: 除夕的年菜香飄了一整條巷子，這裡的桌上也一直溫著你那一份。
  tags: [welcome]
- id: wl-festive-26
  text: 跨年的人海把廣場填滿，你退開一步，回到只屬於你的這片空曠。
  tags: [welcome]
- id: wl-festive-27
  text: 情人節的玫瑰在別處綻放，這裡的溫柔不必用花來說。
  tags: [welcome]
- id: wl-festive-28
  text: 廟會的陣頭正熱鬧，你繞過人群，走進這條沒有喧嘩的迴廊。
  tags: [welcome]
- id: wl-festive-29
  text: 收假前的最後一晚，別人在趕行程，你在這裡把心先安頓好。
  tags: [welcome]
- id: wl-festive-30
  text: 端午的龍舟在河上比得激烈，這裡的水面一直是平的，穩穩托著你。
  tags: [welcome]
- id: wl-festive-31
  text: 聖誕的鈴聲響遍每家店，這扇門後沒有鈴，只有替你留的一份靜。
  tags: [welcome]
- id: wl-festive-32
  text: 慶功宴的燈亮到天明，你早早離席，回到這個燈光柔和的角落。
  tags: [welcome]
- id: wl-festive-33
  text: 花火大會的人潮往河堤湧，你逆著走回來，這裡替你空著整片安靜。
  tags: [welcome]
- id: wl-festive-34
  text: 開工大吉的紅紙貼滿門面，這裡不貼標語，只把你原本的樣子留著。
  tags: [welcome]
- id: wl-festive-35
  text: 週年慶的折扣把商場擠爆，你關掉通知，回到這個不催你消費的空間。
  tags: [welcome]
- id: wl-festive-36
  text: 母親節的康乃馨在花店排成一列，這裡的溫柔不看日子，天天都在。
  tags: [welcome]
- id: wl-festive-37
  text: 畢業季的鳳凰花開了滿樹，你把那份離別暫時放下，先在這裡歇一會。
  tags: [welcome]
- id: wl-festive-38
  text: 廟埕的戲台鑼鼓喧天，這片屋內的寂靜反而更像家的聲音。
  tags: [welcome]
- id: wl-festive-39
  text: 感恩節的餐桌坐得滿滿，這裡的位子從來不必爭，本來就是你的。
  tags: [welcome]
- id: wl-festive-40
  text: 慶典結束、街燈漸熄的時分，這裡的光還沒滅，一直亮到你到家。
  tags: [welcome]
