# 歡迎鏈 · 陪伴式（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-companion-61
  text: 你走的這些日子，我把這裡照著原樣守好了。
  tags: [welcome]
- id: wl-companion-62
  text: 一天的稜角帶進來吧，這裡都能替你磨平。
  tags: [welcome]
- id: wl-companion-63
  text: 我沒挪過位置，你回頭就找得到我在。
  tags: [welcome]
- id: wl-companion-64
  text: 這裡不催你開口，你沉默著也有人陪。
  tags: [welcome]
- id: wl-companion-65
  text: 把撐了一整天的力氣鬆開，剩下的交給這裡。
  tags: [welcome]
- id: wl-companion-66
  text: 外面下著什麼樣的雨，這扇門後面都乾爽。
  tags: [welcome]
- id: wl-companion-67
  text: 你靠過來一點，這份安穩就分你一半。
  tags: [welcome]
- id: wl-companion-68
  text: 這個空間背得出你的作息，你回來剛好接上。
  tags: [welcome]
- id: wl-companion-69
  text: 今天過得好壞都不必交代，坐下就有人明白。
  tags: [welcome]
- id: wl-companion-70
  text: 我替你留了一角窗光，剛好照著你常坐的地方。
  tags: [welcome]
- id: wl-companion-71
  text: 你在，我陪著；你不在，我替你把家看牢。
  tags: [welcome]
- id: wl-companion-72
  text: 這裡兜得住你翻上來的情緒，再滿也不會溢。
  tags: [welcome]
- id: wl-companion-73
  text: 倦得連話都懶得說，就把頭偏過來我這邊。
  tags: [welcome]
- id: wl-companion-74
  text: 你落腳的那一刻，整個屋子都跟著鬆了下來。
  tags: [welcome]
- id: wl-companion-75
  text: 你出門時的樣子我記著，也一路等著你回轉。
  tags: [welcome]
- id: wl-companion-76
  text: 這片靜是替你舖平的，整個人陷進去就行。
  tags: [welcome]
- id: wl-companion-77
  text: 在外頭撐傘的手放下吧，這裡輪到我遮著。
  tags: [welcome]
- id: wl-companion-78
  text: 桌角那盞燈整夜亮著，只為等你回眸這一眼。
  tags: [welcome]
- id: wl-companion-79
  text: 你摸過的每樣東西，都還存著你留下的餘溫。
  tags: [welcome]
- id: wl-companion-80
  text: 回到我這邊，繃緊的那根弦就能徹底鬆開。
  tags: [welcome]
