# 歡迎鏈 · 詩意留白（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-81
  text: 銀河繞著屋脊走了半圈，你已經到家了。
  tags: [welcome]
- id: wl-poem-82
  text: 門環叩響那一下，牆裡的靜就替你讓出一條路。
  tags: [welcome]
- id: wl-poem-83
  text: 屋後的竹林沙沙，替你把最後幾步路數完。
  tags: [welcome]
- id: wl-poem-84
  text: 老狗在門邊抬了抬頭，認得是你，又安心睡回去。
  tags: [welcome]
- id: wl-poem-85
  text: 灶膛裡的柴還紅著，替一屋子留著白天的暖。
  tags: [welcome]
- id: wl-poem-86
  text: 蚊帳把床圈成一頂小小的白帳篷，只住你一個。
  tags: [welcome]
- id: wl-poem-87
  text: 蒲扇擱在竹席上，搖過的風還留在屋裡沒散。
  tags: [welcome]
- id: wl-poem-88
  text: 醃菜的甕封得好好的，等你回來一起過冬。
  tags: [welcome]
- id: wl-poem-89
  text: 紗窗把蟲鳴濾成細細一片，鋪在你耳邊。
  tags: [welcome]
- id: wl-poem-90
  text: 池塘睡了，荷葉替你把月亮兜在水面上。
  tags: [welcome]
- id: wl-poem-91
  text: 木窗欞把夜切成一格一格，一格都關不進你的夢。
  tags: [welcome]
- id: wl-poem-92
  text: 院子裡的桂樹開了，一整院的香都在等你回來聞。
  tags: [welcome]
- id: wl-poem-93
  text: 銅鎖在門上守了一天，你一轉，它就鬆了口氣。
  tags: [welcome]
- id: wl-poem-94
  text: 掛在牆上的蓑衣還滴著雨，屋裡的你是乾爽的。
  tags: [welcome]
- id: wl-poem-95
  text: 火盆邊的凳子空著，紅光正好烘你剛回來的手。
  tags: [welcome]
- id: wl-poem-96
  text: 屋簷下的燕子歸了巢，你也歸了你的巢。
  tags: [welcome]
- id: wl-poem-97
  text: 井台邊的水桶靜靜垂著，這口井養了這個家一整代人。
  tags: [welcome]
- id: wl-poem-98
  text: 老藤爬滿了半面牆，替這屋子把風擋在葉子外頭。
  tags: [welcome]
- id: wl-poem-99
  text: 竹席透著一層涼，夜就這樣輕輕貼上你的背。
  tags: [welcome]
- id: wl-poem-100
  text: 夜把最後一點光都讓給了這扇窗，你正好推門進來。
  tags: [welcome]
