# 歡迎鏈 · 老友般（第六批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-101
  text: 那副牌還攤在桌上，就缺你這咖湊一圈。
  tags: [welcome]
- id: wl-buddy-102
  text: 你藏在櫃底那包泡麵我沒動，餓了自己下鍋。
  tags: [welcome]
- id: wl-buddy-103
  text: 缺了角的那個馬克杯是你的，別人伸手我還不給。
  tags: [welcome]
- id: wl-buddy-104
  text: 上次你紅著眼那樁事，出了這道門我一個字沒漏。
  tags: [welcome]
- id: wl-buddy-105
  text: 欠我那頓飯我記著，可從不放心上催你。
  tags: [welcome]
- id: wl-buddy-106
  text: 翻到那本相簿，我倆的糗照笑得我一個人在這樂。
  tags: [welcome]
- id: wl-buddy-107
  text: 歌單那套口味我背得滾瓜爛熟，隨手就切給你。
  tags: [welcome]
- id: wl-buddy-108
  text: 門口那台老車我幫你顧著，鑰匙照樣掛牆上。
  tags: [welcome]
- id: wl-buddy-109
  text: 陽台你順手種的那盆，我照三餐澆，活得比你勤。
  tags: [welcome]
- id: wl-buddy-110
  text: 拖鞋我按你的腳挑的，擺在門邊踩進來就對。
  tags: [welcome]
- id: wl-buddy-111
  text: 敲門那套暗號，隔著兩道牆我一聽就替你開。
  tags: [welcome]
- id: wl-buddy-112
  text: 巷口那攤宵夜還開著，等你來我就多叫一份。
  tags: [welcome]
- id: wl-buddy-113
  text: 訊息已讀不回也罷，人肯露面比什麼都強。
  tags: [welcome]
- id: wl-buddy-114
  text: 爛脾氣衝著我發就是了，我早練成一耳進一耳出。
  tags: [welcome]
- id: wl-buddy-115
  text: 借你的那筆錢我連數目都忘了，你也別放心上。
  tags: [welcome]
- id: wl-buddy-116
  text: 鼾聲我到現在還學得出來，你上回就醉倒在這沙發。
  tags: [welcome]
- id: wl-buddy-117
  text: 釣竿還靠在牆角，改天拖你去溪邊蹲上一整天。
  tags: [welcome]
- id: wl-buddy-118
  text: 板凳我多擺了一張，你帶人來也塞得下。
  tags: [welcome]
- id: wl-buddy-119
  text: 相欠的人情這輩子算不清，我也懶得替你算。
  tags: [welcome]
- id: wl-buddy-120
  text: 認識這麼多年，你眉一挑我就曉得你想講什麼。
  tags: [welcome]
