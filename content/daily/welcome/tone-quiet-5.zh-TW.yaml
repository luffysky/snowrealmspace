# 歡迎鏈 · 安靜溫柔（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-quiet-81
  text: 帽子摘下來，額頭也透透氣。
  tags: [welcome]
- id: wl-quiet-82
  text: 燈罩把光揉得軟軟的，眼睛不再刺痛。
  tags: [welcome]
- id: wl-quiet-83
  text: 水龍頭關緊了，屋裡只剩你自己的動靜。
  tags: [welcome]
- id: wl-quiet-84
  text: 鑰匙擱進碗裡，叮一聲，今天就收在這了。
  tags: [welcome]
- id: wl-quiet-85
  text: 手指一根一根鬆開，別再無意識地攥著。
  tags: [welcome]
- id: wl-quiet-86
  text: 把耳朵借給窗外的雨，別的都先不必聽。
  tags: [welcome]
- id: wl-quiet-87
  text: 腳趾在襪子裡輕輕動一動，暖意就回來了。
  tags: [welcome]
- id: wl-quiet-88
  text: 桌上留一盞燈就夠，其餘的都熄了吧。
  tags: [welcome]
- id: wl-quiet-89
  text: 讓呼吸自己找節奏，你不用去管它。
  tags: [welcome]
- id: wl-quiet-90
  text: 沒說出口的那些話，先存著，它壞不了。
  tags: [welcome]
- id: wl-quiet-91
  text: 熱毛巾敷一下臉，繃了一天的地方鬆了。
  tags: [welcome]
- id: wl-quiet-92
  text: 泡個腳，讓一天的重量從腳底流走。
  tags: [welcome]
- id: wl-quiet-93
  text: 讓思緒停在半路，不必替它想到結尾。
  tags: [welcome]
- id: wl-quiet-94
  text: 把聲音放到很輕，輕到剛好陪著你。
  tags: [welcome]
- id: wl-quiet-95
  text: 靠著窗坐，看夜一點一點暗下去。
  tags: [welcome]
- id: wl-quiet-96
  text: 手臂垂在身側，什麼都先不用提著。
  tags: [welcome]
- id: wl-quiet-97
  text: 手錶解下來，時間今晚不歸你管。
  tags: [welcome]
- id: wl-quiet-98
  text: 看熱氣從杯口慢慢升，你也跟著慢下來。
  tags: [welcome]
- id: wl-quiet-99
  text: 窗簾拉上，夜就進不來打擾你了。
  tags: [welcome]
- id: wl-quiet-100
  text: 閉眼前，先對自己輕輕說一句：到家了。
  tags: [welcome]
