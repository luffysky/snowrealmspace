# 歡迎鏈 · 溫馨居家。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-01
  text: 回來了，拖鞋在門邊，燈是暖的。
  tags: [welcome]
- id: wl-cozy-02
  text: 玄關的燈替你留著，外套掛上去就好。
  tags: [welcome]
- id: wl-cozy-03
  text: 沙發還記得你的形狀，坐下來剛剛好。
  tags: [welcome]
- id: wl-cozy-04
  text: 熱茶在桌上冒著白煙，杯壁溫溫的。
  tags: [welcome]
- id: wl-cozy-05
  text: 被窩早就鋪好，等你鑽進來。
  tags: [welcome]
- id: wl-cozy-06
  text: 廚房飄著一點飯香，鍋子還溫著。
  tags: [welcome]
- id: wl-cozy-07
  text: 窗簾拉上了，屋裡只剩柔柔的光。
  tags: [welcome]
- id: wl-cozy-08
  text: 暖爐嗶剝響著，木頭的味道很安穩。
  tags: [welcome]
- id: wl-cozy-09
  text: 毛毯搭在椅背上，隨手拉過來蓋著就暖。
  tags: [welcome]
- id: wl-cozy-10
  text: 門一關，外頭的風雨都留在門外了。
  tags: [welcome]
- id: wl-cozy-11
  text: 桌邊那盞小夜燈，替你亮了一整天。
  tags: [welcome]
- id: wl-cozy-12
  text: 地板是溫的，赤腳走過去也不冷。
  tags: [welcome]
- id: wl-cozy-13
  text: 水壺剛燒開，咕嚕咕嚕地等你。
  tags: [welcome]
- id: wl-cozy-14
  text: 貓在窗台上睡著，屋裡靜得剛剛好。
  tags: [welcome]
- id: wl-cozy-15
  text: 枕頭拍鬆了，床單也曬過太陽。
  tags: [welcome]
- id: wl-cozy-16
  text: 走廊盡頭那扇門後面，一直是你的位置。
  tags: [welcome]
- id: wl-cozy-17
  text: 冰箱裡留了你愛吃的那份，沒人動過。
  tags: [welcome]
- id: wl-cozy-18
  text: 屋簷下的燈籠亮著，遠遠就看得見家。
  tags: [welcome]
- id: wl-cozy-19
  text: 泡澡水放好了，霧氣把鏡子都糊了。
  tags: [welcome]
- id: wl-cozy-20
  text: 這裡的每個角落，都照著你習慣的樣子擺著。
  tags: [welcome]
