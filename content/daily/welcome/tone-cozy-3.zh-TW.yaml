# 歡迎鏈 · 溫馨居家（第三批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-cozy-41
  text: 進門那一步踩上地毯，腳底先軟了下來。
  tags: [welcome]
- id: wl-cozy-42
  text: 檯燈的黃光鋪滿桌角，把夜色擋在窗外。
  tags: [welcome]
- id: wl-cozy-43
  text: 剛煮好的咖啡在杯裡冒著香，替你暖著手心。
  tags: [welcome]
- id: wl-cozy-44
  text: 抱枕堆在沙發一角，軟軟地陷成一個懷抱。
  tags: [welcome]
- id: wl-cozy-45
  text: 屋裡的暖意把肩上的寒氣一點點化開了。
  tags: [welcome]
- id: wl-cozy-46
  text: 烤箱裡的麵包剛出爐，滿屋子都是甜香。
  tags: [welcome]
- id: wl-cozy-47
  text: 落地窗的簾子半掩著，篩進一片柔和的暮色。
  tags: [welcome]
- id: wl-cozy-48
  text: 火爐前擺了張矮凳，正對著跳動的橘紅光。
  tags: [welcome]
- id: wl-cozy-49
  text: 蓋在膝上的毛毯還帶著烘乾機的餘溫。
  tags: [welcome]
- id: wl-cozy-50
  text: 玻璃窗起了一層白霧，把屋裡圈成暖暖一團。
  tags: [welcome]
- id: wl-cozy-51
  text: 床頭的小燈亮著，等你把疲憊一件件卸下。
  tags: [welcome]
- id: wl-cozy-52
  text: 踏進浴室，蒸氣先擁上來把冷意都推走。
  tags: [welcome]
- id: wl-cozy-53
  text: 茶几上擺著一盤剝好的橘子，瓣瓣朝著你。
  tags: [welcome]
- id: wl-cozy-54
  text: 角落的香氛悄悄化著，木質調子安穩得像深呼吸。
  tags: [welcome]
- id: wl-cozy-55
  text: 廚房傳來鍋鏟輕碰的聲音，飯菜正等著上桌。
  tags: [welcome]
- id: wl-cozy-56
  text: 電熱毯早半個鐘頭就開著，被窩裡是一片溫熱。
  tags: [welcome]
- id: wl-cozy-57
  text: 客廳的吊燈調到最柔，光影在牆上慢慢晃。
  tags: [welcome]
- id: wl-cozy-58
  text: 窗台上的綠植澆過水了，葉尖還掛著小水珠。
  tags: [welcome]
- id: wl-cozy-59
  text: 玄關的鏡子映出你進門的身影，屋子就完整了。
  tags: [welcome]
- id: wl-cozy-60
  text: 爐火餘燼還紅著，替整間屋子守著最後一點暖。
  tags: [welcome]
