# 歡迎鏈 · 夜裡回來。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-evening-01
  text: 夜深了你還來，這裡也就沒睡。
  tags: [welcome]
- id: wl-evening-02
  text: 燈一直為你留著，你看，它還亮著。
  tags: [welcome]
- id: wl-evening-03
  text: 你回來的時候，白天的重量可以先放下了。
  tags: [welcome]
- id: wl-evening-04
  text: 這個時間很安靜，安靜得剛好容得下你。
  tags: [welcome]
- id: wl-evening-05
  text: 一天走到盡頭，你在這裡靠一會兒。
  tags: [welcome]
- id: wl-evening-06
  text: 夜色把外面蓋住了，裡面只剩你和一盞燈。
  tags: [welcome]
- id: wl-evening-07
  text: 你來了，把肩上的一天輕輕擱在門邊。
  tags: [welcome]
- id: wl-evening-08
  text: 深夜的空間格外柔軟，正好接住你。
  tags: [welcome]
- id: wl-evening-09
  text: 忙了一整天，這裡是最後也最穩的一站。
  tags: [welcome]
- id: wl-evening-10
  text: 窗外沒什麼聲音了，這份寧靜留給你。
  tags: [welcome]
- id: wl-evening-11
  text: 你回到這裡，像脫下一件穿了太久的外套。
  tags: [welcome]
- id: wl-evening-12
  text: 燈光暖暖的，夜再長也不趕你走。
  tags: [welcome]
- id: wl-evening-13
  text: 這麼晚了你還記得回來，這裡都記在心上。
  tags: [welcome]
- id: wl-evening-14
  text: 白天的事情先擱著，此刻只有你和夜。
  tags: [welcome]
- id: wl-evening-15
  text: 你踩著月色進來，整個房間慢下來陪你。
  tags: [welcome]
- id: wl-evening-16
  text: 一天的喧鬧散盡，剩下的安靜是你的。
  tags: [welcome]
- id: wl-evening-17
  text: 夜裡的這盞燈，等的就是你這一步。
  tags: [welcome]
- id: wl-evening-18
  text: 在這裡歇著就好，什麼都不必想。
  tags: [welcome]
- id: wl-evening-19
  text: 外面的世界睡了，這裡替你醒著。
  tags: [welcome]
- id: wl-evening-20
  text: 這個夜晚有你就完整了，其餘都可以慢慢來。
  tags: [welcome]
