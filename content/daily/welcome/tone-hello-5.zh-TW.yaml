# 歡迎鏈 · 招呼式（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-hello-81
  text: 噢，是你的腳步，門輕輕就被帶開了。
  tags: [welcome]
- id: wl-hello-82
  text: 巷口的燈才剛亮，你就轉進來了。
  tags: [welcome]
- id: wl-hello-83
  text: 圍巾上還沾著外頭的涼，進來慢慢解開。
  tags: [welcome]
- id: wl-hello-84
  text: 樓梯轉角那聲熟悉的呼吸，我認得是你。
  tags: [welcome]
- id: wl-hello-85
  text: 傘還滴著水，先擱著，人進來要緊。
  tags: [welcome]
- id: wl-hello-86
  text: 茶香才飄出來，你的腳步就跟上了。
  tags: [welcome]
- id: wl-hello-87
  text: 抬手替你把門簾掀開，人就到齊了。
  tags: [welcome]
- id: wl-hello-88
  text: 鑰匙轉了兩圈，這一聲我等了一整天。
  tags: [welcome]
- id: wl-hello-89
  text: 夜色被你披在肩上帶回來了，卸下吧。
  tags: [welcome]
- id: wl-hello-90
  text: 玄關的燈感應到你，先替我迎了上去。
  tags: [welcome]
- id: wl-hello-91
  text: 一身車馬勞頓進了門，先坐著別動。
  tags: [welcome]
- id: wl-hello-92
  text: 冷風被你關在門外了，屋裡剛剛好。
  tags: [welcome]
- id: wl-hello-93
  text: 這時辰你出現，剛好接上熱湯的溫度。
  tags: [welcome]
- id: wl-hello-94
  text: 踩過門檻那一下，你就算真的到家了。
  tags: [welcome]
- id: wl-hello-95
  text: 拖鞋我擺在腳邊了，換上就鬆快了。
  tags: [welcome]
- id: wl-hello-96
  text: 你身上帶著街上的燈火味，全進來了。
  tags: [welcome]
- id: wl-hello-97
  text: 掛鐘剛敲，你的身影就補上了這一格。
  tags: [welcome]
- id: wl-hello-98
  text: 桌燈朝門口偏了偏，替我先照亮你。
  tags: [welcome]
- id: wl-hello-99
  text: 靜了一天的屋子，被你的腳步喚醒了。
  tags: [welcome]
- id: wl-hello-100
  text: 你這趟總算落地，剩下的路都在屋裡了。
  tags: [welcome]
