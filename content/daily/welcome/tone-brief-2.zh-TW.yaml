# 歡迎鏈 · 極短一句（續）。回家的感覺。繁體中文，每一則獨一無二。每句 8 字以內。
- id: wl-brief-21
  text: 進來坐吧。
  tags: [welcome]
- id: wl-brief-22
  text: 茶還溫著。
  tags: [welcome]
- id: wl-brief-23
  text: 到家了。
  tags: [welcome]
- id: wl-brief-24
  text: 窗邊留了光。
  tags: [welcome]
- id: wl-brief-25
  text: 放輕鬆些。
  tags: [welcome]
- id: wl-brief-26
  text: 有人在等你。
  tags: [welcome]
- id: wl-brief-27
  text: 隨你待多久。
  tags: [welcome]
- id: wl-brief-28
  text: 這裡收著你。
  tags: [welcome]
- id: wl-brief-29
  text: 歇口氣。
  tags: [welcome]
- id: wl-brief-30
  text: 路辛苦了。
  tags: [welcome]
- id: wl-brief-31
  text: 門沒鎖。
  tags: [welcome]
- id: wl-brief-32
  text: 坐近一點。
  tags: [welcome]
- id: wl-brief-33
  text: 你來就好。
  tags: [welcome]
- id: wl-brief-34
  text: 燈替你留。
  tags: [welcome]
- id: wl-brief-35
  text: 安心落腳。
  tags: [welcome]
- id: wl-brief-36
  text: 這方寸屬你。
  tags: [welcome]
- id: wl-brief-37
  text: 卸下吧。
  tags: [welcome]
- id: wl-brief-38
  text: 位子暖著呢。
  tags: [welcome]
- id: wl-brief-39
  text: 靠著歇會。
  tags: [welcome]
- id: wl-brief-40
  text: 到了就好。
  tags: [welcome]
