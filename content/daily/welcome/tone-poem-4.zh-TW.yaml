# 歡迎鏈 · 詩意留白（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-poem-61
  text: 屋頂替你擋下整片天，你只管歇著。
  tags: [welcome]
- id: wl-poem-62
  text: 炊煙從煙囪慢慢升，是家在說你回來了。
  tags: [welcome]
- id: wl-poem-63
  text: 窗簾放下一半，剛好把夜掩在外頭。
  tags: [welcome]
- id: wl-poem-64
  text: 藤椅記得你背的弧度，一坐就貼合了。
  tags: [welcome]
- id: wl-poem-65
  text: 玄關的燈先亮，替你把最後一段路照完。
  tags: [welcome]
- id: wl-poem-66
  text: 鍋裡的湯還溫著，冒著等你的白氣。
  tags: [welcome]
- id: wl-poem-67
  text: 拖鞋在門邊排好，鞋尖朝著你來的方向。
  tags: [welcome]
- id: wl-poem-68
  text: 擺鐘一下一下，替這屋子數著你的平安。
  tags: [welcome]
- id: wl-poem-69
  text: 檐角的風鈴輕響，像替你報了一聲到。
  tags: [welcome]
- id: wl-poem-70
  text: 燭火在桌上微微搖，把黑暗讓出一個你的位置。
  tags: [welcome]
- id: wl-poem-71
  text: 閣樓的木梯吱呀一聲，把你送進更深的暖裡。
  tags: [welcome]
- id: wl-poem-72
  text: 搖椅前後晃著，晃出一整片慢下來的時間。
  tags: [welcome]
- id: wl-poem-73
  text: 壁爐把整個房間烘成一床看不見的被。
  tags: [welcome]
- id: wl-poem-74
  text: 院子裡的落葉替你鋪了一條回家的軟路。
  tags: [welcome]
- id: wl-poem-75
  text: 螢火蟲在窗外提著小燈，陪你到門口就散了。
  tags: [welcome]
- id: wl-poem-76
  text: 熱水袋在被裡先躺著，把冷都替你焐走了。
  tags: [welcome]
- id: wl-poem-77
  text: 麵包剛出爐，滿屋子的香都在等你分一口。
  tags: [welcome]
- id: wl-poem-78
  text: 曬衣繩上的白布輕輕晃，晃著一室乾淨的安穩。
  tags: [welcome]
- id: wl-poem-79
  text: 竹簾把月光篩成細細的絲，落在你的枕邊。
  tags: [welcome]
- id: wl-poem-80
  text: 稻香從田那頭飄來，一路把你領回這扇門。
  tags: [welcome]
