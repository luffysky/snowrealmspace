# 歡迎鏈 · 溫柔叮嚀（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-gentle-61
  text: 打個哈欠也不必忍著，累了就是累了。
  tags: [welcome]
- id: wl-gentle-62
  text: 把工作的訊息靜音，讓耳根子清淨一會兒。
  tags: [welcome]
- id: wl-gentle-63
  text: 穿件寬鬆的衣服，身子鬆了心也跟著鬆。
  tags: [welcome]
- id: wl-gentle-64
  text: 揉一揉太陽穴，緊繃的地方會慢慢化開。
  tags: [welcome]
- id: wl-gentle-65
  text: 剝顆水果吃吧，甜甜的會讓人舒坦。
  tags: [welcome]
- id: wl-gentle-66
  text: 把腿抬高一些，一天的沉重就流走了。
  tags: [welcome]
- id: wl-gentle-67
  text: 轉轉手腕和腳踝，關節也想活動活動。
  tags: [welcome]
- id: wl-gentle-68
  text: 曬一會兒太陽，讓暖意曬進骨子裡。
  tags: [welcome]
- id: wl-gentle-69
  text: 開扇小窗透透氣，讓新鮮空氣進來繞一圈。
  tags: [welcome]
- id: wl-gentle-70
  text: 讓自己發個呆也好，腦袋空著最舒服。
  tags: [welcome]
- id: wl-gentle-71
  text: 補個小盹，短短一會兒就能回一點神。
  tags: [welcome]
- id: wl-gentle-72
  text: 咬一口熱熱的麵包，暖從嘴裡一路下去。
  tags: [welcome]
- id: wl-gentle-73
  text: 抱著抱枕窩一下，像被輕輕圈住那樣。
  tags: [welcome]
- id: wl-gentle-74
  text: 點盞小夜燈就夠了，不用把屋子照得太亮。
  tags: [welcome]
- id: wl-gentle-75
  text: 貼著牆站直，讓背脊舒展一下再坐下。
  tags: [welcome]
- id: wl-gentle-76
  text: 熱敷一下痠的肩，暖意會把結揉開。
  tags: [welcome]
- id: wl-gentle-77
  text: 解開鞋帶，讓腳背也透口氣。
  tags: [welcome]
- id: wl-gentle-78
  text: 泡壺花茶慢慢喝，香氣會把心撫平。
  tags: [welcome]
- id: wl-gentle-79
  text: 用熱水沖沖後頸，僵硬的地方就軟了。
  tags: [welcome]
- id: wl-gentle-80
  text: 此刻只管好好歇著，明天的煩心先關在門外。
  tags: [welcome]
