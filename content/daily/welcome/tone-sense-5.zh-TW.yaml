# 歡迎鏈 · 感官細節（第五批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-sense-81
  text: 窗台上的貓，蜷成一小團睡著了。
  tags: [welcome]
- id: wl-sense-82
  text: 玄關的鏡子，映著剛進門的你。
  tags: [welcome]
- id: wl-sense-83
  text: 茶壺套著布罩，把裡頭的溫都保著。
  tags: [welcome]
- id: wl-sense-84
  text: 冰箱門上的磁鐵，壓著一張購物單。
  tags: [welcome]
- id: wl-sense-85
  text: 廚房窗台的蔥，冒出了一截嫩綠。
  tags: [welcome]
- id: wl-sense-86
  text: 暖爐上的水盆，慢慢蒸著一縷白氣。
  tags: [welcome]
- id: wl-sense-87
  text: 拖鞋踩在地板上，啪嗒啪嗒地輕響。
  tags: [welcome]
- id: wl-sense-88
  text: 桌上剝下的橘子皮，捲成小小一朵。
  tags: [welcome]
- id: wl-sense-89
  text: 掛在椅背的毛衣，還留著白天的暖。
  tags: [welcome]
- id: wl-sense-90
  text: 窗外的雪，落得很慢很輕。
  tags: [welcome]
- id: wl-sense-91
  text: 熱水瓶的軟木塞，蓋得剛剛好。
  tags: [welcome]
- id: wl-sense-92
  text: 灶上的砂鍋，咕嘟咕嘟冒著泡。
  tags: [welcome]
- id: wl-sense-93
  text: 牆上的月曆，翻到了新的一頁。
  tags: [welcome]
- id: wl-sense-94
  text: 桌燈的拉繩，還在輕輕晃著。
  tags: [welcome]
- id: wl-sense-95
  text: 門邊的傘架，立著一把還沒乾的傘。
  tags: [welcome]
- id: wl-sense-96
  text: 抽屜半開著，露出一疊摺好的手帕。
  tags: [welcome]
- id: wl-sense-97
  text: 窗玻璃上，凝了一道一道的水痕。
  tags: [welcome]
- id: wl-sense-98
  text: 熱奶茶上頭，浮著一點肉桂的香。
  tags: [welcome]
- id: wl-sense-99
  text: 竹籃裡的橘子，堆得滿滿的。
  tags: [welcome]
- id: wl-sense-100
  text: 屋裡的一切，都還在原來的位置。
  tags: [welcome]
