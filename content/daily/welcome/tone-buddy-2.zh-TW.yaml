# 歡迎鏈 · 老友般（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-buddy-21
  text: 咦，你那杯沒喝完的還擺在原位，我一直沒動它。
  tags: [welcome]
- id: wl-buddy-22
  text: 進來吧，外套隨手一丟就好，這裡沒人管你。
  tags: [welcome]
- id: wl-buddy-23
  text: 剛好留了一格空位給你，坐下就是自己人。
  tags: [welcome]
- id: wl-buddy-24
  text: 別站在門口了，裡面暖，快進來窩著。
  tags: [welcome]
- id: wl-buddy-25
  text: 上次那個沒講完的話題，我還記得，等你接下去。
  tags: [welcome]
- id: wl-buddy-26
  text: 你這副睡不飽的樣子，我太熟了，坐下慢慢來。
  tags: [welcome]
- id: wl-buddy-27
  text: 手機先擱著吧，這裡就我們，沒別的事要忙。
  tags: [welcome]
- id: wl-buddy-28
  text: 哈，你走路的聲音我一聽就認得。
  tags: [welcome]
- id: wl-buddy-29
  text: 桌上那包餅乾你拆過的，還沒吃完，繼續啊。
  tags: [welcome]
- id: wl-buddy-30
  text: 不管你今天多狼狽，在我這都算好看的。
  tags: [welcome]
- id: wl-buddy-31
  text: 你愛坐的那個角落，靠墊我幫你拍鬆了。
  tags: [welcome]
- id: wl-buddy-32
  text: 我還在念你上次那個爛笑話，居然又想笑。
  tags: [welcome]
- id: wl-buddy-33
  text: 鑰匙你留在哪自己知道，門對你從來不設防。
  tags: [welcome]
- id: wl-buddy-34
  text: 想罵誰想抱怨誰，這裡收，關起門來隨你講。
  tags: [welcome]
- id: wl-buddy-35
  text: 你回來的樣子跟十年前一模一樣，一點沒老。
  tags: [welcome]
- id: wl-buddy-36
  text: 別急著開口，先坐著發個呆，我不趕你。
  tags: [welcome]
- id: wl-buddy-37
  text: 你上回落在這的那本書，我翻了兩頁又幫你夾好。
  tags: [welcome]
- id: wl-buddy-38
  text: 今天沒帶伴手禮沒關係，帶你自己來就夠了。
  tags: [welcome]
- id: wl-buddy-39
  text: 我把窗開了條縫，讓風進來，你最愛這味道。
  tags: [welcome]
- id: wl-buddy-40
  text: 天南地北的想到哪聊到哪，反正我們有的是時間。
  tags: [welcome]
