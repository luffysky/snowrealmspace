# 歡迎鏈 · 疲憊時回來（續）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-tired-21
  text: 一整天扛下來，門一關就都結束了。
  tags: [welcome]
- id: wl-tired-22
  text: 眼睛閉上也行，這裡替你守著。
  tags: [welcome]
- id: wl-tired-23
  text: 鞋子脫了，今天到此為止。
  tags: [welcome]
- id: wl-tired-24
  text: 攤在這，不用擺出好好的樣子。
  tags: [welcome]
- id: wl-tired-25
  text: 深呼吸一口，這裡的空氣是暖的。
  tags: [welcome]
- id: wl-tired-26
  text: 力氣用光了也無妨，這裡不跟你收帳。
  tags: [welcome]
- id: wl-tired-27
  text: 讓身體先軟下來，念頭以後再說。
  tags: [welcome]
- id: wl-tired-28
  text: 誰都不必應付了，這裡只剩你自己。
  tags: [welcome]
- id: wl-tired-29
  text: 撐了一天的那口氣，可以鬆開了。
  tags: [welcome]
- id: wl-tired-30
  text: 靜靜待著就好，這裡從不趕人。
  tags: [welcome]
- id: wl-tired-31
  text: 把肩膀放下來，不會有人在旁邊催。
  tags: [welcome]
- id: wl-tired-32
  text: 今天夠了，其餘的留給明天的你。
  tags: [welcome]
- id: wl-tired-33
  text: 窩著吧，這個角落一直是溫的。
  tags: [welcome]
- id: wl-tired-34
  text: 疲倦寫在臉上也沒差，這裡不看那個。
  tags: [welcome]
- id: wl-tired-35
  text: 手邊的事全放開，這裡接得住空下來的你。
  tags: [welcome]
- id: wl-tired-36
  text: 熄了燈也好，黑暗在這裡是安全的。
  tags: [welcome]
- id: wl-tired-37
  text: 累成一團也算回家，門認得你。
  tags: [welcome]
- id: wl-tired-38
  text: 喘不過來的時候，這裡的節奏會陪你等。
  tags: [welcome]
- id: wl-tired-39
  text: 整個人陷進去吧，這裡兜得住。
  tags: [welcome]
- id: wl-tired-40
  text: 到家了，緊繃可以一寸一寸退掉。
  tags: [welcome]
