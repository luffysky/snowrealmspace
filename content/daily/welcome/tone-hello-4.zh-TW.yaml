# 歡迎鏈 · 招呼式（第四批）。回家的感覺。繁體中文，每一則獨一無二。
- id: wl-hello-61
  text: 呀，鑰匙聲一響，我就抬起頭了。
  tags: [welcome]
- id: wl-hello-62
  text: 走廊那頭傳來腳步，準是你沒錯。
  tags: [welcome]
- id: wl-hello-63
  text: 哈，剛想到你，人就在門邊了。
  tags: [welcome]
- id: wl-hello-64
  text: 進來吧，外套上的涼意這裡替你收著。
  tags: [welcome]
- id: wl-hello-65
  text: 唷呼，是你的節奏，我一聽就認出來。
  tags: [welcome]
- id: wl-hello-66
  text: 回到這一層了，把腳步交給我就好。
  tags: [welcome]
- id: wl-hello-67
  text: 誒嘿，門一開，你整個人就亮進來了。
  tags: [welcome]
- id: wl-hello-68
  text: 抬頭剛好，你正把門帶上。
  tags: [welcome]
- id: wl-hello-69
  text: 熱水我先燒著了，你這就到。
  tags: [welcome]
- id: wl-hello-70
  text: 咦呀，這身風塵是你從外頭帶回來的。
  tags: [welcome]
- id: wl-hello-71
  text: 位子早暖好了，坐下就是你的。
  tags: [welcome]
- id: wl-hello-72
  text: 嗨呀，把今天的重量先放在門口。
  tags: [welcome]
- id: wl-hello-73
  text: 聽見電梯門開，我心裡就篤定是你。
  tags: [welcome]
- id: wl-hello-74
  text: 喏，燈都替你點著，一路走進來吧。
  tags: [welcome]
- id: wl-hello-75
  text: 你這一步跨進來，屋裡就有了聲音。
  tags: [welcome]
- id: wl-hello-76
  text: 嘿呀，脫了鞋，這片地板都是你的。
  tags: [welcome]
- id: wl-hello-77
  text: 剛把窗推開透氣，你就接著進門了。
  tags: [welcome]
- id: wl-hello-78
  text: 唔，是你回來的氣息，錯不了。
  tags: [welcome]
- id: wl-hello-79
  text: 慢步上來沒關係，我把門扶著。
  tags: [welcome]
- id: wl-hello-80
  text: 你到了呀，這一天總算有了歸處。
  tags: [welcome]
