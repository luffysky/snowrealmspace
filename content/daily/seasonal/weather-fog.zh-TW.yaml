# 季節/天氣 · 起霧。繁體中文，每一則獨一無二。
- id: se-fog-01
  text: 起霧了，路上放慢一點。
  tags: [foggy]
- id: se-fog-02
  text: 窗外白茫茫一片，能見度不太好。
  tags: [foggy]
- id: se-fog-03
  text: 山區起了霧，開車記得開霧燈。
  tags: [foggy]
- id: se-fog-04
  text: 霧氣把遠方的景物都藏了起來。
  tags: [foggy]
- id: se-fog-05
  text: 這種朦朧的天氣，別有一番安靜的美。
  tags: [foggy]
- id: se-fog-06
  text: 空氣裡飄著溼溼的霧，走路留意腳下。
  tags: [foggy]
- id: se-fog-07
  text: 濃霧漫過來的時候，世界彷彿變小了。
  tags: [foggy]
- id: se-fog-08
  text: 能見度變低了，出門多留一點餘裕。
  tags: [foggy]
- id: se-fog-09
  text: 樹梢在薄霧裡若隱若現，像一幅淡淡的水墨。
  tags: [foggy]
- id: se-fog-10
  text: 霧散得慢，早上的路口看不太清楚。
  tags: [foggy]
- id: se-fog-11
  text: 灰白的霧貼著地面，遠處的燈只剩一團光暈。
  tags: [foggy]
- id: se-fog-12
  text: 起霧的清晨，很適合慢慢地深呼吸。
  tags: [foggy]
- id: se-fog-13
  text: 霧裡的一切都柔和了下來，連聲音都變輕了。
  tags: [foggy]
- id: se-fog-14
  text: 沿海一帶起霧，海面和天空連成一片白。
  tags: [foggy]
- id: se-fog-15
  text: 這樣的霧天，車速放緩，跟前車拉開一點距離。
  tags: [foggy]
- id: se-fog-16
  text: 霧氣沾在頭髮上涼涼的，圍巾或許用得上。
  tags: [foggy]
- id: se-fog-17
  text: 遠山被霧包住，只露出淡淡的一道輪廓。
  tags: [foggy]
- id: se-fog-18
  text: 霧濃的時候，路標要靠近才看得清。
  tags: [foggy]
- id: se-fog-19
  text: 白霧在街燈下緩緩流動，像一場安靜的夢。
  tags: [foggy]
- id: se-fog-20
  text: 起霧的日子，眼裡的世界多了幾分朦朧。
  tags: [foggy]
