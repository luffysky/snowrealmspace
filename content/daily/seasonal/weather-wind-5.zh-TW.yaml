# 季節/天氣 · 有風的天（第五批）。繁體中文，每一則獨一無二。
- id: se-wind-81
  text: 蘆葦被風掃成一整片起伏，銀白的花穗齊刷刷往同一邊倒。
  tags: [windy]
- id: se-wind-82
  text: 這種風勢適合飛行傘，教練看準陣勢，一起跑就把人穩穩托上了天。
  tags: [windy]
- id: se-wind-83
  text: 一陣風掠過甘蔗田，一節節葉子刮出連綿不斷的乾響。
  tags: [windy]
- id: se-wind-84
  text: 起風時玩飛盤特別刁鑽，順風一擲飄得老遠，逆風就得壓低了拋。
  tags: [windy]
- id: se-wind-85
  text: 風把牧場的草皮壓成一波波，吃草的牛群尾巴也甩得更勤了。
  tags: [windy]
- id: se-wind-86
  text: 這麼強的風搭纜車，車廂在半空微微晃，腳下的山谷看得心頭一緊。
  tags: [windy]
- id: se-wind-87
  text: 風勢一大，果園裡熟透的落果全滾到樹腳，撿拾的人籃子一下就滿。
  tags: [windy]
- id: se-wind-88
  text: 起風的午後在湖上踩天鵝船，逆風踩得腿痠，順風就輕輕滑回岸邊。
  tags: [windy]
- id: se-wind-89
  text: 迎著風耙鹽最順手，鹽田的白霜結得快，一畦畦被推攏成小丘。
  tags: [windy]
- id: se-wind-90
  text: 這種天氣曬龍眼乾最理想，一顆顆掛在竹篩上，殼被吹得脆響。
  tags: [windy]
- id: se-wind-91
  text: 街頭藝人的吉他聲被風一陣陣吹散，路過的人得走近了才聽得真切。
  tags: [windy]
- id: se-wind-92
  text: 風把稻草人的斗笠掀歪了一邊，田裡的麻雀反倒更不把牠當回事。
  tags: [windy]
- id: se-wind-93
  text: 牆上的爬牆虎被風掀得翻起葉背，一整面綠牆閃出淺淺的白。
  tags: [windy]
- id: se-wind-94
  text: 這麼會吹的天翻曬草蓆最省事，藺草的清香被吹得又淡又遠。
  tags: [windy]
- id: se-wind-95
  text: 風把埤塘的布袋蓮全推到一角聚攏，紫花擠成一叢叢很是熱鬧。
  tags: [windy]
- id: se-wind-96
  text: 返航的舢舨被風吹得側著身進港，老船長打舵打得格外仔細。
  tags: [windy]
- id: se-wind-97
  text: 起風的夜裡露營，營火被吹得偏向一邊，煮飯的鍋子挪了位子才架穩。
  tags: [windy]
- id: se-wind-98
  text: 風鑽過堤邊的消波塊縫，嗚嗚地響，釣客把帽簷壓低專心盯著浪。
  tags: [windy]
- id: se-wind-99
  text: 山屋外那排風力發電的扇葉被吹得飛轉，一整列在稜線上呼呼作響。
  tags: [windy]
- id: se-wind-100
  text: 曬蚵殼場的殼堆被風吹得叮叮作響，剝蚵的阿嬤把圍裙又紮緊了些。
  tags: [windy]
