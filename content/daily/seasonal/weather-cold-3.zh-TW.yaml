# 季節/天氣 · 寒冷（第三批）。繁體中文，每一則獨一無二。
- id: se-cold-41
  text: 睡前一杯熱可可，暖了胃也好入眠。
  tags: [cold]
- id: se-cold-42
  text: 泡個熱水腳，暖意會從腳底一路暖到全身。
  tags: [cold]
- id: se-cold-43
  text: 出門帶個保溫瓶裝熱水，隨時都有一口溫的可以喝。
  tags: [cold]
- id: se-cold-44
  text: 冬陽難得露臉，趁中午到窗邊曬曬背最舒服。
  tags: [cold]
- id: se-cold-45
  text: 寒夜裡一鍋麻油雞，香氣一飄整間屋子都暖了。
  tags: [cold]
- id: se-cold-46
  text: 早上來碗熱白粥，胃暖了身子也跟著醒過來。
  tags: [cold]
- id: se-cold-47
  text: 沖壺桂圓紅棗茶，甜甜熱熱的喝下最能驅寒。
  tags: [cold]
- id: se-cold-48
  text: 進到室內先把外套脫下，免得悶出汗一吹風反而著涼。
  tags: [cold]
- id: se-cold-49
  text: 擋風玻璃結了一層霜，開車前先暖個車再上路穩當。
  tags: [cold]
- id: se-cold-50
  text: 冷得縮起肩膀走久了，鬆一鬆脖子和肩膀會輕鬆些。
  tags: [cold]
- id: se-cold-51
  text: 電熱毯先開個幾分鐘，鑽進被窩就是暖烘烘的。
  tags: [cold]
- id: se-cold-52
  text: 低溫下手機特別耗電，放進內層口袋能撐久一點。
  tags: [cold]
- id: se-cold-53
  text: 找個週末去泡個溫泉，寒氣泡著泡著就散了。
  tags: [cold]
- id: se-cold-54
  text: 換上高領毛衣，領口一包住脖子就暖了大半。
  tags: [cold]
- id: se-cold-55
  text: 暖氣開久了空氣乾，擺台加濕器喉嚨會舒服些。
  tags: [cold]
- id: se-cold-56
  text: 早餐配一杯熱豆漿，捧著杯子手心先暖了起來。
  tags: [cold]
- id: se-cold-57
  text: 剛起床別急著下床，在被窩裡動動手腳暖了身再說。
  tags: [cold]
- id: se-cold-58
  text: 煮壺黑糖薑茶，喝下去從喉嚨一路暖到胃裡。
  tags: [cold]
- id: se-cold-59
  text: 沒帶手套時，把手插進口袋也能擋掉一點寒意。
  tags: [cold]
- id: se-cold-60
  text: 睡覺穿雙薄襪，腳暖了整夜都睡得安穩。
  tags: [cold]
