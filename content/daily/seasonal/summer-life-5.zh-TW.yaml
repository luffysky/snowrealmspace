# 季節 · 夏天生活（第五批）。繁體中文，每一則獨一無二。
- id: se-summerlife-81
  text: 切一盤五顏六色的水果冰進冰箱，午後端出來，酸酸甜甜最開胃。
  tags: [summer]
- id: se-summerlife-82
  text: 陽台掛上一片竹簾擋西曬，屋裡的光線瞬間柔和了下來。
  tags: [summer]
- id: se-summerlife-83
  text: 河堤上放起風箏，風一穩線一放，風箏就爭著往藍天鑽。
  tags: [summer]
- id: se-summerlife-84
  text: 攤前現榨的甘蔗汁裝滿一大杯，清甜沁涼，一路喝到見底。
  tags: [summer]
- id: se-summerlife-85
  text: 戴上蛙鏡潛進水裡，看陽光在池底晃成一片碎金。
  tags: [summer]
- id: se-summerlife-86
  text: 火龍果剖開紫得發亮，挖一口沁涼，連湯匙都染成了粉紅。
  tags: [summer]
- id: se-summerlife-87
  text: 泡好一壺冷泡茶擺進冰箱，隔天倒出來，回甘又解渴。
  tags: [summer]
- id: se-summerlife-88
  text: 沿著河濱騎腳踏車，晚風貼著臉頰，一天的悶熱都被甩在身後。
  tags: [summer]
- id: se-summerlife-89
  text: 社區中庭的噴水池一到夏天就開，小孩追著水柱笑成一團。
  tags: [summer]
- id: se-summerlife-90
  text: 正午影子縮到最短，連路邊的狗都躲進騎樓的陰影裡打盹。
  tags: [summer]
- id: se-summerlife-91
  text: 曬傷的手臂抹上一層蘆薈，涼涼黏黏的，紅辣的刺痛慢慢退了。
  tags: [summer]
- id: se-summerlife-92
  text: 濕毛巾冰進冷凍庫，拿出來敷在後頸，暑氣一下子被壓了下去。
  tags: [summer]
- id: se-summerlife-93
  text: 田裡的稻子黃透了，收割機一趟趟駛過，空氣裡全是稻穀的乾香。
  tags: [summer]
- id: se-summerlife-94
  text: 椰子插上吸管遞過來，清甜的椰子水灌下肚，整個人透心涼。
  tags: [summer]
- id: se-summerlife-95
  text: 剝開一顆龍眼，果肉透亮多汁，一顆接一顆停不下來。
  tags: [summer]
- id: se-summerlife-96
  text: 電扇前擺一盆冰水，吹出來的風也跟著涼了幾分，是老一輩的消暑法。
  tags: [summer]
- id: se-summerlife-97
  text: 換上短袖短褲還是嫌熱，索性打起赤膊在家裡晃來晃去。
  tags: [summer]
- id: se-summerlife-98
  text: 搬張躺椅到頂樓吹晚風，仰頭數著星星，比悶在屋裡涼快多了。
  tags: [summer]
- id: se-summerlife-99
  text: 提著水桶把曬燙的地板沖過一遍，暑氣隨著水流一起散去。
  tags: [summer]
- id: se-summerlife-100
  text: 曬乾的菜脯和辣椒攤在竹篩上，是奶奶趁著大太陽備下的一年份。
  tags: [summer]
