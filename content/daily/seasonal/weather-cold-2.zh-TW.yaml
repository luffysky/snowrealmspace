# 季節/天氣 · 寒冷（續）。繁體中文，每一則獨一無二。
- id: se-cold-21
  text: 玻璃窗蒙上一層霧，用指尖畫個小圖案也挺有趣。
  tags: [cold]
- id: se-cold-22
  text: 棉被剛曬過的日子，鑽進去有太陽的味道最好睡。
  tags: [cold]
- id: se-cold-23
  text: 這種天氣護唇膏隨身帶著，嘴唇就不會乾裂。
  tags: [cold]
- id: se-cold-24
  text: 火鍋咕嘟咕嘟冒著煙，一群人圍著吃最有暖意。
  tags: [cold]
- id: se-cold-25
  text: 早上的機車坐墊冰得刺人，先用手掌壓一壓再上車。
  tags: [cold]
- id: se-cold-26
  text: 低溫讓靜電特別多，碰門把前輕輕摸個牆就好。
  tags: [cold]
- id: se-cold-27
  text: 烤地瓜的香氣飄過巷口，捧在手裡連掌心都甜了。
  tags: [cold]
- id: se-cold-28
  text: 這麼冷，睡前用熱水袋暖被窩，一夜都不會醒。
  tags: [cold]
- id: se-cold-29
  text: 洗完澡趁身子還熱趕快擦乾，寒氣就鑽不進來。
  tags: [cold]
- id: se-cold-30
  text: 山上的溫度更低，去看風景記得帶件擋風的。
  tags: [cold]
- id: se-cold-31
  text: 天冷血壓容易起伏，起床時放慢動作坐一會兒再站。
  tags: [cold]
- id: se-cold-32
  text: 毛帽壓低到耳朵，寒風就吹不進耳廓裡發疼。
  tags: [cold]
- id: se-cold-33
  text: 這種凍天，關節會怕冷，護膝套上就靈活多了。
  tags: [cold]
- id: se-cold-34
  text: 棉拖鞋踩在木地板上，腳底不再是冰涼一片。
  tags: [cold]
- id: se-cold-35
  text: 寒夜裡一碗薑母鴨，喝完額頭微微冒汗最痛快。
  tags: [cold]
- id: se-cold-36
  text: 天氣乾冷，擦點乳液手背才不會粗糙起皮。
  tags: [cold]
- id: se-cold-37
  text: 這麼冷，寵物也怕凍，給牠鋪塊小毯子窩著。
  tags: [cold]
- id: se-cold-38
  text: 起霧的清晨視線不清，走路開車都放慢一點穩當。
  tags: [cold]
- id: se-cold-39
  text: 圍爐守歲的夜晚，一家人聚在一起最抵得過寒意。
  tags: [cold]
- id: se-cold-40
  text: 冷氣團報到，陽台的水管記得包一下免得結凍。
  tags: [cold]
