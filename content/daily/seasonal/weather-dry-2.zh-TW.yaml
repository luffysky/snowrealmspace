# 季節/天氣 · 乾燥（續）。繁體中文，每一則獨一無二。
- id: se-dry-21
  text: 開暖氣的房間空氣特別乾，旁邊擺條濕毛巾能悄悄補點水氣。
  tags: [dry]
- id: se-dry-22
  text: 指甲邊緣在乾天容易起倒刺，抹點油輕輕護著這些小地方。
  tags: [dry]
- id: se-dry-23
  text: 木頭家具在乾季會微微裂開，這是它們也在跟你一起過冬。
  tags: [dry]
- id: se-dry-24
  text: 盆栽的土面乾得比平常快，路過時順手給它們一點水。
  tags: [dry]
- id: se-dry-25
  text: 乾空氣裡連信封都不太黏得牢，封口多壓一下比較安心。
  tags: [dry]
- id: se-dry-26
  text: 這種天氣脫下圍巾常會噴出小火花，動作放慢就不那麼刺。
  tags: [dry]
- id: se-dry-27
  text: 早晨起床喉嚨乾乾的，床頭那杯水先潤一潤再開始一天。
  tags: [dry]
- id: se-dry-28
  text: 乾季裡棉被曬完蓬鬆得剛好，趁著好天氣讓它多吸點陽光。
  tags: [dry]
- id: se-dry-29
  text: 手背在乾冷中容易泛白起紋，戴副薄手套幫它們保住溫潤。
  tags: [dry]
- id: se-dry-30
  text: 這樣的乾天，麵包餅乾放外面反而更酥脆，倒是意外的小福利。
  tags: [dry]
- id: se-dry-31
  text: 洗完頭若不吹乾，乾空氣會把頭皮也帶得緊繃，記得烘暖它。
  tags: [dry]
- id: se-dry-32
  text: 乾燥的午後翻書特別順手，只是別忘了替喉嚨也留杯水。
  tags: [dry]
- id: se-dry-33
  text: 這種天連貓咪的毛都帶靜電，摸牠前先讓指尖碰碰桌角。
  tags: [dry]
- id: se-dry-34
  text: 乾季的天空常常透亮，抬頭看看遠山也讓乾澀的眼睛歇歇。
  tags: [dry]
- id: se-dry-35
  text: 護唇膏在包包底躺著，乾裂前先想起它會少受點罪。
  tags: [dry]
- id: se-dry-36
  text: 乾空氣讓臉頰容易泛紅發癢，卸妝後補層厚一點的乳霜安撫它。
  tags: [dry]
- id: se-dry-37
  text: 這種缺水的天氣，煮鍋熱湯讓廚房飄點水氣也暖了整間屋。
  tags: [dry]
- id: se-dry-38
  text: 乾燥時毛衣總黏著襯衫，穿之前噴點水霧就服貼多了。
  tags: [dry]
- id: se-dry-39
  text: 乾冷讓腳跟悄悄長出硬皮，睡前抹點乳液再套上襪子養一夜。
  tags: [dry]
- id: se-dry-40
  text: 乾季的星空格外清晰，散步時記得圍好脖子別讓風偷走溫度。
  tags: [dry]
