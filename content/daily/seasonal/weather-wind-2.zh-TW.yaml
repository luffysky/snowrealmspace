# 季節/天氣 · 有風的天（續）。繁體中文，每一則獨一無二。
- id: se-wind-21
  text: 風把曬衣夾吹得叮噹響，聽著也算一種節奏。
  tags: [windy]
- id: se-wind-22
  text: 這種風勢放風箏最合適，線一放就飛得老高。
  tags: [windy]
- id: se-wind-23
  text: 風把窗玻璃擦得乾淨，遠處看得格外清楚。
  tags: [windy]
- id: se-wind-24
  text: 起風時海面波光一閃一閃，看久了很療癒。
  tags: [windy]
- id: se-wind-25
  text: 風把炊煙帶往另一頭，巷子裡飄著晚飯的香。
  tags: [windy]
- id: se-wind-26
  text: 這麼會吹的天，出門前把桌上輕的東西壓一壓比較妥。
  tags: [windy]
- id: se-wind-27
  text: 風鈴被吹得響個不停，屋裡也熱鬧了起來。
  tags: [windy]
- id: se-wind-28
  text: 風一來，剛泡的茶涼得快，趁熱喝最剛好。
  tags: [windy]
- id: se-wind-29
  text: 曬棉被的日子遇上風，收進來時鬆軟又帶著陽光味。
  tags: [windy]
- id: se-wind-30
  text: 風把蒲公英吹散開，白絨絨地飄了一整片。
  tags: [windy]
- id: se-wind-31
  text: 這種風，煮飯開抽油煙機時火苗會晃，留意一下比較安心。
  tags: [windy]
- id: se-wind-32
  text: 風把雲的影子推過地面，草地明一塊暗一塊。
  tags: [windy]
- id: se-wind-33
  text: 起風的夜裡，聽著風繞過屋簷，睡得格外沉。
  tags: [windy]
- id: se-wind-34
  text: 風大時玩風帆或衝浪的人特別多，海邊很熱鬧。
  tags: [windy]
- id: se-wind-35
  text: 迎風騎車雖然費力，順風那段簡直像被推著走。
  tags: [windy]
- id: se-wind-36
  text: 風把晾著的床單吹得像帆，畫面挺好看的。
  tags: [windy]
- id: se-wind-37
  text: 這種天氣戴口罩容易被灌風，繩子調緊一點舒服些。
  tags: [windy]
- id: se-wind-38
  text: 風把陽台的風車轉得飛快，看著就覺得有活力。
  tags: [windy]
- id: se-wind-39
  text: 起風後空氣裡的花粉多，備著面紙在身上安心些。
  tags: [windy]
- id: se-wind-40
  text: 風穿過竹林那種沙沙聲，聽著心就靜了下來。
  tags: [windy]
