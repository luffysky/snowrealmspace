# 季節/天氣 · 下雪（續）。繁體中文，每一則獨一無二。
- id: se-snow-21
  text: 呵一口氣就成了白霧，指尖凍得有點紅也覺得可愛。
  tags: [snowy]
- id: se-snow-22
  text: 髮梢沾了幾片雪，還來不及化就閃著亮亮的光。
  tags: [snowy]
- id: se-snow-23
  text: 踩在新雪上那聲喀滋，聽起來莫名地讓人踏實。
  tags: [snowy]
- id: se-snow-24
  text: 遠處的松樹披上白外衣，像被誰細心裝點過一樣。
  tags: [snowy]
- id: se-snow-25
  text: 熱可可上頭浮著棉花糖，配這片雪剛剛好。
  tags: [snowy]
- id: se-snow-26
  text: 玻璃窗結了一層薄霜，用指頭畫個小圖案也挺有趣。
  tags: [snowy]
- id: se-snow-27
  text: 雪落無聲，卻把整個世界的音量都調小了一格。
  tags: [snowy]
- id: se-snow-28
  text: 靴子裡塞了雙厚襪，走再遠腳都暖呼呼的。
  tags: [snowy]
- id: se-snow-29
  text: 街燈底下的雪花一閃一閃，像有人撒了滿天碎銀。
  tags: [snowy]
- id: se-snow-30
  text: 掌心接住一朵雪花，看它慢慢融化也是種溫柔。
  tags: [snowy]
- id: se-snow-31
  text: 雪天的清晨特別安靜，連鳥叫都顯得清脆好聽。
  tags: [snowy]
- id: se-snow-32
  text: 圍巾遮住半張臉，只露出一雙笑彎的眼睛也很好。
  tags: [snowy]
- id: se-snow-33
  text: 田埂與屋頂連成一片白，分不清界線的模樣真美。
  tags: [snowy]
- id: se-snow-34
  text: 呼出的白氣和飄落的雪交纏，冬天就是這個味道。
  tags: [snowy]
- id: se-snow-35
  text: 車頂積了薄薄一層，出發前輕輕掃開就好。
  tags: [snowy]
- id: se-snow-36
  text: 雪地上留下一串腳印，回頭看看還挺有成就感的。
  tags: [snowy]
- id: se-snow-37
  text: 暖暖包塞在口袋，摸到它的那一刻整個人都放鬆了。
  tags: [snowy]
- id: se-snow-38
  text: 屋裡的窗蒙上一層水氣，把外頭的白襯得更朦朧。
  tags: [snowy]
- id: se-snow-39
  text: 睫毛上停了一小片雪，眨眨眼它就悄悄不見了。
  tags: [snowy]
- id: se-snow-40
  text: 雪夜裡的路燈暈成一團橘光，暖得讓人不想回家。
  tags: [snowy]
