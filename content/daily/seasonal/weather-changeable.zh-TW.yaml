# 季節/天氣 · 天氣多變。繁體中文，每一則獨一無二。
- id: se-changeable-01
  text: 今天天氣一下晴一下雨，出門帶把傘比較保險。
  tags: [changeable]
- id: se-changeable-02
  text: 早晚溫差有點大，多帶件外套會舒服些。
  tags: [changeable]
- id: se-changeable-03
  text: 這種難捉摸的天氣，洋蔥式穿法最派得上用場。
  tags: [changeable]
- id: se-changeable-04
  text: 剛剛還出大太陽，轉眼又飄起雨來。
  tags: [changeable]
- id: se-changeable-05
  text: 天氣像在跟人玩捉迷藏，晴雨之間變個不停。
  tags: [changeable]
- id: se-changeable-06
  text: 中午熱得像夏天，入夜又涼得像秋天。
  tags: [changeable]
- id: se-changeable-07
  text: 這幾天冷熱交替，身體的保暖多留意一些。
  tags: [changeable]
- id: se-changeable-08
  text: 陽光和雲層輪流上場，天空一整天都在變臉。
  tags: [changeable]
- id: se-changeable-09
  text: 忽晴忽雨的日子，薄外套放包包裡準沒錯。
  tags: [changeable]
- id: se-changeable-10
  text: 早上還冷颼颼，下午就暖了起來。
  tags: [changeable]
- id: se-changeable-11
  text: 這種說變就變的天氣，感冒特別容易找上門。
  tags: [changeable]
- id: se-changeable-12
  text: 出門看是晴天，回來時可能已經下過一場雨。
  tags: [changeable]
- id: se-changeable-13
  text: 溫度上上下下，衣服穿脫方便的最合適。
  tags: [changeable]
- id: se-changeable-14
  text: 天色反覆不定，計畫戶外行程時多留個備案。
  tags: [changeable]
- id: se-changeable-15
  text: 一件單薄的上衣應付不了這種溫差。
  tags: [changeable]
- id: se-changeable-16
  text: 雲來雲去之間，太陽時有時無。
  tags: [changeable]
- id: se-changeable-17
  text: 這樣的天氣容易讓人疲倦，作息穩一點會好過些。
  tags: [changeable]
- id: se-changeable-18
  text: 早晚涼、中午熱，一件方便加減的外套很實用。
  tags: [changeable]
- id: se-changeable-19
  text: 天氣捉摸不定的時候，出門前看一下即時預報很值得。
  tags: [changeable]
- id: se-changeable-20
  text: 說不準的天候，傘和外套一起帶著最安心。
  tags: [changeable]
