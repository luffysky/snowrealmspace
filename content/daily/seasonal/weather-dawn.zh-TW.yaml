# 季節/天氣 · 清晨天色。繁體中文，每一則獨一無二。
- id: se-dawn-01
  text: 天邊剛透出一點微光，新的一天悄悄開始了。
  tags: [dawn]
- id: se-dawn-02
  text: 清晨的空氣清新得很，深吸一口整個人都醒了。
  tags: [dawn]
- id: se-dawn-03
  text: 草葉上還掛著露水，晶瑩得像撒了一地小珠子。
  tags: [dawn]
- id: se-dawn-04
  text: 窗外傳來鳥鳴，把睡意一點一點喚了回去。
  tags: [dawn]
- id: se-dawn-05
  text: 太陽正從地平線升起，把雲染成溫柔的橘。
  tags: [dawn]
- id: se-dawn-06
  text: 這個時分的世界很安靜，只有微微的風在走動。
  tags: [dawn]
- id: se-dawn-07
  text: 天色由灰轉藍，清晨總是慢慢地亮起來。
  tags: [dawn]
- id: se-dawn-08
  text: 第一道陽光爬上牆角，房間也跟著暖了。
  tags: [dawn]
- id: se-dawn-09
  text: 露水沾濕了鞋尖，早晨帶著一點涼意。
  tags: [dawn]
- id: se-dawn-10
  text: 空氣裡有股清爽的味道，像被雨水洗過一樣。
  tags: [dawn]
- id: se-dawn-11
  text: 鳥叫聲此起彼落，替新的一天拉開了序幕。
  tags: [dawn]
- id: se-dawn-12
  text: 遠處的天空泛著魚肚白，晨光正一寸寸展開。
  tags: [dawn]
- id: se-dawn-13
  text: 清晨的光很柔，照在臉上一點也不刺眼。
  tags: [dawn]
- id: se-dawn-14
  text: 街道還沒醒，只有晨風和幾聲鳥啼作伴。
  tags: [dawn]
- id: se-dawn-15
  text: 東方的雲鑲上了金邊，日出就快來了。
  tags: [dawn]
- id: se-dawn-16
  text: 早晨的涼意剛剛好，適合慢慢喝杯溫水。
  tags: [dawn]
- id: se-dawn-17
  text: 晨光穿過樹葉，在地上灑出斑斑點點。
  tags: [dawn]
- id: se-dawn-18
  text: 天光乍亮，一切都像重新洗過，乾淨又清爽。
  tags: [dawn]
- id: se-dawn-19
  text: 露珠反著初升的陽光，閃出細細的金色。
  tags: [dawn]
- id: se-dawn-20
  text: 這個剛破曉的時刻，最適合替今天許個好願。
  tags: [dawn]
