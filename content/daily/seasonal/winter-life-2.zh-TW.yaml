# 季節 · 冬天生活（續）。繁體中文，每一則獨一無二。
- id: se-winterlife-21
  text: 冬至的湯圓在鍋裡浮上來，紅白相間，一家人分著吃就算團圓了。
  tags: [winter]
- id: se-winterlife-22
  text: 薑母鴨的砂鍋咕嘟咕嘟冒著泡，米酒香瀰漫整間屋子，寒意全被逼退。
  tags: [winter]
- id: se-winterlife-23
  text: 羽絨衣從衣櫃深處翻出來，套上身輕飄飄的，卻把整個人裹得暖烘烘。
  tags: [winter]
- id: se-winterlife-24
  text: 暖爐擺在腳邊烘著，一邊看書一邊烤腳，這一角落是冬天最捨不得離開的地方。
  tags: [winter]
- id: se-winterlife-25
  text: 聖誕節的街上飄著薑餅香，櫥窗裡的燈串閃著暖黃，走過都想放慢腳步。
  tags: [winter]
- id: se-winterlife-26
  text: 寒流南下那幾天，早上鑽出被窩得下很大的決心，冷得連空氣都是脆的。
  tags: [winter]
- id: se-winterlife-27
  text: 進補的季節，一碗麻油雞下肚，從胃裡一路暖到手腳末梢。
  tags: [winter]
- id: se-winterlife-28
  text: 泡進溫泉池的那一刻，白煙裊裊升起，肩上的僵硬也跟著鬆開了。
  tags: [winter]
- id: se-winterlife-29
  text: 冬天皮膚特別乾，抹上一層乳液，手背才不會裂得刺痛。
  tags: [winter]
- id: se-winterlife-30
  text: 下午五點天就黑透，路燈提早亮起，回家的路顯得格外漫長。
  tags: [winter]
- id: se-winterlife-31
  text: 早晨窗玻璃結滿水珠，掌心貼上去暖一暖，看它慢慢化出一道清晰。
  tags: [winter]
- id: se-winterlife-32
  text: 烤地瓜攤的香味老遠就聞到，捧著熱呼呼的一顆，手心先暖了。
  tags: [winter]
- id: se-winterlife-33
  text: 睡前泡個熱水腳，讓寒氣從腳底散去，被窩鑽起來也不再冰冷。
  tags: [winter]
- id: se-winterlife-34
  text: 毛帽壓到眉毛，口罩遮住半張臉，寒風一吹只剩眼睛在外頭打量世界。
  tags: [winter]
- id: se-winterlife-35
  text: 一鍋滷味咕嘟燉著，滷汁的香氣把整個冷冷的傍晚都燉得溫柔起來。
  tags: [winter]
- id: se-winterlife-36
  text: 曬棉被的好天氣難得，趁著出太陽全搬到陽台，晚上蓋起來滿是暖香。
  tags: [winter]
- id: se-winterlife-37
  text: 熱可可上頭浮著綿密的奶泡，捧著馬克杯，指尖一點一點回了溫。
  tags: [winter]
- id: se-winterlife-38
  text: 早上出門呵出的氣都成了白霧，圍巾往上拉一拉，把下巴也藏了進去。
  tags: [winter]
- id: se-winterlife-39
  text: 週末窩在沙發追劇，蓋上厚毯配熱茶，寒冷的天氣反而成了偷懶的理由。
  tags: [winter]
- id: se-winterlife-40
  text: 尾牙的桌上熱菜一道接一道，眾人舉杯談笑，把一整年的辛苦都熱鬧地收了尾。
  tags: [winter]
