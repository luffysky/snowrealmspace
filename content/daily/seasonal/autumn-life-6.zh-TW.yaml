# 季節 · 秋天生活（第六批）。繁體中文，每一則獨一無二。
- id: se-autumnlife-101
  text: 菱角上市了，買一包回家煮，剝開黑殼裡頭粉粉糯糯的，愈嚼愈香。
  tags: [autumn]
- id: se-autumnlife-102
  text: 夜市飄來紅豆餅的甜香，剛烤好的外皮酥脆，咬開內餡還燙著手。
  tags: [autumn]
- id: se-autumnlife-103
  text: 新竹的九降風一起，米粉架一排排掛出來曬，風愈大米粉曬得愈Q。
  tags: [autumn]
- id: se-autumnlife-104
  text: 一早上山遇上雲海，白茫茫在腳下翻湧，太陽一出來又鍍上一層金。
  tags: [autumn]
- id: se-autumnlife-105
  text: 洛神花紅豔豔的採回來，去籽蜜漬成蜜餞，酸甜開胃配茶正好。
  tags: [autumn]
- id: se-autumnlife-106
  text: 番石榴正脆，沾點梅子粉咬下去清甜爽口，一顆能啃上好一會兒。
  tags: [autumn]
- id: se-autumnlife-107
  text: 國慶夜的煙火在河邊炸開，一朵朵在夜空綻放，人群跟著此起彼落地讚嘆。
  tags: [autumn]
- id: se-autumnlife-108
  text: 收割後的田裡孩子們忙著焢窯，把地瓜埋進土窯裡燜，等的就是那口鬆軟香甜。
  tags: [autumn]
- id: se-autumnlife-109
  text: 草嶺古道的芒花開成一整片銀白，沿著稜線走，風一吹整片都在搖。
  tags: [autumn]
- id: se-autumnlife-110
  text: 灰面鵟鷹成群過境，盤旋著往南方去，賞鷹的人架起望遠鏡仰著頭數。
  tags: [autumn]
- id: se-autumnlife-111
  text: 把院子掃來的落葉堆到牆角，撒上土讓它慢慢化成肥，明年花圃就有養分。
  tags: [autumn]
- id: se-autumnlife-112
  text: 烤玉米的攤子入夜就支起來，醬刷上一層又一層，烤得焦香，捧著邊走邊啃。
  tags: [autumn]
- id: se-autumnlife-113
  text: 桂圓和糯米蒸成米糕，甜香軟糯的一塊下肚，天涼的胃立刻暖了起來。
  tags: [autumn]
- id: se-autumnlife-114
  text: 阿嬤用芒草綁了把掃帚，說這種掃帚掃院子最順手，一掃就是一大片。
  tags: [autumn]
- id: se-autumnlife-115
  text: 秋分過後晝夜對半，天黑得一天比一天早，晚飯後散步得多添件外套。
  tags: [autumn]
- id: se-autumnlife-116
  text: 溪口的鰻魚苗季一到，點點漁火整夜守著，撈的是一尾尾透明的小魚苗。
  tags: [autumn]
- id: se-autumnlife-117
  text: 廟口的麻糬攤支了起來，現搗的麻糬裹滿花生粉，軟糯得黏牙也甘願。
  tags: [autumn]
- id: se-autumnlife-118
  text: 山上的楓葉還沒全紅，倒是秋海棠在陰濕的石壁上開了一叢叢的粉。
  tags: [autumn]
- id: se-autumnlife-119
  text: 天涼了改用熱水瓶焐被窩，睡前塞進被裡，鑽進去時腳邊已經暖呼呼。
  tags: [autumn]
- id: se-autumnlife-120
  text: 芋頭收成扛回一大袋，削皮蒸熟壓成泥做芋泥，綿密香甜得停不下湯匙。
  tags: [autumn]
