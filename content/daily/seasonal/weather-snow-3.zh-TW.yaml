# 季節/天氣 · 下雪（第三批）。繁體中文，每一則獨一無二。
- id: se-snow-41
  text: 泡進熱湯池裡看雪飄，冷熱交織的暢快只有這時節才有。
  tags: [snowy]
- id: se-snow-42
  text: 毛帽拉低蓋住耳朵，寒風就吹不進來搗亂了。
  tags: [snowy]
- id: se-snow-43
  text: 電熱毯提早開著，鑽進被裡整個人瞬間就暖了。
  tags: [snowy]
- id: se-snow-44
  text: 用熱毛巾敷一敷冰涼的手，血色慢慢就回來了。
  tags: [snowy]
- id: se-snow-45
  text: 湊近看雪花是六角形的結晶，細緻得像誰精雕過。
  tags: [snowy]
- id: se-snow-46
  text: 貓咪縮在暖爐旁睡成一團，看著牠也跟著暖了起來。
  tags: [snowy]
- id: se-snow-47
  text: 一碗滾燙的薑茶下肚，寒氣從喉嚨一路暖到胃裡。
  tags: [snowy]
- id: se-snow-48
  text: 遠山罩著薄薄雲霧，雪白與灰藍疊在一起格外好看。
  tags: [snowy]
- id: se-snow-49
  text: 搓一搓兩隻手掌生點熱，再握住對方的手剛剛好。
  tags: [snowy]
- id: se-snow-50
  text: 屋裡點著暖黃的燈，把窗外的冷冽都隔在了外頭。
  tags: [snowy]
- id: se-snow-51
  text: 幾隻麻雀停在電線上縮著脖子，模樣憨憨的很療癒。
  tags: [snowy]
- id: se-snow-52
  text: 熬一鍋熱粥配點小菜，雪天的早餐簡單卻很滿足。
  tags: [snowy]
- id: se-snow-53
  text: 浸個熱水腳，讓暖意從腳底一路爬上來最舒服。
  tags: [snowy]
- id: se-snow-54
  text: 木門縫透進一絲冷風，塞條毛巾屋裡就暖和多了。
  tags: [snowy]
- id: se-snow-55
  text: 積在竹葉上的雪壓彎了枝條，偶爾簌地落下一小撮。
  tags: [snowy]
- id: se-snow-56
  text: 換上羊毛襪再套進拖鞋，地板的涼意就傳不上來了。
  tags: [snowy]
- id: se-snow-57
  text: 河面結了一層薄冰，陽光照上去閃著細碎的光。
  tags: [snowy]
- id: se-snow-58
  text: 手指凍得不太靈活，握筆寫字都得先呵口氣暖一暖。
  tags: [snowy]
- id: se-snow-59
  text: 熱牛奶溫在鍋上冒著小泡，雪夜配它最是安穩。
  tags: [snowy]
- id: se-snow-60
  text: 圍著暖桌剝橘子，一瓣接一瓣就把雪天悠悠過完了。
  tags: [snowy]
