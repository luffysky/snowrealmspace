# 季節/天氣 · 晴天（第四批）。繁體中文，每一則獨一無二。
- id: se-sun-61
  text: 蟬聲在樹梢一波接一波地響，把這樣的大晴天叫得格外熱鬧。
  tags: [sunny]
- id: se-sun-62
  text: 池塘邊的蜻蜓貼著水面點來點去，翅膀被陽光照得透亮。
  tags: [sunny]
- id: se-sun-63
  text: 趁著大太陽把醃好的梅子攤出來曬，酸香會一天比一天飽滿。
  tags: [sunny]
- id: se-sun-64
  text: 這種好天氣把香菇乾貨擺到院子曬一曬，收起來香氣更濃郁。
  tags: [sunny]
- id: se-sun-65
  text: 昨天淋濕的傘趁現在撐開晾著，曬乾了收起來才不會悶出霉味。
  tags: [sunny]
- id: se-sun-66
  text: 這麼舒服的天，找家有露天座位的咖啡館坐坐，時間都慢了下來。
  tags: [sunny]
- id: se-sun-67
  text: 到戶外曬個十來分鐘的太陽，身體會悄悄替你補上一點維他命 D。
  tags: [sunny]
- id: se-sun-68
  text: 曬過整個下午的毛巾摸起來蓬蓬鬆鬆，擦臉時還帶著陽光的暖。
  tags: [sunny]
- id: se-sun-69
  text: 陽光穿過桌上的玻璃杯，在牆面折出一小道彩虹，看著就開心。
  tags: [sunny]
- id: se-sun-70
  text: 洗完的頭髮不必吹，坐在窗邊曬一會兒，沒多久就乾得蓬鬆。
  tags: [sunny]
- id: se-sun-71
  text: 河面被太陽鋪滿了細碎的波光，晃啊晃的看久了心也跟著亮。
  tags: [sunny]
- id: se-sun-72
  text: 這樣的天到海邊走走，赤腳踩過被曬暖的沙子，暖意直往腳心竄。
  tags: [sunny]
- id: se-sun-73
  text: 屋簷下掛起一串紅辣椒，太陽一曬顏色更豔，看著就有食慾。
  tags: [sunny]
- id: se-sun-74
  text: 趁著烈日把小魚攤在竹篩上曬成魚乾，鹹鮮的味道就這樣鎖了進去。
  tags: [sunny]
- id: se-sun-75
  text: 拖把抹布洗完往陽光下一擺，曬透了就不會殘留那股悶悶的濕味。
  tags: [sunny]
- id: se-sun-76
  text: 白牆被曬得反光刺眼，出門前戴上帽沿壓低一點，眼睛會舒服許多。
  tags: [sunny]
- id: se-sun-77
  text: 樹上的柿子趁著秋陽一顆顆曬軟，果肉裡的甜就這樣慢慢凝了起來。
  tags: [sunny]
- id: se-sun-78
  text: 游完泳把泳衣泳巾攤在欄杆上，太陽沒一會兒就替你曬得清爽。
  tags: [sunny]
- id: se-sun-79
  text: 翻開受潮的舊書擱到陽光下攤著，散一散濕氣，紙頁就不再黏手。
  tags: [sunny]
- id: se-sun-80
  text: 傍晚的太陽把影子拉得老長，一路斜斜地跟在腳邊往家的方向去。
  tags: [sunny]
