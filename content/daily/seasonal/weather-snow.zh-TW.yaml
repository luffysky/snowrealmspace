# 季節/天氣 · 下雪。繁體中文，每一則獨一無二。
- id: se-snow-01
  text: 外頭飄雪了，圍巾繞緊一點再出門比較暖。
  tags: [snowy]
- id: se-snow-02
  text: 台灣難得見雪，這樣的白色風景值得多看兩眼。
  tags: [snowy]
- id: se-snow-03
  text: 積雪的路面容易打滑，踩穩了再往前走。
  tags: [snowy]
- id: se-snow-04
  text: 山上下雪的消息傳來，光是想像就覺得浪漫。
  tags: [snowy]
- id: se-snow-05
  text: 天冷得刺骨，手套跟帽子都戴上會踏實許多。
  tags: [snowy]
- id: se-snow-06
  text: 窗外一片銀白，窩在暖爐邊看著也是種享受。
  tags: [snowy]
- id: se-snow-07
  text: 雪花落在肩上很輕，拍一拍就化成小小的水珠。
  tags: [snowy]
- id: se-snow-08
  text: 這種天氣手腳最容易冰，握杯熱飲慢慢回溫。
  tags: [snowy]
- id: se-snow-09
  text: 賞雪固然開心，記得多穿一件別讓自己著涼。
  tags: [snowy]
- id: se-snow-10
  text: 屋簷掛著冰柱的模樣，遠遠看著格外靜謐。
  tags: [snowy]
- id: se-snow-11
  text: 圍爐的季節到了，一鍋熱湯就把寒意驅散了。
  tags: [snowy]
- id: se-snow-12
  text: 難得的雪景不常有，留張照片給以後的自己看。
  tags: [snowy]
- id: se-snow-13
  text: 雪地反光有點刺眼，瞇著眼或戴頂帽都好些。
  tags: [snowy]
- id: se-snow-14
  text: 進門先把沾雪的外套抖一抖，屋裡才不會濕答答。
  tags: [snowy]
- id: se-snow-15
  text: 寒流配著雪，被窩大概是全世界最溫柔的地方。
  tags: [snowy]
- id: se-snow-16
  text: 雪把街道鋪得安安靜靜，連腳步聲都變得輕柔。
  tags: [snowy]
- id: se-snow-17
  text: 合歡山飄雪的日子，山下的人也跟著雀躍起來。
  tags: [snowy]
- id: se-snow-18
  text: 天寒地凍，出門前讓身子熱起來會舒服很多。
  tags: [snowy]
- id: se-snow-19
  text: 堆個小雪人不需要理由，開心就是最好的藉口。
  tags: [snowy]
- id: se-snow-20
  text: 雪停之後陽光灑在白地上，那畫面暖進了心裡。
  tags: [snowy]
