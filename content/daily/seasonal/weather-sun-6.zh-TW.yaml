# 季節/天氣 · 晴天（第六批）。繁體中文，每一則獨一無二。
- id: se-sun-101
  text: 曬過的棉被拿藤拍拍幾下，浮塵一團團飛散，蓋起來更蓬鬆。
  tags: [sunny]
- id: se-sun-102
  text: 農家把新收的稻穀攤在曬穀場，太陽底下一天翻上好幾回。
  tags: [sunny]
- id: se-sun-103
  text: 趁大太陽把汆過的筍片攤開曬，收乾了留著燉湯，鮮味鎖得滿滿。
  tags: [sunny]
- id: se-sun-104
  text: 沿著河濱的自行車道騎一段，陽光在水面上一路陪著閃。
  tags: [sunny]
- id: se-sun-105
  text: 把榻榻米搬到院子曬一曬，午後躺上去有股乾爽的藺草香。
  tags: [sunny]
- id: se-sun-106
  text: 清早坐在灑滿陽光的餐桌前，翻著報紙配一杯咖啡，一天就從容地開了頭。
  tags: [sunny]
- id: se-sun-107
  text: 花圃間有幾隻蝴蝶忽高忽低地飛，翅膀在陽光下閃著細碎的色彩。
  tags: [sunny]
- id: se-sun-108
  text: 院子裡的醬缸掀開蓋子曬太陽，日頭一天天把豆香熬得更濃。
  tags: [sunny]
- id: se-sun-109
  text: 這樣的大晴天到海邊游泳，鹹鹹的海水配上肩頭的暖陽最痛快。
  tags: [sunny]
- id: se-sun-110
  text: 摸黑爬上山頂等日出，第一道金光翻過稜線的瞬間，冷意全被驅散。
  tags: [sunny]
- id: se-sun-111
  text: 大片雲影從草原上緩緩掠過，明一塊暗一塊地在地面移動。
  tags: [sunny]
- id: se-sun-112
  text: 剛曬好的浴巾裹在身上，那股被太陽烘暖的鬆軟最叫人放鬆。
  tags: [sunny]
- id: se-sun-113
  text: 港邊的漁夫把漁網攤在堤上曬，一格格網眼在陽光下清清楚楚。
  tags: [sunny]
- id: se-sun-114
  text: 田裡的稻穗被曬得一片金黃，風一吹便掀起一波波起伏的浪。
  tags: [sunny]
- id: se-sun-115
  text: 屋簷下掛起一串串玉米，太陽一曬顆粒更飽，留著慢慢磨成粉。
  tags: [sunny]
- id: se-sun-116
  text: 趁著好天到花田走走，一整片花海在陽光下開得熱熱鬧鬧。
  tags: [sunny]
- id: se-sun-117
  text: 把踩髒的門墊拿出去曬曬拍拍，灰塵散了擺回門口又清爽。
  tags: [sunny]
- id: se-sun-118
  text: 走進樹林裡，陽光從枝葉間篩下一地晃動的光斑，踩著它前行很療癒。
  tags: [sunny]
- id: se-sun-119
  text: 把橘子皮攤在竹篩上曬乾，收進罐裡擱著，日子久了就成了陳皮。
  tags: [sunny]
- id: se-sun-120
  text: 站上觀景台遠眺，晴空底下整座城市的樓房都看得一清二楚。
  tags: [sunny]
