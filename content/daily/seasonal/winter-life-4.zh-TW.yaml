# 季節 · 冬天生活（第四批）。繁體中文，每一則獨一無二。
- id: se-winterlife-61
  text: 睡前把電熱毯打開預熱，鑽進被窩時床鋪已經暖烘烘的了。
  tags: [winter]
- id: se-winterlife-62
  text: 超商的關東煮咕嘟咕嘟煮著，挑幾樣燙口的，站在門口就吃了起來。
  tags: [winter]
- id: se-winterlife-63
  text: 嘴唇乾得脫了皮，護唇膏成了這陣子口袋裡最常摸到的東西。
  tags: [winter]
- id: se-winterlife-64
  text: 紅豆湯熬得綿綿密密，丟顆麻糬進去，捧著碗暖手又暖胃。
  tags: [winter]
- id: se-winterlife-65
  text: 手機在冷風裡掉電特別快，出門前總得多充一會兒才安心。
  tags: [winter]
- id: se-winterlife-66
  text: 一早汽車的擋風玻璃結了層薄霜，得刮一刮才看得清前方的路。
  tags: [winter]
- id: se-winterlife-67
  text: 洗碗的水冰得刺骨，只好開了熱水才敢把手慢慢伸進去。
  tags: [winter]
- id: se-winterlife-68
  text: 騎車出門寒風像刀子刮臉，把安全帽的鏡片壓下來才擋得住。
  tags: [winter]
- id: se-winterlife-69
  text: 鬧鐘響了好幾回，還是縮在被子裡不肯動，冬天的床特別黏人。
  tags: [winter]
- id: se-winterlife-70
  text: 家裡的貓找到一塊有陽光的地板，蜷成一團睡得香甜。
  tags: [winter]
- id: se-winterlife-71
  text: 深夜嘴饞泡了碗麵，熱湯一下肚，寒意跟著散了大半。
  tags: [winter]
- id: se-winterlife-72
  text: 拿起毛線織圍巾，一針一針慢慢繞，織著織著手心也暖了起來。
  tags: [winter]
- id: se-winterlife-73
  text: 先開了暖風機再走進浴室，脫衣服時就不會冷得直發抖。
  tags: [winter]
- id: se-winterlife-74
  text: 泡壺熱烏龍配幾塊小點心，一個下午就這樣暖暖地過去了。
  tags: [winter]
- id: se-winterlife-75
  text: 出門前一層一層往身上加，回到屋裡又一件件卸下，像在換裝。
  tags: [winter]
- id: se-winterlife-76
  text: 沒戴手套就把兩手插進口袋，縮著肩膀快步往前走。
  tags: [winter]
- id: se-winterlife-77
  text: 躲進圖書館避寒，暖氣開得舒服，一坐就是一整個下午。
  tags: [winter]
- id: se-winterlife-78
  text: 路邊的雞蛋糕烤得金黃，買一袋捧在手裡，邊走邊吃邊取暖。
  tags: [winter]
- id: se-winterlife-79
  text: 睡前熱一杯牛奶，小口小口喝完，身子暖了也比較好入睡。
  tags: [winter]
- id: se-winterlife-80
  text: 行道樹的葉子落得差不多了，光禿禿的枝椏伸向灰灰的天空。
  tags: [winter]
