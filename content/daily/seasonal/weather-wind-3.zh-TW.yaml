# 季節/天氣 · 有風的天（第三批）。繁體中文，每一則獨一無二。
- id: se-wind-41
  text: 風把樹上的桂花香一路送進屋，聞著就想深吸幾口。
  tags: [windy]
- id: se-wind-42
  text: 這種風勢曬香菇乾得均勻，收進罐子時香氣特別足。
  tags: [windy]
- id: se-wind-43
  text: 風把湖面的荷葉翻來翻去，綠得一閃一閃很好看。
  tags: [windy]
- id: se-wind-44
  text: 起風時放紙飛機最有趣，一鬆手就被托著往前衝。
  tags: [windy]
- id: se-wind-45
  text: 風把陽台的洗手台吹乾了，水漬一下就沒了痕跡。
  tags: [windy]
- id: se-wind-46
  text: 這麼會吹的天，關窗前把桌邊的稿紙壓好比較放心。
  tags: [windy]
- id: se-wind-47
  text: 風穿過騎樓，把攤販的布幔掀得啪啪響，很有市集味。
  tags: [windy]
- id: se-wind-48
  text: 起風後蚊子少了大半，傍晚在院子坐著格外舒服。
  tags: [windy]
- id: se-wind-49
  text: 風把稻田掃出一波波起伏，遠看像一整片綠色的浪。
  tags: [windy]
- id: se-wind-50
  text: 這種天騎機車，安全帽的鏡片扣緊一點會安穩許多。
  tags: [windy]
- id: se-wind-51
  text: 風把冷掉的湯麵吹得起皺，趁著還溫熱先喝上一口。
  tags: [windy]
- id: se-wind-52
  text: 起風的清晨慢跑，順風那段簡直像被輕輕托著跑。
  tags: [windy]
- id: se-wind-53
  text: 風把曬架上的襪子吹成一排小旗子，晃啊晃的很逗趣。
  tags: [windy]
- id: se-wind-54
  text: 這麼強的風，遮陽傘收起來擺著，免得被吹翻。
  tags: [windy]
- id: se-wind-55
  text: 風把楓葉一片片捲下來，落在肩上時軟軟的很輕。
  tags: [windy]
- id: se-wind-56
  text: 起風的午後泡壺熱茶，握著杯子看窗外樹影搖，很愜意。
  tags: [windy]
- id: se-wind-57
  text: 風把公園的鞦韆吹得微微晃，空著也像有人剛盪過。
  tags: [windy]
- id: se-wind-58
  text: 這種風放進帳篷會鼓成一顆球，露營前把營釘打牢些。
  tags: [windy]
- id: se-wind-59
  text: 風把街角的落葉堆吹散又聚，掃地的人只好笑著搖頭。
  tags: [windy]
- id: se-wind-60
  text: 起風時晾的棉被會微微鼓起，收進來時蓬鬆又帶著風的涼。
  tags: [windy]
