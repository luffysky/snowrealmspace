# 季節/天氣 · 寒冷（第四批）。繁體中文，每一則獨一無二。
- id: se-cold-61
  text: 羽絨外套的拉鍊拉到頸口，寒風就鑽不進來。
  tags: [cold]
- id: se-cold-62
  text: 貼身先套一件發熱衣，外頭再冷也扛得住。
  tags: [cold]
- id: se-cold-63
  text: 溫一杯牛奶捧在手裡，暖了胃也好入睡。
  tags: [cold]
- id: se-cold-64
  text: 桌子底下擺台小電暖器，腳邊暖了坐著才安穩。
  tags: [cold]
- id: se-cold-65
  text: 紅豆湯在鍋裡冒著熱氣，盛一碗連手心都暖了。
  tags: [cold]
- id: se-cold-66
  text: 手凍僵的時候，呵口氣再搓一搓就回了暖。
  tags: [cold]
- id: se-cold-67
  text: 清晨的草葉上結了一層白霜，踩過去沙沙作響。
  tags: [cold]
- id: se-cold-68
  text: 便利商店的關東煮咕嘟冒煙，挑幾樣熱熱地吃下肚。
  tags: [cold]
- id: se-cold-69
  text: 換上一件保暖內搭褲，雙腿就不再冰涼。
  tags: [cold]
- id: se-cold-70
  text: 門縫底下塞條布，冷風便灌不進屋裡。
  tags: [cold]
- id: se-cold-71
  text: 沖一杯熱奶茶，甜香和暖意一起漫上來。
  tags: [cold]
- id: se-cold-72
  text: 手背凍得龜裂，用溫水泡一泡再抹點油就好。
  tags: [cold]
- id: se-cold-73
  text: 冷得直發抖時，跺跺腳搓搓手身子就熱起來。
  tags: [cold]
- id: se-cold-74
  text: 厚棉被沉沉壓在身上，那份重量裹著人格外安穩。
  tags: [cold]
- id: se-cold-75
  text: 口袋裡揣個暖手蛋，走在路上指尖都是暖的。
  tags: [cold]
- id: se-cold-76
  text: 一碗熱騰騰的湯麵下肚，寒意就從胃裡被驅散。
  tags: [cold]
- id: se-cold-77
  text: 冬天天亮得晚，出門時外頭還是一片暗。
  tags: [cold]
- id: se-cold-78
  text: 熱茶的蒸氣撲上臉，連鼻尖都暖了一下。
  tags: [cold]
- id: se-cold-79
  text: 厚窗簾一拉上，窗邊透進來的冷風就擋掉大半。
  tags: [cold]
- id: se-cold-80
  text: 套上毛料的脖圍，領口一暖整個人都鬆了。
  tags: [cold]
