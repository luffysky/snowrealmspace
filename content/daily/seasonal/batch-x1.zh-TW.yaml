    text: 乾巴巴的空氣，記得多補水給身體。
    tags: [dry]
  - id: se-x1b-0380
    text: 乾燥天，喉嚨不適就喝點蜂蜜水。
    tags: [dry]
  - id: se-x1b-0381
    text: 空氣乾，替房裡晾條濕毛巾增濕。
    tags: [dry]
  - id: se-x1b-0382
    text: 乾冷的日子，臉頰記得厚厚地保濕。
    tags: [dry]
  - id: se-x1b-0383
    text: 天氣乾燥，眼藥水放身邊備著。
    tags: [dry]
  - id: se-x1b-0384
    text: 乾燥天，別忘了替頭髮也做保濕。
    tags: [dry]
  - id: se-x1b-0385
    text: 空氣乾，泡杯溫茶潤潤發乾的喉。
    tags: [dry]
  - id: se-x1b-0386
    text: 乾巴巴的午後，多喝水少熬夜。
    tags: [dry]
  - id: se-x1b-0387
    text: 天氣乾，皮膚緊繃就補點面霜。
    tags: [dry]
  - id: se-x1b-0388
    text: 乾燥的日子，記得替鼻腔也保保濕。
    tags: [dry]
  - id: se-x1b-0389
    text: 乾冷天，護唇膏放口袋隨時補。
    tags: [dry]
  - id: se-x1b-0390
    text: 空氣缺水，擺盆綠植也能潤潤氣。
    tags: [dry]
  - id: se-x1b-0391
    text: 天氣乾，靜電來時別急，慢慢碰。
    tags: [dry]
  - id: se-x1b-0392
    text: 乾燥午後，一杯水勝過一杯咖啡。
    tags: [dry]
  - id: se-x1b-0393
    text: 乾巴巴的天，替身體多存點水分。
    tags: [dry]
  - id: se-x1b-0394
    text: 空氣乾，睡前替房間加點濕氣吧。
    tags: [dry]
  - id: se-x1b-0395
    text: 乾燥天，皮膚保濕從洗完澡開始。
    tags: [dry]
  - id: se-x1b-0396
    text: 天氣乾，記得替嘴唇和雙手都潤潤。
    tags: [dry]
  - id: se-x1b-0397
    text: 乾冷的日子，多喝溫水少喝冰。
    tags: [dry]
  - id: se-x1b-0398
    text: 空氣乾，替眼睛留點休息別太累。
    tags: [dry]
  - id: se-x1b-0399
    text: 乾燥午後，補水也補一點好心情。
    tags: [dry]
  - id: se-x1b-0400
    text: 天氣乾，護手霜和水壺隨身帶著。
    tags: [dry]
