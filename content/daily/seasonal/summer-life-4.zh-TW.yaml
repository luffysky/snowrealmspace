# 季節 · 夏天生活（第四批）。繁體中文，每一則獨一無二。
- id: se-summerlife-61
  text: 等紅燈時搖下車窗，賣玉蘭花的阿姨遞來一串，滿車都是清雅的香。
  tags: [summer]
- id: se-summerlife-62
  text: 仙草凍淋上黑糖水加碎冰，滑溜溜一碗下肚，暑氣退了大半。
  tags: [summer]
- id: se-summerlife-63
  text: 鄉下阿嬤家還掛著蚊帳，鑽進去放下帳簾，睡覺再也不怕被叮。
  tags: [summer]
- id: se-summerlife-64
  text: 拆下冷氣濾網沖掉整層灰，裝回去一開，涼風明顯順暢多了。
  tags: [summer]
- id: se-summerlife-65
  text: 頂樓的鐵皮被曬得發燙，站上去沒幾秒就想逃回有遮蔭的地方。
  tags: [summer]
- id: se-summerlife-66
  text: 運動到一半汗水滑進眼睛，鹹得睜不開，只好停下來拿毛巾抹一把。
  tags: [summer]
- id: se-summerlife-67
  text: 夜市撈金魚的水盆前蹲了好久，紙網一破，撈起的小魚又溜回水裡。
  tags: [summer]
- id: se-summerlife-68
  text: 灌滿水的水球往彼此身上砸，濕透了一身，笑聲卻停不下來。
  tags: [summer]
- id: se-summerlife-69
  text: 中午躺在磁磚地板上午睡，背貼著冰涼的地磚，比開冷氣還舒服。
  tags: [summer]
- id: se-summerlife-70
  text: 這個月的電費單厚了一截，冷氣吹得爽快，帳單也跟著有感。
  tags: [summer]
- id: se-summerlife-71
  text: 絲瓜煮成一鍋清湯，甜滋滋的湯頭喝起來，暑天也胃口大開。
  tags: [summer]
- id: se-summerlife-72
  text: 涼拌苦瓜冰過再吃，苦味淡了幾分，配飯格外開胃。
  tags: [summer]
- id: se-summerlife-73
  text: 沙灘上堆起一座小城堡，插上撿來的貝殼，一個浪打來又得重來。
  tags: [summer]
- id: se-summerlife-74
  text: 出門前戴上太陽眼鏡，刺眼的陽光柔和下來，世界也沒那麼晃了。
  tags: [summer]
- id: se-summerlife-75
  text: 汽水拉環一開嘶地冒出氣泡，第一口沁涼直衝上腦門，透心舒暢。
  tags: [summer]
- id: se-summerlife-76
  text: 冰鎮的啤酒配著剛烤好的串燒，夏夜的悶熱好像也沒那麼難熬。
  tags: [summer]
- id: se-summerlife-77
  text: 傍晚提著水壺替陽台的花澆水，泥土升起一股濕潤的土味。
  tags: [summer]
- id: se-summerlife-78
  text: 索性把頭髮剪短，脖子後頭一涼，整個夏天都清爽了起來。
  tags: [summer]
- id: se-summerlife-79
  text: 溪邊草叢裡螢火蟲一點一點亮起，微光在暗處飄，看得人屏住了氣。
  tags: [summer]
- id: se-summerlife-80
  text: 水上樂園的漂漂河把人載著慢慢繞，躺在泳圈上什麼都不用想。
  tags: [summer]
