# 季節/天氣 · 起霧（續）。繁體中文，每一則獨一無二。
- id: se-fog-21
  text: 晨霧還沒散去，出門前多留幾分鐘給自己會從容些。
  tags: [foggy]
- id: se-fog-22
  text: 對向車燈在霧裡糊成一片光，早點打方向燈讓人看見你。
  tags: [foggy]
- id: se-fog-23
  text: 曬衣繩上的衣服今天別急著收，霧氣散了它們才會真的乾。
  tags: [foggy]
- id: se-fog-24
  text: 霧貼在紗窗上凝成細細的水珠，順手用布抹過就清爽了。
  tags: [foggy]
- id: se-fog-25
  text: 慢跑挑霧淡一點再出門，這種空氣悶著不太好深呼吸。
  tags: [foggy]
- id: se-fog-26
  text: 過馬路多看兩眼，霧裡的車往往比想像中來得近。
  tags: [foggy]
- id: se-fog-27
  text: 機場起霧班機常會誤點，出發前查一下時刻表比較安心。
  tags: [foggy]
- id: se-fog-28
  text: 眼鏡一走進霧裡就蒙上白霧，擦鏡布放口袋隨手能用。
  tags: [foggy]
- id: se-fog-29
  text: 田埂上白霧低低地鋪著，遠處的農舍只露出一角屋簷。
  tags: [foggy]
- id: se-fog-30
  text: 霧氣裡的花香飄得特別遠，走過巷口會聞到淡淡一縷。
  tags: [foggy]
- id: se-fog-31
  text: 河面上騰起薄霧，對岸的橋在白影裡只剩一道線。
  tags: [foggy]
- id: se-fog-32
  text: 拍照趁霧還沒散，這種光線最能拍出柔柔的層次。
  tags: [foggy]
- id: se-fog-33
  text: 霧天曬棉被不太合適，等哪天出了太陽再抱去陽台。
  tags: [foggy]
- id: se-fog-34
  text: 濃霧裡連鳥鳴都聽得格外清楚，世界安靜得像按了靜音。
  tags: [foggy]
- id: se-fog-35
  text: 走山路遇上霧，扶著護欄慢慢下坡踩穩每一步。
  tags: [foggy]
- id: se-fog-36
  text: 霧從山谷慢慢漫上來，把整片茶園都籠成一層薄紗。
  tags: [foggy]
- id: se-fog-37
  text: 晾在外頭的鞋子先移進屋簷下，霧重的夜裡它們乾不了。
  tags: [foggy]
- id: se-fog-38
  text: 清晨的蜘蛛網掛滿霧珠，在微光裡亮得像串小小的燈。
  tags: [foggy]
- id: se-fog-39
  text: 霧散開的那一刻，藏了整夜的山色一下子全亮了出來。
  tags: [foggy]
- id: se-fog-40
  text: 城市在晨霧裡輪廓變得柔軟，高樓像浮在雲上的剪影。
  tags: [foggy]
