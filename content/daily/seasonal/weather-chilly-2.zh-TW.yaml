# 季節/天氣 · 轉涼降溫（續）。繁體中文，每一則獨一無二。
- id: se-chilly-21
  text: 熱茶放在手心的時間變長了，捨不得那點溫度太快散掉。
  tags: [chilly]
- id: se-chilly-22
  text: 早上鑽出被窩需要一點勇氣，空氣冷得讓人多躺了五分鐘。
  tags: [chilly]
- id: se-chilly-23
  text: 洗完澡的浴室鏡子起了一層霧，冷空氣正悄悄佔據屋子。
  tags: [chilly]
- id: se-chilly-24
  text: 走進便利商店，關東煮的熱氣忽然變得特別誘人。
  tags: [chilly]
- id: se-chilly-25
  text: 拖鞋踩在地板上有點冰，找雙厚襪子來配剛剛好。
  tags: [chilly]
- id: se-chilly-26
  text: 呼出的氣息開始看得見淡淡白煙，天氣是真的冷了。
  tags: [chilly]
- id: se-chilly-27
  text: 棉被又被拉回身上蓋緊，昨晚那床薄的已經不夠了。
  tags: [chilly]
- id: se-chilly-28
  text: 手機摸起來冰涼，握久了指尖會微微發麻。
  tags: [chilly]
- id: se-chilly-29
  text: 通勤路上多了不少戴帽子的人，大家都感覺到寒意逼近。
  tags: [chilly]
- id: se-chilly-30
  text: 廚房裡燉湯的香味久久不散，冷天讓熱食格外療癒。
  tags: [chilly]
- id: se-chilly-31
  text: 電風扇默默退場，換成想窩在毯子裡的那種夜晚。
  tags: [chilly]
- id: se-chilly-32
  text: 剛拿進屋的外套帶著一身涼氣，得抖一抖才敢穿上。
  tags: [chilly]
- id: se-chilly-33
  text: 睡前的地板涼得讓人加快腳步，趕緊躲回床上取暖。
  tags: [chilly]
- id: se-chilly-34
  text: 清晨的窗邊凝著薄薄水珠，是氣溫下探留下的痕跡。
  tags: [chilly]
- id: se-chilly-35
  text: 喝冰水的次數少了，手自然而然伸向溫熱的那一杯。
  tags: [chilly]
- id: se-chilly-36
  text: 洗碗時的水變得刺手，開熱水才願意多站一會兒。
  tags: [chilly]
- id: se-chilly-37
  text: 街上的行道樹落葉鋪了一地，踩上去沙沙作響帶著涼。
  tags: [chilly]
- id: se-chilly-38
  text: 被單從曬衣桿收回來時是冰的，得攤開暖一下再鋪床。
  tags: [chilly]
- id: se-chilly-39
  text: 摩托車坐墊一早冰得驚人，出門前的第一秒總會縮一下。
  tags: [chilly]
- id: se-chilly-40
  text: 熱水袋又從櫃子深處被翻了出來，抱著它才睡得安穩。
  tags: [chilly]
