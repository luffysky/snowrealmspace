# 季節 · 秋天生活（第四批）。繁體中文，每一則獨一無二。
- id: se-autumnlife-61
  text: 天一轉涼就想進補，市場的薑母鴨攤前排起隊，鍋裡的香氣勾人。
  tags: [autumn]
- id: se-autumnlife-62
  text: 燒仙草端上桌熱氣騰騰，加了花生和芋圓，捧著碗手心都暖了。
  tags: [autumn]
- id: se-autumnlife-63
  text: 秋風正好放風箏，把線一放，五彩的風箏在藍天裡越飛越高。
  tags: [autumn]
- id: se-autumnlife-64
  text: 陽台上開始曬起香腸，一串串在秋陽下慢慢滲出油光，等著過年吃。
  tags: [autumn]
- id: se-autumnlife-65
  text: 拿起掃把清院子裡的落葉，掃成一堆又被風吹散，索性坐下歇會兒。
  tags: [autumn]
- id: se-autumnlife-66
  text: 清晨買一杯熱豆漿配燒餅，暖流從胃裡散開，一天就這樣醒了過來。
  tags: [autumn]
- id: se-autumnlife-67
  text: 換季逛街添了頂毛帽和幾雙厚襪，摸起來軟軟的，心先暖了半截。
  tags: [autumn]
- id: se-autumnlife-68
  text: 把薄窗簾換成厚一點的，晚上拉起來，屋裡的暖意也留得住了。
  tags: [autumn]
- id: se-autumnlife-69
  text: 傍晚的天邊燒成一片橘紅，火燒雲鋪滿了半邊天，看得挪不開眼。
  tags: [autumn]
- id: se-autumnlife-70
  text: 口袋裡揣進今年第一包暖暖包，搓一搓熱起來，手指頭就不冰了。
  tags: [autumn]
- id: se-autumnlife-71
  text: 天冷煮一鍋紅豆湯，加點小湯圓，甜甜熱熱地喝完全身都暖了。
  tags: [autumn]
- id: se-autumnlife-72
  text: 稻田到了收割的時候，割稻機轟隆隆駛過，金黃一畦畦倒了下來。
  tags: [autumn]
- id: se-autumnlife-73
  text: 候鳥成群往南飛，排成人字劃過天空，抬頭看著看著就出了神。
  tags: [autumn]
- id: se-autumnlife-74
  text: 睡前燒壺熱水泡個腳，暖意從腳底一路爬上來，整個人都鬆了。
  tags: [autumn]
- id: se-autumnlife-75
  text: 沿著河濱騎腳踏車，秋風迎面吹來不黏不燙，踩起來格外輕快。
  tags: [autumn]
- id: se-autumnlife-76
  text: 摘下滿樹的桂花釀成一罐，舀一匙沖溫水，滿口都是清甜的香。
  tags: [autumn]
- id: se-autumnlife-77
  text: 趁著大太陽把冬天的厚被搬出來曬，收進屋裡蓬鬆又帶著暖香。
  tags: [autumn]
- id: se-autumnlife-78
  text: 翻整菜圃種下一排青蒜和菜苗，盤算著入冬就有自家的青菜吃。
  tags: [autumn]
- id: se-autumnlife-79
  text: 空氣乾得喉嚨發癢，桌上擺杯溫開水，時不時喝一口潤一潤。
  tags: [autumn]
- id: se-autumnlife-80
  text: 秋天早起看日出不冷不熱，天色由暗轉亮，海面慢慢鍍上一層金。
  tags: [autumn]
