# 季節 · 夏天生活（續）。繁體中文，每一則獨一無二。
- id: se-summerlife-21
  text: 端午節到了，廚房飄出粽葉的清香，剝開糯米燙手也甘願。
  tags: [summer]
- id: se-summerlife-22
  text: 龍舟在河面上一齊划槳，鼓聲整齊地敲，岸邊的人跟著喊加把勁。
  tags: [summer]
- id: se-summerlife-23
  text: 果汁機轟一聲把西瓜打成沙，倒進杯裡紅通通，比買的還過癮。
  tags: [summer]
- id: se-summerlife-24
  text: 電風扇對著臉吹整晚，扇葉聲成了睡前最安心的節奏。
  tags: [summer]
- id: se-summerlife-25
  text: 睡前點一盤蚊香，淡淡的煙味繞著床邊，把惱人的嗡嗡都擋在外頭。
  tags: [summer]
- id: se-summerlife-26
  text: 暑期打工的第一份薪水入帳，數字不大，握在手裡卻沉甸甸的踏實。
  tags: [summer]
- id: se-summerlife-27
  text: 颱風假宣布的那晚，窗外風雨大作，屋裡卻多了一份偷來的悠閒。
  tags: [summer]
- id: se-summerlife-28
  text: 套上游泳圈漂在水面，什麼都不用做，任由水波把人輕輕托著。
  tags: [summer]
- id: se-summerlife-29
  text: 冷氣房裡蓋著薄被，外頭三十幾度，這一小塊涼意是自己的秘密基地。
  tags: [summer]
- id: se-summerlife-30
  text: 涼麵淋上芝麻醬拌得均勻，配一碗味噌湯，熱天也吃得下飯。
  tags: [summer]
- id: se-summerlife-31
  text: 大熱天喝下一口麥茶，冰涼順著喉嚨滑下去，整個人清醒了過來。
  tags: [summer]
- id: se-summerlife-32
  text: 陽台的九層塔曬了整季太陽，長得又密又香，隨手摘幾片就能入菜。
  tags: [summer]
- id: se-summerlife-33
  text: 蛙鳴從田邊一路傳來，夏夜的鄉下比城裡還熱鬧幾分。
  tags: [summer]
- id: se-summerlife-34
  text: 汗衫濕透貼在背上，走進浴室沖個冷水澡，是這種天氣最痛快的獎賞。
  tags: [summer]
- id: se-summerlife-35
  text: 鹽水雞攤前排著隊，老闆手起刀落地剪好，撒上蔥花帶回家配電視。
  tags: [summer]
- id: se-summerlife-36
  text: 蚊子包被抓破了皮，抹上涼涼的藥膏，那股清涼比止癢還舒服。
  tags: [summer]
- id: se-summerlife-37
  text: 傍晚騎車經過稻田，晚風帶著青草味撲面而來，一天的黏膩都散了。
  tags: [summer]
- id: se-summerlife-38
  text: 冷凍庫裡自己做的百香果冰塊，丟進氣泡水裡冒著泡，酸甜又消暑。
  tags: [summer]
- id: se-summerlife-39
  text: 蓮霧和荔枝擺滿了水果攤，紅豔豔一整片，夏天的甜都在這了。
  tags: [summer]
- id: se-summerlife-40
  text: 溪邊烤肉的煙火味混著水氣，腳泡在沁涼的溪水裡，時光慢得剛剛好。
  tags: [summer]
