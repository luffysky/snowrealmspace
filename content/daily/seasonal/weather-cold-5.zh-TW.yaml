# 季節/天氣 · 寒冷（第五批）。繁體中文，每一則獨一無二。
- id: se-cold-81
  text: 烤箱裡烘著東西，開著門散出的餘溫把小廚房都烘得暖烘烘。
  tags: [cold]
- id: se-cold-82
  text: 把加熱過的熱敷袋搭在肩頸上，僵硬的地方一暖就鬆了開來。
  tags: [cold]
- id: se-cold-83
  text: 煮壺熱紅酒，丟幾片柳橙和肉桂進去，甜香和暖意一起在鍋裡翻騰。
  tags: [cold]
- id: se-cold-84
  text: 巷口的包子攤蒸籠掀開，白煙一湧而上，買兩顆熱包子捧著手都暖了。
  tags: [cold]
- id: se-cold-85
  text: 翻出毛線織條圍巾，一針一針織著，指尖忙著、心也跟著靜下來。
  tags: [cold]
- id: se-cold-86
  text: 結了薄冰的人行道走起來滑，腳掌放平、步子踩小一點才穩當。
  tags: [cold]
- id: se-cold-87
  text: 貓咪蜷在腿上取暖，那團毛茸茸的重量壓著，誰也捨不得起身。
  tags: [cold]
- id: se-cold-88
  text: 小籠包上桌熱氣直冒，夾一顆蘸點薑絲醋，暖意從舌尖一路下到胃。
  tags: [cold]
- id: se-cold-89
  text: 沖一碗即溶的玉米濃湯捧著喝，稠稠燙燙的一口下去渾身都暖。
  tags: [cold]
- id: se-cold-90
  text: 屋簷邊垂下幾根晶亮的冰柱，太陽一照折出細細的光。
  tags: [cold]
- id: se-cold-91
  text: 把腳伸進暖桌底下，一條被子罩著膝蓋，寒意就進不來了。
  tags: [cold]
- id: se-cold-92
  text: 貼片暖足貼在鞋墊底下，走在冷風裡腳心一路都是溫的。
  tags: [cold]
- id: se-cold-93
  text: 路邊現煎的蔥油餅滋滋作響，遞到手裡燙呼呼，咬一口滿嘴椒鹽香。
  tags: [cold]
- id: se-cold-94
  text: 手套厚了觸控失靈，換上一雙能滑手機的，凍手也不必露指尖。
  tags: [cold]
- id: se-cold-95
  text: 車輪餅攤前排著隊，剛烤好的紅豆餡燙嘴，捧在手裡邊走邊吃最暖。
  tags: [cold]
- id: se-cold-96
  text: 熱敷袋放進微波爐轉一分鐘，抱著暖呼呼的它窩進沙發最舒服。
  tags: [cold]
- id: se-cold-97
  text: 怕霜凍壞了盆栽，入夜前把它們一盆盆搬進屋簷底下避一避。
  tags: [cold]
- id: se-cold-98
  text: 睡前用溫熱的手掌搓一搓腳底，暖了穴道整夜睡得安穩。
  tags: [cold]
- id: se-cold-99
  text: 屋外的水龍頭滴著滴著在夜裡凝成一小球冰，早上開水前先澆點溫水化開。
  tags: [cold]
- id: se-cold-100
  text: 冬日天黑得早，下午四五點光線就暗了，早早把燈點上屋裡便添了幾分暖。
  tags: [cold]
