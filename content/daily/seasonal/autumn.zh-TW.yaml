# 季節·節氣 · 秋。tags 至少含 autumn；可再加節氣 slug（liqiu…shuangjiang）。
- id: se-autumn-01
  text: 風開始帶涼意，適合把心思收一收。
  tags: [autumn, liqiu]
- id: se-autumn-02
  text: 葉子換色不是結束，是換一種樣子。
  tags: [autumn]
- id: se-autumn-03
  text: 秋天適合回頭看看，這半年做了什麼。
  tags: [autumn]
- id: se-autumn-04
  text: 收成的季節，替自己盤點一下也好。
  tags: [autumn]
- id: se-autumn-05
  text: 日照短了，早點開燈、暖暖地做事。
  tags: [autumn]
- id: se-autumn-06
  text: 涼爽的午後，最適合慢慢做一件事。
  tags: [autumn]
- id: se-autumn-07
  text: 秋高氣爽，出門走走再回來。
  tags: [autumn]
- id: se-autumn-08
  text: 落葉鋪了一地，那也是一種完成。
  tags: [autumn]
- id: se-autumn-09
  text: 天氣轉乾，記得替自己補點水。
  tags: [autumn, bailu]
- id: se-autumn-10
  text: 一年走過大半，你也走了很遠。
  tags: [autumn]
- id: se-autumn-11
  text: 秋天的光是金色的，拍張照留著。
  tags: [autumn]
- id: se-autumn-12
  text: 涼了，加件衣服再繼續。
  tags: [autumn]
