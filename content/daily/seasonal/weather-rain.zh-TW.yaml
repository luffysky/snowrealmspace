# 季節/天氣 · 雨天。繁體中文，每一則獨一無二。
- id: se-rain-01
  text: 今天下雨，出門記得帶把傘。
  tags: [rainy]
- id: se-rain-02
  text: 窗外的雨聲很適合配一杯熱茶，慢慢地聽。
  tags: [rainy]
- id: se-rain-03
  text: 路面濕滑，走路的步伐放慢一點會比較安心。
  tags: [rainy]
- id: se-rain-04
  text: 這種天氣待在室內特別溫暖，蓋條薄毯剛剛好。
  tags: [rainy]
- id: se-rain-05
  text: 雨後的空氣總是格外清新，深呼吸一口很舒服。
  tags: [rainy]
- id: se-rain-06
  text: 雨滴打在窗上的節奏，聽著聽著心就靜下來了。
  tags: [rainy]
- id: se-rain-07
  text: 鞋子如果濕了，回家換上乾爽的襪子會暖和許多。
  tags: [rainy]
- id: se-rain-08
  text: 灰濛濛的天色裡，屋內的一盞暖燈就顯得溫柔。
  tags: [rainy]
- id: se-rain-09
  text: 撐傘的時候，肩膀那側容易淋濕，多留意一下。
  tags: [rainy]
- id: se-rain-10
  text: 下雨的午後很適合窩著看一本擱了很久的書。
  tags: [rainy]
- id: se-rain-11
  text: 濕氣重的日子，一碗熱湯下肚會覺得整個人都活了過來。
  tags: [rainy]
- id: se-rain-12
  text: 街燈在雨裡暈開一圈光，這樣的夜晚有種安靜的美。
  tags: [rainy]
- id: se-rain-13
  text: 若沒帶傘，找個屋簷躲一會兒，雨勢常常一下就小了。
  tags: [rainy]
- id: se-rain-14
  text: 潮濕的天氣關節容易痠，動作之間多給自己一點緩衝。
  tags: [rainy]
- id: se-rain-15
  text: 雨天騎車視線比較模糊，把速度收一收更放心。
  tags: [rainy]
- id: se-rain-16
  text: 泥濘的路段繞開走，鞋底乾淨一整天心情也清爽。
  tags: [rainy]
- id: se-rain-17
  text: 這場雨把塵埃都洗淨了，葉子綠得發亮。
  tags: [rainy]
- id: se-rain-18
  text: 聽著雨聲入睡，是這種天氣才有的溫柔禮物。
  tags: [rainy]
- id: se-rain-19
  text: 傘架旁記得放條擦手巾，進門時擦一擦最方便。
  tags: [rainy]
- id: se-rain-20
  text: 陰雨連綿的日子，一杯溫熱的咖啡就能撐起好心情。
  tags: [rainy]
