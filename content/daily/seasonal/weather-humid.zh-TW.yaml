# 季節/天氣 · 潮濕。繁體中文，每一則獨一無二。
- id: se-humid-01
  text: 濕氣重的日子，衣服晾在通風的地方比較安心。
  tags: [humid]
- id: se-humid-02
  text: 空氣黏黏的，開一下除濕機會舒服很多。
  tags: [humid]
- id: se-humid-03
  text: 這種天氣地板容易滑，走廊拐角放慢腳步就好。
  tags: [humid]
- id: se-humid-04
  text: 潮濕會讓人懶洋洋的，累了就靠著坐一會兒。
  tags: [humid]
- id: se-humid-05
  text: 衣櫃深處記得留意，這幾天最容易長霉點。
  tags: [humid]
- id: se-humid-06
  text: 被子摸起來悶悶的話，趁沒下雨抱去曬曬太陽。
  tags: [humid]
- id: se-humid-07
  text: 悶熱的午後，一杯冰涼的水比什麼都解膩。
  tags: [humid]
- id: se-humid-08
  text: 皮膚黏答答不太好受，沖個溫水澡就清爽了。
  tags: [humid]
- id: se-humid-09
  text: 玄關的鞋子容易返潮，塞張報紙進去吸吸濕氣。
  tags: [humid]
- id: se-humid-10
  text: 這種天鏡子跟窗戶都霧霧的，慢慢擦別急。
  tags: [humid]
- id: se-humid-11
  text: 收好的乾貨怕受潮，蓋緊封好放心裡踏實些。
  tags: [humid]
- id: se-humid-12
  text: 濕漉漉的空氣讓頭髮不聽話，隨意綁起來也很好看。
  tags: [humid]
- id: se-humid-13
  text: 房間有點悶的話，開扇窗讓空氣流動一下。
  tags: [humid]
- id: se-humid-14
  text: 潮濕天關節容易緊繃，起身前先輕輕動一動。
  tags: [humid]
- id: se-humid-15
  text: 洗好的碗擦乾再收，這種濕度水痕最難乾。
  tags: [humid]
- id: se-humid-16
  text: 空氣悶得像蓋了層薄膜，深呼吸幾口也會鬆一點。
  tags: [humid]
- id: se-humid-17
  text: 書本跟紙張怕潮，放包乾燥劑在旁邊守著它們。
  tags: [humid]
- id: se-humid-18
  text: 這種黏膩的天，穿透氣的棉麻會自在許多。
  tags: [humid]
- id: se-humid-19
  text: 牆角要是冒出濕痕，擦乾後留意通風就不擔心。
  tags: [humid]
- id: se-humid-20
  text: 濕氣纏人的日子，泡杯熱茶讓身子暖起來也不錯。
  tags: [humid]
