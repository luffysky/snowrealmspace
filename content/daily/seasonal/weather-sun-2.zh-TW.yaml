# 季節/天氣 · 晴天（續）。繁體中文，每一則獨一無二。
- id: se-sun-21
  text: 這麼透亮的一天，很適合把久沒聯絡的朋友約出來坐坐。
  tags: [sunny]
- id: se-sun-22
  text: 曬得暖暖的枕頭套換上，晚上躺下去會有股安心的香氣。
  tags: [sunny]
- id: se-sun-23
  text: 陽光把地板的木紋照得清清楚楚，連灰塵都無所遁形。
  tags: [sunny]
- id: se-sun-24
  text: 這種天氣拍出來的照片色彩特別飽，隨手一張都很有精神。
  tags: [sunny]
- id: se-sun-25
  text: 屋頂的水塔曬過一整天，傍晚洗澡的熱水都省了些力氣。
  tags: [sunny]
- id: se-sun-26
  text: 明亮的午後最適合整理衣櫃，換季的厚衣趁機曬曬更清爽。
  tags: [sunny]
- id: se-sun-27
  text: 曬過太陽的球鞋擺回門口，那股潮味就這樣被陽光帶走了。
  tags: [sunny]
- id: se-sun-28
  text: 天這麼晴，河堤邊放風箏的人多了起來，看著也覺得輕快。
  tags: [sunny]
- id: se-sun-29
  text: 陽光斜斜穿過樹葉，在地上灑出一地晃動的碎金子。
  tags: [sunny]
- id: se-sun-30
  text: 這種好天氣曬棉被的味道，是童年午睡記憶裡最熟悉的一味。
  tags: [sunny]
- id: se-sun-31
  text: 晴朗的日子適合把厚重的窗簾拉開，讓房間亮堂一整天。
  tags: [sunny]
- id: se-sun-32
  text: 太陽把柏油路曬得微微發燙，空氣裡浮著一層流動的暖。
  tags: [sunny]
- id: se-sun-33
  text: 這樣的天色下曬乾的香草和茶葉，收進罐子香氣更濃了。
  tags: [sunny]
- id: se-sun-34
  text: 陽台曬著的番茄乾一天比一天皺，甜味也一天比一天濃。
  tags: [sunny]
- id: se-sun-35
  text: 晴天的市場特別熱鬧，蔬果攤的顏色被陽光照得鮮嫩欲滴。
  tags: [sunny]
- id: se-sun-36
  text: 這種好天把腳踏車牽出來擦一擦，鏈條上點油又能跑得順了。
  tags: [sunny]
- id: se-sun-37
  text: 陽光照進魚缸，水波在牆上晃出一片亮亮的紋路，療癒得很。
  tags: [sunny]
- id: se-sun-38
  text: 曬飽太陽的貓瞇著眼趴在窗台，那份慵懶看了也跟著放鬆。
  tags: [sunny]
- id: se-sun-39
  text: 晴空下的遠山看得格外清楚，連稜線的層次都一目了然。
  tags: [sunny]
- id: se-sun-40
  text: 這樣一個好天，把日記本搬到陽光下寫，字都跟著明亮起來。
  tags: [sunny]
