# 季節/天氣 · 雨天（第五批）。繁體中文，每一則獨一無二。
- id: se-rain-81
  text: 躲進便利商店翻幾本雜誌，等雨小一點再走也不遲。
  tags: [rainy]
- id: se-rain-82
  text: 熬一鍋紅豆湯圓捧在手裡，甜甜的暖意驅散了窗外的濕冷。
  tags: [rainy]
- id: se-rain-83
  text: 趁著雨天鋪開紙筆調幾盤水彩，讓顏色在紙上暈得像窗外的雨。
  tags: [rainy]
- id: se-rain-84
  text: 坐火車時看雨珠被風扯成一道道斜線，向後飛掠，是旅途特有的畫面。
  tags: [rainy]
- id: se-rain-85
  text: 皮鞋容易被雨氣泡壞，換上耐濕的那雙出門，回家再擦上鞋油收好。
  tags: [rainy]
- id: se-rain-86
  text: 屋簷下的燕子擠成一排避雨，探頭探腦地等著天空放晴。
  tags: [rainy]
- id: se-rain-87
  text: 鞋子濕透了塞幾團報紙進去，隔夜就把水氣吸得差不多了。
  tags: [rainy]
- id: se-rain-88
  text: 挑一張慢節奏的專輯放著，讓旋律和雨聲在客廳裡疊成一片。
  tags: [rainy]
- id: se-rain-89
  text: 哪兒也去不了的下午，翻出舊相簿一頁頁看，時光就這樣倒流回去。
  tags: [rainy]
- id: se-rain-90
  text: 沖一杯濃濃的熱可可，捧著杯子看雨，苦甜在舌尖化開得剛剛好。
  tags: [rainy]
- id: se-rain-91
  text: 濕氣一重，鹽罐糖罐容易結成硬塊，丟幾粒米進去就能保持鬆散。
  tags: [rainy]
- id: se-rain-92
  text: 給孩子套上雨鞋，讓他盡情踩幾下水坑，那份笑聲比什麼都珍貴。
  tags: [rainy]
- id: se-rain-93
  text: 反正出不了門，索性把積了灰的窗框和層架都擦一遍，屋子清爽心也是。
  tags: [rainy]
- id: se-rain-94
  text: 雨說來就來，趕在滴落前把陽台的衣服收進來，動作俐落最要緊。
  tags: [rainy]
- id: se-rain-95
  text: 受潮的木地板走起來吱嘎作響，踩著那聲音反倒有種老屋的親切。
  tags: [rainy]
- id: se-rain-96
  text: 巷口的低窪處積起一灘水，繞從另一頭走可以少濕一雙鞋。
  tags: [rainy]
- id: se-rain-97
  text: 睡前溫一杯牛奶慢慢喝，暖意順著喉頭下去，雨夜也睡得安穩。
  tags: [rainy]
- id: se-rain-98
  text: 室內外的溫差讓玻璃凝出一層水珠，用手一抹就露出外頭朦朧的街景。
  tags: [rainy]
- id: se-rain-99
  text: 晾了半天還發潮的毛巾，丟進烘衣機轉一轉，蓬鬆乾爽又回來了。
  tags: [rainy]
- id: se-rain-100
  text: 雨後積水容易招來蚊子，睡前點盤蚊香或掛頂蚊帳，夜裡能睡得清靜。
  tags: [rainy]
