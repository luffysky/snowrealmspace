# 季節/天氣 · 悶熱（第四批）。繁體中文，每一則獨一無二。
- id: se-muggy-61
  text: 除濕機的水箱一天就滿一回，倒水時看那一整槽水，才知道空氣有多濕。
  tags: [muggy]
- id: se-muggy-62
  text: 一碗剉冰淋上煉乳，芒果紅豆堆得高高的，挖一口透心涼，暑氣頓時退了。
  tags: [muggy]
- id: se-muggy-63
  text: 相機鏡頭得趕緊收進防潮箱，這種濕氣一不留神就長霉，養護得勤一點。
  tags: [muggy]
- id: se-muggy-64
  text: 鹽罐裡的鹽悶得結成一塊，倒之前先敲一敲，丟幾粒米進去會好些。
  tags: [muggy]
- id: se-muggy-65
  text: 皮鞋皮包擱在櫃裡容易冒白霉，趁天氣悶先搬出來擦一擦、通通風。
  tags: [muggy]
- id: se-muggy-66
  text: 吐司放一天邊角就冒了綠點，這種天麵包還是買少一些，趁新鮮吃完。
  tags: [muggy]
- id: se-muggy-67
  text: 冷氣濾網積了一層灰，趁悶天拆下來沖一沖，吹出來的風立刻涼得乾脆。
  tags: [muggy]
- id: se-muggy-68
  text: 檸檬愛玉冰冰涼涼最消暑，酸甜滑進喉嚨，整個人都跟著清爽了。
  tags: [muggy]
- id: se-muggy-69
  text: 巷口的青草茶攤擺出一桶桶，倒一杯灌下去，那股草香把悶氣都壓了下去。
  tags: [muggy]
- id: se-muggy-70
  text: 狗熱得趴在磁磚上直吐舌，肚子貼著地板散熱，看牠喘我也替牠添了盆水。
  tags: [muggy]
- id: se-muggy-71
  text: 電風扇前擺一盆冰塊，風掠過冰面帶出絲絲涼意，是老一輩傳下來的土法。
  tags: [muggy]
- id: se-muggy-72
  text: 頭髮悶得貼在頸子上，乾脆全綁成一束高馬尾，後頸一空就涼快了。
  tags: [muggy]
- id: se-muggy-73
  text: 曬了兩天還帶潮氣的衣服，索性抱去洗衣店烘一輪，收回來蓬鬆又乾爽。
  tags: [muggy]
- id: se-muggy-74
  text: 冰箱裡冰了一顆西瓜，切開紅通通沁著涼氣，一口咬下汁水順著下巴滴。
  tags: [muggy]
- id: se-muggy-75
  text: 悶熱的夜市逛沒幾攤就滿身汗，索性找家冷氣店坐下吃碗涼麵歇腳。
  tags: [muggy]
- id: se-muggy-76
  text: 椰子水冰過最解渴，插根吸管咕嚕咕嚕喝光，那股清甜比什麼都痛快。
  tags: [muggy]
- id: se-muggy-77
  text: 浴室鏡子一洗完澡就蒙上一層霧，抹一把才照得見人，濕氣重得很。
  tags: [muggy]
- id: se-muggy-78
  text: 蟑螂在這種濕熱裡特別活躍，牆角櫃縫都得留意，順手清一清斷了牠的路。
  tags: [muggy]
- id: se-muggy-79
  text: 竹編的藤椅在悶天坐起來透氣不黏，搬到窗邊乘涼，比沙發舒服多了。
  tags: [muggy]
- id: se-muggy-80
  text: 這種天連電費都跟著往上爬，冷氣調到二十七度配著電扇，涼得剛好又省一些。
  tags: [muggy]
