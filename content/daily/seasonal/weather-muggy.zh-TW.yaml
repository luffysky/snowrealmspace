# 季節/天氣 · 悶熱。繁體中文，每一則獨一無二。
- id: se-muggy-01
  text: 又悶又熱，記得讓自己透透氣。
  tags: [muggy]
- id: se-muggy-02
  text: 空氣黏黏的，沖個涼水澡會舒服很多。
  tags: [muggy]
- id: se-muggy-03
  text: 這種不透風的天，待在有冷氣的地方也是一種善待自己。
  tags: [muggy]
- id: se-muggy-04
  text: 汗一直黏在背上不太好受，換件透氣的衣服吧。
  tags: [muggy]
- id: se-muggy-05
  text: 濕氣重得像被裹住，深呼吸幾口，讓自己鬆一鬆。
  tags: [muggy]
- id: se-muggy-06
  text: 天悶得讓人心浮氣躁，放慢腳步也沒關係。
  tags: [muggy]
- id: se-muggy-07
  text: 感覺快下雷陣雨了，那股悶熱其實很磨人，體諒一下自己。
  tags: [muggy]
- id: se-muggy-08
  text: 潮濕黏膩的日子，一杯冰涼的飲料能讓人清爽不少。
  tags: [muggy]
- id: se-muggy-09
  text: 房裡有點悶，開個風扇或除濕機，環境舒服人也跟著鬆。
  tags: [muggy]
- id: se-muggy-10
  text: 濕熱容易讓人沒胃口，吃點清爽的，別勉強自己。
  tags: [muggy]
- id: se-muggy-11
  text: 衣服黏在身上悶得慌，找個陰涼通風的角落歇一會兒。
  tags: [muggy]
- id: se-muggy-12
  text: 這股濕黏的暑氣讓人昏沉，中午小睡片刻也很療癒。
  tags: [muggy]
- id: se-muggy-13
  text: 空氣像凝住一樣不流動，用點薄荷或涼感的東西提提神。
  tags: [muggy]
- id: se-muggy-14
  text: 悶到頭有點脹，適時停下來喝口水、擦擦汗。
  tags: [muggy]
- id: se-muggy-15
  text: 這樣濕悶的午後，心情浮躁也是正常的，慢慢來就好。
  tags: [muggy]
- id: se-muggy-16
  text: 濕氣讓人黏膩不爽，睡前擦乾身子會睡得安穩些。
  tags: [muggy]
- id: se-muggy-17
  text: 外頭悶得像蒸籠，出門記得帶條小手帕擦汗。
  tags: [muggy]
- id: se-muggy-18
  text: 這種黏答答的天氣最耗神，替自己留點喘息的空檔。
  tags: [muggy]
- id: se-muggy-19
  text: 悶熱的夜不太好眠，讓室內涼爽通風，翻身時會舒坦一點。
  tags: [muggy]
- id: se-muggy-20
  text: 濕熱把人悶得懶洋洋，順著這股慵懶放鬆一下也好。
  tags: [muggy]
