# 季節/天氣 · 潮濕（續）。繁體中文，每一則獨一無二。
- id: se-humid-21
  text: 剛烘好的餅乾別急著全開封，密封罐能替它們留住脆脆的口感。
  tags: [humid]
- id: se-humid-22
  text: 金屬門把跟鑰匙這幾天摸起來澀澀的，擦乾一遍就不怕它們悄悄生鏽。
  tags: [humid]
- id: se-humid-23
  text: 手機從冷氣房拿出來鏡頭會蒙一層霧，等它回溫再拍畫面就清楚了。
  tags: [humid]
- id: se-humid-24
  text: 桌上的鹽罐容易結成小塊，丟幾粒生米進去幫它保持鬆散。
  tags: [humid]
- id: se-humid-25
  text: 木吉他怕潮，收進琴袋前放包乾燥劑，音色會穩定一些。
  tags: [humid]
- id: se-humid-26
  text: 拖完地留意一下有沒有全乾，這種濕度水膜散得特別慢。
  tags: [humid]
- id: se-humid-27
  text: 貼在冰箱上的便利貼邊角翹起來了，換張新的貼得比較牢。
  tags: [humid]
- id: se-humid-28
  text: 床墊靠牆那面容易悶著濕氣，隔一陣子拉開透透氣就安心。
  tags: [humid]
- id: se-humid-29
  text: 相機鏡頭收櫃子前擦乾淨，濕氣悶久了裡面會長霧斑。
  tags: [humid]
- id: se-humid-30
  text: 藥盒裡的錠劑最怕受潮，蓋子按到底聽見喀一聲才算密封好。
  tags: [humid]
- id: se-humid-31
  text: 玄關的雨傘攤開晾著，等它完全乾了再收才不會留霉味。
  tags: [humid]
- id: se-humid-32
  text: 洗手台邊緣的水漬順手擦一擦，濕氣少了瓷面也亮得久。
  tags: [humid]
- id: se-humid-33
  text: 蜂蜜跟砂糖記得旋緊蓋子，這種天最容易吸潮變黏稠。
  tags: [humid]
- id: se-humid-34
  text: 電扇對著房間吹一會兒，空氣流動起來就不那麼悶了。
  tags: [humid]
- id: se-humid-35
  text: 抽屜裡的相片怕黏在一起，夾張描圖紙隔開它們就放心了。
  tags: [humid]
- id: se-humid-36
  text: 曬不到太陽的日子，把毛巾丟烘乾機轉一轉照樣蓬鬆。
  tags: [humid]
- id: se-humid-37
  text: 餐桌的木紋容易吸水膨脹，擦過就順手拿乾布再抹一遍。
  tags: [humid]
- id: se-humid-38
  text: 陽台的植栽這幾天別澆太多，土表還濕著就先讓它歇一歇。
  tags: [humid]
- id: se-humid-39
  text: 衣領悶出汗痕不太舒服，換件領口寬鬆的會透氣許多。
  tags: [humid]
- id: se-humid-40
  text: 收在紙箱裡的東西墊高一點，離地面遠些濕氣就爬不上來。
  tags: [humid]
