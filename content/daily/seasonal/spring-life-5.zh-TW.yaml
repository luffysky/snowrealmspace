# 季節 · 春天生活（第五批）。繁體中文，每一則獨一無二。
- id: se-springlife-81
  text: 香椿冒出嫩紫的新芽，摘一把炒蛋，那股獨特的香氣只有這時節嚐得到。
  tags: [spring]
- id: se-springlife-82
  text: 春天的韭菜特別鮮嫩，割一把回來包水餃，一咬滿口都是清香。
  tags: [spring]
- id: se-springlife-83
  text: 假日邀了幾個人進山裡踏青，帶著飯糰邊走邊吃，走到哪就歇到哪。
  tags: [spring]
- id: se-springlife-84
  text: 陽光斜斜落進客廳，貓瞇著眼在光裡打盹，看著看著我也想睏了。
  tags: [spring]
- id: se-springlife-85
  text: 清明前後採了艾草回來，揉進糯米做成草仔粿，蒸好一屋子都是青草香。
  tags: [spring]
- id: se-springlife-86
  text: 換上涼鞋踩在地上，腳趾終於不用悶在襪子裡，走起路來輕快許多。
  tags: [spring]
- id: se-springlife-87
  text: 陽台的九重葛趁著暖意爬滿了牆，開得又密又艷，紫紅一片很有精神。
  tags: [spring]
- id: se-springlife-88
  text: 剝了一整盤新鮮豌豆，圓滾滾的綠珠彈進碗裡，晚餐的湯就有著落了。
  tags: [spring]
- id: se-springlife-89
  text: 蜘蛛在窗角結了張網，沾著清晨的露水，一絲絲在光裡閃得發亮。
  tags: [spring]
- id: se-springlife-90
  text: 才剛把車洗好想歇口氣，一陣春雨就落下來，索性讓它幫忙沖個乾淨。
  tags: [spring]
- id: se-springlife-91
  text: 屋後的竹叢冒出好幾支筍，扛著鋤頭去挖，一挖一個下午就過去了。
  tags: [spring]
- id: se-springlife-92
  text: 綠繡眼在花間鑽來鑽去，啄食花蜜的樣子小巧又靈活，看了好一會兒。
  tags: [spring]
- id: se-springlife-93
  text: 把冬天穿舊的毛衣打包捐出去，衣櫃騰出的空位讓人心裡也跟著鬆快。
  tags: [spring]
- id: se-springlife-94
  text: 溫室裡的蘭花一株株抽出花梗，含苞待放，等著在暖意裡一朵朵綻開。
  tags: [spring]
- id: se-springlife-95
  text: 清晨的霧氣還沒散，田埂上籠著一層白，走進去像踏進一場薄薄的夢。
  tags: [spring]
- id: se-springlife-96
  text: 買了一把桂竹筍回家滷，滷到入了味，光配飯就能多扒好幾口。
  tags: [spring]
- id: se-springlife-97
  text: 醃好的酸菜擺出一缸缸，趁這幾天出太陽，曬夠了才肯收進來。
  tags: [spring]
- id: se-springlife-98
  text: 草地上的酢漿草開出一朵朵細碎的黃花，蹲下去找，偶爾還能翻到四葉的。
  tags: [spring]
- id: se-springlife-99
  text: 給窗台的盆栽換了新土，鬆一鬆根再澆足水，隔天它就精神地挺直了腰。
  tags: [spring]
- id: se-springlife-100
  text: 春日午後的雷陣雨來得急去得也快，雨一停，空氣裡全是被洗過的清新。
  tags: [spring]
