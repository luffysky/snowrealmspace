# 季節/天氣 · 起霧（第四批）。繁體中文，每一則獨一無二。
- id: se-fog-61
  text: 露營的清晨拉開帳篷，外帳沾滿了整夜的霧水，收帳前先攤開晾一會兒。
  tags: [foggy]
- id: se-fog-62
  text: 相機從溫暖的屋裡帶進霧中，鏡頭前會蒙上一層薄薄的水氣，等它回溫畫面才清晰。
  tags: [foggy]
- id: se-fog-63
  text: 纜車升進霧裡整個車廂像懸在白色的空中，窗外只剩一片朦朧。
  tags: [foggy]
- id: se-fog-64
  text: 走上吊橋時兩端都沒入霧中，腳下的溪谷也只聽得見水聲。
  tags: [foggy]
- id: se-fog-65
  text: 登上山頂剛好遇上雲海，霧在腳下翻湧，遠峰像浮在海面的島。
  tags: [foggy]
- id: se-fog-66
  text: 老街的紅燈籠在霧裡暈成一團團柔光，石板路顯得格外深長。
  tags: [foggy]
- id: se-fog-67
  text: 清晨的廟埕飄著霧，香爐的煙和霧混在一起，分不清哪個是哪個。
  tags: [foggy]
- id: se-fog-68
  text: 火車鑽進山區的霧裡，窗外的風景一段段被白色吞掉又吐了出來。
  tags: [foggy]
- id: se-fog-69
  text: 渡輪在霧裡放慢了速度，船身隨著一聲聲汽笛緩緩靠向碼頭。
  tags: [foggy]
- id: se-fog-70
  text: 街角店家的招牌在濃霧裡只剩一團模糊的光，走近才認得出字。
  tags: [foggy]
- id: se-fog-71
  text: 森林步道被晨霧罩著，木棧道沾了水氣，踩上去要放輕腳步。
  tags: [foggy]
- id: se-fog-72
  text: 特地上了觀景台，眼前卻只有白茫茫一片，那就靜靜聽風也不錯。
  tags: [foggy]
- id: se-fog-73
  text: 溪谷裡的霧順著水面往上飄，對岸的石頭在白影中若有似無。
  tags: [foggy]
- id: se-fog-74
  text: 田裡的白鷺站在薄霧中一動不動，遠看幾乎和霧融成一色。
  tags: [foggy]
- id: se-fog-75
  text: 牧場的牛在晨霧裡低頭吃草，身影朦朦朧朧像剪紙貼在白紙上。
  tags: [foggy]
- id: se-fog-76
  text: 出門前後照鏡蒙了一層霧水，用手抹過再上路看得清楚些。
  tags: [foggy]
- id: se-fog-77
  text: 車窗內側起了霧，開一點暖風對著玻璃吹，白霧就慢慢退了。
  tags: [foggy]
- id: se-fog-78
  text: 巷口等車的孩子裹在霧裡，穿件亮色外套讓司機遠遠就看得見。
  tags: [foggy]
- id: se-fog-79
  text: 起霧的夜裡抬頭，星星都藏進了灰白的天幕，看不見半點光。
  tags: [foggy]
- id: se-fog-80
  text: 山嵐漫過松林，一棵棵樹只露出深綠的樹梢，其餘全泡在白霧裡。
  tags: [foggy]
