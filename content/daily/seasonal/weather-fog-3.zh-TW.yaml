# 季節/天氣 · 起霧（第三批）。繁體中文，每一則獨一無二。
- id: se-fog-41
  text: 騎車遇上霧，安全帽面罩內側容易起白霧，掀開一條縫透氣就清楚了。
  tags: [foggy]
- id: se-fog-42
  text: 站牌等車時，霧裡往往先看見車燈才看清車身，往後站一步比較安穩。
  tags: [foggy]
- id: se-fog-43
  text: 港邊起霧的時候霧笛會一聲聲響，那是在提醒船隻把速度放下來。
  tags: [foggy]
- id: se-fog-44
  text: 平交道的警示燈在霧裡糊成一團，聽見鈴聲先停下等火車過去。
  tags: [foggy]
- id: se-fog-45
  text: 停在外頭的機車座墊沾了整夜的霧水，出門前擦一擦免得坐上去是濕的。
  tags: [foggy]
- id: se-fog-46
  text: 高速公路一起霧就會亮起限速燈號，跟著它放慢，別勉強切線超車。
  tags: [foggy]
- id: se-fog-47
  text: 霧裡走路連自己的腳步聲都悶悶的，整條巷子安靜得只剩呼吸。
  tags: [foggy]
- id: se-fog-48
  text: 霧散之後氣溫常會慢慢回升，外套先留在身上別急著脫。
  tags: [foggy]
- id: se-fog-49
  text: 在霧裡站上一會兒，瀏海和眉梢就會沾上一層細細的水氣。
  tags: [foggy]
- id: se-fog-50
  text: 上山想看夜景卻遇上濃霧，那就把這趟當成一場安靜的散步。
  tags: [foggy]
- id: se-fog-51
  text: 霧重的傍晚窩在屋裡，點一盞暖黃的燈，心也跟著暖了起來。
  tags: [foggy]
- id: se-fog-52
  text: 出門開車前試一下雨刷，霧重時擋風玻璃外面也會慢慢凝上一層水膜。
  tags: [foggy]
- id: se-fog-53
  text: 霧天的公園長椅上凝了一層水，坐下前先鋪張紙或擦一擦。
  tags: [foggy]
- id: se-fog-54
  text: 濃霧裡按喇叭不如放慢車速，聲音在霧裡傳得又悶又難辨方向。
  tags: [foggy]
- id: se-fog-55
  text: 清晨的霧會把葉尖都掛上水珠，碰一下就簌簌地滑下來。
  tags: [foggy]
- id: se-fog-56
  text: 霧裡的紅綠燈看起來離得很遠，實際上路口往往就在眼前。
  tags: [foggy]
- id: se-fog-57
  text: 起霧的湖邊什麼都靜悄悄的，連水波拍岸都輕輕柔柔的。
  tags: [foggy]
- id: se-fog-58
  text: 霧裡的月亮只剩一團朦朧的暈，看不真切卻格外溫柔。
  tags: [foggy]
- id: se-fog-59
  text: 走在霧中的階梯要扶著欄杆，石面沾了霧水比看起來還滑。
  tags: [foggy]
- id: se-fog-60
  text: 霧氣會悄悄鑽進沒關緊的窗縫，睡前順手確認窗戶都掩上了。
  tags: [foggy]
