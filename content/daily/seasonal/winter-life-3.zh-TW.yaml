# 季節 · 冬天生活（第三批）。繁體中文，每一則獨一無二。
- id: se-winterlife-41
  text: 冬天的草莓紅豔豔堆滿攤子，挑一盒回家，酸甜在嘴裡化開。
  tags: [winter]
- id: se-winterlife-42
  text: 夜市的羊肉爐熱氣騰騰，一鍋端上桌，寒夜裡整桌人都紅了臉。
  tags: [winter]
- id: se-winterlife-43
  text: 燒仙草上撒一把花生和芋圓，熱熱一碗捧著，寒意就退到門外去了。
  tags: [winter]
- id: se-winterlife-44
  text: 早餐店的熱豆漿配根油條，坐在小板凳上，一口暖漿驅走整晨的冷。
  tags: [winter]
- id: se-winterlife-45
  text: 難得的冬陽露臉，搬張椅子到窗邊曬背，暖意一寸寸滲進骨頭裡。
  tags: [winter]
- id: se-winterlife-46
  text: 脫毛衣時劈啪作響，靜電讓頭髮全豎了起來，冬天的小惡作劇。
  tags: [winter]
- id: se-winterlife-47
  text: 年前的大掃除忙了一整天，窗明几淨，心裡跟著清爽起來。
  tags: [winter]
- id: se-winterlife-48
  text: 迪化街的年貨大街人擠人，試吃的糖果瓜子一路吃過去，年味濃了。
  tags: [winter]
- id: se-winterlife-49
  text: 除夕圍爐守歲，長輩發下紅包，一桌人守著電視聊到深夜。
  tags: [winter]
- id: se-winterlife-50
  text: 貼上新寫的春聯，紅底黑字往門框一襯，屋子瞬間有了過年的樣子。
  tags: [winter]
- id: se-winterlife-51
  text: 保溫瓶裝滿熱水帶出門，走到哪都能倒一杯，指尖跟著回暖。
  tags: [winter]
- id: se-winterlife-52
  text: 洗完熱水澡，浴室鏡子蒙上一層白霧，抹開一道才看見自己。
  tags: [winter]
- id: se-winterlife-53
  text: 棉拖鞋往腳上一套，踩在冰涼的地板上也不再打哆嗦。
  tags: [winter]
- id: se-winterlife-54
  text: 合歡山上飄起了雪，追雪的人一早就把山路擠得水洩不通。
  tags: [winter]
- id: se-winterlife-55
  text: 等公車的空檔呵著白氣搓手，車一來，趕緊縮著脖子鑽進去。
  tags: [winter]
- id: se-winterlife-56
  text: 衣服晾了三天還是濕的，除濕機開整晚，水箱滿了一次又一次。
  tags: [winter]
- id: se-winterlife-57
  text: 睡前用熱敷袋暖一暖肩頸，緊繃了一天的僵硬慢慢鬆開。
  tags: [winter]
- id: se-winterlife-58
  text: 桶柑一箱箱堆在騎樓下，皮好剝又清甜，是這個季節的滋味。
  tags: [winter]
- id: se-winterlife-59
  text: 手搖店換上熱飲，捧著一杯熱奶茶走在冷風裡，掌心先甜了。
  tags: [winter]
- id: se-winterlife-60
  text: 初一穿上新衣去走春，廟裡人擠人，香火旺得暖烘烘。
  tags: [winter]
