# 季節/天氣 · 雨天（第六批）。繁體中文，每一則獨一無二。
- id: se-rain-101
  text: 傘落在店裡忘了拿，翻出包底那把折疊傘應個急也好。
  tags: [rainy]
- id: se-rain-102
  text: 一陣強風把傘面吹得翻了過去，順著風向調個角度就能扳回來。
  tags: [rainy]
- id: se-rain-103
  text: 攤開一盒拼圖，全家人湊在燈下一片片拼，雨聲成了最好的背景。
  tags: [rainy]
- id: se-rain-104
  text: 雨天路上車速慢、車陣長，提早幾分鐘出門心裡就篤定。
  tags: [rainy]
- id: se-rain-105
  text: 牆角的青苔被雨養得滑溜，經過時腳步踏穩一點比較安全。
  tags: [rainy]
- id: se-rain-106
  text: 雨後的蚯蚓爬上柏油路，走路時留意腳下，別踩著了牠們。
  tags: [rainy]
- id: se-rain-107
  text: 點上一盞香氛燈，木質調的香氣混著雨氣，把屋子烘得慵懶。
  tags: [rainy]
- id: se-rain-108
  text: 趁著雨天把積了一籃的衣服拿出來熨，蒸氣騰騰，褶皺一道道被撫平。
  tags: [rainy]
- id: se-rain-109
  text: 哪兒也去不了的午後，鋪開墊子做幾組伸展，筋骨鬆了人也舒坦。
  tags: [rainy]
- id: se-rain-110
  text: 燒壺熱水慢慢手沖一杯咖啡，看水流繞著粉打轉，時間都跟著放緩。
  tags: [rainy]
- id: se-rain-111
  text: 玄關的傘桶插得滿滿一叢，抽一把最乾的出門就好。
  tags: [rainy]
- id: se-rain-112
  text: 洗好的衣服掛進浴室，開暖風吹一陣，隔天就不再帶著潮氣。
  tags: [rainy]
- id: se-rain-113
  text: 巷口的野貓縮進騎樓的紙箱裡避雨，探出頭望著街上的水花。
  tags: [rainy]
- id: se-rain-114
  text: 遠處的稻田被雨洗得油綠，一整片在灰天底下亮得格外精神。
  tags: [rainy]
- id: se-rain-115
  text: 池塘裡的荷葉托著幾顆水珠，風一晃就滾成一顆更大的往下落。
  tags: [rainy]
- id: se-rain-116
  text: 帶寵物散步淋了雨回來，拿乾毛巾把牠全身擦一擦，那股濕味就散了。
  tags: [rainy]
- id: se-rain-117
  text: 孩子趴在窗邊看雨，順手遞給他紙筆，玻璃上的水痕成了他畫裡的線條。
  tags: [rainy]
- id: se-rain-118
  text: 從天橋往下望，一把把彩色的傘在街上流動，像一朵朵會走的花。
  tags: [rainy]
- id: se-rain-119
  text: 傳統市場的地面被雨水和菜葉弄得濕滑，走過攤位時放慢腳步穩當些。
  tags: [rainy]
- id: se-rain-120
  text: 這種天在家煎一疊鬆餅，奶油化開、糖漿淋上，甜香把陰天都填滿了。
  tags: [rainy]
