# 季節/天氣 · 回暖（續）。繁體中文，每一則獨一無二。
- id: se-warming-21
  text: 陽台的盆栽開始抽芽，是天氣變暖最誠實的信號。
  tags: [warming]
- id: se-warming-22
  text: 洗好的衣服掛出去，沒多久就乾了，暖和的日子做事都順手。
  tags: [warming]
- id: se-warming-23
  text: 睡到自然醒也不覺得冷，暖流讓賴床變成一種享受。
  tags: [warming]
- id: se-warming-24
  text: 街角的貓又躺回牆頭曬肚子了，牠比誰都先感覺到暖。
  tags: [warming]
- id: se-warming-25
  text: 泡熱水的時間縮短了，水龍頭一開就有剛剛好的溫度。
  tags: [warming]
- id: se-warming-26
  text: 昨晚踢開了棉被也沒著涼，身體記得溫暖回來了。
  tags: [warming]
- id: se-warming-27
  text: 傍晚的天色亮得比較久，散完步回家還看得見餘暉。
  tags: [warming]
- id: se-warming-28
  text: 咖啡放涼也不心疼了，不必再急著趁熱一口喝完。
  tags: [warming]
- id: se-warming-29
  text: 通勤時不再縮著脖子，肩膀鬆下來連步伐都變寬了。
  tags: [warming]
- id: se-warming-30
  text: 窗玻璃上的霧氣消失了，早晨的視野一片清朗。
  tags: [warming]
- id: se-warming-31
  text: 冰箱裡的飲料開始受歡迎，暖天讓人想喝點清涼的。
  tags: [warming]
- id: se-warming-32
  text: 曬過太陽的棉被鬆軟又蓬，鑽進去有股安心的香氣。
  tags: [warming]
- id: se-warming-33
  text: 蟲鳴鳥叫比前陣子熱鬧，萬物都被暖意喚醒了。
  tags: [warming]
- id: se-warming-34
  text: 洗手時不再有那種刺骨的冰，水變得溫吞而親切。
  tags: [warming]
- id: se-warming-35
  text: 公園的長椅坐起來是暖的，不必墊著外套也很自在。
  tags: [warming]
- id: se-warming-36
  text: 出門前少了層層疊疊的準備，換件襯衫就能輕鬆上路。
  tags: [warming]
- id: se-warming-37
  text: 夜裡開著小窗睡，微涼的風反而讓人睡得香甜。
  tags: [warming]
- id: se-warming-38
  text: 巷口的花攤擺出了新品種，色彩跟著溫度一起繽紛起來。
  tags: [warming]
- id: se-warming-39
  text: 手機不再一拿出來就凍手，滑起來順暢又舒服。
  tags: [warming]
- id: se-warming-40
  text: 暖和的午後最適合把家裡曬一曬，連心情也跟著透亮。
  tags: [warming]
