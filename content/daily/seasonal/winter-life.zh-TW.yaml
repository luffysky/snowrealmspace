# 季節 · 冬天生活。繁體中文，每一則獨一無二。
- id: se-winterlife-01
  text: 天冷了，一鍋熱騰騰的火鍋最療癒。
  tags: [winter]
- id: se-winterlife-02
  text: 鑽進被窩的那一刻，全世界都安靜了下來。
  tags: [winter]
- id: se-winterlife-03
  text: 手套圍巾都上場，出門把自己包成一顆球。
  tags: [winter]
- id: se-winterlife-04
  text: 圍爐的桌邊坐滿人，熱氣把臉都烘紅了。
  tags: [winter]
- id: se-winterlife-05
  text: 暖暖包塞進口袋，走在路上就多了點勇氣。
  tags: [winter]
- id: se-winterlife-06
  text: 年末了，桌曆翻到最後一頁，時間過得真快。
  tags: [winter]
- id: se-winterlife-07
  text: 熱水袋抱在懷裡，冬夜也能睡得香甜。
  tags: [winter]
- id: se-winterlife-08
  text: 白天短得像眨個眼，四五點天就暗了。
  tags: [winter]
- id: se-winterlife-09
  text: 橘子一顆接一顆，剝皮的香氣是冬天的味道。
  tags: [winter]
- id: se-winterlife-10
  text: 厚襪子穿上，腳一暖，整個人都安穩了。
  tags: [winter]
- id: se-winterlife-11
  text: 薑茶下肚，一路暖到指尖。
  tags: [winter]
- id: se-winterlife-12
  text: 跨年的煙火在夜空炸開，又一年了。
  tags: [winter]
- id: se-winterlife-13
  text: 窗上結了一層霧氣，用手指畫個圈很有趣。
  tags: [winter]
- id: se-winterlife-14
  text: 冷氣團來的日子，窩在家裡反而最舒服。
  tags: [winter]
- id: se-winterlife-15
  text: 電暖器嗡嗡響，房間一角變成最暖的地方。
  tags: [winter]
- id: se-winterlife-16
  text: 圍巾繞了兩圈，只露出眼睛看世界。
  tags: [winter]
- id: se-winterlife-17
  text: 冬天的棉被特別重，壓著人睡得踏實。
  tags: [winter]
- id: se-winterlife-18
  text: 熱湯的白煙冒上來，隔著碗都覺得幸福。
  tags: [winter]
- id: se-winterlife-19
  text: 街上點起了燈飾，寒夜也變得亮晶晶。
  tags: [winter]
- id: se-winterlife-20
  text: 年關近了，慢慢把心事收一收，準備過個好年。
  tags: [winter]
