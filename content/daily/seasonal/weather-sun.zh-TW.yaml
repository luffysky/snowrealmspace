# 季節/天氣 · 晴天。繁體中文，每一則獨一無二。
- id: se-sun-01
  text: 陽光正好，出門走走會讓一整天都亮起來。
  tags: [sunny]
- id: se-sun-02
  text: 這麼藍的天，抬頭看一眼就覺得心情開闊。
  tags: [sunny]
- id: se-sun-03
  text: 把棉被拿去曬一曬，晚上會有暖暖的太陽味。
  tags: [sunny]
- id: se-sun-04
  text: 陽光強的時候，防曬和一頂帽子能讓皮膚舒服很多。
  tags: [sunny]
- id: se-sun-05
  text: 這樣的好天氣，很適合到公園散一段長長的步。
  tags: [sunny]
- id: se-sun-06
  text: 午後坐在窗邊曬曬太陽，暖意會慢慢滲進身體裡。
  tags: [sunny]
- id: se-sun-07
  text: 天氣晴朗，把窗戶打開讓新鮮空氣流進屋子吧。
  tags: [sunny]
- id: se-sun-08
  text: 出門前補一點水，晴天裡身體流汗比想像中快。
  tags: [sunny]
- id: se-sun-09
  text: 陽光灑在桌面上，連平凡的角落都變得溫柔。
  tags: [sunny]
- id: se-sun-10
  text: 難得放晴，晾出去的衣服到傍晚就乾爽蓬鬆了。
  tags: [sunny]
- id: se-sun-11
  text: 這種好天適合騎著車，讓風輕輕拂過臉頰。
  tags: [sunny]
- id: se-sun-12
  text: 正午的太陽有點烈，找片樹蔭歇一會兒剛剛好。
  tags: [sunny]
- id: se-sun-13
  text: 明亮的日子裡，一杯冰涼的飲料格外沁人心脾。
  tags: [sunny]
- id: se-sun-14
  text: 藍天白雲底下，隨手拍張照都像明信片一樣好看。
  tags: [sunny]
- id: se-sun-15
  text: 陽光暖和，把久放的植物搬到窗邊透透光吧。
  tags: [sunny]
- id: se-sun-16
  text: 晴朗的清晨最清爽，適合到巷口悠悠走一圈。
  tags: [sunny]
- id: se-sun-17
  text: 太陽下山前的金色光線，把整條街染得很溫柔。
  tags: [sunny]
- id: se-sun-18
  text: 天氣這麼好，帶著點心到草地上坐坐也很愜意。
  tags: [sunny]
- id: se-sun-19
  text: 陽光曬過的午後，戴上墨鏡走在路上格外自在。
  tags: [sunny]
- id: se-sun-20
  text: 這樣的晴空底下，深吸一口氣就覺得充滿了活力。
  tags: [sunny]
