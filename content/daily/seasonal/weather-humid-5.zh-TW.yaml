# 季節/天氣 · 潮濕（第五批）。繁體中文，每一則獨一無二。
- id: se-humid-81
  text: 收在架上的黑膠唱片怕悶，套子直立擺放讓它們透氣，音溝才不會悶出霉點。
  tags: [humid]
- id: se-humid-82
  text: 皮沙發這幾天摸起來黏黏的，拿乾布抹過再讓它晾一陣，坐上去就清爽了。
  tags: [humid]
- id: se-humid-83
  text: 牙刷別悶在有蓋的杯裡，刷頭朝上擺在通風處，濕氣散得快才不容易藏細菌。
  tags: [humid]
- id: se-humid-84
  text: 停在陽台的腳踏車鏈條容易浮出細鏽，擦乾後抹點油，轉起來會順很多。
  tags: [humid]
- id: se-humid-85
  text: 開封的飼料倒進密封桶收著，受了潮走了味，貓咪聞著就不太願意吃。
  tags: [humid]
- id: se-humid-86
  text: 靠窗的窗簾下襬最容易吸潮發霉，隔陣子拉開通風或拿去洗一洗比較安心。
  tags: [humid]
- id: se-humid-87
  text: 一副撲克牌這種天最容易黏成一整疊，收進盒子擺在乾燥的抽屜就好抽。
  tags: [humid]
- id: se-humid-88
  text: 開了封的堅果一受潮就走味，分成小袋密封冷藏，那份香脆能多留住幾天。
  tags: [humid]
- id: se-humid-89
  text: 罐子裡的胡椒和香料容易結成硬塊，取用後旋緊蓋子擺在陰涼乾燥的地方。
  tags: [humid]
- id: se-humid-90
  text: 隱形眼鏡盒用完攤開晾乾，悶著積水最容易在裡頭養出滑滑的一層。
  tags: [humid]
- id: se-humid-91
  text: 鋼琴這種天鍵盤容易黏手，闔上琴蓋放包乾燥劑在裡頭，觸鍵會穩定些。
  tags: [humid]
- id: se-humid-92
  text: 牆上的壁紙邊角翹起來多半是受了潮，等牆面乾透再壓平黏回去才貼得牢。
  tags: [humid]
- id: se-humid-93
  text: 沒吃完的乾麵條怕返潮發黏，束緊袋口再套個夾鏈袋，收進乾燥的櫃子。
  tags: [humid]
- id: se-humid-94
  text: 手帕悶在口袋裡一整天會沾上潮味，晚上攤開晾乾，隔天用起來才舒服。
  tags: [humid]
- id: se-humid-95
  text: 畫具裡的水彩紙受潮會起皺，夾在畫板中間壓著，紙面就能保持平整。
  tags: [humid]
- id: se-humid-96
  text: 木筷洗完立起來瀝乾，這種濕度平擺著最容易在縫裡悄悄冒出霉點。
  tags: [humid]
- id: se-humid-97
  text: 一疊信封的封口膠受了潮會自己黏起來，收進夾鏈袋隔開濕氣就不怕黏死。
  tags: [humid]
- id: se-humid-98
  text: 早餐吃的麥片沒密封隔夜就回軟，夾緊袋口收進乾燥的罐子脆度能撐久些。
  tags: [humid]
- id: se-humid-99
  text: 木頭做的擺飾這種天容易吸潮變沉，擺在通風處偶爾擦一擦它就不會悶。
  tags: [humid]
- id: se-humid-100
  text: 泡麵的粉包受潮會結成小塊，整包收進密封盒擺乾燥處，沖起來味道才夠。
  tags: [humid]
