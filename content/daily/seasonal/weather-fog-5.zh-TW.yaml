# 季節/天氣 · 起霧（第五批）。繁體中文，每一則獨一無二。
- id: se-fog-81
  text: 海邊的燈塔在濃霧裡一圈圈掃著光，替看不見航道的船隻緩緩指著路。
  tags: [foggy]
- id: se-fog-82
  text: 霧裡的櫻花開得朦朦朧朧，粉白的花瓣像浮在一層薄紗上頭。
  tags: [foggy]
- id: se-fog-83
  text: 露天溫泉的熱氣和山霧纏在一起，整座池子彷彿泡進了一片白雲。
  tags: [foggy]
- id: se-fog-84
  text: 竹林在霧中只剩一片淡淡的青影，風一過整片就沙沙地響起來。
  tags: [foggy]
- id: se-fog-85
  text: 山腰的梯田罩著晨霧，一層層水面像鋪了半透明的鏡子。
  tags: [foggy]
- id: se-fog-86
  text: 清晨的市場飄著薄霧，攤販的燈一盞盞在白氣裡靜靜亮著。
  tags: [foggy]
- id: se-fog-87
  text: 霧裡傳來的鐘聲又遠又悶，一聲聲在巷弄之間慢慢化開。
  tags: [foggy]
- id: se-fog-88
  text: 楓葉在霧裡紅得柔柔的，一片片像浸在牛奶般的白氣中。
  tags: [foggy]
- id: se-fog-89
  text: 田裡的稻草人立在晨霧當中，遠遠看去幾乎和白影融成一體。
  tags: [foggy]
- id: se-fog-90
  text: 霧重的清晨在堤邊釣魚，浮標時隱時現，眼睛得盯得緊一些。
  tags: [foggy]
- id: se-fog-91
  text: 划船遇上霧別離岸太遠，岸的輪廓一淡就容易認錯了方向。
  tags: [foggy]
- id: se-fog-92
  text: 霧沒散的午後不太適合放風箏，線一放遠就看不見那隻紙鳶了。
  tags: [foggy]
- id: se-fog-93
  text: 拿望遠鏡賞鳥碰上濃霧，鏡片外白茫茫一片，等霧淡了景物才對得上焦。
  tags: [foggy]
- id: se-fog-94
  text: 起了霧的早上宅配容易晚一點到，時間抓寬鬆些，不必一直守在門口。
  tags: [foggy]
- id: se-fog-95
  text: 曬穀場今天先別急著鋪稻穀，霧氣沒散開，鋪了也曬不透。
  tags: [foggy]
- id: se-fog-96
  text: 救護車的燈光在霧裡糊成一片紅藍，聽見鳴笛先靠邊讓路比較安全。
  tags: [foggy]
- id: se-fog-97
  text: 霧鎖著整片林子，松鼠在枝椏間跳動的身影一下就沒進白影裡。
  tags: [foggy]
- id: se-fog-98
  text: 農夫趁著晨霧下田，斗笠在白氣裡一頂頂移動，遠看只剩幾個淡影。
  tags: [foggy]
- id: se-fog-99
  text: 電線上停著幾隻烏鴉，晨霧裡只看得見一排黑黑的小點。
  tags: [foggy]
- id: se-fog-100
  text: 果園罩在晨霧裡，枝頭的果子掛著水珠，採之前先讓霧散一散。
  tags: [foggy]
