# 季節 · 春天生活（續）。繁體中文，每一則獨一無二。
- id: se-springlife-21
  text: 清明前後家裡包起潤餅，桌上一排菜絲和花生粉，捲起來一口滿滿的春天。
  tags: [spring]
- id: se-springlife-22
  text: 夜裡田邊亮起點點螢火蟲，一閃一閃的，看著看著就捨不得走。
  tags: [spring]
- id: se-springlife-23
  text: 下午講沒兩句就開始打哈欠，春困這回事還真的躲不掉。
  tags: [spring]
- id: se-springlife-24
  text: 梅雨還沒來，空氣先悶了起來，除濕機默默又被搬了出來。
  tags: [spring]
- id: se-springlife-25
  text: 賞櫻的人潮擠得水泄不通，索性退到樹下靜靜看落瓣飄，反而更美。
  tags: [spring]
- id: se-springlife-26
  text: 市場擺出紅通通的草莓，一盒盒香氣直往鼻子裡鑽，忍不住就帶了一盒。
  tags: [spring]
- id: se-springlife-27
  text: 山邊的杜鵑一叢叢開得熱鬧，紫的白的紅的擠在一起很有精神。
  tags: [spring]
- id: se-springlife-28
  text: 夜裡窗外的蛙鳴此起彼落，聽著聽著竟成了最好的安眠曲。
  tags: [spring]
- id: se-springlife-29
  text: 春分這天日夜一樣長，日子好像被溫柔地對半分了。
  tags: [spring]
- id: se-springlife-30
  text: 河堤上有人放起風箏，線一放長，整片天空都熱鬧了起來。
  tags: [spring]
- id: se-springlife-31
  text: 河邊的楊柳垂下新綠的枝條，風一吹就柔柔地擺，很好看。
  tags: [spring]
- id: se-springlife-32
  text: 春雷一響，賴在土裡的蟲子和心事好像都被叫醒了。
  tags: [spring]
- id: se-springlife-33
  text: 新採的春茶泡開，那股清香帶著剛冒芽的鮮嫩，一喝就知道季節換了。
  tags: [spring]
- id: se-springlife-34
  text: 木棉花沿著整條大道開得火紅，一朵朵掉在地上還是圓圓飽滿的。
  tags: [spring]
- id: se-springlife-35
  text: 天氣一暖，蚊子也悄悄回來了，電蚊拍又被翻出來放在門邊。
  tags: [spring]
- id: se-springlife-36
  text: 早市的青菜水嫩得發亮，一把才幾十塊，晚餐的配菜就有著落了。
  tags: [spring]
- id: se-springlife-37
  text: 街上的店換上了淺色春裝，路過櫥窗都覺得心情跟著亮了幾分。
  tags: [spring]
- id: se-springlife-38
  text: 午睡醒來窗外還亮著，被陽光曬得暖暖的，一時分不清是幾點。
  tags: [spring]
- id: se-springlife-39
  text: 田裡插好的秧苗一整片嫩綠，風一吹像水面泛起細細的波。
  tags: [spring]
- id: se-springlife-40
  text: 走在路上一陣風把頭髮吹亂，帶著花香，亂得也讓人想笑。
  tags: [spring]
