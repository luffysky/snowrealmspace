# 季節/天氣 · 雨天（續）。繁體中文，每一則獨一無二。
- id: se-rain-21
  text: 手機和錢包收進包包內袋，這種天防它們被雨氣浸到。
  tags: [rainy]
- id: se-rain-22
  text: 陽台的盆栽今天不用澆水了，雨會替你把它們照顧好。
  tags: [rainy]
- id: se-rain-23
  text: 屋簷下滴落的水珠串成一條線，看著看著時間就慢了下來。
  tags: [rainy]
- id: se-rain-24
  text: 這種濕漉漉的日子，把冷氣關掉開一下除濕，衣櫃會謝謝你。
  tags: [rainy]
- id: se-rain-25
  text: 積水的窪地映著天空，繞過去走能少踩一腳冰涼。
  tags: [rainy]
- id: se-rain-26
  text: 雨天的公車總是晚一點來，多留幾分鐘給等待剛剛好。
  tags: [rainy]
- id: se-rain-27
  text: 玄關擺塊吸水地墊，進門那一步就不會把水帶進客廳。
  tags: [rainy]
- id: se-rain-28
  text: 長褲的褲腳捲高一小截，走過馬路就不怕沾上泥水。
  tags: [rainy]
- id: se-rain-29
  text: 雨聲蓋過了城市的喧囂，這是難得能專心的一段時光。
  tags: [rainy]
- id: se-rain-30
  text: 這種天氣頭髮容易毛躁，出門前抹一點護髮油會服貼許多。
  tags: [rainy]
- id: se-rain-31
  text: 遠處的山被雨霧罩住，只露出一層淡淡的輪廓，很有味道。
  tags: [rainy]
- id: se-rain-32
  text: 折傘用完先開著晾乾再收，下回撐開才不會一股霉味。
  tags: [rainy]
- id: se-rain-33
  text: 雨天的書店特別安靜，窩在角落翻幾頁是種奢侈的享受。
  tags: [rainy]
- id: se-rain-34
  text: 玻璃上的雨痕蜿蜒滑落，像替窗外的風景加了層柔焦。
  tags: [rainy]
- id: se-rain-35
  text: 這種日子廚房飄出燉煮的香氣，整個家都被填得暖暖的。
  tags: [rainy]
- id: se-rain-36
  text: 停車場到門口那段路，先把包包罩好再衝，東西才不會濕。
  tags: [rainy]
- id: se-rain-37
  text: 雨中的紅綠燈在地面拉出長長的倒影，紅一片綠一片很好看。
  tags: [rainy]
- id: se-rain-38
  text: 濕冷的傍晚泡個熱水澡，寒意會從指尖一路退到腳底。
  tags: [rainy]
- id: se-rain-39
  text: 傘尖上滴下的水在地磚上點出小圓圈，是雨天限定的小風景。
  tags: [rainy]
- id: se-rain-40
  text: 這場雨讓行程慢了半拍，剛好給自己一個賴著不動的藉口。
  tags: [rainy]
