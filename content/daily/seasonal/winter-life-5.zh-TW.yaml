# 季節 · 冬天生活（第五批）。繁體中文，每一則獨一無二。
- id: se-winterlife-81
  text: 熱騰騰的肉包從蒸籠端出來，白煙撲面，捧在手裡先暖了掌心。
  tags: [winter]
- id: se-winterlife-82
  text: 街角的糖炒栗子鏟得沙沙響，買一包塞進口袋，邊走邊剝邊暖手。
  tags: [winter]
- id: se-winterlife-83
  text: 燉一鍋牛肉湯慢火熬著，香氣鑽出廚房，寒夜也被熬得溫熱。
  tags: [winter]
- id: se-winterlife-84
  text: 冬夜煮壺熱紅酒加了肉桂與柳橙，甜香瀰漫，喝一口暖到心口。
  tags: [winter]
- id: se-winterlife-85
  text: 把手套和襪子攤在暖氣旁烘，等會兒穿上就是暖呼呼的。
  tags: [winter]
- id: se-winterlife-86
  text: 起床先灌一杯溫開水，讓身子慢慢醒過來，也暖了冰冷的腸胃。
  tags: [winter]
- id: se-winterlife-87
  text: 拿暖蒸氣眼罩敷上眼睛，熱氣一圈圈化開，一整天的疲憊都沉了下來。
  tags: [winter]
- id: se-winterlife-88
  text: 炭爐上架著網子烤香腸，油滋滋地滴，圍著爐子的人都不肯走開。
  tags: [winter]
- id: se-winterlife-89
  text: 早班公車的暖氣悶悶的，坐上去沒幾站眼皮就重了起來。
  tags: [winter]
- id: se-winterlife-90
  text: 冬天洗完頭最怕吹不乾，吹風機得對著頭皮多繞好幾圈才敢出門。
  tags: [winter]
- id: se-winterlife-91
  text: 一鍋十全大補湯藥味濃濃的，喝下去從喉嚨一路熱到胃底。
  tags: [winter]
- id: se-winterlife-92
  text: 冷到指節發僵，握著剛沖好的熱咖啡，喝之前先讓掌心回了溫。
  tags: [winter]
- id: se-winterlife-93
  text: 厚厚一件棉褲套上身，走起路來窸窸窣窣，卻暖得踏實。
  tags: [winter]
- id: se-winterlife-94
  text: 深夜的滷肉飯攤還冒著熱氣，來一碗配熱湯，寒夜裡吃得渾身舒暢。
  tags: [winter]
- id: se-winterlife-95
  text: 陽台的水管一早結了冰，得等太陽出來才肯慢慢化開。
  tags: [winter]
- id: se-winterlife-96
  text: 手邊擺一包烘過的紅棗桂圓，抓幾顆丟進熱水裡，甜香又暖身。
  tags: [winter]
- id: se-winterlife-97
  text: 睡衣外頭再罩一件厚睡袍，從客廳走到房間也不怕著涼。
  tags: [winter]
- id: se-winterlife-98
  text: 浴缸先放滿一缸熱水，泡進去讓熱氣蒸得全身發紅，寒意全消。
  tags: [winter]
- id: se-winterlife-99
  text: 火鍋煮到最後下一把麵，吸飽湯汁的麵條，是整鍋最搶手的收尾。
  tags: [winter]
- id: se-winterlife-100
  text: 一整箱進口的富士蘋果堆在牆角，清脆多汁，冷天啃起來格外爽口。
  tags: [winter]
