# 季節/天氣 · 陰天多雲（續）。繁體中文，每一則獨一無二。
- id: se-cloud-21
  text: 曬不到太陽，反倒不必瞇著眼找陰影走路。
  tags: [cloudy]
- id: se-cloud-22
  text: 這種天氣拍照不用擔心逆光，怎麼拍都柔柔的。
  tags: [cloudy]
- id: se-cloud-23
  text: 雲把天空分成好幾層，濃淡都不一樣，蠻耐看的。
  tags: [cloudy]
- id: se-cloud-24
  text: 沒有日曬，午睡醒來不會滿身黏膩。
  tags: [cloudy]
- id: se-cloud-25
  text: 陰天的顏色很適合穿深一點的衣服，怎麼搭都沉穩。
  tags: [cloudy]
- id: se-cloud-26
  text: 灰灰的天配上路燈提早亮起，街景有種電影感。
  tags: [cloudy]
- id: se-cloud-27
  text: 這種光線畫畫最準，顏色不會被陽光騙走。
  tags: [cloudy]
- id: se-cloud-28
  text: 悶著的雲讓遠方的山看起來更近了些。
  tags: [cloudy]
- id: se-cloud-29
  text: 沒有刺眼的反光，開車視線反而清楚。
  tags: [cloudy]
- id: se-cloud-30
  text: 陰天曬棉被雖然差了點，屋裡點香氛也一樣舒服。
  tags: [cloudy]
- id: se-cloud-31
  text: 天色暗得早，晚餐就想煮得豐盛一點。
  tags: [cloudy]
- id: se-cloud-32
  text: 這種天最適合整理房間，光線不趕人。
  tags: [cloudy]
- id: se-cloud-33
  text: 雲厚的日子，遠處的飛機聲聽得特別清楚。
  tags: [cloudy]
- id: se-cloud-34
  text: 不用防曬也能久待陽台，種的花草正好澆水。
  tags: [cloudy]
- id: se-cloud-35
  text: 灰白的天空當背景，窗台的綠意更跳出來。
  tags: [cloudy]
- id: se-cloud-36
  text: 陰天的海邊少了遊客，浪聲聽起來更完整。
  tags: [cloudy]
- id: se-cloud-37
  text: 沒有陽光催促，早晨的被窩可以多賴一會兒。
  tags: [cloudy]
- id: se-cloud-38
  text: 這種天氣手沖咖啡，蒸氣看得特別清楚。
  tags: [cloudy]
- id: se-cloud-39
  text: 雲層低低的，城市的聲音好像也被壓得柔了。
  tags: [cloudy]
- id: se-cloud-40
  text: 陰天寫字特別靜，筆尖劃過紙的聲音都聽得見。
  tags: [cloudy]
