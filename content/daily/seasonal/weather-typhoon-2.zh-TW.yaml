# 季節/天氣 · 颱風天（續）。繁體中文，每一則獨一無二。
- id: se-typhoon-21
  text: 玄關擺雙拖鞋，回家踩到濕答答的地板也不狼狽。
  tags: [typhoon]
- id: se-typhoon-22
  text: 陽台的曬衣桿收進屋，免得半夜被風吹得咚咚響。
  tags: [typhoon]
- id: se-typhoon-23
  text: 窗縫用毛巾墊著，雨水就不容易滲進來弄濕地板。
  tags: [typhoon]
- id: se-typhoon-24
  text: 麵包和罐頭擺在桌上，肚子餓了隨手就能墊一墊。
  tags: [typhoon]
- id: se-typhoon-25
  text: 寵物窩挪到離窗遠一點的角落，牠會睡得安穩些。
  tags: [typhoon]
- id: se-typhoon-26
  text: 電扇和除濕機備著，雨停後屋裡潮氣散得快。
  tags: [typhoon]
- id: se-typhoon-27
  text: 桌上點盞小夜燈，停電那一瞬也不至於手忙腳亂。
  tags: [typhoon]
- id: se-typhoon-28
  text: 熱水瓶先燒滿一壺，就算停電也還有杯熱的能喝。
  tags: [typhoon]
- id: se-typhoon-29
  text: 雨聲打在鐵皮上很有節奏，配著棉被特別好睡。
  tags: [typhoon]
- id: se-typhoon-30
  text: 大樓地下停車場如果會淹，車子先開到高處放著。
  tags: [typhoon]
- id: se-typhoon-31
  text: 玩具和書都搬到床上，這種天窩著追劇看書最剛好。
  tags: [typhoon]
- id: se-typhoon-32
  text: 頂樓的水塔蓋子扣緊，風再大也不怕被掀開。
  tags: [typhoon]
- id: se-typhoon-33
  text: 冰塊多凍幾袋，停電時食物還能撐上大半天。
  tags: [typhoon]
- id: se-typhoon-34
  text: 樓下的腳踏車牽進騎樓，隔天就不用去撿回來了。
  tags: [typhoon]
- id: se-typhoon-35
  text: 窗外樹枝刮著牆壁沙沙作響，屋裡反而顯得格外安穩。
  tags: [typhoon]
- id: se-typhoon-36
  text: 保鮮盒裝好隔夜菜，冰箱少開幾次冷氣才留得住。
  tags: [typhoon]
- id: se-typhoon-37
  text: 桌遊和撲克牌翻出來，停電的夜晚照樣熱鬧。
  tags: [typhoon]
- id: se-typhoon-38
  text: 屋外的鞋櫃和傘桶搬進來，免得被積水泡壞。
  tags: [typhoon]
- id: se-typhoon-39
  text: 雨衣掛在門邊晾著，臨時要出去也隨手拿得到。
  tags: [typhoon]
- id: se-typhoon-40
  text: 風雨最猛那幾個鐘頭，就安心待在家裡哪都別去。
  tags: [typhoon]
