# 季節/天氣 · 梅雨季。繁體中文，每一則獨一無二。
- id: se-plum-01
  text: 梅雨季到了，包包裡放把摺傘隨時備用。
  tags: [plum]
- id: se-plum-02
  text: 連日的雨讓空氣黏膩膩的，除濕機開著會舒服很多。
  tags: [plum]
- id: se-plum-03
  text: 衣櫃角落容易反潮，放幾包乾燥劑就能安心。
  tags: [plum]
- id: se-plum-04
  text: 這幾天洗好的衣服不太乾，室內晾著再吹點風比較快。
  tags: [plum]
- id: se-plum-05
  text: 灰濛濛的天色配一杯溫熱的飲料，心情也跟著沉靜下來。
  tags: [plum]
- id: se-plum-06
  text: 浴室和牆角的黴斑趁早擦掉，潮氣一重就長得快。
  tags: [plum]
- id: se-plum-07
  text: 雨鞋和防水外套先擺在門邊，出門就不會手忙腳亂。
  tags: [plum]
- id: se-plum-08
  text: 皮包皮鞋容易受潮發霉，通風的地方放著會安心些。
  tags: [plum]
- id: se-plum-09
  text: 窗戶玻璃常有一層水氣，開點縫讓空氣流動就會清爽。
  tags: [plum]
- id: se-plum-10
  text: 悶熱又濕黏的午後，沖個涼再窩著休息最放鬆。
  tags: [plum]
- id: se-plum-11
  text: 麵包和穀物封好收進乾燥處，這季節最怕受潮變質。
  tags: [plum]
- id: se-plum-12
  text: 傘架旁鋪塊布，滴下來的雨水就不會弄濕地板。
  tags: [plum]
- id: se-plum-13
  text: 綿綿細雨下個不停，撐傘走路時多留意濕滑的地磚。
  tags: [plum]
- id: se-plum-14
  text: 棉被趁著難得的空檔拿去烘一烘，睡起來蓬鬆又乾爽。
  tags: [plum]
- id: se-plum-15
  text: 濕氣一重關節就悶悶的，動一動身子會鬆快不少。
  tags: [plum]
- id: se-plum-16
  text: 車窗容易起霧影響視線，出發前先把除霧開一下。
  tags: [plum]
- id: se-plum-17
  text: 這種陰雨綿綿的日子，聽著雨聲讀本書格外愜意。
  tags: [plum]
- id: se-plum-18
  text: 相機和電子產品收進防潮箱，霉點一旦上鏡頭就難清。
  tags: [plum]
- id: se-plum-19
  text: 地板摸起來黏黏的，拖過一遍再開除濕就清爽多了。
  tags: [plum]
- id: se-plum-20
  text: 難得放晴的空檔，把窗全打開讓屋裡透透氣。
  tags: [plum]
