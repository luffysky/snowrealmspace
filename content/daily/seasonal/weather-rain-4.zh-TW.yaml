# 季節/天氣 · 雨天（第四批）。繁體中文，每一則獨一無二。
- id: se-rain-61
  text: 雷聲隆隆的時候，順手把貴重電器的插頭拔一拔，會少一分擔心。
  tags: [rainy]
- id: se-rain-62
  text: 開車前先確認雨刷的膠條沒老化，刷得乾淨視線才不會糊成一片。
  tags: [rainy]
- id: se-rain-63
  text: 這種哪兒都去不了的日子，正好把片單裡擱很久的電影補上一部。
  tags: [rainy]
- id: se-rain-64
  text: 雨聲把人哄得昏昏欲睡，午後補上一小段瞇眼，醒來會神清氣爽。
  tags: [rainy]
- id: se-rain-65
  text: 除濕機的水箱滿了記得倒掉，一整天下來它替屋子吸走了不少潮氣。
  tags: [rainy]
- id: se-rain-66
  text: 把布鞋收起來換上防水的那雙，腳趾一整天乾爽，走起路也踏實。
  tags: [rainy]
- id: se-rain-67
  text: 田邊的青蛙被雨喚醒，此起彼落地叫著，是這種夜晚才有的伴奏。
  tags: [rainy]
- id: se-rain-68
  text: 連日的雨會讓溪水暴漲，這幾天靠近河邊時記得離水遠一點。
  tags: [rainy]
- id: se-rain-69
  text: 出門挑件深色的衣服，就算被雨打濕，也不怕貼在身上透出來。
  tags: [rainy]
- id: se-rain-70
  text: 沿著騎樓一路走過去，多半能少撐幾把傘就到得了目的地。
  tags: [rainy]
- id: se-rain-71
  text: 濕冷從腳底鑽上來的時候，燒盆熱水泡泡腳，寒意就散得快了。
  tags: [rainy]
- id: se-rain-72
  text: 這樣的天氣熬一鍋咖哩，濃稠的香氣飄滿屋子，人也跟著暖了。
  tags: [rainy]
- id: se-rain-73
  text: 車窗蒙上一層白霧，用指尖在上頭畫幾筆，是小時候最愛玩的把戲。
  tags: [rainy]
- id: se-rain-74
  text: 室內的觀葉植物其實偏愛這股濕氣，雨天的它們葉子綠得更精神。
  tags: [rainy]
- id: se-rain-75
  text: 家裡的貓狗常被雷聲嚇得發抖，這時候陪在身邊摸摸牠會安心許多。
  tags: [rainy]
- id: se-rain-76
  text: 淋了點雨回來，倒杯溫開水握著慢慢喝，身子裡外都會回暖。
  tags: [rainy]
- id: se-rain-77
  text: 遇上沒帶傘的人，把傘往他那頭多傾一些，兩個人都淋不著。
  tags: [rainy]
- id: se-rain-78
  text: 風把雨斜斜地打進來，順手把迎風那側的窗掩上，桌面就不會濕一片。
  tags: [rainy]
- id: se-rain-79
  text: 衣服晾了幾天還帶潮氣，丟進烘衣機轉一轉，穿上身暖呼呼的最舒服。
  tags: [rainy]
- id: se-rain-80
  text: 難得整天窩著哪也不去，翻出信紙給遠方的人寫幾句近況剛剛好。
  tags: [rainy]
