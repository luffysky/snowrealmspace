# 季節/天氣 · 陰天多雲（第三批）。繁體中文，每一則獨一無二。
- id: se-cloud-41
  text: 雲把日出藏了起來，天亮得慢，起床也不必太急。
  tags: [cloudy]
- id: se-cloud-42
  text: 這種天色最好認路標，招牌的顏色不會被反光洗白。
  tags: [cloudy]
- id: se-cloud-43
  text: 陰天騎腳踏車不刺眼，一路能看清沿途的招牌小店。
  tags: [cloudy]
- id: se-cloud-44
  text: 沒有太陽照著螢幕，坐在窗邊工作眼睛也不吃力。
  tags: [cloudy]
- id: se-cloud-45
  text: 灰調的天空拍老街最有味道，磚牆的紋路都顯出來了。
  tags: [cloudy]
- id: se-cloud-46
  text: 雲厚的日子曬不乾油漆，剛好把補牆的事往後挪一挪。
  tags: [cloudy]
- id: se-cloud-47
  text: 這樣的天光挑毛線顏色最準，深淺不會被陽光晃花。
  tags: [cloudy]
- id: se-cloud-48
  text: 天陰著逛市場很舒服，攤子上的蔬果都不曬蔫。
  tags: [cloudy]
- id: se-cloud-49
  text: 沒有影子跟著跑，牽狗散步時牠也走得從容。
  tags: [cloudy]
- id: se-cloud-50
  text: 悶灰的天配一鍋滷味，屋裡的香氣顯得更濃。
  tags: [cloudy]
- id: se-cloud-51
  text: 雲遮得嚴實，午後三點的光線和清晨差不了多少。
  tags: [cloudy]
- id: se-cloud-52
  text: 這種天氣搬盆栽出去透氣正好，葉子不會被曬傷。
  tags: [cloudy]
- id: se-cloud-53
  text: 天色沉沉的，泡溫泉或泡澡都更有理由多待一會。
  tags: [cloudy]
- id: se-cloud-54
  text: 沒有烈日烤著柏油，路面的熱氣散了，腳步輕鬆多了。
  tags: [cloudy]
- id: se-cloud-55
  text: 灰白的雲下賞湖水，倒影平得像一面靜靜的鏡子。
  tags: [cloudy]
- id: se-cloud-56
  text: 陰天縫東西不怕刺眼，針腳看得清清楚楚。
  tags: [cloudy]
- id: se-cloud-57
  text: 雲層低垂的傍晚，遠山像被裁進了一幅淡墨畫裡。
  tags: [cloudy]
- id: se-cloud-58
  text: 這種天出門看展最舒服，館外的白光不會晃眼。
  tags: [cloudy]
- id: se-cloud-59
  text: 沒有太陽趕人，週末的早市可以慢慢逛到中午。
  tags: [cloudy]
- id: se-cloud-60
  text: 天悶著的午後，聽黑膠轉盤沙沙轉，時間也慢了半拍。
  tags: [cloudy]
