# 季節/天氣 · 悶熱（續）。繁體中文，每一則獨一無二。
- id: se-muggy-21
  text: 捷運車廂裡人擠人又悶，先在月台深呼吸再上車也不遲。
  tags: [muggy]
- id: se-muggy-22
  text: 眼鏡一走出冷氣房就起霧，這種溫差是悶熱天的小小代價。
  tags: [muggy]
- id: se-muggy-23
  text: 曬過的棉被今天恐怕收不到太陽的香氣，濕氣重就晚點再曬。
  tags: [muggy]
- id: se-muggy-24
  text: 廚房煮飯時熱氣加濕氣特別難熬，開個抽油煙機讓空氣走一走。
  tags: [muggy]
- id: se-muggy-25
  text: 頭髮一出門就塌，這種黏膩的空氣本來就難整理，順其自然吧。
  tags: [muggy]
- id: se-muggy-26
  text: 手機螢幕都被手汗弄得滑滑的，擦一擦，順手也把心情擦亮。
  tags: [muggy]
- id: se-muggy-27
  text: 曬衣服半天不乾的日子，除濕機和烘衣是很值得的依靠。
  tags: [muggy]
- id: se-muggy-28
  text: 這種要下不下的悶天氣最耗人，替自己備把折傘心裡踏實些。
  tags: [muggy]
- id: se-muggy-29
  text: 木質地板踩起來都黏黏的，開扇窗讓風穿堂而過會清爽許多。
  tags: [muggy]
- id: se-muggy-30
  text: 蟬聲把午後叫得更悶了，泡杯冷泡茶靜靜聽也別有味道。
  tags: [muggy]
- id: se-muggy-31
  text: 悶熱天連書頁都吸了潮氣變軟，放包乾燥劑在抽屜守著它們。
  tags: [muggy]
- id: se-muggy-32
  text: 剛拖過的地遲遲不乾，這種濕氣就別急著走上去，緩一緩。
  tags: [muggy]
- id: se-muggy-33
  text: 額前的瀏海黏成一撮，夾起來露出額頭會涼快不少。
  tags: [muggy]
- id: se-muggy-34
  text: 這股蒸騰的暑氣讓人動一下就冒汗，把行程排鬆一點剛剛好。
  tags: [muggy]
- id: se-muggy-35
  text: 傍晚那陣悶雷聽著就煩躁，關上窗聽點輕音樂蓋過它。
  tags: [muggy]
- id: se-muggy-36
  text: 冰箱裡冰過的毛巾這時候最好用，敷一下後頸整個人都醒了。
  tags: [muggy]
- id: se-muggy-37
  text: 這種天氣鞋子悶著容易有味道，回家記得讓它們透透氣。
  tags: [muggy]
- id: se-muggy-38
  text: 悶得連貓都攤在磁磚上不想動，跟牠一樣躺平一會兒也無妨。
  tags: [muggy]
- id: se-muggy-39
  text: 濕熱裡連牆角都可能悄悄冒霉點，趁今天巡一巡通通風。
  tags: [muggy]
- id: se-muggy-40
  text: 悶熱把夜色也焐得黏稠，睡前沖個溫水澡比冷水更好入眠。
  tags: [muggy]
