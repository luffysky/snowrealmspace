# 季節 · 秋天生活。繁體中文，每一則獨一無二。
- id: se-autumnlife-01
  text: 秋天了，風變涼，適合泡杯熱茶。
  tags: [autumn]
- id: se-autumnlife-02
  text: 衣櫃翻出薄外套，換季的味道就這樣來了。
  tags: [autumn]
- id: se-autumnlife-03
  text: 楓葉紅了一整排，走過去像穿進一幅畫。
  tags: [autumn]
- id: se-autumnlife-04
  text: 空氣乾乾的，護唇膏和乳液可以放在手邊了。
  tags: [autumn]
- id: se-autumnlife-05
  text: 傍晚天色暗得快，屋裡的燈亮起來特別溫。
  tags: [autumn]
- id: se-autumnlife-06
  text: 街角飄來烤地瓜的香，秋天的胃最誠實。
  tags: [autumn]
- id: se-autumnlife-07
  text: 棉被曬過太陽的味道，是這個季節的小確幸。
  tags: [autumn]
- id: se-autumnlife-08
  text: 柿子上市了，橘紅色掛在攤子上很好看。
  tags: [autumn]
- id: se-autumnlife-09
  text: 早晚溫差大，出門多帶一件總不會錯。
  tags: [autumn]
- id: se-autumnlife-10
  text: 落葉踩起來沙沙響，像整條路在跟你說話。
  tags: [autumn]
- id: se-autumnlife-11
  text: 桂花開的時候，整條巷子都是甜甜的香氣。
  tags: [autumn]
- id: se-autumnlife-12
  text: 秋高氣爽的天，晾出去的衣服一下就乾。
  tags: [autumn]
- id: se-autumnlife-13
  text: 天涼了，燉一鍋熱湯，整間屋子都暖起來。
  tags: [autumn]
- id: se-autumnlife-14
  text: 陽台的光斜斜照進來，午後很適合發個小呆。
  tags: [autumn]
- id: se-autumnlife-15
  text: 換上長袖的第一天，身體就記得季節換了。
  tags: [autumn]
- id: se-autumnlife-16
  text: 栗子在鍋裡翻炒的聲音，是秋天的背景音。
  tags: [autumn]
- id: se-autumnlife-17
  text: 夜變長了，多出來的時間拿來看本書剛剛好。
  tags: [autumn]
- id: se-autumnlife-18
  text: 涼風從窗縫溜進來，蓋條薄毯正合適。
  tags: [autumn]
- id: se-autumnlife-19
  text: 楓紅的季節，找個週末上山走一趟很值得。
  tags: [autumn]
- id: se-autumnlife-20
  text: 秋陽不燙人，曬在背上暖暖的很舒服。
  tags: [autumn]
