# 季節/天氣 · 乾燥（第三批）。繁體中文，每一則獨一無二。
- id: se-dry-41
  text: 喉嚨乾得有點癢，含一小匙枇杷膏順著喉頭滑下去很舒緩。
  tags: [dry]
- id: se-dry-42
  text: 嘴角乾裂到一笑就有點刺痛，抹點修護膏笑起來才自在。
  tags: [dry]
- id: se-dry-43
  text: 乾燥容易讓頭皮屑冒出來，換支溫和的洗髮精、洗後把頭皮吹暖。
  tags: [dry]
- id: se-dry-44
  text: 睡前敷一片保濕面膜，讓乾了一天的臉頰把水分喝飽。
  tags: [dry]
- id: se-dry-45
  text: 把洗好的衣服晾在室內，蒸散的水氣能悄悄替房間補點濕度。
  tags: [dry]
- id: se-dry-46
  text: 綠植的葉尖在乾空氣裡容易枯黃，往葉面噴點水霧牠們會精神些。
  tags: [dry]
- id: se-dry-47
  text: 隨身帶個保溫瓶裝熱水，走到哪都能潤一潤發乾的喉嚨。
  tags: [dry]
- id: se-dry-48
  text: 伸手開門常被門把電得一麻，先用指節碰一下再握就不那麼刺。
  tags: [dry]
- id: se-dry-49
  text: 頭髮在乾天容易炸開毛躁，抹點護髮油順一順會服貼不少。
  tags: [dry]
- id: se-dry-50
  text: 皮膚乾到有點發癢，別使勁抓，補層乳霜安撫它更舒服。
  tags: [dry]
- id: se-dry-51
  text: 沖一杯溫溫的蜂蜜水，甜潤的暖意能把乾啞的喉嚨包起來。
  tags: [dry]
- id: se-dry-52
  text: 對著熱水盆蒸一蒸臉，水氣氤氳裡繃緊的皮膚會鬆開來。
  tags: [dry]
- id: se-dry-53
  text: 皮鞋和皮包在乾季容易起紋，上點保養油讓它們保住光潤。
  tags: [dry]
- id: se-dry-54
  text: 木吉他在乾空氣裡音色會變乾，琴盒裡放個小加濕片護著它。
  tags: [dry]
- id: se-dry-55
  text: 夜裡讓加濕器定時運轉，一室水氣陪你安穩到天亮。
  tags: [dry]
- id: se-dry-56
  text: 在椅背搭條擰乾的濕毛巾，工作時身邊就多了一圈溫潤的空氣。
  tags: [dry]
- id: se-dry-57
  text: 泡澡別泡得太燙太久，乾季裡熱水容易把皮膚的油分也帶走。
  tags: [dry]
- id: se-dry-58
  text: 加濕器用久了記得換水清洗，乾淨的水氣噴出來才真的養人。
  tags: [dry]
- id: se-dry-59
  text: 出門戴上口罩，多少替臉頰擋一擋刮人的乾風。
  tags: [dry]
- id: se-dry-60
  text: 乾季的暖陽難得，搬張椅子曬曬背，讓陽光把身子焐得暖暖的。
  tags: [dry]
