# 季節/天氣 · 陰天多雲（第四批）。繁體中文，每一則獨一無二。
- id: se-cloud-61
  text: 灰雲把午後的陽台罩住，晾的蘿蔔乾雖慢乾，鹹香倒是慢慢醞出來了。
  tags: [cloudy]
- id: se-cloud-62
  text: 天沉著的時候調糖水最準，糖色深淺不會被日光騙過去。
  tags: [cloudy]
- id: se-cloud-63
  text: 悶灰的清晨爬山，登頂看不到遠景，反而聽得見一整片鳥叫。
  tags: [cloudy]
- id: se-cloud-64
  text: 雲層壓得低，河堤的釣客把浮標看得更清楚，一有動靜就揚竿。
  tags: [cloudy]
- id: se-cloud-65
  text: 這種天色曬版畫的顯影紙最溫和，線條不會被強光吃掉細節。
  tags: [cloudy]
- id: se-cloud-66
  text: 天陰著逛書店特別耐得住，一櫃一櫃翻過去也不覺得累。
  tags: [cloudy]
- id: se-cloud-67
  text: 灰白的光鋪在瓷器上，釉色的層次一眼就分得出來。
  tags: [cloudy]
- id: se-cloud-68
  text: 雲遮著的傍晚放天燈，火光在暗灰的底色裡格外亮眼。
  tags: [cloudy]
- id: se-cloud-69
  text: 悶天裡烘焙不必擔心奶油化太快，揉麵團的手感穩多了。
  tags: [cloudy]
- id: se-cloud-70
  text: 沒有日頭曬著碼頭，補漁網的老人坐得住，一補就是一下午。
  tags: [cloudy]
- id: se-cloud-71
  text: 這種天光校對照片顏色最可靠，白牆就是白牆，不偏黃也不偏藍。
  tags: [cloudy]
- id: se-cloud-72
  text: 雲厚的日子逛動物園，怕熱的動物都出來走動，看得比平常過癮。
  tags: [cloudy]
- id: se-cloud-73
  text: 天灰著開窗通風剛好，屋裡的舊書味被慢慢換成清淡的濕氣。
  tags: [cloudy]
- id: se-cloud-74
  text: 沒有影子在腳邊晃，練太極的人動作跟著雲一樣不疾不徐。
  tags: [cloudy]
- id: se-cloud-75
  text: 悶灰的天配鹽酥雞攤的燈，油鍋的熱氣在暗色裡冒得特別白。
  tags: [cloudy]
- id: se-cloud-76
  text: 雲低低壓著的午後，撞球間的燈更顯亮，一桿一桿都看得仔細。
  tags: [cloudy]
- id: se-cloud-77
  text: 這種天氣曬藥草乾得慢，香氣反而一點一點鎖進葉子裡。
  tags: [cloudy]
- id: se-cloud-78
  text: 天陰著晾墨最好，宣紙上的字不會被曬得裂開毛邊。
  tags: [cloudy]
- id: se-cloud-79
  text: 灰濛濛的碼頭邊，貨輪的汽笛聲聽起來悶悶的，拖得很長。
  tags: [cloudy]
- id: se-cloud-80
  text: 沒有烈日烤著鐵皮屋，午睡的貓在窗台睡得四平八穩。
  tags: [cloudy]
