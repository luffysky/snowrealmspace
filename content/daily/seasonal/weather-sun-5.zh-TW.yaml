# 季節/天氣 · 晴天（第五批）。繁體中文，每一則獨一無二。
- id: se-sun-81
  text: 這樣的好天氣到街上走走，櫥窗被陽光照得亮晶晶，看看走走格外愜意。
  tags: [sunny]
- id: se-sun-82
  text: 晴空萬里，抬頭剛好望見一架飛機拖著白線，緩緩劃過整片藍。
  tags: [sunny]
- id: se-sun-83
  text: 屋頂的太陽能板在大晴天最勤快，把滿滿的日照悄悄換成家裡的電。
  tags: [sunny]
- id: se-sun-84
  text: 籬笆上的蜘蛛網被陽光一照，一絲一絲亮得像銀線，平時根本瞧不見。
  tags: [sunny]
- id: se-sun-85
  text: 陽光把白牆照得雪亮，伸手比幾個手影，小時候的把戲又玩了起來。
  tags: [sunny]
- id: se-sun-86
  text: 傍晚爬上頂樓看夕陽，橘紅一整片把天空燒得壯麗，讓人捨不得眨眼。
  tags: [sunny]
- id: se-sun-87
  text: 趁著大太陽把地毯洗一洗攤開曬，曬透了踩上去鬆軟又不帶潮味。
  tags: [sunny]
- id: se-sun-88
  text: 到溪邊踩踩水，陽光曬在肩上、涼意漫過腳踝，暑氣一下就退了。
  tags: [sunny]
- id: se-sun-89
  text: 出遊回來把帳篷攤在草地上曬乾，收起來就不會悶出一股潮味。
  tags: [sunny]
- id: se-sun-90
  text: 陽光灑進玻璃花房，蘭花和多肉都舒展開來，暖得像在做日光浴。
  tags: [sunny]
- id: se-sun-91
  text: 把收好的花種攤在紙上曬幾天，乾透了收進小袋，留待來年再撒下。
  tags: [sunny]
- id: se-sun-92
  text: 趁乾爽的大晴天替木椅補漆，塗上去乾得快，隔天就能安心坐了。
  tags: [sunny]
- id: se-sun-93
  text: 潮水退下後陽光曬著沙灘，低頭撿幾枚被曬得發亮的貝殼，是海邊限定的收穫。
  tags: [sunny]
- id: se-sun-94
  text: 趁大太陽把切好的地瓜條攤上竹篩，曬個幾天就成了甜甜的地瓜乾。
  tags: [sunny]
- id: se-sun-95
  text: 把沙發的抱枕和坐墊全搬到陽台曬，曬過一輪坐起來蓬鬆又清爽。
  tags: [sunny]
- id: se-sun-96
  text: 支起畫架在陽光下寫生，光影的明暗都落進紙裡，畫起來格外帶勁。
  tags: [sunny]
- id: se-sun-97
  text: 陽光斜斜射進屋裡，光柱裡浮動的細塵一粒粒看得分明，安靜得出奇。
  tags: [sunny]
- id: se-sun-98
  text: 這種好天最適合上山走走，稜線清楚、視野開闊，一路曬著暖陽爬得也起勁。
  tags: [sunny]
- id: se-sun-99
  text: 躺在草地上看雲，一朵朵被陽光鑲了金邊，慢慢地變換著形狀。
  tags: [sunny]
- id: se-sun-100
  text: 傍晚把曬了一天的衣服收下來，每一件都還留著太陽的餘溫，摺起來心裡也暖。
  tags: [sunny]
