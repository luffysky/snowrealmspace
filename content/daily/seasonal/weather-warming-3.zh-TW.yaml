# 季節/天氣 · 回暖（第三批）。繁體中文，每一則獨一無二。
- id: se-warming-41
  text: 冰淇淋又回到了願望清單，暖天讓人想來一支透心涼。
  tags: [warming]
- id: se-warming-42
  text: 短袖被翻到衣櫃最外層，隨手一抓就能出門。
  tags: [warming]
- id: se-warming-43
  text: 騎單車兜風不再逆著寒風，一路都是溫柔的暖流。
  tags: [warming]
- id: se-warming-44
  text: 冷氣的開關被重新按下，房裡多了久違的嗡嗡聲。
  tags: [warming]
- id: se-warming-45
  text: 澆花的次數變多了，泥土一下就乾，草木也喝得勤。
  tags: [warming]
- id: se-warming-46
  text: 河堤邊坐著野餐的人多了起來，暖陽把整片草地染亮。
  tags: [warming]
- id: se-warming-47
  text: 晨跑時不必先暖身老半天，身體很快就進入狀態。
  tags: [warming]
- id: se-warming-48
  text: 巷子裡孩子的笑鬧聲拉得很長，天暖了就捨不得回家。
  tags: [warming]
- id: se-warming-49
  text: 電扇從櫃頂被請了下來，轉起來的風正好搧走午後的悶。
  tags: [warming]
- id: se-warming-50
  text: 涼飲販賣機前開始排隊，投幣的手都是輕快的。
  tags: [warming]
- id: se-warming-51
  text: 涼鞋重見天日，腳趾透氣的感覺久違又舒暢。
  tags: [warming]
- id: se-warming-52
  text: 走幾步路額頭就微微冒汗，暖意把毛孔都打開了。
  tags: [warming]
- id: se-warming-53
  text: 市場擺出了嫩綠的春蔬，光看顏色就讓人食指大動。
  tags: [warming]
- id: se-warming-54
  text: 枝頭的花一夜之間全開了，暖流替它們按下了開關。
  tags: [warming]
- id: se-warming-55
  text: 傍晚吃飯還不用開燈，天光把餐桌照得剛剛好。
  tags: [warming]
- id: se-warming-56
  text: 腦海裡浮現了海邊的畫面，這種溫度最適合往水邊跑。
  tags: [warming]
- id: se-warming-57
  text: 洗完頭髮沒多久就乾了，不用吹到手痠，也不怕著涼。
  tags: [warming]
- id: se-warming-58
  text: 薄毯蓋著就足夠，厚被子可以摺好收進衣櫃深處。
  tags: [warming]
- id: se-warming-59
  text: 襯衫的領口自然敞著，不必再一顆一顆扣到最上面。
  tags: [warming]
- id: se-warming-60
  text: 蜜蜂繞著陽台的花打轉，暖天把小生命全都招了回來。
  tags: [warming]
