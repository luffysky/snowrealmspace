# 季節/天氣 · 潮濕（第三批）。繁體中文，每一則獨一無二。
- id: se-humid-41
  text: 除濕盒的水滿了記得倒掉，滿著就吸不動空氣裡的濕氣了。
  tags: [humid]
- id: se-humid-42
  text: 廚房的菜刀用完擦乾再收，這種天刀面最容易浮出細細的鏽點。
  tags: [humid]
- id: se-humid-43
  text: 皮包內裡悶久了會有股霉味，掛在通風的地方讓它透透氣。
  tags: [humid]
- id: se-humid-44
  text: 磨好的咖啡粉趁新鮮就密封，受了潮沖出來的香氣會淡掉不少。
  tags: [humid]
- id: se-humid-45
  text: 浴室用完把門開著散散氣，悶著一整天磁磚縫最容易冒黑點。
  tags: [humid]
- id: se-humid-46
  text: 海苔一受潮就不脆了，開封後夾緊收進乾燥的罐子裡。
  tags: [humid]
- id: se-humid-47
  text: 皮鞋回潮容易變形，塞個鞋撐再擺到通風處它會挺一些。
  tags: [humid]
- id: se-humid-48
  text: 化妝的粉餅怕潮，用完蓋緊才不會表面結出一層硬殼。
  tags: [humid]
- id: se-humid-49
  text: 抹布悶著不乾最容易發酸，用完擰乾攤平掛在通風的地方。
  tags: [humid]
- id: se-humid-50
  text: 心情跟著天氣悶悶的話，放點輕快的音樂會鬆快一些。
  tags: [humid]
- id: se-humid-51
  text: 鑄鐵鍋洗完擦乾後抹上薄薄一層油，濕氣就爬不上鍋面。
  tags: [humid]
- id: se-humid-52
  text: 果乾和蜜餞開封後旋緊蓋子，這種天它們最容易返潮變軟。
  tags: [humid]
- id: se-humid-53
  text: 延長線和插座邊留意別積著水，濕重的角落順手擦乾比較放心。
  tags: [humid]
- id: se-humid-54
  text: 濕熱的午覺醒來常黏一身汗，換條乾毛巾墊著會清爽點。
  tags: [humid]
- id: se-humid-55
  text: 榻榻米底下墊塊乾布，離地一點濕氣就不會悶在裡頭。
  tags: [humid]
- id: se-humid-56
  text: 火柴和打火機受潮就不好點，收進密封袋擺在乾燥的抽屜。
  tags: [humid]
- id: se-humid-57
  text: 疊在一起的玻璃杯容易黏住，擦乾再收就不怕分不開。
  tags: [humid]
- id: se-humid-58
  text: 樂譜和筆記本的邊角容易翹，壓本厚書在上面幫它們保持平整。
  tags: [humid]
- id: se-humid-59
  text: 麵粉最怕結塊，封口夾夾緊再套個袋子收著才踏實。
  tags: [humid]
- id: se-humid-60
  text: 濕氣讓被單摸起來涼涼黏黏，睡前用電扇吹一會兒會舒服些。
  tags: [humid]
