# 季節 · 春天生活（第六批）。繁體中文，每一則獨一無二。
- id: se-springlife-101
  text: 竹子湖的海芋開成一大片雪白，遊客捲起褲管下田，一手提桶一手採花。
  tags: [spring]
- id: se-springlife-102
  text: 嫩薑一上市就買了一把，切絲醃成糖醋，酸甜脆口配稀飯剛剛好。
  tags: [spring]
- id: se-springlife-103
  text: 五色鳥躲在樹洞裡嘟嘟嘟地敲，那聲音像遠處有人慢慢敲著木魚。
  tags: [spring]
- id: se-springlife-104
  text: 後院撒下一畦地瓜葉，長開後掐嫩梢炒蒜頭，晚餐的青菜就自己種。
  tags: [spring]
- id: se-springlife-105
  text: 麵包店掛出草莓季的招牌，鮮紅的草莓蛋糕一字排開，路過就走不動。
  tags: [spring]
- id: se-springlife-106
  text: 拆下紗窗刷洗一整個冬天的灰，沖乾淨裝回去，屋裡的光都亮了一階。
  tags: [spring]
- id: se-springlife-107
  text: 夜雨敲在鐵皮屋頂上滴滴答答，聽著那節奏，不知不覺就睡沉了。
  tags: [spring]
- id: se-springlife-108
  text: 溪水漲了幾分，釣客沿著岸邊甩竿，浮標在水面上靜靜地浮沉。
  tags: [spring]
- id: se-springlife-109
  text: 路邊的咸豐草開得白花花一片，走過一趟褲管就黏滿了帶刺的種子。
  tags: [spring]
- id: se-springlife-110
  text: 遊覽車載著一車人往山裡的農場開，車上老歌一首接一首，窗外全是新綠。
  tags: [spring]
- id: se-springlife-111
  text: 阿嬤醃了一甕破布子，說配魚配粥都好，這是她每年春天必做的一件事。
  tags: [spring]
- id: se-springlife-112
  text: 巷口的燕子雛鳥探出頭嗷嗷待哺，親鳥一趟趟啣蟲回來餵，忙個不停。
  tags: [spring]
- id: se-springlife-113
  text: 芒果樹開滿細碎的米黃小花，滿樹一片，先替夏天的甜打了聲招呼。
  tags: [spring]
- id: se-springlife-114
  text: 溫室裡的番茄紅了幾顆，摘下來咬一口，酸甜的汁水一下在嘴裡漫開。
  tags: [spring]
- id: se-springlife-115
  text: 社區的春季園遊會擺滿攤子，烤香腸的煙和小孩的笑鬧聲混成一團熱鬧。
  tags: [spring]
- id: se-springlife-116
  text: 午後的光線很柔，把窗邊的舊照片一張張擦淨排好，回憶也跟著亮了。
  tags: [spring]
- id: se-springlife-117
  text: 河堤的黃花風鈴木開成一排金黃，花落時鋪滿人行道，像撒了滿地碎金。
  tags: [spring]
- id: se-springlife-118
  text: 到溪邊摸了一袋蜆仔回來吐沙，晚上煮成蒜頭蜆湯，鮮甜得多扒了兩碗飯。
  tags: [spring]
- id: se-springlife-119
  text: 清明的祭祖桌上擺了紅龜粿和牲禮，一家人輪流上香，煙裊裊地飄著。
  tags: [spring]
- id: se-springlife-120
  text: 換上短袖的第一天還有點不習慣，手臂露在外頭涼涼的，倒也輕鬆自在。
  tags: [spring]
