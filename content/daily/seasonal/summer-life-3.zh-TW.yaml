# 季節 · 夏天生活（第三批）。繁體中文，每一則獨一無二。
- id: se-summerlife-41
  text: 媽媽煮的綠豆湯冰在冰箱裡，午後盛一碗，甜甜涼涼最解暑。
  tags: [summer]
- id: se-summerlife-42
  text: 換上涼蓆睡覺，背貼上去那股沁涼，一整夜都舒服。
  tags: [summer]
- id: se-summerlife-43
  text: 停在太陽下的機車座墊燙得坐不下去，只好先搧個幾下再上車。
  tags: [summer]
- id: se-summerlife-44
  text: 阿勃勒沿路開成一串串金黃，風一吹花瓣落下像下了場黃金雨。
  tags: [summer]
- id: se-summerlife-45
  text: 校園的鳳凰木紅成一片，鳳凰花一開，就想起又到了說再見的季節。
  tags: [summer]
- id: se-summerlife-46
  text: 公園的荷花池開得正盛，撐著大片綠葉，粉白的花亭亭立在水面。
  tags: [summer]
- id: se-summerlife-47
  text: 郊外整片向日葵朝著太陽轉，金黃燦爛得讓人心情也跟著亮了。
  tags: [summer]
- id: se-summerlife-48
  text: 路邊烤玉米刷上醬料滋滋作響，香氣四溢，忍不住停下腳步買一支。
  tags: [summer]
- id: se-summerlife-49
  text: 手工愛玉加了檸檬和冰塊，酸酸滑滑的一碗下肚，暑氣消了大半。
  tags: [summer]
- id: se-summerlife-50
  text: 廟口的青草茶一大杯才幾十塊，喝下去苦甘苦甘的很退火。
  tags: [summer]
- id: se-summerlife-51
  text: 夏夜到山上露營，躺在帳篷外抬頭，滿天星星比城裡多了好幾倍。
  tags: [summer]
- id: se-summerlife-52
  text: 夏至這天白晝最長，忙了一整天回到家，天邊竟還留著一抹餘光。
  tags: [summer]
- id: se-summerlife-53
  text: 海邊玩回來肩膀曬得紅通通，過幾天開始脫皮，摸起來刺刺的。
  tags: [summer]
- id: se-summerlife-54
  text: 雨後的傍晚蜻蜓成群低飛，繞著水窪一圈圈，看著看著就入了神。
  tags: [summer]
- id: se-summerlife-55
  text: 削好的芒果青撒上一點梅粉，酸得瞇起眼卻停不下嘴。
  tags: [summer]
- id: se-summerlife-56
  text: 中元這天騎樓下擺滿供品，一整條街都是拜拜的香火味。
  tags: [summer]
- id: se-summerlife-57
  text: 冷氣壞掉的午後，只能拿把扇子慢慢搧，搧著搧著也就習慣了熱。
  tags: [summer]
- id: se-summerlife-58
  text: 燙好的毛豆撒點鹽，坐在電視前一顆顆剝，不知不覺整盤就空了。
  tags: [summer]
- id: se-summerlife-59
  text: 樹幹上留著一個個透明的蟬蛻，小時候總愛撿來收在鉛筆盒裡。
  tags: [summer]
- id: se-summerlife-60
  text: 帶著小孩到戲水池玩水槍，濕成一片也笑得合不攏嘴。
  tags: [summer]
