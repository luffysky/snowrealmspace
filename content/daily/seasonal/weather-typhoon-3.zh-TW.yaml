# 季節/天氣 · 颱風天（第三批）。繁體中文，每一則獨一無二。
- id: se-typhoon-41
  text: 泡麵和乾糧多囤幾包，店家歇業時也不擔心。
  tags: [typhoon]
- id: se-typhoon-42
  text: 電梯可能停用，住高樓的先想好走樓梯的路線。
  tags: [typhoon]
- id: se-typhoon-43
  text: 落地窗拉上厚窗簾，萬一玻璃出狀況也多一層防護。
  tags: [typhoon]
- id: se-typhoon-44
  text: 手機切到省電模式，訊號不穩時電量還能撐久一點。
  tags: [typhoon]
- id: se-typhoon-45
  text: 晚餐提前煮好放著，停電了也有現成的熱飯菜。
  tags: [typhoon]
- id: se-typhoon-46
  text: 網路隨時可能斷，先把想看的影片下載存起來。
  tags: [typhoon]
- id: se-typhoon-47
  text: 沙包或裝滿水的袋子擋在門口，低樓層防積水最實在。
  tags: [typhoon]
- id: se-typhoon-48
  text: 車庫的鐵捲門檢查一下，卡卡的先修好免得關不緊。
  tags: [typhoon]
- id: se-typhoon-49
  text: 樓上樓下鄰居互相招呼一聲，這種天彼此照應最安心。
  tags: [typhoon]
- id: se-typhoon-50
  text: 證件和重要文件收進防水袋，淹水了也不怕泡壞。
  tags: [typhoon]
- id: se-typhoon-51
  text: 廚房的瓦斯開關睡前確認關好，安全擺在最前頭。
  tags: [typhoon]
- id: se-typhoon-52
  text: 玻璃上若有細小裂痕，貼片膠帶補強會牢靠許多。
  tags: [typhoon]
- id: se-typhoon-53
  text: 頂樓的鐵皮和遮雨棚固定牢，強風一來才不會被掀。
  tags: [typhoon]
- id: se-typhoon-54
  text: 家裡的長輩和孩子先安撫好，聽著風聲也不會慌。
  tags: [typhoon]
- id: se-typhoon-55
  text: 住在低窪地區的話，警戒一發布就往高處避比較妥當。
  tags: [typhoon]
- id: se-typhoon-56
  text: 拖把和水桶擺在門邊，雨水滲進來能立刻處理。
  tags: [typhoon]
- id: se-typhoon-57
  text: 找出手搖收音機備著，沒電沒網也聽得到最新消息。
  tags: [typhoon]
- id: se-typhoon-58
  text: 提款機可能暫停，身上留些現金以備不時之需。
  tags: [typhoon]
- id: se-typhoon-59
  text: 冷氣的排水管檢查通暢，倒灌的雨水才不會積在室內。
  tags: [typhoon]
- id: se-typhoon-60
  text: 風雨歇下來後先開窗透透氣，屋裡的濕悶散得快些。
  tags: [typhoon]
