# 季節 · 春天生活。繁體中文，每一則獨一無二。
- id: se-springlife-01
  text: 巷口那排櫻花不知不覺開了，粉粉的一整片，路過都覺得心情變軟。
  tags: [spring]
- id: se-springlife-02
  text: 厚外套終於可以收進衣櫃深處，換上薄襯衫的感覺格外輕盈。
  tags: [spring]
- id: se-springlife-03
  text: 早晨的風還帶著一點涼，但已經聞得到草地被曬暖的味道。
  tags: [spring]
- id: se-springlife-04
  text: 陽台上那盆冬天看似枯掉的植物，竟然又冒出了嫩綠的新芽。
  tags: [spring]
- id: se-springlife-05
  text: 週末找個有草皮的公園鋪張墊子，帶點小點心躺著曬太陽最舒服。
  tags: [spring]
- id: se-springlife-06
  text: 這種微暖不熱的天氣，散步走再遠都不會覺得累。
  tags: [spring]
- id: se-springlife-07
  text: 春雨下起來細細綿綿的，撐傘走在路上有種安靜的浪漫。
  tags: [spring]
- id: se-springlife-08
  text: 鼻子又開始對花粉過敏了，衛生紙備多一點會安心些。
  tags: [spring]
- id: se-springlife-09
  text: 田邊的油菜花整片黃澄澄的，遠遠看像鋪了一層陽光。
  tags: [spring]
- id: se-springlife-10
  text: 雨後的泥土香混著青草味，是只有這個季節才聞得到的氣息。
  tags: [spring]
- id: se-springlife-11
  text: 白天悄悄變長了，下班走出門還能看見一點天光，感覺賺到。
  tags: [spring]
- id: se-springlife-12
  text: 陽光透過剛長出的新葉，在地上灑下一片斑斑點點的光影。
  tags: [spring]
- id: se-springlife-13
  text: 冷氣熱氣都不必開的日子，窗戶打開讓風自然流進屋裡就好。
  tags: [spring]
- id: se-springlife-14
  text: 燕子回來在屋簷下築巢了，整個屋子好像也熱鬧了起來。
  tags: [spring]
- id: se-springlife-15
  text: 市場裡開始出現青翠的春筍和豆苗，一看就知道季節換了。
  tags: [spring]
- id: se-springlife-16
  text: 換季時衣櫃翻出去年的薄長袖，摸起來竟有點懷念的感覺。
  tags: [spring]
- id: se-springlife-17
  text: 午後在窗邊泡杯茶，看樓下的花一天比一天開得多，很療癒。
  tags: [spring]
- id: se-springlife-18
  text: 山上的桐花落下來鋪滿小徑，像下了一場溫柔的白色雪。
  tags: [spring]
- id: se-springlife-19
  text: 蜜蜂和蝴蝶又忙碌起來，在花叢間飛來飛去很有生氣。
  tags: [spring]
- id: se-springlife-20
  text: 春天的傍晚溫度剛剛好，坐在戶外吃飯不冷不熱，格外自在。
  tags: [spring]
