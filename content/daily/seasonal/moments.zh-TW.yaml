# 季節補充 · 每季各 5，日常的季節感受。繁體中文，每一則獨一無二。
- id: se-spring-13
  text: 春天到了，換件輕一點的外套吧。
  tags: [spring]
- id: se-spring-14
  text: 樹開始冒新芽，你也慢慢舒展。
  tags: [spring]
- id: se-spring-15
  text: 春雨綿綿，適合待在室內做點喜歡的事。
  tags: [spring]
- id: se-spring-16
  text: 花開了，路過時記得多看一眼。
  tags: [spring]
- id: se-spring-17
  text: 春天的風是暖的，開窗透透氣。
  tags: [spring]
- id: se-summer-13
  text: 夏天了，記得多補一點水。
  tags: [summer]
- id: se-summer-14
  text: 太陽很烈，出門帶把傘遮一下。
  tags: [summer]
- id: se-summer-15
  text: 傍晚涼一點，適合出去走走。
  tags: [summer]
- id: se-summer-16
  text: 夏夜的風，值得停下來吹一會兒。
  tags: [summer]
- id: se-summer-17
  text: 天熱，替自己準備一杯冰的。
  tags: [summer]
- id: se-autumn-13
  text: 秋天了，早晚會涼，多帶件薄外套。
  tags: [autumn]
- id: se-autumn-14
  text: 落葉開始多了，走路踩起來沙沙的。
  tags: [autumn]
- id: se-autumn-15
  text: 秋高氣爽，很適合抬頭看天。
  tags: [autumn]
- id: se-autumn-16
  text: 天黑得早了，別忘了給自己開盞燈。
  tags: [autumn]
- id: se-autumn-17
  text: 秋天的午後，很適合泡杯熱茶。
  tags: [autumn]
- id: se-winter-13
  text: 冬天了，把圍巾找出來吧。
  tags: [winter]
- id: se-winter-14
  text: 天冷，出門前搓搓手暖一下。
  tags: [winter]
- id: se-winter-15
  text: 冬夜長，早點鑽進被窩也很好。
  tags: [winter]
- id: se-winter-16
  text: 手腳冰的時候，喝口熱的最療癒。
  tags: [winter]
- id: se-winter-17
  text: 冬陽難得，曬到就多站一會兒。
  tags: [winter]
