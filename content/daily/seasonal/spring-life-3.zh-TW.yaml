# 季節 · 春天生活（第三批）。繁體中文，每一則獨一無二。
- id: se-springlife-41
  text: 巷弄裡的桃花和李花接著櫻花開，一波接著一波，看再久都不膩。
  tags: [spring]
- id: se-springlife-42
  text: 苦楝樹掛滿淡紫色的細碎小花，風一過就飄來若有似無的清香。
  tags: [spring]
- id: se-springlife-43
  text: 樹上的桑葚由紅轉黑，摘一把塞進嘴裡，指尖染成紫色也不在意。
  tags: [spring]
- id: se-springlife-44
  text: 回南天一到，牆面和地板都滲出一層水珠，抹布擦了又濕擦不完。
  tags: [spring]
- id: se-springlife-45
  text: 這時節洗好的衣服掛了兩天還帶著潮氣，只好搬出除濕機來幫忙。
  tags: [spring]
- id: se-springlife-46
  text: 趁天氣好把厚棉被和窗簾全拆下來洗，屋子頓時清爽了不少。
  tags: [spring]
- id: se-springlife-47
  text: 假日的花市擺滿各色盆栽，挑一盆帶回家，陽台又多了幾分顏色。
  tags: [spring]
- id: se-springlife-48
  text: 田溝裡一群小蝌蚪甩著尾巴游來游去，蹲著看上半天都不膩。
  tags: [spring]
- id: se-springlife-49
  text: 天剛亮，窗外的鳥就啾啾叫個不停，比鬧鐘還要準時。
  tags: [spring]
- id: se-springlife-50
  text: 收起悶了一整個冬天的靴子，換上輕便的鞋，走起路來腳都輕了。
  tags: [spring]
- id: se-springlife-51
  text: 到郊外的草莓園彎腰採果，一顆顆紅得剛好，邊採邊吃最開心。
  tags: [spring]
- id: se-springlife-52
  text: 市場擺出金黃的枇杷，剝了皮一口一顆，酸酸甜甜的很有季節感。
  tags: [spring]
- id: se-springlife-53
  text: 清明帶著鮮花和水果上山掃墓，順手替墓邊拔了拔雜草。
  tags: [spring]
- id: se-springlife-54
  text: 校園的流蘇開成一樹雪白，遠看像積了層薄雪，難怪叫四月雪。
  tags: [spring]
- id: se-springlife-55
  text: 山坡上的相思樹綴滿細碎的黃花，一整片看著暖洋洋的。
  tags: [spring]
- id: se-springlife-56
  text: 山上的茶園一畦畦冒著新芽，採茶的人指尖飛快地掐著嫩葉。
  tags: [spring]
- id: se-springlife-57
  text: 天氣舒服，早餐買了就坐在店外慢慢吃，看街上的人來來往往。
  tags: [spring]
- id: se-springlife-58
  text: 沿著河濱騎車，微風不冷不熱，一路踩下去心情特別開闊。
  tags: [spring]
- id: se-springlife-59
  text: 公園的紫藤爬滿花架，一串串垂下來，走在底下像穿過紫色的簾。
  tags: [spring]
- id: se-springlife-60
  text: 早晚溫差大，一個不留神就著了涼，圍巾還是先別急著收起來。
  tags: [spring]
