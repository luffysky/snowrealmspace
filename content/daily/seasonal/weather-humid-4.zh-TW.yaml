# 季節/天氣 · 潮濕（第四批）。繁體中文，每一則獨一無二。
- id: se-humid-61
  text: 巧克力受了潮表面會泛出一層白霜，收進密封盒擺陰涼處它就穩定了。
  tags: [humid]
- id: se-humid-62
  text: 開封的洋芋片沒夾緊隔夜就回軟，封口夾夾好脆度能多留幾天。
  tags: [humid]
- id: se-humid-63
  text: 抽屜裡的面紙悶久了會軟塌，換個有蓋的盒子收著抽起來才順手。
  tags: [humid]
- id: se-humid-64
  text: 一疊郵票這種天最容易黏在一起，夾張蠟紙隔開它們就分得開。
  tags: [humid]
- id: se-humid-65
  text: 護照內頁受潮容易黏頁，收進夾鏈袋擺在乾燥的抽屜比較安心。
  tags: [humid]
- id: se-humid-66
  text: 皮夾悶在包裡容易起霉斑，睡前拿出來攤在通風處讓它透透氣。
  tags: [humid]
- id: se-humid-67
  text: 手錶的皮錶帶最怕汗和濕氣，睡前解下來擦乾能撐久一些。
  tags: [humid]
- id: se-humid-68
  text: 遙控器裡的電池受潮容易在接點結出白鏽，久沒用就先取出來收著。
  tags: [humid]
- id: se-humid-69
  text: 冰箱門的膠條縫裡容易藏濕氣，隔陣子拿乾布抹過就不會冒黑點。
  tags: [humid]
- id: se-humid-70
  text: 洗衣機的橡膠圈洗完別急著關門，敞著散散氣才不會悶出霉味。
  tags: [humid]
- id: se-humid-71
  text: 冷氣的濾網積了灰又受潮容易發霉，拆下來沖一沖晾乾再裝回去。
  tags: [humid]
- id: se-humid-72
  text: 竹砧板用完立起來晾，平放著悶著這種天最容易長出霉點。
  tags: [humid]
- id: se-humid-73
  text: 藤編的椅子悶久了會有股潮味，搬到通風的地方吹吹就清爽了。
  tags: [humid]
- id: se-humid-74
  text: 毛衣收櫃子前確認完全乾透，帶著一點濕氣悶著最容易招蟲。
  tags: [humid]
- id: se-humid-75
  text: 蠟燭擺在潮濕的角落表面會冒出小水珠，收進盒子裡點起來更順。
  tags: [humid]
- id: se-humid-76
  text: 肥皂泡在濕答答的皂盤上化得特別快，墊個瀝水的架子它能省著用。
  tags: [humid]
- id: se-humid-77
  text: 蚊香受了潮就不容易點著，收進密封袋擺在乾燥的地方存著。
  tags: [humid]
- id: se-humid-78
  text: 木炭悶潮了升火會又煙又難燃，用前先攤在乾處放一陣子。
  tags: [humid]
- id: se-humid-79
  text: 茶葉一受潮香氣就跑掉了，開封後夾緊收進不透光的罐子。
  tags: [humid]
- id: se-humid-80
  text: 曬乾的香菇怕返潮變軟，塞包乾燥劑再密封香氣能鎖得久些。
  tags: [humid]
