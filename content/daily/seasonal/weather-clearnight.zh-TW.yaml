# 季節/天氣 · 晴朗夜空。繁體中文，每一則獨一無二。
- id: se-clearnight-01
  text: 今晚天很清，抬頭找得到幾顆星。
  tags: [clearnight]
- id: se-clearnight-02
  text: 月亮掛得高高的，把窗邊照得亮亮的。
  tags: [clearnight]
- id: se-clearnight-03
  text: 夜裡的風有點涼，記得替自己披件外套。
  tags: [clearnight]
- id: se-clearnight-04
  text: 這樣乾淨的夜空，很適合安安靜靜待著。
  tags: [clearnight]
- id: se-clearnight-05
  text: 城市的燈熄了一些，星光就冒了出來。
  tags: [clearnight]
- id: se-clearnight-06
  text: 沒有雲的晚上，連呼吸都覺得慢了下來。
  tags: [clearnight]
- id: se-clearnight-07
  text: 一輪明月照著回家的路，走起來特別安心。
  tags: [clearnight]
- id: se-clearnight-08
  text: 深藍的天空底下，世界好像調小了音量。
  tags: [clearnight]
- id: se-clearnight-09
  text: 抬頭那一瞬間，滿天的星把煩惱都稀釋了。
  tags: [clearnight]
- id: se-clearnight-10
  text: 夜色很沉，卻沉得溫柔，像蓋了一層薄被。
  tags: [clearnight]
- id: se-clearnight-11
  text: 遠處的星星一閃一閃，陪著晚睡的人。
  tags: [clearnight]
- id: se-clearnight-12
  text: 這種通透的夜，最適合放空看天，什麼都不想。
  tags: [clearnight]
- id: se-clearnight-13
  text: 月光落在地板上，把房間鋪成淡淡的銀色。
  tags: [clearnight]
- id: se-clearnight-14
  text: 空氣清涼安靜，星子在頭頂靜靜守著夜。
  tags: [clearnight]
- id: se-clearnight-15
  text: 天邊那顆最亮的，看久了會有種被陪伴的感覺。
  tags: [clearnight]
- id: se-clearnight-16
  text: 涼涼的夜色裡，泡杯熱的暖手最舒服。
  tags: [clearnight]
- id: se-clearnight-17
  text: 星空這麼清楚的晚上，一年也遇不到幾次。
  tags: [clearnight]
- id: se-clearnight-18
  text: 窗外一片寧靜，只剩月亮還醒著。
  tags: [clearnight]
- id: se-clearnight-19
  text: 夜深了，星光把天空點成一張安靜的地圖。
  tags: [clearnight]
- id: se-clearnight-20
  text: 這麼美的夜晚，值得多站一會兒好好看看。
  tags: [clearnight]
