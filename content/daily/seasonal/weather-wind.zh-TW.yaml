# 季節/天氣 · 有風的天。繁體中文，每一則獨一無二。
- id: se-wind-01
  text: 風有點大，出門記得把外套拉好。
  tags: [windy]
- id: se-wind-02
  text: 帽子今天最好戴緊一些，免得被風掀走。
  tags: [windy]
- id: se-wind-03
  text: 風吹過樹梢的聲音，聽起來意外地舒服。
  tags: [windy]
- id: se-wind-04
  text: 空氣裡帶著一點涼意，加件薄外套剛剛好。
  tags: [windy]
- id: se-wind-05
  text: 風大的日子，晾出去的衣服乾得特別快。
  tags: [windy]
- id: se-wind-06
  text: 一陣風把雲吹得很快，天空看起來活了起來。
  tags: [windy]
- id: se-wind-07
  text: 走在風裡，頭髮亂了也別有一番自在。
  tags: [windy]
- id: se-wind-08
  text: 風把街上的味道都換了新，深呼吸格外清爽。
  tags: [windy]
- id: se-wind-09
  text: 這種天氣騎車要留意，握穩一點比較安心。
  tags: [windy]
- id: se-wind-10
  text: 窗戶留條縫，讓風輕輕流過屋子也很好。
  tags: [windy]
- id: se-wind-11
  text: 風把落葉捲成小圈圈，看著看著就笑了。
  tags: [windy]
- id: se-wind-12
  text: 涼風徐徐的午後，最適合到外面走一走。
  tags: [windy]
- id: se-wind-13
  text: 風聲呼呼地響，屋裡待著反而更覺得安穩。
  tags: [windy]
- id: se-wind-14
  text: 領口容易灌風，圍條輕薄的圍巾就暖多了。
  tags: [windy]
- id: se-wind-15
  text: 起風的傍晚，天空的雲跑得比誰都快。
  tags: [windy]
- id: se-wind-16
  text: 風把體感壓低了些，出門多帶一件不吃虧。
  tags: [windy]
- id: se-wind-17
  text: 迎著風走路，腳步好像也被推得輕快。
  tags: [windy]
- id: se-wind-18
  text: 這麼大的風，撐傘反而累，穿件連帽的比較好。
  tags: [windy]
- id: se-wind-19
  text: 風把窗簾吹得鼓鼓的，屋裡多了點生氣。
  tags: [windy]
- id: se-wind-20
  text: 風一直吹，皮膚容易乾，擦點乳液會舒服些。
  tags: [windy]
