# 季節/天氣 · 寒冷。繁體中文，每一則獨一無二。
- id: se-cold-01
  text: 今天很冷，出門前多披一件會安心許多。
  tags: [cold]
- id: se-cold-02
  text: 圍巾繞緊一點，脖子暖了整個人都暖。
  tags: [cold]
- id: se-cold-03
  text: 手腳容易冰，泡杯熱飲捧在手裡最舒服。
  tags: [cold]
- id: se-cold-04
  text: 這種天氣手套別忘了戴，指尖才不會凍。
  tags: [cold]
- id: se-cold-05
  text: 被窩裡最溫暖，離開之前多賴一會兒也無妨。
  tags: [cold]
- id: se-cold-06
  text: 冷風一吹，一碗熱湯下肚就從裡暖到外。
  tags: [cold]
- id: se-cold-07
  text: 氣溫低的時候，洋蔥式穿法最好調整。
  tags: [cold]
- id: se-cold-08
  text: 早晚特別凍，出門記得把外套的釦子扣好。
  tags: [cold]
- id: se-cold-09
  text: 這麼冷的天，握著一杯熱茶就覺得幸福。
  tags: [cold]
- id: se-cold-10
  text: 寒意重的日子，厚襪子能讓腳暖上一整天。
  tags: [cold]
- id: se-cold-11
  text: 空氣冷得清脆，呼出來的氣都成了白霧。
  tags: [cold]
- id: se-cold-12
  text: 手邊放個暖暖包，冰涼的手指立刻回溫。
  tags: [cold]
- id: se-cold-13
  text: 冷歸冷，蓋著毛毯窩在沙發上格外踏實。
  tags: [cold]
- id: se-cold-14
  text: 這種低溫容易口乾，記得多喝點溫開水。
  tags: [cold]
- id: se-cold-15
  text: 帽子加口罩，臉頰就不會被寒風刮得發疼。
  tags: [cold]
- id: se-cold-16
  text: 天冷時多喝溫水，身子暖了心情也跟著好。
  tags: [cold]
- id: se-cold-17
  text: 出門在外，暖手的一杯咖啡就是小小慰藉。
  tags: [cold]
- id: se-cold-18
  text: 寒流來的時候，熱水澡是一天最療癒的事。
  tags: [cold]
- id: se-cold-19
  text: 這麼凍的天，室內開點暖氣待著就好。
  tags: [cold]
- id: se-cold-20
  text: 冷風裡走一趟，回到暖屋裡那口氣特別安穩。
  tags: [cold]
