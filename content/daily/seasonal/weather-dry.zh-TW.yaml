# 季節/天氣 · 乾燥。繁體中文，每一則獨一無二。
- id: se-dry-01
  text: 空氣有點乾，記得多喝幾口水補補水分。
  tags: [dry]
- id: se-dry-02
  text: 這種天氣嘴唇容易乾裂，擦點護唇膏會舒服很多。
  tags: [dry]
- id: se-dry-03
  text: 皮膚繃繃的，洗完手抹點乳液鎖住水分。
  tags: [dry]
- id: se-dry-04
  text: 乾燥的日子喉嚨也跟著乾，一杯溫水能潤一潤。
  tags: [dry]
- id: se-dry-05
  text: 空氣濕度低，房裡放盆水或開加濕器都會舒服些。
  tags: [dry]
- id: se-dry-06
  text: 手指偶爾被靜電電一下有點討厭，摸金屬前先碰碰牆吧。
  tags: [dry]
- id: se-dry-07
  text: 這樣的乾天，臉部保養別忘了多一層保濕。
  tags: [dry]
- id: se-dry-08
  text: 乾冷讓人容易缺水，隨手放杯水在旁邊提醒自己啜飲。
  tags: [dry]
- id: se-dry-09
  text: 眼睛在乾燥的空氣裡容易發澀，適時眨眨眼、望向遠方休息。
  tags: [dry]
- id: se-dry-10
  text: 頭髮起靜電飄飛的日子，抹點護髮或帶條小梳子會順手。
  tags: [dry]
- id: se-dry-11
  text: 鼻腔在乾空氣裡有點乾癢，補點水氣會緩和許多。
  tags: [dry]
- id: se-dry-12
  text: 乾燥容易讓皮膚脫屑，沐浴後趁著微濕抹上身體乳最好吸收。
  tags: [dry]
- id: se-dry-13
  text: 這種缺水的天，泡杯熱茶暖手又潤喉。
  tags: [dry]
- id: se-dry-14
  text: 手肘膝蓋這些地方特別容易乾，多照顧一下這些小角落。
  tags: [dry]
- id: se-dry-15
  text: 空氣乾得連紙張都翹起來，替自己也補補水分。
  tags: [dry]
- id: se-dry-16
  text: 乾燥讓喉頭有點卡，含顆潤喉糖或喝口水都能舒緩。
  tags: [dry]
- id: se-dry-17
  text: 手洗多了容易乾裂，隨身帶條護手霜方便隨時補。
  tags: [dry]
- id: se-dry-18
  text: 這乾爽的天氣雖然舒服，皮膚的保濕還是別偷懶。
  tags: [dry]
- id: se-dry-19
  text: 脫毛衣時劈啪的靜電有點嚇人，衣物噴點抗靜電會好些。
  tags: [dry]
- id: se-dry-20
  text: 乾燥的夜裡嘴巴容易乾醒，睡前潤潤唇、床邊備杯水。
  tags: [dry]
