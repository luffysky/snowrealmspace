# 季節/天氣 · 雨天（第三批）。繁體中文，每一則獨一無二。
- id: se-rain-41
  text: 洗好的衣服晾在室內，開一台電風扇對著吹，乾得會順一些。
  tags: [rainy]
- id: se-rain-42
  text: 泥土被雨打濕後散出的那股氣味，是這個季節獨有的味道。
  tags: [rainy]
- id: se-rain-43
  text: 步道上爬出了幾隻蝸牛，走路時放輕腳步，別踩到牠們。
  tags: [rainy]
- id: se-rain-44
  text: 從雨裡走進室內，眼鏡一下就起了霧，用布擦一擦視野就清楚了。
  tags: [rainy]
- id: se-rain-45
  text: 木門受潮會微微膨脹卡住，輕輕推一下它就開了。
  tags: [rainy]
- id: se-rain-46
  text: 浴室的鏡子蒙上一層白霧，開個抽風機一會兒就散去了。
  tags: [rainy]
- id: se-rain-47
  text: 餅乾和零食收進密封罐，濕氣重的日子才不會回軟走味。
  tags: [rainy]
- id: se-rain-48
  text: 雨停之後天邊掛起一道彩虹，抬頭望見的那一眼是意外的驚喜。
  tags: [rainy]
- id: se-rain-49
  text: 煮一杯薑茶捧在手心，暖意會從喉頭一路熱到胃裡。
  tags: [rainy]
- id: se-rain-50
  text: 這樣的天氣穿著睡衣賴在家，一整天的慵懶都名正言順了。
  tags: [rainy]
- id: se-rain-51
  text: 帶狗散步回來，先把牠的腳掌擦乾淨，地板就不會留下一串泥印。
  tags: [rainy]
- id: se-rain-52
  text: 光線灰暗的午後點上一支蠟燭，小小的火光就把角落烘得溫柔。
  tags: [rainy]
- id: se-rain-53
  text: 圍著一鍋熱騰騰的火鍋，窗外再冷的雨都變得無關緊要。
  tags: [rainy]
- id: se-rain-54
  text: 網購的包裹在雨天常會晚一兩天到，多給它一點耐心就好。
  tags: [rainy]
- id: se-rain-55
  text: 老屋的鐵皮屋簷被雨敲得劈啪作響，是這種天氣限定的一場合奏。
  tags: [rainy]
- id: se-rain-56
  text: 找出擱了很久的毛線和鉤針，趁雨天窩在沙發慢慢織上幾行。
  tags: [rainy]
- id: se-rain-57
  text: 兩手都提著東西時，套上一件雨衣會比撐傘俐落得多。
  tags: [rainy]
- id: se-rain-58
  text: 順手清一清陽台排水孔的落葉，水流順了才不會積成一灘。
  tags: [rainy]
- id: se-rain-59
  text: 夜裡的雨帶著涼意，床尾多備一條被子，半夜就不會冷醒。
  tags: [rainy]
- id: se-rain-60
  text: 烤箱裡的麵包正一點點膨脹，滿屋香氣把陰雨天都烘得暖烘烘。
  tags: [rainy]
