# 季節/天氣 · 涼爽舒適。繁體中文，每一則獨一無二。
- id: se-cool-01
  text: 今天不冷不熱，是很舒服的溫度。
  tags: [cool]
- id: se-cool-02
  text: 微風輕輕吹過，走在外面格外自在。
  tags: [cool]
- id: se-cool-03
  text: 這種宜人的天氣，很適合出門散散步。
  tags: [cool]
- id: se-cool-04
  text: 涼爽的空氣讓人精神都好了起來。
  tags: [cool]
- id: se-cool-05
  text: 秋高氣爽的一天，抬頭就是清朗的藍天。
  tags: [cool]
- id: se-cool-06
  text: 溫度剛剛好，不穿外套也不覺得冷。
  tags: [cool]
- id: se-cool-07
  text: 傍晚的風涼涼的，坐在窗邊很愜意。
  tags: [cool]
- id: se-cool-08
  text: 這麼舒適的氣候，夜裡想必也好眠。
  tags: [cool]
- id: se-cool-09
  text: 陽光溫和，微風徐徐，是難得的好天氣。
  tags: [cool]
- id: se-cool-10
  text: 空氣清爽乾淨，深吸一口都覺得放鬆。
  tags: [cool]
- id: se-cool-11
  text: 這種天氣不黏不悶，做什麼都輕鬆。
  tags: [cool]
- id: se-cool-12
  text: 涼風拂面，連腳步都不自覺輕快了起來。
  tags: [cool]
- id: se-cool-13
  text: 天氣涼爽，晾出去的衣服想必乾得很快。
  tags: [cool]
- id: se-cool-14
  text: 早晚微涼，中午暖暖的，一整天都很舒服。
  tags: [cool]
- id: se-cool-15
  text: 這樣的好天氣，坐在戶外喝杯茶最是自在。
  tags: [cool]
- id: se-cool-16
  text: 涼爽的午後，光線柔和得讓人想小睡片刻。
  tags: [cool]
- id: se-cool-17
  text: 沒有暑氣也沒有寒意，剛好的一天。
  tags: [cool]
- id: se-cool-18
  text: 樹葉在涼風裡沙沙作響，聽著就放鬆。
  tags: [cool]
- id: se-cool-19
  text: 這種舒服的溫度，出門走走再適合不過。
  tags: [cool]
- id: se-cool-20
  text: 天氣清爽宜人，晚上蓋著薄被剛好入睡。
  tags: [cool]
