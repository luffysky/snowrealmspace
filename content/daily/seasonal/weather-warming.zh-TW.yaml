# 季節/天氣 · 回暖。繁體中文，每一則獨一無二。
- id: se-warming-01
  text: 天氣回暖了，出門的外套可以少一件。
  tags: [warming]
- id: se-warming-02
  text: 空氣裡多了一點暖意，走在路上舒服許多。
  tags: [warming]
- id: se-warming-03
  text: 陽光變得柔軟溫熱，曬起來讓人整個人放鬆。
  tags: [warming]
- id: se-warming-04
  text: 這幾天氣溫悄悄往上爬，身體也跟著舒展開來。
  tags: [warming]
- id: se-warming-05
  text: 早晨不再那麼冷，被窩外的世界也變得友善了。
  tags: [warming]
- id: se-warming-06
  text: 厚外套可以先收起來，換上輕薄一點的衣服剛剛好。
  tags: [warming]
- id: se-warming-07
  text: 風吹過來是溫的，帶著一絲春天靠近的味道。
  tags: [warming]
- id: se-warming-08
  text: 溫度回升的日子，散步的腳步都輕快了不少。
  tags: [warming]
- id: se-warming-09
  text: 手腳終於不再冰冷，暖意一點一點回到指尖。
  tags: [warming]
- id: se-warming-10
  text: 午後的暖陽正好，坐在窗邊就覺得心情明亮。
  tags: [warming]
- id: se-warming-11
  text: 冷意漸漸退場，取而代之的是柔和的溫度。
  tags: [warming]
- id: se-warming-12
  text: 樹梢冒出新綠，季節正朝著溫暖的方向走去。
  tags: [warming]
- id: se-warming-13
  text: 回暖的天氣讓人想把窗戶打開，透進一室清新。
  tags: [warming]
- id: se-warming-14
  text: 陽光曬在肩上暖暖的，連呼吸都變得舒服。
  tags: [warming]
- id: se-warming-15
  text: 氣溫慢慢升高，圍巾與手套可以先放進抽屜休息。
  tags: [warming]
- id: se-warming-16
  text: 白天愈來愈長，暖和的午後多了幾分慵懶。
  tags: [warming]
- id: se-warming-17
  text: 春天的氣息越來越濃，空氣聞起來也柔和了。
  tags: [warming]
- id: se-warming-18
  text: 這樣暖洋洋的天，最適合到戶外走走透透氣。
  tags: [warming]
- id: se-warming-19
  text: 寒氣散去之後，整座城市看起來都亮了起來。
  tags: [warming]
- id: se-warming-20
  text: 溫暖的天氣讓人打起精神，一整天都輕盈自在。
  tags: [warming]
