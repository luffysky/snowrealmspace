# 季節/天氣 · 雷雨。繁體中文，每一則獨一無二。
- id: se-thunder-01
  text: 打雷了，電器記得拔一下插頭。
  tags: [thunder]
- id: se-thunder-02
  text: 午後的雷陣雨來得又急又猛，出門前記得看一眼天色。
  tags: [thunder]
- id: se-thunder-03
  text: 雷聲聽起來很近，待在室內會安心一些。
  tags: [thunder]
- id: se-thunder-04
  text: 這種雨通常來得快去得快，躲一下就過了。
  tags: [thunder]
- id: se-thunder-05
  text: 閃電劃過的時候，離窗戶遠一點比較好。
  tags: [thunder]
- id: se-thunder-06
  text: 外頭雷聲隆隆，泡杯熱的窩著剛剛好。
  tags: [thunder]
- id: se-thunder-07
  text: 落雷時盡量別用有線的電話或充電中的手機。
  tags: [thunder]
- id: se-thunder-08
  text: 天空突然暗下來，八成是雷雨要報到了。
  tags: [thunder]
- id: se-thunder-09
  text: 被雨困住的時候，找個屋簷慢慢等也是一種休息。
  tags: [thunder]
- id: se-thunder-10
  text: 雷雨天路面很滑，走路騎車都放慢一點。
  tags: [thunder]
- id: se-thunder-11
  text: 剛剛那道閃電好亮，接著的雷聲果然轟隆隆。
  tags: [thunder]
- id: se-thunder-12
  text: 這場雷雨大概傍晚前就會停，不用太擔心。
  tags: [thunder]
- id: se-thunder-13
  text: 大雨打在窗上的聲音，其實聽著挺讓人放鬆。
  tags: [thunder]
- id: se-thunder-14
  text: 打雷的時候，家裡的貓貓狗狗可能會有點緊張，陪陪牠們。
  tags: [thunder]
- id: se-thunder-15
  text: 雷雨前那股悶熱，往往是暴雨的前奏。
  tags: [thunder]
- id: se-thunder-16
  text: 傘要記得帶，午後這雨說下就下。
  tags: [thunder]
- id: se-thunder-17
  text: 雷電交加的時候，戶外的活動先緩一緩比較穩妥。
  tags: [thunder]
- id: se-thunder-18
  text: 雨停之後空氣會變得清新，那是雷雨留下的好處。
  tags: [thunder]
- id: se-thunder-19
  text: 遠方傳來悶悶的雷聲，衣服先收進屋裡吧。
  tags: [thunder]
- id: se-thunder-20
  text: 這雨勢又大又短，等它一陣子自然就晴了。
  tags: [thunder]
