# 季節/天氣 · 乾燥（第四批）。繁體中文，每一則獨一無二。
- id: se-dry-61
  text: 靜電讓裙子直往腿上貼，抹點乳液或噴點水霧，走起路來就服貼多了。
  tags: [dry]
- id: se-dry-62
  text: 乾空氣裡擤鼻子竟擤出了血絲，在鼻腔口抹點凡士林，能擋一擋那股乾。
  tags: [dry]
- id: se-dry-63
  text: 燉一鍋冰糖白木耳，滑潤的膠質喝下去，乾了一整天的喉嚨總算被安撫。
  tags: [dry]
- id: se-dry-64
  text: 水梨正甜又多汁，切一盤啃起來清脆潤口，乾季裡吃它最是舒服。
  tags: [dry]
- id: se-dry-65
  text: 冰糖燉梨熱呼呼端上桌，梨香混著甜氣，一口滑下喉頭都跟著滋潤了。
  tags: [dry]
- id: se-dry-66
  text: 桌上擺瓶保濕噴霧，臉一繃就往臉上噴兩下，霧氣落下皮膚立刻鬆開。
  tags: [dry]
- id: se-dry-67
  text: 眼睛乾澀到有點刺，點兩滴人工淚液，眨一眨那份澀感就緩了下來。
  tags: [dry]
- id: se-dry-68
  text: 半夜掀被子劈啪冒出小火花，被單積了靜電，摸黑愣了一下才會過意來。
  tags: [dry]
- id: se-dry-69
  text: 嘴唇乾到起皮，別動手去撕，厚厚抹一層凡士林讓它自己慢慢好。
  tags: [dry]
- id: se-dry-70
  text: 多吃水梨蓮藕這類水潤的蔬果，從裡頭補水，比光擦外頭更頂用。
  tags: [dry]
- id: se-dry-71
  text: 往窗簾和地板噴些水霧，水氣慢慢蒸開，滿室的乾燥就淡了幾分。
  tags: [dry]
- id: se-dry-72
  text: 暖爐旁烤幾顆橘子，皮烤得微焦，剝開熱熱地吃，老人家說這樣不上火。
  tags: [dry]
- id: se-dry-73
  text: 鼻腔乾得早上起來結了痂，用棉花棒沾點生理食鹽水輕輕潤開它。
  tags: [dry]
- id: se-dry-74
  text: 房裡養幾盆闊葉綠植，葉片蒸散的水氣多少替乾空氣添了點潤。
  tags: [dry]
- id: se-dry-75
  text: 手指關節乾裂得有點刺，抹厚一層凡士林再包上OK繃，養它一夜。
  tags: [dry]
- id: se-dry-76
  text: 調色盤上的水彩乾得飛快，畫沒兩筆就得再沾一次水，一下就結了層皮。
  tags: [dry]
- id: se-dry-77
  text: 保鮮膜在乾天靜電纏成一團，撕的時候放慢些、隔開一點距離就好扯開。
  tags: [dry]
- id: se-dry-78
  text: 木門在乾季微微縮了，關上留出一條細縫，塞條門擋把灌進來的風擋住。
  tags: [dry]
- id: se-dry-79
  text: 護唇膏抹了還忍不住去舔嘴唇，愈舔愈乾，忍住讓膏好好護著才是對的。
  tags: [dry]
- id: se-dry-80
  text: 早晨窗玻璃內側沒了往常的霧氣，乾成這樣，連呼吸都不在玻璃上留痕。
  tags: [dry]
