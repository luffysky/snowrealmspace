# 季節/天氣 · 悶熱（第三批）。繁體中文，每一則獨一無二。
- id: se-muggy-41
  text: 便利商店的冷氣此刻像救贖，進去晃一圈買瓶水也算偷得片刻清涼。
  tags: [muggy]
- id: se-muggy-42
  text: 停在太陽下的車一開門就是一股熱浪，方向盤燙手就先讓它散一散再上路。
  tags: [muggy]
- id: se-muggy-43
  text: 電風扇吹出來的都是溫溫的風，開對窗讓空氣對流才真的涼得下來。
  tags: [muggy]
- id: se-muggy-44
  text: 手臂一擱到桌面就黏住紙張，墊條薄布寫字會順手許多。
  tags: [muggy]
- id: se-muggy-45
  text: 妝在這種濕黏裡撐不了多久，用吸油面紙壓一壓比補妝實在。
  tags: [muggy]
- id: se-muggy-46
  text: 一碗冰涼的綠豆湯或仙草最解這股暑氣，甜甜涼涼地熨貼腸胃。
  tags: [muggy]
- id: se-muggy-47
  text: 換上涼蓆睡覺，竹面貼著背的沁涼會讓悶夜好過不少。
  tags: [muggy]
- id: se-muggy-48
  text: 蚊子在悶濕的夜裡特別勤勞，點盤蚊香或插上電蚊香再安心躺下。
  tags: [muggy]
- id: se-muggy-49
  text: 這種濕熱剩菜壞得特別快，吃不完的趁熱氣散前先收進冰箱。
  tags: [muggy]
- id: se-muggy-50
  text: 領口不知不覺濕了一圈，多備一件上衣換著穿會清爽自在。
  tags: [muggy]
- id: se-muggy-51
  text: 電腦主機在悶天裡嗡嗡發燙，讓它旁邊留點空隙散熱也是體貼。
  tags: [muggy]
- id: se-muggy-52
  text: 陰沉沒風的午後反而比大太陽更悶，開扇窗製造一點流動就舒服了。
  tags: [muggy]
- id: se-muggy-53
  text: 樓梯間的熱氣一層層積著，爬上樓喘口氣再進門也不遲。
  tags: [muggy]
- id: se-muggy-54
  text: 濕悶的空氣壓得眼皮發沉，撐不住就閉目養神一會兒。
  tags: [muggy]
- id: se-muggy-55
  text: 冰塊在杯裡化得飛快，喝之前先大口享受那份透心涼。
  tags: [muggy]
- id: se-muggy-56
  text: 隨身的涼感噴霧往頸後一噴，那股薄涼能撐過最悶的一段路。
  tags: [muggy]
- id: se-muggy-57
  text: 剛沖完澡沒多久又冒了汗，這種天本來就難乾爽，別為此煩心。
  tags: [muggy]
- id: se-muggy-58
  text: 傍晚到有水的地方走走，腳泡進池子裡的涼意能把暑氣帶走大半。
  tags: [muggy]
- id: se-muggy-59
  text: 騎樓下的陰影是悶熱午後的好去處，慢慢走著避開直曬。
  tags: [muggy]
- id: se-muggy-60
  text: 睡前把冷氣設個定時，讓涼意陪你入眠又不至於整夜太冷。
  tags: [muggy]
