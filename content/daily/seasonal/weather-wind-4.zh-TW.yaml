# 季節/天氣 · 有風的天（第四批）。繁體中文，每一則獨一無二。
- id: se-wind-61
  text: 風把曬穀場的稻穀翻得沙沙作響，農家趁勢用木耙推成一道道弧線。
  tags: [windy]
- id: se-wind-62
  text: 這種風勢放沖天炮的煙飄得遠，廟埕上的人抬頭看了好一陣。
  tags: [windy]
- id: se-wind-63
  text: 風把港邊的漁旗吹得筆直，一整排顏色在桅杆上抖個不停。
  tags: [windy]
- id: se-wind-64
  text: 起風時磨咖啡豆，細粉容易被吹散，把磨盤挪到背風處穩妥些。
  tags: [windy]
- id: se-wind-65
  text: 風穿過吊橋，木板縫裡呼呼響，走在上面手不自覺抓緊了繩索。
  tags: [windy]
- id: se-wind-66
  text: 這麼會吹的天曬柿餅剛好，果皮收得緊實，甜味也一天天濃了。
  tags: [windy]
- id: se-wind-67
  text: 風把畫架上的水彩紙掀起一角，索性用石頭把四邊都壓穩了。
  tags: [windy]
- id: se-wind-68
  text: 起風後茶園的葉浪一波推一波，採茶的人斗笠帶子綁得更緊。
  tags: [windy]
- id: se-wind-69
  text: 風把風信旗吹向同一邊，養蜂人一看就知道該把蜂箱轉個向。
  tags: [windy]
- id: se-wind-70
  text: 這種天氣曬米粉最理想，一格格架子上的白絲被吹得根根分明。
  tags: [windy]
- id: se-wind-71
  text: 風把露天電影的布幕吹得鼓起，畫面晃了晃，觀眾反倒笑成一團。
  tags: [windy]
- id: se-wind-72
  text: 起風時牽風箏線的手要放得巧，順著陣勢一收一放就穩住了。
  tags: [windy]
- id: se-wind-73
  text: 風把菜園的絲瓜藤吹得亂搖，索性再綁幾根竹竿讓它攀得牢些。
  tags: [windy]
- id: se-wind-74
  text: 這麼強的風騎渡輪，甲板上站不太住，扶著欄杆看浪反而痛快。
  tags: [windy]
- id: se-wind-75
  text: 風把烘爐的炭灰揚起一小片，烤地瓜的攤主拿蓋子順手擋了擋。
  tags: [windy]
- id: se-wind-76
  text: 起風的黃昏放水燈，燭火在河面被吹得一閃一閃，飄得老遠。
  tags: [windy]
- id: se-wind-77
  text: 風把晾著的魚乾吹得半透明，海味一陣陣飄過整條老街。
  tags: [windy]
- id: se-wind-78
  text: 這種風勢適合去山脊看雲海翻湧，一陣風來整片白霧就換了模樣。
  tags: [windy]
- id: se-wind-79
  text: 風把攤位的燈籠吹得左搖右晃，夜市的紅光在巷口忽明忽暗。
  tags: [windy]
- id: se-wind-80
  text: 起風時放天文望遠鏡要壓穩腳架，鏡頭一晃星點就跟著跑了。
  tags: [windy]
