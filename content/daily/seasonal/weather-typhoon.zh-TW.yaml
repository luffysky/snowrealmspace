# 季節/天氣 · 颱風天。繁體中文，每一則獨一無二。
- id: se-typhoon-01
  text: 颱風靠近了，陽台的盆栽和雜物先收進來吧。
  tags: [typhoon]
- id: se-typhoon-02
  text: 風雨會愈來愈大，外出的時候記得放慢腳步。
  tags: [typhoon]
- id: se-typhoon-03
  text: 家裡的手電筒和行動電源，先充飽電放在拿得到的地方。
  tags: [typhoon]
- id: se-typhoon-04
  text: 冰箱裡多備一些即食的東西，停電也不怕餓肚子。
  tags: [typhoon]
- id: se-typhoon-05
  text: 這種天氣待在家最安心，窗邊聽著風雨也別有一番味道。
  tags: [typhoon]
- id: se-typhoon-06
  text: 門窗都關緊了，膠帶貼一貼玻璃會更牢固。
  tags: [typhoon]
- id: se-typhoon-07
  text: 明天可能停班停課，今晚就好好放鬆睡個飽。
  tags: [typhoon]
- id: se-typhoon-08
  text: 機車最好停到不會被吹倒的地方，車套也綁牢一點。
  tags: [typhoon]
- id: se-typhoon-09
  text: 水裝滿幾個容器備著，萬一停水也還有得用。
  tags: [typhoon]
- id: se-typhoon-10
  text: 排水孔前的落葉清一清，積水才不會漫進屋裡。
  tags: [typhoon]
- id: se-typhoon-11
  text: 外面招牌和路樹都在搖，經過騎樓時離遠一點比較好。
  tags: [typhoon]
- id: se-typhoon-12
  text: 泡杯熱茶配上愛看的劇，讓風雨在窗外自己忙。
  tags: [typhoon]
- id: se-typhoon-13
  text: 低窪的地下室和車庫，貴重的東西先移到高處。
  tags: [typhoon]
- id: se-typhoon-14
  text: 手機留意一下氣象更新，掌握颱風走向心裡有底。
  tags: [typhoon]
- id: se-typhoon-15
  text: 陣風真的很猛，這時候就別逞強往外跑了。
  tags: [typhoon]
- id: se-typhoon-16
  text: 常備藥和常用品清點一下，颱風天不用出門也齊全。
  tags: [typhoon]
- id: se-typhoon-17
  text: 家人朋友互相報個平安，這種天氣一句問候特別暖。
  tags: [typhoon]
- id: se-typhoon-18
  text: 曬在外面的衣服都收回來了，雨勢隨時會潑進來。
  tags: [typhoon]
- id: se-typhoon-19
  text: 停電時蠟燭要小心火燭，其實手電筒會更安全。
  tags: [typhoon]
- id: se-typhoon-20
  text: 颱風過後路面濕滑又多雜物，出門時步步都踏穩。
  tags: [typhoon]
