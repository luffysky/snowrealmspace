# 季節/天氣 · 轉涼降溫（第三批）。繁體中文，每一則獨一無二。
- id: se-chilly-41
  text: 火鍋店的排隊人潮又多了起來，冷天大家都想圍著熱湯。
  tags: [chilly]
- id: se-chilly-42
  text: 出門前的穿搭像洋蔥一樣一層層疊上，方便隨溫度加減。
  tags: [chilly]
- id: se-chilly-43
  text: 電暖器從儲藏室搬了出來，插上電就有一圈暖烘烘。
  tags: [chilly]
- id: se-chilly-44
  text: 泡湯的時間拉得比平常久，泡到肩膀都紅了才捨得起身。
  tags: [chilly]
- id: se-chilly-45
  text: 手套從口袋深處被找了出來，戴上才敢握冰冷的把手。
  tags: [chilly]
- id: se-chilly-46
  text: 帽T的拉鍊一路拉到下巴，把頸子藏進帽子裡最暖。
  tags: [chilly]
- id: se-chilly-47
  text: 薑茶的辛香在舌尖化開，一口就從喉嚨暖到了胃裡。
  tags: [chilly]
- id: se-chilly-48
  text: 沙發上多了一條隨手可蓋的毯子，看電視時剛好裹著。
  tags: [chilly]
- id: se-chilly-49
  text: 家裡的貓縮成一團塞進紙箱，把自己藏得只剩一顆頭。
  tags: [chilly]
- id: se-chilly-50
  text: 走路時雙手插進口袋，縮著身子想留住一點體溫。
  tags: [chilly]
- id: se-chilly-51
  text: 對著窗玻璃哈氣，白霧上還能用指尖畫出圖案。
  tags: [chilly]
- id: se-chilly-52
  text: 保溫瓶又成了包包裡的必備，裝滿熱水才安心出門。
  tags: [chilly]
- id: se-chilly-53
  text: 鼻尖凍得發紅，摸起來像剛從冰箱裡拿出來一樣。
  tags: [chilly]
- id: se-chilly-54
  text: 窗簾縫透進的風帶著寒意，得把邊角壓得更緊一些。
  tags: [chilly]
- id: se-chilly-55
  text: 街邊賣烤地瓜的攤子出現了，熱呼呼的香氣勾得人停下腳步。
  tags: [chilly]
- id: se-chilly-56
  text: 嘴唇乾得容易起皮，護唇膏成了口袋裡的常客。
  tags: [chilly]
- id: se-chilly-57
  text: 貼身的發熱衣重新上陣，薄薄一件就擋住不少寒氣。
  tags: [chilly]
- id: se-chilly-58
  text: 睡前把棉被攤在暖氣旁烘一會，鑽進去時整床都是暖的。
  tags: [chilly]
- id: se-chilly-59
  text: 燒水壺一天要響上好幾回，冷天對熱水的需求特別高。
  tags: [chilly]
- id: se-chilly-60
  text: 陽光灑落的那一側成了行人的首選，大家都想沾一點難得的暖。
  tags: [chilly]
