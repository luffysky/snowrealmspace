# 季節/天氣 · 轉涼降溫。繁體中文，每一則獨一無二。
- id: se-chilly-01
  text: 天氣轉涼了，出門記得多帶一件外套。
  tags: [chilly]
- id: se-chilly-02
  text: 氣溫悄悄往下掉，晚上會比想像中更冷一些。
  tags: [chilly]
- id: se-chilly-03
  text: 風開始帶著涼意，圍巾可以拿出來備著了。
  tags: [chilly]
- id: se-chilly-04
  text: 早晚溫差變大，穿搭挑件方便穿脫的最剛好。
  tags: [chilly]
- id: se-chilly-05
  text: 空氣涼了下來，走在路上會想把領子拉高一點。
  tags: [chilly]
- id: se-chilly-06
  text: 這幾天降溫明顯，睡覺前記得添床薄被。
  tags: [chilly]
- id: se-chilly-07
  text: 季節正在交替，身體對這樣的變化特別敏感。
  tags: [chilly]
- id: se-chilly-08
  text: 天色暗得早，涼風一起就讓人想快點回家。
  tags: [chilly]
- id: se-chilly-09
  text: 溫度一路下滑，手邊放件毛衣會安心許多。
  tags: [chilly]
- id: se-chilly-10
  text: 涼意漸漸滲進來，喝杯熱的最暖身。
  tags: [chilly]
- id: se-chilly-11
  text: 早晨的空氣變得清冷，出門前先看看氣溫比較穩妥。
  tags: [chilly]
- id: se-chilly-12
  text: 冷空氣悄悄報到，這種天氣很容易著涼。
  tags: [chilly]
- id: se-chilly-13
  text: 白天還算暖，入夜卻涼得快，別被午後的溫度騙了。
  tags: [chilly]
- id: se-chilly-14
  text: 秋意愈來愈重，薄長袖換成厚一點的正合時。
  tags: [chilly]
- id: se-chilly-15
  text: 降溫的日子裡，手腳容易發涼，多留意保暖。
  tags: [chilly]
- id: se-chilly-16
  text: 涼風掠過，樹葉開始泛黃，天氣一天比一天冷。
  tags: [chilly]
- id: se-chilly-17
  text: 溫度變化大的時節，忽冷忽熱時最要當心身體。
  tags: [chilly]
- id: se-chilly-18
  text: 夜裡的寒意加重，關窗睡覺會睡得比較安穩。
  tags: [chilly]
- id: se-chilly-19
  text: 涼意一波波襲來，出門前摸摸外套的厚度剛好。
  tags: [chilly]
- id: se-chilly-20
  text: 氣候轉冷的過渡期，溫熱的食物特別撫慰人。
  tags: [chilly]
