# 季節/天氣 · 陰天多雲（第五批）。繁體中文，每一則獨一無二。
- id: se-cloud-81
  text: 沒有日照的午後，在陽台幫多肉盆栽換土，不必擔心嫩根被曬傷。
  tags: [cloudy]
- id: se-cloud-82
  text: 灰天逛舊貨市集，銅器銀器上沒有反光，鏽斑和刻痕看得一清二楚。
  tags: [cloudy]
- id: se-cloud-83
  text: 天陰著採靛藍染布，晾起來的布色顯得又沉又勻。
  tags: [cloudy]
- id: se-cloud-84
  text: 雲層低垂的傍晚在河邊看白鷺，牠們的身影在灰底裡格外清晰。
  tags: [cloudy]
- id: se-cloud-85
  text: 悶灰的天最適合曬麵線，一縷縷掛在竹竿上乾得不急不徐。
  tags: [cloudy]
- id: se-cloud-86
  text: 沒有太陽晃眼，坐在河堤上寫生，把對岸的鐵橋一筆一筆描下來。
  tags: [cloudy]
- id: se-cloud-87
  text: 這種天光看櫥窗裡的珠寶最實在，切工好壞不靠反光唬人，一眼就分明。
  tags: [cloudy]
- id: se-cloud-88
  text: 天灰著逛植物園的溫室，玻璃上沒有白光，蕨類的綠一層層都看得出來。
  tags: [cloudy]
- id: se-cloud-89
  text: 雲遮著日頭，午後在庭院修剪盆景，枝條的走向看得分明，下剪也穩。
  tags: [cloudy]
- id: se-cloud-90
  text: 悶天裡熬一鍋紅豆湯，蒸氣在灰白的窗前顯得特別綿密。
  tags: [cloudy]
- id: se-cloud-91
  text: 沒有影子在地上晃，公園下棋的老人一坐就是一下午，棋盤看得清楚。
  tags: [cloudy]
- id: se-cloud-92
  text: 天陰著整理一箱老照片，泛黃的相紙在柔光下沒有反光，一張張看得仔細。
  tags: [cloudy]
- id: se-cloud-93
  text: 雲厚的日子逛水族館，館外沒有白晃晃的光，進去看魚缸眼睛適應得很快。
  tags: [cloudy]
- id: se-cloud-94
  text: 沒有烈日烤著看台，午後看棒球賽，坐到終場也不覺得曬得發暈。
  tags: [cloudy]
- id: se-cloud-95
  text: 雲低低壓著，午後到河口看招潮蟹，退潮的泥灘上牠們的螯揮得清楚。
  tags: [cloudy]
- id: se-cloud-96
  text: 天陰著在騎樓下修手錶，零件的細齒在放大鏡下看得毫釐分明。
  tags: [cloudy]
- id: se-cloud-97
  text: 灰濛濛的午後彈鋼琴，屋裡的光和聲音一樣安安靜靜。
  tags: [cloudy]
- id: se-cloud-98
  text: 雲遮著日頭，帶孩子去公園溜滑梯，金屬滑道不燙手，玩得放心。
  tags: [cloudy]
- id: se-cloud-99
  text: 沒有太陽催著，週末在陽台修理舊腳踏車，零件攤一地也不怕曬到發燙。
  tags: [cloudy]
- id: se-cloud-100
  text: 天灰著逛老戲院看默片，門外沒有刺眼的日光，散場時眼睛不必重新適應。
  tags: [cloudy]
