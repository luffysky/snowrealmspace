# 季節 · 秋天生活（續）。繁體中文，每一則獨一無二。
- id: se-autumnlife-21
  text: 中秋一到，巷子裡飄起烤肉的香，家家戶戶都在門口生起了炭火。
  tags: [autumn]
- id: se-autumnlife-22
  text: 切開一塊月餅配熱茶，甜膩剛好被茶香化開，這味道就是團圓。
  tags: [autumn]
- id: se-autumnlife-23
  text: 剝完文旦順手把皮扣在頭上，小孩笑得東倒西歪，這畫面每年都要來一次。
  tags: [autumn]
- id: se-autumnlife-24
  text: 今晚的月亮又圓又亮，搬張椅子到陽台，抬頭看一會兒就很滿足。
  tags: [autumn]
- id: se-autumnlife-25
  text: 花市擺出成排的菊花，黃的白的一盆盆，秋天的氣味就這樣濃了。
  tags: [autumn]
- id: se-autumnlife-26
  text: 秋刀魚肥美的季節，撒點鹽烤得油亮，配碗白飯就是滿足的一餐。
  tags: [autumn]
- id: se-autumnlife-27
  text: 稻田一片金黃低垂著頭，風吹過去像整片田在慢慢起伏。
  tags: [autumn]
- id: se-autumnlife-28
  text: 河岸的芒花白茫茫開成一片，夕陽一照就鍍上了淡淡的金邊。
  tags: [autumn]
- id: se-autumnlife-29
  text: 螃蟹正肥的時候，蒸一籠上桌，剝殼的手忙個不停也甘願。
  tags: [autumn]
- id: se-autumnlife-30
  text: 天涼了改喝熱熱的桂圓紅棗茶，捧在手裡整個人都暖了起來。
  tags: [autumn]
- id: se-autumnlife-31
  text: 重陽這天長輩們相約去登高，山上風大，卻笑得比誰都開懷。
  tags: [autumn]
- id: se-autumnlife-32
  text: 明明入秋了，中午的秋老虎還是曬得人發昏，短袖又被翻了出來。
  tags: [autumn]
- id: se-autumnlife-33
  text: 屋簷下掛起一串串柿餅，橘紅的一排在風裡慢慢曬出白霜。
  tags: [autumn]
- id: se-autumnlife-34
  text: 銀杏道一夜之間全黃了，踩在滿地金黃上，連腳步都放慢了。
  tags: [autumn]
- id: se-autumnlife-35
  text: 市場的芋頭鬆軟粉香，燉一鍋芋頭排骨，整間屋子都是暖香。
  tags: [autumn]
- id: se-autumnlife-36
  text: 路邊烤起了甘蔗，攤子前一杯溫溫的甘蔗汁，甜得很實在。
  tags: [autumn]
- id: se-autumnlife-37
  text: 天一冷就想圍爐，約幾個人吃鍋，湯滾起來話也跟著熱絡了。
  tags: [autumn]
- id: se-autumnlife-38
  text: 夜裡蟲鳴變得稀疏了，安安靜靜的，反而聽得見自己的呼吸。
  tags: [autumn]
- id: se-autumnlife-39
  text: 涼意深了，泡進溫泉裡看白煙裊裊升起，肩膀一下就鬆了開來。
  tags: [autumn]
- id: se-autumnlife-40
  text: 出門前圍上今年第一條圍巾，脖子暖了，整個人也精神了起來。
  tags: [autumn]
