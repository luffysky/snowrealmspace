# 季節/天氣 · 陰天多雲。繁體中文，每一則獨一無二。
- id: se-cloud-01
  text: 天陰陰的，適合窩著做點喜歡的事。
  tags: [cloudy]
- id: se-cloud-02
  text: 灰白的雲把光線鋪得很柔，看什麼都不刺眼。
  tags: [cloudy]
- id: se-cloud-03
  text: 沒有太陽的日子，反而多了一份安靜的溫柔。
  tags: [cloudy]
- id: se-cloud-04
  text: 雲層厚厚的，像替整座城市蓋上一層薄毯。
  tags: [cloudy]
- id: se-cloud-05
  text: 這種天色最適合待在室內，煮壺茶慢慢過。
  tags: [cloudy]
- id: se-cloud-06
  text: 光是霧霧的一片，眼睛也跟著放鬆下來。
  tags: [cloudy]
- id: se-cloud-07
  text: 天空一整片灰，倒讓心情變得剛剛好的平淡。
  tags: [cloudy]
- id: se-cloud-08
  text: 陰天的午後，很適合翻幾頁一直想看的書。
  tags: [cloudy]
- id: se-cloud-09
  text: 雲遮住了陽光，也遮住了平常那些急躁。
  tags: [cloudy]
- id: se-cloud-10
  text: 這樣的天氣不冷不熱，待在哪裡都自在。
  tags: [cloudy]
- id: se-cloud-11
  text: 窗外一片朦朧，屋裡的燈就顯得格外暖。
  tags: [cloudy]
- id: se-cloud-12
  text: 多雲的日子步調會慢一些，跟著慢也很好。
  tags: [cloudy]
- id: se-cloud-13
  text: 沒有影子的天色，讓人想靠在窗邊發呆一會兒。
  tags: [cloudy]
- id: se-cloud-14
  text: 雲一層疊一層，天空像被畫成了淡淡的水墨。
  tags: [cloudy]
- id: se-cloud-15
  text: 陰天不必勉強出門，在家也能過得很豐盛。
  tags: [cloudy]
- id: se-cloud-16
  text: 柔和的天光灑進來，連平凡的桌角都好看。
  tags: [cloudy]
- id: se-cloud-17
  text: 灰濛濛的一天，配一杯熱可可正剛好。
  tags: [cloudy]
- id: se-cloud-18
  text: 少了烈日，散步起來反而輕鬆許多。
  tags: [cloudy]
- id: se-cloud-19
  text: 天色悶悶的時候，音樂放輕一點，心也跟著鬆。
  tags: [cloudy]
- id: se-cloud-20
  text: 這種安靜的陰天，很值得留給自己好好休息。
  tags: [cloudy]
