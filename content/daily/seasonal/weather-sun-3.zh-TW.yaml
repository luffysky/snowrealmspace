# 季節/天氣 · 晴天（第三批）。繁體中文，每一則獨一無二。
- id: se-sun-41
  text: 正午時分影子縮得短短一截，貼著腳邊，這是太陽最高的證據。
  tags: [sunny]
- id: se-sun-42
  text: 麻雀在電線上跳來跳去嘰嘰喳喳，晴天連牠們都格外有精神。
  tags: [sunny]
- id: se-sun-43
  text: 冰淇淋在這樣的太陽下沒幾分鐘就化，買了就趁涼多嚐幾口。
  tags: [sunny]
- id: se-sun-44
  text: 早晨的光從窗簾縫隙溜進來，暖暖地落在臉上把人喚醒。
  tags: [sunny]
- id: se-sun-45
  text: 洗完的車停在院子裡，車身的水珠沒一會兒就被曬得無影無蹤。
  tags: [sunny]
- id: se-sun-46
  text: 手機別擱在曬得到太陽的地方，機身一熱就容易發燙當機。
  tags: [sunny]
- id: se-sun-47
  text: 花園裡的蜜蜂在花叢間忙進忙出，晴天的午後熱鬧得很。
  tags: [sunny]
- id: se-sun-48
  text: 晨露在草葉上閃了一下，太陽一升起就悄悄蒸發不見了。
  tags: [sunny]
- id: se-sun-49
  text: 赤腳踩在被陽光曬暖的地板上，腳底傳來的那點溫度很療癒。
  tags: [sunny]
- id: se-sun-50
  text: 向日葵整片朝著太陽轉過去，看著那份執著心裡也跟著發亮。
  tags: [sunny]
- id: se-sun-51
  text: 屋裡亮堂得不必開燈，晴天替你省下的電費是意外的小確幸。
  tags: [sunny]
- id: se-sun-52
  text: 白天這麼清透，入夜後的星空多半也會跟著清楚起來。
  tags: [sunny]
- id: se-sun-53
  text: 曬在陽台上的蘿蔔乾一天比一天縮，鹹香也一天比一天足。
  tags: [sunny]
- id: se-sun-54
  text: 挑張曬得到太陽的長椅坐下讀幾頁書，暖意和字句一起淌進心裡。
  tags: [sunny]
- id: se-sun-55
  text: 牆頭的壁虎攤在陽光下一動不動，享受著這片免費的溫暖。
  tags: [sunny]
- id: se-sun-56
  text: 剛除完草的院子飄著青草香，被太陽一曬更是清新撲鼻。
  tags: [sunny]
- id: se-sun-57
  text: 晴朗的傍晚天色暗得慢，散步回來天邊都還留著一抹光。
  tags: [sunny]
- id: se-sun-58
  text: 換上一雙涼鞋踩著陽光出門，腳趾間都是輕快的暖意。
  tags: [sunny]
- id: se-sun-59
  text: 一早趁太陽還不烈先把花草澆好，它們喝飽水才禁得住白天的曬。
  tags: [sunny]
- id: se-sun-60
  text: 樹上的果子被曬得一天比一天透紅，甜味也悄悄在裡頭聚攏。
  tags: [sunny]
