# 季節 · 春天生活（第四批）。繁體中文，每一則獨一無二。
- id: se-springlife-61
  text: 收拾陽台堆了一冬的雜物，擺出一張小桌椅，午後又多了個發呆的角落。
  tags: [spring]
- id: se-springlife-62
  text: 花店前排起長長的人龍，一束束康乃馨被捧著走出門，母親節的心意滿街都是。
  tags: [spring]
- id: se-springlife-63
  text: 牆角的蕨類抽出一支支捲捲的嫩芽，像一個個好奇探頭的小問號。
  tags: [spring]
- id: se-springlife-64
  text: 雨後的矮牆上爬著幾隻蝸牛，背著殼慢慢挪，像替忙碌的日子按了暫停。
  tags: [spring]
- id: se-springlife-65
  text: 厚棉被換成薄涼被，蓋起來剛剛好，半夜翻身也不再嫌沉。
  tags: [spring]
- id: se-springlife-66
  text: 一列螞蟻沿著牆腳排隊搬家，長輩說這是快下雨的前兆。
  tags: [spring]
- id: se-springlife-67
  text: 在花盆裡撒下幾顆種子，每天澆水等它冒頭，日子有了小小的盼望。
  tags: [spring]
- id: se-springlife-68
  text: 衣服掛出去半天就乾透了，收進來時帶著曬過陽光的暖香。
  tags: [spring]
- id: se-springlife-69
  text: 把收了一整個冬天的蚊帳翻出來洗淨掛好，夜裡睡覺又多了一層安心。
  tags: [spring]
- id: se-springlife-70
  text: 連假的高速公路塞成一條長龍，大家都趕著往山裡海邊透透氣。
  tags: [spring]
- id: se-springlife-71
  text: 走進竹林一陣風掠過，竹葉沙沙作響，涼意裡夾著淡淡清香。
  tags: [spring]
- id: se-springlife-72
  text: 溪水退了寒意，脫下鞋踩進去涼涼的，孩子們玩到不肯上岸。
  tags: [spring]
- id: se-springlife-73
  text: 樟樹趁這時節換葉，滿地舖著紅褐的舊葉，枝頭卻已冒出一片嫩綠。
  tags: [spring]
- id: se-springlife-74
  text: 天氣一熱就把長髮剪短了一截，脖子後頭頓時涼爽了起來。
  tags: [spring]
- id: se-springlife-75
  text: 趁著乾爽的好天氣把受潮的書搬出來翻曬，紙頁間的霉味散得乾乾淨淨。
  tags: [spring]
- id: se-springlife-76
  text: 抬頭看天，雲一朵朵飄得很悠哉，藍得讓人想多站一會兒。
  tags: [spring]
- id: se-springlife-77
  text: 到花市挑了幾株番茄和辣椒的菜苗，種進陽台的盆裡，等著它們慢慢長大。
  tags: [spring]
- id: se-springlife-78
  text: 路邊的蒲公英結成一顆顆毛球，輕輕一吹就散開飛得老遠。
  tags: [spring]
- id: se-springlife-79
  text: 水田裡立著幾隻白鷺鷥，一動也不動地守著，遠看安靜得像一幅畫。
  tags: [spring]
- id: se-springlife-80
  text: 青梅上市了，買一袋回家釀成梅酒，看它慢慢熟成也是一種樂趣。
  tags: [spring]
