# 季節 · 秋天生活（第三批）。繁體中文，每一則獨一無二。
- id: se-autumnlife-41
  text: 換季把夏天的短袖薄衫一件件收進箱底，騰出空間給厚衣服。
  tags: [autumn]
- id: se-autumnlife-42
  text: 台灣欒樹開始換裝，先冒黃花再結一串串紅褐色的蒴果，一路點綴著街道。
  tags: [autumn]
- id: se-autumnlife-43
  text: 落羽松慢慢由綠轉紅，那片林子成了大家追著跑的秋日風景。
  tags: [autumn]
- id: se-autumnlife-44
  text: 新米上市，煮出來的飯粒粒晶亮，光配醬油都好吃。
  tags: [autumn]
- id: se-autumnlife-45
  text: 早晨的草地上結了一層薄露，鞋尖走過留下淺淺的痕跡。
  tags: [autumn]
- id: se-autumnlife-46
  text: 咖啡撒上一點肉桂粉，那股辛香一飄出來，秋天的儀式感就到了。
  tags: [autumn]
- id: se-autumnlife-47
  text: 南瓜正甜，熬一鍋濃湯，橙黃色的暖意盛在碗裡。
  tags: [autumn]
- id: se-autumnlife-48
  text: 香菇金針菇一把把上市，煮鍋菇菇湯鮮得眉毛都要掉下來。
  tags: [autumn]
- id: se-autumnlife-49
  text: 把薄被單換成厚一點的毛毯，晚上翻身時多了份安心的重量。
  tags: [autumn]
- id: se-autumnlife-50
  text: 河邊的蘆葦被風吹得整片低伏，銀白的穗子在光裡閃啊閃。
  tags: [autumn]
- id: se-autumnlife-51
  text: 撿了一片最漂亮的楓葉夾進書裡，翻到那頁就想起這個秋天。
  tags: [autumn]
- id: se-autumnlife-52
  text: 蘋果堆成小山擺在攤上，紅通通的一顆咬下去脆甜多汁。
  tags: [autumn]
- id: se-autumnlife-53
  text: 換上長袖的絨睡衣，鑽進被窩前身上先暖了一半。
  tags: [autumn]
- id: se-autumnlife-54
  text: 傍晚出門散個步，太陽落得比想像中快，天邊染成一片橘粉。
  tags: [autumn]
- id: se-autumnlife-55
  text: 泡一壺焙茶，那股烘焙過的暖香最配漸涼的午後。
  tags: [autumn]
- id: se-autumnlife-56
  text: 陽台的多肉曬足了秋陽，葉緣悄悄鑲上一圈紅。
  tags: [autumn]
- id: se-autumnlife-57
  text: 逛夜市點一份熱呼呼的關東煮，湯汁暖胃又暖心。
  tags: [autumn]
- id: se-autumnlife-58
  text: 秋天的雲又高又淡，抬頭望過去，天空像被擦得特別乾淨。
  tags: [autumn]
- id: se-autumnlife-59
  text: 農家把穀子攤在曬穀場上，金黃一片鋪滿了整個院子。
  tags: [autumn]
- id: se-autumnlife-60
  text: 入秋這幾天鼻子特別敏感，噴嚏一個接一個，口袋裡多備了衛生紙。
  tags: [autumn]
