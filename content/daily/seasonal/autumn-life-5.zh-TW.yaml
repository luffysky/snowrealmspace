# 季節 · 秋天生活（第五批）。繁體中文，每一則獨一無二。
- id: se-autumnlife-81
  text: 麻油雞的香從廚房飄出來，薑片煸得焦香，天一涼喝上一碗最補。
  tags: [autumn]
- id: se-autumnlife-82
  text: 市場的白蘿蔔又肥又便宜，買幾條回家切片曬成菜脯，留著慢慢吃。
  tags: [autumn]
- id: se-autumnlife-83
  text: 甜湯攤煮起芋圓和地瓜圓，QQ的一口接一口，捧著碗坐著就不想走。
  tags: [autumn]
- id: se-autumnlife-84
  text: 秋天的蓮藕正粉，燉一鍋排骨蓮藕湯，喝起來清甜又帶著粉香。
  tags: [autumn]
- id: se-autumnlife-85
  text: 天涼了改在清晨出門慢跑，涼風灌進衣領，跑完一身舒暢不黏汗。
  tags: [autumn]
- id: se-autumnlife-86
  text: 買了顆大南瓜回來刻成燈，挖空點上蠟燭，孩子在門口笑得合不攏嘴。
  tags: [autumn]
- id: se-autumnlife-87
  text: 果園裡的橘子由青轉黃，摘一顆現剝，酸酸甜甜的秋味在嘴裡散開。
  tags: [autumn]
- id: se-autumnlife-88
  text: 柚子皮曬乾後擺進衣櫃，淡淡的清香混著陽光味，翻衣服時聞著很舒服。
  tags: [autumn]
- id: se-autumnlife-89
  text: 泡一壺枸杞菊花茶，看黃菊在熱水裡一朵朵舒展開，喝著眼睛都舒服了。
  tags: [autumn]
- id: se-autumnlife-90
  text: 花生新收，炒得香脆剝來配茶，一顆接一顆手停不下來。
  tags: [autumn]
- id: se-autumnlife-91
  text: 天冷嘴饞，滷一鍋滷味，豆干海帶滷得入味，愈煮愈濃的醬香勾人。
  tags: [autumn]
- id: se-autumnlife-92
  text: 醃了一缸白菜等它發酸，過些日子就能煮成酸菜白肉鍋暖暖身。
  tags: [autumn]
- id: se-autumnlife-93
  text: 換季把涼被收進櫃子，鋪上厚一點的床墊，夜裡睡起來又暖又安穩。
  tags: [autumn]
- id: se-autumnlife-94
  text: 街邊賣起熱騰騰的蔥油餅，剛煎好外酥內軟，走過忍不住買一塊邊走邊吃。
  tags: [autumn]
- id: se-autumnlife-95
  text: 一串串辣椒曬在牆上，紅通通的一排，看著就覺得日子豐盛。
  tags: [autumn]
- id: se-autumnlife-96
  text: 楓香的葉子由綠轉黃再轉紅，一棵樹上三種顏色，抬頭看層次分明。
  tags: [autumn]
- id: se-autumnlife-97
  text: 泡一杯溫熱的黑糖薑茶驅寒，辛辣一路暖到胃裡，手腳也跟著回了溫。
  tags: [autumn]
- id: se-autumnlife-98
  text: 果農忙著採收文旦，一顆顆沉甸甸的堆滿了倉庫，空氣裡都是清香。
  tags: [autumn]
- id: se-autumnlife-99
  text: 傍晚提早亮了路燈，走在回家的路上，橘黃燈光把影子拉得長長的。
  tags: [autumn]
- id: se-autumnlife-100
  text: 客家的桔醬酸香開胃，配上白斬雞一起吃，秋天的餐桌就這樣豐盛了起來。
  tags: [autumn]
