# 季節 · 夏天生活。繁體中文，每一則獨一無二。
- id: se-summerlife-01
  text: 太陽大得有點誇張，出門前記得抹層防曬，皮膚會謝謝你。
  tags: [summer]
- id: se-summerlife-02
  text: 一整片蟬鳴從早響到晚，吵歸吵，卻是夏天最熟悉的背景音。
  tags: [summer]
- id: se-summerlife-03
  text: 剉冰淋上煉乳再擺滿配料，一口下去暑氣好像消了一半。
  tags: [summer]
- id: se-summerlife-04
  text: 午後天空突然壓下一片烏雲，雷陣雨說來就來，記得帶把傘。
  tags: [summer]
- id: se-summerlife-05
  text: 海邊的浪一波波打上腳踝，涼涼的觸感讓人捨不得離開。
  tags: [summer]
- id: se-summerlife-06
  text: 從外面滿身汗走進有冷氣的便利商店，那一瞬間簡直是天堂。
  tags: [summer]
- id: se-summerlife-07
  text: 冰箱裡冰鎮的西瓜切成大塊，坐在客廳邊吹風邊吃最過癮。
  tags: [summer]
- id: se-summerlife-08
  text: 暑假的空氣總是特別悠長，連時間都好像流得慢了一些。
  tags: [summer]
- id: se-summerlife-09
  text: 傍晚雷陣雨剛停，柏油路蒸出一股熱氣，天邊卻掛起了彩虹。
  tags: [summer]
- id: se-summerlife-10
  text: 手搖飲的冰塊在杯裡叮咚作響，握著透心涼，暑意瞬間退散。
  tags: [summer]
- id: se-summerlife-11
  text: 夜裡熱到睡不著，索性把電風扇轉到底，聽著扇葉聲入睡。
  tags: [summer]
- id: se-summerlife-12
  text: 夏夜的公園裡有人乘涼、有人遛狗，晚風一吹整個人都鬆了。
  tags: [summer]
- id: se-summerlife-13
  text: 泳池的水藍得發亮，泡進去的那一刻全身的黏膩都被沖走了。
  tags: [summer]
- id: se-summerlife-14
  text: 樹蔭底下比外頭涼上好幾度，難怪大家都往有陰影的地方站。
  tags: [summer]
- id: se-summerlife-15
  text: 夜市裡的芒果冰堆得像座小山，黃澄澄的看著就消暑。
  tags: [summer]
- id: se-summerlife-16
  text: 曬過太陽的棉被收進屋裡，蓬鬆又帶著陽光的暖香。
  tags: [summer]
- id: se-summerlife-17
  text: 傍晚的沙灘退了潮，踩在濕軟的沙上撿貝殼，時間都忘了。
  tags: [summer]
- id: se-summerlife-18
  text: 冰棒在手裡融得飛快，一邊舔一邊追著滴下來的糖水，很有夏天味。
  tags: [summer]
- id: se-summerlife-19
  text: 山裡的溪水沁涼刺骨，把腳泡進去，暑氣一下子就全退了。
  tags: [summer]
- id: se-summerlife-20
  text: 夏天日落得晚，晚上七點天還亮著，散步的時間彷彿被延長了。
  tags: [summer]
