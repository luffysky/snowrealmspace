# 里程碑回顧。tags 用里程碑 key（day_7 / day_30 / … / year_1 …）或 generic（fallback）。
# 只在「剛好到那個註冊天數節點」的當天顯示。溫和、不催促、不比較。
- id: mi-generic-01
  text: 又是一個小小的節點，回頭看看走過的這段路吧。
  tags: [generic]
- id: mi-generic-02
  text: 到這裡了。不用特別慶祝，記得一下就好。
  tags: [generic]
- id: mi-generic-03
  text: 累積是安靜發生的，今天剛好是個節點。
  tags: [generic]
- id: mi-generic-04
  text: 走到這一步，靠的是你一次一次回來。
  tags: [generic]
- id: mi-day-7
  text: 一週了。這個空間開始有點你的樣子了。
  tags: [day_7]
- id: mi-day-14
  text: 兩週了。你來過幾次，它都記得。
  tags: [day_14]
- id: mi-day-30
  text: 一個月。這裡從陌生變得有點熟悉了吧。
  tags: [day_30]
- id: mi-day-60
  text: 兩個月了，你和這個空間慢慢對上了頻率。
  tags: [day_60]
- id: mi-day-100
  text: 一百天。這不是小數字，是你回來了一百次的意思。
  tags: [day_100]
- id: mi-day-200
  text: 兩百天了，這個空間陪你走了很長一段。
  tags: [day_200]
- id: mi-day-300
  text: 三百天。一年快滿了，回頭看看最初的自己。
  tags: [day_300]
- id: mi-day-500
  text: 五百天。你和這個空間，都跟當初不太一樣了。
  tags: [day_500]
- id: mi-day-1000
  text: 一千天。這是很多個平凡日子疊起來的厚度。
  tags: [day_1000]
- id: mi-day-2000
  text: 兩千天。時間很長，而你一直都在。
  tags: [day_2000]
- id: mi-day-3000
  text: 三千天。這個空間記得的，比你以為的還多。
  tags: [day_3000]
- id: mi-day-3650
  text: 三千六百五十天，整整十年。謝謝你一直沒離開。
  tags: [day_3650]
- id: mi-year-1
  text: 滿一年了。這一年的痕跡，都在這裡等你翻。
  tags: [year_1]
- id: mi-year-2
  text: 兩年了。回頭翻翻，你會看見自己的變化。
  tags: [year_2]
- id: mi-year-3
  text: 三年。這個空間長成了只屬於你的樣子。
  tags: [year_3]
