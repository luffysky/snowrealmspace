# 里程碑回顧補充（對應 milestone.ts 新增的節點）。tags 用 day_N / year_N。
- id: mi-day-21
  text: 三週了，這裡越來越像你會回來的地方。
  tags: [day_21]
- id: mi-day-50
  text: 五十天。不知不覺，累積成了習慣。
  tags: [day_50]
- id: mi-day-150
  text: 一百五十天，走了好長一段安靜的路。
  tags: [day_150]
- id: mi-day-250
  text: 兩百五十天。回頭看，起點已經有點遠了。
  tags: [day_250]
- id: mi-day-400
  text: 四百天了，超過一年，你還在。
  tags: [day_400]
- id: mi-day-600
  text: 六百天。這裡裝的，是好多個你。
  tags: [day_600]
- id: mi-day-800
  text: 八百天，快兩年半，慢慢長成一片天地。
  tags: [day_800]
- id: mi-day-1500
  text: 一千五百天。時間很輕，累積很重。
  tags: [day_1500]
- id: mi-day-2500
  text: 兩千五百天。這麼久，謝謝你一直沒走遠。
  tags: [day_2500]
- id: mi-year-4
  text: 四年了。這裡陪你走過的，比你記得的多。
  tags: [year_4]
- id: mi-year-5
  text: 五年。半個十年，你和它都變了很多。
  tags: [year_5]
