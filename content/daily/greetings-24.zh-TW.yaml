afternoon:
  - id: g-afternoon-851
    text: 午後好，先喝一口水，讓自己慢下來。
  - id: g-afternoon-852
    text: 忙了一上午，這會兒伸個懶腰吧。
  - id: g-afternoon-853
    text: 下午的陽光正暖，抬頭曬一會兒。
  - id: g-afternoon-854
    text: 泡一杯茶，給自己一段安靜的時光。
  - id: g-afternoon-855
    text: 午後的節奏可以放慢一點，別急。
  - id: g-afternoon-856
    text: 起身走幾步，讓思緒也透透氣。
  - id: g-afternoon-857
    text: 這時候小歇片刻，正剛剛好。
  - id: g-afternoon-858
    text: 望向遠方一會兒，眼睛也需要休息。
  - id: g-afternoon-859
    text: 午後微睏，趴著小睡十分鐘也不錯。
  - id: g-afternoon-860
    text: 換個節奏，把心情調得柔和些。
  - id: g-afternoon-861
    text: 午安，記得補水，別讓自己太乾。
  - id: g-afternoon-862
    text: 陽光斜斜落下，正是發呆的好時候。
  - id: g-afternoon-863
    text: 專注一件小事，其餘先放一放。
  - id: g-afternoon-864
    text: 下午茶時間到了，慢慢享受吧。
  - id: g-afternoon-865
    text: 累了就靠一下，讓肩膀鬆開來。
  - id: g-afternoon-866
    text: 午後的風輕輕的，適合深呼吸。
  - id: g-afternoon-867
    text: 給自己十分鐘，什麼都不想。
  - id: g-afternoon-868
    text: 起來動一動，讓血液也活絡起來。
  - id: g-afternoon-869
    text: 一杯溫茶，一段安靜，午後就這樣過。
  - id: g-afternoon-870
    text: 別把下午塞得太滿，留點空隙。
  - id: g-afternoon-871
    text: 午後的你，值得一段輕鬆的小歇。
  - id: g-afternoon-872
    text: 看看窗外的雲，讓腦袋放空一下。
  - id: g-afternoon-873
    text: 慢慢喝水，慢慢呼吸，慢慢來。
  - id: g-afternoon-874
    text: 這半天辛苦了，先歇口氣吧。
  - id: g-afternoon-875
    text: 午後曬曬太陽，暖意會一直留著。
  - id: g-afternoon-876
    text: 換個姿勢坐，讓身體舒服一點。
  - id: g-afternoon-877
    text: 下午時光柔柔的，別讓自己緊繃。
  - id: g-afternoon-878
    text: 走到窗邊看遠方，思緒會清爽些。
  - id: g-afternoon-879
    text: 給眼睛放個假，閉目養神一會兒。
  - id: g-afternoon-880
    text: 午後小睏很正常，稍微躺一下吧。
  - id: g-afternoon-881
    text: 一口熱茶下肚，整個人都暖了。
  - id: g-afternoon-882
    text: 把節奏調慢，這個下午才不會太趕。
  - id: g-afternoon-883
    text: 起身伸伸懶腰，把僵硬的地方放鬆。
  - id: g-afternoon-884
    text: 午安，願你這下午過得從容。
