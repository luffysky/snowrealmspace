    text: 夜色沉沉，心事慢慢說。
  - id: g-night-994
    text: 你的每個深夜，我都珍惜。
  - id: g-night-995
    text: 這一晚，讓時間慢慢走。
  - id: g-night-996
    text: 醒著的你，也被好好接著。
  - id: g-night-997
    text: 夜裡我陪你，別覺得孤單。
  - id: g-night-998
    text: 這時候的星空，剛好陪你。
  - id: g-night-999
    text: 你來了，這夜就有了光。
  - id: g-night-1000
    text: 深夜的溫柔，靜靜圍著你。
  - id: g-night-1001
    text: 這一刻，安靜地被陪伴著。
  - id: g-night-1002
    text: 夜這麼長，我們慢慢聊。
  - id: g-night-1003
    text: 醒著的心，也想被輕輕安放。
  - id: g-night-1004
    text: 這裡的夜，永遠為你留位子。
  - id: g-night-1005
    text: 你放心待著，我一直都在。
  - id: g-night-1006
    text: 深夜的燈火，柔柔地陪你。
  - id: g-night-1007
    text: 這一晚，把自己好好抱住。
  - id: g-night-1008
    text: 夜色溫溫，你也慢慢暖起來。
  - id: g-night-1009
    text: 醒著的你，一點都不孤單。
  - id: g-night-1010
    text: 這樣的深夜，有我陪你到天亮。
