    text: 泡杯咖啡也好，重點是那份停頓
  - id: g-afternoon-396
    text: 遠方的天空很寬，看一眼心也寬了
  - id: g-afternoon-397
    text: 這個下午，慢慢來就很好
  - id: g-afternoon-398
    text: 起身走廊來回走走，換個空氣
