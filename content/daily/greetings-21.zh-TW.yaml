    text: 下午三點，最適合給自己一小段留白
  - id: g-afternoon-375
    text: 眼睛望向遠處，讓它離開螢幕一會
  - id: g-afternoon-376
    text: 累了就靠著椅背，閉眼一分鐘
  - id: g-afternoon-377
    text: 午後光影很美，抬頭看一眼吧
  - id: g-afternoon-378
    text: 把今天的下半場，交給溫柔的節奏
  - id: g-afternoon-379
    text: 一口氣做太多會累，先挑一件就好
  - id: g-afternoon-380
    text: 走到陽台透透氣，天空還在等你
  - id: g-afternoon-381
    text: 下午的甜點時間，別忘了對自己好
  - id: g-afternoon-382
    text: 肩頸緊了嗎，轉一轉頭放鬆吧
  - id: g-afternoon-383
    text: 溫一壺茶，讓香氣陪你度過午後
  - id: g-afternoon-384
    text: 這時候有點恍神很正常，緩緩就好
  - id: g-afternoon-385
    text: 起來動一動，讓下午重新有精神
  - id: g-afternoon-386
    text: 午後小睡十分鐘，勝過硬撐一小時
