    text: 補點水吧，別讓自己乾巴巴的
  - id: g-afternoon-366
    text: 這半天辛苦了，喘口氣再繼續
  - id: g-afternoon-367
    text: 看看天色，午後的雲總是很溫柔
  - id: g-afternoon-368
    text: 手邊的事再急，也值得停三分鐘
