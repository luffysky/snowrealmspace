# 問候補充批次 20（各時段 251–350，+100/段 = +400）。night 不得催促。與其他 greetings 檔合併。
morning:
  - id: g-morning-251
    text: 早，先眨眨眼，讓自己慢慢清醒。
  - id: g-morning-252
    text: 早安，今天想留點時間給什麼？
  - id: g-morning-253
    text: 早，先深呼吸一口，再開始。
  - id: g-morning-254
    text: 天亮了，慢慢把眼睛睜開就好。
  - id: g-morning-255
    text: 早安，第一口熱飲值得等一下。
  - id: g-morning-256
    text: 早，窗邊的光已經在等你了。
  - id: g-morning-257
    text: 起床不急，被窩也想跟你道早。
  - id: g-morning-258
    text: 早安，先喝口水，喚醒身體。
  - id: g-morning-259
    text: 新的一天，從一次伸展開始。
  - id: g-morning-260
    text: 早，今天的節奏由你自己決定。
  - id: g-morning-261
    text: 早安，願你醒來時是鬆的。
  - id: g-morning-262
    text: 天色剛亮，不必馬上有精神。
  - id: g-morning-263
    text: 早，聽見鳥聲了嗎？
  - id: g-morning-264
    text: 早安，先給自己一個好起頭。
  - id: g-morning-265
    text: 慢慢坐起來，世界會等你。
  - id: g-morning-266
    text: 早，替今天挑一件小小的期待。
  - id: g-morning-267
    text: 早安，昨晚睡得還好嗎？
  - id: g-morning-268
    text: 陽光斜進來，正好曬曬手心。
  - id: g-morning-269
    text: 早，一杯溫水就能把身體叫醒。
  - id: g-morning-270
    text: 早安，今天想先做哪件小事？
  - id: g-morning-271
    text: 天亮得剛剛好，你也醒得剛好。
  - id: g-morning-272
    text: 早，先聞聞空氣裡的清爽。
  - id: g-morning-273
    text: 早安，把肩膀放下來一點。
  - id: g-morning-274
    text: 起身前，先動動腳趾也不錯。
  - id: g-morning-275
    text: 早，今天不趕，一步一步來。
  - id: g-morning-276
    text: 早安，願你今天有好胃口。
  - id: g-morning-277
    text: 窗簾拉開，讓光先進門。
  - id: g-morning-278
    text: 早，記得替早餐留點時間。
  - id: g-morning-279
    text: 早安，先讓腦袋慢慢開機。
  - id: g-morning-280
    text: 醒來就是好事，其餘慢慢說。
  - id: g-morning-281
    text: 早，今天的第一口氣，深一點。
  - id: g-morning-282
    text: 早安，替自己泡杯喜歡的茶。
  - id: g-morning-283
    text: 清晨很安靜，適合慢慢想事情。
  - id: g-morning-284
    text: 早，先把窗打開透透氣。
  - id: g-morning-285
    text: 早安，今天想搭配什麼樣的心情？
  - id: g-morning-286
    text: 起床的節奏，你說了算。
  - id: g-morning-287
    text: 早，讓熱飲的暖先流過手心。
  - id: g-morning-288
    text: 早安，願你今天心是輕的。
  - id: g-morning-289
    text: 天亮了，先不看訊息也可以。
  - id: g-morning-290
    text: 早，伸個懶腰再迎接今天。
  - id: g-morning-291
    text: 早安，先問問自己今天想吃什麼。
  - id: g-morning-292
    text: 光很溫柔，你也對自己溫柔點。
  - id: g-morning-293
    text: 早，晨風正好，深吸一口。
  - id: g-morning-294
    text: 早安，今天還很長，不必趕在前頭。
  - id: g-morning-295
    text: 睜眼第一件事，先笑一下。
  - id: g-morning-296
    text: 早，今天替自己留一點空白。
  - id: g-morning-297
    text: 早安，願你被第一縷光叫醒。
  - id: g-morning-298
    text: 天色微亮，先賴一下沒關係。
  - id: g-morning-299
    text: 早，喝口水，讓身體先甦醒。
  - id: g-morning-300
    text: 早安，今天想散步還是慢走？
  - id: g-morning-301
    text: 清晨的第一步，輕輕踏就好。
  - id: g-morning-302
    text: 早，把昨天放下，今天重新開。
  - id: g-morning-303
    text: 早安，願你早餐吃得暖暖的。
  - id: g-morning-304
    text: 窗外有光，屋裡有你，剛好。
  - id: g-morning-305
    text: 早，先讓自己坐一會兒再說。
  - id: g-morning-306
    text: 早安，今天的心情由你調味。
  - id: g-morning-307
    text: 醒了就好，其他都不著急。
  - id: g-morning-308
    text: 早，記得替自己準備一份早餐。
  - id: g-morning-309
    text: 早安，願今天的你步調從容。
  - id: g-morning-310
    text: 清晨微涼，添件薄外套吧。
  - id: g-morning-311
    text: 早，讓陽光陪你慢慢清醒。
  - id: g-morning-312
    text: 早安，先深呼吸，再想今天。
  - id: g-morning-313
    text: 天剛亮，你不必立刻完美。
  - id: g-morning-314
    text: 早，替今天想一件開心的小事。
  - id: g-morning-315
    text: 早安，願你醒來覺得被善待。
  - id: g-morning-316
    text: 起床不必用力，慢慢就好。
  - id: g-morning-317
    text: 早，第一杯水，記得喝完。
  - id: g-morning-318
    text: 早安，想先從哪一小步走起？
  - id: g-morning-319
    text: 晨光落在桌上，很安穩。
  - id: g-morning-320
    text: 早，先讓身體伸展一下再動。
  - id: g-morning-321
    text: 早安，願你今天笑容輕鬆。
  - id: g-morning-322
    text: 天亮以後，先照顧好自己。
  - id: g-morning-323
    text: 早，慢慢眨眨眼，回到今天。
  - id: g-morning-324
    text: 早安，今天替自己留點餘裕。
  - id: g-morning-325
    text: 清晨的空氣，值得多吸幾口。
  - id: g-morning-326
    text: 早，讓熱茶的香先把你喚醒。
  - id: g-morning-327
    text: 早安，願你今天腳步不匆忙。
  - id: g-morning-328
    text: 醒來時，先跟自己說聲早。
  - id: g-morning-329
    text: 早，今天不必事事都做完。
  - id: g-morning-330
    text: 早安，先把窗簾拉開迎光。
  - id: g-morning-331
    text: 天色漸亮，心也慢慢暖起來。
  - id: g-morning-332
    text: 早，替今天挑一首喜歡的歌。
  - id: g-morning-333
    text: 早安，願你今天喝夠溫水。
  - id: g-morning-334
    text: 起身前，先讓思緒安靜一下。
  - id: g-morning-335
    text: 早，光很好，適合慢慢開始。
  - id: g-morning-336
    text: 早安，今天想給自己什麼小獎勵？
  - id: g-morning-337
    text: 清晨很輕，別急著趕路。
  - id: g-morning-338
    text: 早，先坐到窗邊看看天色。
  - id: g-morning-339
    text: 早安，願你今天呼吸都順暢。
  - id: g-morning-340
    text: 醒來的第一分鐘，留給自己。
  - id: g-morning-341
    text: 早，讓身體慢慢找回節奏。
  - id: g-morning-342
    text: 早安，今天的天氣適合放輕鬆。
  - id: g-morning-343
    text: 天亮了，先喝口水潤潤喉。
  - id: g-morning-344
    text: 早，替今天定一個溫柔的目標。
  - id: g-morning-345
    text: 早安，願你今天過得安穩。
  - id: g-morning-346
    text: 起床後，先讓陽光曬一會兒。
  - id: g-morning-347
    text: 早，慢慢站起來，不必逞強。
  - id: g-morning-348
    text: 早安，今天想吃頓好早餐嗎？
  - id: g-morning-349
    text: 清晨靜靜的，正好陪陪自己。
  - id: g-morning-350
    text: 早，願你今天從容地開始。
afternoon:
  - id: g-afternoon-251
    text: 午後了，喝口水再繼續。
  - id: g-afternoon-252
    text: 下午好，累了就靠一下椅背。
  - id: g-afternoon-253
    text: 陽光斜斜的，這個午後很溫柔。
  - id: g-afternoon-254
    text: 忙到一半，記得抬頭看看窗外。
  - id: g-afternoon-255
    text: 午後的風慢慢吹，你也慢慢來。
  - id: g-afternoon-256
    text: 起身伸個懶腰，肩膀會謝謝你。
  - id: g-afternoon-257
    text: 下午這段時間，最適合小歇一下。
  - id: g-afternoon-258
    text: 走幾步路，讓思緒也跟著鬆開。
  - id: g-afternoon-259
    text: 泡杯茶吧，讓香氣陪你度過午後。
  - id: g-afternoon-260
    text: 眼睛看向遠方，讓它們也休息片刻。
  - id: g-afternoon-261
    text: 這個午後，一次只專心做一件事就好。
  - id: g-afternoon-262
    text: 午後有點睏是正常的，別對自己太嚴。
  - id: g-afternoon-263
    text: 換個節奏，下午也可以很從容。
  - id: g-afternoon-264
    text: 陽台的光正好，要不要去站一會兒。
  - id: g-afternoon-265
    text: 下午茶時間到了，給自己一點甜。
  - id: g-afternoon-266
    text: 深呼吸一口，把午後的空氣裝進來。
  - id: g-afternoon-267
    text: 手邊的事先放一放，喝口熱的。
  - id: g-afternoon-268
    text: 午後的雲很閒，你也可以偷閒一下。
  - id: g-afternoon-269
    text: 累了就把椅子往後靠，閉眼半分鐘。
  - id: g-afternoon-270
    text: 下午好，記得補點水分再上工。
  - id: g-afternoon-271
    text: 窗邊的光影在移動，時間過得真安靜。
  - id: g-afternoon-272
    text: 這個時候，慢一點反而走得更遠。
  - id: g-afternoon-273
    text: 午後微微的睏意，是身體在提醒你歇會。
  - id: g-afternoon-274
    text: 動動手腕、轉轉脖子，鬆一鬆再繼續。
  - id: g-afternoon-275
    text: 下午的陽光曬得人暖暖的，很舒服吧。
  - id: g-afternoon-276
    text: 給眼睛放個假，看看綠色的東西。
  - id: g-afternoon-277
    text: 午後了，先把肩膀放下來一點。
  - id: g-afternoon-278
    text: 一杯咖啡的時間，什麼都不想也好。
  - id: g-afternoon-279
    text: 下午好，別忘了你已經走了大半天。
  - id: g-afternoon-280
    text: 起來走走，讓血液也跟著活絡起來。
  - id: g-afternoon-281
    text: 午後的節奏，就讓它緩緩的吧。
  - id: g-afternoon-282
    text: 這一刻，先照顧好自己再說。
  - id: g-afternoon-283
    text: 下午三點的光，總是特別溫柔。
  - id: g-afternoon-284
    text: 手撐著下巴發個呆，也是一種休息。
  - id: g-afternoon-285
    text: 午後了，杯子空了就再去裝滿。
  - id: g-afternoon-286
    text: 累的時候，慢下來不是浪費時間。
  - id: g-afternoon-287
    text: 換個姿勢坐，讓身體舒展一下。
  - id: g-afternoon-288
    text: 下午好，聽聽窗外有什麼聲音。
  - id: g-afternoon-289
    text: 午後這杯溫水，記得留給自己。
  - id: g-afternoon-290
    text: 把視線抬遠一點，肩頸就鬆了。
  - id: g-afternoon-291
    text: 下午的時光，適合一件小小的事。
  - id: g-afternoon-292
    text: 忙碌之間，也留一格空白給自己。
  - id: g-afternoon-293
    text: 午後了，走到窗邊透透氣吧。
  - id: g-afternoon-294
    text: 這個下午，你已經做得夠好了。
  - id: g-afternoon-295
    text: 停下來一分鐘，什麼都不做。
  - id: g-afternoon-296
    text: 下午好，讓陽光曬曬你的手背。
  - id: g-afternoon-297
    text: 午後的疲倦，一杯茶就能安撫。
  - id: g-afternoon-298
    text: 慢慢喝、慢慢想，不用急著趕。
  - id: g-afternoon-299
    text: 起身倒杯水，順便走兩步。
  - id: g-afternoon-300
    text: 下午的風裡有一點涼，很剛好。
  - id: g-afternoon-301
    text: 午後了，讓肩膀離開耳朵一點。
  - id: g-afternoon-302
    text: 這時候小睡十分鐘，下午會更清醒。
  - id: g-afternoon-303
    text: 下午好，深吸一口氣再慢慢吐。
  - id: g-afternoon-304
    text: 把手機放下，看看真實的光。
  - id: g-afternoon-305
    text: 午後的桌面亂了嗎，順手理一角也舒心。
  - id: g-afternoon-306
    text: 累了就承認累，然後好好歇一下。
  - id: g-afternoon-307
    text: 下午的節奏，交給你自己決定。
  - id: g-afternoon-308
    text: 午後了，記得吃點東西別餓著。
  - id: g-afternoon-309
    text: 窗外的樹在搖，午後真安靜。
  - id: g-afternoon-310
    text: 走到陽光下站一會，暖意會回來。
  - id: g-afternoon-311
    text: 下午好，一步一步慢慢來就好。
  - id: g-afternoon-312
    text: 午後這片刻，屬於你自己。
  - id: g-afternoon-313
    text: 眼皮重的時候，先閉上眼歇口氣。
  - id: g-afternoon-314
    text: 換杯溫的喝，胃也會暖起來。
  - id: g-afternoon-315
    text: 下午的光落在地板上，慢慢移動著。
  - id: g-afternoon-316
    text: 午後了，別忘了給自己一個微笑。
  - id: g-afternoon-317
    text: 手邊忙完一段，就去伸個懶腰。
  - id: g-afternoon-318
    text: 這個下午，願你的心也平平穩穩。
  - id: g-afternoon-319
    text: 下午好，累了就把節奏放慢。
  - id: g-afternoon-320
    text: 午後的空氣暖暖的，深呼吸一下。
  - id: g-afternoon-321
    text: 起身走到窗邊，看看天空的顏色。
  - id: g-afternoon-322
    text: 補一杯水，午後才不會太乾。
  - id: g-afternoon-323
    text: 下午這段時光，慢慢過也很好。
  - id: g-afternoon-324
    text: 午後了，讓緊繃的手指放鬆放鬆。
  - id: g-afternoon-325
    text: 停一下，聽聽自己的呼吸。
  - id: g-afternoon-326
    text: 下午好，肩膀酸了就轉一轉。
  - id: g-afternoon-327
    text: 午後的陽光很慷慨，多曬一點吧。
  - id: g-afternoon-328
    text: 給自己泡杯熱飲，慢慢等它涼。
  - id: g-afternoon-329
    text: 這個下午，你不需要趕著誰。
  - id: g-afternoon-330
    text: 午後了，看看遠方讓眼睛歇歇。
  - id: g-afternoon-331
    text: 走廊上走一圈，回來會更專心。
  - id: g-afternoon-332
    text: 下午好，記得起來動一動筋骨。
  - id: g-afternoon-333
    text: 午後的睏，交給一杯茶慢慢解。
  - id: g-afternoon-334
    text: 把窗戶推開一點，換點新鮮空氣。
  - id: g-afternoon-335
    text: 這時候，做點讓自己放鬆的小事。
  - id: g-afternoon-336
    text: 下午好，慢慢來，時間還夠。
  - id: g-afternoon-337
    text: 午後了，喝完這杯再開始下一段。
  - id: g-afternoon-338
    text: 讓陽光曬到心裡，暖一暖再走。
  - id: g-afternoon-339
    text: 累的時候，靠著椅背看看天花板也好。
  - id: g-afternoon-340
    text: 下午的雲飄得很慢，你也放慢些。
  - id: g-afternoon-341
    text: 午後了，把肩上的緊繃卸下來。
  - id: g-afternoon-342
    text: 站起來走兩步，讓身體醒一醒。
  - id: g-afternoon-343
    text: 下午好，這杯水記得替自己喝掉。
  - id: g-afternoon-344
    text: 午後的時光柔柔的，不必太用力。
  - id: g-afternoon-345
    text: 專心把眼前這件小事做好就夠了。
  - id: g-afternoon-346
    text: 下午了，換個角度看看窗外的景。
  - id: g-afternoon-347
    text: 午後小歇一下，效率反而更好。
  - id: g-afternoon-348
    text: 深深吸氣，把午後的暖意留住。
  - id: g-afternoon-349
    text: 下午好，慢慢走，也會抵達的。
  - id: g-afternoon-350
    text: 午後了，願這一刻你覺得安心。
evening:
  - id: g-evening-251
    text: 傍晚了，把今天輕輕收起來。
  - id: g-evening-252
    text: 晚上好，燈亮起來就慢下來。
  - id: g-evening-253
    text: 天色暗了，讓肩膀也跟著鬆一鬆。
  - id: g-evening-254
    text: 忙了一整天，現在換自己被照顧。
  - id: g-evening-255
    text: 泡杯熱茶，看窗外的光一點點退場。
  - id: g-evening-256
    text: 晚安前，先給自己一個深呼吸。
  - id: g-evening-257
    text: 今天的份量夠了，剩下的留給明天。
  - id: g-evening-258
    text: 點一盞小燈，房間就暖了起來。
  - id: g-evening-259
    text: 好好吃頓晚餐，是今天最溫柔的事。
  - id: g-evening-260
    text: 夜色慢慢落下，腳步也可以慢下來。
  - id: g-evening-261
    text: 把手機放遠一點，讓眼睛也休息。
  - id: g-evening-262
    text: 洗個熱水澡，把疲憊都沖掉。
  - id: g-evening-263
    text: 這一天辛苦了，現在輪到放鬆。
  - id: g-evening-264
