# 金句 — 好奇／驚奇。不說教。每一則獨一無二。
- id: q-wonder-001
  text: 對世界保持好奇，日子就不悶。
  tags: [wonder]
- id: q-wonder-002
  text: 多問一個為什麼，就多打開一扇窗。
  tags: [wonder]
- id: q-wonder-003
  text: 平凡裡，也藏著沒發現的驚喜。
  tags: [wonder]
- id: q-wonder-004
  text: 抬頭看看，天空每天都不一樣。
  tags: [wonder]
- id: q-wonder-005
  text: 好奇心，是最不會老的東西。
  tags: [wonder]
- id: q-wonder-006
  text: 願意驚訝，就還年輕。
  tags: [wonder]
- id: q-wonder-007
  text: 換個角度，熟悉的也變新鮮。
  tags: [wonder]
- id: q-wonder-008
  text: 不懂沒關係，那正是有趣的開始。
  tags: [wonder]
- id: q-wonder-009
  text: 世界很大，你才看了一角。
  tags: [wonder]
- id: q-wonder-010
  text: 保留一點童心，看什麼都有光。
  tags: [wonder]
- id: q-wonder-011
  text: 每個小發現，都值得停一下。
  tags: [wonder]
- id: q-wonder-012
  text: 好奇，會帶你去意想不到的地方。
  tags: [wonder]
- id: q-wonder-013
  text: 對細節多看一眼，就多懂一點。
  tags: [wonder]
- id: q-wonder-014
  text: 未知不可怕，它是還沒拆的禮物。
  tags: [wonder]
- id: q-wonder-015
  text: 願意學，就永遠有新的一天。
  tags: [wonder]
- id: q-wonder-016
  text: 讓自己被一件小事迷住。
  tags: [wonder]
- id: q-wonder-017
  text: 觀察，是免費的旅行。
  tags: [wonder]
- id: q-wonder-018
  text: 慢慢看，世界會回你很多。
  tags: [wonder]
- id: q-wonder-019
  text: 一顆好奇的心，走到哪都不無聊。
  tags: [wonder]
- id: q-wonder-020
  text: 試著問：如果換一種方式呢？
  tags: [wonder]
