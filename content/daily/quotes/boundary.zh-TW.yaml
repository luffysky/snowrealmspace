# 金句 — 界線／照顧自己。不情緒勒索、不說教。每一則獨一無二。
- id: q-boundary-001
  text: 說「不」也是一種照顧自己。
  tags: [boundary]
- id: q-boundary-002
  text: 你不必回應每一個要求。
  tags: [boundary]
- id: q-boundary-003
  text: 留一點時間給自己，不是自私。
  tags: [boundary]
- id: q-boundary-004
  text: 界線不是牆，是門，由你決定開多大。
  tags: [boundary]
- id: q-boundary-005
  text: 別人的急，不一定是你的急。
  tags: [boundary]
- id: q-boundary-006
  text: 你可以善良，也可以有底線。
  tags: [boundary]
- id: q-boundary-007
  text: 拒絕一件事，就是答應另一件。
  tags: [boundary]
- id: q-boundary-008
  text: 保護你的專注，像保護一件作品。
  tags: [boundary, focus]
- id: q-boundary-009
  text: 不解釋，也是一種回答。
  tags: [boundary]
- id: q-boundary-010
  text: 你的時間，值得被你自己尊重。
  tags: [boundary]
- id: q-boundary-011
  text: 不是每個訊息都要秒回。
  tags: [boundary]
- id: q-boundary-012
  text: 留白，是替重要的事騰位置。
  tags: [boundary]
- id: q-boundary-013
  text: 累了就休息，不需要誰的許可。
  tags: [boundary, rest]
- id: q-boundary-014
  text: 你可以只做你做得到的。
  tags: [boundary]
- id: q-boundary-015
  text: 界線清楚，關係反而更長久。
  tags: [boundary]
- id: q-boundary-016
  text: 先照顧好自己，才有餘力給別人。
  tags: [boundary]
- id: q-boundary-017
  text: 有些門，關上是為了看清裡面。
  tags: [boundary]
- id: q-boundary-018
  text: 你有權利改變主意。
  tags: [boundary]
- id: q-boundary-019
  text: 慢下來，不欠任何人一個交代。
  tags: [boundary]
- id: q-boundary-020
  text: 把「等一下」留給自己一次。
  tags: [boundary]
