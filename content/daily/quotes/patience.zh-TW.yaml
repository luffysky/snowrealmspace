# 金句 — 耐心／等待。不催促、不說教。每一則獨一無二。
- id: q-patience-001
  text: 有些事，急不來。
  tags: [patience]
- id: q-patience-002
  text: 種下去的，要給它時間。
  tags: [patience]
- id: q-patience-003
  text: 慢，不等於停。
  tags: [patience]
- id: q-patience-004
  text: 等待，也是過程的一部分。
  tags: [patience]
- id: q-patience-005
  text: 好東西，通常長得慢。
  tags: [patience]
- id: q-patience-006
  text: 你不需要今天就看到結果。
  tags: [patience]
- id: q-patience-007
  text: 耐心，是對自己溫柔的一種。
  tags: [patience]
- id: q-patience-008
  text: 一步一步，也是在前進。
  tags: [patience]
- id: q-patience-009
  text: 還沒開花，不代表沒在長。
  tags: [patience]
- id: q-patience-010
  text: 給事情一點發酵的時間。
  tags: [patience]
- id: q-patience-011
  text: 快的容易忘，慢的才留得住。
  tags: [patience]
- id: q-patience-012
  text: 允許自己還在半路上。
  tags: [patience]
- id: q-patience-013
  text: 有些答案，時間才說得出口。
  tags: [patience]
- id: q-patience-014
  text: 不必和別人比誰快。
  tags: [patience]
- id: q-patience-015
  text: 熬得住的，最後都熬成了自己。
  tags: [patience]
- id: q-patience-016
  text: 等一朵雲慢慢飄過，也是本事。
  tags: [patience]
- id: q-patience-017
  text: 你已經走了很遠，別急著到。
  tags: [patience]
- id: q-patience-018
  text: 讓時間替你把事情想清楚。
  tags: [patience]
- id: q-patience-019
  text: 沉住氣，你有的是時間。
  tags: [patience]
- id: q-patience-020
  text: 現在還看不到的，不是不存在。
  tags: [patience]
