# 金句 — 獨處／安靜。溫和、不說教、不情緒勒索。每一則獨一無二。
- id: q-solitude-001
  text: 一個人待著，不等於孤單。
  tags: [solitude]
- id: q-solitude-002
  text: 安靜是留給自己的空間，不是缺席。
  tags: [solitude]
- id: q-solitude-003
  text: 有些話，只有在安靜裡才聽得見。
  tags: [solitude]
- id: q-solitude-004
  text: 獨處，是把注意力還給自己。
  tags: [solitude]
- id: q-solitude-005
  text: 不必一直被看見，也可以好好存在。
  tags: [solitude, visibility]
- id: q-solitude-006
  text: 一個人的時候，你才聽得到自己。
  tags: [solitude]
- id: q-solitude-007
  text: 安靜不是空的，是還沒被打擾的滿。
  tags: [solitude]
- id: q-solitude-008
  text: 學會跟自己相處，是很長的功課。
  tags: [solitude]
- id: q-solitude-009
  text: 獨處久了，你會分得清想要和需要。
  tags: [solitude]
- id: q-solitude-010
  text: 沒有人看的時候，你還是你。
  tags: [solitude]
- id: q-solitude-011
  text: 有時候最好的陪伴，是一段安靜。
  tags: [solitude]
- id: q-solitude-012
  text: 把手機放下，世界不會塌。
  tags: [solitude, rest]
- id: q-solitude-013
  text: 獨處不是逃避，是回到中心。
  tags: [solitude]
- id: q-solitude-014
  text: 一個人吃飯，也可以吃得很好。
  tags: [solitude]
- id: q-solitude-015
  text: 安靜裡，想法才長得出來。
  tags: [solitude]
- id: q-solitude-016
  text: 你不需要一直填滿每一刻。
  tags: [solitude, rest]
- id: q-solitude-017
  text: 獨處教你，寂寞和自由只隔一線。
  tags: [solitude]
- id: q-solitude-018
  text: 給自己一點無聊，靈感常從那裡來。
  tags: [solitude, inspiration]
- id: q-solitude-019
  text: 不回訊息的那段時間，是你的。
  tags: [solitude]
- id: q-solitude-020
  text: 一個人，也是一種完整。
  tags: [solitude]
