# 金句 — 善待自己。不說教、不空泛。每一則獨一無二。
- id: q-selfkind-001
  text: 對自己好一點，不是自私。
  tags: [selfkind]
- id: q-selfkind-002
  text: 你也需要，被自己溫柔對待。
  tags: [selfkind]
- id: q-selfkind-003
  text: 累了就休息，不必找理由。
  tags: [selfkind]
- id: q-selfkind-004
  text: 把對別人的體貼，也留一份給自己。
  tags: [selfkind]
- id: q-selfkind-005
  text: 你不是機器，會累是正常的。
  tags: [selfkind]
- id: q-selfkind-006
  text: 允許自己，偶爾什麼都不做。
  tags: [selfkind]
- id: q-selfkind-007
  text: 別用最嚴的標準，只對自己。
  tags: [selfkind]
- id: q-selfkind-008
  text: 你值得被好好照顧，包括被你自己。
  tags: [selfkind]
- id: q-selfkind-009
  text: 犯錯了，先別急著罵自己。
  tags: [selfkind]
- id: q-selfkind-010
  text: 給自己一點餘地，天不會塌。
  tags: [selfkind]
- id: q-selfkind-011
  text: 照顧好自己，才有力氣照顧別人。
  tags: [selfkind]
- id: q-selfkind-012
  text: 你的感受，也值得被聽見。
  tags: [selfkind]
- id: q-selfkind-013
  text: 不必時時堅強，脆弱也可以。
  tags: [selfkind]
- id: q-selfkind-014
  text: 對自己說一句，你已經盡力了。
  tags: [selfkind]
- id: q-selfkind-015
  text: 善待自己，從好好吃飯開始。
  tags: [selfkind]
- id: q-selfkind-016
  text: 不夠完美，也完全值得被愛。
  tags: [selfkind]
- id: q-selfkind-017
  text: 累的時候，靠一下沒關係。
  tags: [selfkind]
- id: q-selfkind-018
  text: 把自己當朋友那樣對待。
  tags: [selfkind]
- id: q-selfkind-019
  text: 你的好，不必等別人肯定。
  tags: [selfkind]
- id: q-selfkind-020
  text: 先問問自己：現在還好嗎？
  tags: [selfkind]
