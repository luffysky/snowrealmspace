# 金句 — 放下／不強求。不說教。每一則獨一無二。
- id: q-letgo-001
  text: 有些事，鬆手才會好。
  tags: [letgo]
- id: q-letgo-002
  text: 不是每件事，都需要一個答案。
  tags: [letgo]
- id: q-letgo-003
  text: 抓太緊，反而握不住。
  tags: [letgo]
- id: q-letgo-004
  text: 放下，不是放棄，是給自己空間。
  tags: [letgo]
- id: q-letgo-005
  text: 有些人的離開，是替你騰位子。
  tags: [letgo]
- id: q-letgo-006
  text: 不必替所有人的情緒負責。
  tags: [letgo]
- id: q-letgo-007
  text: 過不去的，先繞過去也行。
  tags: [letgo]
- id: q-letgo-008
  text: 你可以難過，但不必永遠停在那。
  tags: [letgo]
- id: q-letgo-009
  text: 有些遺憾，帶著走也沒關係。
  tags: [letgo]
- id: q-letgo-010
  text: 不是你的錯的事，別自己扛。
  tags: [letgo]
- id: q-letgo-011
  text: 學會說「就這樣吧」，也是成長。
  tags: [letgo]
- id: q-letgo-012
  text: 放過別人，也是放過自己。
  tags: [letgo]
- id: q-letgo-013
  text: 不是所有問題，都輪得到你解。
  tags: [letgo]
- id: q-letgo-014
  text: 有些答案，不知道也能過得好。
  tags: [letgo]
- id: q-letgo-015
  text: 該結束的，讓它好好結束。
  tags: [letgo]
- id: q-letgo-016
  text: 你不必贏過每一次爭執。
  tags: [letgo]
- id: q-letgo-017
  text: 收拾好，就往下一頁翻。
  tags: [letgo]
- id: q-letgo-018
  text: 有些重量，是自己加上去的。
  tags: [letgo]
- id: q-letgo-019
  text: 允許事情，不那麼完美地收場。
  tags: [letgo]
- id: q-letgo-020
  text: 鬆一口氣，天不會塌。
  tags: [letgo]
