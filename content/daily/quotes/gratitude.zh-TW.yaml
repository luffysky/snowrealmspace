# 金句 — 感謝／珍惜。不說教。每一則獨一無二。
- id: q-grat-001
  text: 有些幸運，是安靜地發生的。
  tags: [gratitude]
- id: q-grat-002
  text: 平凡的一天，也值得被記得。
  tags: [gratitude]
- id: q-grat-003
  text: 謝謝今天願意醒來的自己。
  tags: [gratitude]
- id: q-grat-004
  text: 擁有的，比想像中多。
  tags: [gratitude]
- id: q-grat-005
  text: 一杯熱水，也能是小小的幸福。
  tags: [gratitude]
- id: q-grat-006
  text: 記得的人，其實一直都在。
  tags: [gratitude]
- id: q-grat-007
  text: 有人在，就已經很好。
  tags: [gratitude]
- id: q-grat-008
  text: 好好活著，本身就不容易。
  tags: [gratitude]
- id: q-grat-009
  text: 今天能休息，是件值得謝的事。
  tags: [gratitude]
- id: q-grat-010
  text: 收下這份安穩，不必愧疚。
  tags: [gratitude]
- id: q-grat-011
  text: 被在乎的感覺，值得慢慢品。
  tags: [gratitude]
- id: q-grat-012
  text: 陽光沒跟你收錢，記得抬頭看。
  tags: [gratitude]
- id: q-grat-013
  text: 能選擇，就是一種富有。
  tags: [gratitude]
- id: q-grat-014
  text: 謝謝那些默默撐住你的小事。
  tags: [gratitude]
- id: q-grat-015
  text: 今天遇到的溫柔，別忘了收藏。
  tags: [gratitude]
- id: q-grat-016
  text: 你身邊的日常，是別人的嚮往。
  tags: [gratitude]
- id: q-grat-017
  text: 一頓好好吃的飯，就是幸福。
  tags: [gratitude]
- id: q-grat-018
  text: 平安兩個字，最難得。
  tags: [gratitude]
- id: q-grat-019
  text: 記得謝謝走到這裡的自己。
  tags: [gratitude]
- id: q-grat-020
  text: 微小的好，加起來就是滿。
  tags: [gratitude]
