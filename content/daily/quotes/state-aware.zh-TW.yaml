# 金句 — 依使用者近況顯示（requiresTag 硬限定，只有該狀態才會看到）。
# st_returning 久違回歸 / st_streak 連續造訪 / st_creating 創作中 / st_decorating 佈置中 / st_nightowl 夜貓。
# 不催促、不愧疚、不空泛。每一則獨一無二。

# ── 久違回歸 ─────────────────────────
- id: q-st-return-01
  text: 好久不見，這裡一直為你留著。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-02
  text: 回來就好，不用解釋去了哪。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-03
  text: 離開多久都沒關係，位子還在。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-04
  text: 你回來的今天，就是好日子。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-05
  text: 中斷不是失敗，回來就是繼續。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-06
  text: 想起這裡就回來，不必等準備好。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-07
  text: 空白的那段，也是你的一部分。
  tags: [comeback]
  requiresTag: st_returning
- id: q-st-return-08
  text: 慢慢接上就好，這裡不趕。
  tags: [comeback]
  requiresTag: st_returning

# ── 連續造訪 ─────────────────────────
- id: q-st-streak-01
  text: 你已經連著來好幾天了。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-02
  text: 一天一天，你把這裡走成了習慣。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-03
  text: 不用刻意，你自然就回來了。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-04
  text: 這份持續，比你想的珍貴。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-05
  text: 每天一點點，累積成了現在。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-06
  text: 你來的節奏，剛剛好。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-07
  text: 連續，是你和這裡的默契。
  tags: [streak]
  requiresTag: st_streak
- id: q-st-streak-08
  text: 願意每天回來，本身就難得。
  tags: [streak]
  requiresTag: st_streak

# ── 創作中 ───────────────────────────
- id: q-st-create-01
  text: 你正在做的東西，值得慢慢來。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-02
  text: 手還熱著，就順著做下去。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-03
  text: 半成品，也是成果的一種。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-04
  text: 你今天留下的，明天會謝謝你。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-05
  text: 卡住時，離開一下也沒關係。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-06
  text: 做出來，比做得完美先一步。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-07
  text: 你正把想法變成看得見的東西。
  tags: [making]
  requiresTag: st_creating
- id: q-st-create-08
  text: 每一筆，都算數。
  tags: [making]
  requiresTag: st_creating

# ── 佈置中 ───────────────────────────
- id: q-st-decor-01
  text: 佈置成你喜歡的樣子，就對了。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-02
  text: 這裡長什麼樣，你說了算。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-03
  text: 慢慢調，直到看了會安心。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-04
  text: 換個顏色，也是換個心情。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-05
  text: 你的品味，正在這裡長出來。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-06
  text: 不必一次到位，慢慢變好看。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-07
  text: 這是你的地方，怎麼舒服怎麼來。
  tags: [nesting]
  requiresTag: st_decorating
- id: q-st-decor-08
  text: 佈置的過程，本身就是享受。
  tags: [nesting]
  requiresTag: st_decorating

# ── 夜貓 ─────────────────────────────
- id: q-st-night-01
  text: 夜深了，你還在，這裡陪你。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-02
  text: 深夜的安靜，也適合待著。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-03
  text: 晚一點沒關係，別對自己太嚴。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-04
  text: 夜裡的你，也值得被好好對待。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-05
  text: 這個時間還醒著，記得對自己溫柔。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-06
  text: 夜色裡，慢慢做你想做的。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-07
  text: 睡不著也沒關係，這裡不趕你。
  tags: [latenight]
  requiresTag: st_nightowl
- id: q-st-night-08
  text: 深夜的靈感，也是靈感。
  tags: [latenight]
  requiresTag: st_nightowl
