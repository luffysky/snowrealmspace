# 金句 — 開始／起點。不逼迫。每一則獨一無二。
- id: q-begin-001
  text: 起點不必完美，只要出發。
  tags: [beginning]
- id: q-begin-002
  text: 現在，就是最好的開始時機。
  tags: [beginning]
- id: q-begin-003
  text: 第一步小一點，沒關係。
  tags: [beginning]
- id: q-begin-004
  text: 想做，就先做五分鐘看看。
  tags: [beginning]
- id: q-begin-005
  text: 每個高手，都有笨拙的開頭。
  tags: [beginning]
- id: q-begin-006
  text: 開始了，就成功了一半。
  tags: [beginning]
- id: q-begin-007
  text: 不必等準備好，邊做邊學。
  tags: [beginning]
- id: q-begin-008
  text: 新的一頁，由你落第一筆。
  tags: [beginning]
- id: q-begin-009
  text: 從你站的地方，就能出發。
  tags: [beginning]
- id: q-begin-010
  text: 晚一點開始，好過永遠不開始。
  tags: [beginning]
- id: q-begin-011
  text: 任何時候，都能重新起步。
  tags: [beginning]
- id: q-begin-012
  text: 種樹最好的時間，是現在。
  tags: [beginning]
- id: q-begin-013
  text: 別小看一個小小的開端。
  tags: [beginning]
- id: q-begin-014
  text: 先動，再修，別先想到完美。
  tags: [beginning]
- id: q-begin-015
  text: 一個念頭，就能翻開新的一章。
  tags: [beginning]
- id: q-begin-016
  text: 起步慢，也還是起步了。
  tags: [beginning]
- id: q-begin-017
  text: 今天做一點，明天就不從零。
  tags: [beginning]
- id: q-begin-018
  text: 開頭最難，過了就順了。
  tags: [beginning]
- id: q-begin-019
  text: 給自己一個開始的理由，就夠。
  tags: [beginning]
- id: q-begin-020
  text: 每個此刻，都能是新的起點。
  tags: [beginning]
