# 金句 — 安靜／靜。不說教。每一則獨一無二。
- id: q-quiet-001
  text: 安靜下來，才聽得見自己。
  tags: [quiet]
- id: q-quiet-002
  text: 不必時時發聲，靜著也有力量。
  tags: [quiet]
- id: q-quiet-003
  text: 留一點空白給心。
  tags: [quiet]
- id: q-quiet-004
  text: 靜，不是無聊，是充電。
  tags: [quiet]
- id: q-quiet-005
  text: 世界很吵，你可以小聲一點。
  tags: [quiet]
- id: q-quiet-006
  text: 獨處的安靜，也很豐富。
  tags: [quiet]
- id: q-quiet-007
  text: 讓腦袋放空一會兒，沒關係。
  tags: [quiet]
- id: q-quiet-008
  text: 安靜的人，心裡常有海。
  tags: [quiet]
- id: q-quiet-009
  text: 少說一點，多感受一點。
  tags: [quiet]
- id: q-quiet-010
  text: 不回應，也是一種回應。
  tags: [quiet]
- id: q-quiet-011
  text: 靜靜待著，也是照顧自己。
  tags: [quiet]
- id: q-quiet-012
  text: 有些話，放在心裡就好。
  tags: [quiet]
- id: q-quiet-013
  text: 慢下來的安靜，最養人。
  tags: [quiet]
- id: q-quiet-014
  text: 關掉聲音，聽聽呼吸。
  tags: [quiet]
- id: q-quiet-015
  text: 安靜的時光，其實很奢侈。
  tags: [quiet]
- id: q-quiet-016
  text: 給自己一段不被打擾的時間。
  tags: [quiet]
- id: q-quiet-017
  text: 沉默裡，藏著很多想法。
  tags: [quiet]
- id: q-quiet-018
  text: 靜一靜，事情常會清楚一點。
  tags: [quiet]
- id: q-quiet-019
  text: 不必填滿每一刻。
  tags: [quiet]
- id: q-quiet-020
  text: 安靜，是給心的一個位子。
  tags: [quiet]
