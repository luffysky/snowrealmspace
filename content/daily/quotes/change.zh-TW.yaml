# 金句 — 改變／轉變。不逼迫。每一則獨一無二。
- id: q-change-001
  text: 改變，常從一件小事開始。
  tags: [change]
- id: q-change-002
  text: 你不必變成別人，只要更靠近自己。
  tags: [change]
- id: q-change-003
  text: 慢慢變，也是變。
  tags: [change]
- id: q-change-004
  text: 願意調整，就已經在往前。
  tags: [change]
- id: q-change-005
  text: 舊的鬆手，新的才進得來。
  tags: [change]
- id: q-change-006
  text: 每一次選擇，都在重塑你。
  tags: [change]
- id: q-change-007
  text: 不習慣，是改變正在發生的證據。
  tags: [change]
- id: q-change-008
  text: 你可以隨時，決定不一樣。
  tags: [change]
- id: q-change-009
  text: 轉個彎，不是走回頭。
  tags: [change]
- id: q-change-010
  text: 改變不必轟轟烈烈，細水也長流。
  tags: [change]
- id: q-change-011
  text: 今天的你，可以和昨天不同。
  tags: [change]
- id: q-change-012
  text: 微調久了，就是全新的方向。
  tags: [change]
- id: q-change-013
  text: 卡住，有時只是要你換條路。
  tags: [change]
- id: q-change-014
  text: 成長，是不斷跟舊的自己道別。
  tags: [change]
- id: q-change-015
  text: 你正在變成想成為的人。
  tags: [change]
- id: q-change-016
  text: 一個新習慣，勝過一百個決心。
  tags: [change]
- id: q-change-017
  text: 環境變了，你也可以跟著長。
  tags: [change]
- id: q-change-018
  text: 別怕重來，重來也是一種力氣。
  tags: [change]
- id: q-change-019
  text: 改變的痛，通常比不改變的痛短。
  tags: [change]
- id: q-change-020
  text: 你有權，過得跟以前不一樣。
  tags: [change]
