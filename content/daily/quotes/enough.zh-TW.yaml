# 金句 — 知足／夠了。不說教。每一則獨一無二。
- id: q-enough-001
  text: 你已經擁有的，其實不少。
  tags: [enough]
- id: q-enough-002
  text: 夠用，就是一種富足。
  tags: [enough]
- id: q-enough-003
  text: 不必更多，這樣就很好。
  tags: [enough]
- id: q-enough-004
  text: 慢下來，才看得見手裡的。
  tags: [enough]
- id: q-enough-005
  text: 追不完的，就先停一停。
  tags: [enough]
- id: q-enough-006
  text: 剛剛好，也是一種好。
  tags: [enough]
- id: q-enough-007
  text: 比較的心一放下，日子就寬了。
  tags: [enough]
- id: q-enough-008
  text: 今天平安，就值得知足。
  tags: [enough]
- id: q-enough-009
  text: 少一點想要，多一點享受。
  tags: [enough]
- id: q-enough-010
  text: 你不缺什麼，只是忘了看。
  tags: [enough]
- id: q-enough-011
  text: 簡單的日子，最耐過。
  tags: [enough]
- id: q-enough-012
  text: 擁有得剛好，煩惱就少。
  tags: [enough]
- id: q-enough-013
  text: 知足的人，走到哪都富有。
  tags: [enough]
- id: q-enough-014
  text: 別讓「還想要」蓋過「已擁有」。
  tags: [enough]
- id: q-enough-015
  text: 現在這樣，也很足夠。
  tags: [enough]
- id: q-enough-016
  text: 幸福，常常藏在夠用裡。
  tags: [enough]
- id: q-enough-017
  text: 停下來數一數，你有的東西。
  tags: [enough]
- id: q-enough-018
  text: 不追多，只求剛好安穩。
  tags: [enough]
- id: q-enough-019
  text: 平淡，是一種難得的圓滿。
  tags: [enough]
- id: q-enough-020
  text: 懂得夠了，就少了很多累。
  tags: [enough]
