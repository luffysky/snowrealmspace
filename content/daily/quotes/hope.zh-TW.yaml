# 金句 — 希望／微光。不空喊、不逼迫。每一則獨一無二。
- id: q-hope-001
  text: 天再黑，也擋不住早晨。
  tags: [hope]
- id: q-hope-002
  text: 只要還在走，路就還在。
  tags: [hope]
- id: q-hope-003
  text: 現在的難，不是永遠的難。
  tags: [hope]
- id: q-hope-004
  text: 一點點光，也能照亮下一步。
  tags: [hope]
- id: q-hope-005
  text: 事情會變的，往往在你撐過之後。
  tags: [hope]
- id: q-hope-006
  text: 冬天再長，春天也沒缺席過。
  tags: [hope]
- id: q-hope-007
  text: 你走過的低谷，都在替你墊高。
  tags: [hope]
- id: q-hope-008
  text: 微弱的火，也是火。
  tags: [hope]
- id: q-hope-009
  text: 明天還沒來，什麼都還有可能。
  tags: [hope]
- id: q-hope-010
  text: 撐住這一段，風景會不一樣。
  tags: [hope]
- id: q-hope-011
  text: 種子在土裡的時候，也看不見光。
  tags: [hope]
- id: q-hope-012
  text: 好轉常常是悄悄開始的。
  tags: [hope]
- id: q-hope-013
  text: 你比昨天，又多撐了一天。
  tags: [hope]
- id: q-hope-014
  text: 烏雲會走，天空一直都在。
  tags: [hope]
- id: q-hope-015
  text: 難熬的日子，也會變成過去式。
  tags: [hope]
- id: q-hope-016
  text: 只要願意，隨時都能重新開始。
  tags: [hope]
- id: q-hope-017
  text: 前面的路，會比你想的寬。
  tags: [hope]
- id: q-hope-018
  text: 熬過夜的人，最懂天亮。
  tags: [hope]
- id: q-hope-019
  text: 現在看不到出口，不代表沒有。
  tags: [hope]
- id: q-hope-020
  text: 你值得一個更好的明天。
  tags: [hope]
