# 金句 — 簡單／簡樸。不說教。每一則獨一無二。
- id: q-simple-001
  text: 把複雜的，過成簡單的。
  tags: [simplicity]
- id: q-simple-002
  text: 少一點，往往好一點。
  tags: [simplicity]
- id: q-simple-003
  text: 簡單，不是空，是剛好。
  tags: [simplicity]
- id: q-simple-004
  text: 留下重要的，其他放手。
  tags: [simplicity]
- id: q-simple-005
  text: 東西少了，心就清了。
  tags: [simplicity]
- id: q-simple-006
  text: 一次做一件，就不亂了。
  tags: [simplicity]
- id: q-simple-007
  text: 把生活過薄一點，才嚐得出味。
  tags: [simplicity]
- id: q-simple-008
  text: 不必樣樣都要，選你真心的。
  tags: [simplicity]
- id: q-simple-009
  text: 簡單的快樂，最不容易壞。
  tags: [simplicity]
- id: q-simple-010
  text: 清空一點，才裝得下新的。
  tags: [simplicity]
- id: q-simple-011
  text: 越簡單的東西，越耐看。
  tags: [simplicity]
- id: q-simple-012
  text: 把力氣，花在真正在乎的。
  tags: [simplicity]
- id: q-simple-013
  text: 減法，有時比加法更難也更好。
  tags: [simplicity]
- id: q-simple-014
  text: 樸素裡，藏著長久。
  tags: [simplicity]
- id: q-simple-015
  text: 不追花俏，日子反而穩。
  tags: [simplicity]
- id: q-simple-016
  text: 把選擇變少，把自由變多。
  tags: [simplicity]
- id: q-simple-017
  text: 需要的不多，想要的才多。
  tags: [simplicity]
- id: q-simple-018
  text: 簡單過，也能過得很滿。
  tags: [simplicity]
- id: q-simple-019
  text: 把心事整理得像房間一樣清爽。
  tags: [simplicity]
- id: q-simple-020
  text: 化繁為簡，是一種本事。
  tags: [simplicity]
