<!doctype html>
<html lang="zh-Hant-TW">
  <body style="margin:0;padding:0;background:#fff7fb;font-family:'Noto Sans TC',system-ui,-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#38252d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff7fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fffdfe;border:1px solid rgba(140,88,112,0.18);border-radius:20px;overflow:hidden;">
            <tr>
              <td style="background:linear-gradient(135deg,#f3a7c3,#8c5870);height:8px;line-height:8px;font-size:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:32px 32px 8px;">
                <h1 style="margin:0 0 4px;font-size:22px;color:#38252d;">登入 SnowRealm Space</h1>
                <p style="margin:0;color:#725461;font-size:14px;">你的私人數位空間，正等著你回來。</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:block;text-align:center;background:#f3a7c3;color:#38252d;text-decoration:none;font-weight:600;padding:14px 20px;border-radius:999px;font-size:16px;">
                  點這裡登入
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 4px;">
                <p style="margin:0;color:#725461;font-size:14px;">或在登入頁輸入這組 6 位數代碼（換裝置也能用）：</p>
              </td>
            </tr>
            <tr>
              <td style="padding:4px 32px 24px;" align="center">
                <div style="display:inline-block;background:#fff7fb;border:1px solid rgba(140,88,112,0.18);border-radius:12px;padding:12px 20px;font-size:28px;letter-spacing:8px;font-weight:700;color:#8c5870;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;">
                <p style="margin:0;color:#a08a94;font-size:12px;line-height:1.7;">
                  這封信 1 小時內有效。如果不是你本人要登入，直接忽略即可，帳號不會有任何變化。
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#a08a94;font-size:12px;">SnowRealm Space</p>
        </td>
      </tr>
    </table>
  </body>
</html>
